  cursor:pointer;color:var(--ink-2);transition:background .12s,border-color .12s}
.fchip:hover{border-color:var(--brand)}
.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.fchip .cnt{opacity:.75;font-size:.78em;margin-inline-start:4px}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-bottom:16px}
.subj-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;
  transition:border-color .12s, box-shadow .12s}
.subj-cell:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.subj-cell.on{border-color:var(--brand);outline:2px solid var(--brand-lt)}
.subj-cell .sk{font-size:.85rem;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.subj-cell .sk .num{color:var(--ink-2);font-weight:600;font-size:.8rem}
.subj-cell .bar{margin-top:7px}
.bq-card{margin-bottom:14px}
.bq-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bq-head .exlbl{font-weight:800;color:var(--brand-dk);font-size:.86rem;background:var(--brand-pale);
  border:1px solid var(--brand-lt);border-radius:7px;padding:2px 9px}
.bq-ctx{margin:8px 0;border:1px dashed var(--line);border-radius:9px;padding:9px 13px;background:#fcfcfe}
.bq-ctx>summary{cursor:pointer;font-weight:700;color:var(--ink-2);font-size:.87rem}
.bq-ctx[open]>summary{margin-bottom:7px}

/* ===== דריל שפות (drill) ===== */
.drill-wrap{max-width:760px;margin:0 auto}
.drill-lang{direction:ltr;text-align:center;font-size:clamp(1.05rem,2.6vw,1.45rem);padding:26px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin:14px 0;min-height:110px;display:grid;place-items:center;unicode-bidi:isolate;overflow-x:auto}
.drill-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.dbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:15px 10px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:border-color .12s, background .12s;min-height:58px}
.dbtn:hover{border-color:var(--brand)}
.dbtn.hit{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dbtn.miss{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.dbtn.dim{opacity:.45}
.dbtn:disabled{cursor:default}
.drill-fb{text-align:center;min-height:34px;font-weight:700}
.drill-fb .src{font-weight:600;color:var(--ink-2);font-size:.85rem}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--brand-dk)}
@media(max-width:560px){ .drill-btns{grid-template-columns:1fr} .dbtn{min-height:48px} }

/* ===== מצב ערבוב (shuffle) ===== */
.shuf-wrap{max-width:860px;margin:0 auto}
.shuf-prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shuf-acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.shuf-acts .btn{min-width:120px}

<script type="application/json" id="d-summaries">[{"sid":"ch1","group":"פרקים","title":"פרק 1 — מבוא: מילים, שפות ו־DFA","topics":["מה זה מודל חישובי ומה נלמד בקורס","אלף־בית, מילים ופעולות על מילים","שפות ופעולות על שפות"],"html":"<h1>מבוא: מילים, שפות ו־DFA<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 1 (הרצאה 1 + תרגול 1)<\/p>\n\n<section>\n  <h2 id=\"ch1-t0\">מה זה מודל חישובי ומה נלמד בקורס<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">מודל חישובי<\/span> — הגדרה מתמטית מדויקת של \"מכונה\" שמבצעת חישוב.\n    במקום לדבר על מחשב פיזי, מגדירים אובייקט פורמלי (קבוצות ופונקציות) ושואלים:\n    <b>אילו בעיות המודל הזה מסוגל לפתור, ואילו לא?<\/b>\n  <\/div>\n\n  <p>הקורס בנוי כסולם של מודלים, מהחלש אל החזק:<\/p>\n  <div class=\"hier\">\n    <div class=\"ring\"><span class=\"hlbl\">מכונות טיורינג — R, RE<\/span>\n      <div class=\"ring\"><span class=\"hlbl\">אוטומטי מחסנית — שפות חסרות הקשר (CFL)<\/span>\n        <div class=\"ring\"><span class=\"hlbl\">אוטומטים סופיים — שפות רגולריות<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <ul>\n    <li><b>שפות רגולריות<\/b> — מה שאפשר לזהות עם זיכרון סופי קבוע: <span class=\"en\">DFA<\/span>‏, <span class=\"en\">NFA<\/span>‏, ביטויים רגולריים, מינימיזציה, ולמת הניפוח שמוכיחה מתי שפה <em>איננה<\/em> רגולרית.<\/li>\n    <li><b>שפות חסרות הקשר<\/b> — מה שאפשר לזהות עם מחסנית: דקדוקים (<span class=\"en\">CFG<\/span>‏), אוטומטי מחסנית (<span class=\"en\">PDA<\/span>‏), ולמת ניפוח משלהן.<\/li>\n    <li><b>חישוביות<\/b> — מכונות טיורינג, ההבדל בין <b>כריע<\/b> (<span class=\"en\">R<\/span>‏) ל<b>ניתן לזיהוי<\/b> (<span class=\"en\">RE<\/span>‏), רדוקציות, ומשפט רייס — הגבול העקרוני של מה שמחשב יכול להכריע.<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>נקודת מבט שחוזרת בכל המבחן:<\/b> כל נושא בקורס עונה על אחת משתי שאלות —\n    <b>איך בונים<\/b> מזהה לשפה (בנייה\/המרה), או <b>איך מוכיחים שאי־אפשר<\/b>\n    (למות ניפוח, רדוקציות, משפט רייס). כמעט כל סעיף במבחן הוא אחת מהשתיים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t1\">אלף־בית, מילים ופעולות על מילים<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">אלף־בית (Σ)<\/span> — קבוצה סופית ולא ריקה של סימנים. למשל\n    <span class=\"math\">Σ = {a, b}<\/span> או <span class=\"math\">Σ = {0, 1}<\/span>.<br>\n    <span class=\"term\">מילה (word\/string)<\/span> — סדרה סופית של סימנים מ־<span class=\"math\">Σ<\/span>.\n    <span class=\"term\">המילה הריקה<\/span> מסומנת <span class=\"math\">ε<\/span> ואורכה\n    <span class=\"math\">|ε| = 0<\/span>.<br>\n    <span class=\"term\">Σ<sup>*<\/sup><\/span> — קבוצת <em>כל<\/em> המילים הסופיות מעל\n    <span class=\"math\">Σ<\/span>, כולל <span class=\"math\">ε<\/span>;\n    <span class=\"math\">Σ<sup>+<\/sup> = Σ<sup>*<\/sup> ∖ {ε}<\/span>.\n  <\/div>\n\n  <p>פעולות בסיסיות על מילים:<\/p>\n  <ul>\n    <li><b>שרשור<\/b> — <span class=\"math\">u·v<\/span> (או פשוט <span class=\"math\">uv<\/span>): כותבים את <span class=\"math\">v<\/span> אחרי <span class=\"math\">u<\/span>. מתקיים <span class=\"math\">|uv| = |u| + |v|<\/span>, ו־<span class=\"math\">ε<\/span> הוא איבר היחידה: <span class=\"math\">εw = wε = w<\/span>.<\/li>\n    <li><b>חזקה<\/b> — <span class=\"math\">w<sup>k<\/sup><\/span>: שרשור של <span class=\"math\">w<\/span> עם עצמה <span class=\"math\">k<\/span> פעמים; <span class=\"math\">w<sup>0<\/sup> = ε<\/span>.<\/li>\n    <li><b>היפוך<\/b> — <span class=\"math\">w<sup>R<\/sup><\/span>: המילה בסדר הפוך. מילה עם <span class=\"math\">w = w<sup>R<\/sup><\/span> נקראת <b>פלינדרום<\/b>.<\/li>\n    <li><b>מספרי מופעים<\/b> — <span class=\"math\">#<sub>a<\/sub>(w)<\/span>: כמה פעמים האות <span class=\"math\">a<\/span> מופיעה ב־<span class=\"math\">w<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה<\/h4>\n    <p>עבור <span class=\"math\">u = ab<\/span>, <span class=\"math\">v = ba<\/span>‏:\n      <span class=\"math\">uv = abba<\/span>,&nbsp;\n      <span class=\"math\">(uv)<sup>R<\/sup> = abba<\/span> (פלינדרום!),&nbsp;\n      <span class=\"math\">u<sup>2<\/sup> = abab<\/span>,&nbsp;\n      <span class=\"math\">#<sub>a<\/sub>(uv) = 2<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"warn\">אל תבלבלו בין <span class=\"math\">ε<\/span> (מילה ריקה, אורך 0) לבין\n    <span class=\"math\">∅<\/span> (שפה ריקה — קבוצה בלי אף מילה). מתקיים\n    <span class=\"math\">{ε} ≠ ∅<\/span>: השפה <span class=\"math\">{ε}<\/span> מכילה מילה אחת.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t2\">שפות ופעולות על שפות<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">שפה (Language)<\/span> — תת־קבוצה כלשהי\n    <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span>. שפה יכולה להיות סופית, אינסופית, ריקה\n    (<span class=\"math\">∅<\/span>) או כל <span class=\"math\">Σ<sup>*<\/sup><\/span> כולה.\n  <\/div>\n\n  <p>שפות מוגדרות בדרך כלל בכתיב בונה־קבוצות. למשל:<\/p>\n  <div class=\"lang-def\">L₁ = {w ∈ {a,b}<sup>*<\/sup> | #<sub>a<\/sub>(w) = #<sub>b<\/sub>(w)}<\/div>\n\n  <p>פעולות על שפות (שפות הן קבוצות — כל פעולות הקבוצות עובדות, ועוד שתיים מיוחדות):<\/p>\n  <ul>\n    <li><b>איחוד \/ חיתוך \/ משלים<\/b> — <span class=\"math\">L<sub>1<\/sub> ∪ L<sub>2<\/sub><\/span>,\n      <span class=\"math\">L<sub>1<\/sub> ∩ L<sub>2<\/sub><\/span>,\n      <span class=\"math\"><span class=\"comp\">L<\/span> = Σ<sup>*<\/sup> ∖ L<\/span>.<\/li>\n    <li><b>שרשור שפות<\/b> — <span class=\"math\">L<sub>1<\/sub>·L<sub>2<\/sub> = {uv | u ∈ L<sub>1<\/sub>, v ∈ L<sub>2<\/sub>}<\/span>.<\/li>\n    <li><b>חזקה<\/b> — <span class=\"math\">L<sup>k<\/sup><\/span>: שרשור השפה עם עצמה <span class=\"math\">k<\/span> פעמים; <span class=\"math\">L<sup>0<\/sup> = {ε}<\/span>.<\/li>\n    <li><b>כוכב (סגור קלין)<\/b> — <span class=\"math\">L<sup>*<\/sup> = ⋃<sub>k≥0<\/sub> L<sup>k<\/sup><\/span>: כל שרשור סופי (גם ריק) של מילים מהשפה.<\/li>\n    <li><b>היפוך<\/b> — <span class=\"math\">L<sup>R<\/sup> = {w<sup>R<\/sup> | w ∈ L}<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה — כוכב של שפה קטנה<\/h4>\n    <p><span class=\"math\">L = {ab, ba}<\/span>‏:&nbsp;\n      <span class=\"math\">L<sup>*<\/sup><\/span> מכילה את\n      <span class=\"math\">ε, ab, ba, abab, abba, baab, baba, …<\/span>&nbsp;\n      אבל <em>לא<\/em> את <span class=\"math\">a<\/span> או <span class=\"math\">aab<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"note\"><b>שימו לב:<\/b> <span class=\"math\">∅<sup>*<\/sup> = {ε}<\/span> —\n    השרשור הריק תמיד קיים. זו נקודה שחוזרת בהמרות של ביטויים רגולריים\n    (<span class=\"en\">GNFA<\/span>‏) ובשאלות \"נכון\/לא נכון\".<\/div>\n<\/section>\n"}]</script>
<script type="application/json" id="d-quiz">[{"sid":"ch1","topics":[{"t":"מה זה מודל חישובי ומה נלמד בקורס","q":[{"q":"מהו סדר ההכלה הנכון בין מחלקות השפות שנלמדות בקורס?","c":["כל המחלקות שוות — ההבדל הוא רק בדרך ההגדרה","שפות רגולריות ⊂ שפות חסרות הקשר ⊂ שפות כריעות","שפות חסרות הקשר ⊂ שפות רגולריות ⊂ שפות כריעות","שפות כריעות ⊂ שפות רגולריות ⊂ שפות חסרות הקשר"],"e":"הסולם של הקורס: אוטומט סופי (זיכרון קבוע) ⊂ אוטומט מחסנית (מחסנית) ⊂ מכונת טיורינג (סרט אינסופי). כל מודל חזק ממש מקודמו — למשל <span class=\"math\">{aⁿbⁿ}<\/span> חסרת הקשר אך לא רגולרית.","a":1},{"q":"מהן שתי \"תבניות העל\" של שאלות המבחן בקורס, כפי שמופיעות כמעט בכל סעיף?","c":["חישוב סיבוכיות זמן, וכתיבת קוד יעיל","שרטוט גרפים, וחישוב הסתברויות","פישוט ביטויים בוליאניים, וטבלאות אמת","בנייה של מזהה לשפה, והוכחה ששפה לא שייכת למחלקה"],"e":"כל נושא מציע כלי בנייה (DFA\/NFA\/רגקס\/CFG\/PDA\/TM והמרות ביניהם) וכלי אי־אפשרות (למות ניפוח, רדוקציות, משפט רייס). סיבוכיות (NP וכו') כלל לא נלמדת בקורס הזה.","a":3},{"q":"מדוע מגדירים \"מודל חישובי\" כאובייקט מתמטי (קבוצות ופונקציות) ולא כמחשב ממשי?","c":["כדי לחסוך זיכרון בזמן הסימולציה","כדי שאפשר יהיה להוכיח טענות מדויקות על גבולות היכולת של המודל","כי מחשבים אמיתיים איטיים מדי לניסויים","כי לא היו מחשבים כשהומצאה התורה — היום ההגדרות מיושנות"],"e":"רק על הגדרה פורמלית אפשר להוכיח משפטים כמו \"אף אוטומט סופי לא מזהה את <span class=\"math\">{aⁿbⁿ}<\/span>\" או \"בעיית העצירה אינה כריעה\" — טענות על <b>כל<\/b> מכונה אפשרית, לא על מימוש מסוים.","a":1}]},{"t":"אלף־בית, מילים ופעולות על מילים","q":[{"q":"מה ההבדל בין <span class=\"math\">ε<\/span> לבין <span class=\"math\">∅<\/span>?","c":["<span class=\"math\">ε<\/span> היא שפה ריקה; <span class=\"math\">∅<\/span> היא מילה ריקה","<span class=\"math\">∅<\/span> היא המילה הקצרה ביותר בכל שפה","<span class=\"math\">ε<\/span> היא מילה באורך 0; <span class=\"math\">∅<\/span> היא שפה שאין בה אף מילה","אין הבדל — שני סימונים לאותו דבר"],"e":"<span class=\"math\">ε<\/span> — מילה (אורך 0). <span class=\"math\">∅<\/span> — קבוצה ריקה של מילים. לכן <span class=\"math\">{ε} ≠ ∅<\/span>: בשפה <span class=\"math\">{ε}<\/span> יש מילה אחת.","a":2},{"q":"עבור <span class=\"math\">w = aab<\/span>, מהי המילה <span class=\"math\">w<sup>R<\/sup>w<\/span>?","c":["<span class=\"math\">baaaab<\/span>","<span class=\"math\">aabbaa<\/span>","<span class=\"math\">baabaa<\/span>","<span class=\"math\">aabaab<\/span>"],"e":"<span class=\"math\">w<sup>R<\/sup> = baa<\/span>, ואז משרשרים: <span class=\"math\">w<sup>R<\/sup>·w = baa·aab = baaaab<\/span>. שימו לב שהתוצאה פלינדרום — <span class=\"math\">w<sup>R<\/sup>w<\/span> תמיד פלינדרום באורך זוגי.","a":0},{"q":"כמה מילים באורך בדיוק <span class=\"math\">k<\/span> יש מעל אלף־בית בגודל <span class=\"math\">|Σ| = n<\/span>?","c":["<span class=\"math\">n·k<\/span>","אינסוף","<span class=\"math\">n<sup>k<\/sup><\/span>","<span class=\"math\">k<sup>n<\/sup><\/span>"],"e":"בכל אחת מ־<span class=\"math\">k<\/span> העמדות בוחרים אות אחת מתוך <span class=\"math\">n<\/span> — סה\"כ <span class=\"math\">n<sup>k<\/sup><\/span>. לכן <span class=\"math\">Σ<sup>*<\/sup><\/span> אינסופית אך <b>בת מנייה<\/b> — עובדה שחוזרת בפרק החישוביות.","a":2}]},{"t":"שפות ופעולות על שפות","q":[{"q":"מהי <span class=\"math\">∅<sup>*<\/sup><\/span>?","c":["<span class=\"math\">∅<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span>","לא מוגדר","<span class=\"math\">{ε}<\/span>"],"e":"<span class=\"math\">L<sup>*<\/sup> = ⋃<sub>k≥0<\/sub> L<sup>k<\/sup><\/span> ותמיד <span class=\"math\">L<sup>0<\/sup> = {ε}<\/span> — שרשור של אפס מילים. לכן גם לשפה הריקה: <span class=\"math\">∅<sup>*<\/sup> = {ε}<\/span>. זו נקודה קבועה בהמרות GNFA.","a":3},{"q":"עבור <span class=\"math\">L = {ab, ba}<\/span>, איזו מילה <b>אינה<\/b> שייכת ל־<span class=\"math\">L<sup>*<\/sup><\/span>?","c":["<span class=\"math\">baba<\/span>","<span class=\"math\">aab<\/span>","<span class=\"math\">abba<\/span>","<span class=\"math\">ε<\/span>"],"e":"מילה ב־<span class=\"math\">L<sup>*<\/sup><\/span> היא שרשור בלוקים של <span class=\"math\">ab<\/span> או <span class=\"math\">ba<\/span> — תמיד באורך זוגי. <span class=\"math\">aab<\/span> באורך 3, ולכן לא בשפה. השאר: <span class=\"math\">abba = ab·ba<\/span>, <span class=\"math\">ε<\/span> (אפס בלוקים), <span class=\"math\">baba = ba·ba<\/span>.","a":1},{"q":"מהי השפה <span class=\"math\">L·∅<\/span> עבור שפה <span class=\"math\">L<\/span> כלשהי?","c":["<span class=\"math\">L<\/span>","<span class=\"math\">{ε}<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span>","<span class=\"math\">∅<\/span>"],"e":"שרשור דורש לבחור מילה מכל אחת מהשפות: <span class=\"math\">L·∅ = {uv | u∈L, v∈∅}<\/span> — אין אף <span class=\"math\">v<\/span> לבחור, לכן התוצאה ריקה. לעומת זאת <span class=\"math\">L·{ε} = L<\/span>. אלו שני המקרים שהכי מתבלבלים ביניהם.","a":3}]}]}]</script>
<script type="application/json" id="d-exams">[{"id":"mini","year":2026,"moed":"AI","label":"מבחן בדיקה זמני (יוסר)","lang":"he","combined":false,"meta":{"date":"","duration":"20 דקות","staff":"שלד לבדיקות מנוע — יוחלף במבחני 2023–2024 האמיתיים","totalPoints":25,"note":"מבחן זמני לבדיקת האתר. המבחנים האמיתיים בדרך."},"questions":[{"n":"1","heading":"שאלה 1 (15 נקודות)","points":15,"intro":"","parts":[{"pid":"q1a","label":"א","kind":"tf","rows":3,"prompt":"<p dir=\"auto\">אם <span class=\"math\">L₁<\/span> ו־<span class=\"math\">L₂<\/span> שפות רגולריות, אז <span class=\"math\">L₁ ∩ L₂<\/span> רגולרית. נכון או לא נכון? נמקו בקצרה.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q1b","label":"ב","kind":"open","rows":6,"prompt":"<p dir=\"auto\">בנו <span class=\"en\">DFA<\/span>‏ לשפה <span class=\"math\">L = {w ∈ {a,b}<sup>*<\/sup> | #<sub>a<\/sub>(w) זוגי}<\/span>. ציינו את החמישייה במפורש.<\/p>","tags":{"subj":"automata","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (10 נקודות)","points":10,"intro":"<p dir=\"auto\">נתונה השפה:<\/p><div class=\"lang-def\">L = {aⁿbⁿ | n ≥ 0}<\/div>","parts":[{"pid":"q2a","label":"א","kind":"tf","rows":2,"prompt":"<p dir=\"auto\">‏<span class=\"math\">L<\/span> רגולרית. נכון או לא נכון?<\/p>","tags":{"subj":"pump-reg","qt":"claim"}},{"pid":"q2b","label":"ב","kind":"open","rows":8,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם מסעיף א׳ בעזרת למת הניפוח.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}}]}],"solution":[{"ref":"q1a","html":"<p dir=\"auto\"><span class=\"verdict v-true\">נכון<\/span> רגולריות סגורה לחיתוך: בהינתן DFA־ים\n<span class=\"math\">A₁, A₂<\/span> בונים את <b>אוטומט המכפלה<\/b> שמצביו\n<span class=\"math\">Q₁ × Q₂<\/span>, המעבר <span class=\"math\">δ((p,q),σ) = (δ₁(p,σ), δ₂(q,σ))<\/span>,\nוהמצבים המקבלים <span class=\"math\">F₁ × F₂<\/span>.<\/p>"},{"ref":"q1b","html":"<p dir=\"auto\">אוטומט עם שני מצבים שסופר את זוגיות מספר ה־<span class=\"math\">a<\/span>:<\/p>\n<div class=\"fsa\"><svg viewBox=\"0 0 300 1 <script type="text/plain" id="d-defs"><h1>דף נוסחאות והגדרות</h1>
<p class="chapter-subtitle">הנוסח שמצורף רשמית למבחני 2023–2024 (מתורגם ומורחב קלות) — כדאי להכיר אותו היטב: הוא זמין לכם בזמן המבחן</p>

<section>
  <h2>אוטומטים סופיים</h2>

  <div class="def"><span class="term">אוטומט סופי דטרמיניסטי (DFA)</span> —
    חמישייה <span class="math">A = (Q, Σ, δ, q<sub>s</sub>, F)</span> כאשר:
    <ul>
      <li><span class="math">Q</span> — קבוצה סופית של מצבים.</li>
      <li><span class="math">Σ</span> — קבוצה סופית, האלף־בית.</li>
      <li><span class="math">δ: Q × Σ → Q</span> — פונקציית המעברים.</li>
      <li><span class="math">q<sub>s</sub> ∈ Q</span> — המצב ההתחלתי.</li>
      <li><span class="math">F ⊆ Q</span> — קבוצת המצבים המקבלים.</li>
    </ul>
  </div>

  <div class="def"><span class="term">אוטומט סופי לא־דטרמיניסטי (NFA)</span> —
    חמישייה <span class="math">B = (Q, Σ, δ, q<sub>s</sub>, F)</span>, זהה ל־DFA פרט לפונקציית המעברים:
    <div class="lang-def">δ: Q × Σ<sub>ε</sub> → P(Q)&nbsp;&nbsp;,&nbsp;&nbsp;Σ<sub>ε</sub> = Σ ∪ {ε}</div>
    כלומר מכל מצב, על כל אות (או על <span class="math">ε</span>), עוברים ל<em>קבוצת</em> מצבים אפשריים.
  </div>

  <div class="thm"><span class="term">שפה רגולרית</span> — שפה נקראת רגולרית אם ורק אם קיים אוטומט סופי שמזהה אותה
    (שקול: קיים ביטוי רגולרי שמתאר אותה; שקול: קיים דקדוק רגולרי שיוצר אותה).</div>
</section>

<section>
  <h2>המרות בין מודלים רגולריים</h2>

  <div class="algo">
    <h4>NFA ← DFA (בניית תת־הקבוצות)</h4>
    <p>בהינתן <span class="math">N = (Q<sub>N</sub>, Σ<sub>N</sub>, δ<sub>N</sub>, q<sub>sN</sub>, F<sub>N</sub>)</span> נבנה
      <span class="math">D = (Q<sub>D</sub>, Σ<sub>D</sub>, δ<sub>D</sub>, q<sub>sD</sub>, F<sub>D</sub>)</span>:</p>
    <ul>
      <li><span class="math">Q<sub>D</sub> = P(Q<sub>N</sub>)</span> (קבוצת החזקה).</li>
      <li><span class="math">Σ<sub>D</sub> = Σ<sub>N</sub></span>.</li>
      <li>לכל <span class="math">R ∈ Q<sub>D</sub></span> ולכל <span class="math">σ ∈ Σ<sub>D</sub></span>:
        <span class="math">δ<sub>D</sub>(R, σ) = ⋃<sub>r∈R</sub> E(δ<sub>N</sub>(r, σ))</span>,
        כאשר <span class="math">E(R)</span> היא סגירת ה־<span class="math">ε</span> — כל המצבים שנגישים מ־<span class="math">R</span> במעברי <span class="math">ε</span> בלבד.</li>
      <li><span class="math">q<sub>sD</sub> = E(q<sub>sN</sub>)</span>.</li>
      <li><span class="math">F<sub>D</sub> = {R ∈ Q<sub>D</sub> | R ∩ F<sub>N</sub> ≠ ∅}</span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>Regex ← NFA</h4>
    <ol>
      <li>מציירים NFA בן שני מצבים שהמעבר ביניהם מסומן בביטוי <span class="math">r</span> כולו.</li>
      <li>מעבר שמסומן <span class="math">r + s</span> מוחלף בשני חיצים מקבילים — אחד <span class="math">r</span> ואחד <span class="math">s</span>.</li>
      <li>מעבר שמסומן <span class="math">rs</span> מוחלף בשני חיצים עוקבים דרך מצב ביניים חדש.</li>
      <li>מעבר שמסומן <span class="math">r<sup>*</sup></span> מוחלף במבנה: <span class="math">ε</span> פנימה, לולאת <span class="math">r</span> עצמית, <span class="math">ε</span> החוצה.</li>
      <li>ממשיכים עד שכל התוויות הן אותיות מ־<span class="math">Σ<sub>ε</sub></span>.</li>
    </ol>
  </div>

  <div class="algo">
    <h4>NFA ← Regex&nbsp;: דרך GNFA (אלימינציית מצבים)</h4>
    <p><b>שלב א — הפיכה ל־GNFA:</b></p>
    <ul>
      <li>מצב התחלתי חדש <span class="math">s</span> עם <span class="math">δ(s, ε) = q<sub>s</sub></span>, כך שמההתחלה יוצאים חיצים בלבד.</li>
      <li>מצב מקבל יחיד חדש <span class="math">f</span>: לכל <span class="math">q ∈ F</span> מוסיפים <span class="math">δ(q, ε) = f</span>, וקובעים <span class="math">F = {f}</span>.</li>
      <li>בין כל זוג מצבים יש בדיוק חץ אחד: חיצים מקבילים מוחלפים בסכום (<span class="math">+</span>) של התוויות; אם אין חץ — מוסיפים חץ בתווית <span class="math">∅</span>.</li>
    </ul>
    <p><b>שלב ב — אלימינציה:</b> מסלקים בכל פעם מצב <span class="math">k ≠ s, f</span>, ולכל זוג <span class="math">(i, j)</span> מעדכנים:</p>
    <div class="lang-def">new(i,j) = old(i,j) + old(i,k)·old(k,k)<sup>*</sup>·old(k,j)</div>
    <p>תזכורת: <span class="math">∅<sup>*</sup> = {ε}</span>. בסוף נשארים רק <span class="math">s</span> ו־<span class="math">f</span>, והתווית על החץ ביניהם היא הביטוי הרגולרי המבוקש.</p>
  </div>
</section>

<section>
  <h2>מצבים שקולים ומינימיזציה</h2>

  <div class="def"><span class="term">מילה מפרידה (Separating word)</span> —
    לשני מצבים <span class="math">q, p ∈ Q</span>, מילה <span class="math">w ∈ Σ<sup>*</sup></span> נקראת מפרידה אם בדיוק אחד משני הריצות מסתיים במצב מקבל:
    <span class="math">δ′(q,w) ∈ F</span> אבל <span class="math">δ′(p,w) ∉ F</span>, או להפך
    (<span class="math">δ′</span> — הרחבת פונקציית המעברים למילים).
  </div>

  <div class="def"><span class="term">שקילות־k</span> — <span class="math">p ≡<sub>k</sub> q</span> אם אין מילה מפרידה באורך
    <span class="math">≤ k</span>. <span class="term">שקילות</span> — <span class="math">p ≡ q</span> אם הם
    <span class="math">k</span>־שקולים לכל <span class="math">k ≥ 0</span>.
  </div>

  <div class="algo">
    <h4>מציאת מחלקות שקילות (ל־DFA בלבד)</h4>
    <ol>
      <li>מסירים את כל המצבים הלא־נגישים.</li>
      <li>מתחילים מהחלוקה <span class="math">E<sub>0</sub> = {F, Q∖F}</span>.</li>
      <li>בצעד <span class="math">k ≥ 1</span> בונים את <span class="math">E<sub>k</sub></span>: מצבים <span class="math">q, p</span> באותה מחלקה ב־<span class="math">E<sub>k−1</sub></span> נשארים יחד אם ורק אם לכל <span class="math">σ ∈ Σ</span> מתקיים <span class="math">δ(q,σ) ≡<sub>k−1</sub> δ(p,σ)</span>.</li>
      <li>עוצרים כאשר <span class="math">E<sub>k−1</sub> = E<sub>k</sub></span>.</li>
    </ol>
  </div>

  <div class="algo">
    <h4>מינימיזציה של DFA</h4>
    <ol>
      <li>מריצים את אלגוריתם מחלקות השקילות על <span class="math">Q</span>.</li>
      <li>מקצים מצב חדש לכל מחלקת שקילות.</li>
      <li>בונים את ה־DFA הממוזער בהתאם.</li>
    </ol>
  </div>

  <div class="thm"><span class="term">טענה</span> — שני DFA־ים <span class="math">A, B</span> שקולים
    (<span class="math">L(A) = L(B)</span>) אם ורק אם <span class="math">q<sub>s<sub>A</sub></sub> ≡ q<sub>s<sub>B</sub></sub></span>
    (באוטומט האיחוד שלהם).</div>
</section>

<section>
  <h2>למת הניפוח לשפות רגולריות</h2>
  <div class="thm">
    אם <span class="math">L</span> שפה רגולרית, אז קיים <span class="math">n ∈ ℕ</span> כך שלכל מילה
    <span class="math">w ∈ L</span> עם <span class="math">|w| ≥ n</span> קיימת חלוקה <span class="math">w = xyz</span> המקיימת:
    <ol>
      <li><span class="math">|y| &gt; 0</span></li>
      <li><span class="math">|xy| ≤ n</span></li>
      <li>לכל שלם <span class="math">i ≥ 0</span>: <span class="math">w<sub>i</sub> = xy<sup>i</sup>z ∈ L</span></li>
    </ol>
  </div>
  <div class="note"><b>הערת אורך:</b> אם <span class="math">|y| = t</span> אז
    <span class="math">|xy<sup>i</sup>z| = |w| + (i−1)t</span> — שימושי כשצריך לפגוע באורך מסוים.</div>
</section>

<section>
  <h2>דקדוקים</h2>

  <div class="def"><span class="term">דקדוק חסר הקשר (CFG)</span> —
    רביעייה <span class="math">G = (V, Σ, S, R)</span>:
    <ul>
      <li><span class="math">V</span> — קבוצה סופית של משתנים.</li>
      <li><span class="math">Σ</span> — קבוצת הטרמינלים, <span class="math">V ∩ Σ = ∅</span>.</li>
      <li><span class="math">S ∈ V</span> — משתנה ההתחלה.</li>
      <li><span class="math">R</span> — קבוצה סופית של כללי גזירה מהצורה <span class="math">A → α</span>, כאשר <span class="math">A ∈ V</span> ו־<span class="math">α ∈ (V ∪ Σ)<sup>*</sup></span>.</li>
    </ul>
    שפה שנוצרת על ידי CFG נקראת <span class="term">שפה חסרת הקשר (CFL)</span> —
    ושפה היא חסרת הקשר אם ורק אם קיים אוטומט מחסנית שמזהה אותה.
  </div>

  <div class="def"><span class="term">דקדוק רגולרי (RG)</span> — כל כלל הוא מאחת הצורות:
    <div class="gram"><div class="rule">A → w</div><div class="rule">A → wB</div></div>
    כאשר <span class="math">A, B ∈ V</span> ו־<span class="math">w ∈ Σ<sup>*</sup></span>.
    <span class="term">דקדוק רגולרי פשוט (SRG)</span> — כל כלל מהצורה
    <span class="math">A → σ</span> (עם <span class="math">σ ∈ Σ</span>),
    <span class="math">A → σB</span> (עם <span class="math">σ ∈ Σ<sub>ε</sub></span>),
    או <span class="math">A → ε</span>.
  </div>

  <div class="algo">
    <h4>RG ← NFA</h4>
    <ul>
      <li>משתנה לכל מצב; <span class="math">S</span> — המשתנה של <span class="math">q<sub>s</sub></span>.</li>
      <li>לכל מעבר <span class="math">δ(A, σ) = B</span> מוסיפים כלל <span class="math">A → σB</span>; לכל מעבר <span class="math">δ(A, ε) = B</span> מוסיפים <span class="math">A → B</span>.</li>
      <li>לכל מצב מקבל <span class="math">q ∈ F</span> מוסיפים <span class="math">A → ε</span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>NFA ← RG (דרך SRG)</h4>
    <ul>
      <li>הופכים את הדקדוק לפשוט (מפצלים <span class="math">A → σ<sub>1</sub>σ<sub>2</sub>…σ<sub>n</sub>B</span> לשרשרת כללים באות אחת).</li>
      <li>מצב לכל משתנה; <span class="math">q<sub>s</sub> = S</span>.</li>
      <li><span class="math">A → σB</span> נותן מעבר <span class="math">δ(A, σ) = B</span>; <span class="math">A → B</span> נותן מעבר <span class="math">ε</span>.</li>
      <li>לכל <span class="math">A → σ</span>: מוסיפים מצב חדש <span class="math">q<sub>i</sub></span>, מעבר <span class="math">δ(A, σ) = q<sub>i</sub></span>, ומכניסים את <span class="math">q<sub>i</sub></span> ל־<span class="math">F</span>.</li>
    </ul>
  </div>
</section>

<section>
  <h2>פישוט דקדוק ו־CNF</h2>

  <div class="def"><span class="term">דקדוק מפושט</span> — דקדוק ללא כללי <span class="math">ε</span>
    (מהצורה <span class="math">A → ε</span>; מותר רק <span class="math">S → ε</span>) וללא כללי יחידה
    (מהצורה <span class="math">A → B</span>).</div>

  <div class="algo">
    <h4>הסרת כללי ε</h4>
    <ol>
      <li>בוחרים כלל <span class="math">A → ε</span> (עם <span class="math">A ≠ S</span>) ומסירים אותו.</li>
      <li>לכל כלל <span class="math">B → αAβ</span> מוסיפים (בלי להסיר את המקור) את <span class="math">B → αβ</span> — לכל מופע של <span class="math">A</span> בנפרד: מ־<span class="math">B → αAβAγ</span> נקבל גם <span class="math">B → αβAγ</span>, גם <span class="math">B → αAβγ</span> וגם <span class="math">B → αβγ</span>. עבור <span class="math">B → A</span> מוסיפים <span class="math">B → ε</span> (אלא אם כבר הוסר).</li>
      <li>חוזרים עד שלא נותרו כללי <span class="math">ε</span>.</li>
    </ol>
    <p class="small"><b>אם <span class="math">ε ∈ L</span>:</b> מריצים את האלגוריתם ואז מוסיפים משתנה התחלה חדש עם
      <span class="math">S′ → S | ε</span>.</p>
  </div>

  <div class="algo">
    <h4>הסרת כללי יחידה</h4>
    <ol>
      <li>בוחרים כלל יחידה <span class="math">A → B</span> ומסירים אותו.</li>
      <li>לכל כלל <span class="math">B → α</span> מוסיפים <span class="math">A → α</span>.</li>
      <li>חוזרים עד שלא נותרו כללי יחידה.</li>
    </ol>
  </div>

  <div class="def"><span class="term">צורת חומסקי הנורמלית (CNF)</span> — כל כלל הוא מאחת הצורות:
    <div class="gram"><div class="rule">A → BC</div><div class="rule">A → σ</div></div>
    כאשר <span class="math">A, B, C ∈ V</span>, <span class="math">B, C ≠ S</span>, ו־<span class="math">σ ∈ Σ</span>.
    אם <span class="math">ε ∈ L</span> מותר גם <span class="math">S → ε</span>.
  </div>

  <div class="algo">
    <h4>CNF ← CFG</h4>
    <ol>
      <li>מוסיפים משתנה התחלה חדש <span class="math">S′</span> וכלל <span class="math">S′ → S</span>.</li>
      <li>מסירים כללי <span class="math">ε</span>.</li>
      <li>מסירים כללי יחידה.</li>
      <li>מתקנים את הכללים שנותרו: טרמינל <span class="math">σ<sub>i</sub></span> בכלל ארוך מוחלף במשתנה <span class="math">A<sub>i</sub></span> עם כלל <span class="math">A<sub>i</sub> → σ<sub>i</sub></span>; כלל <span class="math">A → B<sub>1</sub>B<sub>2</sub>…B<sub>n</sub></span> (עם <span class="math">n &gt; 2</span>) מפוצל ל־<span class="math">A → B<sub>1</sub>C<sub>1</sub></span> ו־<span class="math">C<sub>1</sub> → B<sub>2</sub>…B<sub>n</sub></span>, וחוזר חלילה.</li>
    </ol>
  </div>
</section>

<section>
  <h2>אוטומט מחסנית (PDA)</h2>

  <div class="def"><span class="term">PDA</span> — שישייה <span class="math">A = (Q, Σ, Γ, δ, q<sub>s</sub>, F)</span>:
    <ul>
      <li><span class="math">Q</span> — מצבים; <span class="math">Σ</span> — אלף־בית הקלט; <span class="math">Γ</span> — אלף־בית המחסנית.</li>
      <li><span class="math">δ: Q × Σ<sub>ε</sub> × Γ<sub>ε</sub> → P(Q × Γ<sub>ε</sub>)</span> — פונקציית המעברים (קוראים אות או <span class="math">ε</span>, מוציאים סמל מחסנית או <span class="math">ε</span>, דוחפים סמל או <span class="math">ε</span>).</li>
      <li><span class="math">q<sub>s</sub> ∈ Q</span> התחלתי; <span class="math">F ⊆ Q</span> מקבלים.</li>
    </ul>
  </div>

  <div class="def"><span class="term">PDA מפושט</span> —
    יש לו מצב מקבל יחיד <span class="math">q<sub>f</sub></span>; לפני קבלה המחסנית חייבת להיות ריקה;
    וכל מעבר או מוציא סמל מהמחסנית (pop) או מכניס סמל (push), אך לא שניהם.
  </div>

  <div class="algo">
    <h4>PDA ← CFG</h4>
    <p>בהינתן <span class="math">G = (V, Σ, S, R)</span> בונים PDA עם שלושה מצבים
      <span class="math">q<sub>start</sub> → q<sub>loop</sub> → q<sub>accept</sub></span>:</p>
    <ul>
      <li>בכניסה דוחפים <span class="math">S$</span> (מעבר <span class="math">ε,ε→S$</span>).</li>
      <li>ב־<span class="math">q<sub>loop</sub></span>: לכל כלל <span class="math">A → α<sub>1</sub>…α<sub>k</sub></span> — מעבר <span class="math">ε, A → α<sub>1</sub>…α<sub>k</sub></span>; לכל <span class="math">a ∈ Σ</span> — מעבר <span class="math">a, a → ε</span>.</li>
      <li>מעבר <span class="math">ε, $ → ε</span> אל <span class="math">q<sub>accept</sub></span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>CFG ← PDA</h4>
    <p>בהינתן PDA מפושט <span class="math">P = (Q, Σ<sub>P</sub>, Γ, δ, q<sub>s</sub>, {q<sub>f</sub>})</span>, לכל
      <span class="math">p, q ∈ Q</span> מגדירים את <span class="math">L<sub>p,q</sub></span> — כל המילים שמריצות את
      <span class="math">P</span> ממצב <span class="math">p</span> עם מחסנית ריקה למצב <span class="math">q</span> עם מחסנית ריקה.
      שימו לב: <span class="math">L(P) = L<sub>q<sub>s</sub>,q<sub>f</sub></sub></span>.</p>
    <p>בונים דקדוק עם משתנים <span class="math">A<sub>p,q</sub></span> לכל זוג מצבים, <span class="math">S = A<sub>q<sub>s</sub>,q<sub>f</sub></sub></span>, וכללים:</p>
    <ul>
      <li>לכל <span class="math">p, q, r ∈ Q</span>: <span class="math">A<sub>p,q</sub> → A<sub>p,r</sub>A<sub>r,q</sub></span>.</li>
      <li>לכל <span class="math">p ∈ Q</span>: <span class="math">A<sub>p,p</sub> → ε</span>.</li>
      <li>לכל <span class="math">p, q, r, s ∈ Q</span>, <span class="math">γ ∈ Γ</span>, <span class="math">σ′, σ″ ∈ Σ<sub>ε</sub></span> כך ש־<span class="math">(r, γ) ∈ δ(p, σ′, ε)</span> (push) ו־<span class="math">(q, ε) ∈ δ(s, σ″, γ)</span> (pop):
        מוסיפים <span class="math">A<sub>p,q</sub> → σ′A<sub>r,s</sub>σ″</span>.</li>
    </ul>
  </div>
</section>

<section>
  <h2>למת הניפוח לשפות חסרות הקשר</h2>
  <div class="thm">
    אם <span class="math">L</span> שפה חסרת הקשר, אז קיים <span class="math">p ∈ ℕ</span> כך שלכל
    <span class="math">w ∈ L</span> עם <span class="math">|w| ≥ p</span> קיימת חלוקה
    <span class="math">w = uvxyz</span> המקיימת:
    <ol>
      <li><span class="math">|vy| &gt; 0</span></li>
      <li><span class="math">|vxy| ≤ p</span></li>
      <li>לכל שלם <span class="math">i ≥ 0</span>: <span class="math">w<sub>i</sub> = uv<sup>i</sup>xy<sup>i</sup>z ∈ L</span></li>
    </ol>
  </div>
  <div class="note"><b>הערת אורך:</b> אם <span class="math">|v| = s</span> ו־<span class="math">|y| = t</span> אז
    <span class="math">|uv<sup>i</sup>xy<sup>i</sup>z| = |w| + (i−1)s + (i−1)t</span>.</div>
</section>

<section>
  <h2>הצבה (Substitution)</h2>
  <div class="def"><span class="term">הצבה</span> — בהינתן אלף־ביתים <span class="math">Σ<sub>1</sub>, Σ<sub>2</sub></span>,
    הצבה היא פונקציה <span class="math">f: Σ<sub>1</sub> → P(Σ<sub>2</sub><sup>*</sup>)</span> — לכל אות
    <span class="math">σ ∈ Σ<sub>1</sub></span> מתאימים שפה <span class="math">L<sub>σ</sub></span> מעל <span class="math">Σ<sub>2</sub></span>.
    ההרחבה למילה: <span class="math">f(w) = {w<sub>1</sub>w<sub>2</sub>…w<sub>n</sub> | w<sub>i</sub> ∈ f(σ<sub>i</sub>)}</span>;
    ולשפה: <span class="math">f(L) = ⋃<sub>w∈L</sub> f(w)</span>.
  </div>
  <div class="thm"><span class="term">הצבה רגולרית</span> — אם <span class="math">L</span> רגולרית וכל
    <span class="math">L<sub>σ</sub></span> רגולרית, אז <span class="math">f(L)</span> רגולרית.
    <span class="term">הצבה חסרת הקשר</span> — אם <span class="math">L</span> חסרת הקשר וכל
    <span class="math">L<sub>σ</sub></span> חסרת הקשר, אז <span class="math">f(L)</span> חסרת הקשר.</div>
</section>

<section>
  <h2>מכונת טיורינג</h2>
  <div class="def"><span class="term">מכונת טיורינג (TM)</span> —
    שביעייה <span class="math">M = (Q, Σ, Γ, δ, q<sub>s</sub>, q<sub>acc</sub>, q<sub>rej</sub>)</span>:
    <ul>
      <li><span class="math">Q</span> — קבוצה סופית של מצבים.</li>
      <li><span class="math">Σ</span> — אלף־בית הקלט; תו הרווח <span class="math">␣ ∉ Σ</span>.</li>
      <li><span class="math">Γ</span> — אלף־בית הסרט; <span class="math">␣ ∈ Γ</span> וגם <span class="math">Σ ⊆ Γ</span>.</li>
      <li><span class="math">δ: Q × Γ → Q × Γ × {L, R}</span> — פונקציית המעברים.</li>
      <li><span class="math">q<sub>s</sub></span> התחלתי; <span class="math">q<sub>acc</sub></span> מקבל; <span class="math">q<sub>rej</sub></span> דוחה.</li>
    </ul>
  </div>
</section>

<section>
  <h2>השפות המרכזיות</h2>
  <div class="def">
    <ul class="major-langs">
      <li><span class="math">A<sub>DFA</sub> = {⟨D, w⟩ | D is a DFA and D accepts w}</span></li>
      <li><span class="math">A<sub>TM</sub> = {⟨M, w⟩ | M is a TM and M accepts w}</span></li>
      <li><span class="math">HALT<sub>TM</sub> = {⟨M, w⟩ | M is a TM and M halts on input w}</span></li>
      <li><span class="math">E<sub>DFA</sub> = {⟨D⟩ | D is a DFA and L(D) = ∅}</span></li>
      <li><span class="math">E<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) = ∅}</span></li>
      <li><span class="math">REG<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) is a regular language}</span></li>
      <li><span class="math">EQ<sub>DFA</sub> = {⟨D<sub>1</sub>, D<sub>2</sub>⟩ | D<sub>1</sub>, D<sub>2</sub> are DFAs and L(D<sub>1</sub>) = L(D<sub>2</sub>)}</span></li>
      <li><span class="math">EQ<sub>TM</sub> = {⟨M<sub>1</sub>, M<sub>2</sub>⟩ | M<sub>1</sub>, M<sub>2</sub> are TMs and L(M<sub>1</sub>) = L(M<sub>2</sub>)}</span></li>
      <li><span class="math">PAL = {w | w ∈ Σ<sup>*</sup> and w = w<sup>R</sup>}</span></li>
      <li><span class="math">PAL<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) = PAL}</span></li>
      <li><span class="math">L<sub>∞</sub> = {⟨M⟩ | M is a TM and L(M) is infinite}</span></li>
    </ul>
  </div>
  <div class="note"><b>סטטוס כריעות (מהקורס):</b>
    <span class="math">A<sub>DFA</sub>, E<sub>DFA</sub>, EQ<sub>DFA</sub> ∈ R</span>&nbsp;·&nbsp;
    <span class="math">A<sub>TM</sub>, HALT<sub>TM</sub> ∈ RE ∖ R</span>&nbsp;·&nbsp;
    <span class="math">E<sub>TM</sub> ∈ coRE ∖ R</span>&nbsp;·&nbsp;
    <span class="math">REG<sub>TM</sub>, EQ<sub>TM</sub> ∉ RE ∪ coRE</span>.</div>
</section>
</script>
<script>
/* ===================== מודלים חישוביים — מרכז הכנה למבחן ===================== */
(function () {
'use strict';

const SUMS  = JSON.parse(document.getElementById('d-summaries').textContent);
const QUIZ  = JSON.parse(document.getElementById('d-quiz').textContent);
const EXAMS = JSON.parse(document.getElementById('d-exams').textContent);
const LANGB = JSON.parse(document.getElementById('d-langbank').textContent);
const DEFS  = document.getElementById('d-defs').textContent;
const TAX   = {"subjects":[{"id":"automata","he":"אוטומטים סופיים (DFA/NFA)"},{"id":"regex","he":"ביטויים רגולריים"},{"id":"minimize","he":"מינימיזציה ומצבים שקולים"},{"id":"pump-reg","he":"למת הניפוח — רגולריות"},{"id":"closure","he":"תכונות סגור ובניות"},{"id":"cfg","he":"דקדוקים חסרי הקשר"},{"id":"pda","he":"אוטומטי מחסנית"},{"id":"pump-cfl","he":"למת הניפוח — חסרות הקשר"},{"id":"tm","he":"מכונות טיורינג"},{"id":"r-re-core","he":"R / RE / coRE"},{"id":"reduction","he":"רדוקציות ואי־כריעות"},{"id":"rice","he":"משפט רייס"}],"qtypes":[{"id":"construction","he":"בנייה"},{"id":"proof","he":"הוכחה"},{"id":"pumping","he":"ניפוח"},{"id":"r-re-core","he":"סיווג R/RE/coRE"},{"id":"claim","he":"הוכח או הפרך"},{"id":"reduction","he":"רדוקציה"},{"id":"short","he":"סעיף סגור"},{"id":"open","he":"שאלה פתוחה"}]};

const KEY = 'cm-prep-v1';
const byId = {}; SUMS.forEach(s => byId[s.sid] = s);
const quizBy = {}; QUIZ.forEach(q => quizBy[q.sid] = q);
const examBy = {}; EXAMS.forEach(e => examBy[e.id] = e);

/* מאגר השאלות: כל סעיף מתויג, מכל המבחנים, בסדר הופעה קבוע */
const BANK = [];
EXAMS.forEach(e => e.questions.forEach(q => q.parts.forEach(p => {
  if(p.tags && p.tags.subj) BANK.push({ e, q, p, key: e.id + '|' + p.pid });
})));
const subjHe = id => (TAX.subjects.find(s => s.id === id) || {}).he || id;
const qtHe   = id => (TAX.qtypes.find(t => t.id === id) || {}).he || id;

/* ---------- state ---------- */
const DEF = { read:{}, understood:{}, topics:{}, exams:{}, bank:{}, lang:{}, master:false, notes:'', examDate:'', lastView:'dash', updatedAt:0, mt:{} };

    const s = Object.assign(structuredClone(DEF), JSON.parse(raw));

  catch(e){ return structuredClone(DEF); }
}
/* ---------- חותמת זמן פר־פריט ----------
   בלי זה הסנכרון היה "המכשיר האחרון ששמר דורס את הכול", ולכן התקדמות
   נעלמה. עכשיו כל סימון נושא / קריאה / תשובה נושא חותמת זמן משלו,
   והמיזוג מכריע לכל פריט בנפרד מי החדש יותר.                          */
const akey = (eid,pid) => 'a:'+eid+'|'+pid;
function touch(){ const n = Date.now();
  for(const k of arguments) if(k) S.mt[k] = n; }
function touchExam(eid, answers){
  touch('e:'+eid);
  if(answers){ const n = Date.now(); Object.keys(answers).forEach(pid => S.mt[akey(eid,pid)] = n); }
}
let saveT;
function writeLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('שגיאה בשמירה מקומית — ייתכן שהאחסון מלא','e'); return false; } }
/* שמירה מקומית בלבד — להעדפות תצוגה (לשונית אחרונה וכד'). לא מזיזה את
   updatedAt ולא דוחפת לענן, כדי שמכשיר ישן שרק דפדפו בו לא ייראה
   "חדש יותר" מהענן וידרוס התקדמות אמיתית.                             */
function saveLocal(){ clearTimeout(saveT); saveT = setTimeout(writeLocal, 150); }
function save(){ S.updatedAt = Date.now(); clearTimeout(saveT);
  saveT = setTimeout(()=>{ writeLocal(); cloudPush(); }, 150); }
function saveNow(){ S.updatedAt = Date.now(); clearTimeout(saveT); writeLocal(); cloudPush(); }

/* ---------- helpers ---------- */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => `<span class="num">${n}</span>`;
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
function htmlToText(h){
  const d = document.createElement('div'); d.innerHTML = h;
  d.querySelectorAll('pre').forEach(p => p.replaceWith(document.createTextNode('\n```\n'+p.textContent.replace(/\n+$/,'')+'\n```\n')));
  d.querySelectorAll('br').forEach(b => b.replaceWith(document.createTextNode('\n')));
  d.querySelectorAll('li').forEach(li => li.prepend(document.createTextNode('- ')));
  d.querySelectorAll('tr').forEach(tr => {
    const cells = Array.from(tr.children).map(c => c.textContent.trim());
    tr.replaceWith(document.createTextNode('| ' + cells.join(' | ') + ' |\n'));
  });
  d.querySelectorAll('p,div,h1,h2,h3,h4,ul,ol').forEach(p => p.append(document.createTextNode('\n')));
  return d.textContent.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast'+(kind?' '+kind:'');
  t.textContent = msg;
  Object.assign(t.style,{position:'fixed',insetInlineStart:'50%',transform:'translateX(-50%)',bottom:'26px',
    background: kind==='e' ? '#a32626' : '#3b2a75', color:'#fff', padding:'11px 20px', borderRadius:'10px',
    zIndex:200, boxShadow:'0 8px 28px rgba(0,0,0,.28)', fontWeight:'650', maxWidth:'90vw'});
  document.body.appendChild(t); setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0';
    setTimeout(()=>t.remove(), 420); }, 2600);
}
function download(name, text){
  const b = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const u = URL.createObjectURL(b); const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 500);
}
const tkey = (sid,i) => sid+'|'+i;

/* ---------- progress ---------- */
function stats(){
  const nS = SUMS.length;
  const read = SUMS.filter(s=>S.read[s.sid]).length;
  const und  = SUMS.filter(s=>S.understood[s.sid]).length;
  let nT=0, dT=0;
  SUMS.forEach(s=>{ s.topics.forEach((_,i)=>{ nT++; if(S.topics[tkey(s.sid,i)]?.done) dT++; }); });
  const nE = EXAMS.length, dE = EXAMS.filter(e=>S.exams[e.id]?.done).length;
  const nB = BANK.length,  dB = BANK.filter(b=>S.bank[b.key]?.done).length;
  const nL = LANGB.length, dL = LANGB.filter(l=>S.lang[l.id]?.ok).length;
  const total = read+und+dT+dE+dB+dL, max = nS+nS+nT+nE+nB+nL;
  return {nS,read,und,nT,dT,nE,dE,nB,dB,nL,dL,overall:pct(total,max)};
}
function refreshChrome(){
  const st = stats();
  $('#mini-bar i').style.width = st.overall+'%';
  $('#mini-pct').innerHTML = st.overall+'%';
  $('#tb-sum').innerHTML  = `${st.read}/${st.nS}`;
  $('#tb-top').innerHTML  = `${st.dT}/${st.nT}`;
  $('#tb-exam').innerHTML = `${st.dE}/${st.nE}`;
  const tb = $('#tb-bank'); if(tb) tb.innerHTML = `${st.dB}/${st.nB}`;
}

/* ---------- Quiz engine ---------- */
let QZ = null;
window.openQuiz = (sid, i) => {
  const qt = quizBy[sid]?.topics[i]; if(!qt) return toast('אין שאלות לנושא הזה','e');
  QZ = { sid, i, title: byId[sid].topics[i], qs: qt.q.map(q=>({...q})), picked:[], checked:false };
  renderQuiz();
  $('#ov').hidden = false; document.body.style.overflow='hidden';
};
function renderQuiz(){
  const L = ['א','ב','ג','ד','ה','ו'];
  const body = QZ.qs.map((q,qi)=>{
    const p = QZ.picked[qi];

/* ---------- שמירת מקום בגלילה סביב render() ----------
   הצגה/הסתרה של הפתרונות מוסיפה או מורידה תוכן גם *מעל* נקודת הצפייה,
   ולכן אותו scrollY מצביע פתאום על מקום אחר — מכאן ה"קפיצה" הקטנה למעלה
   או למטה. לכן זוכרים את האלמנט שנמצא כרגע בראש החלון ואת המרחק המדויק
   שלו מראש החלון, ומחזירים אותו לאותו מרחק אחרי הרינדור.
   שומרים שרשרת עוגנים (תיבת פתרון → סעיף → שאלה) כי בהסתרה תיבת הפתרון
   עצמה נעלמת, ואז נעגנים לסעיף שמכיל אותה.                              */
function cssq(s){ return String(s).replace(/["\\]/g, '\\$&'); }
function grabAnchor(){
  const bar = document.querySelector('header, .topbar');
  const ref = bar ? Math.round(bar.getBoundingClientRect().bottom) + 4 : 8;
  /* צריך את העוגן ה*ספציפי* ביותר שחוצה את קו ראש התוכן — לא את כרטיס
     השאלה העוטף. עיגון לשאלה כולה לא מפצה על תיבות פתרון שנעלמו בתוכה,
     ואז הדף עדיין זז.                                                  */
  let hit = null;
  for(const el of $$('#app [data-anch]')){
    const r = el.getBoundingClientRect();
    if(r.bottom <= ref) continue;              // כבר גלל מעל החלון
    if(r.top <= ref) hit = el;                 // התחיל לפני הקו — עמוק יותר, ממשיכים
    else { if(!hit) hit = el; break; }         // הראשון שמתחיל מתחת לקו
  }
  if(!hit) return null;
  const chain = [];
  for(let el = hit; el; el = el.parentElement){
    const k = el.dataset && el.dataset.anch;
    if(k) chain.push({ key:k, top: el.getBoundingClientRect().top });
  }
  return chain.length ? chain : null;
}
function applyAnchor(chain){
  if(!chain) return;
  for(const a of chain){
    const el = document.querySelector('#app [data-anch="' + cssq(a.key) + '"]');
    if(!el) continue;
    const d = el.getBoundingClientRect().top - a.top;
    if(Math.abs(d) > 0.5) window.scrollBy(0, d);
    return;
  }
}
/* רינדור שמשאיר את העין באותו מקום.
   בסוף המבחן הדף מתקצר כשמסתירים פתרונות, ואז הגלילה נחסמת בתחתית ולא
   ניתן להחזיר את העוגן למקומו. לכן זוכרים את היעד המקורי: אם המשתמש לא
   גלל בעצמו מאז, הלחיצה הבאה תשתמש בו ולא במצב החסום — כך שכיבוי והדלקה
   חוזרים בדיוק לאותה נקודה גם בסוף הדף.                                */
let keepMemo = null;
function renderKeep(){
  const a = (keepMemo && Math.abs(window.scrollY - keepMemo.at) < 1) ? keepMemo.chain : grabAnchor();
  render();
  applyAnchor(a);                                  // הפריסה כבר מעודכנת
  keepMemo = a ? { chain:a, at: window.scrollY } : null;
  requestAnimationFrame(()=>{                      // ושוב, אם משהו זז מאוחר
    applyAnchor(a);
    if(keepMemo) keepMemo.at = window.scrollY;
  });
}
window.renderKeep = renderKeep;

window.startDrill = ()=>{
  if(!LANGB.length) return toast('מאגר השפות עדיין ריק','e');
  const fresh=[], done=[];

let searchIdx=null;
function buildIdx(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  SUMS.forEach(s=>{
    const d=document.createElement('div'); d.innerHTML=s.html;
    const nodes=Array.from(d.querySelectorAll('h2'));
    nodes.forEach((h,i)=>{
      let txt='', n=h.nextElementSibling;
      while(n && n.tagName!=='H2'){ txt+=' '+n.textContent; n=n.nextElementSibling; }
      searchIdx.push({sid:s.sid, ti:i, title:h.textContent.trim(), sum:s.title, text:txt.replace(/\s+/g,' ').slice(0,4000)});
    });
  });
  return searchIdx;
}
function doSearch(q){
  q=q.trim(); const box=$('#sres');
  if(q.length<2){ box.hidden=true; return; }
  const idx=buildIdx(); const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
  const hits=[];
  for(const it of idx){
    if(rx.test(it.title)) hits.push({...it, score:3, ctx:it.text.slice(0,110)});
    else { const m=it.text.match(rx); if(m) hits.push({...it, score:1,
      ctx:'…'+it.text.slice(Math.max(0,m.index-60), m.index+90)+'…'}); }
    if(hits.length>60) break;
  }
  hits.sort((a,b)=>b.score-a.score);
  box.innerHTML = hits.length ? hits.slice(0,25).map(h=>`
    <div class="res" onclick="gotoHit('${h.sid}',${h.ti})">
      <b>${h.title.replace(rx,m=>'<mark>'+m+'</mark>')}</b>
      <div class="ctx">${esc(h.sum)} — ${esc(h.ctx).replace(rx,m=>'<mark>'+m+'</mark>')}</div>
    </div>`).join('') : '<div class="empty">לא נמצאו תוצאות</div>';
  box.hidden=false;
}

   או מוזרקות פעם אחת דרך פרמטרים ב-URL.                                */
const CKEY = 'cm-prep-cloud';
const CLOUD_BAKED = { bin:'', key:'' };   // אפשר למלא כאן Access Key אם מעדיפים נוחות
let   syncS = { st:'off', msg:'', at:0, size:0 };

function cloudCfg(){

  if(c.skipAnswers){
    Object.keys(out.exams||{}).forEach(k=>{ delete out.exams[k].answers; });
    Object.keys(out.mt||{}).forEach(k=>{ if(k.charAt(0)==='a') delete out.mt[k]; });
  }

function setSync(st, msg){

function httpMsg(code, body){
  const m = { 401:'מפתח לא תקין (401)', 403:'למפתח אין הרשאה לפעולה הזו (403)',
              404:'לא נמצא Bin עם המזהה הזה (404)', 429:'חריגה ממכסת הבקשות של JSONBin (429)',
              422:'הנתונים נדחו על ידי השרת (422)' };
  return m[code] || ('HTTP ' + code + (body ? ' — ' + String(body).slice(0,120) : ''));
}
async function jbFetch(url, opts){
  const c = cloudCfg();
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign(
    { 'X-Master-Key': c.key, 'X-Access-Key': c.key }, (opts||{}).headers||{}) }));
  if(!r.ok){ let t=''; try{ t = await r.text(); }catch(e){} throw new Error(httpMsg(r.status, t)); }
  return r;
}


function progCount(x){
  if(!x || typeof x!=='object') return 0;
  return Object.keys(x.read||{}).length + Object.keys(x.understood||{}).length +
         Object.keys(x.topics||{}).length + Object.keys(x.exams||{}).length +
         Object.keys(x.bank||{}).length + Object.keys(x.lang||{}).length;
}
/* כל מפתחות ה"התקדמות" של רשומה, בפורמט של mt */
function allKeys(rec){
  const out = [];
  Object.keys(rec.read||{}).forEach(k=>out.push('r:'+k));
  Object.keys(rec.understood||{}).forEach(k=>out.push('u:'+k));
  Object.keys(rec.topics||{}).forEach(k=>out.push('t:'+k));
  Object.keys(rec.exams||{}).forEach(id=>{ out.push('e:'+id);
    Object.keys((rec.exams[id]||{}).answers||{}).forEach(pid=>out.push(akey(id,pid))); });
  Object.keys(rec.bank||{}).forEach(k=>out.push('b:'+k));
  Object.keys(rec.lang||{}).forEach(k=>out.push('c:'+k));
  ['master','notes','examDate'].forEach(k=>out.push(k));
  return out;
}

/* ===================== מנוע המיזוג =====================
   הבעיה הישנה: משיכה מהענן החליפה את כל המצב המקומי, ודחיפה שלחה את כל
   המצב המקומי. כל מכשיר דרס לגמרי את השני — ומכאן "האחוזים חוזרים אחורה"
   ו"מילאתי את אותה תשובה שלוש פעמים".
   הפתרון: מיזוג לכל פריט בנפרד. לכל מפתח בוחרים את הצד עם חותמת הזמן
   החדשה יותר; מפתח שנמחק נחשב "ערך" בפני עצמו, כך שגם ביטול סימון שורד.
   לרשומות ישנות בלי mt נופלים אחורה ל-updatedAt של הרשומה כולה.        */
function keyTs(rec, k, present){
  const t = (rec.mt||{})[k];
  if(typeof t === 'number') return t;
  return present ? (rec.updatedAt || 1) : 0;
}
function mergeMap(prefix, a, b, recA, recB, mt){
  const A = a||{}, B = b||{}, out = {};
  for(const k of new Set(Object.keys(A).concat(Object.keys(B)))){
    const hasA = Object.prototype.hasOwnProperty.call(A, k),
          hasB = Object.prototype.hasOwnProperty.call(B, k);
    const tA = keyTs(recA, prefix+k, hasA), tB = keyTs(recB, prefix+k, hasB);
    const mine = tA >= tB;
    if(mine ? hasA : hasB) out[k] = mine ? A[k] : B[k];
    const t = Math.max(tA, tB); if(t) mt[prefix+k] = t;
  }
  return out;
}
function mergeScalar(k, a, b, recA, recB, mt, def){
  const tA = keyTs(recA, k, a !== undefined && a !== def),
        tB = keyTs(recB, k, b !== undefined && b !== def);
  const t = Math.max(tA, tB); if(t) mt[k] = t;
  return tA >= tB ? a : b;
}
function mergeExams(recA, recB, mt){
  const A = recA.exams||{}, B = recB.exams||{}, out = {};
  for(const id of new Set(Object.keys(A).concat(Object.keys(B)))){
    const ea = A[id], eb = B[id];
    const tA = keyTs(recA, 'e:'+id, !!ea), tB = keyTs(recB, 'e:'+id, !!eb);
    if(!ea && !eb) continue;
    // done / submittedAt נקבעים לפי הצד החדש יותר; elapsed הוא זמן עבודה — לוקחים את המרבי
    const win = (tA >= tB ? ea : eb) || ea || eb;
    const rec = Object.assign({}, win);
    rec.elapsed = Math.max((ea&&ea.elapsed)||0, (eb&&eb.elapsed)||0);
    const t = Math.max(tA, tB); if(t) mt['e:'+id] = t;
    // תשובות: מיזוג פר־סעיף. תשובה שכתבת במכשיר אחד לא נמחקת בגלל
    // שהמכשיר השני עוד לא ראה אותה (וגם לא בגלל מצב "בלי תשובות").
    const ansA = (ea&&ea.answers)||{}, ansB = (eb&&eb.answers)||{};
    const ans = {};
    for(const pid of new Set(Object.keys(ansA).concat(Object.keys(ansB)))){
      const k = akey(id, pid);
      const hasA = Object.prototype.hasOwnProperty.call(ansA, pid),
            hasB = Object.prototype.hasOwnProperty.call(ansB, pid);
      const pA = keyTs(recA, k, hasA), pB = keyTs(recB, k, hasB);
      let v;
      if(pA === pB) v = String(ansA[pid]||'').length >= String(ansB[pid]||'').length ? ansA[pid] : ansB[pid];
      else v = pA > pB ? (hasA ? ansA[pid] : undefined) : (hasB ? ansB[pid] : undefined);
      if(v !== undefined) ans[pid] = v;
      const tp = Math.max(pA, pB); if(tp) mt[k] = tp;
    }
    if(Object.keys(ans).length || (win && win.answers)) rec.answers = ans;
    out[id] = rec;
  }
  return out;
}
/* recA = מקומי, recB = ענן. מחזיר מצב ממוזג חדש. */
function mergeStates(recA, recB){
  const mt = {};
  const out = structuredClone(DEF);
  out.read       = mergeMap('r:', recA.read,       recB.read,       recA, recB, mt);
  out.understood = mergeMap('u:', recA.understood, recB.understood, recA, recB, mt);
  out.topics     = mergeMap('t:', recA.topics,     recB.topics,     recA, recB, mt);
  out.bank       = mergeMap('b:', recA.bank,       recB.bank,       recA, recB, mt);
  out.lang       = mergeMap('c:', recA.lang,       recB.lang,       recA, recB, mt);
  out.exams      = mergeExams(recA, recB, mt);
  out.master   = !!mergeScalar('master',   !!recA.master, !!recB.master, recA, recB, mt, false);
  out.notes    = mergeScalar('notes',    recA.notes||'',    recB.notes||'',    recA, recB, mt, '') || '';
  out.examDate = mergeScalar('examDate', recA.examDate||'', recB.examDate||'', recA, recB, mt, '') || '';
  out.lastView = recA.lastView || 'dash';                 // תמיד מקומי
  out.mt = mt;
  out.updatedAt = Math.max(recA.updatedAt||0, recB.updatedAt||0);
  return out;
}
/* האם המצב הממוזג שונה ממה שיושב בענן — כלומר צריך לדחוף בחזרה.
   stable stringify כדי שסדר מפתחות לא ייחשב לשינוי ויבזבז מכסת בקשות. */
function stable(v){
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort()
    .map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined ? null : v);
}
function differs(merged, cloud){
  const lean = !!cloudCfg().skipAnswers;
  const norm = x => {
    const e = {};
    Object.keys(x.exams||{}).forEach(id=>{
      const r = Object.assign({}, x.exams[id]);
      if(lean) delete r.answers;
      if(r.answers) Object.keys(r.answers).forEach(p=>{ if(!String(r.answers[p]||'').trim()) delete r.answers[p]; });
      e[id] = r;
    });
    return stable({ r:x.read||{}, u:x.understood||{}, t:x.topics||{}, e,
                    b:x.bank||{}, l:x.lang||{},
                    m:!!x.master, n:x.notes||'', d:x.examDate||'' });
  };
  return norm(merged) !== norm(cloud);
}

  try{ localStorage.setItem(KEY+'-bak', JSON.stringify({ at:Date.now(), state:S })); }catch(e){}
}

  adoptState(b.state); refreshChrome(); render(); cloudPush(true); toast('הגיבוי שוחזר');

/* אימוץ מצב שלם מבחוץ (גיבוי / ייבוא קובץ): מחליף את המצב המקומי, וחותם
   חותמת זמן חדשה על כל מפתח — כולל מצבות למה שנעלם — כדי שהאימוץ ינצח
   במיזוג הבא ולא "ייבלע" מול הענן.                                      */
function adoptState(raw){
  const dead = allKeys(S), n = Date.now();
  const next = Object.assign(structuredClone(DEF), raw);
  next.mt = {};
  dead.forEach(k => next.mt[k] = n);
  allKeys(next).forEach(k => next.mt[k] = n);
  next.updatedAt = n;
  S = next; writeLocal();
}

let pulling = false;
/* משיכה = מיזוג, אף פעם לא החלפה. force משמש רק לכפתור "משוך מהענן"
   ואז הענן מנצח בתיקו, אבל עדיין בלי לאבד פריטים שקיימים רק מקומית. */
async function cloudPull(force){
  const c = cloudCfg();
  if(!c.bin || !c.key){ setSync('off'); return false; }
  if(pulling) return false;
  pulling = true; setSync('busy','טוען מהענן…');
  try{
    const r = await jbFetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(c.bin)}/latest`,
                            { headers:{ 'X-Bin-Meta':'false' }, cache:'no-store' });
    let rec = await r.json();
    if(rec && rec.record && !rec.topics) rec = rec.record;   // אם X-Bin-Meta לא כובד
    const looksReal = rec && typeof rec==='object' &&
      ('topics' in rec || 'read' in rec || 'exams' in rec || 'understood' in rec);
    pulledOk = true;
    if(!looksReal){
      setSync('ok','ה-Bin ריק — השמירה הבאה תמלא אותו');
      await cloudPush(true);
      return true;
    }
    if(force) rec.updatedAt = Math.max(rec.updatedAt||0, (S.updatedAt||0) + 1);
    const before = progCount(S);
    const merged = mergeStates(S, rec);
    const changedLocally = differs(merged, S);
    if(changedLocally && before > 0) stashBackup();
    /* טיוטה פתוחה: מה שמוקלד כרגע במסך הוא הטרי ביותר — הוא מנצח את הענן */
    if(EX && merged.exams[EX.e.id]){
      merged.exams[EX.e.id].answers = Object.assign({}, merged.exams[EX.e.id].answers, EX.answers);
      EX.answers = Object.assign({}, merged.exams[EX.e.id].answers);
    }
    S = merged; writeLocal();
    if(changedLocally){
      refreshChrome();
      // לא מרעננים את המסך תוך כדי הקלדה — זה היה מוחק את מה שנכתב באותו רגע
      const a = document.activeElement;
      const typing = a && (a.tagName==='TEXTAREA' || a.tagName==='INPUT');
      if(!typing) render();
    }
    setSync('ok');
    if(differs(merged, rec)) await cloudPush(true);   // הענן החסיר משהו — משלימים לו
    if(changedLocally && progCount(S) !== before) toast('ההתקדמות סונכרנה');
    return true;
  }catch(e){ setSync('err', e.message); return false; }
  finally{ pulling = false; }
}

let pushT, pushing = false, pushQueued = false;
function cloudPush(now){
  const c = cloudCfg();
  if(!c.bin || !c.key){ setSync('off'); return Promise.resolve(false); }
  /* אם המשיכה הראשונה נכשלה (חוסר רשת, מכסת JSONBin) — פעם קודם הדחיפה
     הושתקה לתמיד והכל נשאר תקוע מקומית. עכשיו מנסים למשוך שוב ואז לדחוף. */
  if(!pulledOk && now !== true){
    if(pushQueued) return Promise.resolve(false);
    pushQueued = true;
    return cloudPull(false).finally(()=>{ pushQueued = false; })
      .then(ok => ok ? cloudPush(true) : false);
  }
  clearTimeout(pushT);
  const run = async () => {
    if(pushing){ pushT = setTimeout(run, 800); return false; }
    pushing = true; setSync('busy','שומר לענן…');
    try{
      const body = JSON.stringify(payload());
      syncS.size = body.length;
      await jbFetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(c.bin)}`, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json', 'X-Bin-Versioning':'false' },
        body });
      setSync('ok');
      if(body.length > 90000) toast('שים לב: קובץ הסנכרון גדול (' +
        Math.round(body.length/1024) + 'KB). כדאי לכבות סנכרון תשובות מבחנים.','e');
      return true;
    }catch(e){ setSync('err', e.message); return false; }
    finally{ pushing = false; }
  };
  if(now) return run();
  pushT = setTimeout(run, 1500);
  return Promise.resolve(true);
}
window.cloudPull = cloudPull;
window.cloudPush = (n)=>{ if(n===true) pulledOk = true; return cloudPush(n); };

window.saveCloudCfg = () => {
  const bin = document.getElementById('cf-bin').value.trim();
  const key = document.getElementById('cf-key').value.trim();
  const skipAnswers = document.getElementById('cf-lean').checked;
  if(!bin || !key) return toast('צריך גם Bin ID וגם מפתח','e');
  setCloudCfg({ bin, key, skipAnswers });
  toast('ההגדרות נשמרו — בודק חיבור…');
  cloudPull(false).then(ok => { if(ok) render(); });
  render();
};
window.clearCloudCfg = () => {
  if(!confirm('לנתק את המכשיר הזה מהענן? ההתקדמות המקומית תישאר.')) return;
  localStorage.removeItem(CKEY); setSync('off'); render();
};
window.deviceLink = () => {
  const c = cloudCfg();
  if(!c.bin || !c.key) return toast('קודם הגדר חיבור','e');
  const url = location.origin + location.pathname +
    '?bin=' + encodeURIComponent(c.bin) + '&key=' + encodeURIComponent(c.key);
  navigator.clipboard?.writeText(url).then(
    ()=>toast('הקישור הועתק — פתח אותו במכשיר השני פעם אחת'),
    ()=>prompt('העתק את הקישור:', url));
};

/* ---------- global bridge (inline handlers run in global scope) ---------- */
window.toggleAcc = sid => { openAccs[sid] = !openAccs[sid]; render(); };
window.setAllAcc = on => { openAccs = {}; if(on) SUMS.forEach(s=>openAccs[s.sid]=true); render(); };
window.setMaster = (v, quiet) => { S.master = v; touch('master'); save(); refreshChrome(); if(!quiet) render(); };
window.setNotes  = v => { S.notes = v; touch('notes'); save(); };
window.checkRandom = () => { if(QZ.picked.filter(x=>x!=null).length < QZ.qs.length) return toast('ענה על כל השאלות','e');
  QZ.checked = true; renderRandom(); };
window.hideSol = () => { EX.showSol = false; renderKeep(); };
/* איפוס חייב להשאיר "מצבות" — חותמות זמן חדשות למפתחות שנמחקו — אחרת
   המיזוג הבא היה מחזיר מהענן את כל מה שנמחק.                            */
window.resetAll = () => {
  if(!confirm('לאפס את כל ההתקדמות? פעולה זו אינה הפיכה.')) return;
  stashBackup();
  const dead = allKeys(S), n = Date.now();
  S = structuredClone(DEF);
  dead.forEach(k => S.mt[k] = n);
  S.updatedAt = n; writeLocal();
  const done = () => location.reload();
  if(cloudOn()) cloudPush(true).then(done, done); else done();
};
window.toast = toast;


/* ---------- כפתור צף: חזרה לתוכן העניינים + מד התקדמות קריאה ---------- */
(function fab(){
  const el = document.createElement('button');
  el.id = 'fab'; el.className = 'fab'; el.type = 'button';
  el.setAttribute('aria-label', 'חזרה לראש העמוד ולתוכן העניינים');
  el.title = 'חזרה לתוכן העניינים';
  el.innerHTML = '<span class="ring" aria-hidden="true"></span><span class="ar" aria-hidden="true"></span>';
  el.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const t = document.querySelector('.toc');
    if(t) setTimeout(()=>t.focus?.(), 400);
  });
  document.body.appendChild(el);
  let raf = 0;
  const upd = () => {
    raf = 0;
    const y = window.scrollY || document.documentElement.scrollTop;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    el.style.setProperty('--p', h > 0 ? Math.min(100, Math.round(y * 100 / h)) : 0);
    el.classList.toggle('on', y > 400);
    const bar = document.querySelector('.ret-bar') || document.querySelector('.sticky-sub');
    el.style.bottom = bar ? (Math.round(bar.getBoundingClientRect().height) + 30) + 'px' : '';
  };
  addEventListener('scroll', () => { if(!raf) raf = requestAnimationFrame(upd); }, { passive:true });
  addEventListener('resize', upd, { passive:true });
  window.__fabUpdate = upd; upd();
  if(window.ResizeObserver){ new ResizeObserver(upd).observe(document.body); }
})();

/* ---------- boot ---------- */
$('#tabs').innerHTML = TABS.map(([v,l])=>{
  const badge = v==='summaries'?'<span class="badge" id="tb-sum"></span>'
              : v==='topics'?'<span class="badge" id="tb-top"></span>'
              : v==='exams'?'<span class="badge" id="tb-exam"></span>'
              : v==='bank'?'<span class="badge" id="tb-bank"></span>':'';
  return `<button class="tab" data-v="${v}" onclick="go('${v}')" aria-selected="false">${l}${badge}</button>`;}).join('');
$('#q').addEventListener('input', e=>doSearch(e.target.value));
$('#q').addEventListener('keydown', e=>{ if(e.key==='Escape'){ e.target.value=''; $('#sres').hidden=true; e.target.blur(); }});
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) $('#sres').hidden=true; });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('#ov').hidden) closeQuiz();
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); $('#q').focus(); }
});
(function bootCloud(){
  const u = new URLSearchParams(location.search);
  if(u.get('bin') && u.get('key')){
    setCloudCfg({ bin:u.get('bin').trim(), key:u.get('key').trim() });
    history.replaceState(null, '', location.pathname);
    toast('המכשיר חובר לענן');
  }
  setSync(cloudOn() ? 'busy' : 'off');
  if(cloudOn()) cloudPull(false);
  window.addEventListener('online', ()=>{ if(cloudOn()) cloudPull(false); });

  /* קודם משכנו רק פעם אחת בעליית הדף. לשונית שנשארה פתוחה כל היום המשיכה
     לדחוף תמונת מצב ישנה ובכך "החזירה אחורה" את מה שנעשה במכשיר השני.
     עכשיו מסנכרנים שוב בכל חזרה ללשונית, וגם כל כמה דקות ברקע.          */
  let lastSync = 0;
  const resync = (minGap) => {
    if(!cloudOn() || document.hidden) return;
    const n = Date.now();
    if(n - lastSync < minGap) return;
    lastSync = n; cloudPull(false);
  };
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resync(15000); });
  window.addEventListener('focus', ()=>resync(15000));
  setInterval(()=>resync(120000), 60000);
})();

window.addEventListener('beforeunload', ()=>{
  if(EX){ S.exams[EX.e.id]=Object.assign({},S.exams[EX.e.id],{answers:EX.answers, elapsed:EX.elapsed});
          touch('e:'+EX.e.id); S.updatedAt = Date.now(); }
  writeLocal();   // בלי לחדש חותמת זמן סתם — אחרת סגירת דף תיראה כשינוי
});
render();
})();
