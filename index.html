  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border:1px solid var(--brand-lt);border-radius:12px;padding:8px 12px;margin:0 0 14px;
  box-shadow:0 2px 8px rgba(16,32,45,.08)}
.rd-bar .rd-lbl{font-size:.86rem;color:var(--ink-2);white-space:nowrap}
.rd-bar .rd-lbl b{color:var(--brand-dk)}
.rd-bar .bar{flex:1 1 120px;min-width:100px}
.rd-bar .x{border:0;background:none;cursor:pointer;font-size:1.15rem;line-height:1;color:var(--ink-2);padding:0 4px}
.rd-bar .x:hover{color:var(--err)}
@media(max-width:640px){
  .rd-bar{gap:7px;padding:7px 10px}
  .rd-bar .rd-word{display:none}          /* בנייד משאירים רק את המספרים */
  .rd-bar .bar{flex:1 1 70px;min-width:60px}
}

/* סימון "קראתי" לכל נושא — בכותרות הסיכום ובאקורדיון */
.tmark{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:99px;
  padding:2px 11px;font:700 .72rem/1.6 inherit;cursor:pointer;white-space:nowrap;
  vertical-align:middle;margin-inline-start:10px;transition:background .12s,border-color .12s,color .12s}
.tmark:hover{border-color:var(--brand);color:var(--brand-dk)}
.tmark.on{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.toc li.rd > a{color:var(--ok)}
.toc .toc-m{white-space:nowrap}
.cp-hint{display:block;width:100%;text-align:start;border:1px dashed var(--brand-lt);
  background:var(--brand-pale);color:var(--brand-dk);border-radius:9px;padding:5px 10px;
  font:700 .8rem inherit;cursor:pointer;margin:0 0 8px}
.cp-hint:hover{border-style:solid;border-color:var(--brand)}
@media print{ .rd-bar,.tmark,.cp-hint{display:none!important} }

/* ===== מאגר השאלות (bank) ===== */
.fchips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 13px;font-size:.84rem;
  cursor:pointer;color:var(--ink-2);transition:background .12s,border-color .12s}
.fchip:hover{border-color:var(--brand)}
.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.fchip .cnt{opacity:.75;font-size:.78em;margin-inline-start:4px}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-bottom:16px}
.subj-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;
  transition:border-color .12s, box-shadow .12s}
.subj-cell:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.subj-cell.on{border-color:var(--brand);outline:2px solid var(--brand-lt)}
.subj-cell .sk{font-size:.85rem;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.subj-cell .sk .num{color:var(--ink-2);font-weight:600;font-size:.8rem}
.subj-cell .bar{margin-top:7px}
.bq-card{margin-bottom:14px}
.bq-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bq-head .exlbl{font-weight:800;color:var(--brand-dk);font-size:.86rem;background:var(--brand-pale);
  border:1px solid var(--brand-lt);border-radius:7px;padding:2px 9px}
.bq-ctx{margin:8px 0;border:1px dashed var(--line);border-radius:9px;padding:9px 13px;background:#fcfcfe}
.bq-ctx>summary{cursor:pointer;font-weight:700;color:var(--ink-2);font-size:.87rem}
.bq-ctx[open]>summary{margin-bottom:7px}

/* ===== דריל שפות (drill) ===== */
.drill-wrap{max-width:760px;margin:0 auto}
.drill-lang{direction:ltr;text-align:center;font-size:clamp(1.05rem,2.6vw,1.45rem);padding:26px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin:14px 0;min-height:110px;display:grid;place-items:center;unicode-bidi:isolate;overflow-x:auto}
.drill-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.dbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:15px 10px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:border-color .12s, background .12s;min-height:58px}
.dbtn:hover{border-color:var(--brand)}
.dbtn.hit{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dbtn.miss{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.dbtn.dim{opacity:.45}
.dbtn:disabled{cursor:default}
.drill-fb{text-align:center;min-height:34px;font-weight:700}
.drill-fb .src{font-weight:600;color:var(--ink-2);font-size:.85rem}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--brand-dk)}
@media(max-width:560px){ .drill-btns{grid-template-columns:1fr} .dbtn{min-height:48px} }

/* ===== מצב ערבוב (shuffle) ===== */
.shuf-wrap{max-width:860px;margin:0 auto}
.shuf-prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shuf-acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.shuf-acts .btn{min-width:120px}


/* ---- CM content vocabulary — everything scoped under .summary-body ---- */
:is(.summary-body,.qbody){
  --c-accent:#6d28d9; --c-accent-dk:#4c1d95; --c-accent-lt:#e9e1f8; --c-accent-pale:#f7f4fc;
  --c-ink:#22262b; --c-muted:#5b6570; --c-line:#d9d4e6;
  --c-def-bg:#f5f1fc; --c-def-line:#c9b8ec;
  --c-thm-bg:#eef6f1; --c-thm-line:#a8d4ba;
  --c-warn-bg:#fff6df; --c-warn-line:#e6ca74;
  --c-err-bg:#fbeaea; --c-err-line:#e3a8a8;
  --c-ex-bg:#f2f6fb; --c-ex-line:#b9cfe8;
}
.summary-body *{box-sizing:border-box}
.summary-body{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:26px clamp(16px,4vw,42px) 34px;box-shadow:var(--shadow);color:var(--c-ink);
  line-height:1.62;overflow-x:auto}
.summary-body h1{margin:0 0 6px;text-align:center;font-size:1.9rem;color:var(--c-accent-dk);
  padding-bottom:12px;border-bottom:2px solid var(--c-accent-lt)}
.summary-body .chapter-subtitle{text-align:center;color:var(--c-muted);margin:10px 0 26px;font-size:.95rem}
.summary-body h2{font-size:1.45rem;color:var(--c-accent-dk);margin:36px 0 12px;padding-bottom:6px;
  border-bottom:2px solid var(--c-accent-lt);scroll-margin-top:110px}
.summary-body h3{font-size:1.16rem;color:var(--c-accent-dk);margin:22px 0 8px}
.summary-body h4{font-size:1.02rem;color:var(--c-accent-dk);margin:15px 0 6px}
.summary-body p{margin:7px 0 10px}
.summary-body ul,.summary-body ol{margin:7px 0 12px;padding-right:24px}
.summary-body li{margin:4px 0}
.summary-body section{margin:0}
.summary-body table{border-collapse:collapse;margin:12px 0;font-size:.92rem}
.summary-body th,.summary-body td{border:1px solid var(--c-line);padding:6px 11px;text-align:start}
.summary-body th{background:var(--c-accent-pale);color:var(--c-accent-dk);font-weight:700}
.summary-body mark{background:#ffe9a8;border-radius:3px;padding:0 2px}

/* --- inline math / formal strings (LTR islands inside Hebrew prose) --- */
:is(.summary-body,.qbody) .math{direction:ltr;unicode-bidi:isolate;display:inline-block;
  font-family:"Heebo","STIX Two Math","Cambria Math",serif;white-space:nowrap}
:is(.summary-body,.qbody) .math sub,:is(.summary-body,.qbody) .math sup{line-height:0}
:is(.summary-body,.qbody) .lang-def{direction:ltr;unicode-bidi:isolate;display:block;text-align:center;
  margin:13px auto;padding:10px 16px;background:var(--c-accent-pale);border:1px solid var(--c-accent-lt);
  border-radius:9px;font-size:1.04rem;max-width:100%;overflow-x:auto}
:is(.summary-body,.qbody) .str{direction:ltr;unicode-bidi:isolate;display:inline-block;
  font-family:ui-monospace,Consolas,Monaco,monospace;background:#f1eef7;border:1px solid var(--c-line);
  border-radius:5px;padding:0 5px;font-size:.9em}
:is(.summary-body,.qbody) .term{font-weight:800;color:var(--c-accent-dk)}
:is(.summary-body,.qbody) .comp{border-top:1.5px solid currentColor;padding-top:0;line-height:1.1;display:inline-block}

/* --- callouts --- */
:is(.summary-body,.qbody) .def,:is(.summary-body,.qbody) .thm,:is(.summary-body,.qbody) .lem,:is(.summary-body,.qbody) .note,:is(.summary-body,.qbody) .warn,
:is(.summary-body,.qbody) .ex-box,:is(.summary-body,.qbody) .proof,:is(.summary-body,.qbody) .algo{
  border:1px solid;border-radius:10px;padding:12px 16px;margin:13px 0;
  border-inline-start-width:4px}
:is(.summary-body,.qbody) .def{background:var(--c-def-bg);border-color:var(--c-def-line)}
:is(.summary-body,.qbody) .thm,:is(.summary-body,.qbody) .lem{background:var(--c-thm-bg);border-color:var(--c-thm-line)}
:is(.summary-body,.qbody) .lem::before{content:"למה: ";font-weight:800;color:#1f7a45}
:is(.summary-body,.qbody) .note{background:var(--c-warn-bg);border-color:var(--c-warn-line)}
:is(.summary-body,.qbody) .warn{background:var(--c-err-bg);border-color:var(--c-err-line)}
:is(.summary-body,.qbody) .warn::before{content:"⚠ טעות נפוצה: ";font-weight:800;color:var(--err)}
:is(.summary-body,.qbody) .ex-box{background:var(--c-ex-bg);border-color:var(--c-ex-line)}
:is(.summary-body,.qbody) .ex-box>h4:first-child,:is(.summary-body,.qbody) .algo>h4:first-child{margin-top:0}
:is(.summary-body,.qbody) .proof{background:#fafafa;border-color:#d8d8d8}
:is(.summary-body,.qbody) .proof::before{content:"הוכחה: ";font-weight:800;color:var(--c-accent-dk)}
:is(.summary-body,.qbody) .qed{display:block;text-align:left;font-weight:800;color:var(--c-accent-dk)}
:is(.summary-body,.qbody) .algo{background:var(--c-accent-pale);border-color:var(--c-accent-lt)}

/* claim + verdict (הוכח או הפרך) */
:is(.summary-body,.qbody) .claim{border:1px solid var(--c-line);border-radius:10px;padding:12px 16px;margin:13px 0;
  background:#fcfcfd;border-inline-start:4px solid var(--c-accent)}
:is(.summary-body,.qbody) .verdict{display:inline-block;font-weight:800;font-size:.85rem;border-radius:99px;
  padding:2px 12px;margin-inline-end:8px}
:is(.summary-body,.qbody) .verdict.v-true{background:#e2f3e8;color:#1f7a45;border:1px solid #9ed3b4}
:is(.summary-body,.qbody) .verdict.v-false{background:#fbe6e6;color:#a32626;border:1px solid #e2a3a3}

/* --- automata figures (inline SVG) --- */
:is(.summary-body,.qbody) .fsa{margin:14px auto;text-align:center;direction:ltr}
:is(.summary-body,.qbody) .fsa svg{max-width:100%;height:auto}
:is(.summary-body,.qbody) .fsa .fsa-cap{font-size:.86rem;color:var(--c-muted);margin-top:4px;direction:rtl}
:is(.summary-body,.qbody) svg .st{fill:#fff;stroke:var(--c-accent);stroke-width:1.8}
:is(.summary-body,.qbody) svg .st-acc{fill:var(--c-accent-pale)}
:is(.summary-body,.qbody) svg .tr{fill:none;stroke:var(--c-muted);stroke-width:1.5}
:is(.summary-body,.qbody) svg .lbl{font:600 13px "Heebo",sans-serif;fill:var(--c-ink)}
:is(.summary-body,.qbody) svg .slbl{font:700 14px "Heebo",sans-serif;fill:var(--c-accent-dk);text-anchor:middle;dominant-baseline:central}

/* --- transition tables (always LTR) --- */
:is(.summary-body,.qbody) .ttable{direction:ltr;display:table;margin:12px auto}
:is(.summary-body,.qbody) .ttable th,:is(.summary-body,.qbody) .ttable td{text-align:center;min-width:52px}
:is(.summary-body,.qbody) .ttable td.cur{background:var(--c-accent-lt)}

/* --- grammars --- */
:is(.summary-body,.qbody) .gram{direction:ltr;display:block;width:fit-content;max-width:100%;margin:10px auto;
  background:#faf9fd;border:1px solid var(--c-line);border-radius:9px;padding:9px 18px;overflow-x:auto}
:is(.summary-body,.qbody) .gram .rule{font-family:"Heebo",sans-serif;font-size:1.02rem;padding:1.5px 0;white-space:nowrap}
:is(.summary-body,.qbody) .nt{color:var(--c-accent-dk);font-weight:800}

/* --- derivations / parse trees --- */
:is(.summary-body,.qbody) .deriv{direction:ltr;text-align:left;margin:12px auto;width:fit-content;max-width:100%;
  overflow-x:auto;font-size:.98rem}
:is(.summary-body,.qbody) .deriv ul{list-style:none;padding-left:22px;margin:0;border-left:1.5px solid var(--c-line)}
:is(.summary-body,.qbody) .deriv>ul{border-left:0;padding-left:0}
:is(.summary-body,.qbody) .deriv li{position:relative;padding:1px 0 1px 10px;margin:0}
:is(.summary-body,.qbody) .deriv li::before{content:"";position:absolute;left:-1.5px;top:.85em;width:10px;height:0;
  border-top:1.5px solid var(--c-line)}
:is(.summary-body,.qbody) .deriv>ul>li::before{display:none}

/* --- TM tape --- */
:is(.summary-body,.qbody) .tape{direction:ltr;display:flex;justify-content:center;gap:0;margin:13px 0;flex-wrap:wrap}
:is(.summary-body,.qbody) .tape .cell{width:38px;height:38px;border:1.5px solid var(--c-line);margin-inline-start:-1.5px;
  display:grid;place-items:center;font-family:ui-monospace,Consolas,monospace;font-weight:700;background:#fff}
:is(.summary-body,.qbody) .tape .cell.head{background:var(--c-accent-lt);border-color:var(--c-accent);position:relative;z-index:1}
:is(.summary-body,.qbody) .tape .cell.head::after{content:"▲";position:absolute;top:100%;color:var(--c-accent);font-size:.8rem}
:is(.summary-body,.qbody) .tape .cell.blank{color:#b6bec6}

/* --- configuration steps (⊢) --- */
:is(.summary-body,.qbody) .config-line{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;
  font-size:.95rem;background:#faf9fd;border:1px solid var(--c-line);border-radius:9px;
  padding:9px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
:is(.summary-body,.qbody) .config-line b{color:var(--c-accent-dk)}

/* --- class containment (Chomsky / R-RE) --- */
:is(.summary-body,.qbody) .hier{margin:16px auto;width:fit-content;max-width:100%;text-align:center;direction:ltr}
:is(.summary-body,.qbody) .hier .ring{border:2px solid var(--c-accent-lt);border-radius:16px;padding:14px 22px;background:#fff}
:is(.summary-body,.qbody) .hier .ring>.hlbl{font-weight:800;color:var(--c-accent-dk);margin-bottom:6px;display:block}
:is(.summary-body,.qbody) .hier .ring .ring{background:var(--c-accent-pale)}
:is(.summary-body,.qbody) .hier .ring .ring .ring{background:var(--c-accent-lt)}
:is(.summary-body,.qbody) .hier .ring .ring .ring .ring{background:#dccdf5}

/* --- reductions --- */
:is(.summary-body,.qbody) .reduce{direction:ltr;display:flex;align-items:center;justify-content:center;gap:12px;
  margin:14px 0;flex-wrap:wrap}
:is(.summary-body,.qbody) .reduce .rbox{border:1.8px solid var(--c-accent);border-radius:11px;padding:9px 17px;
  background:var(--c-accent-pale);font-weight:700;min-width:110px;text-align:center}
:is(.summary-body,.qbody) .reduce .rarr{font-size:1.5rem;color:var(--c-accent-dk);font-weight:800}
:is(.summary-body,.qbody) .reduce .rcap{flex-basis:100%;text-align:center;font-size:.88rem;color:var(--c-muted);direction:rtl}

/* --- pumping game steps --- */
:is(.summary-body,.qbody) .pump-steps{counter-reset:ps;margin:12px 18px 12px 0;padding:0;list-style:none}
:is(.summary-body,.qbody) .pump-steps>li{counter-increment:ps;position:relative;padding:8px 44px 8px 12px;margin:7px 0;
  background:#fbfaff;border:1px solid var(--c-line);border-radius:9px}
:is(.summary-body,.qbody) .pump-steps>li::before{content:counter(ps);position:absolute;inset-inline-start:-14px;top:50%;
  transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--c-accent);color:#fff;
  font-weight:800;display:grid;place-items:center;font-size:.9rem}
:is(.summary-body,.qbody) .pump-steps>li[data-who]::after{content:attr(data-who);position:absolute;inset-inline-end:10px;top:8px;
  font-size:.74rem;font-weight:800;color:var(--c-muted)}

/* --- English official-solution blocks inside Hebrew exams --- */
.qbody .ltr-sol{direction:ltr;text-align:left;unicode-bidi:isolate}
.qbody .ltr-sol ul,.qbody .ltr-sol ol{padding-right:0;padding-left:24px}

/* --- defs page --- */
:is(.summary-body,.qbody) .major-langs{padding-right:6px;list-style:none}
:is(.summary-body,.qbody) .major-langs li{padding:3px 0;border-bottom:1px dashed var(--c-line)}
:is(.summary-body,.qbody) .major-langs li:last-child{border-bottom:0}

/* --- two-column helper on wide screens --- */
:is(.summary-body,.qbody) .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){ :is(.summary-body,.qbody) .cols2{grid-template-columns:1fr} }

/* --- containment guards (carried from the OS site) --- */
.summary-body>*{max-width:100%}
.summary-body table{display:table}
.qbody table{display:block;overflow-x:auto;max-width:100%}
@media(max-width:640px){
  .summary-body{padding:18px 14px 24px}
  .summary-body h1{font-size:1.5rem}
  .summary-body h2{font-size:1.25rem}
  :is(.summary-body,.qbody) .tape .cell{width:32px;height:32px}
}
@media print{
  .summary-body{border:0;box-shadow:none;padding:0}
  :is(.summary-body,.qbody) .def,:is(.summary-body,.qbody) .thm,:is(.summary-body,.qbody) .lem,:is(.summary-body,.qbody) .note,:is(.summary-body,.qbody) .warn,
  :is(.summary-body,.qbody) .ex-box,:is(.summary-body,.qbody) .proof,:is(.summary-body,.qbody) .algo{break-inside:avoid}
  .summary-body h2{break-after:avoid}
}

<script type="application/json" id="d-summaries">[{"sid":"ch1","group":"פרקים","title":"פרק 1 — מבוא: מילים, שפות ו־DFA","topics":["מה זה מודל חישובי ומה נלמד בקורס","אלף־בית, מילים ופעולות על מילים","שפות ופעולות על שפות","יסודות קבוצות והוכחת שוויון קבוצות","DFA — ההגדרה הפורמלית","ריצה של DFA: הרחבת המעברים וקבלה","בניית DFA — מונים, זוגיות ו־mod","בניית DFA — תבניות ותת־מחרוזות","מה מצב יכול \"לזכור\" — עקרון הזיכרון הסופי","הוכחת נכונות של DFA — אינווריאנטת מצבים","שפה רגולרית — ההגדרה והתמונה הגדולה"],"html":"<h1>מבוא: מילים, שפות ו־DFA<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 1 (הרצאה 1 + תרגול 1)<\/p>\n\n<section>\n  <h2 id=\"ch1-t0\">מה זה מודל חישובי ומה נלמד בקורס<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">מודל חישובי<\/span> — הגדרה מתמטית מדויקת של \"מכונה\" שמבצעת חישוב.\n    במקום לדבר על מחשב פיזי, מגדירים אובייקט פורמלי (קבוצות ופונקציות) ושואלים:\n    <b>אילו בעיות המודל הזה מסוגל לפתור, ואילו לא?<\/b>\n  <\/div>\n\n  <p>הקורס בנוי כסולם של מודלים, מהחלש אל החזק:<\/p>\n  <div class=\"hier\">\n    <div class=\"ring\"><span class=\"hlbl\">מכונות טיורינג — R, RE<\/span>\n      <div class=\"ring\"><span class=\"hlbl\">אוטומטי מחסנית — שפות חסרות הקשר (CFL)<\/span>\n        <div class=\"ring\"><span class=\"hlbl\">אוטומטים סופיים — שפות רגולריות<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <ul>\n    <li><b>שפות רגולריות<\/b> — מה שאפשר לזהות עם זיכרון סופי קבוע: <span class=\"en\">DFA<\/span>‏, <span class=\"en\">NFA<\/span>‏, ביטויים רגולריים, מינימיזציה, ולמת הניפוח שמוכיחה מתי שפה <em>איננה<\/em> רגולרית.<\/li>\n    <li><b>שפות חסרות הקשר<\/b> — מה שאפשר לזהות עם מחסנית: דקדוקים (<span class=\"en\">CFG<\/span>‏), אוטומטי מחסנית (<span class=\"en\">PDA<\/span>‏), ולמת ניפוח משלהן.<\/li>\n    <li><b>חישוביות<\/b> — מכונות טיורינג, ההבדל בין <b>כריע<\/b> (<span class=\"en\">R<\/span>‏) ל<b>ניתן לזיהוי<\/b> (<span class=\"en\">RE<\/span>‏), רדוקציות, ומשפט רייס — הגבול העקרוני של מה שמחשב יכול להכריע.<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>נקודת מבט שחוזרת בכל המבחן:<\/b> כל נושא בקורס עונה על אחת משתי שאלות —\n    <b>איך בונים<\/b> מזהה לשפה (בנייה\/המרה), או <b>איך מוכיחים שאי־אפשר<\/b>\n    (למות ניפוח, רדוקציות, משפט רייס). כמעט כל סעיף במבחן הוא אחת מהשתיים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t1\">אלף־בית, מילים ופעולות על מילים<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">אלף־בית (Σ)<\/span> — קבוצה סופית ולא ריקה של סימנים. למשל\n    <span class=\"math\">Σ = {a, b}<\/span> או <span class=\"math\">Σ = {0, 1}<\/span>.<br>\n    <span class=\"term\">מילה (word\/string)<\/span> — סדרה סופית של סימנים מ־<span class=\"math\">Σ<\/span>.\n    <span class=\"term\">המילה הריקה<\/span> מסומנת <span class=\"math\">ε<\/span> ואורכה\n    <span class=\"math\">|ε| = 0<\/span>.<br>\n    <span class=\"term\">Σ<sup>*<\/sup><\/span> — קבוצת <em>כל<\/em> המילים הסופיות מעל\n    <span class=\"math\">Σ<\/span>, כולל <span class=\"math\">ε<\/span>;\n    <span class=\"math\">Σ<sup>+<\/sup> = Σ<sup>*<\/sup> ∖ {ε}<\/span>.\n  <\/div>\n\n  <p>פעולות בסיסיות על מילים:<\/p>\n  <ul>\n    <li><b>שרשור<\/b> — <span class=\"math\">u·v<\/span> (או פשוט <span class=\"math\">uv<\/span>): כותבים את <span class=\"math\">v<\/span> אחרי <span class=\"math\">u<\/span>. מתקיים <span class=\"math\">|uv| = |u| + |v|<\/span>, ו־<span class=\"math\">ε<\/span> הוא איבר היחידה: <span class=\"math\">εw = wε = w<\/span>.<\/li>\n    <li><b>חזקה<\/b> — <span class=\"math\">w<sup>k<\/sup><\/span>: שרשור של <span class=\"math\">w<\/span> עם עצמה <span class=\"math\">k<\/span> פעמים; <span class=\"math\">w<sup>0<\/sup> = ε<\/span>.<\/li>\n    <li><b>היפוך<\/b> — <span class=\"math\">w<sup>R<\/sup><\/span>: המילה בסדר הפוך. מילה עם <span class=\"math\">w = w<sup>R<\/sup><\/span> נקראת <b>פלינדרום<\/b>.<\/li>\n    <li><b>מספרי מופעים<\/b> — <span class=\"math\">#<sub>a<\/sub>(w)<\/span>: כמה פעמים האות <span class=\"math\">a<\/span> מופיעה ב־<span class=\"math\">w<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה<\/h4>\n    <p>עבור <span class=\"math\">u = ab<\/span>, <span class=\"math\">v = ba<\/span>‏:\n      <span class=\"math\">uv = abba<\/span>,&nbsp;\n      <span class=\"math\">(uv)<sup>R<\/sup> = abba<\/span> (פלינדרום!),&nbsp;\n      <span class=\"math\">u<sup>2<\/sup> = abab<\/span>,&nbsp;\n      <span class=\"math\">#<sub>a<\/sub>(uv) = 2<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"warn\">אל תבלבלו בין <span class=\"math\">ε<\/span> (מילה ריקה, אורך 0) לבין\n    <span class=\"math\">∅<\/span> (שפה ריקה — קבוצה בלי אף מילה). מתקיים\n    <span class=\"math\">{ε} ≠ ∅<\/span>: השפה <span class=\"math\">{ε}<\/span> מכילה מילה אחת.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t2\">שפות ופעולות על שפות<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">שפה (Language)<\/span> — תת־קבוצה כלשהי\n    <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span>. שפה יכולה להיות סופית, אינסופית, ריקה\n    (<span class=\"math\">∅<\/span>) או כל <span class=\"math\">Σ<sup>*<\/sup><\/span> כולה.\n  <\/div>\n\n  <p>שפות מוגדרות בדרך כלל בכתיב בונה־קבוצות. למשל:<\/p>\n  <div class=\"lang-def\">L₁ = {w ∈ {a,b}<sup>*<\/sup> | #<sub>a<\/sub>(w) = #<sub>b<\/sub>(w)}<\/div>\n\n  <p>פעולות על שפות (שפות הן קבוצות — כל פעולות הקבוצות עובדות, ועוד שתיים מיוחדות):<\/p>\n  <ul>\n    <li><b>איחוד \/ חיתוך \/ משלים<\/b> — <span class=\"math\">L<sub>1<\/sub> ∪ L<sub>2<\/sub><\/span>,\n      <span class=\"math\">L<sub>1<\/sub> ∩ L<sub>2<\/sub><\/span>,\n      <span class=\"math\"><span class=\"comp\">L<\/span> = Σ<sup>*<\/sup> ∖ L<\/span>.<\/li>\n    <li><b>שרשור שפות<\/b> — <span class=\"math\">L<sub>1<\/sub>·L<sub>2<\/sub> = {uv | u ∈ L<sub>1<\/sub>, v ∈ L<sub>2<\/sub>}<\/span>.<\/li>\n    <li><b>חזקה<\/b> — <span class=\"math\">L<sup>k<\/sup><\/span>: שרשור השפה עם עצמה <span class=\"math\">k<\/span> פעמים; <span class=\"math\">L<sup>0<\/sup> = {ε}<\/span>.<\/li>\n    <li><b>כוכב (סגור קלין)<\/b> — <span class=\"math\">L<sup>*<\/sup> = ⋃<sub>k≥0<\/sub> L<sup>k<\/sup><\/span>: כל שרשור סופי (גם ריק) של מילים מהשפה.<\/li>\n    <li><b>היפוך<\/b> — <span class=\"math\">L<sup>R<\/sup> = {w<sup>R<\/sup> | w ∈ L}<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה — כוכב של שפה קטנה<\/h4>\n    <p><span class=\"math\">L = {ab, ba}<\/span>‏:&nbsp;\n      <span class=\"math\">L<sup>*<\/sup><\/span> מכילה את\n      <span class=\"math\">ε, ab, ba, abab, abba, baab, baba, …<\/span>&nbsp;\n      אבל <em>לא<\/em> את <span class=\"math\">a<\/span> או <span class=\"math\">aab<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"note\"><b>שימו לב:<\/b> <span class=\"math\">∅<sup>*<\/sup> = {ε}<\/span> —\n    השרשור הריק תמיד קיים. זו נקודה שחוזרת בהמרות של ביטויים רגולריים\n    (<span class=\"en\">GNFA<\/span>‏) ובשאלות \"נכון\/לא נכון\".<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t3\">יסודות קבוצות והוכחת שוויון קבוצות<\/h2>\n\n  <p>שפות הן קבוצות, ולכן כמעט כל הוכחה בקורס היא בסופו של דבר הוכחה על קבוצות.\n    תרגול 1 מרכז את הכלים:<\/p>\n\n  <div class=\"def\">\n    <span class=\"term\">הכלה<\/span> — <span class=\"math\">A ⊆ B<\/span> אם כל איבר של\n    <span class=\"math\">A<\/span> שייך ל-<span class=\"math\">B<\/span>.\n    <span class=\"term\">שוויון קבוצות<\/span> — <span class=\"math\">A = B<\/span> אם ורק אם\n    <span class=\"math\">A ⊆ B<\/span> וגם <span class=\"math\">B ⊆ A<\/span>.\n  <\/div>\n\n  <div class=\"algo\">\n    <h4>התבנית להוכחת שוויון שפות (חוזרת בכל המבחן!)<\/h4>\n    <ol>\n      <li><b>כיוון ⊆:<\/b> \"תהי <span class=\"math\">w ∈ A<\/span>\" — מפרקים את <span class=\"math\">w<\/span> לפי הגדרת <span class=\"math\">A<\/span>, ומראים שהיא מקיימת את הגדרת <span class=\"math\">B<\/span>.<\/li>\n      <li><b>כיוון ⊇:<\/b> \"תהי <span class=\"math\">w ∈ B<\/span>\" — ובונים ממנה את הצורה שדורשת <span class=\"math\">A<\/span>.<\/li>\n    <\/ol>\n    <p class=\"small\">כשמוכיחים ש-<span class=\"math\">L(A) = L<\/span> עבור אוטומט — זה בדיוק אותו מבנה: ריצה מקבלת ⇔ תנאי השפה.<\/p>\n  <\/div>\n\n  <p>זהויות שימושיות שכדאי לשלוף בלי לחשוב: דה-מורגן\n    <span class=\"math\">(<span class=\"comp\">A ∪ B<\/span>) = <span class=\"comp\">A<\/span> ∩ <span class=\"comp\">B<\/span><\/span>,\n    פילוג, ו-<span class=\"math\">A ∖ B = A ∩ <span class=\"comp\">B<\/span><\/span> —\n    האחרונה הופכת כל \"הפרש\" לחיתוך, ולכן סגירות לחיתוך ולמשלים גוררת סגירות להפרש.<\/p>\n\n  <div class=\"warn\">בכתיב <span class=\"math\">{w | תנאי}<\/span> הקבוצה מכילה <em>כל<\/em> מילה שמקיימת את התנאי —\n    גם את אלה שלא \"מרגישות טבעיות\". למשל <span class=\"math\">ε<\/span> מקיימת כמעט כל תנאי ריק\n    (\"לכל תו…\" מתקיים באופן ריק). בדקו תמיד את <span class=\"math\">ε<\/span> ואת מילים באורך 1.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t4\">DFA — ההגדרה הפורמלית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">אוטומט סופי דטרמיניסטי (DFA)<\/span> — חמישייה\n    <span class=\"math\">A = (Q, Σ, δ, q<sub>s<\/sub>, F)<\/span>:\n    <ul>\n      <li><span class=\"math\">Q<\/span> — קבוצה <b>סופית<\/b> של מצבים.<\/li>\n      <li><span class=\"math\">Σ<\/span> — אלף־בית הקלט.<\/li>\n      <li><span class=\"math\">δ: Q × Σ → Q<\/span> — פונקציית המעברים: לכל מצב ולכל אות — בדיוק מצב עוקב אחד.<\/li>\n      <li><span class=\"math\">q<sub>s<\/sub> ∈ Q<\/span> — מצב התחלתי.<\/li>\n      <li><span class=\"math\">F ⊆ Q<\/span> — מצבים מקבלים.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>\"דטרמיניסטי\" פירושו ש-<span class=\"math\">δ<\/span> היא <b>פונקציה מלאה<\/b>: אין שתי אפשרויות,\n    ואין \"אין מעבר\" — מכל מצב יוצא בדיוק חץ אחד לכל אות. בציור: עיגול = מצב, עיגול כפול = מקבל,\n    חץ נכנס חופשי = המצב ההתחלתי.<\/p>\n\n  <div class=\"fsa\"><svg viewBox=\"0 0 300 130\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n    <path class=\"tr\" d=\"M10,65 L52,65\" marker-end=\"url(#arr)\"\/>\n    <circle class=\"st st-acc\" cx=\"80\" cy=\"65\" r=\"20\"\/>\n    <circle class=\"st st-acc\" cx=\"80\" cy=\"65\" r=\"25\"\/>\n    <text class=\"slbl\" x=\"80\" y=\"65\">q₀<\/text>\n    <circle class=\"st\" cx=\"220\" cy=\"65\" r=\"25\"\/>\n    <text class=\"slbl\" x=\"220\" y=\"65\">q₁<\/text>\n    <path class=\"tr\" d=\"M100,53 C135,30 165,30 200,53\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"150\" y=\"32\" text-anchor=\"middle\">1<\/text>\n    <path class=\"tr\" d=\"M200,77 C165,100 135,100 100,77\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"150\" y=\"112\" text-anchor=\"middle\">1<\/text>\n    <path class=\"tr\" d=\"M68,44 C58,18 102,18 92,44\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"80\" y=\"14\" text-anchor=\"middle\">0<\/text>\n    <path class=\"tr\" d=\"M208,44 C198,18 242,18 232,44\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"220\" y=\"14\" text-anchor=\"middle\">0<\/text>\n  <\/svg><div class=\"fsa-cap\">‏DFA לשפה \"מספר זוגי של 1-ים\": שני מצבים, q₀ מקבל<\/div><\/div>\n\n  <p>ואותו אוטומט כטבלת מעברים (הצורה שנוחה לחישובי המשך — מינימיזציה, NFA→DFA):<\/p>\n  <table class=\"ttable\">\n    <tr><th>δ<\/th><th>0<\/th><th>1<\/th><\/tr>\n    <tr><th>→ *q₀<\/th><td>q₀<\/td><td>q₁<\/td><\/tr>\n    <tr><th>q₁<\/th><td>q₁<\/td><td>q₀<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t5\">ריצה של DFA: הרחבת המעברים וקבלה<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">הרחבת פונקציית המעברים<\/span> — <span class=\"math\">δ′: Q × Σ<sup>*<\/sup> → Q<\/span>\n    מוגדרת באינדוקציה: <span class=\"math\">δ′(q, ε) = q<\/span>, ו-<span class=\"math\">δ′(q, wσ) = δ(δ′(q, w), σ)<\/span>.<br>\n    <span class=\"term\">קבלה<\/span> — <span class=\"math\">A<\/span> מקבל את <span class=\"math\">w<\/span> אם\n    <span class=\"math\">δ′(q<sub>s<\/sub>, w) ∈ F<\/span>.\n    <span class=\"term\">שפת האוטומט<\/span> — <span class=\"math\">L(A) = {w | δ′(q<sub>s<\/sub>, w) ∈ F}<\/span>.\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>מעקב ריצה<\/h4>\n    <p>באוטומט הזוגיות למעלה, על הקלט <span class=\"math\">w = 1011<\/span>:<\/p>\n    <div class=\"config-line\">q₀ —1→ q₁ —0→ q₁ —1→ q₀ —1→ q₁<\/div>\n    <p>המצב הסופי <span class=\"math\">q₁ ∉ F<\/span> — המילה נדחית (יש בה שלושה 1-ים). <\/p>\n  <\/div>\n\n  <div class=\"note\"><b>שלוש עובדות שקל לשכוח:<\/b>\n    (1) ‏<span class=\"math\">ε ∈ L(A)<\/span> אם ורק אם <span class=\"math\">q<sub>s<\/sub> ∈ F<\/span>.\n    (2) ריצה של DFA <b>לעולם לא נתקעת<\/b> — תמיד יש בדיוק מסלול אחד לכל מילה.\n    (3) ‏<span class=\"math\">L(A) = ∅<\/span> אמ\"מ אין מצב מקבל <b>נגיש<\/b> מ-<span class=\"math\">q<sub>s<\/sub><\/span>\n    — זו בדיקת הגישוּת שמאחורי <span class=\"math\">E<sub>DFA<\/sub> ∈ R<\/span> בהמשך הקורס.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t6\">בניית DFA — מונים, זוגיות ו־mod<\/h2>\n\n  <p>משפחת הבניות הראשונה: כשהתנאי הוא <b>ספירה עם שארית<\/b>, המצבים הם בדיוק השאריות.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">L = {w | #₁(w) mod 3 = 0}<\/span><\/h4>\n    <p>שלושה מצבים <span class=\"math\">q₀, q₁, q₂<\/span> = \"כמה 1-ים ראינו, mod 3\".\n      קריאת <span class=\"math\">1<\/span> מקדמת את השארית; קריאת <span class=\"math\">0<\/span> נשארת במקום.\n      מקבל: <span class=\"math\">F = {q₀}<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>שני מונים במקביל — מכפלת תנאים<\/h4>\n    <p>עבור <span class=\"math\">L₃ = {0<sup>i<\/sup>1<sup>j<\/sup> | i mod 3 = 1 and j mod 2 = 1}<\/span> (מתרגול 2):\n      המצב זוכר גם את שלב הקריאה (עדיין ב-0-ים \/ עברנו ל-1-ים \/ שבור) וגם את שתי השאריות.\n      זו תבנית \"מכפלת אוטומטים\" ידנית — <span class=\"math\">Q = שלבים × שאריות<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"note\"><b>כלל אצבע:<\/b> אם התנאי מדבר על \"כמה\", שאלו — האם הספירה <b>חסומה<\/b> (או מודולרית)?\n    אם כן — DFA עם מצב לכל ערך אפשרי. אם הספירה לא חסומה (למשל <span class=\"math\">#₀ = #₁<\/span>) —\n    שום מספר סופי של מצבים לא יספיק, וזה בדיוק מה שנוכיח בפרק 5 עם למת הניפוח.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t7\">בניית DFA — תבניות ותת־מחרוזות<\/h2>\n\n  <p>משפחת הבניות השנייה: תנאים על <b>מבנה<\/b> המילה — מתחילה ב-, מסתיימת ב-, מכילה.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">L₁ = {w | w does not include 00 as a substring}<\/span> (מתרגול 2)<\/h4>\n    <p>המצבים זוכרים את \"כמה מהתבנית כבר ראינו זה עתה\":\n      <span class=\"math\">q<sub>ε<\/sub><\/span> — התו האחרון אינו 0;\n      <span class=\"math\">q₀<\/span> — התו האחרון 0;\n      <span class=\"math\">q₀₀<\/span> — ראינו 00 (מלכודת, לא מקבל).\n      כל המצבים פרט למלכודת מקבלים.<\/p>\n    <div class=\"fsa\"><svg viewBox=\"0 0 420 120\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n      <path class=\"tr\" d=\"M8,60 L32,60\" marker-end=\"url(#arr)\"\/>\n      <circle class=\"st st-acc\" cx=\"60\" cy=\"60\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"60\" cy=\"60\" r=\"25\"\/>\n      <text class=\"slbl\" x=\"60\" y=\"60\">qε<\/text>\n      <circle class=\"st st-acc\" cx=\"200\" cy=\"60\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"200\" cy=\"60\" r=\"25\"\/>\n      <text class=\"slbl\" x=\"200\" y=\"60\">q₀<\/text>\n      <circle class=\"st\" cx=\"345\" cy=\"60\" r=\"25\"\/>\n      <text class=\"slbl\" x=\"345\" y=\"60\">q₀₀<\/text>\n      <path class=\"tr\" d=\"M85,53 C120,35 145,35 176,53\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"131\" y=\"35\" text-anchor=\"middle\">0<\/text>\n      <path class=\"tr\" d=\"M177,70 C148,86 116,86 86,69\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"131\" y=\"100\" text-anchor=\"middle\">1<\/text>\n      <path class=\"tr\" d=\"M225,60 L317,60\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"270\" y=\"50\" text-anchor=\"middle\">0<\/text>\n      <path class=\"tr\" d=\"M48,42 C38,16 82,16 72,42\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"60\" y=\"12\" text-anchor=\"middle\">1<\/text>\n      <path class=\"tr\" d=\"M333,42 C323,16 367,16 357,42\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"345\" y=\"12\" text-anchor=\"middle\">0,1<\/text>\n    <\/svg><div class=\"fsa-cap\">מצב = הרישא המסוכנת שנקראה זה עתה; q₀₀ — מצב מלכודת<\/div><\/div>\n  <\/div>\n\n  <div class=\"note\"><b>מצב מלכודת (sink):<\/b> ברגע שהתנאי הופר סופית (או הובטח סופית) — עוברים למצב\n    שכל המעברים שלו לעצמו. אל תשכחו לצייר את הלולאות שלו: <span class=\"math\">δ<\/span> חייבת להיות מלאה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t8\">מה מצב יכול \"לזכור\" — עקרון הזיכרון הסופי<\/h2>\n\n  <p>האינטואיציה המרכזית של כל חצי הקורס הראשון: <b>מצב = כל מה שהאוטומט יודע על העבר<\/b>.\n    ל-DFA יש מספר קבוע של מצבים, ולכן הוא זוכר רק <b>כמות חסומה של מידע<\/b>, לא תלויה באורך הקלט.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>\"האות השמינית מהסוף\" (בסיס לתרגול 4)<\/h4>\n    <p>‏<span class=\"math\">L = {w = x1y | x,y ∈ Σ<sup>*<\/sup>, |y| = 7}<\/span> — האות במקום השמיני מהסוף היא 1.\n      DFA חייב לזכור את <b>8 האותיות האחרונות<\/b> — כי כל אחת מהן עלולה להתברר כ\"שמינית מהסוף\".\n      לכן דרושים <span class=\"math\">2<sup>8<\/sup><\/span> מצבים (חלון הזזה), ואפשר להוכיח שאי אפשר עם פחות.\n      בפרק 3 נראה שה-NFA מסתדר עם 9 מצבים — זה המחיר\/רווח של אי-דטרמיניזם.<\/p>\n  <\/div>\n\n  <div class=\"thm\">כל מידע שנחוץ להכרעה ואפשר לתחום אותו מראש (שארית, חלון אחרון, דגלים) — ניתן לקידוד במצבים.\n    מידע שגדל עם הקלט (מונה לא חסום, השוואת שני חצאים) — לא. ההוכחה הפורמלית לכך: למת הניפוח (פרק 5)\n    ומחלקות שקילות (פרק 4).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t9\">הוכחת נכונות של DFA — אינווריאנטת מצבים<\/h2>\n\n  <p>במבחן (למשל 2024א ש1.2) תתבקשו \"להוכיח בעזרת <span class=\"math\">A<\/span>\" — הכלי הוא\n    <b>משמעות מדויקת לכל מצב<\/b>:<\/p>\n\n  <div class=\"algo\">\n    <h4>תבנית ההוכחה<\/h4>\n    <ol>\n      <li>לכל מצב <span class=\"math\">q<\/span> מנסחים אינווריאנטה: <span class=\"math\">δ′(q<sub>s<\/sub>, w) = q ⟺ P<sub>q<\/sub>(w)<\/span> — תכונה מדויקת של המילים שמגיעות אליו.<\/li>\n      <li>מוכיחים באינדוקציה על <span class=\"math\">|w|<\/span>: בסיס — <span class=\"math\">ε<\/span> מקיימת את <span class=\"math\">P<sub>q_s<\/sub><\/span>; צעד — כל מעבר <span class=\"math\">δ(q,σ)=p<\/span> משמר את התכונה.<\/li>\n      <li>מסכמים: <span class=\"math\">L(A) = ⋃<sub>q∈F<\/sub> {w | P<sub>q<\/sub>(w)}<\/span> — בדיוק השפה הרצויה.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה קצרה<\/h4>\n    <p>באוטומט הזוגיות: <span class=\"math\">P<sub>q₀<\/sub>(w) ⟺ #₁(w)<\/span> זוגי,\n      <span class=\"math\">P<sub>q₁<\/sub>(w) ⟺ #₁(w)<\/span> אי-זוגי.\n      צעד האינדוקציה: קריאת 0 לא משנה את <span class=\"math\">#₁<\/span>; קריאת 1 הופכת זוגיות — בדיוק המעברים.\n      לכן <span class=\"math\">L(A) = {w | #₁(w) זוגי}<\/span>. <span class=\"qed\">∎<\/span><\/p>\n  <\/div>\n\n  <div class=\"note\">בקורס הזה מקובל ומותר לכתוב הוכחות כאלה בקצרה (\"המצב סופר את... והמעברים משמרים\")\n    — אבל חובה שהאינווריאנטה עצמה תהיה כתובה במדויק. רוב הנקודות יורדות על אינווריאנטה מעורפלת.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t10\">שפה רגולרית — ההגדרה והתמונה הגדולה<\/h2>\n\n  <div class=\"def\"><span class=\"term\">שפה רגולרית<\/span> — שפה <span class=\"math\">L<\/span> שקיים\n    אוטומט סופי (DFA) המזהה אותה: <span class=\"math\">L(A) = L<\/span>.\n    את מחלקת כל השפות הרגולריות מסמנים לעיתים <span class=\"math\">REG<\/span>.<\/div>\n\n  <p>בפרקים הבאים נצבור עוד שלוש דרכים שקולות להגדיר את אותה מחלקה בדיוק:<\/p>\n  <ul>\n    <li><b>NFA<\/b> — אוטומט לא-דטרמיניסטי (פרק 2–3): נוח פי כמה לבנייה.<\/li>\n    <li><b>ביטוי רגולרי<\/b> (פרק 3): נוח לתיאור.<\/li>\n    <li><b>דקדוק רגולרי<\/b> (בהמשך): הגשר לדקדוקים חסרי הקשר.<\/li>\n  <\/ul>\n  <p>שקילות ארבע ההגדרות היא בין התוצאות המרכזיות של הקורס, וההמרות ביניהן\n    (subset construction, GNFA, SRG) הן חומר מבחן קבוע — כולן מופיעות בדף הנוסחאות.<\/p>\n\n  <div class=\"note\"><b>מה שווה לזכור מהפרק:<\/b> ההבחנה בין ספירה חסומה (רגולרי) ללא-חסומה (לא);\n    התבנית \"מצב = משמעות + אינדוקציה\" להוכחות; ושהמלכודות הקלאסיות במבחן הן כמעט תמיד\n    <span class=\"math\">ε<\/span>, מצב מלכודת חסר, או <span class=\"math\">δ<\/span> לא מלאה.<\/div>\n<\/section>\n"},{"sid":"ch2","group":"פרקים","title":"פרק 2 — פעולות רגולריות ו־NFA","topics":["תכונות סגור — הרעיון וארגז הכלים","משלים — היפוך המצבים המקבלים ב־DFA","בניית המכפלה — חיתוך, איחוד והפרש","NFA — ההגדרה הפורמלית","קבלה ב־NFA — ריצות אפשריות וניחוש","מעברי ε וסגירת ε","בניית תת־הקבוצות: NFA ← DFA","נכונות הבנייה והמחיר המעריכי","סגור לאיחוד, שרשור וכוכב — בניות NFA","איך כותבים הוכחת סגירות במבחן","טעויות קלאסיות סביב סגירות ו־NFA"],"html":"<h1>פעולות רגולריות ו־NFA<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 2 (הרצאה 2 + תרגול 2)<\/p>\n\n<section>\n  <h2 id=\"ch2-t0\">תכונות סגור — הרעיון וארגז הכלים<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">סגירות (Closure)<\/span> — מחלקת שפות <span class=\"math\">C<\/span> <b>סגורה<\/b> לפעולה\n    <span class=\"math\">op<\/span> אם הפעלת הפעולה על שפות מהמחלקה תמיד מחזירה שפה מהמחלקה:\n    <span class=\"math\">L₁, L₂ ∈ C ⟹ op(L₁, L₂) ∈ C<\/span>.\n  <\/div>\n\n  <p>המחלקה הרגולרית סגורה לשלל פעולות, וכל סגירות היא <b>כלי הוכחה דו-כיווני<\/b>:<\/p>\n  <ul>\n    <li><b>כיוון הבנייה:<\/b> להוכיח ששפה מסובכת רגולרית — מרכיבים אותה משפות פשוטות בפעולות סגורות (כך בנויים הפתרונות של שאלה 1 בכל מבחני 2023–2024).<\/li>\n    <li><b>כיוון השלילה:<\/b> להוכיח ששפה <em>איננה<\/em> רגולרית — מניחים שהיא כן, מפעילים פעולות סגורות עד שמגיעים לשפה שידוע שאיננה רגולרית, וסתירה (כך עובדות שאלות \"הוכיחו שלא ח\"ה\" עם הצבות).<\/li>\n  <\/ul>\n\n  <table>\n    <tr><th>פעולה<\/th><th>רגולריות סגורות?<\/th><th>הבנייה<\/th><\/tr>\n    <tr><td>משלים <span class=\"math\"><span class=\"comp\">L<\/span><\/span><\/td><td>כן<\/td><td>היפוך <span class=\"math\">F<\/span> (על DFA!)<\/td><\/tr>\n    <tr><td>חיתוך <span class=\"math\">L₁ ∩ L₂<\/span><\/td><td>כן<\/td><td>מכפלה<\/td><\/tr>\n    <tr><td>איחוד <span class=\"math\">L₁ ∪ L₂<\/span><\/td><td>כן<\/td><td>מכפלה \/ NFA<\/td><\/tr>\n    <tr><td>הפרש <span class=\"math\">L₁ ∖ L₂<\/span><\/td><td>כן<\/td><td><span class=\"math\">L₁ ∩ <span class=\"comp\">L₂<\/span><\/span><\/td><\/tr>\n    <tr><td>שרשור <span class=\"math\">L₁·L₂<\/span><\/td><td>כן<\/td><td>NFA עם ε<\/td><\/tr>\n    <tr><td>כוכב <span class=\"math\">L<sup>*<\/sup><\/span><\/td><td>כן<\/td><td>NFA עם ε<\/td><\/tr>\n    <tr><td>היפוך <span class=\"math\">L<sup>R<\/sup><\/span><\/td><td>כן<\/td><td>היפוך חיצים + החלפת התחלה\/קבלה<\/td><\/tr>\n    <tr><td>הצבה רגולרית <span class=\"math\">f(L)<\/span><\/td><td>כן<\/td><td>הרכבת אוטומטים\/רגקסים<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t1\">משלים — היפוך המצבים המקבלים ב־DFA<\/h2>\n\n  <div class=\"thm\">אם <span class=\"math\">L<\/span> רגולרית אז <span class=\"math\"><span class=\"comp\">L<\/span> = Σ<sup>*<\/sup> ∖ L<\/span> רגולרית.\n    <b>בנייה:<\/b> בהינתן DFA <span class=\"math\">A = (Q, Σ, δ, q<sub>s<\/sub>, F)<\/span> עם <span class=\"math\">L(A) = L<\/span>,\n    האוטומט <span class=\"math\">A′ = (Q, Σ, δ, q<sub>s<\/sub>, Q ∖ F)<\/span> מקיים\n    <span class=\"math\">L(A′) = <span class=\"comp\">L<\/span><\/span>.<\/div>\n\n  <p>הנימוק בן שורה: לכל מילה יש ריצה <b>יחידה<\/b> ב-DFA, שמסתיימת במצב מסוים —\n    היא מתקבלת ב-<span class=\"math\">A′<\/span> אם ורק אם נדחתה ב-<span class=\"math\">A<\/span>.<\/p>\n\n  <div class=\"warn\">ההיפוך עובד <b>רק על DFA<\/b> (ורק כשהוא שלם!). ב-NFA מילה מתקבלת אם\n    <em>קיימת<\/em> ריצה מקבלת — היפוך המצבים המקבלים לא הופך \"קיימת מקבלת\" ל\"כל הריצות דוחות\".\n    זו אחת הטעויות הנפוצות במבחן: כדי לקחת משלים של NFA, קודם ממירים ל-DFA (בבניית תת-הקבוצות) ורק אז הופכים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t2\">בניית המכפלה — חיתוך, איחוד והפרש<\/h2>\n\n  <div class=\"algo\">\n    <h4>Product construction<\/h4>\n    <p>בהינתן <span class=\"math\">A₁ = (Q₁, Σ, δ₁, s₁, F₁)<\/span> ו-<span class=\"math\">A₂ = (Q₂, Σ, δ₂, s₂, F₂)<\/span>,\n      נבנה אוטומט שמריץ את שניהם <b>במקביל<\/b>:<\/p>\n    <div class=\"lang-def\">Q = Q₁ × Q₂&nbsp;,&nbsp; δ((p,q), σ) = (δ₁(p,σ), δ₂(q,σ))&nbsp;,&nbsp; q<sub>s<\/sub> = (s₁, s₂)<\/div>\n    <ul>\n      <li><b>חיתוך:<\/b> <span class=\"math\">F = F₁ × F₂<\/span> — שניהם חייבים לקבל.<\/li>\n      <li><b>איחוד:<\/b> <span class=\"math\">F = (F₁ × Q₂) ∪ (Q₁ × F₂)<\/span> — מספיק אחד.<\/li>\n      <li><b>הפרש:<\/b> <span class=\"math\">F = F₁ × (Q₂ ∖ F₂)<\/span> — הראשון מקבל והשני דוחה.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>מתרגול 2<\/h4>\n    <p>‏<span class=\"math\">L₂ = {w | #₀(w) is even <b>and<\/b> #₁(w) = 2}<\/span>:\n      אוטומט הזוגיות (2 מצבים) × אוטומט הספירה-עד-2 (4 מצבים: 0,1,2,יותר) —\n      8 מצבים מהצורה <span class=\"math\">(זוגיות, מונה)<\/span>, מקבלים: <span class=\"math\">(זוגי, 2)<\/span>.\n      עבור \"or\" — אותה מכפלה בדיוק, רק <span class=\"math\">F<\/span> משתנה.<\/p>\n  <\/div>\n\n  <div class=\"note\">המכפלה היא הבנייה שעובדת <b>בלי ניחושים<\/b> — היא נשארת דטרמיניסטית. לכן זו\n    גם הדרך היחידה מבין הבניות בפרק שמכבדת משלים והפרש ישירות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t3\">NFA — ההגדרה הפורמלית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">אוטומט סופי לא-דטרמיניסטי (NFA)<\/span> — חמישייה\n    <span class=\"math\">B = (Q, Σ, δ, q<sub>s<\/sub>, F)<\/span> שבה פונקציית המעברים מחזירה <b>קבוצת<\/b> מצבים\n    ומותר לה לקרוא גם את המילה הריקה:\n    <div class=\"lang-def\">δ: Q × Σ<sub>ε<\/sub> → P(Q)&nbsp;&nbsp;,&nbsp;&nbsp;Σ<sub>ε<\/sub> = Σ ∪ {ε}<\/div>\n  <\/div>\n\n  <p>המשמעות בציור: מאותו מצב מותר שיצאו כמה חיצים עם אותה אות, מותר שלא יצא אף חץ\n    (<span class=\"math\">δ(q,σ) = ∅<\/span> — הריצה \"נתקעת\"), ומותר חץ מסומן <span class=\"math\">ε<\/span>\n    שנלקח בלי לקרוא קלט.<\/p>\n\n  <div class=\"fsa\"><svg viewBox=\"0 0 430 110\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n    <path class=\"tr\" d=\"M8,55 L30,55\" marker-end=\"url(#arr)\"\/>\n    <circle class=\"st\" cx=\"58\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"58\" y=\"55\">q₀<\/text>\n    <circle class=\"st\" cx=\"185\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"185\" y=\"55\">q₁<\/text>\n    <circle class=\"st\" cx=\"300\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"300\" y=\"55\">q₂<\/text>\n    <circle class=\"st st-acc\" cx=\"400\" cy=\"55\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"400\" cy=\"55\" r=\"25\"\/>\n    <text class=\"slbl\" x=\"400\" y=\"55\">q₃<\/text>\n    <path class=\"tr\" d=\"M46,35 C36,10 80,10 70,35\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"58\" y=\"8\" text-anchor=\"middle\">0,1<\/text>\n    <path class=\"tr\" d=\"M83,55 L157,55\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"120\" y=\"45\" text-anchor=\"middle\">1<\/text>\n    <path class=\"tr\" d=\"M210,55 L272,55\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"241\" y=\"45\" text-anchor=\"middle\">0,ε<\/text>\n    <path class=\"tr\" d=\"M325,55 L372,55\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"348\" y=\"45\" text-anchor=\"middle\">1<\/text>\n  <\/svg><div class=\"fsa-cap\">‏NFA (מסגנון סיפסר): מקבל מילים שמכילות 11 או 101 — הלולאה מנחשת מתי מתחילה התבנית<\/div><\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t4\">קבלה ב־NFA — ריצות אפשריות וניחוש<\/h2>\n\n  <div class=\"def\"><span class=\"term\">קבלה ב-NFA<\/span> — ‏<span class=\"math\">B<\/span> מקבל את <span class=\"math\">w<\/span>\n    אם <b>קיימת<\/b> ריצה — בחירה חוקית אחת של מעברים (כולל מעברי <span class=\"math\">ε<\/span>) —\n    שמסתיימת במצב מקבל אחרי קריאת כל <span class=\"math\">w<\/span>.\n    מילה נדחית רק אם <b>כל<\/b> הריצות נתקעות או מסתיימות במצב לא-מקבל.<\/div>\n\n  <p>שתי דרכים שקולות לחשוב על זה:<\/p>\n  <ul>\n    <li><b>ניחוש ואימות:<\/b> האוטומט \"מנחש\" ברגעי הבחירה, ומספיק שקיים ניחוש מוצלח. נוח לתכנון:\n      \"ננחש איפה מתחילה הסיפא \/ איפה עמדת השוני \/ מהי החלוקה\".<\/li>\n    <li><b>קבוצת מצבים חיה:<\/b> אחרי כל אות מחזיקים את קבוצת <em>כל<\/em> המצבים האפשריים.\n      זו בדיוק נקודת המבט שהופכת לבניית תת-הקבוצות.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>למה NFA מקל על החיים<\/h4>\n    <p>\"האות השלישית מהסוף היא 1\": ה-NFA יושב בלולאה, מנחש ברגע מסוים \"מכאן נשארו בדיוק 3 אותיות\",\n      קורא 1 ואז שתי אותיות — 4 מצבים בלבד, לעומת <span class=\"math\">2³<\/span> חלונות ב-DFA.\n      הניחוש מוצלח ⟺ המילה בשפה.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t5\">מעברי ε וסגירת ε<\/h2>\n\n  <div class=\"def\"><span class=\"term\">סגירת ε<\/span> — עבור קבוצת מצבים <span class=\"math\">R<\/span>:\n    <span class=\"math\">E(R)<\/span> = כל המצבים שנגישים ממצבי <span class=\"math\">R<\/span>\n    באמצעות אפס או יותר מעברי <span class=\"math\">ε<\/span> בלבד (כולל <span class=\"math\">R<\/span> עצמה).<\/div>\n\n  <p>מעברי <span class=\"math\">ε<\/span> הם \"תזוזות חינם\": הם מאפשרים לחבר רכיבים בלי לצרוך קלט —\n    הדבק של בניות האיחוד, השרשור והכוכב שנראה בהמשך. בכל חישוב של \"איפה אנחנו יכולים להיות\"\n    חייבים לסגור ב-<span class=\"math\">E(·)<\/span>: אחרי המצב ההתחלתי, ואחרי כל צריכת אות.<\/p>\n\n  <div class=\"warn\">לשכוח את סגירת ה-ε של <b>המצב ההתחלתי<\/b> (<span class=\"math\">E(q<sub>s<\/sub>)<\/span>)\n    היא טעות ההמרה הנפוצה ביותר — היא משנה אפילו את השאלה אם <span class=\"math\">ε<\/span> בשפה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t6\">בניית תת־הקבוצות: NFA ← DFA<\/h2>\n\n  <div class=\"algo\">\n    <h4>Subset construction (מדף הנוסחאות)<\/h4>\n    <p>בהינתן NFA ‏<span class=\"math\">N = (Q_N, Σ, δ_N, q<sub>sN<\/sub>, F_N)<\/span> בונים DFA\n      ‏<span class=\"math\">D<\/span>:<\/p>\n    <ul>\n      <li><span class=\"math\">Q_D = P(Q_N)<\/span> — מצב של <span class=\"math\">D<\/span> = קבוצת מצבים של <span class=\"math\">N<\/span>.<\/li>\n      <li><span class=\"math\">δ_D(R, σ) = ⋃<sub>r∈R<\/sub> E(δ_N(r, σ))<\/span> — צועדים מכל מצב בקבוצה, ואז סוגרים ב-ε.<\/li>\n      <li><span class=\"math\">q<sub>sD<\/sub> = E(q<sub>sN<\/sub>)<\/span>.<\/li>\n      <li><span class=\"math\">F_D = {R | R ∩ F_N ≠ ∅}<\/span> — הקבוצה מקבלת אם מכילה מצב מקבל כלשהו.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>טכניקת העבודה בפועל<\/h4>\n    <p>לא בונים את כל <span class=\"math\">P(Q)<\/span>! מתחילים מ-<span class=\"math\">E(q<sub>s<\/sub>)<\/span>\n      ומגלים רק קבוצות <b>נגישות<\/b> — ממלאים טבלה שורה-שורה עד שאין קבוצות חדשות.\n      לרוב מתקבלות הרבה פחות מ-<span class=\"math\">2<sup>|Q|<\/sup><\/span> שורות.<\/p>\n    <table class=\"ttable\">\n      <tr><th>R<\/th><th>0<\/th><th>1<\/th><\/tr>\n      <tr><th>→ {q₀}<\/th><td>{q₀}<\/td><td>{q₀,q₁}<\/td><\/tr>\n      <tr><th>{q₀,q₁}<\/th><td>{q₀,q₂}<\/td><td>{q₀,q₁,q₂}<\/td><\/tr>\n      <tr><td colspan=\"3\">… וממשיכים רק עם קבוצות שבאמת הופיעו<\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t7\">נכונות הבנייה והמחיר המעריכי<\/h2>\n\n  <div class=\"thm\"><b>משפט:<\/b> לכל NFA קיים DFA שקול. לכן: שפה ניתנת לזיהוי ע\"י NFA ⟺ היא רגולרית —\n    אי-דטרמיניזם <b>לא מוסיף כוח ביטוי<\/b> לאוטומטים סופיים, רק נוחות.<\/div>\n\n  <p><b>רעיון הנכונות<\/b> (אינווריאנטה, כמו בפרק 1): לכל מילה <span class=\"math\">w<\/span>,\n    המצב שאליו מגיע <span class=\"math\">D<\/span> הוא <em>בדיוק<\/em> קבוצת המצבים שאליהם\n    <span class=\"math\">N<\/span> יכול להגיע על <span class=\"math\">w<\/span>. אינדוקציה על האורך —\n    צעד אחד של <span class=\"math\">D<\/span> מדמה את כל הצעדים האפשריים של <span class=\"math\">N<\/span>.\n    קבלה משתמרת כי <span class=\"math\">R ∩ F_N ≠ ∅<\/span> ⟺ קיימת ריצה מקבלת.<\/p>\n\n  <div class=\"note\"><b>המחיר:<\/b> יש NFA-ים בני <span class=\"math\">n<\/span> מצבים שכל DFA שקול להם דורש\n    <span class=\"math\">2<sup>n<\/sup><\/span> מצבים — הדוגמה הקלאסית היא \"האות ה-<span class=\"math\">n<\/span> מהסוף היא 1\"\n    (פרק 1). המעריכיות היא אמיתית, לא חולשה של הבנייה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t8\">סגור לאיחוד, שרשור וכוכב — בניות NFA<\/h2>\n\n  <p>עם ε-מעברים שלוש הבניות נהיות ציוריות (אלה גם הבניות של רגקס→NFA בפרק הבא):<\/p>\n\n  <ul>\n    <li><b>איחוד <span class=\"math\">L₁ ∪ L₂<\/span>:<\/b> מצב התחלתי חדש עם שני מעברי\n      <span class=\"math\">ε<\/span> אל שני האוטומטים — \"בוחרים ענף\".<\/li>\n    <li><b>שרשור <span class=\"math\">L₁·L₂<\/span>:<\/b> מכל מצב מקבל של הראשון — מעבר\n      <span class=\"math\">ε<\/span> אל ההתחלה של השני; המקבלים של הראשון <b>מפסיקים להיות מקבלים<\/b>.\n      הניחוש: איפה נגמר החלק של <span class=\"math\">L₁<\/span>.<\/li>\n    <li><b>כוכב <span class=\"math\">L<sup>*<\/sup><\/span>:<\/b> מצב התחלתי חדש <b>מקבל<\/b>\n      (בשביל <span class=\"math\">ε<\/span>) עם <span class=\"math\">ε<\/span> פנימה, ומכל מקבל —\n      <span class=\"math\">ε<\/span> חזרה להתחלה המקורית, לסיבוב נוסף.<\/li>\n  <\/ul>\n\n  <div class=\"fsa\"><svg viewBox=\"0 0 460 120\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n    <path class=\"tr\" d=\"M6,60 L26,60\" marker-end=\"url(#arr)\"\/>\n    <circle class=\"st st-acc\" cx=\"52\" cy=\"60\" r=\"16\"\/><circle class=\"st st-acc\" cx=\"52\" cy=\"60\" r=\"21\"\/>\n    <text class=\"slbl\" x=\"52\" y=\"60\">s<\/text>\n    <rect x=\"110\" y=\"30\" rx=\"12\" width=\"130\" height=\"60\" class=\"st\"\/>\n    <text class=\"slbl\" x=\"175\" y=\"60\">A (של L)<\/text>\n    <path class=\"tr\" d=\"M73,60 L104,60\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"88\" y=\"50\" text-anchor=\"middle\">ε<\/text>\n    <circle class=\"st st-acc\" cx=\"290\" cy=\"60\" r=\"16\"\/><circle class=\"st st-acc\" cx=\"290\" cy=\"60\" r=\"21\"\/>\n    <text class=\"slbl\" x=\"290\" y=\"60\">f<\/text>\n    <path class=\"tr\" d=\"M243,60 L266,60\" marker-end=\"url(#arr)\"\/>\n    <path class=\"tr\" d=\"M285,38 C260,-5 130,-5 118,26\" marker-end=\"url(#arr)\"\/>\n    <text class=\"lbl\" x=\"200\" y=\"10\" text-anchor=\"middle\">ε (סיבוב נוסף)<\/text>\n  <\/svg><div class=\"fsa-cap\">שלד בניית הכוכב: התחלה חדשה מקבלת, ε פנימה, ε מהמקבלים חזרה<\/div><\/div>\n\n  <div class=\"warn\">בבניית הכוכב אסור פשוט להפוך את ההתחלה הישנה למקבלת — זה עלול להוסיף לשפה\n    מילים שמגיעות להתחלה באמצע ריצה. תמיד מוסיפים <b>מצב התחלתי חדש<\/b>.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t9\">איך כותבים הוכחת סגירות במבחן<\/h2>\n\n  <div class=\"algo\">\n    <h4>מבנה תשובה מלא (סגנון הפתרונות הרשמיים)<\/h4>\n    <ol>\n      <li><b>נתון:<\/b> \"‏<span class=\"math\">L<\/span> רגולרית ⇒ קיים DFA ‏<span class=\"math\">A = (Q,Σ,δ,q<sub>s<\/sub>,F)<\/span> עם <span class=\"math\">L(A)=L<\/span>\".<\/li>\n      <li><b>בנייה:<\/b> מגדירים את האוטומט\/הביטוי החדש <b>בכל רכיביו<\/b> — מי המצבים, מי ההתחלה, מי המקבלים, ומהי δ (בנוסחה או בתיאור מדויק של \"לכל מעבר… מוסיפים…\").<\/li>\n      <li><b>נכונות (כשנדרשת):<\/b> טענת שקילות דו-כיוונית — \"מילה מתקבלת בחדש ⟺ התנאי של השפה החדשה\", לרוב דרך פירוק <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> או אינווריאנטה.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>הכלי שחוזר בכל מבחן: <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> = {w | δ′(p,w) = q}<\/span><\/h4>\n    <p>השפה \"מ-p ל-q\" תמיד רגולרית (מגדירים את p התחלתי ואת q מקבל יחיד). איתה מפרקים כל\n      מניפולציה מבנית: רוטציות (<span class=\"math\">{y#x | xy ∈ L}<\/span>), הכנסות\n      (<span class=\"en\">Op<\/span>‏ של 2023ב), מחיקות (<span class=\"en\">Drop_all_a<\/span>‏ של 2023א),\n      היפוכי רישא (<span class=\"math\">{u<sup>R<\/sup>v | uv ∈ L}<\/span>) — מאחדים על מצבי הביניים.<\/p>\n  <\/div>\n\n  <div class=\"note\">אם הבנייה משתמשת בקבוצה שקיימת אבל לא ידועה (כמו קבוצת מצבי-הביניים במנה\n    <span class=\"math\">L′∖L<\/span> — ‏L049 במאגר) — זה עדיין תקף! להוכחת רגולריות מספיק\n    ש<b>קיים<\/b> אוטומט, לא שאנחנו יודעים לחשב אותו.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch2-t10\">טעויות קלאסיות סביב סגירות ו־NFA<\/h2>\n\n  <ul>\n    <li><b>משלים על NFA:<\/b> היפוך מקבלים ב-NFA לא נותן את המשלים (קבלה = \"קיימת ריצה\"). קודם דטרמיניזציה.<\/li>\n    <li><b>משלים על DFA חלקי:<\/b> אם δ לא מלאה (חסר מצב מלכודת) — ההיפוך שגוי. משלימים קודם.<\/li>\n    <li><b>\"סגור להורדת מילה\":<\/b> רגולרית פחות קבוצה סופית — רגולרית (L096); אבל תת-קבוצה של רגולרית — <b>לא<\/b> בהכרח רגולרית (<span class=\"math\">{aⁿbⁿ} ⊆ a<sup>*<\/sup>b<sup>*<\/sup><\/span>).<\/li>\n    <li><b>כיוון ההסקה:<\/b> מ-<span class=\"math\">L₁ ∪ L₂<\/span> רגולרית <b>אי אפשר<\/b> להסיק ש-<span class=\"math\">L₁<\/span> רגולרית (קחו <span class=\"math\">L₂ = Σ<sup>*<\/sup><\/span>). סגירות עובדת \"פנימה\", לא \"החוצה\" — אלא אם יש מידע נוסף (כמו L096: השלמה סופית).<\/li>\n    <li><b>חיתוך\/איחוד אינסופיים:<\/b> הסגירות היא לפעולות <b>סופיות<\/b>. איחוד אינסופי של רגולריות יכול לתת כל שפה שהיא (כל שפה היא איחוד המילים-היחידות שלה!).<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> מכפלה = ריצה במקביל בלי ניחוש; NFA = ניחוש ואימות;\n    תת-הקבוצות = לעקוב אחרי כל הניחושים בבת אחת; והסגירויות הן שפת ההוכחה של שאלה 1 במבחן.<\/div>\n<\/section>\n"},{"sid":"ch3","group":"פרקים","title":"פרק 3 — ביטויים רגולריים והמרות","topics":["ביטוי רגולרי — ההגדרה האינדוקטיבית","קריאת ביטויים — מהשפה אל הביטוי ובחזרה","טכניקות לכתיבת ביטוי לשפה נתונה","משפט השקילות — מפת ההמרות","רגקס ← NFA — הבנייה המדורגת","NFA ← GNFA — שלוש ההכנות","אלימינציית מצבים — הנוסחה ותהליך העבודה","∅ ,ε והמקרים המנוונים ב־GNFA","זהויות וכללי פישוט של ביטויים","שאלות רגקס במבחן — תבניות עבודה"],"html":"<h1>ביטויים רגולריים והמרות<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 3 (הרצאה 3 + תרגול 3)<\/p>\n\n<section>\n  <h2 id=\"ch3-t0\">ביטוי רגולרי — ההגדרה האינדוקטיבית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">ביטוי רגולרי (Regex)<\/span> מעל <span class=\"math\">Σ<\/span> מוגדר באינדוקציה:\n    <ul>\n      <li><b>בסיס:<\/b> ‏<span class=\"math\">∅<\/span>, ‏<span class=\"math\">ε<\/span>, ו-<span class=\"math\">σ<\/span> לכל <span class=\"math\">σ ∈ Σ<\/span> — ביטויים רגולריים.<\/li>\n      <li><b>צעד:<\/b> אם <span class=\"math\">r, s<\/span> ביטויים רגולריים אז גם\n        <span class=\"math\">r + s<\/span> (איחוד; בספרים אחרים <span class=\"math\">r|s<\/span> או <span class=\"math\">r∪s<\/span>),\n        <span class=\"math\">r·s<\/span> (שרשור, נכתב גם <span class=\"math\">rs<\/span>),\n        ו-<span class=\"math\">r<sup>*<\/sup><\/span> (כוכב).<\/li>\n    <\/ul>\n    השפה המתוארת: <span class=\"math\">L(∅)=∅<\/span>, <span class=\"math\">L(ε)={ε}<\/span>, <span class=\"math\">L(σ)={σ}<\/span>,\n    <span class=\"math\">L(r+s)=L(r)∪L(s)<\/span>, <span class=\"math\">L(rs)=L(r)·L(s)<\/span>,\n    <span class=\"math\">L(r<sup>*<\/sup>)=L(r)<sup>*<\/sup><\/span>.\n  <\/div>\n\n  <p><b>קדימויות:<\/b> כוכב לפני שרשור לפני איחוד — <span class=\"math\">ab<sup>*<\/sup>+c<\/span> פירושו\n    <span class=\"math\">(a(b<sup>*<\/sup>))+c<\/span>. סוגריים חופשי כשמסתבכים.<\/p>\n\n  <div class=\"note\">קיצורים מקובלים: <span class=\"math\">r<sup>+<\/sup> = rr<sup>*<\/sup><\/span> (לפחות פעם אחת),\n    ו-<span class=\"math\">Σ<\/span> כקיצור ל-<span class=\"math\">(σ₁+…+σ_k)<\/span>. מותר להשתמש בהם במבחן —\n    הם מתפרקים לביטוי חוקי.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t1\">קריאת ביטויים — מהשפה אל הביטוי ובחזרה<\/h2>\n\n  <p>ארבע הדוגמאות של תרגול 3, מעל <span class=\"math\">Σ = {0,1}<\/span> — שווה לזכור אותן כתבניות:<\/p>\n\n  <table>\n    <tr><th>שפה<\/th><th>ביטוי<\/th><th>הרעיון<\/th><\/tr>\n    <tr><td>מסתיימת ב-00<\/td><td><span class=\"math\">(0+1)<sup>*<\/sup>00<\/span><\/td><td>כל רישא, ואז התבנית<\/td><\/tr>\n    <tr><td><span class=\"math\">#₁(w) = 2<\/span><\/td><td><span class=\"math\">0<sup>*<\/sup>10<sup>*<\/sup>10<sup>*<\/sup><\/span><\/td><td>מקבעים את שני ה-1-ים, אפסים חופשיים ביניהם<\/td><\/tr>\n    <tr><td><span class=\"math\">#₁(w)<\/span> זוגי<\/td><td><span class=\"math\">0<sup>*<\/sup>(10<sup>*<\/sup>10<sup>*<\/sup>)<sup>*<\/sup><\/span><\/td><td>ה-1-ים באים בזוגות<\/td><\/tr>\n    <tr><td>מתחילה ב-1 ומסתיימת ב-10<\/td><td><span class=\"math\">1(0+1)<sup>*<\/sup>10 + 110<\/span> וריאציות<\/td><td>זהירות בחפיפות קצרות!<\/td><\/tr>\n  <\/table>\n\n  <div class=\"warn\">כשקוראים ביטוי, לבדוק תמיד: האם <span class=\"math\">ε<\/span> בשפה?\n    (כל כוכב \"תורם\" ε.) ומה המילים הקצרות ביותר? שתי בדיקות אלה תופסות את רוב טעויות הקריאה —\n    ובשאלות \"האם הביטויים שקולים\" הן לרוב כל מה שצריך כדי להפריך.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t2\">טכניקות לכתיבת ביטוי לשפה נתונה<\/h2>\n\n  <ul>\n    <li><b>קיבוע עדים:<\/b> אם התנאי הוא \"בדיוק k מופעים\" — כותבים את המופעים במפורש ומרפדים:\n      <span class=\"math\">0<sup>*<\/sup>10<sup>*<\/sup>10<sup>*<\/sup><\/span>.<\/li>\n    <li><b>פירוק למקרים:<\/b> תנאי \"או\" — מחברים ביטויים ב-<span class=\"math\">+<\/span>. אין בעיה בחפיפה בין המקרים.<\/li>\n    <li><b>מבנה מחזורי:<\/b> ספירה מודולרית — הבלוק החוזר בכוכב:\n      זוגות <span class=\"math\">(10<sup>*<\/sup>1)<\/span>, שלשות <span class=\"math\">(bbb)<\/span>, וכד'.<\/li>\n    <li><b>מ-DFA:<\/b> אם רואים את האוטומט בקלות — עדיף לכתוב אותו ואז להמיר (GNFA), במקום לנחש ביטוי.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>מהמבחן (2023ב ש1.1ב)<\/h4>\n    <p>‏<span class=\"math\">Op(L₁, L(a<sup>*<\/sup>))<\/span> עבור <span class=\"math\">L₁ = {a<sup>i<\/sup>b<sup>j<\/sup> | (i+j) mod 3 = 0}<\/span>:\n      התשובה הרשמית <span class=\"math\">a<sup>*<\/sup>(abb + aab + ε)(bbb)<sup>*<\/sup>a<sup>*<\/sup><\/span> —\n      רואים את שלוש הטכניקות ביחד: ריפוד <span class=\"math\">a<sup>*<\/sup><\/span> משני הצדדים (ההכנסה),\n      מקרים לשארית ההתחלתית, ובלוק מחזורי <span class=\"math\">(bbb)<sup>*<\/sup><\/span>.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t3\">משפט השקילות — מפת ההמרות<\/h2>\n\n  <div class=\"thm\">שפה היא רגולרית <b>אם ורק אם<\/b> קיים ביטוי רגולרי שמתאר אותה.<\/div>\n\n  <p>ההוכחה — שתי המרות, שתיהן בדף הנוסחאות ושתיהן חומר מבחן:<\/p>\n  <div class=\"reduce\">\n    <div class=\"rbox\">Regex<\/div>\n    <span class=\"rarr\">⇄<\/span>\n    <div class=\"rbox\">NFA<\/div>\n    <span class=\"rarr\">⇄<\/span>\n    <div class=\"rbox\">DFA<\/div>\n    <div class=\"rcap\">ימינה: הבנייה המדורגת (t4) ותת-הקבוצות (פרק 2); שמאלה: GNFA (t5–t7)<\/div>\n  <\/div>\n\n  <p>המעגל סוגר את התמונה מפרק 2: DFA ≡ NFA ≡ Regex — שלוש שפות תיאור לאותה מחלקה.\n    מכאן ואילך, \"רגולרית\" פירושו: תבחרו את הפורמליזם הנוח לשאלה.<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t4\">רגקס ← NFA — הבנייה המדורגת<\/h2>\n\n  <div class=\"algo\">\n    <h4>ההליך מדף הנוסחאות<\/h4>\n    <ol>\n      <li>מציירים NFA בן 2 מצבים: התחלה, סיום (מקבל), וחץ אחד ביניהם שמסומן בביטוי <span class=\"math\">r<\/span> כולו.<\/li>\n      <li>מפרקים חץ <span class=\"math\">r+s<\/span> לשני חיצים מקבילים <span class=\"math\">r<\/span> ו-<span class=\"math\">s<\/span>.<\/li>\n      <li>מפרקים חץ <span class=\"math\">rs<\/span> לשני חיצים עוקבים דרך מצב ביניים חדש.<\/li>\n      <li>מפרקים חץ <span class=\"math\">r<sup>*<\/sup><\/span>: ‏<span class=\"math\">ε<\/span> פנימה למצב חדש, לולאת <span class=\"math\">r<\/span> עליו, ו-<span class=\"math\">ε<\/span> החוצה.<\/li>\n      <li>חוזרים עד שכל התוויות הן אותיות בודדות או <span class=\"math\">ε<\/span>.<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>זו אינדוקציה על מבנה הביטוי, מלמעלה למטה — בכל שלב מטפלים באופרטור החיצוני ביותר.\n    לחלופין אפשר לבנות מלמטה למעלה עם בניות האיחוד\/שרשור\/כוכב של פרק 2 — אותו דבר בדיוק.<\/p>\n\n  <div class=\"note\">המסקנה החשובה: מספר המצבים ליניארי באורך הביטוי. ההמרה הזו זולה —\n    היקרה היא הדטרמיניזציה שאחריה (אם צריך DFA).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t5\">NFA ← GNFA — שלוש ההכנות<\/h2>\n\n  <div class=\"def\"><span class=\"term\">GNFA<\/span> — אוטומט מוכלל שבו כל חץ מסומן <b>בביטוי רגולרי<\/b>\n    (לא רק באות), עם התחלה יחידה בלי חיצים נכנסים, מקבל יחיד בלי חיצים יוצאים,\n    וחץ אחד בדיוק בין כל זוג מצבים.<\/div>\n\n  <div class=\"algo\">\n    <h4>מ-NFA ל-GNFA תקני<\/h4>\n    <ol>\n      <li><b>התחלה חדשה<\/b> <span class=\"math\">s<\/span> עם <span class=\"math\">ε<\/span> אל\n        <span class=\"math\">q<sub>s<\/sub><\/span> הישן (כדי שלא ייכנסו חיצים להתחלה).<\/li>\n      <li><b>מקבל יחיד חדש<\/b> <span class=\"math\">f<\/span>: מכל <span class=\"math\">q ∈ F<\/span> מוסיפים\n        <span class=\"math\">ε<\/span> אל <span class=\"math\">f<\/span>, וקובעים <span class=\"math\">F = {f}<\/span>.<\/li>\n      <li><b>איחוד חיצים מקבילים:<\/b> כמה חיצים מ-<span class=\"math\">i<\/span> ל-<span class=\"math\">j<\/span> —\n        מתמזגים לחץ אחד עם סכום התוויות (<span class=\"math\">+<\/span>);\n        אין חץ — מוסיפים חץ מסומן <span class=\"math\">∅<\/span> (מושגית; בציור מדלגים).<\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t6\">אלימינציית מצבים — הנוסחה ותהליך העבודה<\/h2>\n\n  <div class=\"algo\">\n    <h4>סילוק מצב k<\/h4>\n    <p>בוחרים מצב <span class=\"math\">k ∉ {s, f}<\/span>, מסלקים אותו, ולכל זוג\n      <span class=\"math\">(i, j)<\/span> (כולל <span class=\"math\">i = j<\/span>!) מעדכנים:<\/p>\n    <div class=\"lang-def\">new(i,j) = old(i,j) + old(i,k)·old(k,k)<sup>*<\/sup>·old(k,j)<\/div>\n    <p>\"כל מה שהיה קודם, ועוד: להיכנס ל-k, להסתובב בלולאה שלו כרצוננו, ולצאת\".\n      חוזרים עד שנשארים רק <span class=\"math\">s<\/span> ו-<span class=\"math\">f<\/span> — התווית על החץ\n      <span class=\"math\">s → f<\/span> היא הביטוי המבוקש.<\/p>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>סדר עבודה שחוסך טעויות<\/h4>\n    <ul>\n      <li>מסלקים קודם מצבים \"דלילים\" (מעט חיצים) — הביטויים נשארים קטנים.<\/li>\n      <li>בכל סילוק עוברים <b>שיטתית<\/b> על כל הזוגות (נכנס × יוצא) של k — קל לפספס זוג.<\/li>\n      <li>לא לשכוח את הלולאות העצמיות: גם <span class=\"math\">new(i,i)<\/span> מתעדכן.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t7\">∅ ,ε והמקרים המנוונים ב־GNFA<\/h2>\n\n  <p>שלושת הכללים שמצילים כשהנוסחה פוגשת חיצים חסרים:<\/p>\n  <ul>\n    <li><span class=\"math\">r + ∅ = r<\/span> — חץ חסר לא מוסיף כלום באיחוד.<\/li>\n    <li><span class=\"math\">r·∅ = ∅<\/span> — מסלול דרך חץ שלא קיים איננו מסלול.<\/li>\n    <li><span class=\"math\">∅<sup>*<\/sup> = ε<\/span> — אין לולאה על k? אפשר \"להסתובב אפס פעמים\":\n      <span class=\"math\">old(i,k)·ε·old(k,j)<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"warn\">‏<span class=\"math\">∅<sup>*<\/sup> = ε<\/span> (ולא ∅!) היא הנקודה שדף הנוסחאות טורח\n    להזכיר במפורש (\"Reminder\"). לשכוח אותה = לאבד את כל המסלולים דרך מצבים בלי לולאה עצמית.<\/div>\n\n  <div class=\"ex-box\">\n    <h4>בדיקת שפיות אחרי כל סילוק<\/h4>\n    <p>בוחרים מילה קצרה שהאוטומט המקורי מקבל ואחת שהוא דוחה, ובודקים שהביטוי החלקי עדיין\n      מסכים. תופס את רוב שגיאות ההעתקה באמצע התהליך.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t8\">זהויות וכללי פישוט של ביטויים<\/h2>\n\n  <table>\n    <tr><th>זהות<\/th><th>הערה<\/th><\/tr>\n    <tr><td><span class=\"math\">r + r = r<\/span>,&nbsp; <span class=\"math\">r + s = s + r<\/span><\/td><td>איחוד אידמפוטנטי וחילופי<\/td><\/tr>\n    <tr><td><span class=\"math\">r·ε = ε·r = r<\/span><\/td><td>ε יחידה לשרשור<\/td><\/tr>\n    <tr><td><span class=\"math\">r·∅ = ∅·r = ∅<\/span><\/td><td>∅ מאפס שרשור<\/td><\/tr>\n    <tr><td><span class=\"math\">(r<sup>*<\/sup>)<sup>*<\/sup> = r<sup>*<\/sup><\/span><\/td><td>כוכב כפול לא מוסיף<\/td><\/tr>\n    <tr><td><span class=\"math\">(r + s)<sup>*<\/sup> = (r<sup>*<\/sup>s<sup>*<\/sup>)<sup>*<\/sup><\/span><\/td><td>שקילות שימושית ולא מובנת-מאליה<\/td><\/tr>\n    <tr><td><span class=\"math\">r(sr)<sup>*<\/sup> = (rs)<sup>*<\/sup>r<\/span><\/td><td>\"הזזת בלוק\" — הטריק של L003\/L025!<\/td><\/tr>\n    <tr><td><span class=\"math\">ε + rr<sup>*<\/sup> = r<sup>*<\/sup><\/span><\/td><td>פירוק לפי מספר החזרות<\/td><\/tr>\n  <\/table>\n\n  <p><b>שקילות ביטויים<\/b> מוכיחים או בהכלה דו-כיוונית של השפות, או בהמרה לאוטומטים —\n    ומפריכים עם <b>מילה מבדילה<\/b> אחת. חפשו אותה קודם בין המילים הקצרות: ‏<span class=\"math\">ε<\/span>,\n    אותיות בודדות, זוגות.<\/p>\n\n  <div class=\"note\">הזהות <span class=\"math\">r(sr)<sup>*<\/sup> = (rs)<sup>*<\/sup>r<\/span> היא בדיוק הסיבה\n    ש-<span class=\"math\">(ab)<sup>k<\/sup>a(ba)<sup>k<\/sup> = a(ba)<sup>2k<\/sup><\/span> במאגר השפות —\n    מלכודת שחוזרת בשלושה מבחנים שונים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch3-t9\">שאלות רגקס במבחן — תבניות עבודה<\/h2>\n\n  <div class=\"algo\">\n    <h4>שלושת סוגי השאלות<\/h4>\n    <ol>\n      <li><b>\"כתבו ביטוי ל-…\":<\/b> לפרק למקרים, לקבע עדים, לרפד. לבדוק ε ומילים קצרות. הסבר קצר נדרש (2023ב ש1.1: \"הסבירו בקצרה\").<\/li>\n      <li><b>\"מהי השפה של הביטוי\":<\/b> לקרוא מבחוץ פנימה, לרשום 3–4 מילים לדוגמה, לזהות את התבנית.<\/li>\n      <li><b>\"המירו אוטומט לביטוי\":<\/b> GNFA שיטתי. לרשום את הנוסחה בכל שלב — נותן נקודות חלקיות גם עם טעות חשבונית.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>צ'ק-ליסט לפני שממשיכים הלאה<\/h4>\n    <ul>\n      <li>‏<span class=\"math\">ε<\/span> — בפנים או בחוץ? (גם בשפה וגם בביטוי שכתבתם.)<\/li>\n      <li>אות בודדת מכל סוג — מסכימים?<\/li>\n      <li>אם השפה דורשת ספירה לא חסומה — עצרו: אין ביטוי רגולרי, וזו שאלה של פרק 5.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> ביטויים הם הדרך <em>לתאר<\/em>; אוטומטים הם הדרך <em>להריץ<\/em>;\n    GNFA וההבנייה המדורגת מוכיחים שאלה שני צדדים של אותו מטבע. במבחן — בחרו את הצד הנוח והמירו.<\/div>\n<\/section>\n"},{"sid":"ch4","group":"פרקים","title":"פרק 4 — מצבים שקולים ומינימיזציה","topics":["מילה מפרידה ומצבים שקולים","שקילות־k — ההגדרה המדורגת","אלגוריתם מחלקות השקילות","הרצה מלאה של האלגוריתם — דוגמה","בניית האוטומט המזערי","שקילות בין אוטומטים ויחידות המינימום","חסמים תחתונים — כמה מצבים חייבים?","שימושים: בדיקת שקילות ותכונות","מצבים מפרידים בשאלות מבחן","מוקשים: נגישות, שלמות וסדר הפעולות"],"html":"<h1>מצבים שקולים ומינימיזציה<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 4 (הרצאה 4 + תרגול 4)<\/p>\n\n<section>\n  <h2 id=\"ch4-t0\">מילה מפרידה ומצבים שקולים<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">מילה מפרידה (Separating word)<\/span> — עבור מצבים <span class=\"math\">q, p ∈ Q<\/span>\n    ב-DFA, מילה <span class=\"math\">w ∈ Σ<sup>*<\/sup><\/span> נקראת מפרידה אם בדיוק אחת משתי הריצות מסתיימת\n    במצב מקבל: <span class=\"math\">δ′(q,w) ∈ F<\/span> ו-<span class=\"math\">δ′(p,w) ∉ F<\/span>, או להפך.\n  <\/div>\n\n  <div class=\"def\">\n    <span class=\"term\">מצבים שקולים<\/span> — <span class=\"math\">p ≡ q<\/span> אם <b>אין<\/b> מילה שמפרידה ביניהם:\n    מכל עתיד אפשרי, שניהם מסכימים על קבלה. מצבים שקולים הם \"אותו מצב בתחפושת\" —\n    אפשר למזג אותם בלי לשנות את השפה.\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>אינטואיציה<\/h4>\n    <p>מצב מסכם את העבר; שקילות שואלת על ה<b>עתיד<\/b>: שני מצבים שקולים אם \"מכאן והלאה\"\n      הם מתנהגים זהה על כל המשך. שימו לב: <span class=\"math\">ε<\/span> עצמה יכולה להפריד —\n      אם בדיוק אחד מהם מקבל (<span class=\"math\">δ′(q,ε)=q<\/span>). לכן מצב מקבל לעולם אינו שקול ללא-מקבל.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t1\">שקילות־k — ההגדרה המדורגת<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">k-שקילות<\/span> — <span class=\"math\">p ≡<sub>k<\/sub> q<\/span> אם אין מילה מפרידה\n    באורך <span class=\"math\">≤ k<\/span>. ‏<span class=\"term\">שקילות מלאה<\/span>:\n    <span class=\"math\">p ≡ q<\/span> ⟺ ‏<span class=\"math\">p ≡<sub>k<\/sub> q<\/span> לכל <span class=\"math\">k ≥ 0<\/span>.\n  <\/div>\n\n  <p>המדרג בנוי לרקורסיה:<\/p>\n  <ul>\n    <li><span class=\"math\">p ≡₀ q<\/span> ⟺ שניהם מקבלים או שניהם לא (ההפרדה היחידה באורך 0 היא <span class=\"math\">ε<\/span>).<\/li>\n    <li><span class=\"math\">p ≡<sub>k<\/sub> q<\/span> ⟺ ‏<span class=\"math\">p ≡<sub>k−1<\/sub> q<\/span> וגם\n      לכל <span class=\"math\">σ ∈ Σ<\/span>: ‏<span class=\"math\">δ(p,σ) ≡<sub>k−1<\/sub> δ(q,σ)<\/span> —\n      מילה באורך k מתחילה באות אחת וממשיכה במילה באורך k−1.<\/li>\n  <\/ul>\n\n  <div class=\"thm\">אם <span class=\"math\">≡<sub>k<\/sub><\/span> ו-<span class=\"math\">≡<sub>k+1<\/sub><\/span> זהות —\n    המדרג התייצב לתמיד, ו-<span class=\"math\">≡<sub>k<\/sub><\/span> היא השקילות המלאה.\n    ב-DFA עם <span class=\"math\">n<\/span> מצבים ההתייצבות קורית אחרי לכל היותר <span class=\"math\">n−1<\/span> עידונים\n    (כל עידון אמיתי מוסיף מחלקה, ואין יותר מ-n מחלקות).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t2\">אלגוריתם מחלקות השקילות<\/h2>\n\n  <div class=\"algo\">\n    <h4>ההליך מדף הנוסחאות (ל-DFA בלבד)<\/h4>\n    <ol>\n      <li>מסירים את כל המצבים <b>הלא-נגישים<\/b> מ-<span class=\"math\">q<sub>s<\/sub><\/span>.<\/li>\n      <li>חלוקה התחלתית: <span class=\"math\">E₀ = {F, Q∖F}<\/span> (מי ששרד את הפרדת ε).<\/li>\n      <li>בצעד <span class=\"math\">k<\/span>: מצבים <span class=\"math\">p,q<\/span> שהיו יחד ב-<span class=\"math\">E<sub>k−1<\/sub><\/span>\n        נשארים יחד ב-<span class=\"math\">E<sub>k<\/sub><\/span> אם ורק אם לכל <span class=\"math\">σ<\/span>:\n        ‏<span class=\"math\">δ(p,σ)<\/span> ו-<span class=\"math\">δ(q,σ)<\/span> באותה מחלקה של <span class=\"math\">E<sub>k−1<\/sub><\/span>.<\/li>\n      <li>עוצרים כאשר <span class=\"math\">E<sub>k<\/sub> = E<sub>k−1<\/sub><\/span>.<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>אינווריאנטת האלגוריתם: <span class=\"math\">E<sub>k<\/sub><\/span> היא בדיוק חלוקת ה-<span class=\"math\">≡<sub>k<\/sub><\/span>.\n    העצירה = ההתייצבות מהנושא הקודם, והחלוקה הסופית היא השקילות האמיתית.<\/p>\n\n  <div class=\"warn\">שני תנאי קדם שנשכחים: האלגוריתם מוגדר <b>ל-DFA שלם בלבד<\/b>\n    (ב-NFA \"העתיד\" אינו פונקציה של המצב), וחובה להסיר לא-נגישים <b>קודם<\/b> —\n    מצב לא-נגיש יכול להתמזג \"בטעות\" ולבלבל את הספירה של מספר המחלקות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t3\">הרצה מלאה של האלגוריתם — דוגמה<\/h2>\n\n  <div class=\"ex-box\">\n    <h4>אוטומט לדוגמה<\/h4>\n    <p>‏<span class=\"math\">Q = {A,B,C,D}<\/span>, ‏<span class=\"math\">Σ = {0,1}<\/span>,\n      ‏<span class=\"math\">F = {D}<\/span>, התחלה <span class=\"math\">A<\/span>:<\/p>\n    <table class=\"ttable\">\n      <tr><th>δ<\/th><th>0<\/th><th>1<\/th><\/tr>\n      <tr><th>→ A<\/th><td>B<\/td><td>C<\/td><\/tr>\n      <tr><th>B<\/th><td>B<\/td><td>D<\/td><\/tr>\n      <tr><th>C<\/th><td>C<\/td><td>D<\/td><\/tr>\n      <tr><th>*D<\/th><td>D<\/td><td>D<\/td><\/tr>\n    <\/table>\n    <p><b>‏E₀:<\/b> ‏<span class=\"math\">{A,B,C}, {D}<\/span>.<\/p>\n    <p><b>צעד 1:<\/b> על 0: ‏A→B, B→B, C→C — כולם במחלקה <span class=\"math\">{A,B,C}<\/span> ✓.\n      על 1: ‏A→C (במחלקה), B→D, C→D (במחלקת <span class=\"math\">{D}<\/span>).\n      ‏A נפרד מ-B ומ-C (‏1 מפרידה!), ‏B ו-C נשארים יחד.\n      ‏<b>E₁:<\/b> ‏<span class=\"math\">{A}, {B,C}, {D}<\/span>.<\/p>\n    <p><b>צעד 2:<\/b> ‏B,C: על 0 → B,C (אותה מחלקה), על 1 → D,D ✓ — נשארים יחד.\n      ‏<b>E₂ = E₁<\/b> — עצירה.<\/p>\n    <p><b>מסקנה:<\/b> ‏<span class=\"math\">B ≡ C<\/span>, והאוטומט המזערי בן 3 מצבים:\n      ‏<span class=\"math\">[A], [BC], [D]<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"note\">טיפ עבודה: מציירים את הטבלה ומסמנים בכל שורה את <b>מחלקת<\/b> היעד (לא את היעד עצמו).\n    שתי שורות עם אותה חתימת-מחלקות = נשארים יחד.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t4\">בניית האוטומט המזערי<\/h2>\n\n  <div class=\"algo\">\n    <h4>Minimization (מדף הנוסחאות)<\/h4>\n    <ol>\n      <li>מריצים את אלגוריתם מחלקות השקילות על <span class=\"math\">Q<\/span> (אחרי הסרת לא-נגישים).<\/li>\n      <li>מקצים מצב חדש לכל מחלקת שקילות <span class=\"math\">[q]<\/span>.<\/li>\n      <li>מעברים: <span class=\"math\">δ′([q], σ) = [δ(q,σ)]<\/span> — מוגדר היטב כי מצבים שקולים\n        עוברים למצבים שקולים; התחלה <span class=\"math\">[q<sub>s<\/sub>]<\/span>; מקבלים\n        <span class=\"math\">{[q] | q ∈ F}<\/span> (מחלקה היא או כולה ב-F או כולה מחוץ — מהפרדת ε).<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>התוצאה: DFA שקול עם מספר המצבים הקטן ביותר האפשרי — לכל מחלקה נשאר נציג אחד.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>בדיקת שפיות אחרי המיזוג<\/h4>\n    <p>מריצים 2–3 מילים (מתקבלת, נדחית, גבולית) על האוטומט החדש. אם משהו התקלקל — כמעט תמיד\n      מוזגו מצבים שנפרדים ע\"י מילה ארוכה, כלומר עצרתם עידון אחד מוקדם מדי.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t5\">שקילות בין אוטומטים ויחידות המינימום<\/h2>\n\n  <div class=\"thm\"><b>טענה (מדף הנוסחאות):<\/b> שני DFA-ים <span class=\"math\">A, B<\/span> שקולים\n    (<span class=\"math\">L(A) = L(B)<\/span>) אם ורק אם <span class=\"math\">q<sub>sA<\/sub> ≡ q<sub>sB<\/sub><\/span> —\n    כאשר את השקילות בודקים באוטומט המאוחד (מריצים את האלגוריתם על איחוד קבוצות המצבים).<\/div>\n\n  <p>זה נותן <b>אלגוריתם לבדיקת שקילות<\/b>: מאחדים, מריצים מחלקות שקילות, ובודקים אם\n    שני המצבים ההתחלתיים נפלו לאותה מחלקה. (זו בדיוק הדרך שבה <span class=\"math\">EQ<sub>DFA<\/sub> ∈ R<\/span>\n    בהמשך הקורס!)<\/p>\n\n  <div class=\"thm\"><b>יחידות:<\/b> האוטומט המזערי יחיד עד כדי שינוי שמות מצבים. לכן \"מספר המצבים\n    של ה-DFA המינימלי\" הוא תכונה של <b>השפה<\/b> — מדד מובהק למורכבות שלה.<\/div>\n\n  <div class=\"note\">מכאן: אם בניתם שני אוטומטים מזעריים שונים-מבנית לאותה שפה — טעות איפשהו.\n    ולהפך: כדי להראות שאוטומט נתון מזערי, מספיק להראות שכל זוג מצבים נפרד ע\"י מילה כלשהי.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t6\">חסמים תחתונים — כמה מצבים חייבים?<\/h2>\n\n  <div class=\"algo\">\n    <h4>תבנית הוכחת \"אי אפשר עם פחות מ-n מצבים\"<\/h4>\n    <ol>\n      <li>מציגים <span class=\"math\">n<\/span> מילים <span class=\"math\">w₁, …, w<sub>n<\/sub><\/span> (\"נציגים\").<\/li>\n      <li>מראים שלכל זוג <span class=\"math\">i ≠ j<\/span> קיימת סיפא <span class=\"math\">z<\/span> כך שבדיוק\n        אחת מ-<span class=\"math\">w<sub>i<\/sub>z, w<sub>j<\/sub>z<\/span> בשפה.<\/li>\n      <li>מסקנה: בכל DFA לשפה, הריצות על הנציגים חייבות להסתיים ב-<span class=\"math\">n<\/span> מצבים\n        שונים — אחרת שני נציגים באותו מצב היו מתנהגים זהה על כל סיפא. לכן <span class=\"math\">|Q| ≥ n<\/span>.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>הדוגמה של תרגול 4<\/h4>\n    <p>‏<span class=\"math\">L = {w = x1y | |y| = 7}<\/span> (\"השמינית מהסוף היא 1\"):\n      ניקח כנציגים את כל <span class=\"math\">2⁸<\/span> המילים באורך 8. לכל שתי מילים שנבדלות בעמדה\n      <span class=\"math\">i<\/span> — הסיפא <span class=\"math\">0<sup>i−1<\/sup><\/span> מזיזה את העמדה הזו\n      להיות \"שמינית מהסוף\" ומפרידה. לכן כל DFA דורש לפחות <span class=\"math\">2⁸<\/span> מצבים —\n      החלון באמת הכרחי.<\/p>\n  <\/div>\n\n  <div class=\"note\">הטכניקה הזו (מילים מפרידות ⇒ חסם תחתון) היא הצד השני של המינימיזציה:\n    האלגוריתם ממזג כל מה שאפשר, והנציגים המפרידים מוכיחים שאי אפשר יותר. יחד — המספר המדויק.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t7\">שימושים: בדיקת שקילות ותכונות<\/h2>\n\n  <ul>\n    <li><b>שקילות אוטומטים \/ ביטויים:<\/b> ממירים למינימלי ומשווים (או בודקים <span class=\"math\">q<sub>sA<\/sub> ≡ q<sub>sB<\/sub><\/span> ישירות). כך מיישבים ויכוח על שני ביטויים \"שקולים לכאורה\".<\/li>\n    <li><b>ריקנות ואינסופיות:<\/b> באוטומט (אחרי הסרת לא-נגישים): השפה ריקה ⟺ אין מצב מקבל נגיש;\n      אינסופית ⟺ קיים מסלול מקבל שעובר דרך מעגל. (שתי הבדיקות האלה יהפכו ל-<span class=\"math\">E<sub>DFA<\/sub><\/span>\n      ו-<span class=\"math\">Inf<sub>DFA<\/sub><\/span> הכריעות בפרקי החישוביות.)<\/li>\n    <li><b>ניקוי אחרי בניות:<\/b> תת-הקבוצות, מכפלה ו-GNFA מנפחים — מינימיזציה בסוף מחזירה צורה קנונית.<\/li>\n  <\/ul>\n\n  <div class=\"thm\">שילוב יפה שהופיע במבחן (2023א ש3.2): ‏DFA עם <span class=\"math\">n<\/span> מחלקות שקילות\n    שמקבל מילה באורך <span class=\"math\">n<\/span> — מקבל שפה אינסופית. הוכחה: באוטומט המזערי\n    (בן n מצבים) ריצה באורך n עוברת ב-<span class=\"math\">n+1<\/span> ביקורי-מצבים — שובך היונים נותן\n    מעגל על מסלול מקבל, ומעגל אפשר לשכפל.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t8\">מצבים מפרידים בשאלות מבחן<\/h2>\n\n  <div class=\"ex-box\">\n    <h4>‏2023ב ש3.4 — השאלה במלואה<\/h4>\n    <p>נתון DFA מעגלי: ‏<span class=\"math\">q₀ →a→ q₁ →a→ q₂ →a→ q₀<\/span>, כאשר\n      <span class=\"math\">q₀<\/span> מקבל. מצאו <b>מילה אחת<\/b> שמפרידה גם בין\n      <span class=\"math\">q₁<\/span> ל-<span class=\"math\">q₂<\/span> וגם בין <span class=\"math\">q₂<\/span>\n      ל-<span class=\"math\">q₀<\/span>.<\/p>\n    <p><b>פתרון:<\/b> ‏<span class=\"math\">w = a<\/span>: ‏<span class=\"math\">δ(q₁,a)=q₂ ∉ F<\/span> אבל\n      <span class=\"math\">δ(q₂,a)=q₀ ∈ F<\/span> — מפרידה את הזוג הראשון; ‏<span class=\"math\">δ(q₀,a)=q₁ ∉ F<\/span>\n      — מפרידה גם את השני. אותה מילה, שני תפקידים.<\/p>\n  <\/div>\n\n  <div class=\"algo\">\n    <h4>איך מחפשים מילה מפרידה ביד<\/h4>\n    <ol>\n      <li>בודקים את <span class=\"math\">ε<\/span>: אם בדיוק אחד מקבל — סיימנו.<\/li>\n      <li>אחרת מריצים את שני המצבים \"במקביל\" אות-אות (כמו מכפלה מנטלית) עד שמגיעים לזוג\n        (מקבל, לא-מקבל).<\/li>\n      <li>המילה הקצרה ביותר המפרידה קיימת תמיד באורך ≤ מספר המצבים (אם בכלל קיימת) —\n        אין צורך לחפש רחוק.<\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch4-t9\">מוקשים: נגישות, שלמות וסדר הפעולות<\/h2>\n\n  <ul>\n    <li><b>לא-נגישים קודם:<\/b> האלגוריתם מדבר רק על העתיד, ולכן מצב לא-נגיש \"נראה תקין\" —\n      אבל הוא מנפח את התוצאה ועלול לשבש ספירת מחלקות בשאלות בסגנון \"כמה מצבים במינימלי\".<\/li>\n    <li><b>DFA שלם:<\/b> אם δ חלקית, קודם משלימים מלכודת — אחרת \"היתקעות\" ו\"דחייה\" מתערבבות\n      וההשוואה בין מצבים לא מוגדרת.<\/li>\n    <li><b>מיזוג ≠ מחיקה:<\/b> מינימיזציה ממזגת שקולים; היא לעולם לא מוחקת התנהגות. אם השפה\n      השתנתה — מוזג זוג לא-שקול (בדקו מילה מפרידה ארוכה יותר).<\/li>\n    <li><b>שקילות היא על אותו אוטומט (או על האיחוד):<\/b> להשוות \"מצב מאוטומט A למצב מאוטומט B\"\n      מותר רק אחרי שמאחדים אותם לאוטומט אחד עם אותה δ.<\/li>\n    <li><b>מינימלי ≠ קטן בציור:<\/b> אל תסמכו על אינטואיציה — זוג מצבים בלי מילה מפרידה יכול\n      להיראות שונה לגמרי בציור. האלגוריתם, לא העין.<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> שקילות מצבים = הסכמה על כל העתידים; האלגוריתם מעדן חלוקה עד\n    יציבות; המינימלי יחיד — ולכן גם כלי חישובי (שקילות, ריקנות) וגם כלי הוכחה (חסמים תחתונים).<\/div>\n<\/section>\n"},{"sid":"ch5","group":"פרקים","title":"פרק 5 — שפות לא רגולריות ולמת הניפוח","topics":["למה קיימות שפות לא רגולריות","למת הניפוח — הנוסח המדויק","מאיפה הלמה מגיעה — שובך היונים על הריצה","משחק היריב — מבנה הוכחת אי־רגולריות","הוכחה מלאה: {0ⁿ1ⁿ}","אומנות בחירת המילה","ניצול התנאי |xy| ≤ n","ניפוח למטה — i = 0","חשבון אורכים והערת ה־(i−1)t","הדרך העקיפה — סגירויות במקום ניפוח","טעויות קלאסיות סביב הלמה"],"html":"<h1>
