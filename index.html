ות של נחישות לזמן ריצה — P vs NP — מחוץ לקורס הזה.)","a":2}]},{"t":"A_DFA כריעה","q":[{"q":"מדוע המכריע של <span class=\"math\">A<sub>DFA<\/sub><\/span> עוצר תמיד?","c":["כי DFA קטן ממ\"ט","כי בודקים רק את התחביר","הוא לא — רק מזהה","סימולציית DFA על w אורכת בדיוק |w| צעדים — חסומה מראש"],"e":"צעד לכל אות וזהו: אין לולאות אינסופיות בריצת DFA על מילה סופית. לכן \"הרץ ובדוק\" כאן הוא מכריע אמיתי.","a":3},{"q":"איך מכריעים את <span class=\"math\">A<sub>NFA<\/sub><\/span>?","c":["בודקים אם w קצרה ממספר המצבים","ממירים את ה-NFA ל-DFA (בנייה סופית) ומשתמשים במכריע של A_DFA","מריצים את כל הענפים לנצח","זו שפה לא כריעה"],"e":"תת-הקבוצות היא בנייה סופית (גם אם מעריכית — סופית!), ואז סימולציה חסומה. שרשור של שני אלגוריתמים עוצרים = מכריע. יעילות אינה שאלה בקורס.","a":1},{"q":"מה נשבר בטיעון \"הרץ ובדוק\" כשעוברים ל-<span class=\"math\">A<sub>TM<\/sub><\/span>?","c":["אי אפשר לסמלץ מ\"ט בכלל","הקידוד ⟨M,w⟩ אינו חוקי","שום דבר — גם A_TM כריעה","סימולציית מ\"ט אינה חסומה — היא עלולה לרוץ לנצח, ואין רגע שבו מותר להסיק \"לא תעצור\""],"e":"ההשוואה המזוקקת: אותו אלגוריתם בדיוק, רק שהחסם על הריצה נעלם. \"הרץ ובדוק\" נותן מזהה (A_TM ∈ RE) — לא מכריע. שזה בלתי-ניתן-לתיקון יוכח באלכסון.","a":3}]},{"t":"E_DFA כריעה","q":[{"q":"איך מכריעים אם <span class=\"math\">L(D) = ∅<\/span>?","c":["אלגוריתם סימון נגישות מהמצב ההתחלתי; ריק ⟺ אף מצב מקבל לא סומן","מריצים את D על כל המילים עד אורך 100","בודקים אם F ריקה","ממזערים ובודקים אם נשאר מצב יחיד"],"e":"השאלה היא גרפית: קיים מסלול מ-q_s ל-F? הסימון מתייצב תוך ≤|Q| סיבובים. F≠∅ אך לא-נגישה עדיין נותנת שפה ריקה — לכן בדיקת F לבדה שגויה.","a":0},{"q":"מדוע לולאת הסימון עוצרת בהכרח?","c":["כי הקלט סופי","היא לא — צריך לחסום אותה ידנית","בכל סיבוב שמוסיף משהו מסומן מצב חדש — ויש רק |Q| מצבים","כי הגרף חסר מעגלים"],"e":"מד-התקדמות מונוטוני על קבוצה סופית: אין סיבוב חדש ⇒ עצירה; יש ⇒ +1 מסומן. תבנית \"עד יציבות\" עם הצדקת עצירה — כמו עידוני השקילות בפרק 4.","a":2},{"q":"כיצד משתמשים ב-<span class=\"math\">E<sub>DFA<\/sub> ∈ R<\/span> בפתרונות מבחן?","c":["כקופסה שחורה בשם מפורש — למשל \"If L(D) = ∅, accept (E_DFA ∈ R)\" בשורה 1 של מזהה","אסור להשתמש בלי להוכיח מחדש","רק בשאלות על אוטומטים","רק אחרי המרה לרגקס"],"e":"כך בדיוק נפתח המזהה הרשמי של 2023א ש2. משפטי הכיתה הם לבנים מוכנות — מצטטים בשם ובונים מעליהם.","a":0}]},{"t":"EQ_DFA כריעה","q":[{"q":"איך מצמצמים את שאלת השוויון <span class=\"math\">L(D₁)=L(D₂)<\/span> לבדיקת ריקנות?","c":["אי אפשר — EQ לא מתכנס לריקנות","בונים DFA להפרש הסימטרי ובודקים E_DFA עליו — שוויון ⟺ הפרש סימטרי ריק","בודקים ריקנות של שני האוטומטים","משווים את מספרי המצבים אחרי מינימיזציה בלבד"],"e":"‏(L₁∩L̄₂)∪(L̄₁∩L₂) נבנה עם משלים ומכפלות (בניות סופיות!), ואז המכריע של E_DFA. שרשור מכריעים = מכריע.","a":1},{"q":"אילו כלים מפרקים קודמים \"מתממשים\" באלגוריתם של EQ_DFA?","c":["למת הניפוח","בניית GNFA","משפט רייס","המשלים והמכפלה של פרק 2, והריקנות-דרך-נגישות של פרק 4"],"e":"הבניות התאורטיות הופכות לשגרות: complement, product, reachability. חלופה שקולה: מחלקות שקילות על האיחוד ובדיקת q_{s1}≡q_{s2}.","a":3},{"q":"מה הניגוד הגדול שמחכה לשאלת השקילות במעבר למ\"ט?","c":["אין הבדל","<span class=\"math\">EQ<sub>TM<\/sub><\/span> אינה אפילו ב-RE ∪ coRE — בעוד EQ_DFA כריעה לגמרי","‏EQ_TM כריעה גם היא","‏EQ_TM ב-RE בלבד"],"e":"מהקצה הנוח לקצה הקשה ביותר במפה. הסיבה העמוקה: לשפות מ\"ט אין משלים\/חיתוך אפקטיביים ואין בדיקת ריקנות — כל התשתית של הצמצום נעלמת.","a":1}]},{"t":"בעיות כריעות על דקדוקים","q":[{"q":"איך מכריעים את <span class=\"math\">A<sub>CFG<\/sub><\/span>?","c":["בודקים אם w קצרה ממספר הכללים","זו שפה לא כריעה","ממירים ל-CNF ובודקים את כל הגזירות באורך 2|w|−1 בדיוק — מספר סופי","מריצים את הדקדוק כמו אוטומט"],"e":"הקביעוּת של CNF (2n−1 צעדים למילה באורך n) הופכת את החיפוש לסופי. זה השימוש המעשי המרכזי בצורת חומסקי.","a":2},{"q":"איך עובד אלגוריתם הסימון ל-<span class=\"math\">E<sub>CFG<\/sub><\/span>?","c":["מסמנים משתנים \"מניבים\" (שיש להם כלל שכל צדו הימני מסומן\/טרמינלי) עד יציבות; L(G)=∅ ⟺ S לא סומן","מסמנים משתנים נגישים מ-S","בודקים אם יש כלל S→ε","מונים את הכללים"],"e":"מניב = מסוגל לגזור מילת טרמינלים. הסימון מטפס מהטרמינלים למעלה ומתייצב תוך ≤|V| סיבובים. (נגישות מ-S לבדה לא מספיקה — משתנה נגיש עלול לא להניב לעולם.)","a":0},{"q":"מה הסטטוס של <span class=\"math\">EQ<sub>CFG<\/sub><\/span> ולמה הצמצום של EQ_DFA לא עובד?","c":["כריעה אך רק לדקדוקים ב-CNF","לא מוגדרת","לא כריעה — אין משלים\/חיתוך ב-CFL, אז אי אפשר לבנות \"הפרש סימטרי\" ולבדוק ריקנות","כריעה באותו אלגוריתם בדיוק"],"e":"הצמצום נשען על סגירויות שאינן קיימות בח\"ה (פרק 6!). והתוצאה אמיתית: שקילות דקדוקים אי-כריעה — הצצה ראשונה לגבול, עוד לפני מ\"ט.","a":2}]},{"t":"גבול הכריעות — לקראת A_TM","q":[{"q":"מה המכנה המשותף לכל הבעיות הכריעות של הפרק?","c":["כולן על שפות סופיות","כולן דורשות מינימיזציה","כולן רגולריות בעצמן","כולן מתכנסות לבדיקה חסומה-מראש: סימולציה באורך ידוע, נגישות בגרף סופי, או חיפוש בקבוצה סופית"],"e":"‏|w| צעדים, ≤|Q| סיבובים, 2n−1 גזירות — תמיד יש חסם שידוע לפני הריצה. זו התמצית של \"למה כאן כריע\".","a":3},{"q":"אילו מ\"השפות המרכזיות\" בדף הנוסחאות כבר יושבות לנו ב-R?","c":["אף אחת","<span class=\"math\">A<sub>DFA<\/sub>, E<sub>DFA<\/sub>, EQ<sub>DFA<\/sub><\/span>","<span class=\"math\">A<sub>TM<\/sub>, HALT<sub>TM<\/sub><\/span>","<span class=\"math\">E<sub>TM<\/sub>, REG<sub>TM<\/sub><\/span>"],"e":"שלוש שפות ה-DFA — הקומה הכריעה של המפה. שאר הרשימה (A_TM, HALT, E_TM, REG_TM, EQ_TM…) תמלא את הקומות הקשות בפרקים 11–13.","a":1},{"q":"מה תפקידו של פרק זה במבנה ההוכחות של סוף הקורס?","c":["הוא עומד בפני עצמו ללא המשך","הוא מחליף את הצורך ברדוקציות","הוא עוסק רק ביעילות","המכריעים שנבנו כאן הם צעדי-העזר שמזהים ורדוקציות מצטטים — התשתית שמתחת לשאלה 2 של המבחן"],"e":"‏\"E_DFA∈R\" בשורה 1 של מזהה, \"סמלץ את D על u\" בתוך לולאה — כל בניית 2023–2024 נשענת על הקומה הזו. בלי הקומה הכריעה, אין את מי לצטט.","a":3}]}]},{"sid":"ch11","topics":[{"t":"שלוש המחלקות במבט אחד","q":[{"q":"מהי ההגדרה של <span class=\"math\">L ∈ coRE<\/span>?","c":["קיים מזהה ל-L שדוחה תמיד","‏L אינה ב-RE","‏L כריעה עם מכריע איטי","המשלים <span class=\"math\"><span class=\"comp\">L<\/span><\/span> ניתן לזיהוי — קיים מזהה ל-<span class=\"math\"><span class=\"comp\">L<\/span><\/span>"],"e":"‏coRE = המשלימים של שפות RE. אינטואיציה: ל\"לא\" יש עד סופי בר-גילוי. coRE איננה \"ההפך מ-RE\" — יש שפות בשתיהן (R) ויש באף אחת.","a":3},{"q":"מהי אינטואיציית \"העדים\" לשלוש המחלקות?","c":["אין קשר לעדים","‏RE — עד סופי ל\"כן\"; coRE — עד סופי ל\"לא\"; R — לשני הצדדים","‏RE — עד אינסופי; coRE — בלי עדים","‏R — עד אחד; RE — שני עדים"],"e":"עד = אובייקט סופי שאימותו עוצר (ריצה מקבלת, מספר צעדים, מילה). מזהה מחפש עד ב-dovetailing; מכריע יודע לסגור את שני הכיוונים.","a":1},{"q":"כמה \"אזורים\" יש במפת החישוביות של הקורס, ומי מייצג כל אחד?","c":["שלושה: R, RE, coRE","שניים: כריע ולא-כריע","אינסוף אזורים","ארבעה: R (‏A_DFA), ‏RE∖R (‏A_TM), ‏coRE∖R (‏E_TM), ומחוץ לשניהם (‏REG_TM, EQ_TM)"],"e":"התשובה של כל שאלה 2 היא שיוך לאחד מארבעת האזורים. את העדים הקבועים שווה לדעת בעל-פה — הם גם בדף הנוסחאות (\"סטטוס כריעות\").","a":3}]},{"t":"R = RE ∩ coRE","q":[{"q":"בהוכחת <span class=\"math\">RE ∩ coRE ⊆ R<\/span> — איך בונים מכריע משני מזהים?","c":["מריצים את מזהה L ואת מזהה המשלים במקביל — אחד מהם יעצור-ויקבל בזמן סופי","מריצים את מזהה L עד הסוף ואז את השני","הופכים את תשובות מזהה L","בוחרים את המהיר מביניהם"],"e":"כל מילה שייכת ל-L או למשלים — למישהו יש עד, והריצה המקבילה תמצא אותו. ריצה טורית נתקעת אם הראשון מתלולאת — הטעות הקלאסית.","a":0},{"q":"מדוע מותר להפוך תשובות של מכריע אך לא של מזהה?","c":["כי למזהה אין מצב דוחה","כי מכריע דטרמיניסטי","מכריע תמיד עוצר — היפוך קבלה\/דחייה מוגדר; במזהה הלולאה נשארת לולאה ולא הופכת לקבלה","מותר להפוך גם מזהה"],"e":"היפוך פועל רק על תשובות שניתנו. מזהה שמתלולאת על w∉L ימשיך להתלולאת אחרי ההיפוך — והמשלים לא יזוהה. לכן RE לא סגורה למשלים (בעוד R כן).","a":2},{"q":"ידוע ש-<span class=\"math\">L ∈ RE<\/span> וגם <span class=\"math\">L ∉ R<\/span>. מה נובע על <span class=\"math\"><span class=\"comp\">L<\/span><\/span>?","c":["<span class=\"math\"><span class=\"comp\">L<\/span> ∈ coRE ∖ R<\/span> וגם <span class=\"math\"><span class=\"comp\">L<\/span> ∉ RE<\/span>","<span class=\"math\"><span class=\"comp\">L<\/span> ∈ RE<\/span>","<span class=\"math\"><span class=\"comp\">L<\/span> ∈ R<\/span>","כלום"],"e":"משלים של RE הוא coRE; אילו המשלים היה גם ב-RE, שניהם היו ב-RE∩coRE=R — סתירה. הדדוקציה הזו (על A_TM) ממלאת את שני האזורים העליונים של המפה.","a":0}]},{"t":"A_TM ∈ RE — המכונה האוניברסלית","q":[{"q":"מדוע \"סמלץ את M על w וענֵה כמוה\" הוא מזהה ל-<span class=\"math\">A<sub>TM<\/sub><\/span> ולא מכריע?","c":["הוא כן מכריע","כש-M מתלולאת על w, הסימולציה נמשכת לנצח — אין תשובה שלילית בזמן סופי","כי הסימולציה עלולה לטעות","כי U לא יכולה לקרוא כל קידוד"],"e":"קבלה מתגלה סופית ⇒ RE; אבל \"לא מקבלת\" כולל לולאה שאין לה רגע גילוי. הפרופיל המדויק של מזהה — והפער שהאלכסון יהפוך לבלתי-עביר.","a":1},{"q":"מה תפקיד המכונה האוניברסלית בטיעון?","c":["היא מכריעה את A_TM","היא מונעת לולאות","היא דוגמה לשפה לא כריעה","היא מממשת את צעד הסימולציה — מכונה אחת קבועה שמריצה כל ⟨M⟩ על כל w"],"e":"‏U היא הסיבה ש\"Run M on w\" הוא צעד חוקי של מכונה אחת. היא נאמנה לריצה — כולל ללולאות. \"מחשב שמריץ תוכנות\", לא אורקל.","a":3},{"q":"האם העובדה ש-<span class=\"math\">A<sub>TM<\/sub> ∈ RE<\/span> אומרת שנוכל לדעת ש-M לא מקבלת את w?","c":["השאלה חסרת משמעות","לא — הזיהוי חד-צדדי: על \"כן\" נדע מתישהו; על \"לא\" ייתכן שנחכה לנצח","כן — פשוט מחכים מספיק זמן","כן — מריצים את הסימולציה פעמיים"],"e":"אין חסם על זמן הקבלה — בשום רגע אי אפשר להכריז \"מספיק חיכינו\". חד-הצדדיות הזו היא ההגדרה החיה של RE∖R.","a":1}]},{"t":"שיטת האלכסון: A_TM ∉ R","q":[{"q":"בהוכחת האלכסון, מה עושה המכונה D שנבנית מהמכריע ההיפותטי H?","c":["היא מכריעה את המשלים של A_TM","היא מדפיסה את הקידוד של עצמה","על קלט ⟨M⟩ היא שואלת את H על ⟨M,⟨M⟩⟩ ועונה הפוך","היא מריצה את M על כל הקלטים"],"e":"‏D(⟨M⟩) = ההפך ממה ש-M עושה על הקוד של עצמה (לפי H). ההיפוך מותר כי H מכריע — עוצר תמיד. ואז מפעילים את D על ⟨D⟩.","a":2},{"q":"מהי הסתירה שמתקבלת בהרצת <span class=\"math\">D(⟨D⟩)<\/span>?","c":["‏D מקבלת את ⟨D⟩ אם ורק אם D לא מקבלת את ⟨D⟩","‏D רצה לנצח","‏H מחזיר שתי תשובות","‏⟨D⟩ אינו קידוד חוקי"],"e":"לפי בניית D: היא מקבלת ⟺ H אמר \"לא\" ⟺ D לא מקבלת את ⟨D⟩. משפט שמכחיש את עצמו — אין מכונה כזו, ולכן אין H. פרדוקס השקרן, ממוסד.","a":0},{"q":"על מה נשענת ההוכחה — ומה היא לא מניחה?","c":["על כך ש-D מהירה","על תזת צ'רץ'-טיורינג בלבד","רק על כך ש-H עוצר-ועונה-נכון ושמכונות ניתנות לקידוד; היא לא מניחה שום דבר על מבנה H","על מבנה פנימי ספציפי של H"],"e":"הגנריות היא העוקץ: כל מכריע-לכאורה, יהא אשר יהא, מוליד D סותרת. לכן התוצאה מוחלטת — אין אלגוריתם, בשום שפה, לעולם.","a":2}]},{"t":"המשלים והמפה: A_TM ∉ coRE","q":[{"q":"מדוע <span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>?","c":["כי המשלים שלה ריק","כי היא אינה ב-RE","הנחה ללא הוכחה","אילו הייתה, בצירוף A_TM ∈ RE היינו מקבלים A_TM ∈ RE∩coRE = R — סתירה לאלכסון"],"e":"המשוואה R=RE∩coRE עושה את העבודה: שלילת R + חיוב RE ⇒ שלילת coRE. שלוש שורות — וכל שאלה 2 משתמשת בתבנית הזו.","a":3},{"q":"מהו הסטטוס המלא של <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>?","c":["מחוץ ל-RE ∪ coRE","<span class=\"math\">∈ coRE ∖ R<\/span> וגם <span class=\"math\">∉ RE<\/span>","<span class=\"math\">∈ RE ∖ R<\/span>","<span class=\"math\">∈ R<\/span>"],"e":"משלים של RE∖R: יושבת ב-coRE (הגדרה), לא ב-R (משלים משמר R), ולא ב-RE (אחרת שתיהן ב-R). העדה הראשונה לכך ש-RE אינה סגורה למשלים.","a":1},{"q":"היכן יושבת <span class=\"math\">E<sub>TM<\/sub> = {⟨M⟩ | L(M)=∅}<\/span> במפה?","c":["<span class=\"math\">RE ∖ R<\/span>","<span class=\"math\">R<\/span>","מחוץ לשניהם","<span class=\"math\">coRE ∖ R<\/span> — עד-נגדי (מילה מתקבלת) ניתן לגילוי, אך אין מכריע"],"e":"\"ריקות\" היא תנאי ∀ (אף מילה לא מתקבלת) — המשלים ∃ ב-RE (dovetailing), והאי-כריעות מרדוקציה (פרק 12). בניגוד גמור ל-E_DFA הכריעה!","a":3}]},{"t":"סימולציה מוגבלת־צעדים — הכלי","q":[{"q":"מה מחזירה \"הרצת M על x למשך i צעדים\", ולמה הצעד תמיד כשר?","c":["אחת משלוש: קיבלה \/ דחתה \/ לא סיימה — והוא עוצר תמיד כי מספר הצעדים חסום מראש","כן או לא בלבד","את הקונפיגורציה הסופית של M","הוא לא כשר — סימולציה אסורה"],"e":"התקציב הופך את הסימולציה לבדיקה סופית. \"לא סיימה עדיין\" הוא מידע לגיטימי — ובלולאות dovetailing הוא בדיוק מה שמאפשר להמשיך הלאה.","a":0},{"q":"במכונה <span class=\"math\">N_{M,w}<\/span> של 2024ב (\"קבל אם M לא קיבלה את w תוך |x| צעדים\") — מהי <span class=\"math\">L(N)<\/span> כש-M מקבלת את w תוך k צעדים?","c":["‏∅","המילים באורך ≥ k","המילים באורך קטן מ-k בדיוק — שפה סופית, ובפרט לא Σ*","‏Σ* כולה"],"e":"קלט קצר = תקציב קטן ⇒ M \"עוד לא קיבלה\" ⇒ N מקבלת; קלט באורך ≥ k חושף את הקבלה ⇒ N דוחה. כך \"M מקבלת\" ⟺ \"L(N) ≠ Σ*\" — לב הרדוקציה מ-Ā_TM.","a":2},{"q":"איזו בעיה פותר \"אורך הקלט כתקציב צעדים\"?","c":["מקודד שאלת-אינסוף (\"האם אי-פעם?\") לתוך התנהגות שפה על אינסוף קלטים סופיים","מאיץ את הסימולציה","מונע קידודים לא חוקיים","מבטל את הצורך במזהים"],"e":"כל קלט בודק \"עד עומק |x|\", והאיחוד על כל הקלטים מכסה את האינסוף. הטריק שהופך תכונות עצירה לתכונות שפה — לזהות אותו = לפענח חצי מהבניות במבחן.","a":0}]},{"t":"Dovetailing — לולאת החיפוש האינסופית","q":[{"q":"מדוע מבנה הלולאה \"לכל i: לכל |x|≤i: הרץ i צעדים\" מבטיח מציאת כל עד קיים?","c":["היא לא מבטיחה — רק מנסה","כל איטרציה סופית, ולכל עד (x,k) קיים i שמכסה גם את x וגם את התקציב — נגיע אליו","כי הלולאה רצה מהר","כי העדים ממוינים לפי גודל"],"e":"‏i ≥ max(|x|,k) עושה את העבודה. שילוב \"עבודה סופית בכל שלב\" + \"כל עד מכוסה בשלב כלשהו\" = זיהוי. שני הרכיבים חובה בהוכחת הנכונות.","a":1},{"q":"מה נשבר אם מחליפים את הלולאה ב\"לכל x בסדר לקסיקוגרפי: הרץ את M על x עד עצירה\"?","c":["שום דבר — זה שקול","הסדר הלקסיקוגרפי לא מוגדר","המכונה תדחה בטעות","ריצה מתלולאת על x מוקדם חוסמת לנצח את בדיקת כל המילים אחריו — עדים מאוחרים לא יתגלו"],"e":"בלי תקציב, מילה \"רעה\" אחת הורגת את החיפוש. זו הטעות הקלאסית בכתיבת מזהים — והסיבה שכל המזהים הרשמיים נושאים את המבנה המשולש i\/x\/צעדים.","a":3},{"q":"מה חובה לכלול בהוכחת נכונות של מזהה dovetailing (בסגנון הרשמי)?","c":["חישוב סיבוכיות","כיוון \"בשפה ⇒ מקבל\" (העד מכוסה באיטרציה סופית) וכיוון \"לא בשפה ⇒ לא מקבל לעולם\" — כולל נימוק שכל איטרציה סופית","רק שהקוד קומפילבילי","רק דוגמת ריצה אחת"],"e":"הפתרונות הרשמיים (2023א ש2, 2024א ש2) מפרטים בדיוק את שני הכיוונים, כולל בחירת העד המינימלי והטיעון שכל השלבים לפניו סופיים. זה הרף.","a":1}]},{"t":"תבנית ה־∃: מתי שפה ב־RE","q":[{"q":"איזה תנאי מהבאים ניתן לאימות בזמן סופי (ולכן כשר כעד RE)?","c":["\"M מתלולאת על y\"","\"L(M) אינסופית\"","\"M דוחה את y\" — מריצים עד שרואים דחייה","\"M לא מקבלת את y\""],"e":"דחייה היא אירוע שקורה בזמן סופי — מחכים לו. \"לא מקבלת\" ו\"מתלולאת\" כוללות המתנה אינסופית; אינסופיות השפה היא תכונה גלובלית בלי עד יחיד. הבחנה ששווה 40 נקודות.","a":2},{"q":"מדוע <span class=\"math\">HALT<sub>TM<\/sub> ∈ RE<\/span>?","c":["עד ל\"כן\" הוא מספר הצעדים עד העצירה — מסמלצים עד שעוצרת ומקבלים","כי היא כריעה","כי עצירה נדירה","היא לא ב-RE"],"e":"‏\"M עוצרת על w\" מתגלה סופית (מריצים; כשעצרה — מקבלים, בלי קשר אם קיבלה או דחתה). ההבדל מ-A_TM: שם העד הוא קבלה דווקא.","a":0},{"q":"בשאלה 2 של 2024א העד הוא זוג מילים (x,y) עם שלושה תנאים. איך זה משפיע על המזהה?","c":["הופך את השפה ללא-RE","מחייב מכונה אי-דטרמיניסטית","רק מעמיק את הקינון — לולאות על שני האורכים ושני התקציבים; העיקרון זהה","דורש שני מזהים נפרדים"],"e":"עד מורכב = יותר אינדקסים ב-dovetailing (המזהה הרשמי שם מקנן חמש רמות!). המורכבות טכנית — התבנית ∃+אימות-עוצר נשארת אותו דבר.","a":2}]},{"t":"תבנית ה־∀: מתי שפה ב־coRE","q":[{"q":"איך מראים ששפת-∀ (כמו \"‏∀w∈PAL: ‏M לא דוחה את ww\") ב-coRE?","c":["בונים מכריע ישיר","מראים שהיא ב-RE","אי אפשר — ∀ לא ניתן לבדיקה","בונים מזהה למשלים שמחפש עד-נגדי (פלינדרום שנדחה) ב-dovetailing"],"e":"היפוך הכמתים: המשלים הוא ∃ עד-נגדי בר-אימות (דחייה מתגלה סופית!). בדיוק המזהה S של מבחן-לדוגמה ש2. coRE = \"המשלים ניתן לחיפוש\".","a":3},{"q":"מה מרמז תנאי כמתים מעורב (∃∀ שלא מצטמצם) על מיקום השפה?","c":["אין שום רמז","כנראה מחוץ ל-RE ∪ coRE — כמו REG_TM ו-EQ_TM — ונדרשות שתי רדוקציות שלילה","בהכרח ב-R","בהכרח ב-RE"],"e":"‏\"∃D ∀w: …\" (רגולריות) — אף צד לא נסגר בעד סופי יחיד. הכמתים הם היוריסטיקה; ההוכחה — רדוקציות מ-A_TM ומהמשלים (פרק 12).","a":1},{"q":"‏<span class=\"math\">L(M) ⊆ L(D)∘L(D)<\/span> (‏2023א ש2) — למה זו תבנית coRE?","c":["כי הכלה תמיד כריעה","כי D אוטומט סופי","זו דווקא תבנית RE","הפרה ניתנת לעדות: מילה שמתקבלת ע\"י M ואינה בשרשור — עד-נגדי סופי בר-אימות (ריצות D עוצרות)"],"e":"הכלה = ∀w תנאי; עד-נגדי = w∈L(M) (קבלה — סופית) שנכשל בכל פיצול מול D (בדיקות DFA — סופיות). לכן L∈coRE, והצד השני נסגר ברדוקציה. בדיוק הפתרון הרשמי.","a":3}]},{"t":"אסטרטגיית שאלה 2 במבחן","q":[{"q":"מה הצעד הראשון המומלץ בכל שאלה 2?","c":["לנסח את תנאי השפה ואת המשלים בכמתים מפורשים — היפוך הכמתים נותן את חצי התמונה","לנחש את שלוש התשובות לפי תחושה","לכתוב מיד רדוקציה","לבדוק אם הקידוד חוקי"],"e":"מהכמתים נגזר הכול: ∃⇒מזהה, ∀⇒מזהה-למשלים, מעורב⇒שתי שלילות. ניסוח המשלים במפורש הוא הצעד ששווה הכי הרבה נקודות ליחידת זמן.","a":0},{"q":"עניתם \"L ∉ coRE\". מה מתקבל בחינם?","c":["‏L ∈ RE","כלום","‏L ∉ R — כי R ⊆ coRE; מספיק משפט הפניה אחד","‏L ∉ RE"],"e":"‏R = RE∩coRE ⊆ coRE. לכן שלילת coRE (או שלילת RE) גוררת שלילת R — ואת תשובת ה-R מנמקים בשורה אחת, בלי רדוקציה נוספת. כל הפתרונות הרשמיים עושים זאת.","a":2},{"q":"אילו שלושה פרופילי תשובות הופיעו במבחני 2023–2024?","c":["‏RE-בלבד (2024א), אף-אחת (2024ב), ו-coRE-בלבד (2023א\/ב) — לכל פרופיל מזהה אחד + רדוקציות","תמיד אותו פרופיל","‏R תמיד כן","אין דפוס"],"e":"שלושת האזורים הלא-R הופיעו במחזור. המשמעות: לתרגל את שלוש התבניות — מזהה-∃, מזהה-∀ (למשלים), ושתי-שלילות — כי כל אחת הופיעה כשאלת 40 נקודות.","a":0}]}]},{"sid":"ch12","topics":[{"t":"רדוקציית מיפוי — ההגדרה","q":[{"q":"מה נדרש מהפונקציה f ברדוקציה <span class=\"math\">A ≤<sub>m<\/sub> B<\/span>?","c":["חד-חד-ערכית ועל","מקיימת רק w∈A ⟹ f(w)∈B","מוגדרת רק על מילות A","ניתנת לחישוב (מ\"ט שעוצרת תמיד עם פלט), ולכל w: ‏w∈A ⟺ f(w)∈B"],"e":"שני רכיבים: חישוביות (f עצמה אלגוריתם שעוצר) ושקילות דו-כיוונית. חד-חד-ערכיות אינה נדרשת; כיוון יחיד אינו מספיק — ה\"לא\" חייב לעבור ל\"לא\".","a":3},{"q":"מה האינטואיציה של <span class=\"math\">A ≤<sub>m<\/sub> B<\/span>?","c":["‏B נבנית מ-A ע\"י משלים","‏A היא \"מקרה מחופש\" של B — מי שפותר את B פותר דרך התרגום גם את A","‏A קלה יותר מ-B בזמן ריצה","‏A מוכלת ב-B כקבוצה"],"e":"רדוקציה = תרגום שאלות. חשוב: ≤m אינו הכלת קבוצות! ‏A⊆B לא גורר A≤mB ולהפך — בלבול נפוץ שנבחן בשאלות נכון\/לא-נכון.","a":1},{"q":"במבחן רוצים להוכיח ששפה L קשה. מאיפה לאן בונים את הרדוקציה?","c":["מ-L אל השפה הידועה","הכיוון לא משנה","משתי השפות אל שפה שלישית","מהשפה הידועה כקשה (A_TM או משלימתה) אל L — הידועה משמאל"],"e":"קושי מטפס נגד חץ הרדוקציה: ‏קשה ≤m L מדביק את L בקושי. הכיוון ההפוך (L ≤m A_TM) נכון כמעט תמיד וחסר ערך — טעות הכיוון הקלאסית.","a":3}]},{"t":"מה ≤m משמר — כללי ההעברה","q":[{"q":"נתון <span class=\"math\">A ≤<sub>m<\/sub> B<\/span> ו-<span class=\"math\">B ∈ RE<\/span>. מה נובע?","c":["<span class=\"math\">A ∈ RE<\/span> — מזהים את A ע\"י חישוב f והרצת המזהה של B","<span class=\"math\">B ∈ R<\/span>","<span class=\"math\">A ∈ coRE<\/span>","כלום"],"e":"השייכות יורדת עם החץ: המזהה המורכב \"חשב f(w), הרץ את מזהה B עליו\" מזהה את A. אותו כלל ל-R ול-coRE.","a":0},{"q":"מה מוכיחה הרדוקציה <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> על L?","c":["<span class=\"math\">L ∈ RE<\/span>","<span class=\"math\">L ∈ R<\/span>","<span class=\"math\">L ∉ coRE<\/span> וגם <span class=\"math\">L ∉ R<\/span> — אך לא בהכרח <span class=\"math\">L ∉ RE<\/span>","<span class=\"math\">L ∉ RE<\/span>"],"e":"‏A_TM ∉ coRE ו-∉R — ושתי אי-השייכויות מטפסות. אבל A_TM ∈ RE, אז על RE אין מסקנה (L יכולה להיות A_TM עצמה). לשלילת RE — רדוקציה מהמשלים.","a":2},{"q":"כדי להראות ששפה מחוץ ל-RE ∪ coRE, מה נדרש?","c":["שתי רדוקציות: גם <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> וגם <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span>","רדוקציה אחת מ-A_TM","מזהה שמתלולאת תמיד","הוכחת אלכסון חדשה"],"e":"כל רדוקציה שוללת צד אחד: מ-A_TM — את coRE; מהמשלים — את RE. יחד — מחוץ לשניהם. בדיוק מה שנעשה ל-REG_TM ול-EQ_TM.","a":0}]},{"t":"תבנית הכתיבה המלאה של רדוקציה","q":[{"q":"מהם ארבעת רכיבי רדוקציה כתובה-מלאה בפורמט הרשמי?","c":["הוכחת RE, הוכחת coRE, הוכחת R, סיכום","הכרזת הרדוקציה ומסקנתה; הגדרת f עם קוד המכונות; משפט החישוביות; ונכונות בשני הכיוונים","ציור, טבלה, דוגמה, סיכום","רק הגדרת f"],"e":"כך בנוי כל פתרון רשמי של שאלה 2: מי≤mמי ולמה זה מספיק, המכונה הנבנית, \"f computable\" מנומק, ושני חצאי השקילות בנפרד.","a":1},{"q":"מדוע משפט החישוביות של f כמעט תמיד קצר וזהה?","c":["כי מותר לדלג עליו","כי f תמיד הזהות","כי חישוביות נובעת מהנכונות","כי f רק כותבת קידוד של מכונה בעלת תבנית קבועה — עבודה תחבירית סופית"],"e":"‏f מרכיבה טקסט: \"המכונה שעל קלט x עושה...\". אין בה שום הרצה של M — רק כתיבת תיאור. לכן המשפט קבוע — אבל השמטתו עולה בנקודות.","a":3},{"q":"בכיוון \"‏⟨M,w⟩ ∉ A_TM ⟹ f(⟨M,w⟩) ∉ L\" — מה מסתתר וקל לפספס?","c":["ש-f לא מוגדרת שם","\"לא מקבלת\" מתפצל לדחייה וללולאה — ולעיתים המכונה הנבנית מתנהגת אחרת בכל תת-מקרה","שום דבר — זה שיקוף של הכיוון הראשון","שהקידוד עלול להיות לא חוקי"],"e":"‏N שבנויה \"run M on w; if accepted…\" מתלולאת כש-M מתלולאת ודוחה\/ממשיכה כש-M דוחה — צריך לוודא ששני התת-מקרים נותנים f(·)∉L. הפתרונות הרשמיים תמיד מפרידים אותם.","a":1}]},{"t":"HALT_TM — הרדוקציה הראשונה","q":[{"q":"ברדוקציה <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> HALT<sub>TM<\/sub><\/span>, מה עושה המכונה N ולמה?","c":["דוחה כל קלט","מריצה את M פעמיים","מריצה את M על הקלט; קבלה→קבלה, דחייה→לולאה — כך \"עוצרת\" ⟺ \"מקבלת\"","עוצרת תמיד"],"e":"המרת דחייה ללולאה מזהה את שתי צורות ה\"לא\" (דחייה, לולאה) לצורה אחת: אי-עצירה. עכשיו שאלת העצירה של N שקולה לשאלת הקבלה של M.","a":2},{"q":"מה הסטטוס המלא של <span class=\"math\">HALT<sub>TM<\/sub><\/span>?","c":["<span class=\"math\">RE ∖ R<\/span> — מזהים בסימולציה-עד-עצירה; לא כריעה מהרדוקציה","<span class=\"math\">R<\/span>","<span class=\"math\">coRE ∖ R<\/span>","מחוץ ל-RE ∪ coRE"],"e":"עד ל\"כן\" = מספר צעדים עד עצירה ⇒ RE. הרדוקציה מ-A_TM שוללת R (ו-coRE). \"בעיית העצירה\" — הדוגמה המפורסמת בעולם לאי-כריעות.","a":0},{"q":"מדוע חשוב שההמרה דחייה→לולאה נעשית בתוך N הנבנית ולא בתוך f?","c":["זה לא חשוב","כי N חייבת להיות מהירה","‏f חייבת לעצור תמיד — היא רק כותבת את הקוד של N; ההתנהגות האינסופית שייכת ל-N בלבד","כי לולאות אסורות בכל מקום"],"e":"ההפרדה הקריטית: f = מהדר (עוצר תמיד); N = התוכנית המקומפלת (מותר לה להתלולאת). ערבוב השניים — \"f שמריצה את M\" — פוסל את הרדוקציה.","a":2}]},{"t":"E_TM — רדוקציה עם משלים","q":[{"q":"במכונה <span class=\"math\">N_{M,w}<\/span> שמתעלמת מהקלט ומריצה את M על w — בין אילו שתי שפות קופצת <span class=\"math\">L(N)<\/span>?","c":["<span class=\"math\">{w}<\/span> ו-<span class=\"math\">∅<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span> ו-<span class=\"math\">{ε}<\/span>","שתי שפות סופיות","<span class=\"math\">Σ<sup>*<\/sup><\/span> (אם M מקבלת את w) ו-<span class=\"math\">∅<\/span> (אחרת)"],"e":"התעלמות מהקלט ⇒ התנהגות אחידה על כולם: או שכולם מתקבלים או שאף אחד. המתג הבינארי ∅\/Σ* הוא אבן הבניין של רוב הרדוקציות.","a":3},{"q":"מדוע <span class=\"math\">A ≤<sub>m<\/sub> <span class=\"comp\">B<\/span><\/span> שקולה ל-<span class=\"math\"><span class=\"comp\">A<\/span> ≤<sub>m<\/sub> B<\/span>?","c":["רק כאשר B כריעה","אותה f בדיוק: ‏w∈A ⟺ f(w)∈B̄ היא בדיוק ‏w∈Ā ⟺ f(w)∈B","כי מותר להפוך את f","הן לא שקולות"],"e":"שלילת שני צדי שקילות משמרת אותה. לכן \"A_TM ≤m Ē_TM\" ו-\"Ā_TM ≤m E_TM\" הן אותה עובדה — והקווים העיליים במבחן מחליפים צד חופשי.","a":1},{"q":"מה המסקנה מהרדוקציה על מיקום <span class=\"math\">E<sub>TM<\/sub><\/span>?","c":["<span class=\"math\">E<sub>TM<\/sub> ∈ RE ∖ R<\/span>","<span class=\"math\">E<sub>TM<\/sub> ∈ R<\/span>","מחוץ לשני העולמות","<span class=\"math\">E<sub>TM<\/sub> ∈ coRE ∖ R<\/span>: המשלים ב-RE (חיפוש מילה מתקבלת), והכריעות נשללת מהרדוקציה"],"e":"‏Ē_TM = \"∃ מילה מתקבלת\" — dovetailing ⇒ RE. ‏Ā_TM ≤m E_TM שולל R. העדה הקנונית של coRE∖R (מול E_DFA הכריעה — הניגוד שממחיש את קפיצת המדרגה).","a":3}]},{"t":"גלריית המכונות המתוכנתות N_{M,w}","q":[{"q":"מה מאפיין את כל המכונות <span class=\"math\">N_{M,w}<\/span> בגלריית הרדוקציות?","c":["הן מקודדות את שאלת (M,w) בהתנהגות הגלובלית שלהן — L(N) קופצת בין שתי צורות מובחנות לפי התשובה","הן תמיד עוצרות","הן מריצות את M על כל הקלטים","הן זהות זו לזו"],"e":"העיקרון: לתרגם \"האם M מקבלת את w?\" לתכונה של השפה L(N) שמפרידה בדיוק לפי תנאי שפת היעד — ∅\/Σ*, עוצרת\/לא, סופית\/הכול.","a":0},{"q":"ב-2024א ש2 הרדוקציה צירפה גם DFA קבוע D עם L(D)={00}. מה תפקידו?","c":["לוודא שהקידוד חוקי","אין תפקיד — קישוט","לכייל את התנאי של שפת היעד — לספק את הרכיב ה\"סופי\" שהשאלה דורשת לצד המכונה המתוכנתת","להאיץ את הסימולציה"],"e":"שפת היעד דיברה על זוג ⟨M,D⟩ עם תנאי על xy∈L(D). ה-D הקבוע הקטן נבחר כך שהתנאי יתקיים בדיוק כש-N מתנהגת \"טוב\". רכיבים קבועים כאלה מופיעים ברוב רדוקציות המבחן.","a":2},{"q":"רוצים רדוקציה שמפרידה \"M מקבלת את w\" ⟹ N עוצרת-ודוחה-הכול, אחרת N מתלולאת-על-הכול. איזו N כותבים?","c":["N: \"על x: הרץ את M על w; אם קיבלה — דחה; אחרת המשך לרוץ (לולאה)\"","N: \"על x: קבל\"","N: \"על x: הרץ את M על x ודחה\"","אי אפשר לבנות כזו"],"e":"בדיוק ה-N של 2024א ש2: קבלה→דחייה מיידית (עצירה!), אי-קבלה→לולאה. ההבחנה עצירה\/אי-עצירה עם L(N)=∅ בשני המקרים — מראה כמה עדינות יש בבחירת ההתנהגות.","a":0}]},{"t":"הטריק של התקציב: רדוקציות מ־Ā_TM","q":[{"q":"מדוע רדוקציות מ-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span> דורשות את טריק התקציב?","c":["כי אסור להריץ את M","כי \"M לא מקבלת\" הוא תנאי בלי עד סופי — מפרקים אותו ל\"לכל תקציב |x|, עדיין לא קיבלה\"","כי המשלים אינו שפה","כדי לקצר את ההוכחה"],"e":"אי-קבלה לא מתגלה בזמן סופי — אבל \"לא קיבלה תוך t צעדים\" כן. פריסת האינסוף על פני אינסוף קלטים (תקציב=|x|) הופכת את התכונה לבדיקה קלט-קלט.","a":1},{"q":"ב-N של 2024ב (\"קבל אם M לא קיבלה תוך |x| צעדים\") — מדוע במקרה \"M מקבלת תוך k צעדים\" מתקבל <span class=\"math\">L(N) ≠ Σ<sup>*<\/sup><\/span>?","c":["כי N נתקעת על מילים ארוכות","כי N דוחה את w עצמה","כי L(N) ריקה","כל x באורך ≥ k חושף את הקבלה ולכן נדחה — ‏L(N) היא בדיוק המילים הקצרות מ-k"],"e":"מילים קצרות \"לא רואות\" את הקבלה ומתקבלות; מהאורך k והלאה — דחייה. שפה סופית ≠ Σ* — בדיוק ההפרדה שהרדוקציה צריכה מול המקרה השני (L(N)=Σ*).","a":3},{"q":"מתי כדאי לחשוד שנדרשת רדוקציה מ-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span> עם תקציב?","c":["אף פעם — הטריק נדיר","כשתנאי שפת היעד הוא אוניברסלי — \"מקבלת כל קלט\", \"L(M)=Σ*\", \"N עוצרת על הכול\"","כשהשפה מכילה DFA","כשיש בשפה שני קידודים"],"e":"תנאי-∀ על התנהגות M מתיישר טבעית עם \"לכל תקציב לא קרה כלום\" = אי-קבלה. הופיע ב-2024ב ש2 ובמבחן-לדוגמה ש2 (עם H̄ALT) — דפוס חוזר מובהק.","a":1}]},{"t":"REG_TM ו־EQ_TM — מחוץ לשני העולמות","q":[{"q":"ברדוקציה ל-<span class=\"math\">REG<sub>TM<\/sub><\/span>, בין אילו שתי שפות מחליפה המכונה הנבנית?","c":["בין שתי שפות רגולריות","בין שפה סופית לאינסופית","בין <span class=\"math\">Σ<sup>*<\/sup><\/span> (רגולרית) לבין <span class=\"math\">{0<sup>n<\/sup>1<sup>n<\/sup>}<\/span> (לא רגולרית) — לפי קבלת w","בין ∅ ל-{ε}"],"e":"המתג חייב לחצות את גבול התכונה הנבדקת (רגולריות): צד אחד בפנים, צד שני בחוץ. N מקבלת את 0ⁿ1ⁿ תמיד, ואת השאר רק אם M קיבלה את w.","a":2},{"q":"איך שוללים גם RE וגם coRE עבור REG_TM?","c":["שתי גרסאות של הבנייה: באחת \"מקבלת⇒רגולרית\", בשנייה \"מקבלת⇒לא-רגולרית\" — רדוקציות מ-Ā_TM ומ-A_TM בהתאמה","רדוקציה אחת חזקה","אלכסון ישיר","אי אפשר"],"e":"חילוף התפקידים של שני צדי המתג הופך את כיוון הרדוקציה. הגמישות בתכנות N — לבחור איזו שפה מייצגת \"כן\" — היא שמאפשרת לתקוף את שני הצדדים.","a":0},{"q":"איך תוקפים את <span class=\"math\">EQ<sub>TM<\/sub><\/span>?","c":["דרך E_DFA","עם למת הניפוח","משווים את N_{M,w} למכונות קבועות (למשל M_∅ או M_{Σ*}) — וכל צד של המפה נופל עם השוואה מתאימה","בונים שני N שונים בכל רדוקציה"],"e":"שוויון-למכונה-קבועה ממיר את EQ לשאלת תכונה של L(N) יחיד: מול M_∅ זו בדיוק ריקות (צד אחד), מול M_{Σ*} — אוניברסליות (הצד השני). כך EQ_TM ∉ RE∪coRE.","a":2}]},{"t":"תכונות ≤m — טרנזיטיביות ומשלים","q":[{"q":"מדוע ≤m טרנזיטיבית, ומה התועלת?","c":["כי כל הפונקציות טרנזיטיביות","היא לא טרנזיטיבית","רק לשפות כריעות","הרכבת שתי פונקציות חישוביות חישובית — ולכן מותר לרדת מ-HALT_TM (או כל קשה מוכחת) במקום מ-A_TM"],"e":"‏g∘f מחשבת את שתי הרדוקציות ברצף. מעשית: שרשרת הקושי מתארכת — כל שפה שהוכחה קשה נהיית נקודת זינוק חדשה.","a":3},{"q":"\"אם L ≤m L̄ אז L אינה כריעה\" — נכון?","c":["לא מוגדר","לא — למשל שפת המילים באורך זוגי: כריעה לגמרי, ו-f(w)=1w ממפה אותה למשלימה","כן — רק שפות קשות נמפות למשלימן","כן — כי זה גורר אי-סימטריה"],"e":"‏2024ב ש3.4 בדיוק: רדוקציה-למשלים איננה סימן קושי (כל כריעה לא-טריוויאלית עושה זאת). ההשלכה המעניינת היחידה היא כשידוע משהו נוסף (כמו L∈RE ⇒ L∈coRE ⇒ L∈R).","a":1},{"q":"כל שפה כריעה L ניתנת למיפוי לכל שפה לא-טריוויאלית B. איך?","c":["בעזרת הזהות","רק אם B כריעה גם היא","זה לא נכון","המכריע של L בוחר: w∈L ⟼ עד קבוע מ-B, אחרת ⟼ עד קבוע מחוץ ל-B"],"e":"‏f מריצה את המכריע (עוצר!) וממפה לאחד משני קבועים w_in∈B, w_out∉B. \"לא-טריוויאלית\" = שני העדים קיימים. זו הנקודה של 2024ב ש3.4 Option 1 — וגם התיקון ב-2023ב ש3.6.","a":3}]},{"t":"טעויות כיוון קלאסיות","q":[{"q":"סטודנט הוכיח <span class=\"math\">L ≤<sub>m<\/sub> A<sub>TM<\/sub><\/span> והסיק ש-L לא כריעה. מה הפגם?","c":["הכיוון הפוך — זה מראה רק ש-L \"לא יותר קשה\" מ-A_TM; כל שפה ב-RE מקיימת זאת","אין פגם","הרדוקציה לא חישובית","צריך היה למפות ל-HALT"],"e":"קושי עובר מהמקור אל היעד, לא להפך. L ≤m A_TM נכון אפילו ל-∅. לשלילה — הידועה חייבת להיות משמאל: A_TM ≤m L.","a":0},{"q":"\"‏A ∈ R וגם A ≤m B, לכן B ∈ R\" — מה הפגם?","c":["‏R לא נשמרת ברדוקציות בכלל","חסרה חישוביות של f","השייכות יורדת מ-B ל-A ולא להפך — B יכולה להיות קשה כרצוננו","אין פגם — זו טענה נכונה"],"e":"מהצד הקל אי אפשר להסיק כלום על הקשה: כל כריעה נמפית ל-A_TM. הכלל: B∈R ⟹ A∈R. לזכור את הכיוון = חצי מהציון בשאלות נכון\/לא-נכון.","a":2},{"q":"מדוע f שמכילה את הצעד \"אם M עוצרת על w אז…\" פסולה?","c":["‏f חייבת להיות חישובית (לעצור תמיד) — והצעד הזה בעצמו אינו ניתן להכרעה","כי אסור להזכיר את M בתוך f","כי f חייבת להיות ליניארית","היא לא פסולה"],"e":"כל הקושי חייב להידחס לתוך המכונה הנבנית N (שלא רצה בזמן חישוב f!) — לא לתוך f. ‏f כותבת טקסט; היא לא מריצה שום דבר מסוכן.","a":0}]},{"t":"רדוקציות טיורינג — מבט קצר","q":[{"q":"מה מותר ב-<span class=\"math\">≤<sub>T<\/sub><\/span> ואסור ב-<span class=\"math\">≤<sub>m<\/sub><\/span>?","c":["אין הבדל","לשאול את האורקל כמה שאלות ולעבד את תשובותיו — כולל להפוך אותן","להשתמש בפונקציה חישובית","לקרוא את הקלט"],"e":"מיפוי = שאלה אחת שהתשובה לה היא התשובה. טיורינג = מכריע עם קופסת-ייעוץ חופשית. ההיפוך המפורסם: A_TM ≤T Ā_TM (שאל והפוך) — בעוד ≤m לשם בלתי אפשרי.","a":1},{"q":"מה משמרת <span class=\"math\">≤<sub>T<\/sub><\/span> ומה לא?","c":["משמרת הכול כמו ≤m","לא משמרת דבר","משמרת רק RE","משמרת כריעות (B∈R ⟹ A∈R) — אבל לא RE ולא coRE"],"e":"עיבוד חופשי של תשובות שובר את חד-הצדדיות של RE (אפשר להפוך!). לכן לשאלות RE\/coRE של שאלה 2 חובה ≤m — ו-≤T מוזכרת בעיקר כדי לחדד את ההבדל.","a":3},{"q":"מדוע <span class=\"math\">A<sub>TM<\/sub> ≰<sub>m<\/sub> <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span> למרות ש-<span class=\"math\">A<sub>TM<\/sub> ≤<sub>T<\/sub> <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>?","c":["שתי הטענות שגויות","מיפוי היה גורר A_TM ∈ coRE (מהשתמרות coRE) — סתירה; האורקל ההופך אינו מיפוי","כי המשלים ריק","כי f לא מוגדרת על קידודים"],"e":"ההדגמה החדה ביותר להבדל: יחס ≤T סימטרי-למשלים תמיד, בעוד ≤m כפוף לכללי ההעברה של RE\/coRE. אם שכחתם מי משמר מה — הדוגמה הזו משחזרת הכול.","a":1}]}]},{"sid":"ch13","topics":[{"t":"תכונה סמנטית ותכונה טריוויאלית","q":[{"q":"מה הופך תכונה של מכונות ל\"סמנטית\"?","c":["היא מנוסחת באנגלית פורמלית","היא תלויה במספר המצבים","היא נכונה לכל המכונות","היא תלויה רק ב-L(M) — שתי מכונות עם אותה שפה מקבלות את אותה תשובה"],"e":"סמנטי = על השפה; תחבירי = על הקוד. \"יש ל-M 100 מצבים\" — תחבירית (שתי מכונות שקולות-שפה יכולות להיבדל); \"L(M) אינסופית\" — סמנטית.","a":3},{"q":"מתי תכונה <span class=\"math\">C ⊆ RE<\/span> נקראת טריוויאלית?","c":["כאשר C כריעה","כאשר C = ∅ או C = RE כולה — אף שפה או כל השפות","כאשר C מכילה את ∅","כאשר C סופית"],"e":"טריוויאלית = לא מסננת כלום בתוך RE. אז L_C היא ∅ או כל הקידודים — כריעה בבדיקת תחביר. \"מכילה את השפה הריקה\" ≠ \"היא הקבוצה הריקה\" — בלבול מסוכן.","a":1},{"q":"האם \"‏M עוצרת על ε תוך 100 צעדים\" תכונה סמנטית?","c":["כן — היא על התנהגות המכונה","כן — כל תכונה של מכונות סמנטית","לא מוגדר","לא — היא על הריצה\/הקוד; שתי מכונות עם אותה שפה יכולות להיבדל בה (והיא בכלל כריעה בסימולציה)"],"e":"אפשר להאט מכונה בלי לשנות את שפתה — התכונה נשברת בין שקולות-שפה ⇒ לא סמנטית. והיא כריעה: מסמלצים 100 צעדים. רייס לא רלוונטי לכאלה.","a":3}]},{"t":"משפט רייס — הנוסח המדויק","q":[{"q":"מה קובע משפט רייס?","c":["לכל תכונה סמנטית לא-טריוויאלית C: השפה L_C = {⟨M⟩ | L(M) ∈ C} איננה כריעה","כל שפה על קידודי מכונות איננה כריעה","כל תכונה סמנטית איננה ב-RE","אין מכונה שמדפיסה את הקוד של עצמה"],"e":"שלושה תנאים (סמנטית, ≠∅, ≠RE) ⇒ ∉R. לא כל שפת-קידודים (A_DFA כריעה!), ולא ∉RE (ראו Ē_TM ∈ RE... כלומר {L≠∅} נותן L_C∈RE).","a":0},{"q":"מדוע רייס כל-כך שימושי במבחן?","c":["הוא מחליף את למת הניפוח","הוא מקצר בניות של מזהים","משפט אחד סוגר את שאלת ה-∉R לכל תכונה סמנטית לא-טריוויאלית — בלי רדוקציה פרטנית","הוא מוכיח גם RE וגם coRE"],"e":"ריקות, סופיות, רגולריות, שוויון ל-PAL — הכול ∉R בשלוש בדיקות וציטוט. אבל רק ∉R; מיקום RE\/coRE נשאר עבודה.","a":2},{"q":"אילו מהשפות הבאות נופלות ישירות תחת רייס?","c":["<span class=\"math\">E<sub>TM<\/sub><\/span>, ‏<span class=\"math\">REG<sub>TM<\/sub><\/span>, ‏<span class=\"math\">L<sub>∞<\/sub><\/span>, ‏<span class=\"math\">PAL<sub>TM<\/sub><\/span> — כולן \"L(M) בעלת תכונה לא-טריוויאלית\"","<span class=\"math\">A<sub>DFA<\/sub><\/span> ו-<span class=\"math\">E<sub>DFA<\/sub><\/span>","<span class=\"math\">A<sub>TM<\/sub><\/span> בלבד","אף אחת"],"e":"ריקה\/רגולרית\/אינסופית\/שווה-ל-PAL — תכונות שפה לא-טריוויאליות ⇒ ∉R בציטוט אחד. (A_TM עצמה אינה מנוסחת כתכונת L(M) בלבד — יש בה w; לה יש את האלכסון.)","a":0}]},{"t":"הוכחת רייס — הרעיון","q":[{"q":"בהוכחת רייס, איך מתנהגת המכונה N שנבנית מ-⟨M,w⟩?","c":["בודקת אם L(M)∈C","מריצה את M על w, ואם קיבלה — ממשיכה כמזהה M₀ של שפה L₀∈C; כך L(N) קופצת בין ∅ ל-L₀","מריצה את M₀ תמיד","דוחה כל קלט"],"e":"שלב 1 הוא \"שער\": נפתח רק אם M מקבלת את w. סגור ⇒ L(N)=∅∉C; פתוח ⇒ L(N)=L₀∈C. בדיוק תבנית המתג מפרק 12 — עם L₀ במקום Σ*.","a":1},{"q":"מדוע ההנחה בה\"כ <span class=\"math\">∅ ∉ C<\/span> לגיטימית?","c":["כי ∅ אף פעם לא ב-C","כי C חייבת להכיל את Σ*","היא לא לגיטימית — פגם בהוכחה","אם ∅∈C עוברים לתכונה המשלימה RE∖C — ו-L_C כריעה אמ\"מ המשלים שלה כריע"],"e":"‏R סגורה למשלים, אז מספיק להוכיח על אחת מהשתיים. הבחירה מסדרת ש\"שער סגור\" (L(N)=∅) נופל מחוץ ל-C — כיוון הרדוקציה מסתדר.","a":3},{"q":"איזו רדוקציה מבצעת הוכחת רייס בפועל?","c":["אין רדוקציה — הוכחה ישירה","<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<sub>C<\/sub><\/span> — ולכן L_C ∉ R (ואף ∉ coRE)","<span class=\"math\">L<sub>C<\/sub> ≤<sub>m<\/sub> A<sub>TM<\/sub><\/span>","<span class=\"math\">E<sub>TM<\/sub> ≤<sub>m<\/sub> A<sub>TM<\/sub><\/span>"],"e":"רייס הוא רדוקציה גנרית מ-A_TM: הידועה משמאל, כמו תמיד. (בגרסה עם ∅∈C מקבלים את זה על המשלים — ומסיקים ∉R דרך סגירות R למשלים.)","a":1}]},{"t":"צ'ק־ליסט התחולה של רייס","q":[{"q":"מהן שלוש הבדיקות שחובה להציג לפני ציטוט רייס?","c":["C סגורה לאיחוד; C כריעה; C סופית","אין בדיקות — מצטטים ישר","התנאי מנוסח כ-L(M)∈C עם C⊆RE; קיים עד ב-C; וקיים עד ב-RE∖C","המכונה דטרמיניסטית; הקידוד חוקי; השפה אינסופית"],"e":"סמנטיות + שני עדי אי-טריוויאליות. הפורמט הרשמי (2023א ש3.6) מציג בדיוק את השלוש: C⊆RE, ‏C≠∅ עם עד, C≠RE עם עד.","a":2},{"q":"עבור <span class=\"math\">L = {⟨M⟩ | ∃w: M לא מקבלת את w}<\/span> — מהי C ומהם העדים?","c":["C = {L′∈RE | L′ ≠ Σ*}; עד חיובי A_TM (או ∅), עד שלילי Σ*","C = {L′ | w ∉ L′}; עדים w ו-ε","C = RE; אין עדים","C = {∅}; עדים ∅ ו-Σ*"],"e":"\"קיימת מילה לא-מתקבלת\" ⟺ \"השפה אינה Σ*\". שני העדים חייבים להיות שפות RE — ושניהם מהספרייה הסטנדרטית. זו התשובה הרשמית של 2023א ש3.6.","a":0},{"q":"מדוע העדים בבדיקות 2–3 חייבים להיות שפות ב-RE?","c":["אין דרישה כזו","כי עדים חייבים להיות סופיים","כי C מוגדרת כתת-קבוצה של RE — שפה מחוץ ל-RE אינה L(M) של אף מכונה ואינה מעידה כלום","כדי שיהיה קל לתאר אותם"],"e":"אי-הטריוויאליות היא בתוך עולם שפות-המכונה. \"PAL_TM ∈ C\" למשל היא עדות פסולה אם PAL_TM∉RE — בדיוק הנקודה שמלכודת 2024ב ש3.5 בנויה עליה.","a":2}]},{"t":"מתי רייס לא חל — המלכודות","q":[{"q":"ב-2024ב ש3.5 (<span class=\"math\">L(M) ≠ PAL<sub>TM<\/sub><\/span>) — מדוע רייס לא שולל כריעות?","c":["כי התכונה תחבירית","כי PAL_TM סופית","רייס דווקא חל שם","‏PAL_TM ∉ RE, ולכן כל שפת-מכונה שונה ממנה — C=RE כולה, טריוויאלית — ו-L היא כל הקידודים, כריעה"],"e":"המלכודת: תנאי שנראה מסנן אבל מתקיים אוטומטית לכל L(M)∈RE. הבדיקה C≠RE נכשלת ⇒ טריוויאלית ⇒ L={⟨M⟩ חוקי} ∈ R. False רשמי.","a":3},{"q":"‏<span class=\"math\">L∞<sub>k<\/sub><\/span> (2023ב ש3.5) משלבת תנאי סמנטי עם חסם אורך על ⟨M⟩. מה קורה?","c":["התכונה נהיית טריוויאלית","הרכיב התחבירי (|⟨M⟩|≤k) הופך את השפה לסופית — כריעה, ורייס כלל לא רלוונטי","רייס חל כרגיל","השפה מחוץ ל-RE"],"e":"מספר סופי של קידודים באורך ≤k ⇒ שפה סופית ⇒ ∈R. תוספת תחבירית יכולה לרסק \"סמנטיות\" — לקרוא את כל התנאי, לא רק את החלק המרשים.","a":1},{"q":"בהפרכת \"לפי רייס L איננה כריעה\" — מה מבנה התשובה המלא?","c":["מספיק לומר שרייס לא חל","מספיק לתת מכריע","מראים ש-L ∈ RE","מראים מדוע רייס לא חל (טריוויאלית\/תחבירית) וגם נותנים מכריע בפועל ל-L"],"e":"אי-תחולת המשפט אינה הוכחת כריעות! הפתרון הרשמי של 2024ב ש3.5 עושה את שניהם: מסביר את הטריוויאליות, ואז \"L = {⟨M⟩ חוקי} which is obviously in R\".","a":3}]},{"t":"ניסוח C בתשובת מבחן","q":[{"q":"מה ההבדל בין C לבין L_C — ולמה חשוב לא להתבלבל?","c":["C — קבוצת שפות; L_C — קבוצת קידודי המכונות שהשפה שלהן ב-C. עירבוב הורס את שלוש הבדיקות","הם אותו אובייקט בשני סימונים","C היא המשלים של L_C","L_C ⊆ C תמיד"],"e":"שתי רמות שונות: שפות מול מילים-שהן-קידודים. \"C = {⟨M⟩|…}\" — הטעות שמפילה את הסמנטיות מיד; העדים הם שפות, לא מכונות.","a":0},{"q":"\"‏M מקבלת לפחות מילה אחת באורך זוגי\" — איך מנסחים כתכונת שפה?","c":["<span class=\"math\">C = {w | |w| זוגי}<\/span>","אי אפשר — התכונה על הריצה","<span class=\"math\">C = {L′ ∈ RE | L′ ∩ (ΣΣ)<sup>*<\/sup> ≠ ∅}<\/span>","<span class=\"math\">C = {L′ | |L′| זוגי}<\/span>"],"e":"\"מקבלת מילה עם תכונה X\" ⇝ \"L(M) חותכת את שפת ה-X\". תרגום סטנדרטי; עדים: {aa}∈C (אם aa∈(ΣΣ)*), ∅∉C. השאר — שגיאות רמה (גודל השפה? מילים בודדות?).","a":2},{"q":"אילו שפות-עדים כדאי לשלוף אוטומטית לבדיקות אי-הטריוויאליות?","c":["∅, ‏Σ*, ‏{ε}, שפות סופיות, ו-A_TM — כולן ב-RE וכמעט כל זוג עדים נבנה מהן","PAL_TM ו-EQ_TM","רק שפות רגולריות","שפות אקראיות"],"e":"ספרייה קטנה שמכסה הכול: ריקה\/מלאה\/יחידון\/סופית + דוגמה \"מסובכת\" ב-RE. עדים מחוץ ל-RE פסולים (המלכודת של PAL_TM!).","a":0}]},{"t":"רייס שולל R בלבד — לא RE","q":[{"q":"מה רייס אינו מסוגל לקבוע?","c":["שום דבר — הוא קובע הכול","את מיקום L_C ביחס ל-RE ו-coRE — יש L_C סמנטיות ב-RE, ב-coRE, ומחוץ לשניהם","את אי-הכריעות","את הסמנטיות של C"],"e":"כולן ∉R — אבל: {⟨M⟩|L(M)≠∅} ∈ RE; ‏E_TM ∈ coRE; ‏REG_TM באף אחת. אותה מסקנת-רייס, שלושה מיקומים שונים — ההמשך דורש מזהים\/רדוקציות.","a":1},{"q":"בשאלה 2 מלאה (R?\/RE?\/coRE?), איזו שורה יכול רייס לסגור?","c":["את כל השלוש","רק את RE","אף אחת — רייס לשאלה 3 בלבד","רק את שורת ה-R (בשלילה) — כששלושת תנאיו מתקיימים"],"e":"רייס = קיצור ל-∉R. את RE\/coRE סוגרים עם ∃\/∀-מזהים או רדוקציות מכוונות-מחלקה. לדעת מה כל כלי נותן = לבחור נכון תחת לחץ זמן.","a":3},{"q":"מתי עדיף דווקא לא להשתמש ברייס למרות שהוא חל?","c":["כשהשפה ב-coRE","כשממילא כותבים רדוקציה מ-Ā_TM לשלילת RE — היא נותנת גם ∉R בחינם, ורייס מתייתר","כשהתכונה סמנטית","אף פעם — רייס תמיד עדיף"],"e":"כלכלת נקודות: רדוקציה אחת יכולה לשלול RE ו-R יחד (∉RE ⟹ ∉R). רייס מצטיין כשצריך רק ∉R — או כשהשאלה מזמינה אותו בשמו.","a":1}]},{"t":"מפת השפות המרכזיות — הסיכום","q":[{"q":"מהו הפרופיל (R\/RE\/coRE) של <span class=\"math\">E<sub>TM<\/sub><\/span>?","c":["✓ \/ ✓ \/ ✓","✗ \/ ✗ \/ ✗","✗ \/ ✗ \/ ✓ — לא כריעה, לא ב-RE, כן ב-coRE","✗ \/ ✓ \/ ✗"],"e":"ריקות = תנאי-∀ ⇒ coRE (עד-נגדי: מילה מתקבלת); Ā_TM≤mE_TM שולל R ו-RE... ליתר דיוק A_TM≤mĒ_TM שולל RE של... הפרופיל: המשלים ב-RE, היא עצמה לא. העדה הקנונית של coRE∖R.","a":2},{"q":"אילו שפות מהמפה יושבות מחוץ ל-RE ∪ coRE?","c":["<span class=\"math\">REG<sub>TM<\/sub>, EQ<sub>TM<\/sub>, PAL<sub>TM<\/sub>, L<sub>∞<\/sub><\/span>","<span class=\"math\">A<sub>TM<\/sub><\/span> ו-<span class=\"math\">HALT<sub>TM<\/sub><\/span>","<span class=\"math\">E<sub>DFA<\/sub><\/span>","אין כאלה"],"e":"תכונות-שפה \"עשירות\" (רגולרית? שווה? אינסופית? שווה-ל-PAL?) נופלות משני הצדדים — שתי רדוקציות לכל אחת. אלה בדיוק ה-Yes\/No הקשים של שאלה 2.","a":0},{"q":"מהו סולם ההכלות המלא של הקורס, עם עד לכל מדרגה?","c":["REG = CFL ⊊ R = RE","CFL ⊊ REG ⊊ R ⊊ RE","REG ⊊ CFL ⊊ R ⊊ RE — עם aⁿbⁿ, ‏aⁿbⁿcⁿ, ‏A_TM, ‏Ā_TM (מחוץ ל-RE)","REG ⊊ R ⊊ CFL ⊊ RE"],"e":"ארבע מדרגות, ארבעה עדים — התמונה שהקורס בנה פרק אחר פרק. לדעת לצייר אותה עם העדים = לענות על חצי משאלות הנכון\/לא-נכון.","a":2}]},{"t":"אסטרטגיית המבחן המלאה","q":[{"q":"מהו מבנה המבחן הקבוע במתכונת 2023–2024?","c":["‏10 שאלות אמריקאיות","שאלה אחת ארוכה על כל הקורס","שני חלקים: תיאוריה ותכנות","ש1: סגירויות ובניות סביב אופרטור; ש2: R\/RE\/coRE עם הוכחות; ש3: 5–6 סעיפים קצרים מגוונים"],"e":"שלוש שאלות, אותה חלוקה בכל המועדים. ההיכרות עם התבנית = לדעת מראש אילו כלים יידרשו איפה.","a":3},{"q":"בשאלה 2, מהו סדר העבודה שממקסם נקודות?","c":["לכתוב את כל המזהים האפשריים","כמתים + משלים → מזהה לצד החיובי → רדוקציה מכוונת לצד השלילי → R בחינם מהשלילה","לנחש את שלוש התשובות ואז להוכיח","להתחיל מהרדוקציה הקשה"],"e":"הכמתים מכתיבים הכול; כל רכיב שנכתב במלואו (מזהה עם נכונות, רדוקציה עם 4 הרכיבים) שווה נקודות גם אם השאר חסר. ה-R תמיד נסגר במשפט הפניה.","a":1},{"q":"מה כדאי לוודא ברבע השעה האחרון?","c":["שהכתב יפה","שכל התשובות באנגלית","שאין שאלות שדולגו — גם במחיר מחיקת תשובות","שכל הוכח-או-הפרך פותח ב-True\/False מפורש, שכל רדוקציה כוללת חישוביות, ושכל מזהה מנומק דו-כיוונית"],"e":"שלושת החוסרים הנפוצים שעולים נקודות קלות: פסק-דין חסר, \"f computable\" חסר, וכיוון-נכונות שני חסר. סריקה ממוקדת בסוף תופסת את שלושתם.","a":3}]},{"t":"צ'ק־ליסט ליום המבחן","q":[{"q":"מה היחס הנכון לדף הנוסחאות המצורף?","c":["לא משננים נוסחים — משננים מתי ואיך להשתמש; הדף עצמו זמין במבחן","לשנן אותו בעל-פה ליתר ביטחון","להתעלם ממנו — הוא מבלבל","הוא לא מצורף — חובה לזכור הכול"],"e":"ההנחיות הרשמיות: \"רשימת הגדרות מופיעה בעמודים האחרונים\". הזמן היקר הולך על הפעלה (איזו בנייה? איזה כלי?), לא על שליפת הגדרות.","a":0},{"q":"אילו ארבע מילים דורשות קריאה כפולה בכל שאלת חישוביות?","c":["שפה \/ מילה \/ אות \/ קידוד","כן \/ לא \/ אולי \/ תמיד","מקבלת \/ דוחה \/ עוצרת \/ לא-מקבלת — ולצידן כל קו עילי (משלים)","מצב \/ סרט \/ ראש \/ קלט"],"e":"\"לא מקבלת\" ⊋ \"דוחה\"; \"עוצרת\" ≠ \"מקבלת\"; וקו עילי הופך הכול. מבחני 2024 בנויים על הדקויות האלה — במודע.","a":2},{"q":"לפני שרצים להוכיח ששפה מהמאגר אינה רגולרית — מה בודקים?","c":["מלכודות קריסה: רכיב בולע-כול, זהות אלגברית, תנאי שמסתפף, או חסם שהופך את השפה לסופית","אם יש לה יותר משתי אותיות","אם היא מכילה את ε","אם יש לה שם מפחיד"],"e":"רבע ממאגר 101 השפות הן רגולריות-בתחפושת. שלושים שניות של חיפוש-קריסה חוסכות עמוד ניפוח שגוי — הלקח המצטבר של כל הדריל.","a":0}]}]}]</script>
<script type="application/json" id="d-exams">[{"id":"2023a","year":2023,"moed":"א","label":"2023 — מועד א'","lang":"he","combined":false,"meta":{"date":"אביב 2023","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן."},"questions":[{"n":"1","heading":"שאלה 1 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">עבור מחרוזת <span class=\"math\">w ∈ Σ<sup>*<\/sup><\/span> כך ש-<span class=\"math\">a ∈ Σ<\/span>, נגדיר <span class=\"math\">Drop_all_a(w)<\/span> להיות שווה למחרוזת <span class=\"math\">w<\/span> לאחר שהסרנו ממנה את כל המופעים של <span class=\"math\">\"a\"<\/span>.<\/p><p dir=\"auto\">לדוגמה: <span class=\"math\">Drop_all_a(aab) = b<\/span> ו-<span class=\"math\">Drop_all_a(aa) = ε<\/span>.<\/p><p dir=\"auto\">עבור שפה <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> כך ש-<span class=\"math\">a ∈ Σ<\/span>, נגדיר <span class=\"math\">Drop_all_a(L) = {Drop_all_a(w) | w ∈ L}<\/span>. לדוגמה: <span class=\"math\">Drop_all_a({aab, aa}) = {b, ε}<\/span>.<\/p><p dir=\"auto\">עבור <span class=\"en\">DFA<\/span>‏ <span class=\"math\">D = (Q_D, Σ_D, δ_D, q_{sD}, F_D)<\/span> ועבור <span class=\"math\">p, q ∈ Q_D<\/span>, נגדיר <span class=\"math\">L<sup>D<\/sup><sub>p,q<\/sub> = {w | δ′_D(p,w) = q}<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\">בהינתן <span class=\"en\">DFA<\/span>‏ <span class=\"math\">A = (Q, Σ, δ_A, q_s, F)<\/span>, כך ש-<span class=\"math\">Σ = {a,b,c}<\/span>.<\/p><p dir=\"auto\"><b>בנו <span class=\"en\">DFA<\/span>‏<\/b> <span class=\"math\">B = (Q, Σ, δ_B, q_s, F)<\/span> כך ש-<span class=\"math\">∀w ∈ Σ<sup>*<\/sup><\/span> ולכל <span class=\"math\">p, q ∈ Q<\/span> מתקיים ש-<span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,q<\/sub><\/span> אם ורק אם <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span>.<\/p><p dir=\"auto\">כלומר, עליכם לשנות את <span class=\"math\">δ_A<\/span> ל-<span class=\"math\">δ_B<\/span>. שימו לב של-<span class=\"math\">A<\/span> ול-<span class=\"math\">B<\/span> יש את אותה ה-<span class=\"math\">Σ<\/span> ואת אותם מצבים (כולל המצב ההתחלתי והמצבים המקבלים).<\/p><p dir=\"auto\">הראו את הבנייה יחד עם הסבר. אתם לא צריכים להראות הוכחת נכונות.<\/p>","tags":{"subj":"automata","qt":"construction"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L<\/span> שפה רגולרית מעל <span class=\"math\">Σ = {a,b,c}<\/span>. תהי:<\/p><div class=\"lang-def\">L′ = {w | w · Drop_all_a(w) ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">L′<\/span> היא שפה רגולרית.<\/p><p dir=\"auto\" class=\"small\"><b>רמז:<\/b> השתמשו בשאלה הקודמת (אתם רשאים להשתמש בשאלה הקודמת גם אם לא פתרתם אותה).<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">עבור שפה <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> כך ש-<span class=\"math\">a ∈ Σ<\/span>, נגדיר:<\/p><div class=\"lang-def\">Oper(L) = {w#Drop_all_a(w) | w ∈ L}<\/div><p dir=\"auto\">תהי <span class=\"math\">L′ ⊆ {a,b}<sup>*<\/sup><\/span> שפה רגולרית ויהי <span class=\"math\">A = (Q_A, Σ_A, δ_A, q_{sA}, F_A)<\/span> ‏<span class=\"en\">DFA<\/span>‏ כך ש-<span class=\"math\">L(A) = L′<\/span>.<\/p><p dir=\"auto\"><b>הראו<\/b> ש-<span class=\"math\">Oper(L′)<\/span> היא שפה חסרת הקשר ע\"י <b>בנייה של <span class=\"en\">PDA<\/span>‏<\/b> <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F)<\/span>, שמתבסס על <span class=\"math\">A<\/span>, כך ש-<span class=\"math\">L(P) = Oper(L′)<\/span>.<\/p><p dir=\"auto\">כלומר, הגדירו כל אחד מהרכיבים של השישייה של <span class=\"math\">P<\/span> בהתבסס על החמישייה של <span class=\"math\">A<\/span>.<\/p>","tags":{"subj":"pda","qt":"construction"}},{"pid":"q1d","label":"4","kind":"open","rows":12,"prompt":"<p dir=\"auto\"><b>הראו שפה<\/b> <span class=\"math\">L ⊆ {a,b}<sup>*<\/sup><\/span> שהיא שפה חסרת הקשר, עבורה <span class=\"math\">Oper(L)<\/span> <b>איננה<\/b> שפה חסרת הקשר.<\/p><p dir=\"auto\">הוכיחו את תשובתכם בעזרת שימוש ב<b>למת הניפוח לשפות חסרות הקשר<\/b>.<\/p>","tags":{"subj":"pump-cfl","qt":"pumping"}}]},{"n":"2","heading":"שאלה 2 (30 נקודות)","points":30,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, D⟩ | M is a TM, D is a DFA, L(D) ≠ ∅ and L(M) ⊆ L(D) ∘ L(D)}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 6 נקודות)","points":30,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>בנו דקדוק חסר הקשר<\/b> לשפה הבאה:<\/p><div class=\"lang-def\">L = {a<sup>i<\/sup>b<sup>j<\/sup> | (i+j) mod 3 = 0}<\/div>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3b","label":"2","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">A<\/span> ‏<span class=\"en\">DFA<\/span>‏ עם <span class=\"math\">n<\/span> מחלקות שקילות על המצבים של <span class=\"math\">A<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> אם קיימת מילה <span class=\"math\">w ∈ L(A)<\/span> כך ש-<span class=\"math\">|w| = n<\/span> אזי <span class=\"math\">L(A)<\/span> היא שפה אינסופית.<\/p>","tags":{"subj":"minimize","qt":"claim"}},{"pid":"q3c","label":"3","kind":"open","rows":6,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L<\/span> שפה חסרת הקשר ויהי <span class=\"math\">G = (V, Σ, S, R)<\/span> דקדוק חסר הקשר כך ש-<span class=\"math\">L(G) = L<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> אם <span class=\"math\">w ∈ L<\/span> ו-<span class=\"math\">|w| &gt; |V|<\/span> אזי <span class=\"math\">L<\/span> שפה אינסופית.<\/p>","tags":{"subj":"cfg","qt":"claim"}},{"pid":"q3d","label":"4","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכח:<\/b> ‏<span class=\"math\">{a<sup>p+1<\/sup> | p is prime}<\/span> היא לא שפה חסרת הקשר.<\/p><p dir=\"auto\">אתם רשאים להשתמש בעובדה ש-<span class=\"math\">{a<sup>p<\/sup> | p is prime}<\/span> איננה שפה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q3e","label":"5","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">A<\/span> שפה סופית כלשהי ותהי <span class=\"math\">L = REG<sub>TM<\/sub> ∪ A<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> מתקיים ש-<span class=\"math\">REG<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span>, כלומר, קיימת רדוקציית מיפוי מ-<span class=\"math\">REG<sub>TM<\/sub><\/span> ל-<span class=\"math\">L<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3f","label":"6","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and ∃w ∈ Σ<sup>*<\/sup> s.t. M does not accept w}<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> לפי משפט <span class=\"en\">Rice<\/span>‏ השפה <span class=\"math\">L<\/span> איננה כריעה.<\/p>","tags":{"subj":"rice","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><b>Construction:<\/b><\/p>\n<ul>\n<li>For each transition <span class=\"math\">δ_A(q, σ) = p<\/span> in the transition function of <span class=\"math\">A<\/span> such that <span class=\"math\">σ ∈ {b, c}<\/span>, we add the same transition <span class=\"math\">δ_B(q, σ) = p<\/span> to <span class=\"math\">B<\/span>.<\/li>\n<li>For each <span class=\"math\">p ∈ Q<\/span>, we add the self-loop <span class=\"math\">δ_B(p, a) = p<\/span>.<\/li>\n<\/ul>\n<p><b>Explanation:<\/b> if <span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,q<\/sub><\/span> then every <span class=\"math\">a<\/span> in <span class=\"math\">w<\/span> keeps <span class=\"math\">B<\/span> in the same state (self-loop), so removing all the <span class=\"math\">a<\/span>'s leaves exactly the same path — and since the <span class=\"math\">b,c<\/span> transitions are unchanged, that path is also a path of <span class=\"math\">A<\/span>: <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span>.<\/p>\n<p>Conversely, if <span class=\"math\">Drop_all_a(w) = σ₁…σ_n ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span> then <span class=\"math\">w ∈ L(a<sup>*<\/sup>σ₁a<sup>*<\/sup>σ₂…a<sup>*<\/sup>σ_na<sup>*<\/sup>)<\/span>, and in <span class=\"math\">B<\/span> the same path exists where every state carries its own <span class=\"math\">a<\/span>-loop, so <span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,q<\/sub><\/span>.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L<\/span> is regular, so there exists a DFA <span class=\"math\">A = (Q, Σ, δ_A, q_s, F)<\/span> with <span class=\"math\">L(A) = L<\/span>. Let <span class=\"math\">B<\/span> be the automaton from the previous section (built from <span class=\"math\">A<\/span>).<\/p>\n<p>Note that <span class=\"math\">w ∈ L′<\/span> iff <span class=\"math\">∃p ∈ Q, ∃f ∈ F<\/span> such that <span class=\"math\">w ∈ L<sup>A<\/sup><sub>q_s,p<\/sub><\/span> and <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,f<\/sub><\/span> (the run on <span class=\"math\">w · Drop_all_a(w)<\/span> passes through some intermediate state <span class=\"math\">p<\/span>).<\/p>\n<p>From the previous question, <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,f<\/sub><\/span> iff <span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,f<\/sub><\/span>.<\/p>\n<p>Therefore:<\/p>\n<div class=\"lang-def\">L′ = ⋃<sub>p∈Q, f∈F<\/sub> (L<sup>A<\/sup><sub>q_s,p<\/sub> ∩ L<sup>B<\/sup><sub>p,f<\/sub>)<\/div>\n<p>Each <span class=\"math\">L<sup>A<\/sup><sub>q_s,p<\/sub><\/span> and <span class=\"math\">L<sup>B<\/sup><sub>p,f<\/sub><\/span> is regular (a DFA with adjusted initial\/accepting states), the intersection of two regular languages is regular, and a finite union of regular languages is regular — so <span class=\"math\">L′<\/span> is a regular language.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p>We define <span class=\"math\">Q_P = Q_A ⊎ {q_{sP}, s, f_P}<\/span>, <span class=\"math\">Σ_P = {a, b, #}<\/span>, <span class=\"math\">Γ_P = {b, $}<\/span>, <span class=\"math\">F = {f_P}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ_P(q_{sP}, ε, ε) = {(q_{sA}, $)}<\/span> — push a bottom marker and move to <span class=\"math\">A<\/span>'s initial state.<\/li>\n<li>For each transition <span class=\"math\">δ_A(p, b) = q<\/span>: add <span class=\"math\">δ_P(p, b, ε) = {(q, b)}<\/span> — simulate <span class=\"math\">A<\/span> and <b>push<\/b> every <span class=\"math\">b<\/span>.<\/li>\n<li>For each transition <span class=\"math\">δ_A(p, a) = q<\/span>: add <span class=\"math\">δ_P(p, a, ε) = {(q, ε)}<\/span> — simulate <span class=\"math\">A<\/span> without pushing (the <span class=\"math\">a<\/span>'s are dropped).<\/li>\n<li>For each <span class=\"math\">f_A ∈ F_A<\/span>: add <span class=\"math\">δ_P(f_A, #, ε) = {(s, ε)}<\/span> — after reading <span class=\"math\">w ∈ L′<\/span>, cross the <span class=\"math\">#<\/span>.<\/li>\n<li>Add <span class=\"math\">δ_P(s, b, b) = {(s, ε)}<\/span> and <span class=\"math\">δ_P(s, ε, $) = {(f_P, ε)}<\/span> — match the suffix against the pushed <span class=\"math\">b<\/span>'s and accept when the stack is empty.<\/li>\n<\/ul>\n<div class=\"note\" dir=\"rtl\"><b>שימו לב לדקות:<\/b> הבנייה הזו נכונה כי ב-<span class=\"math\">Σ = {a,b}<\/span> המחרוזת <span class=\"math\">Drop_all_a(w)<\/span> היא <span class=\"math\">b<sup>#_b(w)<\/sup><\/span> — כל ה-b-ים באותו סדר; לכן מספיק מונה במחסנית, למרות שהמחסנית הפוכה.<\/div>\n<\/div>"},{"ref":"q1d","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L = {b<sup>n<\/sup>a<sup>n<\/sup> | n ∈ ℕ}<\/span> — we saw that this is a context-free language.<\/p>\n<p><span class=\"math\">Oper(L) = {b<sup>n<\/sup>a<sup>n<\/sup>#b<sup>n<\/sup> | n ∈ ℕ}<\/span>. We prove with the pumping lemma for context-free languages that it is not context-free.<\/p>\n<p>Assume towards contradiction that <span class=\"math\">Oper(L)<\/span> is context-free; let <span class=\"math\">p<\/span> be the promised constant. Choose <span class=\"math\">w = b<sup>p<\/sup>a<sup>p<\/sup>#b<sup>p<\/sup> ∈ Oper(L)<\/span>, <span class=\"math\">|w| ≥ p<\/span>; so <span class=\"math\">w = uvxyz<\/span> satisfying the three conditions.<\/p>\n<p><b>Case 1 — <span class=\"math\">vy<\/span> homogeneous<\/b> (<span class=\"math\">v = b<sup>s<\/sup>, y = b<sup>t<\/sup><\/span> or <span class=\"math\">v = a<sup>s<\/sup>, y = a<sup>t<\/sup><\/span>, with <span class=\"math\">0 &lt; s+t ≤ p<\/span>): pumping up gives<\/p>\n<div class=\"lang-def\">w₂ = uv²xy²z ∈ {b<sup>p+s+t<\/sup>a<sup>p<\/sup>#b<sup>p<\/sup>,&nbsp; b<sup>p<\/sup>a<sup>p+s+t<\/sup>#b<sup>p<\/sup>,&nbsp; b<sup>p<\/sup>a<sup>p<\/sup>#b<sup>p+s+t<\/sup>}<\/div>\n<p>Since <span class=\"math\">s+t &gt; 0<\/span>, one block count differs from <span class=\"math\">p<\/span>, so <span class=\"math\">w₂ ∉ Oper(L)<\/span>.<\/p>\n<p><b>Case 2 — <span class=\"math\">vy<\/span> heterogeneous<\/b> (with <span class=\"math\">|vxy| ≤ p<\/span>, so <span class=\"math\">v, y<\/span> touch two adjacent blocks):<\/p>\n<ul>\n<li><span class=\"math\">vy = b<sup>s<\/sup>a<sup>t<\/sup><\/span> with <span class=\"math\">s, t ≠ 0<\/span>: <span class=\"math\">w₂ = b<sup>p+s<\/sup>a<sup>p+t<\/sup>#b<sup>p<\/sup><\/span> — both first blocks differ from the third, <span class=\"math\">w₂ ∉ Oper(L)<\/span>.<\/li>\n<li><span class=\"math\">vy = a<sup>s<\/sup>b<sup>t<\/sup><\/span> with <span class=\"math\">s, t ≠ 0<\/span>: <span class=\"math\">w₂ = b<sup>p<\/sup>a<sup>p+s<\/sup>#b<sup>p+t<\/sup><\/span> — again <span class=\"math\">w₂ ∉ Oper(L)<\/span>.<\/li>\n<\/ul>\n<p>Note: if <span class=\"math\">v<\/span> or <span class=\"math\">y<\/span> contained the <span class=\"math\">#<\/span>, then <span class=\"math\">w₂<\/span> would contain two <span class=\"math\">#<\/span>'s and again <span class=\"math\">w₂ ∉ Oper(L)<\/span>; therefore <span class=\"math\">x<\/span> contains the <span class=\"math\">#<\/span> in the heterogeneous case.<\/p>\n<p>All cases contradict condition 3 — so <span class=\"math\">Oper(L)<\/span> is not context-free.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ coRE<\/span> — בונים מזהה ל-<span class=\"math\"><span class=\"comp\">L<\/span><\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∈ coRE<\/span>:<\/b> note that<\/p>\n<div class=\"lang-def\"><span class=\"comp\">L<\/span> = {⟨M,D⟩ | M is a TM, D is a DFA, L(D) = ∅ or ∃w ∈ L(M) s.t. w ∉ L(D)·L(D)}<\/div>\n<p>We construct a recognizer <span class=\"math\">M_L<\/span> for <span class=\"math\"><span class=\"comp\">L<\/span><\/span>:<\/p>\n<pre>M_L: \"On input ⟨M, D⟩:\n1. If L(D) = ∅, accept   (E_DFA ∈ R).\n2. For i from 0 to ∞:\n   2.1. For j from 0 to i:\n      2.1.1. For every x ∈ Σ^j (x = x_1…x_j) in lexicographical order:\n         2.1.1.1. Run M on x for i steps.\n         2.1.1.2. If M accepted:\n            2.1.1.2.1. For m from 0 to j:\n               2.1.1.2.1.1. Run D on u = x_1…x_m   (if m = 0, run on ε)\n               2.1.1.2.1.2. If D accepted:\n                  2.1.1.2.1.2.1. Run D on v = x_{m+1}…x_j   (if m = j, run on ε)\n                  2.1.1.2.1.2.2. If D accepted, move to the next x (line 2.1.1).\n            2.1.1.2.2. Accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M,D⟩ ∈ <span class=\"comp\">L<\/span><\/span>: if <span class=\"math\">L(D) = ∅<\/span> we accept in line 1. Otherwise there exists <span class=\"math\">w ∈ L(M)<\/span> with <span class=\"math\">w ∉ L(D)·L(D)<\/span>, i.e. for every split <span class=\"math\">w = uv<\/span>, <span class=\"math\">D<\/span> rejects <span class=\"math\">u<\/span> or rejects <span class=\"math\">v<\/span>. Take the <span class=\"math\">w<\/span> accepted by <span class=\"math\">M<\/span> in the fewest steps <span class=\"math\">k<\/span> (ties by length + lexicographic order). Every earlier iteration fails at least one condition for every candidate; at iteration <span class=\"math\">i = k<\/span> the machine sees <span class=\"math\">M<\/span> accept <span class=\"math\">w<\/span>, finds no split accepted twice by <span class=\"math\">D<\/span>, and accepts in line 2.1.1.2.2.<\/li>\n<li><span class=\"math\">⟨M,D⟩ ∉ <span class=\"comp\">L<\/span><\/span>: ‏<span class=\"math\">L(D) ≠ ∅<\/span> so line 1 does not accept, and for every <span class=\"math\">w<\/span> either <span class=\"math\">M<\/span> does not accept it or some split <span class=\"math\">w = uv<\/span> has both halves in <span class=\"math\">L(D)<\/span> — so the \"Accept\" line is never reached and <span class=\"math\">M_L<\/span> runs forever.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∉ RE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>, therefore <span class=\"math\">L ∉ RE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_{M,w}, D⟩<\/span> where:<\/p>\n<pre>D: \"On input x:\n1. If x = \"0\", accept.\n2. Otherwise, reject.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(D) = {0}<\/span>, therefore <span class=\"math\">L(D) ≠ ∅<\/span> and <span class=\"math\">L(D)·L(D) = {00}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function (finite syntactic encoding).<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: <span class=\"math\">M<\/span> does not accept <span class=\"math\">w<\/span>, so <span class=\"math\">L(N_{M,w}) = ∅ ⊆ {00}<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span>, so <span class=\"math\">L(N_{M,w}) = Σ<sup>*<\/sup> ⊈ {00}<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → ε | a<span class=\"nt\">S<\/span>bb | aa<span class=\"nt\">S<\/span>b | aaa<span class=\"nt\">S<\/span> | <span class=\"nt\">S<\/span>bbb<\/div>\n<\/div>\n<p>Every rule adds letters in multiples of 3 (1+2, 2+1, 3+0, 0+3) while keeping all <span class=\"math\">a<\/span>'s before all <span class=\"math\">b<\/span>'s, so exactly <span class=\"math\">(i+j) mod 3 = 0<\/span> is generated.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p>Let <span class=\"math\">A′<\/span> be the minimal automaton equivalent to <span class=\"math\">A<\/span>. From the given data, <span class=\"math\">A′<\/span> has <span class=\"math\">n<\/span> states (each state is its own equivalence class).<\/p>\n<p>If there exists <span class=\"math\">w ∈ L(A)<\/span> with <span class=\"math\">|w| = n<\/span> then <span class=\"math\">w ∈ L(A′)<\/span> (equivalent automata). The accepting run on <span class=\"math\">w<\/span> is a path with <span class=\"math\">|w| = n<\/span> edges, i.e. <span class=\"math\">n+1<\/span> state-visits — by the pigeonhole principle some state of <span class=\"math\">A′<\/span> is visited twice. That gives a loop on an accepting path, which can be pumped any number of times — so <span class=\"math\">L(A′) = L(A)<\/span> is an infinite language.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example: <span class=\"math\">V = {S}<\/span>, <span class=\"math\">Σ = {a}<\/span> and the single rule:<\/p>\n<div class=\"gram\"><div class=\"rule\"><span class=\"nt\">S<\/span> → aa<\/div><\/div>\n<p><span class=\"math\">w = aa ∈ L(G)<\/span>, <span class=\"math\">|w| = 2 &gt; 1 = |V|<\/span>, and yet <span class=\"math\">L(G) = {aa}<\/span> — a finite language.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p>Denote the language by <span class=\"math\">L<\/span> and assume towards contradiction that <span class=\"math\">L<\/span> is context-free.<\/p>\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{a}<\/span>: <span class=\"math\">f(a) = {a, a′}<\/span>. Then <span class=\"math\">f(L)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>Define <span class=\"math\">L′ = f(L) ∩ L(a<sup>*<\/sup>a′a<sup>*<\/sup>)<\/span> — context-free (intersection with a regular language). In <span class=\"math\">L′<\/span>, exactly one letter is marked.<\/p>\n<p>Define a regular substitution <span class=\"math\">g<\/span>: <span class=\"math\">g(a) = {a}<\/span>, <span class=\"math\">g(a′) = {ε}<\/span> — erasing the marked letter. <span class=\"math\">g(L′)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>But <span class=\"math\">g(L′) = {a<sup>p<\/sup> | p is prime}<\/span>, which is known not to be context-free — a contradiction.<\/p>\n<p>Therefore <span class=\"math\">L = {a<sup>p+1<\/sup> | p is prime}<\/span> is not a context-free language.<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p>Since <span class=\"math\">A<\/span> is finite, <span class=\"math\">L = REG<sub>TM<\/sub> ∪ A ≠ Σ<sup>*<\/sup><\/span>, so there exists a word <span class=\"math\">w_{out} ∉ L<\/span>.<\/p>\n<p>Since <span class=\"math\">A<\/span> is finite, <span class=\"math\">A′ = A ∖ REG<sub>TM<\/sub><\/span> is a finite language, therefore <span class=\"math\">A′ ∈ R<\/span>.<\/p>\n<p>We construct a TM <span class=\"math\">F<\/span> computing the mapping function from <span class=\"math\">REG<sub>TM<\/sub><\/span> to <span class=\"math\">L<\/span>:<\/p>\n<pre>F: \"On input ⟨M⟩:\n1. If ⟨M⟩ ∈ A'   (A' ∈ R), return w_out.\n2. Otherwise, return ⟨M⟩.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is computable: it runs the (always-halting) decider of <span class=\"math\">A′<\/span> and returns one of two values.<\/li>\n<li><span class=\"math\">⟨M⟩ ∈ REG<sub>TM<\/sub><\/span>: then <span class=\"math\">⟨M⟩ ∉ A′<\/span>, so <span class=\"math\">f(⟨M⟩) = ⟨M⟩ ∈ REG<sub>TM<\/sub> ⊆ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M⟩ ∉ REG<sub>TM<\/sub><\/span>: if <span class=\"math\">⟨M⟩ ∈ A′<\/span> then <span class=\"math\">f(⟨M⟩) = w_{out} ∉ L<\/span>; otherwise <span class=\"math\">f(⟨M⟩) = ⟨M⟩<\/span>, which is in neither <span class=\"math\">REG<sub>TM<\/sub><\/span> nor <span class=\"math\">A′<\/span> (nor <span class=\"math\">A ∩ REG<sub>TM<\/sub><\/span>) — so <span class=\"math\">f(⟨M⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3f","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b> Define the semantic property:<\/p>\n<div class=\"lang-def\">C = {L | L ∈ RE and L ≠ Σ<sup>*<\/sup>}<\/div>\n<p>Then <span class=\"math\">L = L_C = {⟨M⟩ | M is a TM and L(M) ∈ C}<\/span> — a machine has some non-accepted word iff its language is not <span class=\"math\">Σ<sup>*<\/sup><\/span>.<\/p>\n<ul>\n<li><span class=\"math\">C ⊆ RE<\/span>: by definition.<\/li>\n<li><span class=\"math\">C ≠ RE<\/span> (not all of RE): <span class=\"math\">Σ<sup>*<\/sup> ∈ RE<\/span> but <span class=\"math\">Σ<sup>*<\/sup> ∉ C<\/span>.<\/li>\n<li><span class=\"math\">C ≠ ∅<\/span>: <span class=\"math\">A<sub>TM<\/sub> ∈ C<\/span>.<\/li>\n<\/ul>\n<p>The property is non-trivial, so by Rice's theorem <span class=\"math\">L_C ∉ R<\/span> — the claim is true.<\/p>\n<\/div>"}]},{"id":"2023b","year":2023,"moed":"ב","label":"2023 — מועד ב'","lang":"he","combined":false,"meta":{"date":"אביב 2023","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן."},"questions":[{"n":"1","heading":"שאלה 1 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">עבור שפות <span class=\"math\">L₁, L₂ ⊆ Σ<sup>*<\/sup><\/span>, נגדיר:<\/p><div class=\"lang-def\">Op(L₁, L₂) = {uvw | v ∈ L₁ and uw ∈ L₂}<\/div><p dir=\"auto\">לדוגמה: <span class=\"math\">Op({c}, {ab, ba}) = {cab, cba, acb, bca, abc, bac}<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":6,"prompt":"<p dir=\"auto\">בהינתן השפות הבאות, <span class=\"math\">L₁, L₂ ⊆ {a,b}<sup>*<\/sup><\/span>, <b>כתבו ביטוי רגולרי<\/b> ל-<span class=\"math\">Op(L₁, L₂)<\/span>:<\/p><p dir=\"auto\"><b>א.<\/b> ‏<span class=\"math\">L₁ = {a}<\/span> ו-<span class=\"math\">L₂ = {b, bb}<\/span>.<\/p><p dir=\"auto\"><b>ב.<\/b> ‏<span class=\"math\">L₁ = {a<sup>i<\/sup>b<sup>j<\/sup> | (i+j) mod 3 = 0}<\/span> ו-<span class=\"math\">L₂ = L(a<sup>*<\/sup>)<\/span>.<\/p><p dir=\"auto\">הסבירו בקצרה את תשובתכם.<\/p>","tags":{"subj":"regex","qt":"construction"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">תהיינה <span class=\"math\">L₁, L₂ ⊆ Σ<sup>*<\/sup><\/span> שפות רגולריות.<\/p><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">Op(L₁, L₂)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":8,"prompt":"<p dir=\"auto\"><b>א.<\/b> בהינתן השפות <span class=\"math\">L₁ = {a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span> ו-<span class=\"math\">L₂ = {c<sup>n<\/sup> | n is even}<\/span>.<\/p><p dir=\"auto\"><b>כתבו דקדוק חסר הקשר<\/b> <span class=\"math\">G<\/span> כך ש-<span class=\"math\">L(G) = Op(L₁, L₂)<\/span>. מספיק לכתוב רק את כללי הגזירה. הסבירו את תשובתכם בקצרה.<\/p><p dir=\"auto\"><b>ב.<\/b> ספקו שפות חסרות הקשר ולא רגולריות <span class=\"math\">L₁, L₂<\/span> כך ש-<span class=\"math\">Op(L₁, L₂)<\/span> חסרת הקשר (ללא הוכחה).<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q1d","label":"4","kind":"open","rows":12,"prompt":"<p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L₁<\/span> היא שפה חסרת הקשר ו-<span class=\"math\">L₂<\/span> היא שפה רגולרית אזי <span class=\"math\">Op(L₁, L₂)<\/span> היא שפה חסרת הקשר, ע\"י הצגת <span class=\"en\">PDA<\/span>‏ <span class=\"math\">P<\/span> כך ש-<span class=\"math\">L(P) = Op(L₁, L₂)<\/span>.<\/p><p dir=\"auto\">הסבירו בקצרה את הפתרון שלכם \/ את דרך הפעולה של <span class=\"math\">P<\/span>.<\/p>","tags":{"subj":"pda","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (30 נקודות)","points":30,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨D, M⟩ | D is a DFA, M is a TM, L(D) ≠ ∅ and |L(M)| ≥ min{|w| : w ∈ L(D)}}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 6 נקודות)","points":30,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">{ww | w ∈ Σ<sup>*<\/sup>}<\/span> היא לא שפה רגולרית ע\"י שימוש ב<b>למת הניפוח לשפות רגולריות<\/b>.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3b","label":"2","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">G = (V, Σ, S, R)<\/span> דקדוק חסר הקשר כך ש-<span class=\"math\">V = {S}<\/span>, <span class=\"math\">Σ = {a,b}<\/span> ו-<span class=\"math\">R = {S → aS | Sb | a | b | ε}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">G<\/span> הוא דקדוק <b>עמום<\/b> ע\"י הצגת מחרוזת <span class=\"math\">w ∈ L(G)<\/span> כך שקיימים יותר מעץ גזירה אחד של <span class=\"math\">G<\/span> עבור <span class=\"math\">w<\/span> (הראו בנוסף שניים מעצי הגזירה).<\/p>","tags":{"subj":"cfg","qt":"proof"}},{"pid":"q3c","label":"3","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו:<\/b> ‏<span class=\"math\">{a<sup>2n²<\/sup> | n ≥ 0}<\/span> היא לא שפה חסרת הקשר.<\/p><p dir=\"auto\">אתם רשאים להשתמש בעובדה ש-<span class=\"math\">{a<sup>n²<\/sup> | n ≥ 0}<\/span> היא לא שפה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q3d","label":"4","kind":"open","rows":6,"prompt":"<p dir=\"auto\">בהינתן ה-<span class=\"en\">DFA<\/span>‏ הבא:<\/p><div class=\"fsa\"><svg viewBox=\"0 0 300 210\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\"><circle class=\"st st-acc\" cx=\"75\" cy=\"60\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"75\" cy=\"60\" r=\"25\"\/><text class=\"slbl\" x=\"75\" y=\"60\">q₀<\/text><circle class=\"st\" cx=\"225\" cy=\"60\" r=\"25\"\/><text class=\"slbl\" x=\"225\" y=\"60\">q₁<\/text><circle class=\"st\" cx=\"150\" cy=\"165\" r=\"25\"\/><text class=\"slbl\" x=\"150\" y=\"165\">q₂<\/text><path class=\"tr\" d=\"M100,60 L197,60\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"148\" y=\"48\" text-anchor=\"middle\">a<\/text><path class=\"tr\" d=\"M213,82 L166,146\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"203\" y=\"122\" text-anchor=\"middle\">a<\/text><path class=\"tr\" d=\"M133,146 L86,84\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"96\" y=\"122\" text-anchor=\"middle\">a<\/text><\/svg><\/div><p dir=\"auto\">הציגו <b>מילה בודדת<\/b>, <span class=\"math\">w ∈ L(a<sup>*<\/sup>)<\/span>, שמפרידה גם בין <span class=\"math\">q₁<\/span> ל-<span class=\"math\">q₂<\/span> וגם בין <span class=\"math\">q₂<\/span> ל-<span class=\"math\">q₀<\/span>. הסבירו את תשובתכם.<\/p>","tags":{"subj":"minimize","qt":"short"}},{"pid":"q3e","label":"5","kind":"open","rows":7,"prompt":"<p dir=\"auto\">בהינתן <span class=\"math\">k ∈ ℕ<\/span>. נגדיר:<\/p><div class=\"lang-def\">L∞<sub>k<\/sub> = {⟨M⟩ | M is a TM, L(M) is infinite and ⟨M⟩ ∈ ⋃<sub>i=0..k<\/sub> Σ<sup>i<\/sup>}<\/div><p dir=\"auto\"><b>נכון או לא נכון:<\/b> לכל <span class=\"math\">k<\/span>, ‏<span class=\"math\">L<sub>∞<\/sub><\/span> לא ניתנת לרדוקציית מיפוי ל-<span class=\"math\">L∞<sub>k<\/sub><\/span> ‏(<span class=\"math\">L<sub>∞<\/sub> ≰<sub>m<\/sub> L∞<sub>k<\/sub><\/span>). נמקו את תשובתכם.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3f","label":"6","kind":"open","rows":10,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">A<\/span> תת-קבוצה לא טריוויאלית <b>סופית<\/b> של <span class=\"math\">Σ<sup>*<\/sup><\/span> ותהיינה <span class=\"math\">L₁<\/span> ו-<span class=\"math\">L₂<\/span> שפות לא טריוויאליות.<\/p><p dir=\"auto\"><b>נכון או לא נכון:<\/b> אם קיימת פונקציה ניתנת לחישוב <span class=\"math\">f: Σ<sup>*<\/sup> → Σ<sup>*<\/sup><\/span> כך של-<span class=\"math\">∀w ∈ Σ<sup>*<\/sup> ∖ A<\/span> מתקיים ש-<span class=\"math\">w ∈ L₁<\/span> אמ\"מ <span class=\"math\">f(w) ∈ L₂<\/span>, אזי בהכרח <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span>. הוכיחו את תשובתכם.<\/p>","tags":{"subj":"reduction","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><b>a.<\/b>&nbsp; <span class=\"math\">ba + ab + abb + bab + bba<\/span><\/p>\n<p>Inserting the single letter <span class=\"math\">a<\/span> at every possible position of <span class=\"math\">b<\/span> (positions in <span class=\"math\">b<\/span>: ab, ba) and of <span class=\"math\">bb<\/span> (abb, bab, bba).<\/p>\n<p><b>b.<\/b>&nbsp; <span class=\"math\">a<sup>*<\/sup>(abb + aab + ε)(bbb)<sup>*<\/sup>a<sup>*<\/sup><\/span><\/p>\n<p>A word of <span class=\"math\">L₁<\/span> is inserted between a prefix and a suffix of a word of <span class=\"math\">L(a<sup>*<\/sup>)<\/span> — so the result is <span class=\"math\">a<\/span>'s, then a word of <span class=\"math\">L₁<\/span>, then more <span class=\"math\">a<\/span>'s; and <span class=\"math\">L₁ = L((abb + aab + ε)(bbb)<sup>*<\/sup> + …)<\/span> restricted here to the forms that keep all <span class=\"math\">a<\/span>'s before all <span class=\"math\">b<\/span>'s inside the inserted word.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L₂<\/span> is regular, so it has a DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_{sA}, F_A)<\/span> with <span class=\"math\">L(A) = L₂<\/span>.<\/p>\n<p>Note that <span class=\"math\">x = uvw ∈ Op(L₁, L₂)<\/span> iff <span class=\"math\">v ∈ L₁<\/span> and <span class=\"math\">uw ∈ L(A)<\/span>, and that <span class=\"math\">uw ∈ L(A)<\/span> iff <span class=\"math\">∃p ∈ Q_A, ∃f ∈ F_A<\/span> such that <span class=\"math\">u ∈ L<sup>A<\/sup><sub>q_{sA},p<\/sub><\/span> and <span class=\"math\">w ∈ L<sup>A<\/sup><sub>p,f<\/sub><\/span>. That is:<\/p>\n<div class=\"lang-def\">Op(L₁, L₂) = ⋃<sub>p∈Q_A, f∈F_A<\/sub> L<sup>A<\/sup><sub>q_{sA},p<\/sub> · L₁ · L<sup>A<\/sup><sub>p,f<\/sub><\/div>\n<p><span class=\"math\">L<sup>A<\/sup><sub>q_{sA},p<\/sub><\/span>, <span class=\"math\">L<sup>A<\/sup><sub>p,f<\/sub><\/span> and <span class=\"math\">L₁<\/span> are regular (proved in class), concatenation of regular languages is regular, and a finite union of regular languages is regular — therefore <span class=\"math\">Op(L₁, L₂)<\/span> is a regular language.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>a.<\/b><\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span> | c<span class=\"nt\">S<\/span>c | <span class=\"nt\">S<\/span>cc | cc<span class=\"nt\">S<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → a<span class=\"nt\">A<\/span>b | ε<\/div>\n<\/div>\n<p><span class=\"math\">A<\/span> generates <span class=\"math\">a<sup>n<\/sup>b<sup>n<\/sup><\/span> (the inserted <span class=\"math\">v ∈ L₁<\/span>), and the <span class=\"math\">S<\/span>-rules wrap it with <span class=\"math\">c<\/span>'s in pairs — either around the middle or on the ends — generating every split of an even number of <span class=\"math\">c<\/span>'s into a prefix and a suffix.<\/p>\n<p><b>b.<\/b>&nbsp; <span class=\"math\">L₁ = L₂ = {a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span>.<\/p>\n<\/div>"},{"ref":"q1d","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L₁<\/span> is context-free, so it has a PDA <span class=\"math\">A = (Q_A, Σ_A, Γ_A, δ_A, q_{sA}, F_A)<\/span> with <span class=\"math\">L(A) = L₁<\/span>; <span class=\"math\">L₂<\/span> is regular, so it has a DFA <span class=\"math\">B = (Q_B, Σ_B, δ_B, q_{sB}, F_B)<\/span> with <span class=\"math\">L(B) = L₂<\/span>.<\/p>\n<p>We
