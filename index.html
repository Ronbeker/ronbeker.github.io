שפות לא רגולריות ולמת הניפוח<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 5 (הרצאה 5 + תרגול 5)<\/p>\n\n<section>\n  <h2 id=\"ch5-t0\">למה קיימות שפות לא רגולריות<\/h2>\n\n  <p>אוטומט סופי זוכר כמות חסומה של מידע. שפה שמכריחה לזכור כמות <b>לא חסומה<\/b> —\n    לא יכולה להיות רגולרית. הדוגמה הקנונית:<\/p>\n  <div class=\"lang-def\">L = {0<sup>n<\/sup>1<sup>n<\/sup> | n ≥ 0}<\/div>\n  <p>כדי לדעת כמה 1-ים \"מגיע לי\" אחרי ה-0-ים, חייבים לזכור את <span class=\"math\">n<\/span> —\n    והוא יכול להיות כל מספר. אינטואיציה נכונה, אבל היא <b>לא הוכחה<\/b>: אולי יש טריק חכם?\n    (לפעמים באמת יש — ראו את המלכודות במאגר השפות: ‏<span class=\"math\">{a<sup>n<\/sup>ub<sup>n<\/sup> | u ∈ {a,b}<sup>*<\/sup>}<\/span>\n    דווקא רגולרית!)<\/p>\n\n  <div class=\"note\">בדיוק בשביל זה קיימת למת הניפוח: כלי <b>פורמלי<\/b> להפוך את \"צריך זיכרון אינסופי\"\n    להוכחה חתומה. לצידה יש גם את דרך מחלקות-השקילות (אינסוף נציגים מפרידים, פרק 4) ואת דרך\n    הסגירויות (t9) — שלושתן לגיטימיות במבחן אלא אם נדרשה שיטה ספציפית.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t1\">למת הניפוח — הנוסח המדויק<\/h2>\n\n  <div class=\"thm\">\n    אם <span class=\"math\">L<\/span> שפה רגולרית, אז קיים <span class=\"math\">n ∈ ℕ<\/span> (קבוע הניפוח) כך\n    שלכל מילה <span class=\"math\">w ∈ L<\/span> עם <span class=\"math\">|w| ≥ n<\/span> קיימת חלוקה\n    <span class=\"math\">w = xyz<\/span> המקיימת:\n    <ol>\n      <li><span class=\"math\">|y| &gt; 0<\/span> — החלק האמצעי אינו ריק.<\/li>\n      <li><span class=\"math\">|xy| ≤ n<\/span> — החלק הנשאב נמצא ב-<span class=\"math\">n<\/span> האותיות הראשונות.<\/li>\n      <li>לכל <span class=\"math\">i ≥ 0<\/span>: ‏<span class=\"math\">xy<sup>i<\/sup>z ∈ L<\/span> — אפשר לשאוב את\n        <span class=\"math\">y<\/span> כמה שרוצים (גם אפס פעמים!).<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>שימו לב היטב למבנה הכמתים — הוא לב העניין:<\/p>\n  <div class=\"lang-def\">∃n&nbsp; ∀w∈L,|w|≥n&nbsp; ∃(x,y,z)&nbsp; ∀i≥0: xy<sup>i<\/sup>z ∈ L<\/div>\n  <p>ה-<span class=\"math\">n<\/span> והחלוקה — <b>לא בשליטתנו<\/b>; המילה וה-<span class=\"math\">i<\/span> — כן.\n    מכאן נגזר כל מבנה ההוכחה בנושא הבא.<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t2\">מאיפה הלמה מגיעה — שובך היונים על הריצה<\/h2>\n\n  <p>ההוכחה קצרה ושווה להכיר, כי היא מסבירה כל תנאי בלמה:<\/p>\n  <div class=\"proof\">\n    יהי DFA עם <span class=\"math\">n<\/span> מצבים עבור <span class=\"math\">L<\/span>. ריצה על מילה\n    <span class=\"math\">w<\/span> באורך <span class=\"math\">≥ n<\/span> מבקרת ב-<span class=\"math\">n+1<\/span>\n    מצבים לפחות בקריאת <span class=\"math\">n<\/span> האותיות הראשונות — לפי שובך היונים, מצב כלשהו\n    <span class=\"math\">q<\/span> חוזר על עצמו. נסמן: ‏<span class=\"math\">x<\/span> — עד הביקור הראשון ב-<span class=\"math\">q<\/span>;\n    ‏<span class=\"math\">y<\/span> — הלולאה מ-<span class=\"math\">q<\/span> ל-<span class=\"math\">q<\/span> (לא ריקה — תנאי 1;\n    בתוך <span class=\"math\">n<\/span> הראשונות — תנאי 2); ‏<span class=\"math\">z<\/span> — השאר.\n    הלולאה ניתנת לדילוג או לשכפול בלי לשנות את מצב הסיום — תנאי 3. <span class=\"qed\">∎<\/span>\n  <\/div>\n\n  <div class=\"note\">קבוע הניפוח הוא בעצם \"מספר המצבים של אוטומט כלשהו לשפה\" — לכן איננו יודעים אותו,\n    רק שהוא קיים. כל טיעון שמתחיל ב\"ניקח n=3\" — פסול מהיסוד.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t3\">משחק היריב — מבנה הוכחת אי־רגולריות<\/h2>\n\n  <p>הוכחת אי-רגולריות = שלילת הלמה. בגלל הכמתים, נוח לחשוב על זה כמשחק נגד יריב:<\/p>\n\n  <ol class=\"pump-steps\">\n    <li data-who=\"פתיחה\">מניחים בשלילה ש-<span class=\"math\">L<\/span> רגולרית; הלמה מספקת קבוע <span class=\"math\">n<\/span> — <b>היריב בוחר, אנחנו לא יודעים אותו<\/b>.<\/li>\n    <li data-who=\"אנחנו\">בוחרים מילה <span class=\"math\">w ∈ L<\/span> עם <span class=\"math\">|w| ≥ n<\/span> — מותר (וחובה) לבטא אותה באמצעות <span class=\"math\">n<\/span>.<\/li>\n    <li data-who=\"יריב\">היריב מחלק <span class=\"math\">w = xyz<\/span> בכפוף לתנאים 1–2. עלינו לטפל <b>בכל חלוקה חוקית<\/b> — לא לבחור אחת נוחה!<\/li>\n    <li data-who=\"אנחנו\">בוחרים <span class=\"math\">i<\/span> (לכל חלוקה מותר <span class=\"math\">i<\/span> אחר) ומראים <span class=\"math\">xy<sup>i<\/sup>z ∉ L<\/span> — סתירה לתנאי 3.<\/li>\n  <\/ol>\n\n  <p>ניצחנו בכל תרחיש ⇒ הלמה נכשלת ⇒ ‏<span class=\"math\">L<\/span> איננה רגולרית.<\/p>\n\n  <div class=\"warn\">הבלבול הקטלני ביותר: לבחור את החלוקה בעצמכם. אם ההוכחה שלכם אומרת\n    \"ניקח <span class=\"math\">y = <\/span>...\" בלי למצות את כל האפשרויות — היא שווה מעט מאוד נקודות.\n    (בזכות תנאי 2, לרוב כל החלוקות נראות אותו דבר — זה בסדר, אבל חובה לומר זאת במפורש.)<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t4\">הוכחה מלאה: {0ⁿ1ⁿ}<\/h2>\n\n  <div class=\"ex-box\">\n    <h4>המופת שכל הוכחה נמדדת מולו (בסגנון הפתרונות הרשמיים)<\/h4>\n    <p>נניח בשלילה ש-<span class=\"math\">L = {0<sup>n<\/sup>1<sup>n<\/sup> | n ≥ 0}<\/span> רגולרית,\n      ויהי <span class=\"math\">n<\/span> הקבוע המובטח מהלמה.<\/p>\n    <p><b>בחירת מילה:<\/b> ‏<span class=\"math\">w = 0<sup>n<\/sup>1<sup>n<\/sup> ∈ L<\/span>, ואכן <span class=\"math\">|w| = 2n ≥ n<\/span>.<\/p>\n    <p><b>כל חלוקה:<\/b> תהי <span class=\"math\">w = xyz<\/span> עם <span class=\"math\">|xy| ≤ n<\/span>,\n      ‏<span class=\"math\">|y| &gt; 0<\/span>. מכיוון ש-<span class=\"math\">n<\/span> האותיות הראשונות כולן\n      <span class=\"math\">0<\/span>: בהכרח <span class=\"math\">x = 0<sup>s<\/sup><\/span>, ‏<span class=\"math\">y = 0<sup>t<\/sup><\/span>\n      עם <span class=\"math\">t ≥ 1<\/span>, ‏<span class=\"math\">s + t ≤ n<\/span>.<\/p>\n    <p><b>שאיבה:<\/b> נבחר <span class=\"math\">i = 2<\/span>: ‏\n      <span class=\"math\">xy²z = 0<sup>n+t<\/sup>1<sup>n<\/sup><\/span>, ומכיוון ש-<span class=\"math\">t &gt; 0<\/span>\n      יש בה יותר 0-ים מ-1-ים ⇒ ‏<span class=\"math\">xy²z ∉ L<\/span> — סתירה לתנאי 3.<\/p>\n    <p>לכן <span class=\"math\">L<\/span> איננה רגולרית. <span class=\"qed\">∎<\/span><\/p>\n  <\/div>\n\n  <div class=\"note\">כל המרכיבים חייבים להופיע: ההנחה בשלילה, \"יהי n המובטח\", מילה התלויה ב-n,\n    מיצוי צורת החלוקה <b>מהתנאים<\/b>, בחירת i, והסתירה. זה השלד שחוזר בכל המבחנים\n    (2024א ש3.1, 2024ב ש3.2, 2023ב ש3.1).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t5\">אומנות בחירת המילה<\/h2>\n\n  <p>רוב ההוכחה מוכרעת בבחירת <span class=\"math\">w<\/span>. עקרונות:<\/p>\n  <ul>\n    <li><b>לדחוף את החולשה לחלון:<\/b> בגלל תנאי 2 השאיבה נוגעת רק ב-<span class=\"math\">n<\/span> הראשונות —\n      בוחרים מילה שתחילתה היא בדיוק החלק הרגיש (בלוק אחיד שהשוואתו קריטית).<\/li>\n    <li><b>על הגבול:<\/b> מילה שיושבת \"בקצה\" של התנאי, כך שכל שינוי קטן מפיל אותה החוצה.\n      ב-2024א ש3.1 (<span class=\"math\">{a<sup>m<\/sup>ba<sup>n<\/sup>b | m ≥ 2n}<\/span>) הרשמי בחר\n      <span class=\"math\">w = a<sup>2n<\/sup>ba<sup>n<\/sup>b<\/span> — שוויון מדויק, ואז שאיבה למטה שוברת.<\/li>\n    <li><b>אחידות בהתחלה:<\/b> אם תחילת המילה הומוגנית (רק <span class=\"math\">a<\/span>-ים),\n      צורת החלוקה נקבעת יחידה — ‏<span class=\"math\">y = a<sup>t<\/sup><\/span> — והמשחק מתקצר.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>מתרגול 5: ‏<span class=\"math\">{0<sup>m<\/sup>1<sup>n<\/sup> | m &gt; n}<\/span><\/h4>\n    <p>בוחרים <span class=\"math\">w = 0<sup>n+1<\/sup>1<sup>n<\/sup><\/span> — היתרון של ה-0-ים הוא בדיוק 1.\n      כל <span class=\"math\">y = 0<sup>t<\/sup><\/span>, ושאיבה <b>למטה<\/b> (<span class=\"math\">i=0<\/span>)\n      מוחקת <span class=\"math\">t ≥ 1<\/span> אפסים: ‏<span class=\"math\">0<sup>n+1−t<\/sup>1<sup>n<\/sup><\/span>\n      עם <span class=\"math\">m ≤ n<\/span> — מחוץ לשפה.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t6\">ניצול התנאי |xy| ≤ n<\/h2>\n\n  <p>תנאי 2 הוא החבר הכי טוב שלכם: הוא כולא את <span class=\"math\">y<\/span> בתחילת המילה\n    ומצמצם דרמטית את מגוון החלוקות שצריך למצות.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">{ww | w ∈ Σ<sup>*<\/sup>}<\/span> — ‏2023ב ש3.1<\/h4>\n    <p>בחירה רשמית: ‏<span class=\"math\">w = 0<sup>n<\/sup>10<sup>n<\/sup>1<\/span>. בזכות תנאי 2,\n      ‏<span class=\"math\">y = 0<sup>t<\/sup><\/span> בתוך בלוק ה-0-ים הראשון. שאיבה למעלה:\n      ‏<span class=\"math\">0<sup>n+t<\/sup>10<sup>n<\/sup>1<\/span> — אם <span class=\"math\">t<\/span> אי-זוגי\n      האורך אי-זוגי (אין בכלל חלוקה לשני חצאים); אם זוגי — החצי הראשון כולו 0-ים בעוד השני\n      מכיל 1, סתירה. בלי תנאי 2 היו נדרשים עוד תריסר מקרים.<\/p>\n  <\/div>\n\n  <div class=\"note\">אם בכל זאת נשארו כמה צורות חלוקה (מילה שמתחילה בשני בלוקים בתוך חלון ה-n) —\n    מפרקים למקרים ממוספרים וסוגרים כל אחד. מבנה \"מקרה 1 \/ מקרה 2\" מסודר הוא בדיוק מה שהבודק מחפש —\n    כך כתובים הפתרונות הרשמיים של למת הניפוח לח\"ה (פרק 8).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t7\">ניפוח למטה — i = 0<\/h2>\n\n  <p>תנאי 3 מבטיח <span class=\"math\">xy<sup>i<\/sup>z ∈ L<\/span> גם עבור <span class=\"math\">i = 0<\/span> —\n    מחיקת <span class=\"math\">y<\/span>. מתי זה הכלי הנכון?<\/p>\n  <ul>\n    <li><b>תנאי \"≥\" עם שוויון הדוק:<\/b> ‏<span class=\"math\">m ≥ 2n<\/span> עם\n      <span class=\"math\">w = a<sup>2n<\/sup>ba<sup>n<\/sup>b<\/span>: שאיבה למעלה רק מוסיפה\n      <span class=\"math\">a<\/span>-ים ונשארת בשפה! חייבים למחוק: ‏<span class=\"math\">i = 0<\/span> נותן\n      <span class=\"math\">a<sup>2n−t<\/sup>ba<sup>n<\/sup>b<\/span> עם <span class=\"math\">2n−t &lt; 2n<\/span> —\n      מחוץ לשפה (הפתרון הרשמי של 2024א ש3.1 בדיוק).<\/li>\n    <li><b>אורכים מינימליים:<\/b> כשהמילה שנבחרה היא הקצרה ביותר בסביבתה — מחיקה מפילה מתחת לסף.<\/li>\n  <\/ul>\n\n  <div class=\"warn\">בדקו את כיוון האי-שוויון לפני שבוחרים <span class=\"math\">i<\/span>:\n    תנאי \"≥\" נשבר בדרך כלל למטה, תנאי \"≤\" למעלה, ושוויון \"=\" נשבר בשני הכיוונים.\n    בחירת כיוון שגוי = שאיבה שנשארת בשפה = הוכחה ריקה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t8\">חשבון אורכים והערת ה־(i−1)t<\/h2>\n\n  <div class=\"thm\">אם <span class=\"math\">|y| = t<\/span> אז <span class=\"math\">|xy<sup>i<\/sup>z| = |w| + (i−1)·t<\/span>\n    — כל שאיבה מוסיפה (או גורעת, עבור <span class=\"math\">i=0<\/span>) בדיוק <span class=\"math\">t<\/span> אותיות.\n    (ההערה מופיעה במפורש בדף הנוסחאות.)<\/div>\n\n  <p>למה זה שימושי? כשתנאי השפה הוא על <b>האורך הכולל<\/b> (ראשוני, חזקה, ריבוע):<\/p>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">{a<sup>m<\/sup> | m ראשוני}<\/span><\/h4>\n    <p>ניקח <span class=\"math\">w = a<sup>p<\/sup><\/span> לראשוני <span class=\"math\">p ≥ n<\/span>, חלוקה כלשהי\n      עם <span class=\"math\">|y| = t ≥ 1<\/span>. נבחר <span class=\"math\">i = p+1<\/span>:\n      האורך נעשה <span class=\"math\">p + p·t = p(1+t)<\/span> — מכפלה של שני גורמים\n      <span class=\"math\">≥ 2<\/span>... כמעט: צריך <span class=\"math\">p ≥ 2<\/span> ו-<span class=\"math\">1+t ≥ 2<\/span> ✓.\n      לא ראשוני — סתירה. הבחירה החכמה של <span class=\"math\">i<\/span> הפכה את האורך למכפלה.<\/p>\n  <\/div>\n\n  <div class=\"note\">אותו חשבון בדיוק משמש בגרסת הח\"ה של הלמה (פרק 8) —\n    שם <span class=\"math\">|uv<sup>i<\/sup>xy<sup>i<\/sup>z| = |w| + (i−1)(s+t)<\/span>.\n    שליטה באריתמטיקה הזו היא ההבדל בין \"כמעט הוכחה\" להוכחה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t9\">הדרך העקיפה — סגירויות במקום ניפוח<\/h2>\n\n  <p>לפעמים ניפוח ישיר מסורבל, וסגירות מקצרת: מניחים ש-<span class=\"math\">L<\/span> רגולרית,\n    בונים ממנה בפעולות סגורות שפה שכבר ידועה כלא-רגולרית — סתירה.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>שתי דוגמאות<\/h4>\n    <p><b>‏<span class=\"math\">{w | #₀(w) = #₁(w)}<\/span>:<\/b> אילו הייתה רגולרית, גם\n      ‏<span class=\"math\">L ∩ L(0<sup>*<\/sup>1<sup>*<\/sup>) = {0<sup>n<\/sup>1<sup>n<\/sup>}<\/span>\n      הייתה רגולרית (חיתוך עם רגולרית) — סתירה. שתי שורות!<\/p>\n    <p><b>‏<span class=\"math\">{a<sup>p+1<\/sup> | p ראשוני}<\/span> (2023א ש3.4, בגרסת ח\"ה):<\/b>\n      הצבה שמסמנת אות אחת, חיתוך עם <span class=\"math\">a<sup>*<\/sup>a′a<sup>*<\/sup><\/span>,\n      והצבה שמוחקת את המסומנת — מחזירים את <span class=\"math\">{a<sup>p<\/sup>}<\/span> הידועה. <\/p>\n  <\/div>\n\n  <div class=\"algo\">\n    <h4>מתי מותר ומה חובה לציין<\/h4>\n    <ol>\n      <li>מותר — אלא אם השאלה דורשת במפורש \"ע\"י למת הניפוח\" (כמו ב-2024א ש3.1!).<\/li>\n      <li>חובה לציין את שם הסגירות בכל צעד (\"חיתוך עם רגולרית\", \"הצבה רגולרית\").<\/li>\n      <li>חובה שהשפה שמגיעים אליה תהיה מוכרת כלא-רגולרית (מותר להסתמך על מה שהוכח בכיתה\/בתרגול).<\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch5-t10\">טעויות קלאסיות סביב הלמה<\/h2>\n\n  <ul>\n    <li><b>הכיוון ההפוך:<\/b> הלמה היא תנאי <b>הכרחי<\/b> לרגולריות, לא מספיק. שפה שמקיימת את\n      תנאי הניפוח עדיין יכולה להיות לא-רגולרית — הלמה לעולם לא מוכיחה רגולריות!\n      (לרגולריות: בונים אוטומט\/ביטוי. נקודה.)<\/li>\n    <li><b>בחירת n:<\/b> \"יהי n המובטח\" — לא \"ניקח n גדול\". המספר של היריב.<\/li>\n    <li><b>מילה שלא תלויה ב-n:<\/b> ‏<span class=\"math\">w<\/span> קבועה (למשל 0011) לא עובדת —\n      אולי <span class=\"math\">|w| &lt; n<\/span>. המילה חייבת \"לגדול עם n\".<\/li>\n    <li><b>חלוקה נבחרת:<\/b> לטפל רק ב-<span class=\"math\">y<\/span> נוח = לא הוכחתם כלום. ממצים\n      את הצורה מהתנאים, או מפרקים לכל המקרים.<\/li>\n    <li><b>מילה מחוץ לשפה:<\/b> בדקו פעמיים ש-<span class=\"math\">w ∈ L<\/span> (כולל תנאֵי קצה כמו\n      <span class=\"math\">n<\/span> זוגי\/אי-זוגי בהגדרת השפה!).<\/li>\n    <li><b>שאיבה שנשארת בשפה:<\/b> אחרי הבחירה, לאמת באמת ש-<span class=\"math\">xy<sup>i<\/sup>z ∉ L<\/span>\n      — כולל המקרה שהמילה השאובה מקיימת את התנאי דרך פירוש אחר של ההגדרה (∃-הגדרות בוגדניות!).<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> ניפוח = שובך יונים ממוסד. הכמתים קובעים מי בוחר מה;\n    תנאי 2 מצמצם את המשחק; ‏<span class=\"math\">i=0<\/span> שובר תנאי \"≥\"; וכשמותר — סגירות מקצרת.\n    את הנוסח המלא תמצאו תמיד בדף הנוסחאות — את הדיוק בכמתים רק אצלכם.<\/div>\n<\/section>\n"},{"sid":"ch6","group":"פרקים","title":"פרק 6 — דקדוקים חסרי הקשר","topics":["CFG — ההגדרה הפורמלית","גזירה ושפת הדקדוק","עצי גזירה וגזירה שמאלית","עמימות (Ambiguity)","תכנון דקדוקים — זוגות, שיקוף וקינון","תכנון דקדוקים — פירוק למקרים ושרשור","אי־שוויונות בדקדוק — לפחות ולכל היותר","כל שפה רגולרית היא חסרת הקשר","הוכחת נכונות של דקדוק","סגירויות של חסרות הקשר","מה חסרות הקשר לא סוגרות"],"html":"<h1>דקדוקים חסרי הקשר<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 6 (הרצאה 6 + תרגול 6)<\/p>\n\n<section>\n  <h2 id=\"ch6-t0\">CFG — ההגדרה הפורמלית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">דקדוק חסר הקשר (CFG)<\/span> — רביעייה <span class=\"math\">G = (V, Σ, S, R)<\/span>:\n    <ul>\n      <li><span class=\"math\">V<\/span> — קבוצה סופית של <b>משתנים<\/b> (Variables, אותיות גדולות).<\/li>\n      <li><span class=\"math\">Σ<\/span> — <b>טרמינלים<\/b> (אותיות השפה), <span class=\"math\">V ∩ Σ = ∅<\/span>.<\/li>\n      <li><span class=\"math\">S ∈ V<\/span> — משתנה ההתחלה.<\/li>\n      <li><span class=\"math\">R<\/span> — קבוצה סופית של <b>כללי גזירה<\/b> מהצורה <span class=\"math\">A → α<\/span>,\n        כאשר <span class=\"math\">A ∈ V<\/span> ו-<span class=\"math\">α ∈ (V ∪ Σ)<sup>*<\/sup><\/span>.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>\"חסר הקשר\" = בצד שמאל של כלל עומד משתנה <b>יחיד<\/b>: מותר להחליף אותו בלי להסתכל על שכניו.\n    כמה כללים לאותו משתנה מקצרים עם קו: <span class=\"math\">A → α | β<\/span>.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>הדקדוק הראשון שכולם פוגשים<\/h4>\n    <div class=\"gram\"><div class=\"rule\"><span class=\"nt\">S<\/span> → a<span class=\"nt\">S<\/span>b | ε<\/div><\/div>\n    <p>יוצר בדיוק את <span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span> — כל הפעלת הכלל\n      הראשון עוטפת בזוג מתואם אחד. השפה שלא הצליחה להיות רגולרית — נכנעת לשני כללים.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t1\">גזירה ושפת הדקדוק<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">צעד גזירה<\/span> — <span class=\"math\">uAv ⇒ uαv<\/span> אם\n    <span class=\"math\">A → α ∈ R<\/span> (מחליפים מופע אחד של משתנה).\n    <span class=\"term\">גזירה<\/span> — סדרת צעדים; <span class=\"math\">α ⇒<sup>*<\/sup> β<\/span> = אפס או יותר צעדים.<br>\n    <span class=\"term\">שפת הדקדוק<\/span> — <span class=\"math\">L(G) = {w ∈ Σ<sup>*<\/sup> | S ⇒<sup>*<\/sup> w}<\/span>:\n    כל מילות הטרמינלים שנגזרות מ-<span class=\"math\">S<\/span>.\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>גזירה לדוגמה<\/h4>\n    <div class=\"config-line\">S ⇒ aSb ⇒ aaSbb ⇒ aabb<\/div>\n    <p>שני שימושים בכלל העוטף ואחד ב-<span class=\"math\">S → ε<\/span>. שימו לב:\n      <b>צורות ביניים<\/b> (עם משתנים) אינן בשפה — רק מילות טרמינלים טהורות.<\/p>\n  <\/div>\n\n  <div class=\"def\"><span class=\"term\">שפה חסרת הקשר (CFL)<\/span> — שפה שנוצרת ע\"י CFG כלשהו.\n    בפרק 8 נראה: זו בדיוק המחלקה שמזוהה ע\"י אוטומטי מחסנית.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t2\">עצי גזירה וגזירה שמאלית<\/h2>\n\n  <p><b>עץ גזירה<\/b> מציג את המבנה בלי סדר הצעדים: השורש <span class=\"math\">S<\/span>, כל צומת-משתנה\n    מסתעף לפי הכלל שהופעל עליו, והעלים (משמאל לימין) הם המילה.<\/p>\n\n  <div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul>\n    <li>a<\/li>\n    <li><span class=\"nt\">S<\/span><ul><li>a<\/li><li><span class=\"nt\">S<\/span><ul><li>ε<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li>\n    <li>b<\/li>\n  <\/ul><\/li><\/ul><\/div>\n\n  <div class=\"def\"><span class=\"term\">גזירה שמאלית<\/span> — בכל צעד מחליפים את המשתנה השמאלי ביותר.\n    לכל עץ גזירה מתאימה בדיוק גזירה שמאלית אחת — ולכן \"שני עצים שונים\" ⟺ \"שתי גזירות שמאליות שונות\".<\/div>\n\n  <div class=\"note\">גזירות שונות באותו עץ (סדר החלפות שונה) — לא מעניינות; מה שמבחין מבנית הוא\n    ה<b>עץ<\/b>. זו בדיוק ההבחנה שנדרשת בהגדרת העמימות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t3\">עמימות (Ambiguity)<\/h2>\n\n  <div class=\"def\"><span class=\"term\">דקדוק עמום<\/span> — קיימת מילה <span class=\"math\">w ∈ L(G)<\/span>\n    עם <b>שני עצי גזירה שונים<\/b> (שקול: שתי גזירות שמאליות שונות).<\/div>\n\n  <div class=\"algo\">\n    <h4>איך מוכיחים עמימות במבחן (2024א ש3.3, 2023ב ש3.2)<\/h4>\n    <ol>\n      <li>בוחרים מילה קצרה שנגזרת בשתי \"דרכים רעיוניות\" (שני ענפים של S, או שתי דרכי קיבוץ).<\/li>\n      <li><b>מציירים את שני העצים<\/b> (או כותבים את שתי הגזירות השמאליות) במלואם.<\/li>\n      <li>מציינים במשפט שהעצים שונים — די בכך.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>שתי הדוגמאות מהמבחנים<\/h4>\n    <p>‏<b>‏2023ב:<\/b> ‏<span class=\"math\">S → aS | Sb | a | b | ε<\/span> עם <span class=\"math\">w = ab<\/span>:\n      פעם דרך <span class=\"math\">S ⇒ aS ⇒ ab<\/span> ופעם דרך <span class=\"math\">S ⇒ Sb ⇒ ab<\/span>.<br>\n      <b>‏2024א:<\/b> בדקדוק עם <span class=\"math\">S → AC | D<\/span> — המילה <span class=\"math\">abc<\/span>\n      נגזרת דרך שני הענפים (כשהתנאי <span class=\"math\">i ≥ min{j,k}<\/span> מתקיים בשתי הדרכים).\n      מילה שנופלת בחפיפה של שני מקרים — המועמדת הטבעית לעמימות.<\/p>\n  <\/div>\n\n  <div class=\"note\">עמימות היא תכונה של <b>הדקדוק<\/b>, לא של השפה (לשפה יכולים להיות גם דקדוק עמום\n    וגם חד-משמעי). לצורך המבחן: מזהים חפיפת ענפים ובוחרים בה את המילה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t4\">תכנון דקדוקים — זוגות, שיקוף וקינון<\/h2>\n\n  <p>המשתנה הוא \"מונה מבני\": כל כלל רקורסיבי מוסיף כמות מתואמת משני צדדים. תבניות היסוד:<\/p>\n\n  <table>\n    <tr><th>תבנית<\/th><th>כללים<\/th><th>שפה<\/th><\/tr>\n    <tr><td>זוגות מתואמים<\/td><td><span class=\"math\">S → aSb | ε<\/span><\/td><td><span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>}<\/span><\/td><\/tr>\n    <tr><td>שיקוף (פלינדרום)<\/td><td><span class=\"math\">S → aSa | bSb | a | b | ε<\/span><\/td><td><span class=\"math\">{w = w<sup>R<\/sup>}<\/span><\/td><\/tr>\n    <tr><td>שיקוף בתנאי<\/td><td><span class=\"math\">S → 0A0, A → 0A0 | 1A1 | ε<\/span><\/td><td><span class=\"math\">{ww<sup>R<\/sup> | w₁ ≠ 1}<\/span> (2024ב ש3.1!)<\/td><\/tr>\n    <tr><td>אנטי-שיקוף<\/td><td><span class=\"math\">S → aSb | bSa | ε<\/span><\/td><td><span class=\"math\">{uv<sup>R<\/sup> | ∀i: u<sub>i<\/sub>≠v<sub>i<\/sub>}<\/span> (מבחן לדוגמה ש3.3!)<\/td><\/tr>\n    <tr><td>קינון סביב תוכן<\/td><td><span class=\"math\">S → aSb | T<\/span><\/td><td>‏<span class=\"math\">a<sup>n<\/sup>·L(T)·b<sup>n<\/sup><\/span> — עוטפים שפה פנימית<\/td><\/tr>\n  <\/table>\n\n  <div class=\"note\">תבנית הקינון היא הפואנטה של L023 במאגר: ‏<span class=\"math\">{a<sup>n<\/sup>ub<sup>n<\/sup> | u ∈ L}<\/span>\n    ח\"ה לכל <span class=\"math\">L<\/span> ח\"ה — פשוט שותלים את משתנה ההתחלה של <span class=\"math\">L<\/span> בבסיס הרקורסיה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t5\">תכנון דקדוקים — פירוק למקרים ושרשור<\/h2>\n\n  <ul>\n    <li><b>איחוד\/מקרים:<\/b> ‏<span class=\"math\">S → S₁ | S₂<\/span> — כל מקרה מקבל משתנה משלו.\n      כך נבנה הדקדוק של 2024א ש3.2 ל-<span class=\"math\">{a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i ≥ min{j,k}}<\/span>:\n      ענף ל-<span class=\"math\">i ≥ j<\/span> וענף ל-<span class=\"math\">i ≥ k<\/span>.<\/li>\n    <li><b>שרשור:<\/b> ‏<span class=\"math\">S → S₁S₂<\/span> — שני חלקים עצמאיים זה אחר זה.\n      ‏<span class=\"math\">{a<sup>i<\/sup>b<sup>i<\/sup>c<sup>j<\/sup>} = {a<sup>i<\/sup>b<sup>i<\/sup>}·c<sup>*<\/sup><\/span>:\n      ‏<span class=\"math\">S → AC, A → aAb|ε, C → cC|ε<\/span>.<\/li>\n    <li><b>הכנסה באמצע:<\/b> ‏<span class=\"math\">S → cSc | Scc | ccS | A<\/span> — הפיזור של\n      2023ב ש1.3 (‏<span class=\"en\">Op<\/span>‏): מוסיפים סימנים בזוגות בכל מיקום יחסי.<\/li>\n  <\/ul>\n\n  <div class=\"warn\">מלכודת השרשור: תלות <b>בין<\/b> החלקים אינה ניתנת לשרשור.\n    ‏<span class=\"math\">{a<sup>i<\/sup>b<sup>i<\/sup>a<sup>i<\/sup>}<\/span> אינו\n    <span class=\"math\">{a<sup>i<\/sup>b<sup>i<\/sup>}·{a<sup>i<\/sup>}<\/span> — המונה לא עובר בין המשתנים\n    (ולמעשה השפה כלל לא ח\"ה). כל משתנה חי לבד — \"חסר הקשר\" פשוטו כמשמעו.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t6\">אי־שוויונות בדקדוק — לפחות ולכל היותר<\/h2>\n\n  <p>איך מקודדים <span class=\"math\">i ≥ j<\/span> (יותר <span class=\"math\">a<\/span>-ים מ-<span class=\"math\">b<\/span>-ים)?\n    מפרקים כל <span class=\"math\">b<\/span> עם בן-זוג <span class=\"math\">a<\/span>, ומרשים\n    <span class=\"math\">a<\/span>-ים חופשיים:<\/p>\n\n  <div class=\"gram\">\n    <div class=\"rule\"><span class=\"nt\">A<\/span> → a<span class=\"nt\">A<\/span>b | a<span class=\"nt\">A<\/span> | ε<\/div>\n  <\/div>\n\n  <p>זה בדיוק הכלל מהפתרון הרשמי של 2024א ש3.2. וריאציות:\n    ‏<span class=\"math\">i &gt; j<\/span> — מחייבים עודף: ‏<span class=\"math\">A → aA′ , A′ → aA′b | aA′ | ε<\/span>\n    (או מוסיפים <span class=\"math\">a<\/span> חובה בבסיס); ‏<span class=\"math\">i ≤ j<\/span> — משקפים:\n    ‏<span class=\"math\">A → aAb | Ab | ε<\/span>.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>תרגיל שליטה: <span class=\"math\">{a<sup>i<\/sup>b<sup>j<\/sup> | (i+j) mod 3 = 0}<\/span> — ‏2023א ש3.1<\/h4>\n    <div class=\"gram\"><div class=\"rule\"><span class=\"nt\">S<\/span> → ε | a<span class=\"nt\">S<\/span>bb | aa<span class=\"nt\">S<\/span>b | aaa<span class=\"nt\">S<\/span> | <span class=\"nt\">S<\/span>bbb<\/div><\/div>\n    <p>כל כלל תורם 3 לסכום תוך שמירה על הסדר (a-ים משמאל, b-ים מימין). דקדוק יכול לספור\n      מודולרית <b>וגם<\/b> לתאם — שני הכוחות ביחד.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t7\">כל שפה רגולרית היא חסרת הקשר<\/h2>\n\n  <div class=\"thm\">‏<span class=\"math\">REG ⊊ CFL<\/span>: כל רגולרית — חסרת הקשר, וההכלה ממש\n    (‏<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>}<\/span> מפרידה).<\/div>\n\n  <div class=\"algo\">\n    <h4>שתי הוכחות, שתיהן שוות היכרות<\/h4>\n    <ol>\n      <li><b>דקדוק רגולרי מ-DFA<\/b> (דף הנוסחאות): משתנה לכל מצב; לכל מעבר\n        <span class=\"math\">δ(A,σ)=B<\/span> כלל <span class=\"math\">A → σB<\/span>; לכל מצב מקבל\n        <span class=\"math\">A → ε<\/span>. כללים \"ליניאריים ימניים\" — מקרה פרטי של CFG.<\/li>\n      <li><b>PDA שמתעלם מהמחסנית<\/b> (פרק 8): ‏DFA הוא PDA שלא נוגע במחסנית.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"note\">המסקנה המבצעית במבחן (2024א ש1.3): כדי להראות ששפה היא ח\"ה מותר להראות\n    שהיא רגולרית — או לערבב: חיתוך של ח\"ה עם רגולרית, שרשור שלהן וכד' (הסגירויות של t9).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t8\">הוכחת נכונות של דקדוק<\/h2>\n\n  <div class=\"algo\">\n    <h4>‏<span class=\"math\">L(G) = L<\/span> — שני כיווני ההכלה<\/h4>\n    <ol>\n      <li><b>‏<span class=\"math\">L(G) ⊆ L<\/span>:<\/b> אינדוקציה על <b>אורך הגזירה<\/b> — כל כלל משמר\n        אינווריאנטה (למשל: \"מ-<span class=\"math\">A<\/span> נגזרות בדיוק מילים עם <span class=\"math\">#a ≥ #b<\/span>\").<\/li>\n      <li><b>‏<span class=\"math\">L ⊆ L(G)<\/span>:<\/b> אינדוקציה על <b>אורך המילה<\/b> — מראים איך לגזור\n        כל מילה חוקית (מקלפים זוג\/אות ומפעילים את הנחת האינדוקציה).<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>בפועל, במבחני הקורס מסתפקים כמעט תמיד ב<b>הסבר קצר<\/b> (\"הענף הראשון מייצר…, השני…,\n    ולכן ביחד בדיוק…\") — כפי שמנוסח בפתרונות הרשמיים. אבל ההסבר חייב לכסות את שני הכיוונים\n    רעיונית: למה כל מה שנגזר חוקי, ולמה כל מילה חוקית נגזרת.<\/p>\n\n  <div class=\"warn\">הטעות הנפוצה: דקדוק שיוצר את כל השפה אבל <b>גם עוד<\/b> (הכלה חד-כיוונית).\n    בדקו מילים גבוליות: ‏ε, מילים שכולן אות אחת, והמקרים שעל גבול התנאי.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t9\">סגירויות של חסרות הקשר<\/h2>\n\n  <p>עם דקדוקים, שלוש סגירויות הן חד-שורתיות — בהינתן <span class=\"math\">G₁, G₂<\/span>\n    (עם משתנים זרים!):<\/p>\n  <ul>\n    <li><b>איחוד:<\/b> ‏<span class=\"math\">S → S₁ | S₂<\/span>.<\/li>\n    <li><b>שרשור:<\/b> ‏<span class=\"math\">S → S₁S₂<\/span>.<\/li>\n    <li><b>כוכב:<\/b> ‏<span class=\"math\">S → S₁S | ε<\/span>.<\/li>\n  <\/ul>\n  <p>ועוד מהקורס: <b>היפוך<\/b> (הופכים כל צד ימין), <b>הצבה חסרת הקשר \/ רגולרית<\/b>\n    (מציבים דקדוק במקום כל טרמינל — הכלי של 2023א ש3.4!), ו<b>חיתוך עם רגולרית<\/b>\n    (בנייה על PDA — פרק 8, הכלי של 2024א ש1.3).<\/p>\n\n  <div class=\"ex-box\">\n    <h4>כך זה מופיע במבחן<\/h4>\n    <p>‏2024א ש1.3 (הפתרון הרשמי, Solution 1): ‏<span class=\"math\">L₃ = L′ ∩ L₁<\/span> —\n      בונים דקדוק ל-<span class=\"math\">L′<\/span> ומצטטים \"חיתוך ח\"ה עם רגולרית הוא ח\"ה\".\n      שרשראות סגירויות + דקדוק קטן = תשובה מלאה.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch6-t10\">מה חסרות הקשר לא סוגרות<\/h2>\n\n  <div class=\"warn\">‏CFL <b>אינה סגורה<\/b> לחיתוך ולמשלים!<\/div>\n\n  <ul>\n    <li><b>חיתוך:<\/b> ‏<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>m<\/sup>} ∩ {a<sup>m<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>} = {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>}<\/span>\n      — שתי ח\"ה קלאסיות שחיתוכן איננו ח\"ה (פרק 8).<\/li>\n    <li><b>משלים:<\/b> אילו הייתה סגירות למשלים, מדה-מורגן היה נובע סגור לחיתוך — סתירה.\n      (זו בדיוק התשובה הרשמית של מבחן-לדוגמה ש3.4 על XOR: ‏<span class=\"math\">L₁ XOR Σ<sup>*<\/sup> = <span class=\"comp\">L₁<\/span><\/span>.)<\/li>\n    <li><b>הפרש:<\/b> ‏<span class=\"math\">Σ<sup>*<\/sup> ∖ L = <span class=\"comp\">L<\/span><\/span> — נופל עם המשלים.<\/li>\n  <\/ul>\n\n  <table>\n    <tr><th>פעולה<\/th><th>REG<\/th><th>CFL<\/th><\/tr>\n    <tr><td>איחוד \/ שרשור \/ כוכב \/ היפוך \/ הצבה<\/td><td>✓<\/td><td>✓<\/td><\/tr>\n    <tr><td>חיתוך עם רגולרית<\/td><td>✓<\/td><td>✓<\/td><\/tr>\n    <tr><td>חיתוך כללי<\/td><td>✓<\/td><td>✗<\/td><\/tr>\n    <tr><td>משלים \/ הפרש<\/td><td>✓<\/td><td>✗<\/td><\/tr>\n  <\/table>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> משתנה = סוכן עצמאי שמייצר מבנה מתואם מקומית; עמימות = שני עצים;\n    התבניות (זוגות, שיקוף, מקרים, קינון, אי-שוויון) מכסות כמעט כל שאלת \"בנו דקדוק\"; וטבלת\n    הסגירויות — בפרט השורות של ✗ — היא נשק ההכרעה בשאלות נכון\/לא נכון.<\/div>\n<\/section>\n"},{"sid":"ch7","group":"פרקים","title":"פרק 7 — אוטומטי מחסנית, פישוט ו־CNF","topics":["PDA — ההגדרה הפורמלית","צעד חישוב — לקרוא, להוציא, לדחוף","ריצות וקבלה — הדוגמה 0ⁿ1ⁿ","תבניות תכנון PDA","אי־דטרמיניזם ב־PDA הוא מהותי","PDA ← CFG — הבנייה","דקדוק מפושט — הסרת כללי ε","הסרת כללי יחידה","צורת חומסקי הנורמלית (CNF)","היררכיית חומסקי — התמונה המלאה"],"html":"<h1>אוטומטי מחסנית, פישוט ו־CNF<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 7 (הרצאה 7 + תרגול 7)<\/p>\n\n<section>\n  <h2 id=\"ch7-t0\">PDA — ההגדרה הפורמלית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">אוטומט מחסנית (PDA)<\/span> — שישייה\n    <span class=\"math\">A = (Q, Σ, Γ, δ, q<sub>s<\/sub>, F)<\/span>:\n    <ul>\n      <li><span class=\"math\">Q<\/span> — מצבים; <span class=\"math\">Σ<\/span> — אלף-בית קלט;\n        <span class=\"math\">Γ<\/span> — <b>אלף-בית מחסנית<\/b> (יכול להיות שונה מ-Σ!).<\/li>\n      <li><span class=\"math\">δ: Q × Σ<sub>ε<\/sub> × Γ<sub>ε<\/sub> → P(Q × Γ<sub>ε<\/sub>)<\/span> —\n        פונקציית מעברים <b>אי-דטרמיניסטית<\/b>.<\/li>\n      <li><span class=\"math\">q<sub>s<\/sub><\/span> התחלתי, <span class=\"math\">F ⊆ Q<\/span> מקבלים.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>‏NFA + מחסנית אינסופית שרואים רק את ראשה. הסימון על חץ:\n    <span class=\"math\">σ, γ → γ′<\/span> = \"קרא <span class=\"math\">σ<\/span> מהקלט, הוצא (pop)\n    <span class=\"math\">γ<\/span> מהמחסנית, דחוף (push) <span class=\"math\">γ′<\/span>\" — וכל אחד\n    מהשלושה יכול להיות <span class=\"math\">ε<\/span> (\"בלי לקרוא \/ בלי להוציא \/ בלי לדחוף\").<\/p>\n\n  <div class=\"note\">המחסנית מתחילה <b>ריקה<\/b>. לכן הצעד הראשון האופייני הוא\n    <span class=\"math\">ε, ε → $<\/span> — דחיפת סמל תחתית שמאפשר לזהות אחר-כך \"המחסנית התרוקנה\".\n    זו קונבנציה, לא חלק מההגדרה — אבל כמעט כל בנייה בקורס משתמשת בה (ראו ה-PDA של 2024ב ש3.3).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t1\">צעד חישוב — לקרוא, להוציא, לדחוף<\/h2>\n\n  <p>קונפיגורציה של PDA: (מצב, יתרת קלט, תוכן מחסנית). מעבר\n    <span class=\"math\">(p, γ′) ∈ δ(q, σ, γ)<\/span> חוקי כאשר:<\/p>\n  <ul>\n    <li>אם <span class=\"math\">σ ∈ Σ<\/span> — האות הבאה בקלט היא <span class=\"math\">σ<\/span> (ונצרכת);\n      אם <span class=\"math\">σ = ε<\/span> — לא נוגעים בקלט.<\/li>\n    <li>אם <span class=\"math\">γ ∈ Γ<\/span> — ראש המחסנית הוא <span class=\"math\">γ<\/span> (ומוסר);\n      אם <span class=\"math\">γ = ε<\/span> — לא מציצים ולא מוציאים.<\/li>\n    <li>‏<span class=\"math\">γ′<\/span> נדחף (או כלום, אם <span class=\"math\">ε<\/span>).<\/li>\n  <\/ul>\n\n  <div class=\"warn\">‏pop הוא <b>תנאי וגם פעולה<\/b>: מעבר עם <span class=\"math\">γ = 0<\/span> אפשרי רק כשבראש\n    המחסנית יש 0 — ואז ה-0 יורד. אין \"הצצה בלי הוצאה\" ישירה (מדמים אותה עם pop ואז push חוזר).\n    ואם המחסנית ריקה, מעבר שדורש pop אינו זמין — הריצה נתקעת.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t2\">ריצות וקבלה — הדוגמה 0ⁿ1ⁿ<\/h2>\n\n  <div class=\"def\"><span class=\"term\">קבלה<\/span> — ‏PDA מקבל את <span class=\"math\">w<\/span> אם\n    <b>קיימת<\/b> ריצה שקוראת את כל <span class=\"math\">w<\/span> ומסתיימת במצב מקבל\n    (בקורס: קבלה לפי מצב מקבל; תכולת המחסנית בסוף לא חשובה — אלא אם תכננו שתהיה ריקה).<\/div>\n\n  <div class=\"ex-box\">\n    <h4>‏PDA ל-<span class=\"math\">{0<sup>n<\/sup>1<sup>n<\/sup> | n ≥ 0}<\/span><\/h4>\n    <div class=\"fsa\"><svg viewBox=\"0 0 470 130\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n      <path class=\"tr\" d=\"M8,65 L30,65\" marker-end=\"url(#arr)\"\/>\n      <circle class=\"st st-acc\" cx=\"58\" cy=\"65\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"58\" cy=\"65\" r=\"25\"\/>\n      <text class=\"slbl\" x=\"58\" y=\"65\">q₁<\/text>\n      <circle class=\"st\" cx=\"185\" cy=\"65\" r=\"25\"\/><text class=\"slbl\" x=\"185\" y=\"65\">q₂<\/text>\n      <circle class=\"st\" cx=\"310\" cy=\"65\" r=\"25\"\/><text class=\"slbl\" x=\"310\" y=\"65\">q₃<\/text>\n      <circle class=\"st st-acc\" cx=\"425\" cy=\"65\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"425\" cy=\"65\" r=\"25\"\/>\n      <text class=\"slbl\" x=\"425\" y=\"65\">q₄<\/text>\n      <path class=\"tr\" d=\"M83,65 L157,65\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"120\" y=\"55\" text-anchor=\"middle\">ε,ε→$<\/text>\n      <path class=\"tr\" d=\"M173,44 C163,18 207,18 197,44\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"185\" y=\"14\" text-anchor=\"middle\">0,ε→0<\/text>\n      <path class=\"tr\" d=\"M210,65 L282,65\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"246\" y=\"55\" text-anchor=\"middle\">1,0→ε<\/text>\n      <path class=\"tr\" d=\"M298,44 C288,18 332,18 322,44\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"310\" y=\"14\" text-anchor=\"middle\">1,0→ε<\/text>\n      <path class=\"tr\" d=\"M335,65 L397,65\" marker-end=\"url(#arr)\"\/>\n      <text class=\"lbl\" x=\"366\" y=\"55\" text-anchor=\"middle\">ε,$→ε<\/text>\n    <\/svg><div class=\"fsa-cap\">דוחפים 0-ים, פורקים מול 1-ים, ומקבלים רק אם ה-$ נחשף בדיוק בסוף<\/div><\/div>\n    <p>ריצה על 0011: דוחפים $00, שני ה-1-ים פורקים, ‏<span class=\"math\">ε,$→ε<\/span> מוביל לקבלה.\n      על 001 — ה-$ לא נחשף; על 011 — pop נכשל. שימו לב ש-<span class=\"math\">q₁<\/span> מקבל\n      (בשביל <span class=\"math\">ε<\/span> שבשפה).<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t3\">תבניות תכנון PDA<\/h2>\n\n  <table>\n    <tr><th>משימה<\/th><th>תבנית<\/th><\/tr>\n    <tr><td>השוואת שני בלוקים<\/td><td>דחוף את הראשון, פרוק מול השני (‏0ⁿ1ⁿ)<\/td><\/tr>\n    <tr><td>מאזן שוטף (‏#₀=#₁ בכל סדר)<\/td><td>המחסנית מחזיקה את העודף הנוכחי; מצבים לצד העודף — ה-PDA של 2024ב ש3.3<\/td><\/tr>\n    <tr><td>ניחוש נקודת אמצע\/פיצול<\/td><td>מעבר ε אי-דטרמיניסטי בין \"שלב דחיפה\" ל\"שלב פריקה\" (‏ww<sup>R<\/sup>)<\/td><\/tr>\n    <tr><td>סימולציית DFA + מונה<\/td><td>מצבי מכפלה (מצב DFA, שלב) והמחסנית למונה — ‏Solution 1 של 2024א ש1.3<\/td><\/tr>\n    <tr><td>לזכור מצב לחזרה<\/td><td>לדחוף את <b>שם המצב<\/b> למחסנית ולשלוף בחזרה — הבנייה של Op ב-2023ב ש1.4 (‏Γ ⊇ Q_B!)<\/td><\/tr>\n  <\/table>\n\n  <div class=\"note\">‏<span class=\"math\">Γ<\/span> חופשי לגמרי: סמלי ספירה, אותיות מסומנות, ואפילו שמות\n    מצבים — הטריק של 2023ב ש1.4 שבו ה-PDA \"שומר\" את מצב ה-DFA במחסנית בזמן שהוא מריץ תת-שגרה.\n    להרחיב את Γ זו הדרך האלגנטית להעביר מידע על פני זמן.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t4\">אי־דטרמיניזם ב־PDA הוא מהותי<\/h2>\n\n  <div class=\"thm\">בניגוד לאוטומטים סופיים — כאן אי-הדטרמיניזם <b>מוסיף כוח<\/b>:\n    קיימות שפות ח\"ה שאף PDA דטרמיניסטי לא מזהה. הדוגמה הקלאסית:\n    ‏<span class=\"math\">PAL = {w | w = w<sup>R<\/sup>}<\/span> — חייבים <b>לנחש<\/b> את האמצע.<\/div>\n\n  <p>לכן בקורס \"PDA\" הוא תמיד אי-דטרמיניסטי, והמשפט המרכזי (פרק 8) מדבר על\n    PDA ⟺ CFG. תובנה חשובה לשאלות נכון\/לא נכון: \"לכל PDA קיים PDA דטרמיניסטי שקול\" — <b>לא נכון<\/b>.<\/p>\n\n  <div class=\"note\">זה גם מסביר למה אין \"מכפלת PDA\" לחיתוך ולמה אין היפוך-מקבלים למשלים:\n    הטכניקות הדטרמיניסטיות של פרק 2 לא שורדות את המעבר למחסנית — בדיוק הפעולות שח\"ה\n    לא סגורה להן (פרק 6, t10).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t5\">PDA ← CFG — הבנייה<\/h2>\n\n  <div class=\"algo\">\n    <h4>הבנייה מדף הנוסחאות (שלושה מצבים)<\/h4>\n    <p>בהינתן <span class=\"math\">G = (V, Σ, S, R)<\/span> בונים PDA עם\n      <span class=\"math\">q<sub>start<\/sub> → q<sub>loop<\/sub> → q<sub>accept<\/sub><\/span>:<\/p>\n    <ul>\n      <li>בכניסה: ‏<span class=\"math\">ε, ε → S$<\/span> (דוחפים את משתנה ההתחלה מעל סמל תחתית).<\/li>\n      <li>ב-<span class=\"math\">q<sub>loop<\/sub><\/span>, לכל כלל <span class=\"math\">A → α<\/span>:\n        מעבר <span class=\"math\">ε, A → α<\/span> — מחליפים משתנה בראש המחסנית בצד ימין של כלל\n        (נדחף הפוך, כך שהסמל השמאלי של α בראש).<\/li>\n      <li>לכל <span class=\"math\">a ∈ Σ<\/span>: מעבר <span class=\"math\">a, a → ε<\/span> —\n        טרמינל בראש המחסנית \"מסומן\" מול אות הקלט.<\/li>\n      <li>‏<span class=\"math\">ε, $ → ε<\/span> אל <span class=\"math\">q<sub>accept<\/sub><\/span>.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>הרעיון: ה-PDA מבצע <b>גזירה שמאלית<\/b> על המחסנית — המשתנה השמאלי ביותר תמיד בראש,\n    ואי-הדטרמיניזם מנחש איזה כלל להפעיל. הקלט מאמת את הטרמינלים שנחשפים.<\/p>\n\n  <div class=\"note\">כיוון אחד של משפט השקילות CFG ⟺ PDA — קצר ובונה. הכיוון השני\n    (PDA → CFG, עם <span class=\"math\">A<sub>p,q<\/sub><\/span>) מחכה בפרק 8 והוא המסובך מהשניים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t6\">דקדוק מפושט — הסרת כללי ε<\/h2>\n\n  <div class=\"def\"><span class=\"term\">דקדוק מפושט<\/span> — ללא כללי <span class=\"math\">ε<\/span>\n    (מהצורה <span class=\"math\">A → ε<\/span>; מותר רק <span class=\"math\">S → ε<\/span>)\n    וללא כללי יחידה (<span class=\"math\">A → B<\/span>).<\/div>\n\n  <div class=\"algo\">\n    <h4>הסרת כללי ε (מדף הנוסחאות)<\/h4>\n    <ol>\n      <li>בוחרים כלל <span class=\"math\">A → ε<\/span> (עם <span class=\"math\">A ≠ S<\/span>) ומוחקים אותו.<\/li>\n      <li>מפצים: לכל כלל שמכיל <span class=\"math\">A<\/span> בצד ימין, מוסיפים עותקים עם המופע מושמט —\n        <b>לכל תת-קבוצה של מופעים<\/b>: מ-<span class=\"math\">B → αAβAγ<\/span> נוצרים גם\n        <span class=\"math\">B → αβAγ<\/span>, גם <span class=\"math\">B → αAβγ<\/span> וגם\n        <span class=\"math\">B → αβγ<\/span>.<\/li>\n      <li>עבור <span class=\"math\">B → A<\/span> מוסיפים <span class=\"math\">B → ε<\/span>\n        (אלא אם כבר הוסר — לא מחזירים מתים!).<\/li>\n      <li>חוזרים עד שאין כללי <span class=\"math\">ε<\/span>.<\/li>\n    <\/ol>\n    <p class=\"small\"><b>אם <span class=\"math\">ε ∈ L<\/span>:<\/b> מריצים את התהליך ואז מוסיפים התחלה חדשה\n      עם <span class=\"math\">S′ → S | ε<\/span> — כך ה-ε היחיד יושב בהתחלה שאינה מופיעה בשום צד ימין.<\/p>\n  <\/div>\n\n  <div class=\"warn\">שתי הטעויות הקבועות: לשכוח את עותקי-הביניים (רק \"הכול או כלום\" במקום כל\n    תת-קבוצה), ולהחזיר כלל ε שכבר טופל (זה מכניס את האלגוריתם ללולאה אינסופית).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t7\">הסרת כללי יחידה<\/h2>\n\n  <div class=\"algo\">\n    <h4>ההליך<\/h4>\n    <ol>\n      <li>בוחרים כלל יחידה <span class=\"math\">A → B<\/span> ומוחקים אותו.<\/li>\n      <li>לכל כלל <span class=\"math\">B → α<\/span> מוסיפים <span class=\"math\">A → α<\/span>\n        (\"‏A מאמץ את כללי B\").<\/li>\n      <li>חוזרים עד שאין כללי יחידה. (שרשראות <span class=\"math\">A→B→C<\/span> מטופלות מעצמן —\n        האימוץ יוצר <span class=\"math\">A→C<\/span> שהוא כלל יחידה חדש שיוסר בתורו.)<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>למה מסירים אותם? כללי יחידה לא מוסיפים כוח (רק \"שינוי שם\") אבל מסבכים ניתוחים —\n    ובדרך ל-CNF הם חייבים ללכת. סדר נכון: קודם ε, אחר-כך יחידה\n    (הסרת ε עלולה לייצר כללי יחידה חדשים, כמו <span class=\"math\">B → A<\/span> שנותר אחרי השמטת השני).<\/p>\n\n  <div class=\"ex-box\">\n    <h4>מיני-דוגמה<\/h4>\n    <div class=\"gram\">\n      <div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span>b | <span class=\"nt\">A<\/span><\/div>\n      <div class=\"rule\"><span class=\"nt\">A<\/span> → a | ε<\/div>\n    <\/div>\n    <p>הסרת <span class=\"math\">A → ε<\/span>: נוספים <span class=\"math\">S → b<\/span> ו-<span class=\"math\">S → ε<\/span>\n      (מהכלל <span class=\"math\">S → A<\/span>)… אבל <span class=\"math\">ε∈L<\/span>, אז עוברים דרך\n      <span class=\"math\">S′<\/span>. אחר-כך <span class=\"math\">S → A<\/span> מוסר עם אימוץ\n      <span class=\"math\">S → a<\/span>. תוצאה: ‏<span class=\"math\">S′ → S | ε, S → Ab | b | a, A → a<\/span>.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t8\">צורת חומסקי הנורמלית (CNF)<\/h2>\n\n  <div class=\"def\"><span class=\"term\">CNF<\/span> — כל כלל הוא מאחת משתי הצורות:\n    <div class=\"gram\"><div class=\"rule\"><span class=\"nt\">A<\/span> → <span class=\"nt\">B<\/span><span class=\"nt\">C<\/span><\/div>\n    <div class=\"rule\"><span class=\"nt\">A<\/span> → σ<\/div><\/div>\n    עם <span class=\"math\">B, C ≠ S<\/span>; ואם <span class=\"math\">ε ∈ L<\/span> מותר גם\n    <span class=\"math\">S → ε<\/span>.<\/div>\n\n  <div class=\"algo\">\n    <h4>‏CFG → CNF (סדר הצעדים מדף הנוסחאות)<\/h4>\n    <ol>\n      <li>התחלה חדשה: <span class=\"math\">S′ → S<\/span> (מגן על ההתחלה מהופעה בצד ימין).<\/li>\n      <li>הסרת כללי <span class=\"math\">ε<\/span>.<\/li>\n      <li>הסרת כללי יחידה.<\/li>\n      <li>נרמול הכללים הארוכים: טרמינל בכלל ארוך מוחלף במשתנה\n        (<span class=\"math\">A<sub>σ<\/sub> → σ<\/span>); כלל <span class=\"math\">A → B₁B₂…B<sub>n<\/sub><\/span>\n        עם <span class=\"math\">n &gt; 2<\/span> מפוצל בשרשרת:\n        <span class=\"math\">A → B₁C₁, C₁ → B₂C₂, …<\/span><\/li>\n    <\/ol>\n  <\/div>\n\n  <p>למה CNF שווה את הטרחה? עצי גזירה נעשים <b>בינאריים<\/b> — גזירת מילה באורך\n    <span class=\"math\">n<\/span> אורכת בדיוק <span class=\"math\">2n−1<\/span> צעדים, גובה העץ לוגריתמי\n    לכל הפחות — ומכאן נגזרות למת הניפוח לח\"ה (פרק 8) ואלגוריתמי הכרעה על דקדוקים.<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch7-t9\">היררכיית חומסקי — התמונה המלאה<\/h2>\n\n  <div class=\"hier\">\n    <div class=\"ring\"><span class=\"hlbl\">RE — ניתנות לזיהוי (מכונות טיורינג)<\/span>\n      <div class=\"ring\"><span class=\"hlbl\">R — כריעות<\/span>\n        <div class=\"ring\"><span class=\"hlbl\">CFL — חסרות הקשר (PDA \/ CFG)<\/span>\n          <div class=\"ring\"><span class=\"hlbl\">REG — רגולריות (DFA \/ NFA \/ Regex)<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <p>כל ההכלות ממש, והעדים שכדאי לזכור בעל-פה:<\/p>\n  <ul>\n    <li><span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>} ∈ CFL ∖ REG<\/span><\/li>\n    <li><span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>} ∈ R ∖ CFL<\/span> (מ\"ט סופרת בקלות — פרק 9)<\/li>\n    <li><span class=\"math\">A<sub>TM<\/sub> ∈ RE ∖ R<\/span> (פרקים 11–13)<\/li>\n    <li>ומעל הכול: שפות שאינן אפילו ב-RE (‏<span class=\"comp\">A<sub>TM<\/sub><\/span>).<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> ‏PDA = NFA + מחסנית, עם אי-דטרמיניזם מהותי; ‏CFG → PDA בבנייה\n    ישירה; והפישוטים (ε, יחידה, CNF) הם הדרך מהדקדוק החופשי לצורה שאפשר לנתח.\n    ההיררכיה שציירנו היא המפה שכל שאר הקורס ימלא בתוכן.<\/div>\n<\/section>\n"},{"sid":"ch8","group":"פרקים","title":"פרק 8 — PDA ⇄ CFG ולמת הניפוח לח\"ה","topics":["PDA מפושט","השפות L_{p,q} — הרעיון","CFG ← PDA — המשתנים A_{p,q} והכללים","משפט השקילות ומסקנותיו","למת הניפוח לח\"ה — הנוסח","מאיפה הלמה — משתנה חוזר בעץ גבוה","מבנה הוכחת ניפוח לח\"ה — המקרים","הוכחה מלאה: {aⁿbⁿcⁿ}","סגירויות בשירות אי־ח\"ה","מפת ההכרעה: רגולרית \/ ח\"ה \/ אף אחת"],"html":"<h1>‏PDA ⇄ CFG ולמת הניפוח לח\"ה<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 8 (הרצאה 8 + תרגול 8)<\/p>\n\n<section>\n  <h2 id=\"ch8-t0\">PDA מפושט<\/h2>\n\n  <div class=\"def\"><span class=\"term\">PDA מפושט (Simplified)<\/span> — ‏PDA שמקיים שלושה תנאים:\n    <ul>\n      <li>מצב מקבל <b>יחיד<\/b> <span class=\"math\">q<sub>f<\/sub><\/span>.<\/li>\n      <li>לפני קבלה המחסנית חייבת להיות <b>ריקה<\/b>.<\/li>\n      <li>כל מעבר או מוציא סמל (pop) או מכניס סמל (push) — <b>לא שניהם ולא אף אחד<\/b>.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>למה הצורה הזו? היא הופכת כל ריצה לרצף מאוזן של push-ים ו-pop-ים — כמו סוגריים מאוזנים —\n    וזה בדיוק המבנה שהבנייה של הכיוון הקשה (PDA → CFG) יודעת לתרגם לדקדוק.<\/p>\n\n  <div class=\"note\">כל PDA ניתן להמרה למפושט שקול: מוסיפים סמל תחתית ומרוקנים לפני קבלה, מאחדים\n    מקבלים עם מעברי ε, ומפצלים מעבר שגם קורא-וגם-דוחף לשני צעדים דרך מצב ביניים.\n    במבחן מותר להניח את זה — ההמרה טכנית.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t1\">השפות L_{p,q} — הרעיון<\/h2>\n\n  <div class=\"def\">בהינתן PDA מפושט <span class=\"math\">P<\/span>, לכל זוג מצבים\n    <span class=\"math\">p, q<\/span> מגדירים:\n    <div class=\"lang-def\">L<sub>p,q<\/sub> = {w | ריצה על w מ-p עם מחסנית ריקה מסתיימת ב-q עם מחסנית ריקה}<\/div>\n    ומתקיים <span class=\"math\">L(P) = L<sub>q_s,q_f<\/sub><\/span> (זו בדיוק הגדרת הקבלה של מפושט).<\/div>\n\n  <p>זהו המקביל המחסניתי של <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> מהעולם הרגולרי —\n    אבל עם דרישת \"ריק אל ריק\", שהיא המפתח: ריצה כזו היא <b>יחידה מאוזנת<\/b> שאפשר לפרק רקורסיבית.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>שני אופני הפירוק של ריצה מאוזנת<\/h4>\n    <ul>\n      <li><b>המחסנית מתרוקנת באמצע<\/b> — במצב ביניים <span class=\"math\">r<\/span>: הריצה היא\n        שרשור של שתי ריצות מאוזנות: ‏<span class=\"math\">L<sub>p,r<\/sub> · L<sub>r,q<\/sub><\/span>.<\/li>\n      <li><b>המחסנית לא מתרוקנת באמצע<\/b> — אז הסמל שנדחף בצעד הראשון יורד רק בצעד האחרון:\n        הריצה היא push, ריצה מאוזנת פנימית, pop — עטיפה.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t2\">CFG ← PDA — המשתנים A_{p,q} והכללים<\/h2>\n\n  <div class=\"algo\">\n    <h4>הבנייה מדף הנוסחאות<\/h4>\n    <p>משתנה <span class=\"math\">A<sub>p,q<\/sub><\/span> לכל זוג מצבים (\"ייצור כל מילות\n      <span class=\"math\">L<sub>p,q<\/sub><\/span>\"), התחלה <span class=\"math\">S = A<sub>q_s,q_f<\/sub><\/span>, וכללים:<\/p>\n    <ul>\n      <li><b>(a) פיצול:<\/b> לכל <span class=\"math\">p,q,r<\/span>: ‏\n        <span class=\"math\">A<sub>p,q<\/sub> → A<sub>p,r<\/sub>A<sub>r,q<\/sub><\/span> — התרוקנות באמצע.<\/li>\n      <li><b>(b) בסיס:<\/b> לכל <span class=\"math\">p<\/span>: ‏<span class=\"math\">A<sub>p,p<\/sub> → ε<\/span> —\n        ריצה ריקה.<\/li>\n      <li><b>(c) עטיפה:<\/b> לכל <span class=\"math\">p,q,r,s<\/span>, ‏<span class=\"math\">γ ∈ Γ<\/span>,\n        ‏<span class=\"math\">σ′,σ″ ∈ Σ<sub>ε<\/sub><\/span> כך ש-<span class=\"math\">(r, γ) ∈ δ(p, σ′, ε)<\/span>\n        (‏push) ו-<span class=\"math\">(q, ε) ∈ δ(s, σ″, γ)<\/span> (‏pop):\n        ‏<span class=\"math\">A<sub>p,q<\/sub> → σ′A<sub>r,s<\/sub>σ″<\/span> —\n        האות הראשונה דוחפת את γ, האחרונה מוציאה אותו, ובאמצע ריצה מאוזנת.<\/li>\n    <\/ul>\n  <\/div>\n\n  <div class=\"note\">הבנייה נראית מפחידה אבל היא בדיוק שני אופני הפירוק מהנושא הקודם, ככללי דקדוק.\n    במבחן צריך לדעת <b>לצטט ולהסביר<\/b> אותה (היא בדף הנוסחאות) — לא לבצע אותה על אוטומט גדול:\n    מספר המשתנים <span class=\"math\">|Q|²<\/span> מתפוצץ מהר.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t3\">משפט השקילות ומסקנותיו<\/h2>\n\n  <div class=\"thm\">שפה היא חסרת הקשר <b>אם ורק אם<\/b> קיים PDA שמזהה אותה.\n    (‏CFG → PDA: פרק 7; ‏PDA → CFG: הבנייה שלמעלה.)<\/div>\n\n  <p>מה זה קונה לנו בפועל:<\/p>\n  <ul>\n    <li><b>חופש בחירה בשאלות:<\/b> \"הוכיחו ח\"ה\" = או דקדוק או PDA — מה שנוח.\n      ‏2024א ש1.3 פורסם עם שני הפתרונות זה-לצד-זה.<\/li>\n    <li><b>חיתוך ח\"ה עם רגולרית:<\/b> מריצים PDA ו-DFA במקביל (מכפלת מצבים, המחסנית של ה-PDA בלבד) —\n      התוצאה PDA. הסגירות שכל שאלה שנייה משתמשת בה!<\/li>\n    <li><b>סגירויות דרך הצד הנוח:<\/b> איחוד\/שרשור\/כוכב — קלים בדקדוק; חיתוך-עם-רגולרית —\n      קל ב-PDA. המשפט מרשה לקפוץ בין הייצוגים באמצע הוכחה.<\/li>\n  <\/ul>\n\n  <div class=\"warn\">שימו לב לאסימטריה: מכפלת PDA×DFA עובדת כי יש <b>מחסנית אחת<\/b>.\n    מכפלת PDA×PDA הייתה דורשת שתי מחסניות — וזה כבר כוח של מכונת טיורינג. לכן חיתוך שתי ח\"ה\n    נופל (ראו t7).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t4\">למת הניפוח לח\"ה — הנוסח<\/h2>\n\n  <div class=\"thm\">\n    אם <span class=\"math\">L<\/span> חסרת הקשר, אז קיים <span class=\"math\">p ∈ ℕ<\/span> כך שלכל\n    <span class=\"math\">w ∈ L<\/span> עם <span class=\"math\">|w| ≥ p<\/span> קיימת חלוקה\n    <b>לחמישה<\/b> חלקים <span class=\"math\">w = uvxyz<\/span> המקיימת:\n    <ol>\n      <li><span class=\"math\">|vy| &gt; 0<\/span> — שני החלקים הנשאבים לא שניהם ריקים.<\/li>\n      <li><span class=\"math\">|vxy| ≤ p<\/span> — החלון הנשאב קצר.<\/li>\n      <li>לכל <span class=\"math\">i ≥ 0<\/span>: ‏<span class=\"math\">uv<sup>i<\/sup>xy<sup>i<\/sup>z ∈ L<\/span> —\n        ‏<span class=\"math\">v<\/span> ו-<span class=\"math\">y<\/span> נשאבים <b>יחד, באותו מספר עותקים<\/b>.<\/li>\n    <\/ol>\n  <\/div>\n\n  <p>ההבדלים מהגרסה הרגולרית: שואבים <b>שני<\/b> חלקים מתואמים (משני צידי <span class=\"math\">x<\/span>),\n    והחלון <span class=\"math\">|vxy| ≤ p<\/span> יכול לשבת <b>בכל מקום<\/b> במילה — לא בהכרח בהתחלה!\n    והערת האורך: ‏<span class=\"math\">|uv<sup>i<\/sup>xy<sup>i<\/sup>z| = |w| + (i−1)(|v|+|y|)<\/span>.<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t5\">מאיפה הלמה — משתנה חוזר בעץ גבוה<\/h2>\n\n  <div class=\"proof\">\n    ניקח דקדוק (נוח: CNF) לשפה. מילה ארוכה מספיק ⇒ עץ הגזירה גבוה ⇒ קיים <b>מסלול שורש-עלה<\/b>\n    שעליו משתנה <span class=\"math\">A<\/span> מופיע פעמיים. נסמן את שני המופעים: החיצוני גוזר\n    <span class=\"math\">vxy<\/span>, הפנימי גוזר <span class=\"math\">x<\/span>. עכשיו אפשר:\n    <b>לשכפל<\/b> — להדביק את תת-העץ החיצוני במקום הפנימי (מקבלים <span class=\"math\">uv²xy²z<\/span>),\n    או <b>לקצץ<\/b> — להדביק את הפנימי במקום החיצוני (מקבלים <span class=\"math\">uxz<\/span>).\n    התיאום בין <span class=\"math\">v<\/span> ל-<span class=\"math\">y<\/span> נובע מכך ששניהם באים\n    מאותו עותק של <span class=\"math\">A<\/span>. <span class=\"qed\">∎<\/span>\n  <\/div>\n\n  <p>מכאן גם התנאים: ‏<span class=\"math\">|vy| &gt; 0<\/span> — בוחרים מופעים שתורמים משהו\n    (ב-CNF תמיד אפשר); ‏<span class=\"math\">|vxy| ≤ p<\/span> — בוחרים את החזרה הנמוכה בעץ,\n    בתחתית שבה תת-העץ קטן.<\/p>\n\n  <div class=\"note\">האנלוגיה: ברגולרית — מצב חוזר בריצה; בח\"ה — משתנה חוזר במסלול בעץ.\n    אותו שובך יונים, מבנה עשיר יותר.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t6\">מבנה הוכחת ניפוח לח\"ה — המקרים<\/h2>\n\n  <p>המשחק זהה לפרק 5 (אנחנו: מילה ו-<span class=\"math\">i<\/span>; היריב: החלוקה) — אבל מיצוי\n    החלוקות מפורט יותר, כי <span class=\"math\">v<\/span> ו-<span class=\"math\">y<\/span> יכולים לשבת\n    בכל מקום. התבנית הרשמית (כך כתובים הפתרונות של 2023א ש1.4 ומבחן-לדוגמה ש1ד):<\/p>\n\n  <div class=\"algo\">\n    <h4>פירוק סטנדרטי למקרים<\/h4>\n    <ol>\n      <li><b>‏vy הומוגני<\/b> — שניהם מאות אחת (אולי מבלוקים שונים): השאיבה משנה בלוק אחד\/שניים\n        ומפרה את האיזון מול בלוק שלישי שלא נגעו בו.<\/li>\n      <li><b>‏vy הטרוגני<\/b> — ‏<span class=\"math\">v<\/span> או <span class=\"math\">y<\/span> חוצה גבול\n        בלוקים, או ששניהם מבלוקים שונים: בזכות <span class=\"math\">|vxy| ≤ p<\/span> מדובר בשני\n        בלוקים <b>סמוכים<\/b> לכל היותר — והשאיבה מקלקלת סדר או איזון מול הבלוקים הרחוקים.<\/li>\n      <li><b>סימנים מיוחדים (#):<\/b> אם <span class=\"math\">v<\/span> או <span class=\"math\">y<\/span>\n        מכילים את הסימן — שכפול נותן שני סימנים ⇒ מחוץ לשפה מיד (ההערה הרשמית ב-2023א ש1.4).<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"warn\">הטעות הגדולה בגרסת הח\"ה: לשכוח ש-<span class=\"math\">v<\/span> חוצה-גבול הוא מקרה\n    לגיטימי (למשל <span class=\"math\">v = ab<\/span>) — שכפולו מייצר סדר מקולקל\n    (‏<span class=\"math\">abab<\/span>) שלפעמים כבר מפיל את המילה מחוץ לצורה. לכסות, לא להתעלם.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t7\">הוכחה מלאה: {aⁿbⁿcⁿ}<\/h2>\n\n  <div class=\"ex-box\">\n    <h4>העד הקלאסי ל-R ∖ CFL<\/h4>\n    <p>נניח בשלילה ש-<span class=\"math\">L = {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>}<\/span> ח\"ה,\n      ויהי <span class=\"math\">p<\/span> קבוע הניפוח. נבחר\n      <span class=\"math\">w = a<sup>p<\/sup>b<sup>p<\/sup>c<sup>p<\/sup> ∈ L<\/span>,\n      ‏<span class=\"math\">|w| ≥ p<\/span>. תהי <span class=\"math\">w = uvxyz<\/span> חלוקה חוקית.<\/p>\n    <p><b>מקרה 1 — ‏vy הומוגני:<\/b> השאיבה (למשל <span class=\"math\">i=2<\/span>) מגדילה בלוק אחד\n      או שניים, אבל בזכות <span class=\"math\">|vxy| ≤ p<\/span> אי אפשר לגעת בכל שלושת הבלוקים —\n      נשאר בלוק שלא גדל ⇒ האיזון המשולש נשבר ⇒ ‏<span class=\"math\">uv²xy²z ∉ L<\/span>.<\/p>\n    <p><b>מקרה 2 — ‏v או y הטרוגני:<\/b> שכפול מייצר ערבוב סדר (כמו <span class=\"math\">…ab…ab…<\/span>)\n      — המילה כבר לא מהצורה <span class=\"math\">a<sup>*<\/sup>b<sup>*<\/sup>c<sup>*<\/sup><\/span> ⇒ מחוץ לשפה.<\/p>\n    <p>בכל המקרים סתירה לתנאי 3 — ‏<span class=\"math\">L<\/span> איננה חסרת הקשר. <span class=\"qed\">∎<\/span><\/p>\n  <\/div>\n\n  <div class=\"note\">אותו שלד בדיוק שירת את 2023א ש1.4 (‏<span class=\"math\">b<sup>n<\/sup>a<sup>n<\/sup>#b<sup>n<\/sup><\/span>)\n    ואת מבחן-לדוגמה ש1ד (‏<span class=\"math\">0<sup>p<\/sup>1<sup>p<\/sup>1<sup>p<\/sup>0<sup>p<\/sup><\/span>).\n    שלושת בלוקי-התלות ± סימן # — תבנית שחוזרת כמעט מילה במילה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t8\">סגירויות בשירות אי־ח\"ה<\/h2>\n\n  <p>כמו בפרק 5 — כשלא נדרש ניפוח מפורש, הדרך העקיפה מהירה. הכלים הסגורים בח\"ה:\n    איחוד, שרשור, כוכב, היפוך, <b>הצבה רגולרית<\/b>, <b>חיתוך עם רגולרית<\/b>.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>התבנית סמן-חתוך-מחק (2023א ש3.4, 2023ב ש3.3)<\/h4>\n    <p>להוכיח ש-<span class=\"math\">{a<sup>2n²<\/sup>}<\/span> לא ח\"ה בעזרת\n      <span class=\"math\">{a<sup>n²<\/sup>}<\/span>:<\/p>\n    <ol>\n      <li><b>סמן:<\/b> הצבה <span class=\"math\">f(a) = {a, a′}<\/span> — ‏<span class=\"math\">f(L)<\/span> ח\"ה.<\/li>\n      <li><b>חתוך:<\/b> ‏<span class=\"math\">∩ L((aa′)<sup>*<\/sup>)<\/span> — כופה סירוג מדויק;\n        עדיין ח\"ה (חיתוך עם רגולרית). נשארו בדיוק חצי מהאותיות מסומנות.<\/li>\n      <li><b>מחק:<\/b> הצבה <span class=\"math\">g(a)={a}, g(a′)={ε}<\/span> — מוחקת את המסומנות;\n        מתקבלת <span class=\"math\">{a<sup>n²<\/sup>}<\/span> הידועה כלא-ח\"ה ⇒ סתירה.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"warn\">אסור בדרך העקיפה: משלים, חיתוך שתי ח\"ה, הפרש — אלה לא סגורים בח\"ה!\n    שרשרת שמשתמשת באחד מהם — פסולה. בדקו כל צעד מול טבלת הסגירויות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch8-t9\">מפת ההכרעה: רגולרית \/ ח\"ה \/ אף אחת<\/h2>\n\n  <p>הצ'ק-ליסט למאגר השפות (ולשאלה 3 של המבחן) — שואלים לפי הסדר:<\/p>\n\n  <ol class=\"pump-steps\">\n    <li data-who=\"שלב 1\"><b>האם יש מלכודת קריסה?<\/b> משתנה חופשי שבולע הכול\n      (‏<span class=\"math\">u ∈ Σ<sup>*<\/sup><\/span>, ‏<span class=\"math\">w=ε<\/span> מותר), זהות אלגברית\n      (‏<span class=\"math\">(ab)<sup>k<\/sup>a=a(ba)<sup>k<\/sup><\/span>), חסם שסוגר לסופיות, תנאי ריק —\n      אם כן: כנראה <b>רגולרית<\/b>.<\/li>\n    <li data-who=\"שלב 2\"><b>כמה השוואות לא-חסומות נדרשות, ובאיזה סדר?<\/b> השוואה אחת\n      (או כמה שמסתדרות בסדר מחסנית — קינון\/היפוך): <b>ח\"ה<\/b>. ‏<span class=\"math\">v<sup>R<\/sup><\/span>\n      במקום <span class=\"math\">v<\/span> = ידידותי למחסנית!<\/li>\n    <li data-who=\"שלב 3\"><b>התאמה באותו סדר \/ שתי השוואות \/ מכפלות?<\/b> ‏<span class=\"math\">{ww}<\/span>-דמויות,\n      ‏<span class=\"math\">u#u<\/span>, ‏<span class=\"math\">min\/max<\/span> משני צדדים,\n      ‏<span class=\"math\">j = i·k<\/span> — <b>אף אחת<\/b> (לא ח\"ה).<\/li>\n  <\/ol>\n\n  <table>\n    <tr><th>אות מזהה<\/th><th>נטייה<\/th><\/tr>\n    <tr><td>היפוך (<span class=\"math\">v<sup>R<\/sup><\/span>) מול המקור<\/td><td>ח\"ה (מחסנית אוהבת היפוך)<\/td><\/tr>\n    <tr><td>העתק ישר (<span class=\"math\">ww<\/span>, ‏<span class=\"math\">u#u<\/span>)<\/td><td>אף אחת<\/td><\/tr>\n    <tr><td>אי-שוויון יחיד \/ \"או\"<\/td><td>ח\"ה (איחוד מקרים)<\/td><\/tr>\n    <tr><td>\"וגם\" של שתי השוואות<\/td><td>אף אחת<\/td><\/tr>\n    <tr><td>הכול-בולע \/ חסום \/ סופי<\/td><td>רגולרית<\/td><\/tr>\n  <\/table>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> ‏PDA ⟺ CFG דרך <span class=\"math\">A<sub>p,q<\/sub><\/span>;\n    הלמה החדשה שואבת זוג מתואם בחלון נודד; מבנה המקרים הומוגני\/הטרוגני הוא הפורמט הרשמי;\n    ומפת ההכרעה בת שלושת השלבים היא הדרך המהירה דרך 101 שפות המאגר.<\/div>\n<\/section>\n"},{"sid":"ch9","group":"פרקים","title":"פרק 9 — מכונות טיורינג","topics":["מכונת טיורינג — ההגדרה הפורמלית","הסרט, הראש והצעד הבודד","קונפיגורציות והיחס ⊢","קבלה, דחייה, לולאה — שלוש התוצאות","R ו־RE — כריעה מול ניתנת לזיהוי","דוגמה מפורטת: מכריע לפלינדרומים","טבלת מעברים — רמת המכונה","תיאורי high-level — מה מותר במבחן","קידודים: ⟨M⟩ ו־⟨M,w⟩","תזת צ'רץ'–טיורינג"],"html":"<h1>מכונות טיורינג<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 9 (הרצאה 9 + תרגול 9)<\/p>\n\n<section>\n  <h2 id=\"ch9-t0\">מכונת טיורינג — ההגדרה הפורמלית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">מכונת טיורינג (TM)<\/span> — שביעייה\n    <span class=\"math\">M = (Q, Σ, Γ, δ, q<sub>s<\/sub>, q<sub>acc<\/sub>, q<sub>rej<\/sub>)<\/span>:\n    <ul>\n      <li><span class=\"math\">Q<\/span> — קבוצת מצבים סופית.<\/li>\n      <li><span class=\"math\">Σ<\/span> — אלף-בית הקלט; תו הרווח <span class=\"math\">␣ ∉ Σ<\/span>.<\/li>\n      <li><span class=\"math\">Γ<\/span> — אלף-בית הסרט; ‏<span class=\"math\">␣ ∈ Γ<\/span> וגם\n        <span class=\"math\">Σ ⊆ Γ<\/span> (מותר להוסיף סימני עבודה: X, נקודות, סמנים).<\/li>\n      <li><span class=\"math\">δ: Q × Γ → Q × Γ × {L, R}<\/span> — בכל צעד: קרא, כתוב, זוז.<\/li>\n      <li><span class=\"math\">q<sub>s<\/sub><\/span> התחלתי, <span class=\"math\">q<sub>acc<\/sub><\/span> מקבל,\n        <span class=\"math\">q<sub>rej<\/sub><\/span> דוחה — שני האחרונים <b>עוצרים מיד<\/b>.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>שני הבדלים מהותיים מהמודלים הקודמים: הסרט <b>אינסופי<\/b> (ימינה) וניתן <b>לכתיבה<\/b>,\n    והראש נע <b>לשני הכיוונים<\/b>. הקלט הוא נקודת פתיחה על הסרט — לא זרם חד-פעמי.<\/p>\n\n  <div class=\"note\">בקורס שלנו ההגדרה הבסיסית <b>דטרמיניסטית<\/b> (δ פונקציה). קבלה\/דחייה הן מצבים\n    מיוחדים ולא קבוצת F — המכונה מכריזה את תשובתה ברגע שהגיעה אליהם.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t1\">הסרט, הראש והצעד הבודד<\/h2>\n\n  <p>תמונת הפתיחה: הקלט <span class=\"math\">w<\/span> כתוב בתחילת הסרט, שאר הסרט רווחים\n    (<span class=\"math\">␣<\/span>), הראש על התא השמאלי ביותר, והמצב <span class=\"math\">q<sub>s<\/sub><\/span>:<\/p>\n\n  <div class=\"tape\">\n    <div class=\"cell head\">1<\/div><div class=\"cell\">0<\/div><div class=\"cell\">1<\/div><div class=\"cell\">1<\/div>\n    <div class=\"cell blank\">␣<\/div><div class=\"cell blank\">␣<\/div><div class=\"cell blank\">…<\/div>\n  <\/div>\n\n  <p>צעד יחיד <span class=\"math\">δ(q, γ) = (q′, γ′, D)<\/span>: במצב <span class=\"math\">q<\/span>\n    כשהראש קורא <span class=\"math\">γ<\/span> — כותבים <span class=\"math\">γ′<\/span> בתא (אולי אותו תו),\n    עוברים למצב <span class=\"math\">q′<\/span>, וזזים תא אחד ימינה (<span class=\"math\">R<\/span>) או שמאלה\n    (<span class=\"math\">L<\/span>). ניסיון לזוז שמאלה מהתא הראשון — נשארים במקום (מוסכמת הקורס).<\/p>\n\n  <div class=\"note\">היכולת <b>לכתוב<\/b> היא ההבדל שמייצר את כל הכוח: אפשר לסמן אותיות שטופלו\n    (‏<span class=\"math\">a → X<\/span>), להשאיר פתקים, ולחזור אליהם. מחיקה = כתיבת <span class=\"math\">␣<\/span>.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t2\">קונפיגורציות והיחס ⊢<\/h2>\n\n  <div class=\"def\"><span class=\"term\">קונפיגורציה<\/span> — צילום מצב מלא של החישוב, בכתיב\n    <span class=\"math\">uqv<\/span>: תוכן הסרט משמאל לראש הוא <span class=\"math\">u<\/span>, המצב\n    <span class=\"math\">q<\/span>, והראש קורא את התו הראשון של <span class=\"math\">v<\/span>.\n    ‏<span class=\"term\">‏C₁ ⊢ C₂<\/span> — קונפיגורציה <span class=\"math\">C₂<\/span> מתקבלת מ-<span class=\"math\">C₁<\/span>\n    בצעד אחד; ‏<span class=\"math\">⊢<sup>*<\/sup><\/span> — במספר סופי של צעדים.<\/div>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה<\/h4>\n    <div class=\"config-line\">q_s1011 ⊢ Xq₁011 ⊢ X0q₁11 ⊢ …<\/div>\n    <p>הקונפיגורציה ההתחלתית על <span class=\"math\">w<\/span> היא <span class=\"math\">q<sub>s<\/sub>w<\/span>;\n      קבלה = הגעה לקונפיגורציה שמכילה את <span class=\"math\">q<sub>acc<\/sub><\/span>.<\/p>\n  <\/div>\n\n  <p>הכתיב הזה הופך את \"ריצת מכונה\" לאובייקט מתמטי מדויק — סדרת קונפיגורציות\n    <span class=\"math\">C₀ ⊢ C₁ ⊢ C₂ ⊢ …<\/span> — שעליו קל לנסח טענות (ובהמשך: לקודד אותו כמילה!).<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t3\">קבלה, דחייה, לולאה — שלוש התוצאות<\/h2>\n\n  <div class=\"def\">על קלט נתון, לריצה יש בדיוק אחת משלוש תוצאות:\n    <ul>\n      <li><b>מקבלת<\/b> — מגיעה ל-<span class=\"math\">q<sub>acc<\/sub><\/span> (ועוצרת).<\/li>\n      <li><b>דוחה<\/b> — מגיעה ל-<span class=\"math\">q<sub>rej<\/sub><\/span> (ועוצרת).<\/li>\n      <li><b>מתלולאת (loops)<\/b> — רצה לנצח ואינה עוצרת כלל.<\/li>\n    <\/ul>\n    ‏<span class=\"term\">שפת המכונה<\/span> — ‏<span class=\"math\">L(M) = {w | M מקבלת את w}<\/span>.\n    ‏<span class=\"term\">עוצרת (halts)<\/span> על <span class=\"math\">w<\/span> — מקבלת או דוחה.\n  <\/div>\n\n  <div class=\"warn\">האפשרות השלישית היא הדמות הראשית של סוף הקורס: מבחוץ, אי אפשר להבדיל בין\n    \"עוד רגע תעצור\" ל\"תרוץ לנצח\". דיוק לשוני חובה: \"‏M לא מקבלת את w\" כולל גם דחייה <b>וגם<\/b> לולאה —\n    ובשאלות R\/RE ההבדל בין \"לא מקבלת\" ל\"דוחה\" שווה את כל הנקודות (ראו N_{M,w} במבחני 2024!).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t4\">R ו־RE — כריעה מול ניתנת לזיהוי<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">מכריע (Decider)<\/span> — מכונה שעוצרת על <b>כל<\/b> קלט.\n    שפה <span class=\"math\">L ∈ <b>R<\/b><\/span> (<b>כריעה<\/b>) אם קיים מכריע עם\n    <span class=\"math\">L(M) = L<\/span>.<br>\n    <span class=\"term\">מזהה (Recognizer)<\/span> — מכונה כלשהי; ‏<span class=\"math\">L ∈ <b>RE<\/b><\/span>\n    (<b>ניתנת לזיהוי<\/b>) אם קיימת מכונה עם <span class=\"math\">L(M) = L<\/span> —\n    על מילים מחוץ לשפה מותר לה לדחות <b>או להתלולאת<\/b>.\n  <\/div>\n\n  <p>מיד מההגדרות: ‏<span class=\"math\">R ⊆ RE<\/span>. בהמשך נראה שההכלה ממש\n    (‏<span class=\"math\">A<sub>TM<\/sub><\/span>), ושיש גם מה שמעבר: ‏<span class=\"math\">coRE<\/span>\n    ומחלקות שאינן באף אחת (פרק 11).<\/p>\n\n  <div class=\"ex-box\">\n    <h4>אינטואיציה שימושית<\/h4>\n    <p>‏<span class=\"math\">R<\/span> = \"יש אלגוריתם שעונה תמיד כן\/לא\".\n      ‏<span class=\"math\">RE<\/span> = \"יש מבחן חד-צדדי: על כן — נדע מתישהו; על לא — אולי נחכה לנצח\".\n      החצי-כוח הזה הוא בדיוק מה שהמזהים בבניות המבחן (dovetailing, פרק 11) מנצלים.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t5\">דוגמה מפורטת: מכריע לפלינדרומים<\/h2>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">PAL = {w ∈ {a,b}<sup>*<\/sup> | w = w<sup>R<\/sup>}<\/span> — האלגוריתם מתרגול 9<\/h4>\n    <ol>\n      <li>אם הסרט ריק (או תו יחיד) — <b>קבל<\/b>.<\/li>\n      <li>זכור את התו הראשון במצב, מחק אותו (כתוב <span class=\"math\">␣<\/span>), וסע ימינה עד סוף המילה.<\/li>\n      <li>השווה את התו האחרון לתו הזכור: שונה — <b>דחה<\/b>; זהה — מחק גם אותו.<\/li>\n      <li>חזור שמאלה לתחילת המילה הנותרת, וחזור לשלב 1.<\/li>\n    <\/ol>\n    <p>כל סיבוב מוחק זוג קצוות; המילה מתקצרת ⇒ המכונה <b>עוצרת תמיד<\/b> — זהו מכריע,\n      ולכן <span class=\"math\">PAL ∈ R<\/span>. (זמן: ‏<span class=\"math\">O(n²)<\/span> תנועות — לא\n      שמעניין בקורס הזה, אבל נחמד לדעת.)<\/p>\n  <\/div>\n\n  <p>המבנה \"זכור-במצב, סמן-על-הסרט, סע-והשווה, חזור\" הוא התבנית של כמעט כל מכונה מפורשת:\n    כך גם <span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>}<\/span> (מחק אחד מכל בלוק בכל סיבוב)\n    ו-<span class=\"math\">{ww}<\/span> (מצא אמצע בסימון לסירוגין, ואז השווה חצאים).<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t6\">טבלת מעברים — רמת המכונה<\/h2>\n\n  <p>כשנדרש פירוט מלא (תרגול 9), כותבים את δ כטבלה. קטע מהמכונה של PAL —\n    \"זכרתי a, נוסע ימינה לסוף\":<\/p>\n\n  <table class=\"ttable\">\n    <tr><th>δ<\/th><th>a<\/th><th>b<\/th><th>␣<\/th><\/tr>\n    <tr><th>q<sub>a→<\/sub><\/th><td>(q<sub>a→<\/sub>, a, R)<\/td><td>(q<sub>a→<\/sub>, b, R)<\/td><td>(q<sub>a✓<\/sub>, ␣, L)<\/td><\/tr>\n    <tr><th>q<sub>a✓<\/sub><\/th><td>(q<sub>←<\/sub>, ␣, L)<\/td><td>(q<sub>rej<\/sub>, b, R)<\/td><td>(q<sub>acc<\/sub>, ␣, R)<\/td><\/tr>\n  <\/table>\n\n  <p>קונבנציות: שם המצב מקודד את \"מה אני זוכר ולאן אני נוסע\"\n    (<span class=\"math\">q<sub>a→<\/sub><\/span> = זוכר a, בדרך ימינה); תא של מצב עוצר לא ממשיכים למלא.<\/p>\n\n  <div class=\"note\">במבחן המודרני כמעט אף פעם לא תידרשו לטבלה מלאה — אבל להבין אותה חובה:\n    היא מה שמאחורי כל תיאור מילולי, והיא מה שמקודד ב-⟨M⟩ (t8). אם מתבקש \"תיאור ברמת מעברים\" —\n    זו הצורה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t7\">תיאורי high-level — מה מותר במבחן<\/h2>\n\n  <p>הנחיה רשמית שמופיעה על כל טופס: <b>\"תיאורים של מכונות טיורינג צריכים להיות ב-high-level\"<\/b>\n    (אם לא צוין אחרת). כלומר — פסאודו-קוד ממוספר במרכאות:<\/p>\n\n  <pre>M: \"On input w:\n1. Scan the tape and check that w has the form a*b*c*; if not, reject.\n2. Repeat while any letter remains:\n   2.1. Cross off one a, one b and one c; if some block is exhausted\n        while another is not, reject.\n3. If the tape holds only crossed marks, accept.\"<\/pre>\n\n  <p>מה מותר לכתוב כצעד? כל דבר שמכונה \"ברור שאפשר לממש\": סריקות, סימון\/מחיקה, השוואות,\n    ספירה, סימולציה של אוטומט\/מכונה נתונים, לולאות על מילים בסדר לקסיקוגרפי. מה שאסור:\n    צעדים שהם עצמם בעיה לא-כריעה (\"בדוק אם M עוצרת\") — אלא אם זו בדיוק הפעולה שמותר להניח.<\/p>\n\n  <div class=\"note\">הסגנון הזה — \"‏M: on input …\" עם סעיפים ממוספרים — הוא בדיוק סגנון הפתרונות\n    הרשמיים (ראו את המזהים של שאלה 2 בכל מבחני 2023–2024). לאמץ אותו אחד-לאחד: הבודקים רגילים אליו.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t8\">קידודים: ⟨M⟩ ו־⟨M,w⟩<\/h2>\n\n  <div class=\"def\"><span class=\"term\">קידוד<\/span> — כל אובייקט סופי (DFA, דקדוק, מכונת טיורינג)\n    ניתן לתיאור כמחרוזת סופית: ‏<span class=\"math\">⟨M⟩<\/span> = תיאור המכונה\n    (הטבלה של δ, המצבים, האלף-ביתים) כמילה. ‏<span class=\"math\">⟨M, w⟩<\/span> — קידוד של זוג.\n  <\/div>\n\n  <p>המשמעות המהפכנית: <b>מכונות הן קלט לגיטימי למכונות אחרות<\/b>. מכאן:<\/p>\n  <ul>\n    <li>שפות של קידודים: ‏<span class=\"math\">A<sub>TM<\/sub> = {⟨M,w⟩ | M מקבלת את w}<\/span>,\n      ‏<span class=\"math\">E<sub>DFA<\/sub><\/span>, ‏<span class=\"math\">REG<sub>TM<\/sub><\/span>… —\n      כל \"השפות המרכזיות\" מדף הנוסחאות.<\/li>\n    <li><b>המכונה האוניברסלית<\/b> ‏<span class=\"math\">U<\/span>: מקבלת <span class=\"math\">⟨M,w⟩<\/span>\n      ומדמה את ריצת <span class=\"math\">M<\/span> על <span class=\"math\">w<\/span> צעד-צעד.\n      \"מחשב שמריץ תוכנות\" — והבסיס לכך ש-<span class=\"math\">A<sub>TM<\/sub> ∈ RE<\/span>.<\/li>\n    <li>בדיקות תחביר (\"האם הקלט הוא ⟨M⟩ חוקי?\") הן תמיד כריעות — מבנה סופי בלבד.<\/li>\n  <\/ul>\n\n  <div class=\"warn\">להבחין חדות: ‏<span class=\"math\">⟨M⟩<\/span> (מחרוזת סופית — תחביר) לעומת\n    <span class=\"math\">L(M)<\/span> (שפה, אולי אינסופית — סמנטיקה). שאלות על התחביר — קלות וכריעות;\n    שאלות על הסמנטיקה — ליבת אי-הכריעות (משפט רייס, פרק 13). בלבול ביניהן הוא טעות החישוביות מס' 1.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch9-t9\">תזת צ'רץ'–טיורינג<\/h2>\n\n  <div class=\"thm\"><span class=\"term\">התזה:<\/span> כל מה שניתן לחישוב באלגוריתם (במובן האינטואיטיבי)\n    — ניתן לחישוב במכונת טיורינג. \"אלגוריתם\" ו\"מכונת טיורינג\" הם אותו מושג.<\/div>\n\n  <p>זו <b>תזה<\/b>, לא משפט — אי אפשר להוכיח טענה על מושג לא-פורמלי (\"אלגוריתם\"). הראיות:\n    כל פורמליזם סביר שהוצע (λ-calculus, מכונות רגיסטרים, שפות תכנות מודרניות) התגלה כשקול\n    בדיוק למכונת טיורינג; וכל הרחבה של המכונה עצמה (פרק 10) לא הוסיפה כוח.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>ההשלכה המעשית במבחן<\/h4>\n    <p>התזה היא מה שמכשיר את תיאורי ה-high-level: \"יש אלגוריתם ⇒ יש מ\"ט\". ובכיוון השני —\n      תוצאות אי-הכריעות שנוכיח הן טענות על <b>כל מחשב שהוא<\/b>, לא על מודל צעצוע:\n      אין תוכנית שמכריעה את בעיית העצירה. נקודה.<\/p>\n  <\/div>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> שביעייה עם סרט כתיב ודו-כיווני; שלוש תוצאות אפשריות (הלולאה!);\n    ‏R = עוצר תמיד, ‏RE = מזהה חד-צדדי; קידוד הופך מכונות לקלט; והתזה הופכת \"אלגוריתם\" למושג מתמטי.\n    מכאן והלאה — משחקים רק בקומה הזו.<\/div>\n<\/section>\n"},{"sid":"ch10","group":"פרקים","title":"פרק 10 — וריאציות של מ\"ט ובעיות כריעות על אוטומטים","topics":["עקרון הסימולציה — איך מוכיחים שקילות","סרט דו־כיווני ומכונת Stay","מכונה רב־סרטית","מ\"ט אי־דטרמיניסטית","A_DFA כריעה","E_DFA כריעה","EQ_DFA כריעה","בעיות כריעות על דקדוקים","גבול הכריעות — לקראת A_TM"],"html":"<h1>וריאציות של מ\"ט ובעיות כריעות על אוטומטים<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 10 (הרצאה 10 + תרגול 10)<\/p>\n\n<section>\n  <h2 id=\"ch10-t0\">עקרון הסימולציה — איך מוכיחים שקילות<\/h2>\n\n  <p>כל \"שדרוג\" למכונת טיורינג נבדק באותה שיטה: מראים ששני המודלים <b>מדמים<\/b> זה את זה.<\/p>\n\n  <div class=\"algo\">\n    <h4>תבנית הוכחת שקילות מודלים<\/h4>\n    <ol>\n      <li><b>כיוון קל:<\/b> המודל הבסיסי הוא מקרה פרטי של המורחב (מכונה רגילה היא רב-סרטית עם סרט אחד…).<\/li>\n      <li><b>כיוון מעניין:<\/b> מכונה רגילה מדמה את המורחבת — מתארים איך מקודדים את ה\"תוספת\"\n        על סרט יחיד, ואיך כל צעד של המורחבת מתורגם לסדרת צעדים סופית של הרגילה.<\/li>\n      <li>מסקנה: אותה מחלקת שפות בדיוק — התוספת היא נוחות, לא כוח.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"note\">זו הצדקה מעשית לתזת צ'רץ'-טיורינג: שוב ושוב מגלים שהרחבות \"חזקות\" מתקפלות\n    לאותו כוח חישוב. במבחן, סימולציות כאלה מצוטטות ולא מוכחות מחדש — \"מותר להסתמך על טענות מהכיתה\".<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t1\">סרט דו־כיווני ומכונת Stay<\/h2>\n\n  <ul>\n    <li><b>‏Stay (S):<\/b> מרשים ל-δ גם \"להישאר במקום\": ‏<span class=\"math\">{L, R, S}<\/span>.\n      סימולציה: ‏<span class=\"math\">S<\/span> = צעד ימינה ואז שמאלה (עם מצב ביניים). טכני לגמרי —\n      ובתרגול 10 זו דוגמת החימום.<\/li>\n    <li><b>סרט אינסופי לשני הכיוונים:<\/b> מקפלים אותו לסרט חד-כיווני עם שני מסלולים\n      (תא <span class=\"math\">i<\/span> מחזיק את הזוג <span class=\"math\">(i, −i)<\/span>) וסמן קצה;\n      המצבים זוכרים באיזה \"מסלול\" אנחנו.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>מה נחשב תשובה מלאה לשאלת סימולציה<\/h4>\n    <p>(1) הקידוד — איך מצב הסרט המורחב מיוצג בסרט הרגיל; (2) תרגום צעד — מה עושה הרגילה עבור\n      כל צעד של המורחבת; (3) שימור התוצאה — קבלה\/דחייה\/לולאה עוברות כמו שהן. שלושת הרכיבים,\n      בקצרה — בלי טבלאות מעברים.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t2\">מכונה רב־סרטית<\/h2>\n\n  <div class=\"def\"><span class=\"term\">מ\"ט רב-סרטית<\/span> — ‏<span class=\"math\">k<\/span> סרטים\n    ו-<span class=\"math\">k<\/span> ראשים עצמאיים;\n    ‏<span class=\"math\">δ: Q × Γ<sup>k<\/sup> → Q × Γ<sup>k<\/sup> × {L,R}<sup>k<\/sup><\/span>.\n    הקלט על סרט 1, השאר ריקים.<\/div>\n\n  <div class=\"algo\">\n    <h4>הסימולציה בסרט יחיד<\/h4>\n    <p>שומרים את כל הסרטים זה-אחר-זה עם מפרידי <span class=\"math\">#<\/span>, ומסמנים בכל קטע את\n      מיקום הראש בגרסה מנוקדת של האות (<span class=\"math\">ȧ<\/span>). כל צעד של הרב-סרטית:\n      סריקה שאוספת את <span class=\"math\">k<\/span> האותיות המנוקדות → עדכון לפי δ → סריקה שכותבת\n      ומזיזה נקודות. גלישה מעבר ל-# — מזיזים את הזנב ימינה (\"פינוי מקום\").<\/p>\n  <\/div>\n\n  <p>שימושיות בפועל: \"העתק את הקלט לסרט שני\", \"נהל מונה בסרט נפרד\" — צעדים לגיטימיים בתיאורי\n    high-level, כי רב-סרטית ≡ רגילה.<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t3\">מ\"ט אי־דטרמיניסטית<\/h2>\n\n  <div class=\"def\"><span class=\"term\">NTM<\/span> — ‏<span class=\"math\">δ: Q × Γ → P(Q × Γ × {L,R})<\/span>;\n    הריצה היא <b>עץ<\/b> של ענפים, והמכונה מקבלת אם <b>ענף כלשהו<\/b> מקבל.<\/div>\n\n  <div class=\"thm\">לכל NTM קיימת מ\"ט דטרמיניסטית שקולה. הרעיון: סריקת עץ הריצות\n    <b>לרוחב (BFS)<\/b> — מנסים את כל הענפים עד עומק 1, עד עומק 2, וכן הלאה\n    (בכתובות ענפים על סרט עזר). אם קיים ענף מקבל בעומק <span class=\"math\">d<\/span> — נמצא אותו\n    בשלב <span class=\"math\">d<\/span>.<\/p><\/div>\n\n  <div class=\"warn\">למה לא DFS? ענף אינסופי היה בולע את הסימולציה לפני שהיא מגיעה לענף המקבל.\n    החיפוש-לרוחב (או ניסוי כל הענפים באורך חסום ועולה) הוא אותו רעיון בדיוק כמו ה-dovetailing\n    שנפגוש במזהים של פרק 11 — שווה להפנים אותו כאן, בגרסה הפשוטה.<\/div>\n\n  <div class=\"note\">מסקנת שני הפרקים: ‏R ו-RE יציבות לחלוטין תחת כל הווריאציות. לכן מותר לתכנן\n    high-level עם ניחושים (\"נחש עד\", \"נחש חלוקה\") — ולדעת שזה עדיין RE.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t4\">A_DFA כריעה<\/h2>\n\n  <div class=\"def\"><span class=\"math\">A<sub>DFA<\/sub> = {⟨D, w⟩ | D is a DFA and D accepts w}<\/span><\/div>\n\n  <div class=\"algo\">\n    <h4>המכריע<\/h4>\n    <pre>M: \"On input ⟨D, w⟩:\n1. Check that the input encodes a valid DFA and a word; if not, reject.\n2. Simulate the run of D on w (|w| transition steps).\n3. If the run ends in an accepting state — accept; otherwise reject.\"<\/pre>\n  <\/div>\n\n  <p>העצירה מובטחת: ריצת DFA על מילה סופית אורכת בדיוק <span class=\"math\">|w|<\/span> צעדים.\n    לכן <span class=\"math\">A<sub>DFA<\/sub> ∈ R<\/span>. אותו טיעון עובד ל-<span class=\"math\">A<sub>NFA<\/sub><\/span>\n    ו-<span class=\"math\">A<sub>REX<\/sub><\/span> — ממירים ל-DFA (בנייה סופית) ומסמלצים.<\/p>\n\n  <div class=\"note\">ההבדל התהומי מ-<span class=\"math\">A<sub>TM<\/sub><\/span>: סימולציית DFA עוצרת\n    בהכרח; סימולציית מ\"ט — לא. \"להריץ ולראות\" הוא מכריע רק כשהריצה חסומה מראש.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t5\">E_DFA כריעה<\/h2>\n\n  <div class=\"def\"><span class=\"math\">E<sub>DFA<\/sub> = {⟨D⟩ | D is a DFA and L(D) = ∅}<\/span><\/div>\n\n  <div class=\"algo\">\n    <h4>המכריע — חיפוש נגישות בגרף<\/h4>\n    <pre>M: \"On input ⟨D⟩:\n1. Mark the start state.\n2. Repeat until no new state gets marked:\n   2.1. Mark every state reachable by one transition from a marked state.\n3. If no accepting state is marked — accept; otherwise reject.\"<\/pre>\n  <\/div>\n\n  <p>לולאת הסימון רצה לכל היותר <span class=\"math\">|Q|<\/span> סיבובים — עצירה מובטחת.\n    השפה ריקה ⟺ אף מצב מקבל אינו נגיש. (בדיוק הבדיקה שהכרנו בפרק 4 — עכשיו כאלגוריתם רשמי.)<\/p>\n\n  <div class=\"ex-box\">\n    <h4>שימוש חוזר במבחן<\/h4>\n    <p>‏<span class=\"math\">E<sub>DFA<\/sub> ∈ R<\/span> מופיע כצעד-עזר בפתרונות: המזהה של 2023א ש2\n      פותח ב-\"If ‏L(D) = ∅, accept (‏E_DFA ∈ R)\". מותר להשתמש בו כקופסה שחורה — עם אזכור השם.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t6\">EQ_DFA כריעה<\/h2>\n\n  <div class=\"def\"><span class=\"math\">EQ<sub>DFA<\/sub> = {⟨D₁, D₂⟩ | L(D₁) = L(D₂)}<\/span><\/div>\n\n  <p>שתי דרכים להכריע:<\/p>\n  <ul>\n    <li><b>הפרש סימטרי:<\/b> בונים DFA ל-<span class=\"math\">(L₁ ∩ <span class=\"comp\">L₂<\/span>) ∪ (<span class=\"comp\">L₁<\/span> ∩ L₂)<\/span>\n      (מכפלות ומשלים — בניות סופיות מפרק 2) ובודקים ריקנות עם המכריע של\n      <span class=\"math\">E<sub>DFA<\/sub><\/span>. שוויון ⟺ ההפרש הסימטרי ריק.<\/li>\n    <li><b>מינימיזציה\/שקילות:<\/b> מריצים את אלגוריתם מחלקות השקילות על האיחוד ובודקים\n      <span class=\"math\">q<sub>s1<\/sub> ≡ q<sub>s2<\/sub><\/span> (פרק 4).<\/li>\n  <\/ul>\n\n  <div class=\"note\">התבנית הכללית: על אוטומטים סופיים <b>כמעט הכול כריע<\/b>, כי כל השאלות מתכנסות\n    לבדיקות סופיות על גרף. ההיפוך הגמור יגיע במעבר למ\"ט: ‏<span class=\"math\">EQ<sub>TM<\/sub><\/span>\n    אפילו לא ב-RE ∪ coRE.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t7\">בעיות כריעות על דקדוקים<\/h2>\n\n  <ul>\n    <li><b>‏<span class=\"math\">A<sub>CFG<\/sub> = {⟨G, w⟩ | w ∈ L(G)}<\/span> כריעה:<\/b> ממירים\n      ל-CNF; מילה באורך <span class=\"math\">n ≥ 1<\/span> נגזרת — אם בכלל — בבדיוק\n      <span class=\"math\">2n−1<\/span> צעדים (פרק 7!); עוברים על מספר סופי של גזירות באורך הזה.<\/li>\n    <li><b>‏<span class=\"math\">E<sub>CFG<\/sub><\/span> כריעה:<\/b> אלגוריתם סימון \"מניב\":\n      מסמנים טרמינלים, ואז כל משתנה שיש לו כלל שכל צדו הימני מסומן; ‏<span class=\"math\">L(G) = ∅<\/span>\n      ⟺ ‏<span class=\"math\">S<\/span> לא סומן. עוצר תוך <span class=\"math\">|V|<\/span> סיבובים.<\/li>\n    <li><b>‏<span class=\"math\">EQ<sub>CFG<\/sub><\/span> — כבר <b>לא<\/b> כריעה!<\/b> אין \"הפרש סימטרי\"\n      לדקדוקים (אין משלים\/חיתוך ב-CFL) — והתוצאה באמת אי-כריעה (מוזכרת בקורס בלי הוכחה).<\/li>\n  <\/ul>\n\n  <div class=\"warn\">הניגוד <span class=\"math\">EQ<sub>DFA<\/sub> ∈ R<\/span> מול\n    <span class=\"math\">EQ<sub>CFG<\/sub> ∉ R<\/span> הוא חומר קבוע לשאלות נכון\/לא נכון —\n    האינסטינקט \"על תיאורים סופיים הכול כריע\" נשבר כבר בדקדוקים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch10-t8\">גבול הכריעות — לקראת A_TM<\/h2>\n\n  <p>סיכום ביניים של \"השפות המרכזיות\" עד כה:<\/p>\n\n  <table>\n    <tr><th>שפה<\/th><th>סטטוס<\/th><th>הכלי<\/th><\/tr>\n    <tr><td><span class=\"math\">A<sub>DFA<\/sub>, E<sub>DFA<\/sub>, EQ<sub>DFA<\/sub><\/span><\/td><td><span class=\"math\">∈ R<\/span><\/td><td>סימולציה חסומה \/ גרפים \/ מכפלה<\/td><\/tr>\n    <tr><td><span class=\"math\">A<sub>CFG<\/sub>, E<sub>CFG<\/sub><\/span><\/td><td><span class=\"math\">∈ R<\/span><\/td><td>CNF \/ סימון מניב<\/td><\/tr>\n    <tr><td><span class=\"math\">EQ<sub>CFG<\/sub><\/span><\/td><td><span class=\"math\">∉ R<\/span><\/td><td>(מצוטט)<\/td><\/tr>\n    <tr><td><span class=\"math\">A<sub>TM<\/sub><\/span><\/td><td>פרק 11<\/td><td>אלכסון…<\/td><\/tr>\n  <\/table>\n\n  <p>מדוע \"להריץ ולראות\" קורס במעבר למ\"ט? כי הצעד \"‏Run M on w\" עלול לא לעצור — ואין לנו דרך\n    לדעת מתי לוותר. את זה נהפוך מטענת-תחושה למשפט מדויק בפרק הבא, עם שיטת האלכסון.<\/p>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> וריאציות מ\"ט = אותו כוח (סימולציה!); על אוטומטים ודקדוקים\n    כמעט הכול כריע כי הריצות\/בדיקות חסומות; והגבול עובר בדיוק היכן שסימולציה מפסיקה להיות חסומה.\n    כל המכריעים של הפרק הם צעדי-עזר לגיטימיים במבחן — בשמם המפורש.<\/div>\n<\/section>\n"},{"sid":"ch11","group":"פרקים","title":"פרק 11 — R, RE ו־coRE","topics":["שלוש המחלקות במבט אחד","R = RE ∩ coRE","A_TM ∈ RE — המכונה האוניברסלית","שיטת האלכסון: A_TM ∉ R","המשלים והמפה: A_TM ∉ coRE","סימולציה מוגבלת־צעדים — הכלי","Dovetailing — לולאת החיפוש האינסופית","תבנית ה־∃: מתי שפה ב־RE","תבנית ה־∀: מתי שפה ב־coRE","אסטרטגיית שאלה 2 במבחן"],"html":"<h1>‏R, RE ו־coRE<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 11 (הרצאה 11 + תרגול 11)<\/p>\n\n<section>\n  <h2 id=\"ch11-t0\">שלוש המחלקות במבט אחד<\/h2>\n\n  <div class=\"def\">\n    <ul>\n      <li><span class=\"math\"><b>R<\/b><\/span> — קיים <b>מכריע<\/b>: עוצר תמיד ועונה נכון.<\/li>\n      <li><span class=\"math\"><b>RE<\/b><\/span> — קיים <b>מזהה<\/b>: מקבל בדיוק את מילות השפה\n        (על השאר — דוחה או מתלולאת).<\/li>\n      <li><span class=\"math\"><b>coRE<\/b><\/span> — המשלים ניתן לזיהוי:\n        ‏<span class=\"math\">L ∈ coRE ⟺ <span class=\"comp\">L<\/span> ∈ RE<\/span>.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p>אינטואיציית העדים: שפה ב-RE אם ל\"כן\" יש <b>עד סופי שאפשר למצוא<\/b>\n    (ריצה מקבלת, מילה, זוג…); ב-coRE אם ל\"לא\" יש עד כזה. ‏R = שני הצדדים מאושרים בזמן סופי.<\/p>\n\n  <div class=\"hier\">\n    <div class=\"ring\"><span class=\"hlbl\">כל השפות<\/span>\n      <div class=\"ring\"><span class=\"hlbl\">RE ∪ coRE<\/span>\n        <div class=\"ring\"><span class=\"hlbl\">R = RE ∩ coRE<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <p>ארבעה אזורים למפה: ‏<span class=\"math\">R<\/span>; ‏<span class=\"math\">RE ∖ R<\/span>\n    (עד ל\"כן\" בלבד — ‏<span class=\"math\">A<sub>TM<\/sub><\/span>); ‏<span class=\"math\">coRE ∖ R<\/span>\n    (עד ל\"לא\" בלבד — ‏<span class=\"comp\">A<sub>TM<\/sub><\/span>, ‏<span class=\"math\">E<sub>TM<\/sub><\/span>);\n    ומחוץ לשניהם (‏<span class=\"math\">REG<sub>TM<\/sub><\/span>, ‏<span class=\"math\">EQ<sub>TM<\/sub><\/span>).<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t1\">R = RE ∩ coRE<\/h2>\n\n  <div class=\"thm\">‏<span class=\"math\">L ∈ R<\/span> אם ורק אם <span class=\"math\">L ∈ RE<\/span> וגם\n    <span class=\"math\">L ∈ coRE<\/span>.<\/div>\n\n  <div class=\"proof\">\n    <b>⇐<\/b> מכריע ל-<span class=\"math\">L<\/span> הוא מזהה ל-<span class=\"math\">L<\/span>; והיפוך תשובתו —\n    מכריע (ובפרט מזהה) ל-<span class=\"math\"><span class=\"comp\">L<\/span><\/span>\n    (מותר להפוך תשובות של <b>מכריע<\/b> — הוא תמיד עוצר!).<br>\n    <b>⇒<\/b> יהיו <span class=\"math\">M₁<\/span> מזהה ל-<span class=\"math\">L<\/span> ו-<span class=\"math\">M₂<\/span>\n    מזהה ל-<span class=\"math\"><span class=\"comp\">L<\/span><\/span>. המכריע מריץ את שניהם <b>במקביל<\/b>\n    (צעד לזה, צעד לזה — או על שני סרטים): כל מילה שייכת לאחת השפות, ולכן אחת הריצות תעצור-ותקבל\n    בזמן סופי; אם <span class=\"math\">M₁<\/span> קיבלה — קבל, אם <span class=\"math\">M₂<\/span> — דחה.\n    <span class=\"qed\">∎<\/span>\n  <\/div>\n\n  <div class=\"warn\">שתי נקודות שנבחנות שוב ושוב: (1) להפוך תשובות של <b>מזהה<\/b> אסור —\n    לולאה נשארת לולאה, לא הופכת לקבלה; היפוך כשר רק למכריע. (2) הריצה במקביל חיונית —\n    \"קודם M₁ עד הסוף ואז M₂\" נתקעת אם M₁ מתלולאת.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t2\">A_TM ∈ RE — המכונה האוניברסלית<\/h2>\n\n  <div class=\"def\"><span class=\"math\">A<sub>TM<\/sub> = {⟨M, w⟩ | M is a TM and M accepts w}<\/span><\/div>\n\n  <div class=\"algo\">\n    <h4>המזהה<\/h4>\n    <pre>U': \"On input ⟨M, w⟩:\n1. Simulate M on w (using the universal machine).\n2. If M accepted —
