sup><\/span>?","c":["<span class=\"math\">ε<\/span> — אפס סיבובים בלולאה שלא קיימת זה מסלול תקין","<span class=\"math\">∅<\/span> — אין לולאה אז אין מסלול","לא מוגדר","<span class=\"math\">Σ<sup>*<\/sup><\/span>"],"e":"‏<span class=\"math\">L<sup>*<\/sup><\/span> תמיד מכיל את השרשור הריק. בנוסחת הסילוק: מצב בלי לולאה עצמית תורם <span class=\"math\">old(i,k)·ε·old(k,j)<\/span> — המסלול פשוט עובר דרכו פעם אחת. דף הנוסחאות מזכיר זאת במפורש.","a":0},{"q":"בחישוב <span class=\"math\">new(i,j)<\/span> מתברר ש-<span class=\"math\">old(i,k) = ∅<\/span> (אין חץ מ-i ל-k). מה התוצאה?","c":["התוספת היא ε","אי אפשר לסלק את k","התוספת כולה מתאפסת — <span class=\"math\">new(i,j) = old(i,j)<\/span>","התוספת היא <span class=\"math\">old(k,j)<\/span> בלבד"],"e":"‏<span class=\"math\">∅·anything = ∅<\/span>, ו-<span class=\"math\">r+∅ = r<\/span>: אם אין דרך להיכנס ל-k מ-i, אין מסלולים חדשים לזוג הזה. בפועל פשוט מדלגים על זוגות כאלה.","a":2},{"q":"מה בדיקת השפיות המומלצת באמצע תהליך GNFA?","c":["לבדוק מילה מתקבלת אחת ומילה נדחית אחת מול הביטויים החלקיים","לספור שמספר המצבים ירד","לוודא שאין ε באף תווית","להשוות את אורך הביטוי לגודל האוטומט"],"e":"השקילות נשמרת בכל שלב — אז מילה שהאוטומט המקורי מקבל\/דוחה חייבת להתאים גם עכשיו. בדיקה של 20 שניות שתופסת השמטות זוגות ולולאות.","a":0}]},{"t":"זהויות וכללי פישוט של ביטויים","q":[{"q":"איזו זהות עומדת מאחורי המלכודת <span class=\"math\">(ab)<sup>k<\/sup>a(ba)<sup>k<\/sup> = a(ba)<sup>2k<\/sup><\/span> ממאגר השפות?","c":["<span class=\"math\">rr<sup>*<\/sup> = r<sup>*<\/sup>r<\/span>","<span class=\"math\">r(sr)<sup>*<\/sup> = (rs)<sup>*<\/sup>r<\/span> — \"הזזת בלוק\" דרך הכוכב","<span class=\"math\">(r+s)<sup>*<\/sup> = (r<sup>*<\/sup>s<sup>*<\/sup>)<sup>*<\/sup><\/span>","<span class=\"math\">(r<sup>*<\/sup>)<sup>*<\/sup> = r<sup>*<\/sup><\/span>"],"e":"עם r=a, s=b: ‏<span class=\"math\">a(ba)<sup>k<\/sup> = (ab)<sup>k<\/sup>a<\/span>. לכן הביטוי כולו מתקפל לצורה רגולרית פשוטה — והשפה שנראית כמו \"השוואת k\" היא בעצם רגולרית. הופיעה ב-2013, 2011 ו-2019!","a":1},{"q":"האם <span class=\"math\">(r+s)<sup>*<\/sup> = r<sup>*<\/sup> + s<sup>*<\/sup><\/span>?","c":["כן — האיחוד מתפלג על הכוכב","כן, אבל רק כש-r ו-s זרות","לא — הצד הימני גדול יותר","לא — משמאל מותר לערבב r-ים ו-s-ים; מימין רק טהורים. מילה מבדילה: rs"],"e":"‏<span class=\"math\">(r+s)<sup>*<\/sup><\/span> = כל שרשוב מעורב; <span class=\"math\">r<sup>*<\/sup>+s<sup>*<\/sup><\/span> = הכול-r או הכול-s. הפרכה עם מילה קצרה — הטכניקה הסטנדרטית לשאלות שקילות.","a":3},{"q":"איך מפריכים ששני ביטויים שקולים?","c":["אי אפשר להפריך — צריך להוכיח","מציגים מילה מבדילה — שנמצאת בשפה של האחד ולא של השני","מראים שהביטויים באורכים שונים","ממירים שניהם ל-NFA ומשווים מספרי מצבים"],"e":"שקילות = שוויון שפות, והפרכה = איבר שנמצא בהפרש הסימטרי. מחפשים בין הקצרות: ε, אותיות, זוגות. (מספרי מצבים לא אומרים כלום — אוטומטים שונים לאותה שפה.)","a":1}]},{"t":"שאלות רגקס במבחן — תבניות עבודה","q":[{"q":"בשאלת \"כתבו ביטוי רגולרי ל-Op(L₁,L₂)\" בסגנון 2023ב — מה מבנה העבודה הנכון?","c":["להוכיח באינדוקציה על אורך המילה","לנחש ולסמוך על אינטואיציה","להבין את הפעולה על דוגמה קטנה, לפרק למקרים\/ריפוד, לכתוב ביטוי, ולבדוק ε ומילים קצרות","לכתוב את האוטומט המלא של Op ולמזער"],"e":"הפורמט הרשמי מבקש ביטוי + הסבר קצר. עובדים מהדוגמה (מה עושה ההכנסה\/פעולה), מרכיבים בטכניקות (ריפוד\/מקרים\/מחזור), ואז שתי בדיקות השפיות.","a":2},{"q":"מתי לעצור ולהבין שאין ביטוי רגולרי לשפה שמולכם?","c":["כשהתנאי דורש השוואה\/ספירה לא חסומה — אז זו שאלת אי-רגולריות, לא שאלת ביטוי","כשלביטוי יש יותר משלושה כוכבים","כשהשפה אינסופית","כשיש בשפה יותר משתי אותיות"],"e":"ביטוי קיים ⟺ רגולרית. אם רואים <span class=\"math\">#ₐ=#_b<\/span> או אורכים משתווים — הכלים הם למת הניפוח\/מחלקות שקילות (פרקים 4–5). אינסופיות כשלעצמה בסדר גמור (a* אינסופית).","a":0},{"q":"בהמרת אוטומט לביטוי במבחן, מה מזכה בנקודות חלקיות גם אם טעיתם בחשבון?","c":["כתיבת שני ביטויים שונים ליתר ביטחון","דילוג על שלבי הביניים ומתן תשובה סופית בלבד","כתיבת נוסחת הסילוק והצגת השלבים בצורה שיטתית ומסודרת","ציור האוטומט מחדש בגדול"],"e":"ההנחיות הרשמיות מדגישות שהציון מושפע גם מהבהירות. תהליך GNFA מסודר עם הנוסחה בכל צעד מראה שליטה בשיטה — וטעות העתקה אחת לא מוחקת הכול.","a":2}]}]},{"sid":"ch4","topics":[{"t":"מילה מפרידה ומצבים שקולים","q":[{"q":"מהי מילה מפרידה בין מצבים <span class=\"math\">p<\/span> ו-<span class=\"math\">q<\/span>?","c":["המילה הקצרה ביותר בשפה","מילה שריצה עליה מ-p ומ-q מסתיימת פעם במצב מקבל ופעם במצב לא-מקבל","מילה שמגיעה ל-p אבל לא ל-q מהמצב ההתחלתי","מילה שהריצה עליה עוברת דרך שני המצבים"],"e":"מפרידה = חושפת עתיד שונה: <span class=\"math\">δ′(p,w)∈F<\/span> xor <span class=\"math\">δ′(q,w)∈F<\/span>. שקילות מדברת על מה שקורה <b>מהמצבים והלאה<\/b> — לא על איך מגיעים אליהם.","a":1},{"q":"מתי <span class=\"math\">ε<\/span> היא מילה מפרידה בין <span class=\"math\">p<\/span> ל-<span class=\"math\">q<\/span>?","c":["אף פעם — מילה מפרידה חייבת אות אחת לפחות","כאשר שניהם מקבלים","רק אם אחד מהם המצב ההתחלתי","כאשר בדיוק אחד מהם מצב מקבל"],"e":"‏<span class=\"math\">δ′(p,ε)=p<\/span> — הריצה על ε \"נשארת במקום\". לכן ε מפרידה בדיוק כש-p,q חלוקים על קבלה — וזו נקודת הפתיחה E₀ של האלגוריתם.","a":3},{"q":"שני מצבים שקולים <span class=\"math\">p ≡ q<\/span>. מה מותר לעשות?","c":["להחליף את המצב ההתחלתי באחד מהם","למזג אותם למצב אחד — השפה לא תשתנה","למחוק את שניהם","להפוך אחד מהם למקבל"],"e":"שקולים = אותו עתיד בדיוק, אז כל ריצה שעוברת בהם ממשיכה זהה — מיזוג משמר את השפה. מחיקה מוחקת התנהגות; שינוי קבלה משנה שפה.","a":1}]},{"t":"שקילות־k — ההגדרה המדורגת","q":[{"q":"מה פירוש <span class=\"math\">p ≡₀ q<\/span>?","c":["הם באותו מרחק מהמצב ההתחלתי","יש להם אותם מעברים","שניהם מקבלים או שניהם לא — אין הפרדה ע\"י ε","אין ביניהם מעבר ישיר"],"e":"המילה היחידה באורך ≤ 0 היא ε, והיא מפרידה בדיוק כשחלוקים על קבלה. לכן ≡₀ מחלקת ל-F ו-Q∖F.","a":2},{"q":"איך נבדקת <span class=\"math\">p ≡<sub>k<\/sub> q<\/span> באמצעות <span class=\"math\">≡<sub>k−1<\/sub><\/span>?","c":["דרושים גם <span class=\"math\">p ≡<sub>k−1<\/sub> q<\/span> וגם <span class=\"math\">δ(p,σ) ≡<sub>k−1<\/sub> δ(q,σ)<\/span> לכל אות σ","מספיק ש-<span class=\"math\">δ(p,σ) ≡<sub>k−1<\/sub> δ(q,σ)<\/span> לאות אחת","דרוש ש-p ו-q יעברו לאותו מצב ממש","אין קשר בין הרמות"],"e":"מילה באורך ≤ k היא או ε (מכוסה ע\"י ≡₀ שמוכל ב-≡_{k−1}) או אות σ ואז מילה באורך ≤ k−1 — שמופרדת אמ\"מ היעדים נפרדים ברמה k−1. \"לאותו מצב ממש\" חזק מדי — מספיק שקילות היעדים.","a":0},{"q":"מדוע המדרג <span class=\"math\">≡₀, ≡₁, …<\/span> מתייצב אחרי לכל היותר <span class=\"math\">n−1<\/span> צעדים ב-DFA בן n מצבים?","c":["כי δ מוגדרת על n מצבים בלבד","זה לא נכון — לפעמים נדרשים n² צעדים","כל עידון אמיתי מגדיל את מספר המחלקות, ויש לכל היותר n מחלקות","כי כל מילה מפרידה קצרה מ-n"],"e":"מ-2 מחלקות אפשר לטפס רק עד n, צעד אחד לכל עלייה. ומרגע ש-<span class=\"math\">≡_k = ≡_{k+1}<\/span> — הרקורסיה לא תשנה יותר כלום. (המסקנה השקולה: מילה מפרידה קצרה קיימת — אבל זו תוצאה, לא הסיבה.)","a":2}]},{"t":"אלגוריתם מחלקות השקילות","q":[{"q":"מהי החלוקה ההתחלתית של האלגוריתם ומה חובה לעשות לפניה?","c":["<span class=\"math\">E₀={Q}<\/span> — הכול מחלקה אחת","כל מצב במחלקה משלו","<span class=\"math\">E₀={F, Q∖F}<\/span> — אחרי הוספת מצב מלכודת לכל אות","<span class=\"math\">E₀={F, Q∖F}<\/span> — אחרי הסרת המצבים הלא-נגישים"],"e":"מתחילים מהפרדת ε (מקבלים\/לא), ולפני הכול מסירים לא-נגישים — הם מזהמים את ספירת המחלקות. (השלמת מלכודת דרושה רק אם δ חלקית — תנאי נפרד.)","a":3},{"q":"מתי שני מצבים שהיו יחד ב-<span class=\"math\">E_{k−1}<\/span> נשארים יחד ב-<span class=\"math\">E_k<\/span>?","c":["כאשר שניהם מקבלים","כאשר לכל אות σ היעדים שלהם נופלים לאותה מחלקה של <span class=\"math\">E_{k−1}<\/span>","כאשר יש להם אותו מספר מעברים נכנסים","כאשר קיימת אות אחת שמובילה לאותה מחלקה"],"e":"התנאי הוא לכל האותיות, ומול <b>מחלקות<\/b> (לא מצבים ממש). מספיקה אות אחת \"בוגדת\" כדי לפצל את הזוג.","a":1},{"q":"מדוע האלגוריתם מוגדר ל-DFA ולא ל-NFA?","c":["כי ל-NFA אין מצבים מקבלים","כי ב-NFA יש תמיד אינסוף מחלקות","אין סיבה — האלגוריתם עובד גם על NFA","ב-NFA העתיד ממצב אינו מוגדר יחיד — קבלה תלויה בקבוצת ריצות, לא במצב בודד"],"e":"כל מושג השקילות נשען על \"מה קורה מכאן על הסיפא\" כפונקציה של המצב. ב-NFA זה לא פונקציה של מצב בודד. רוצים למזער NFA? קודם דטרמיניזציה (ואז אין הבטחת מינימום ל-NFA המקורי).","a":3}]},{"t":"הרצה מלאה של האלגוריתם — דוגמה","q":[{"q":"בדוגמת הפרק (A,B,C,D עם F={D}): מדוע A נפרד מ-B כבר בצעד הראשון?","c":["כי על 1: ‏A→C (במחלקת הלא-מקבלים) בעוד B→D (במחלקת המקבלים)","כי על 0 הם עוברים למצבים שונים","כי A הוא המצב ההתחלתי","כי B קרוב יותר ל-D"],"e":"הבדיקה היא מול מחלקות E₀: על 0 שניהם נשארים ב-{A,B,C} (B ו-B... A→B, B→B — אותה מחלקה, תקין); על 1 היעדים C∈{A,B,C} ו-D∈{D} — מחלקות שונות ⇒ פיצול. המילה המפרידה: \"1\".","a":0},{"q":"באותה דוגמה, למה B ו-C נשארים יחד עד הסוף?","c":["כי הם מעבירים זה לזה","כי אף מילה באורך 1 לא מפרידה — וזה מספיק","כי על כל אות היעדים שלהם באותה מחלקה: על 0 — B,C יחד; על 1 — שניהם ל-D","כי שניהם לא מקבלים"],"e":"בכל סבב עידון החתימה שלהם זהה (מחלקת-יעד לכל אות), עד היציבות — ולכן B ≡ C באמת. \"לא מפרידה באורך 1\" לבדו לא מספיק — צריך יציבות של כל הרמות.","a":2},{"q":"מה שיטת העבודה הידנית המומלצת בהרצת האלגוריתם?","c":["בטבלת המעברים רושמים בכל תא את מחלקת היעד; שורות עם אותה חתימה נשארות יחד","מציירים את כל הריצות באורך ≤ n","בודקים כל זוג מצבים מול כל מילה קצרה","מוחקים כל מצב שני"],"e":"העבודה נעשית ברמת מחלקות: מחליפים כל יעד בשם המחלקה שלו ומשווים שורות. מהיר, שיטתי, וקל לבדיקה חוזרת — כך מריצים גם בשאלות מבחן בזמן קצר.","a":0}]},{"t":"בניית האוטומט המזערי","q":[{"q":"אחרי מציאת המחלקות, איך מוגדרים המעברים של האוטומט המזערי?","c":["בוחרים מעבר שרירותי לכל מחלקה","<span class=\"math\">δ′([q],σ) = [δ(q,σ)]<\/span> — והבחירה של הנציג לא משנה כי שקולים עוברים לשקולים","לפי הנציג עם הכי הרבה מעברים","מאחדים את כל היעדים בקבוצה אחת"],"e":"המוגדרות-היטב היא לב הבנייה: אם p≡q אז לכל σ גם δ(p,σ)≡δ(q,σ) (אחרת הייתה מילה מפרידה). לכן המעבר ברמת מחלקות חד-ערכי.","a":1},{"q":"מדוע כל מחלקת שקילות היא או כולה מקבלת או כולה לא-מקבלת?","c":["כי כך מגדירים את המצבים המקבלים החדשים","זו הנחה שצריך להוסיף","רק באוטומטים בלי מעגלים","כי ε מפרידה בין מקבל ללא-מקבל — הם מעולם לא היו באותה מחלקה"],"e":"כבר E₀ מפרידה F מ-Q∖F, והעידונים רק מפצלים. לכן \"מקבלי המינימלי = מחלקות שמוכלות ב-F\" מוגדר חלק.","a":3},{"q":"מה תוצאת המינימיזציה על אוטומט הדוגמה (4 מצבים, B≡C)?","c":["אוטומט עם שפה מוכלת בקודמת","אוטומט בן 3 מצבים: [A], [BC], [D] — עם אותה שפה בדיוק","אוטומט בן 2 מצבים","אותו אוטומט — לא היה מה למזער"],"e":"מיזוג B,C בלבד. השפה נשמרת — מינימיזציה לעולם אינה משנה שפה, רק מציגה אותה בצורה הקומפקטית (והיחידה) ביותר.","a":1}]},{"t":"שקילות בין אוטומטים ויחידות המינימום","q":[{"q":"איך בודקים אלגוריתמית ש-<span class=\"math\">L(A) = L(B)<\/span> לשני DFA-ים?","c":["מריצים את שניהם על 100 מילים אקראיות","בודקים ששניהם מקבלים את ε","מאחדים את שני האוטומטים, מריצים מחלקות שקילות, ובודקים אם <span class=\"math\">q_{sA} ≡ q_{sB}<\/span>","משווים את מספרי המצבים"],"e":"הטענה מדף הנוסחאות: שקילות שפות ⟺ שקילות המצבים ההתחלתיים (באוטומט המאוחד). בדיקות מדגמיות לא מוכיחות; מספרי מצבים לא רלוונטיים אלא אם שניהם מינימליים.","a":2},{"q":"מה פירוש \"האוטומט המינימלי יחיד\"?","c":["לכל שפה רגולרית יש DFA מזערי אחד ויחיד עד כדי שמות מצבים","יש בדיוק אוטומט אחד לכל שפה","לכל אוטומט יש מינימיזציה אחת אפשרית מבחינת סדר צעדים","המינימלי הוא תמיד בן מצב אחד"],"e":"עד כדי איזומורפיזם (שינוי שמות) — המבנה נקבע ע\"י השפה. לכן \"מספר מצבי המינימלי\" הוא אינווריאנטה של השפה, וזה מה שמכשיר השוואות והוכחות חסם.","a":0},{"q":"בניתם שני DFA-ים מזעריים לאותה שפה ויצאו עם מבנה שונה. מה המסקנה?","c":["השפה אינה רגולרית","האלף-ביתים שונים בהכרח","טעות באחד מהם (או שאחד לא באמת מזערי) — המינימלי יחיד במבנהו","זה תקין — יש הרבה מינימליים"],"e":"יחידות המינימום היא כלי ביקורת עצמית מצוין: מבנים שונים ⇒ מישהו טועה. משווים ריצות על מילים קצרות למצוא איפה.","a":2}]},{"t":"חסמים תחתונים — כמה מצבים חייבים?","q":[{"q":"מה צריך להראות כדי להוכיח שכל DFA לשפה L דורש לפחות n מצבים?","c":["ש-L מכילה מילה באורך n","ש-L אינסופית","ביטוי רגולרי באורך n","n מילים שכל זוג מהן נפרד ע\"י סיפא כלשהי — ריצותיהן חייבות להסתיים במצבים שונים"],"e":"אם לשתי מילים אותה \"עמדת סיום\", כל סיפא ממשיכה זהה — סיפא מפרידה סותרת זאת. n נציגים מפרידים-הדדית ⇒ n מצבי סיום שונים ⇒ |Q| ≥ n.","a":3},{"q":"בדוגמת \"השמינית מהסוף היא 1\", איך מפרידים בין שתי מילים באורך 8 שנבדלות בעמדה i?","c":["אי אפשר להפריד — הן שקולות","מוסיפים סיפא <span class=\"math\">0^{i−1}<\/span> שממקמת את עמדה i בדיוק שמינית מהסוף","מוסיפים 1 בסוף","הופכים את המילים"],"e":"הסיפא מזיזה את החלון: אחרי הוספת i−1 אפסים, האות מעמדה i היא השמינית מהסוף — ובדיוק אחת מהמילים תתקבל. כך כל 2⁸ המילים מפרידות הדדית ⇒ נדרשים 2⁸ מצבים.","a":1},{"q":"מה היחס בין חסם תחתון (נציגים מפרידים) לאלגוריתם המינימיזציה?","c":["אלה אותו דבר בשני ניסוחים","החסם התחתון מיותר אם יש אלגוריתם","הנציגים משמשים רק לשפות לא רגולריות","המינימיזציה נותנת חסם עליון (בונה אוטומט), הנציגים חסם תחתון — כשנפגשים יש מספר מדויק"],"e":"בנייה מראה \"אפשר עם n\"; נציגים מראים \"אי אפשר עם פחות\". ביחד: המספר המינימלי הוא בדיוק n. (עם אינסוף נציגים מפרידים — השפה בכלל לא רגולרית: הגשר לפרק 5.)","a":3}]},{"t":"שימושים: בדיקת שקילות ותכונות","q":[{"q":"איך בודקים אם <span class=\"math\">L(A) = ∅<\/span> עבור DFA נתון?","c":["בודקים אם קיים מצב מקבל נגיש מהמצב ההתחלתי (חיפוש בגרף)","מריצים את A על כל המילים עד אורך 10","בודקים אם F ריקה","ממזערים ובודקים אם נשאר מצב אחד"],"e":"ריקנות = אין מסלול מ-q_s לאף מצב ב-F — בעיית נגישות בגרף. F לא-ריקה אינה מספיקה (אולי לא נגיש). זה בדיוק ההליך שהופך את E_DFA לכריעה בפרקי החישוביות.","a":0},{"q":"מתי <span class=\"math\">L(A)<\/span> אינסופית (עבור DFA אחרי הסרת לא-נגישים)?","c":["כאשר יש לולאה עצמית כלשהי","כאשר האלף-בית בגודל ≥ 2","כאשר קיים מסלול מקבל שעובר דרך מעגל — אפשר לסובב את המעגל שוב ושוב","כאשר יש יותר ממצב מקבל אחד"],"e":"מעגל על מסלול מ-q_s ל-F מייצר אינסוף מילים (כל מספר סיבובים). לולאה שלא על מסלול מקבל לא עוזרת. זו גם הטענה שמאחורי 2023א ש3.2 (שובך יונים על המסלול).","a":2},{"q":"מדוע כדאי למזער אחרי בניות כמו תת-קבוצות או מכפלה?","c":["הבניות מנפחות מצבים; מינימיזציה מחזירה לצורה הקנונית הקומפקטית ומקלה השוואות","כי אחרת האוטומט שגוי","כדי להפוך את האוטומט לדטרמיניסטי","כדי להוסיף מצב מלכודת"],"e":"הבניות נכונות אך בזבזניות (קבוצות לא-נגישות, זוגות שקולים). מינימיזציה = ניקיון + קנוניזציה. היא לא מתקנת שגיאות ולא קשורה לדטרמיניזם (הקלט כבר DFA).","a":0}]},{"t":"מצבים מפרידים בשאלות מבחן","q":[{"q":"ב-2023ב ש3.4 (מעגל a משולש עם q₀ מקבל) — מדוע <span class=\"math\">w=a<\/span> מפרידה גם בין q₁ ל-q₂ וגם בין q₂ ל-q₀?","c":["כי q₁ ו-q₂ שקולים","כי היא שולחת את q₂ למקבל (q₀) ואת q₁ ואת q₀ ללא-מקבלים","כי היא המילה הקצרה ביותר בשפה","כי כל מילה מפרידה בין כל זוג"],"e":"‏q₁→q₂ (לא מקבל), q₂→q₀ (מקבל!), q₀→q₁ (לא מקבל). \"a\" חושפת עתיד שונה בשני הזוגות בו-זמנית — בדיוק מה שהשאלה ביקשה.","a":1},{"q":"כשמחפשים מילה מפרידה ידנית, מה בודקים ראשון ועד איזה אורך ממשיכים?","c":["קודם את המילה הארוכה ביותר בשפה","רק מילים באורך זוגי","עד אורך אינסופי — אין חסם","קודם את ε; ואם קיימת מפרידה — קיימת גם באורך קטן ממספר המצבים"],"e":"ε ראשונה (קבלה שונה = סיימנו), ואז מריצים במקביל. חסם האורך נובע מהתייצבות המדרג ≡_k אחרי ≤ n−1 עידונים — חיפוש קצר וסופי.","a":3},{"q":"התבקשתם להראות שאוטומט נתון מזערי. מה מציגים?","c":["שמספר מצביו קטן ממספר האותיות","מילה מפרידה לכל זוג מצבים (ושכל המצבים נגישים)","שאין בו לולאות עצמיות","שהוא נבנה ע\"י אלגוריתם המינימיזציה"],"e":"מזערי ⟺ אין מה למזג ⟺ כל זוג נפרד (ואין לא-נגישים להסיר). זו רשימת n(n−1)\/2 הפרדות — ולרוב מילה אחת-שתיים מפרידות זוגות רבים.","a":1}]},{"t":"מוקשים: נגישות, שלמות וסדר הפעולות","q":[{"q":"מדוע חובה להסיר מצבים לא-נגישים לפני האלגוריתם?","c":["כי הם תמיד שקולים למצב ההתחלתי","אין חובה — זה רק ייפוי","הם משתתפים בחלוקה ומנפחים\/משבשים את ספירת המחלקות — למרות שאינם משפיעים על השפה","כי הם גורמים ללולאה אינסופית"],"e":"השקילות מסתכלת רק על העתיד, אז לא-נגיש נראה \"לגיטימי\" ואף עלול להיות לא-שקול לאף אחד — ואז \"מספר המחלקות\" כולל זבל. התוצאה: תשובה שגויה לשאלות כמו 2023א ש3.2.","a":2},{"q":"מה משתבש אם מריצים מינימיזציה על DFA עם δ חלקית (בלי מלכודת)?","c":["\"היתקעות\" מתפרשת שונה ממעבר למצב דוחה — וההשוואות בין מצבים לא מוגדרות היטב","האלגוריתם רץ לנצח","שום דבר — חלקיות היא עניין ציורי בלבד","המצבים המקבלים נעלמים"],"e":"האלגוריתם משווה את δ(p,σ) ל-δ(q,σ) — כשאחד מהם לא קיים, אין מה להשוות. משלימים מלכודת ⇒ δ מלאה ⇒ הכול מוגדר. (השלמה זהה נדרשה גם למשלים בפרק 2.)","a":0},{"q":"אחרי מיזוג, מילה שהתקבלה קודם פתאום נדחית. מה קרה כמעט בוודאות?","c":["המילה לא הייתה בשפה מלכתחילה","צריך היה למזג עוד זוג","מוזגו שני מצבים שנפרדים ע\"י מילה ארוכה יותר — העידון נעצר מוקדם מדי","המינימיזציה תמיד משנה מעט את השפה"],"e":"מינימיזציה משמרת שפה — בהגדרה. שינוי שפה = מוזג זוג לא-שקול, כלומר עצרנו לפני יציבות (או השווינו מול מצבים במקום מחלקות). חוזרים לעידון האחרון ומחפשים את המילה המפרידה.","a":2}]}]},{"sid":"ch5","topics":[{"t":"למה קיימות שפות לא רגולריות","q":[{"q":"מה האינטואיציה לכך ש-<span class=\"math\">{0<sup>n<\/sup>1<sup>n<\/sup>}<\/span> איננה רגולרית?","c":["אין לה ביטוי רגולרי קצר","צריך לזכור את n — כמות מידע שאינה חסומה — ולאוטומט יש זיכרון קבוע","השפה אינסופית ואוטומט סופי","יש בה שתי אותיות שונות"],"e":"הבעיה אינה האינסופיות (a* אינסופית ורגולרית) אלא הזיכרון: להשוות בלוקים דרוש מונה לא חסום. את האינטואיציה הזו הלמה הופכת להוכחה.","a":1},{"q":"מדוע אינטואיציית \"צריך זיכרון אינסופי\" איננה הוכחה?","c":["כי אינטואיציה תקפה רק לשפות סופיות","היא כן הוכחה אם מנסחים אותה יפה","כי זיכרון אינסופי לא קיים במציאות","כי לפעמים יש ניסוח חכם שמייתר את הזיכרון — כמו <span class=\"math\">{a<sup>n<\/sup>ub<sup>n<\/sup> | u∈{a,b}<sup>*<\/sup>}<\/span> שהיא בעצם רגולרית"],"e":"מלכודות המאגר (L011, L054, L072…) הן בדיוק שפות ש\"נראות\" זקוקות להשוואה אבל מתקפלות לצורה רגולרית. לכן חובה כלי פורמלי — ניפוח, מחלקות שקילות או סגירויות.","a":3},{"q":"אילו שלוש דרכים לגיטימיות להוכיח אי-רגולריות בקורס?","c":["הוכחה שאין ביטוי רגולרי באורך ≤ 100","למת הניפוח, אינסוף מילים מפרידות (מחלקות שקילות), וצמצום בעזרת סגירויות לשפה ידועה","רק למת הניפוח","בניית אוטומט אינסופי, ספירת מצבים, וניסוי מחשב"],"e":"שלוש דרכים שקולות בכוחן: ניפוח (הנפוצה), נציגים מפרידים אינסופיים (פרק 4), וסגירויות (t9). כשנדרש במפורש \"ע\"י למת הניפוח\" (2024א ש3.1) — אין בחירה.","a":1}]},{"t":"למת הניפוח — הנוסח המדויק","q":[{"q":"מהם שלושת התנאים על החלוקה <span class=\"math\">w = xyz<\/span> בלמה?","c":["<span class=\"math\">|y|≥n<\/span> ו-<span class=\"math\">xyz∈L<\/span>","<span class=\"math\">x=z<\/span> ו-<span class=\"math\">y<\/span> באמצע המילה","<span class=\"math\">|y|&gt;0<\/span>, ‏<span class=\"math\">|xy|≤n<\/span>, ולכל <span class=\"math\">i≥0<\/span>: ‏<span class=\"math\">xy<sup>i<\/sup>z∈L<\/span>","<span class=\"math\">|x|&gt;0<\/span>, ‏<span class=\"math\">|yz|≤n<\/span>, ולכל <span class=\"math\">i≥1<\/span>: ‏<span class=\"math\">xy<sup>i<\/sup>z∈L<\/span>"],"e":"‏y לא ריק, החלק הנשאב בתוך n הראשונות, והשאיבה — לכל i כולל אפס. כל סטייה בפרטים (למשל i≥1) הורסת הוכחות שנשענות על ניפוח למטה.","a":2},{"q":"מהו סדר הכמתים הנכון בלמה?","c":["∃n ∀w(∈L, ארוכה) ∃חלוקה ∀i","∀n ∃w ∀חלוקה ∃i","∃n ∃w ∃חלוקה ∀i","∀n ∀w ∀חלוקה ∀i"],"e":"קיים קבוע; לכל מילה ארוכה בשפה; קיימת חלוקה (של \"היריב\"); לכל i. בשלילה הכמתים מתהפכים — ומכאן בדיוק נגזר מי בוחר מה במשחק ההוכחה.","a":0},{"q":"על אילו מילים הלמה בכלל מדברת?","c":["על כל המילים מעל האלף-בית","על מילים שאורכן בדיוק n","רק על מילים בשפה שאורכן לפחות n","על כל מילות השפה"],"e":"מילים קצרות מ-n פטורות (הן \"נבלעות\" לפני שהלולאה מובטחת), ומילים מחוץ לשפה כלל לא נדונות. לכן בהוכחה חובה לוודא ש-w∈L וגם |w|≥n.","a":2}]},{"t":"מאיפה הלמה מגיעה — שובך היונים על הריצה","q":[{"q":"מה תפקיד שובך היונים בהוכחת הלמה?","c":["יש יותר מילים ממצבים ולכן שתי מילים באותו מצב","מספר האותיות גדול ממספר המצבים המקבלים","כל אוטומט מכיל לולאה עצמית","בקריאת n האותיות הראשונות מבקרים ב-n+1 מצבים — מצב חוזר, וחוזר = לולאה"],"e":"n+1 ביקורים ב-n מצבים ⇒ חזרה על מצב q. הקטע בין שני הביקורים הוא y — לולאה שאפשר לדלג עליה או לשכפלה. (המשפט \"שתי מילים באותו מצב\" הוא הטיעון של חסמים תחתונים — כלי אחר.)","a":3},{"q":"מדוע התנאי <span class=\"math\">|xy| ≤ n<\/span> נכון לפי ההוכחה?","c":["זו הנחה נוספת שלא נובעת מההוכחה","כי החזרה על מצב מובטחת כבר בתוך n האותיות הראשונות","כי y חייב להיות קצר מ-x","כי האוטומט קורא רק n אותיות"],"e":"שובך היונים מופעל על n+1 הביקורים הראשונים (קריאת n אותיות) — לכן שני הביקורים ב-q, ואיתם כל xy, בתוך החלון הזה. זה מקור כוחו של תנאי 2.","a":1},{"q":"מהו בעצם קבוע הניפוח n?","c":["אורך המילה הארוכה ביותר בשפה","מספר האותיות באלף-בית","קבוע אוניברסלי אחד לכל השפות","מספר המצבים של אוטומט כלשהו לשפה — קיים אך לא ידוע לנו"],"e":"ההוכחה לוקחת DFA כלשהו ל-L ומשתמשת ב-|Q| שלו. בהוכחת אי-רגולריות איננו מכירים אותו — ולכן כל טיעון עם n מספרי (\"ניקח n=5\") פסול.","a":3}]},{"t":"משחק היריב — מבנה הוכחת אי־רגולריות","q":[{"q":"במשחק ההוכחה — מי בוחר את המילה w ומי את החלוקה xyz?","c":["אנחנו בוחרים את w (כתלות ב-n); היריב את החלוקה — ואנו חייבים לטפל בכולן","אנחנו בוחרים גם את w וגם את החלוקה הנוחה","היריב בוחר את w ואנחנו את החלוקה","הכול נבחר אקראית"],"e":"מהיפוך הכמתים: ∃ שלנו (w, i), ∀ של היריב (n, חלוקה). הוכחה שמקבעת חלוקה אחת נוחה איננה מכסה את ה-∀ — הטעות הקטלנית הנפוצה ביותר.","a":0},{"q":"האם מותר לבחור i שונה עבור חלוקות שונות?","c":["רק אם i=0","רק בשפות מעל אלף-בית יחיד","כן — הבחירה שלנו נעשית אחרי שהחלוקה ידועה","לא — i אחד לכל ההוכחה"],"e":"סדר הכמתים: ∀חלוקה ∃i. לכל מקרה של חלוקה מותר לשבור עם i אחר (מקרה זה למעלה, מקרה זה למטה) — ובלבד שכל מקרה נשבר.","a":2},{"q":"מה בדיוק הוכחנו כשניצחנו במשחק בכל התרחישים?","c":["שתנאי הלמה אינם מתקיימים — ומכיוון שהלמה הכרחית לרגולריות, L איננה רגולרית","שלשפה אין אוטומט עם n מצבים בדיוק","שהשפה אינסופית","שהשפה אינה חסרת הקשר"],"e":"הראינו: לכל n קיימת מילה שכל חלוקותיה נשברות — שלילת מסקנת הלמה. הלמה: רגולרית ⇒ ניפוח; בשלילה: ¬ניפוח ⇒ ¬רגולרית. (על ח\"ה זו הלמה של פרק 8, לא זו.)","a":0}]},{"t":"הוכחה מלאה: {0ⁿ1ⁿ}","q":[{"q":"בהוכחה עבור <span class=\"math\">{0<sup>n<\/sup>1<sup>n<\/sup>}<\/span> עם <span class=\"math\">w=0<sup>n<\/sup>1<sup>n<\/sup><\/span> — מדוע בהכרח <span class=\"math\">y = 0<sup>t<\/sup><\/span>?","c":["כי אחרת השאיבה לא משנה את המילה","כי <span class=\"math\">|xy| ≤ n<\/span> ולכן xy כולו בתוך בלוק ה-0-ים הראשון","כי בחרנו כך את החלוקה","כי y חייב להתחיל את המילה"],"e":"תנאי 2 עושה את העבודה: n הראשונות כולן 0-ים, ולכן כל חלוקה חוקית כולאת את y שם. אנחנו לא בחרנו — מיצינו את כל האפשרויות במכה.","a":1},{"q":"עם <span class=\"math\">y=0<sup>t<\/sup><\/span>, מדוע <span class=\"math\">i=2<\/span> סוגר את ההוכחה?","c":["כי i=2 הוא תמיד הבחירה הנכונה","כי האורך נעשה אי-זוגי","כי המילה נעשית ארוכה מ-2n","<span class=\"math\">xy²z = 0<sup>n+t<\/sup>1<sup>n<\/sup><\/span> — יותר 0-ים מ-1-ים, לא בשפה"],"e":"t≥1 מפר את השוויון בין הבלוקים. גם i=0 היה עובד (פחות 0-ים). \"i=2 תמיד\" — לא: בתנאי ≥ (כמו m≥2n) שאיבה למעלה נשארת בשפה.","a":3},{"q":"אילו רכיבים חייבים להופיע בכתיבה מלאה של ההוכחה?","c":["חישוב קבוע הניפוח המדויק","הנחה בשלילה, \"יהי n המובטח\", מילה תלוית-n בשפה, מיצוי החלוקות מהתנאים, בחירת i, וסתירה","רק המילה והסתירה","ציור אוטומט משוער וסימון הלולאה"],"e":"זה השלד של הפתרונות הרשמיים, מילה במילה. השמטת \"בשלילה\" או \"המובטח\" נראית קטנה — אבל בלעדיהן ההוכחה לא אומרת כלום לוגית.","a":1}]},{"t":"אומנות בחירת המילה","q":[{"q":"מדוע כדאי לבחור מילה שתחילתה בלוק הומוגני (למשל <span class=\"math\">a<sup>n<\/sup>…<\/span>)?","c":["כדי שהאורך יהיה זוגי","כי אז i=1 מספיק","כדי שתנאי <span class=\"math\">|xy|≤n<\/span> יקבע את צורת y באופן יחיד ויחסוך פירוק למקרים","כי מילים הומוגניות תמיד בשפה"],"e":"כשהחלון כולו אות אחת, כל חלוקה חוקית נותנת y מאותה אות — המשחק מצטמצם למקרה יחיד. לכן \"לדחוף את החלק הרגיש לחלון\" הוא עקרון הבחירה הראשון.","a":2},{"q":"ב-2024א ש3.1 (<span class=\"math\">{a<sup>m<\/sup>ba<sup>n<\/sup>b | m≥2n}<\/span>) הפתרון בחר <span class=\"math\">w=a<sup>2n<\/sup>ba<sup>n<\/sup>b<\/span>. למה דווקא עם שוויון?","c":["מילה על גבול התנאי — כל הקטנה של הבלוק הראשון מפילה מהשפה, ומחיקה (i=0) עושה בדיוק זאת","כי מילים עם שוויון קצרות יותר","כדי ש-y יוכל להכיל את ה-b","בחירה שרירותית — כל מילה עובדת"],"e":"עם m>2n רופף, מחיקת t≤n אפסים אולי משאירה בשפה. השוויון ההדוק הופך כל מחיקה לשוברת. לא כל מילה עובדת — למשל w עם m ענק היא בחירה גרועה.","a":0},{"q":"בתרגול 5, עבור <span class=\"math\">{0<sup>m<\/sup>1<sup>n<\/sup> | m&gt;n}<\/span> נבחרה <span class=\"math\">w=0<sup>n+1<\/sup>1<sup>n<\/sup><\/span>. מה הרעיון?","c":["זו המילה הקצרה ביותר בשפה","כדי ש-y יכיל גם 1-ים","יתרון מינימלי (בדיוק 1) לבלוק הנשאב — כך מחיקה כלשהי (i=0) כבר שוברת את האי-שוויון","האורך הכולל ראשוני"],"e":"השאיבה נוגעת רק ב-0-ים (תנאי 2), והכרית היא 1 בלבד — מחיקת t≥1 נותנת m≤n. שוב עקרון הגבול: לשבת כמה שיותר קרוב לקו.","a":2}]},{"t":"ניצול התנאי |xy| ≤ n","q":[{"q":"מה תורם תנאי <span class=\"math\">|xy| ≤ n<\/span> להוכחות?","c":["מבטיח ש-x ריק","מבטיח שהשאיבה מגדילה את המילה","הוא רק הערת אגב — אפשר להתעלם","כולא את y בתחילת המילה ומצמצם דרמטית את מגוון החלוקות שיש למצות"],"e":"בלעדיו y יכול לשבת בכל מקום במילה, וההוכחה מתפרקת לים מקרים. איתו — בוחרים מילה שהחלון שלה \"נוח\" והמשחק מצטמצם. זה ההבדל בין הוכחה של 5 שורות ל-20.","a":3},{"q":"ב-<span class=\"math\">{ww}<\/span> עם <span class=\"math\">w=0<sup>n<\/sup>10<sup>n<\/sup>1<\/span>: מה קורה כששואבים <span class=\"math\">y=0<sup>t<\/sup><\/span> עם t אי-זוגי?","c":["צריך לעבור ל-i=0","האורך הכולל נעשה אי-זוגי — ואין בכלל חלוקה לשני חצאים שווים","החצי הראשון מקבל יותר 1-ים","המילה נשארת בשפה"],"e":"טיעון הזוגיות הוא קיצור הדרך של הפתרון הרשמי (2023ב ש3.1): אורך אי-זוגי ⇒ לא מהצורה ww ומיד. עבור t זוגי נדרש טיעון התוכן (חצי ראשון כולו 0-ים).","a":1},{"q":"נשארו בכל זאת שתי צורות אפשריות ל-y (חלון שמכיל שני בלוקים). איך כותבים את זה?","c":["בוחרים את המקרה הסביר יותר","מדלגים — זה אותו רעיון","משנים את השפה","\"מקרה 1 \/ מקרה 2\" ממוספרים — וסוגרים כל מקרה בנפרד (אולי עם i שונה)"],"e":"מיצוי מקרים מסודר הוא בדיוק הפורמט של הפתרונות הרשמיים (ראו את ה-Case 1\/Case 2 בלמת הח\"ה של 2023א ש1.4). כל מקרה פתוח = הוכחה לא גמורה.","a":3}]},{"t":"ניפוח למטה — i = 0","q":[{"q":"האם i=0 מותר בלמת הניפוח?","c":["כן — תנאי 3 מנוסח לכל i ≥ 0, ומחיקת y היא כלי לגיטימי ומרכזי","לא — שאיבה פירושה הכפלה בלבד","רק כאשר x ריק","רק בשפות סופיות"],"e":"ה-≥0 בנוסח אינו טעות דפוס: הלולאה באוטומט ניתנת גם לדילוג. בלי i=0 אי אפשר לשבור תנאי \"≥\" הדוקים — ראו 2024א ש3.1.","a":0},{"q":"מדוע דווקא i=0 נדרש עבור <span class=\"math\">{a<sup>m<\/sup>ba<sup>n<\/sup>b | m ≥ 2n}<\/span> עם <span class=\"math\">w=a<sup>2n<\/sup>ba<sup>n<\/sup>b<\/span>?","c":["כי כך האורך נעשה ראשוני","אין הכרח — כל i עובד","שאיבה למעלה רק מגדילה את m ונשארת בשפה — רק מחיקה מפרה את m ≥ 2n","כי y מכיל את ה-b הראשון"],"e":"‏y=a^t בבלוק הראשון; ‏i≥2 נותן m=2n+…≥2n — עדיין בשפה! ‏i=0 נותן m=2n−t&lt;2n — נשבר. תמיד לבדוק לאיזה כיוון התנאי רגיש.","a":2},{"q":"כלל אצבע לבחירת כיוון השאיבה:","c":["תנאי \"≥\" שוברים בדרך כלל למטה (i=0), תנאי \"≤\" למעלה, ושוויון נשבר בשני הכיוונים","תמיד למעלה — זה בטוח יותר","תמיד i=0 — הכי פשוט","הכיוון לא משנה אף פעם"],"e":"האי-שוויון קובע לאן יש מרחב חופשי: הוספה לא מפרה \"≥\" על החלק הגדול, מחיקה לא מפרה \"≤\". בחירה בכיוון הלא-נכון = שאיבה שנשארת בשפה = אין סתירה.","a":0}]},{"t":"חשבון אורכים והערת ה־(i−1)t","q":[{"q":"מה אורך המילה <span class=\"math\">xy<sup>i<\/sup>z<\/span> אם <span class=\"math\">|w|=m<\/span> ו-<span class=\"math\">|y|=t<\/span>?","c":["<span class=\"math\">m − t + i<\/span>","<span class=\"math\">m + (i−1)·t<\/span>","<span class=\"math\">m·i<\/span>","<span class=\"math\">m + i·t<\/span>"],"e":"עותק אחד של y כבר בתוך w; שאיבה ל-i עותקים מוסיפה (i−1)t. עבור i=0: אורך m−t. הנוסחה מופיעה כהערה רשמית בדף הנוסחאות — כי בלעדיה חישובי החזקות משתבשים.","a":1},{"q":"בהוכחה עבור <span class=\"math\">{a<sup>p<\/sup> | p ראשוני}<\/span> — איזו בחירת i הופכת את האורך למכפלה?","c":["<span class=\"math\">i = 2<\/span>: האורך זוגי ולכן לא ראשוני","<span class=\"math\">i = 0<\/span>: האורך שלילי","<span class=\"math\">i = p<\/span>: האורך p²","<span class=\"math\">i = p+1<\/span>: האורך נעשה <span class=\"math\">p + p·t = p(1+t)<\/span> — מכפלת שני גורמים ≥ 2"],"e":"‏p+(i−1)t עם i=p+1 נותן p(1+t). ‏i=2 נותן p+t — לא בהכרח פריק. הבחירה תלוית-w-ו-t היא לגיטימית (i נבחר אחרון!) — דוגמה יפה לכוח של סדר הכמתים.","a":3},{"q":"היכן עוד ישרת אתכם אותו חשבון אורכים?","c":["במינימיזציה","בלמת הניפוח לחסרות הקשר — שם <span class=\"math\">|uv<sup>i<\/sup>xy<sup>i<\/sup>z| = |w|+(i−1)(s+t)<\/span>","רק כאן — בהמשך אין חשבון","בבניית תת-הקבוצות"],"e":"בפרק 8 שואבים שני חלקים בו-זמנית (v ו-y), והאורך גדל ב-(i−1)(|v|+|y|). מי ששולט בחשבון כאן — מקבל את הגרסה הכפולה בחינם.","a":1}]},{"t":"הדרך העקיפה — סגירויות במקום ניפוח","q":[{"q":"איך מוכיחים בסגירויות ש-<span class=\"math\">{w | #₀(w)=#₁(w)}<\/span> איננה רגולרית?","c":["מראים שאין לה ביטוי רגולרי","בונים NFA אינסופי","אילו הייתה רגולרית, גם החיתוך שלה עם <span class=\"math\">0<sup>*<\/sup>1<sup>*<\/sup><\/span> — שהוא <span class=\"math\">{0<sup>n<\/sup>1<sup>n<\/sup>}<\/span> — היה רגולרי. סתירה","מנפחים את המילה 0011"],"e":"שתי שורות במקום עמוד ניפוח: חיתוך עם רגולרית משמר רגולריות, והתוצאה ידועה כלא-רגולרית. זו התבנית \"מצמצמים אל הידועה\".","a":2},{"q":"מתי אסור להשתמש בדרך העקיפה?","c":["כשנוסח השאלה דורש במפורש הוכחה ע\"י למת הניפוח","כשלשפה יש יותר מאות אחת","כשקבוע הניפוח לא ידוע","לעולם מותר"],"e":"‏2024א ש3.1: \"הוכח ע\"י למת הניפוח\" — סגירויות לא יזכו בנקודות שם. כשאין דרישה כזו, הדרך הקצרה כשרה לגמרי (ואף מומלצת) — עם ציון שם הסגירות בכל צעד.","a":0},{"q":"בתרגיל \"הוכיחו ש-<span class=\"math\">{a<sup>p+1<\/sup> | p ראשוני}<\/span> לא ח\"ה\" בעזרת <span class=\"math\">{a<sup>p<\/sup>}<\/span> — מה רצף הפעולות בפתרון הרשמי?","c":["חיתוך עם {a} בלבד","איחוד עם השפה הריקה","הצבה שמסמנת (a→{a,a′}), חיתוך עם <span class=\"math\">a<sup>*<\/sup>a′a<sup>*<\/sup><\/span> לבודד עותק מסומן אחד, והצבה שמוחקת אותו","היפוך, שרשור עם a, ומשלים"],"e":"מסמנים אות אחת, כולאים בדיוק סימון אחד, מוחקים — נשארים עם {a^p} הידועה כלא-ח\"ה. שלוש פעולות שכולן סגורות בח\"ה ⇒ סתירה. (2023א ש3.4 — אותה טכניקה מילה במילה.)","a":2}]},{"t":"טעויות קלאסיות סביב הלמה","q":[{"q":"שפה מקיימת את כל תנאי הניפוח. מה נובע?","c":["שהיא אינסופית","כלום — הלמה תנאי הכרחי בלבד; שפה יכולה להתנפח יפה ולהישאר לא-רגולרית","שהיא רגולרית","שהיא חסרת הקשר"],"e":"כיוון הלמה: רגולרית ⇒ ניפוח. ההפך אינו נכון — קיימות לא-רגולריות שמתנפחות. לכן הלמה משמשת אך ורק לשלילה; לרגולריות בונים אוטומט\/ביטוי.","a":1},{"q":"\"נבחר w = 0011 ונראה שאין חלוקה טובה\" — מה הפגם?","c":["המילה לא בשפה","מותר רק מילים באורך זוגי","אין פגם","המילה קבועה ולא תלויה ב-n — אולי n גדול מ-4 והלמה כלל לא חלה עליה"],"e":"הלמה מדברת רק על מילים באורך ≥ n, ו-n לא ידוע. מילה קבועה עלולה להיות קצרה מדי. חובה לבנות את w כפונקציה של n (למשל 0ⁿ1ⁿ).","a":3},{"q":"\"נבחר את החלוקה y = האות הראשונה\" — מה הפגם?","c":["אין פגם — כל חלוקה מספיקה","החלוקה בידי היריב — יש למצות את כל החלוקות החוקיות, לא לבחור נוחה","אסור ש-y יהיה באורך 1","y חייב להכיל שתי אותיות שונות"],"e":"זו טעות ה-∀\/∃ הקלאסית: אנחנו בוחרים w ו-i; החלוקה נתונה לנו מהיריב. אם ההוכחה בדקה חלוקה אחת — היא לא שללה כלום. ממצים דרך תנאי 2 או מפרקים למקרים.","a":1}]}]},{"sid":"ch6","topics":[{"t":"CFG — ההגדרה הפורמלית","q":[{"q":"מה מבנה כלל גזירה חוקי ב-CFG, ומה הופך אותו ל\"חסר הקשר\"?","c":["שני הצדדים חייבים אורך שווה","משתנה יחיד בצד שמאל, וכל מחרוזת של משתנים וטרמינלים בצד ימין","מחרוזת כלשהי בצד שמאל ומשתנה בצד ימין","טרמינל בצד שמאל ומשתנים בצד ימין"],"e":"‏A → α עם A∈V ו-α∈(V∪Σ)*. \"חסר הקשר\" = ההחלפה של A מותרת בכל הקשר, בלי תלות בשכנים — צד שמאל הוא משתנה בודד.","a":1},{"q":"בדקדוק <span class=\"math\">S → aSb | ε<\/span> — איזו שפה נוצרת?","c":["<span class=\"math\">{a<sup>n<\/sup>b<sup>m<\/sup> | n,m ≥ 0}<\/span>","כל המילים מהצורה a-ים ואז b-ים","<span class=\"math\">{(ab)<sup>n<\/sup>}<\/span>","<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span>"],"e":"כל שימוש בכלל הראשון מוסיף a אחד משמאל ו-b אחד מימין — בהכרח מאוזן ומקונן. השפה הלא-רגולרית המפורסמת נוצרת משני כללים.","a":3},{"q":"מה ההבדל בין משתנים לטרמינלים?","c":["אין הבדל — עניין של סימון","משתנים הם סימני-עזר שחייבים להיעלם עד סוף הגזירה; טרמינלים הם אותיות המילה הסופית","משתנים הם אותיות נדירות בשפה","טרמינלים מופיעים רק בצד שמאל של כללים"],"e":"מילה בשפה = מחרוזת טרמינלים בלבד. משתנה הוא \"התחייבות להמשך גזירה\". הדרישה V∩Σ=∅ מונעת בלבול בין השניים.","a":1}]},{"t":"גזירה ושפת הדקדוק","q":[{"q":"מהי <span class=\"math\">L(G)<\/span>?","c":["קבוצת הכללים של הדקדוק","המילים שנגזרות מכל משתנה שהוא","<span class=\"math\">{w ∈ Σ<sup>*<\/sup> | S ⇒<sup>*<\/sup> w}<\/span> — מילות טרמינלים שנגזרות ממשתנה ההתחלה","כל המחרוזות שמופיעות באיזושהי גזירה"],"e":"רק מילים טהורות (בלי משתנים) שמקורן ב-S. צורות ביניים כמו aSb הן תחנות בדרך — לא איברי שפה.","a":2},{"q":"מה מסמן <span class=\"math\">α ⇒<sup>*<\/sup> β<\/span>?","c":["אפס או יותר צעדי גזירה מ-α ל-β","בדיוק צעד גזירה אחד","ש-β ארוכה מ-α","ש-α ו-β שקולות"],"e":"הכוכב = סגור רפלקסיבי-טרנזיטיבי: כולל גם \"אפס צעדים\" (α⇒*α). צעד בודד מסומן ⇒.","a":0},{"q":"האם <span class=\"math\">ε ∈ L(G)<\/span> עבור <span class=\"math\">S → aSb | ε<\/span>?","c":["רק אם מוסיפים כלל S → S","לא — כי הכלל הראשון מחייב a","כן — הגזירה בת הצעד האחד S ⇒ ε","לא — מילה ריקה לעולם אינה בשפת דקדוק"],"e":"‏S→ε הוא כלל לגיטימי, והפעלה מיידית שלו נותנת את ε (המקרה n=0). מילים ריקות בהחלט יכולות להיות בשפת דקדוק.","a":2}]},{"t":"עצי גזירה וגזירה שמאלית","q":[{"q":"מה מייצג עץ גזירה?","c":["את סדר הצעדים המדויק של הגזירה","את טבלת המעברים של הדקדוק","את כל המילים בשפה","את המבנה ההיררכי של הגזירה, בלי תלות בסדר הפעלת הכללים"],"e":"העץ מקבע אילו כללים הופעלו על אילו מופעים — אבל שוכח את סדר ההחלפות. גזירות שונות עם אותו עץ הן \"אותו פירוק\" מהותית.","a":3},{"q":"מהי גזירה שמאלית ולמה היא חשובה?","c":["גזירה שמשתמשת רק בכלל השמאלי של כל משתנה","בכל צעד מחליפים את המשתנה השמאלי ביותר — והיא נציג קנוני יחיד לכל עץ גזירה","גזירה שמתחילה מהאות השמאלית של המילה","גזירה קצרה ככל האפשר"],"e":"עץ ↔ גזירה שמאלית היא התאמה חד-חד-ערכית. לכן \"שני עצים שונים\" אפשר להוכיח גם עם \"שתי גזירות שמאליות שונות\" — ניסוח שמופיע בהגדרת העמימות.","a":1},{"q":"איך קוראים את המילה מתוך עץ גזירה?","c":["קוראים את הצמתים הפנימיים מלמעלה למטה","סופרים את מספר הרמות","קוראים את השורש בלבד","משרשרים את העלים משמאל לימין"],"e":"העלים (טרמינלים או ε) בסדר משמאל לימין הם בדיוק המילה הנגזרת. הצמתים הפנימיים הם המשתנים שהוחלפו בדרך.","a":3}]},{"t":"עמימות (Ambiguity)","q":[{"q":"מתי דקדוק נקרא עמום?","c":["כשקיימת מילה עם שני עצי גזירה שונים (שקול: שתי גזירות שמאליות שונות)","כשיש לו שני כללים לאותו משתנה","כשקיימות שתי גזירות שונות למילה כלשהי","כששפת הדקדוק אינסופית"],"e":"המבחן הוא עצים (או שמאליות) — לא סתם \"שתי גזירות\": כמעט תמיד יש הרבה גזירות לאותו עץ (סדרי החלפה שונים), וזה לא עמימות. שני כללים לאותו משתנה הם דבר שגרתי.","a":0},{"q":"איך בוחרים מילה מועמדת להוכחת עמימות?","c":["מילה שאינה בשפה","מילה עם אות אחת בלבד תמיד","מילה שנופלת בחפיפה בין שני ענפים\/מקרים של הדקדוק — נגזרת בשתי דרכים מבניות","המילה הארוכה ביותר שאפשר לגזור"],"e":"עמימות נולדת מחפיפה: מילה שמקיימת גם i≥j וגם i≥k (כמו abc ב-2024א ש3.3) נגזרת דרך שני הענפים. מחפשים את נקודת הכפילות של הדקדוק.","a":2},{"q":"מה חובה להציג בתשובה מלאה לשאלת עמימות במבחן?","c":["מילה אחת + שני עצי הגזירה (או שתי הגזירות השמאליות) במלואם","רק את המילה","הוכחה שכל דקדוק אחר לשפה גם עמום","ספירה של מספר הגזירות הכולל"],"e":"‏2023ב ש3.2 מנסח במפורש: \"הראו בנוסף שניים מעצי הגזירה\". מילה + שני עצים מצוירים = תשובה סגורה. עמימות של השפה עצמה היא מושג אחר (ולא נדרש).","a":0}]},{"t":"תכנון דקדוקים — זוגות, שיקוף וקינון","q":[{"q":"איזה דקדוק יוצר את שפת הפלינדרומים מעל {a,b}?","c":["<span class=\"math\">S → aS | Sb | ε<\/span>","<span class=\"math\">S → aSa | bSb | a | b | ε<\/span>","<span class=\"math\">S → aSb | bSa | ε<\/span>","<span class=\"math\">S → SS | a | b<\/span>"],"e":"פלינדרום = אותה אות בשני הקצוות ופלינדרום בפנים; הבסיסים a|b|ε מכסים אורכים זוגיים ואי-זוגיים. ‏aSb|bSa יוצר דווקא אנטי-פלינדרומים (קצוות שונים!).","a":1},{"q":"מה יוצר הדקדוק <span class=\"math\">S → aSb | bSa | ε<\/span>?","c":["פלינדרומים","<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>} ∪ {b<sup>n<\/sup>a<sup>n<\/sup>}<\/span>","מילים עם מספר שווה של a ו-b בכל רישא","<span class=\"math\">{uv<sup>R<\/sup> | |u|=|v|, ∀i: u<sub>i<\/sub> ≠ v<sub>i<\/sub>}<\/span> — זוגות ממוררים עם קצוות שונים"],"e":"כל כלל מזווג עמדה i של u עם העמדה המשוקפת של v — ודורש אותיות שונות. זו בדיוק התשובה הרשמית של מבחן-לדוגמה ש3.3 (בגרסת {a,b}).","a":3},{"q":"איך יוצרים דקדוק ל-<span class=\"math\">{a<sup>n<\/sup>ub<sup>n<\/sup> | n>0, u ∈ L}<\/span> כש-L ח\"ה עם משתנה התחלה S_L?","c":["אי אפשר — תלות בין שני צדדים","<span class=\"math\">S → aSb | aS_Lb<\/span> — מקננים את S_L בבסיס העטיפה","<span class=\"math\">S → aS | S_L | Sb<\/span>","<span class=\"math\">S → S_L S S_L<\/span>"],"e":"העטיפה aSb סופרת את הזוגות, והבסיס aS_Lb (שמבטיח n≥1) שותל את L באמצע. זו תבנית הקינון של L023 — ההוכחה החיה ש\"תלות דרך משתנה\" כן אפשרית, בניגוד לתלות בין משתנים.","a":1}]},{"t":"תכנון דקדוקים — פירוק למקרים ושרשור","q":[{"q":"איך בונים דקדוק לאיחוד של שתי שפות עם דקדוקים נתונים?","c":["<span class=\"math\">S → S₁S₂<\/span>","אי אפשר בלי אוטומט","משתנה התחלה חדש עם <span class=\"math\">S → S₁ | S₂<\/span> (ומשתנים זרים)","ממזגים את כל הכללים לאותו משתנה"],"e":"בחירת ענף בצעד הראשון. חשוב שהמשתנים זרים — אחרת כללים \"מזדהמים\" בין הדקדוקים. ‏S₁S₂ הוא שרשור, לא איחוד.","a":2},{"q":"מדוע <span class=\"math\">{a<sup>i<\/sup>b<sup>i<\/sup>a<sup>i<\/sup>}<\/span> אינו ניתן לבנייה כ-<span class=\"math\">S → AB<\/span> עם A ל-<span class=\"math\">a<sup>i<\/sup>b<sup>i<\/sup><\/span> ו-B ל-<span class=\"math\">a<sup>i<\/sup><\/span>?","c":["המונה של A אינו מתואם עם של B — משתנים גוזרים באופן עצמאי לחלוטין","כי B חייב לבוא לפני A","כי אסור ש-a יופיע בשני חלקים","דווקא אפשר — הבנייה תקינה"],"e":"\"חסר הקשר\": כל מופע משתנה חי לבד, בלי תקשורת. i של A ו-i של B הם מונים שונים. (השפה באמת איננה ח\"ה — נראה בפרק 8.) זו המגבלה המהותית של המודל.","a":0},{"q":"בדקדוק של 2023ב ש1.3 מופיע <span class=\"math\">S → A | cSc | Scc | ccS<\/span>. מה תפקיד שלושת הכללים עם c?","c":["ליצור פלינדרום של c-ים","להוסיף c-ים בודדים","לפזר זוגות של c בכל מיקום יחסי למילה הפנימית — לפני, אחרי ומסביב","לוודא שמספר ה-c אי-זוגי"],"e":"‏Op מכניס מילה מ-L₁ לתוך מילת c^n זוגי: הזוגות נוספים סביב\/לפני\/אחרי — שלושת הכללים מכסים את כל הפיצולים של בלוק זוגי לשני צדדים.","a":2}]},{"t":"אי־שוויונות בדקדוק — לפחות ולכל היותר","q":[{"q":"מה יוצר הכלל <span class=\"math\">A → aAb | aA | ε<\/span>?","c":["<span class=\"math\">{a<sup>i<\/sup>b<sup>j<\/sup> | i ≤ j}<\/span>","<span class=\"math\">{a<sup>i<\/sup>b<sup>i<\/sup>}<\/span> בלבד","כל מילה שמתחילה ב-a","<span class=\"math\">{a<sup>i<\/sup>b<sup>j<\/sup> | i ≥ j}<\/span> — כל b מזווג ל-a, ו-a-ים עודפים חופשיים"],"e":"‏aAb מוסיף זוג, aA מוסיף a עודף — ולכן i≥j עם הסדר a-ואז-b נשמר. (בדיוק הכלל מהפתרון הרשמי של 2024א ש3.2.) להיפוך: A → aAb | Ab | ε.","a":3},{"q":"איך משנים את הדקדוק כדי לקבל אי-שוויון חד <span class=\"math\">i > j<\/span>?","c":["אי אפשר לבטא אי-שוויון חד","מחייבים לפחות a עודף אחד — למשל <span class=\"math\">A → aB, B → aBb | aB | ε<\/span>","מוחקים את הכלל aA","מוסיפים כלל b → ε"],"e":"‏\"&gt;\" = \"≥ ועוד אחד\": כלל פתיחה שמכריח עודף, ואז הגרסה הרופפת. לחלופין A → aAb | aA | a. תרגומי אי-שוויונות הם לחם-חוק בשאלות בנייה.","a":1},{"q":"בדקדוק של 2023א ש3.1 (<span class=\"math\">S → ε | aSbb | aaSb | aaaS | Sbbb<\/span>) — מה האינווריאנטה של כל כלל?","c":["כל כלל שומר על i = j","כל כלל מוסיף אות אחת","הכללים אקראיים","כל כלל מוסיף בדיוק 3 לסכום i+j תוך שמירת הסדר (a-ים לפני b-ים)"],"e":"‏1+2, 2+1, 3+0, 0+3 — תמיד +3 ⇒ ‏(i+j) mod 3 = 0 משתמר; והמבנה (a-ים נצמדים משמאל, b-ים מימין) שומר על הצורה. דקדוק כמונה מודולרי.","a":3}]},{"t":"כל שפה רגולרית היא חסרת הקשר","q":[{"q":"איך בונים דקדוק (רגולרי) מ-DFA?","c":["משתנה לכל מצב; לכל מעבר δ(A,σ)=B כלל A → σB; ולכל מצב מקבל A → ε","כלל לכל מילה בשפה","משתנה יחיד עם כלל לכל אות","הופכים את כיווני החיצים"],"e":"הגזירה מדמה ריצה: המשתנה הנוכחי = המצב הנוכחי, והמילה נבנית משמאל תוך כדי. ‏A→ε מסיים בדיוק במצבים מקבלים. (ההליך המדויק בדף הנוסחאות: NFA→RG.)","a":0},{"q":"מה היחס בין REG ל-CFL?","c":["<span class=\"math\">CFL ⊊ REG<\/span>","המחלקות זרות","<span class=\"math\">REG ⊊ CFL<\/span> — הכלה ממש; <span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>}<\/span> עדה להפרדה","המחלקות שוות"],"e":"כל רגולרית ח\"ה (דקדוק רגולרי הוא CFG), ויש ח\"ה לא רגולריות. ההיררכיה נמשכת בפרקים הבאים: REG ⊊ CFL ⊊ R ⊊ RE.","a":2},{"q":"במבחן נדרש להוכיח: \"אם L רגולרית אז L₃ חסרת הקשר\" (2024א ש1.3). אילו כלים כשרים?","c":["בניית CFG או PDA, וגם שרשראות סגירויות שמערבות רגולריות — הכול תקף","רק בניית דקדוק מפורשת","רק למת הניפוח","רק המרה ל-DFA"],"e":"הפתרון הרשמי נתן שתי דרכים: דקדוק + \"חיתוך ח\"ה עם רגולרית\" (Solution 1) או PDA מפורש (Solution 2). כשהשאלה לא מכתיבה שיטה — בוחרים את הזולה.","a":0}]},{"t":"הוכחת נכונות של דקדוק","q":[{"q":"מהם שני כיווני ההוכחה של <span class=\"math\">L(G) = L<\/span> ועל מה האינדוקציה בכל אחד?","c":["שניהם על גודל האלף-בית","L(G) ⊆ L באינדוקציה על אורך הגזירה; L ⊆ L(G) באינדוקציה על אורך המילה","שני הכיוונים על מספר הכללים","כיוון אחד מספיק תמיד"],"e":"\"כל מה שנגזר חוקי\" — עוקבים אחרי צעדי הגזירה; \"כל חוקי נגזר\" — מפרקים את המילה ובונים גזירה. שני חצאים שונים באופיים — וששניהם חייבים להופיע (לפחות רעיונית).","a":1},{"q":"מה הכשל בדקדוק ש\"עובד על כל הדוגמאות שניסיתי\"?","c":["אין כשל — בדיקת דוגמאות מספיקה","דקדוק חייב בדיקה על אינסוף דוגמאות ולכן לעולם לא נכון","הכשל רק אם הדוגמאות קצרות","ייתכן שהוא יוצר גם מילים מחוץ לשפה (או מפספס חוקיות) — דוגמאות אינן הוכחה"],"e":"הפער האופייני: הכלה חד-כיוונית. בדקו במיוחד ε, מילים חד-אותיות, וגבולות התנאי — ואז נסחו את שני כיווני הטיעון.","a":3},{"q":"מה רמת הפירוט המקובלת בקורס להוכחת נכונות דקדוק בשאלת בנייה?","c":["רק דוגמת גזירה אחת","הסבר קצר וממוקד שמכסה את שני הכיוונים — כמו בפתרונות הרשמיים — אלא אם נדרשה הוכחה מלאה","תמיד אינדוקציה כפולה מלאה","אין צורך בשום נימוק"],"e":"‏2023ב ש1.3א: \"הסבירו בקצרה\". הפתרון הרשמי נותן שורה-שתיים לכל ענף. כשכתוב \"הוכיחו\" בלי הקלה — מפרטים יותר. קראו את הדרישה.","a":1}]},{"t":"סגירויות של חסרות הקשר","q":[{"q":"איך מוכיחים שח\"ה סגורה לאיחוד\/שרשור\/כוכב?","c":["בהיפוך המקבלים","בעזרת למת הניפוח","בכללי דקדוק חדשים: S→S₁|S₂, ‏S→S₁S₂, ‏S→S₁S|ε (עם משתנים זרים)","בבניית מכפלה של שני PDA"],"e":"עם דקדוקים אלה בניות בנות שורה. מכפלת PDA לא קיימת (שתי מחסניות!) — וזו הסיבה העמוקה שאין סגירות לחיתוך.","a":2},{"q":"אילו שתי סגירויות \"מעורבות\" עם רגולריות שירתו את מבחני 2023–2024?","c":["חיתוך ח\"ה עם רגולרית, והצבה רגולרית\/חסרת הקשר","חיתוך שתי ח\"ה ומשלים","הפרש שתי ח\"ה ואיחוד אינסופי","אין כאלה"],"e":"‏2024א ש1.3: ‏L′∩L₁ (חיתוך עם רגולרית); 2023א ש3.4 ו-2023ב ש3.3: שרשרת הצבות וסימונים. שתי הסגירויות האלה הן ארגז הכלים של שאלות ה-CFL.","a":0},{"q":"מדוע דורשים משתנים זרים לפני שממזגים שני דקדוקים?","c":["כי אסור ששני דקדוקים יחלקו טרמינלים","אין צורך אמיתי — רק מוסכמה","כדי שכללי דקדוק אחד לא יופעלו בטעות על משתני האחר וישנו את השפות","כדי לחסוך משתנים"],"e":"אם לשניהם משתנה בשם A, גזירה יכולה \"לזלוג\" בין הדקדוקים וליצור מילים זרות. שינוי שמות (α-renaming) פותר — אבל חובה לציין אותו.","a":2}]},{"t":"מה חסרות הקשר לא סוגרות","q":[{"q":"מהי הדוגמה הקלאסית לכך ש-CFL אינה סגורה לחיתוך?","c":["<span class=\"math\">{a<sup>n<\/sup>} ∩ {b<sup>n<\/sup>} = ∅<\/span>","<span class=\"math\">{ww} ∩ Σ<sup>*<\/sup><\/span>","<span class=\"math\">PAL ∩ PAL<\/span>","<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>m<\/sup>} ∩ {a<sup>m<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>} = {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>}<\/span>"],"e":"כל אחת ח\"ה (זיווג אחד), החיתוך דורש שני זיווגים בו-זמנית — ‏aⁿbⁿcⁿ שאיננה ח\"ה (פרק 8). לכן ✗ לחיתוך.","a":3},{"q":"איך נובעת אי-הסגירות למשלים מאי-הסגירות לחיתוך?","c":["היא לא נובעת — אלה עובדות נפרדות","מדה-מורגן: סגירות למשלים (עם האיחוד הקיים) הייתה גוררת סגירות לחיתוך — סתירה","כי המשלים של דקדוק אינו דקדוק","כי המשלים תמיד אינסופי"],"e":"‏A∩B = ¬(¬A∪¬B). יש ✓ לאיחוד; אילו היה ✓ למשלים — היה ✓ לחיתוך, בסתירה לדוגמה. בדיוק הטיעון של XOR במבחן לדוגמה ש3.4.","a":1},{"q":"\"אם L₁ ח\"ה ו-L₂ רגולרית אז L₁∖L₂ ח\"ה\" — נכון או לא?","c":["לא נכון — הפרש דורש משלים של ח\"ה","נכון רק כש-L₂ סופית","לא נכון — ח\"ה לא סגורה לשום הפרש","נכון — <span class=\"math\">L₁∖L₂ = L₁ ∩ <span class=\"comp\">L₂<\/span><\/span>, והמשלים של רגולרית רגולרי"],"e":"המשלים נלקח על הרגולרית (מותר!) ואז חיתוך-עם-רגולרית (מותר). לעומת זאת Σ*∖L₁ = משלים של ח\"ה — אסור. הכיוון של ההפרש מכריע — נקודה קלאסית לשאלות נכון\/לא נכון.","a":3}]}]},{"sid":"ch7","topics":[{"t":"PDA — ההגדרה הפורמלית","q":[{"q":"מה מוסיפה השישייה של PDA על החמישייה של NFA?","c":["סרט קריאה דו-כיווני","אלף-בית מחסנית Γ, ופונקציית מעברים שקוראת ומעדכנת גם את ראש המחסנית","פונקציית פלט","קבוצת מצבים אינסופית"],"e":"‏(Q,Σ,Γ,δ,q_s,F) עם δ: Q×Σ_ε×Γ_ε→P(Q×Γ_ε). המחסנית היא כל התוספת — אבל היא מקפיצה את הכוח ממחלקת REG ל-CFL.","a":1},{"q":"מה פירוש התווית <span class=\"math\">σ, γ → γ′<\/span> על חץ?","c":["עבור ממצב σ למצב γ","החלף את כל תוכן המחסנית מ-γ ל-γ′","קרא γ ודחוף σ","קרא σ מהקלט, הוצא γ מראש המחסנית, ודחוף γ′ — וכל אחד מהם יכול להיות ε"],"e":"שלושה רכיבים: קלט (או בלי), pop (או בלי), push (או בלי). למשל ε,ε→$ = דחיפת תחתית בלי לגעת בקלט; 1,0→ε = קרא 1 ופרוק 0.","a":3},{"q":"האם Γ חייב להיות שווה ל-Σ?","c":["לא — אבל אסור ש-Γ יכיל את Σ","לא — Γ חופשי, ואף מרחיבים אותו בכוונה (סמלי $, אותיות מסומנות, ואפילו שמות מצבים)","כן — המחסנית שומרת אותיות קלט בלבד","כן, עד כדי תוספת $ יחיד"],"e":"‏Γ הוא זיכרון פנימי חופשי. הבנייה של 2023ב ש1.4 דוחפת שמות מצבים של DFA (‏Γ ⊇ Q_B) — הרחבת Γ יצירתית היא כלי תכנון מרכזי.","a":1}]},{"t":"צעד חישוב — לקרוא, להוציא, לדחוף","q":[{"q":"מתי מעבר שדורש pop של הסמל 0 זמין?","c":["כאשר 0 נמצא איפשהו במחסנית","רק אם המחסנית ריקה","רק כאשר 0 נמצא כרגע בראש המחסנית — ואז הוא מוסר בביצוע","תמיד — אם אין 0, המעבר מתבצע בלי pop"],"e":"‏pop = תנאי-וגם-פעולה על ראש המחסנית בלבד. מחסנית ריקה או ראש שונה ⇒ המעבר לא זמין והריצה (בענף הזה) נתקעת.","a":2},{"q":"בשביל מה דוחפים סמל תחתית $ בצעד הראשון?","c":["כדי שיהיה אפשר לזהות בהמשך שהמחסנית \"התרוקנה\" — pop של $ מעיד שהגענו לתחתית","כי ההגדרה דורשת מחסנית לא ריקה","כדי לסמן את סוף הקלט","כדי למנוע ריצות אינסופיות"],"e":"ההגדרה לא נותנת חיישן \"מחסנית ריקה\" — הקונבנציה $ מדמה אותו: כש-$ נחשף, כל מה שנדחף מעליו נפרק. כמעט כל בנייה בקורס פותחת ב-ε,ε→$.","a":0},{"q":"ממה מורכבת קונפיגורציה (תמונת-מצב) של PDA?","c":["מצב וראש המחסנית","תוכן המחסנית בלבד","מצב, יתרת הקלט, ותוכן המחסנית המלא","מצב בלבד"],"e":"שלושת הרכיבים דרושים לקבוע מה אפשרי הלאה. ראש המחסנית קובע את הצעד הקרוב, אבל ההמשך תלוי בכל התוכן — לכן הוא חלק מהקונפיגורציה.","a":2}]},{"t":"ריצות וקבלה — הדוגמה 0ⁿ1ⁿ","q":[{"q":"מהו תנאי הקבלה של PDA בקורס?","c":["כל הריצות מסתיימות במצב מקבל","המחסנית ריקה בסוף — ללא תלות במצב","הריצה עוברת דרך מצב מקבל בשלב כלשהו","קיימת ריצה שצורכת את כל הקלט ומסתיימת במצב מקבל"],"e":"כמו NFA: ∃ ריצה מקבלת (אחרי צריכת כל הקלט). ריקון המחסנית אינו חלק מההגדרה — אם רוצים אותו, מקודדים עם $ (כמו ב-0ⁿ1ⁿ).","a":3},{"q":"ב-PDA של <span class=\"math\">0<sup>n<\/sup>1<sup>n<\/sup><\/span> — למה המילה 001 נדחית?","c":["כי המחסנית התרוקנה מוקדם מדי","בסוף הקלט נשאר 0 על המחסנית — ה-$ לא נחשף ואי אפשר להגיע למצב המקבל","כי המעבר 1,0→ε נכשל","כי היא לא מתחילה ב-1"],"e":"שני push ואחד pop ⇒ עודף 0. המעבר ε,$→ε דורש $ בראש — חסום. (ב-011 המצב הפוך: pop שני נתקע כי $ בראש — שני סוגי הכישלון של השוואת בלוקים.)","a":1},{"q":"מדוע המצב ההתחלתי ב-PDA הזה גם מקבל?","c":["טעות בבנייה","כי כל מצב התחלתי חייב לקבל","כדי לקצר את הריצות","כדי לקבל את ε — המילה הריקה שייכת לשפה (n=0)"],"e":"‏ε∈L דורש שקיים מסלול מקבל בלי צריכת קלט — הפשוט ביותר: ההתחלה עצמה מקבלת. אותה נקודת ε שנבדקת בכל בנייה (השוו לתנאי q_s∈F ב-DFA).","a":3}]},{"t":"תבניות תכנון PDA","q":[{"q":"איך PDA מזהה <span class=\"math\">{w | #₀(w) = #₁(w)}<\/span> (בכל סדר)?","c":["המחסנית מחזיקה את העודף הנוכחי של האות הרווחת, והמצב זוכר איזו אות בעודף","דוחפים את כל המילה ואז סופרים","משווים את שני חצאי המילה","אי אפשר — השפה אינה ח\"ה"],"e":"בדיוק ה-PDA של הפתרון הרשמי 2024ב ש3.3: ב-q₁ עודף 0-ים (0 דוחף x, 1 פורק), ב-q₂ עודף 1-ים, ומעברי ε,$→$ מחליפים צד כשהעודף מתאפס.","a":0},{"q":"לזיהוי <span class=\"math\">{ww<sup>R<\/sup>}<\/span>, מה עושה ה-PDA?","c":["משווה את האות הראשונה לאחרונה","דוחף את כל המילה פעמיים","דוחף אותיות, מנחש ב-ε את נקודת האמצע, ואז פורק תוך השוואה לאותיות הנקראות","סופר את אורך המילה ומחלק בשניים"],"e":"ההיפוך הוא ידיד המחסנית: הפריקה יוצאת בסדר הפוך לדחיפה — בדיוק סדר w^R. את האמצע אי אפשר לדעת — מנחשים (וזו הסיבה שדטרמיניסטי לא מספיק ל-PAL).","a":2},{"q":"בבניית Op של 2023ב ש1.4, ה-PDA דוחף את שם המצב של ה-DFA למחסנית. בשביל מה?","c":["לשמור \"כתובת חזרה\": אחרי שהוא מסיים לקרוא את v∈L₁ הוא שולף את המצב וממשיך את סימולציית B בדיוק מאותה נקודה","לספור כמה מצבים יש ל-B","לסמן שהקלט נגמר","לזהות לולאות ב-B"],"e":"תבנית \"קריאה לתת-שגרה\": push המצב לפני הקפיצה ל-A, ‏pop בחזרה אחרי מצב מקבל של A. המחסנית כזיכרון-קריאות — הרעיון האלגנטי ביותר במבחני ה-PDA.","a":0}]},{"t":"אי־דטרמיניזם ב־PDA הוא מהותי","q":[{"q":"\"לכל PDA קיים PDA דטרמיניסטי שקול\" — נכון או לא?","c":["לא נכון — כי לדטרמיניסטי אסור ε","לא נכון — יש שפות ח\"ה (כמו PAL) שאף PDA דטרמיניסטי לא מזהה","נכון — כמו בבניית תת-הקבוצות","נכון עבור שפות אינסופיות בלבד"],"e":"כאן הניחוש מוסיף כוח אמיתי (בניגוד ל-NFA): ניחוש האמצע ב-PAL אינו ניתן לדטרמיניזציה. לכן CFL מוגדרת דרך PDA אי-דטרמיניסטי.","a":1},{"q":"מה הקשר בין חוסר הדטרמיניזציה לאי-הסגירות של CFL למשלים?","c":["אין קשר — שתי עובדות נפרדות","המשלים דורש שתי מחסניות","דווקא יש סגירות למשלים","טריק היפוך-המקבלים דורש ריצה יחידה לכל מילה — ואין דרך להבטיח זאת ב-PDA"],"e":"ב-DFA המשלים היה חינם בזכות הדטרמיניזם. ב-PDA \"∃ ריצה מקבלת\" לא מתהפך להיפוך מצבים — ובאמת CFL לא סגורה למשלים. הכשל הטכני והעובדה המחלקתית — אותו סיפור.","a":3},{"q":"מדוע דווקא PAL (פלינדרומים) היא הדוגמה לניחוש הכרחי?","c":["כי המחסנית לא יכולה להכיל אותיות זהות","כדי לפרוק מול הסיפא חייבים להתחיל בדיוק באמצע — ואת מיקום האמצע אי אפשר לדעת לפני סוף הקלט","כי פלינדרומים אינם ח\"ה","כי ב-PAL יש אינסוף מילים"],"e":"האסטרטגיה היחידה היא דחוף-חצי-פרוק-חצי, ונקודת המעבר לא מסומנת. א\"ד מנסה את כולן במקביל; דטרמיניסטי חייב להתחייב — ומפסיד. (פורמלית מוכיחים בכלים מעבר לקורס — את העובדה מצטטים.)","a":1}]},{"t":"PDA ← CFG — הבנייה","q":[{"q":"בבניית ה-PDA מדקדוק, מה עושה המעבר <span class=\"math\">ε, A → α<\/span>?","c":["מוחק את הכלל מהדקדוק","מסמן את A כמעובד","מחליף משתנה בראש המחסנית בצד הימני של כלל — צעד גזירה על המחסנית","קורא את α מהקלט"],"e":"המחסנית מחזיקה את \"היתרה לגזירה\"; כשמשתנה בראש — מנחשים כלל ומחליפים. יחד עם a,a→ε (אימות טרמינלים מול הקלט) מתקבלת סימולציה של גזירה שמאלית.","a":2},{"q":"מדוע הסימולציה היא דווקא של גזירה שמאלית?","c":["כי ראש המחסנית הוא תמיד הסמל השמאלי ביותר שטרם טופל — משתנה שמוחלף או טרמינל שמאומת","כי הקלט נקרא מימין לשמאל","זה שרירותי — יכולנו גם ימנית","כי הדקדוק חייב להיות ב-CNF"],"e":"‏α נדחף כך שהסמל השמאלי בראש; טרמינלים שנחשפים מאומתים מיד מול הקלט. המשתנה השמאלי ביותר תמיד מטופל ראשון — בדיוק ההגדרה של גזירה שמאלית.","a":0},{"q":"כמה מצבים יש ב-PDA שנבנה מדקדוק בשיטת דף הנוסחאות?","c":["אחד לכל כלל","תלוי בגודל השפה","שלושה — כל המידע האמיתי חי במחסנית","אחד לכל משתנה"],"e":"‏q_start, q_loop, q_accept — קבוע! העומק כולו במחסנית. הדגמה חיה לכך שכוחו של PDA במחסנית ולא במצבים.","a":2}]},{"t":"דקדוק מפושט — הסרת כללי ε","q":[{"q":"בהסרת <span class=\"math\">A → ε<\/span>, מה מוסיפים עבור כלל כמו <span class=\"math\">B → αAβAγ<\/span>?","c":["רק את αβγ (השמטת כולם)","רק את αβAγ (השמטת הראשון)","כלום — מוחקים את הכלל כולו","עותק לכל תת-קבוצה של מופעי A מושמטים: αβAγ, αAβγ וגם αβγ"],"e":"כל מופע של A היה יכול לגזור ε באופן עצמאי — לכן כל קומבינציה של השמטות חייבת עותק. \"הכול או כלום\" מפספס מילים; זו הטעות הנפוצה בתרגילי הפישוט.","a":3},{"q":"מה עושים כשהסרת <span class=\"math\">A → ε<\/span> פוגשת כלל <span class=\"math\">B → A<\/span>?","c":["מוסיפים B → B","מוסיפים B → ε — אלא אם כלל כזה כבר הוסר בעבר, ואז לא מחזירים אותו","תמיד מוסיפים B → ε","מוחקים את B מהדקדוק"],"e":"השמטת ה-A מ-B→A נותנת B→ε — כלל ε חדש שיטופל בתורו. אבל אם B→ε כבר עבר הסרה — החזרתו תיצור לולאה אינסופית. \"לא מחיים מתים\" — הכלל שדף הנוסחאות מציין במפורש.","a":1},{"q":"איך מטפלים במקרה <span class=\"math\">ε ∈ L<\/span>?","c":["משאירים את כל כללי ה-ε","מוותרים על הפישוט","מוחקים את ε מהשפה בשקט","מריצים את ההסרה, ואז מוסיפים התחלה חדשה S′ → S | ε"],"e":"היעד: כללי ε בלבדי מותר הוא בהתחלה שאינה מופיעה בשום צד ימין. S′ החדש מספק בדיוק את זה — ε נשמרת בשפה, והשאר נקי.","a":3}]},{"t":"הסרת כללי יחידה","q":[{"q":"איך מסירים כלל יחידה <span class=\"math\">A → B<\/span>?","c":["מוחקים אותו, ולכל כלל B → α מוסיפים A → α","ממזגים את A ו-B למשתנה אחד תמיד","מוחקים את כל כללי B","מחליפים אותו ב-A → BB"],"e":"‏A \"מאמץ\" את היכולות של B ומוותר על התיווך. מיזוג משתנים עלול לשבש כללים אחרים שמזכירים רק את אחד מהם — האימוץ בטוח תמיד.","a":0},{"q":"מדוע מסירים כללי ε לפני כללי היחידה?","c":["הסדר לא משנה","כי כללי ε קצרים יותר","כי הסרת ε מייצרת כללי יחידה חדשים (מ-B → AC עם C → ε נשאר B → A)","כי כללי יחידה חוסמים את הסרת ה-ε"],"e":"כל השמטה שמותירה סמל בודד יוצרת כלל יחידה טרי. בסדר ההפוך היינו צריכים סבב יחידה נוסף. לכן דף הנוסחאות מקבע: ε ואז יחידה (ואז נרמול).","a":2},{"q":"מה קורה עם שרשרת <span class=\"math\">A → B, B → C<\/span> בתהליך?","c":["הסרת A → B עם אימוץ יוצרת A → C — כלל יחידה חדש שיוסר בסבב הבא; התהליך מתכנס","התהליך נתקע בלולאה","חובה להסיר את כל השרשרת בצעד אחד","C נמחק מהדקדוק"],"e":"האלגוריתם איטרטיבי בכוונה — כל אימוץ עשוי לחשוף יחידה חדשה, ומספרן חסום (זוגות משתנים) ולכן העצירה מובטחת. אין צורך בטיפול מיוחד בשרשראות.","a":0}]},{"t":"צורת חומסקי הנורמלית (CNF)","q":[{"q":"אילו צורות כללים מותרות ב-CNF?","c":["A → σB בלבד","A → BC (שני משתנים, לא S) או A → σ (טרמינל יחיד); ול-S → ε מותר רק אם ε בשפה","A → BC או A → BCD","כל כלל באורך ≤ 2"],"e":"בדיוק שתיים: הסתעפות בינארית של משתנים, או פליטת טרמינל. הצורה A→σB היא של דקדוק רגולרי פשוט — מושג אחר!","a":1},{"q":"מה סדר ארבעת השלבים בהמרת CFG ל-CNF?","c":["נרמול; ε; יחידה; התחלה","יחידה; ε; נרמול; התחלה","אין סדר מחייב","התחלה חדשה S′→S; הסרת ε; הסרת יחידה; נרמול הכללים הארוכים (טרמינלים→משתנים ופיצול בינארי)"],"e":"הסדר מדף הנוסחאות מונע עבודה כפולה: S′ מגן על ההתחלה, ε לפני יחידה (כי הוא מייצר יחידות), והנרמול המכני אחרון.","a":3},{"q":"כמה צעדי גזירה דורשת מילה באורך n > 0 בדקדוק CNF?","c":["תלוי בדקדוק","בדיוק 2n−1: ‏n−1 הסתעפויות בינאריות ו-n פליטות טרמינל","בדיוק n","לכל היותר log n"],"e":"עץ בינארי עם n עלים מכיל n−1 צמתים פנימיים מסועפים; כל עלה דורש פליטה. הקביעוּת הזו היא שהופכת את CNF לבסיס לניתוחים (ניפוח, אלגוריתמים).","a":1}]},{"t":"היררכיית חומסקי — התמונה המלאה","q":[{"q":"מהו סדר ההכלות הנכון?","c":["CFL ⊊ REG ⊊ RE ⊊ R","REG = CFL ⊊ R = RE","REG ⊊ CFL ⊊ R ⊊ RE","REG ⊊ R ⊊ CFL ⊊ RE"],"e":"רגולריות בפנים, מעליהן חסרות הקשר, מעליהן הכריעות, ואז הניתנות לזיהוי. כל ההכלות ממש — עם עד מפריד לכל קומה.","a":2},{"q":"איזו שפה מעידה על <span class=\"math\">R ∖ CFL ≠ ∅<\/span>?","c":["<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup>}<\/span> — מכונת טיורינג מכריעה אותה בקלות אך היא אינה ח\"ה","<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>}<\/span>","<span class=\"math\">A<sub>TM<\/sub><\/span>","<span class=\"math\">PAL<\/span>"],"e":"שני זיווגים סימולטניים מפילים את המחסנית (יוכח בלמת הניפוח לח\"ה), אבל מ\"ט פשוט מוחקת אות מכל בלוק בסיבוב. aⁿbⁿ ו-PAL הן CFL; A_TM מפרידה קומה גבוהה יותר.","a":0},{"q":"באיזו קומה של ההיררכיה יושבת <span class=\"math\">A<sub>TM<\/sub><\/span>?","c":["מחוץ ל-RE","ב-CFL ∖ REG","ב-RE ∖ R — ניתנת לזיהוי אך לא להכרעה","ב-R ∖ CFL"],"e":"מזהים אותה בסימולציה (פרק 11), אבל משפט האלכסון יראה שאין מכריע. המשלים שלה כבר מחוץ ל-RE — הקומה העליונה של המפה.","a":2}]}]},{"sid":"ch8","topics":[{"t":"PDA מפושט","q":[{"q":"מהם שלושת תנאי ה-PDA המפושט?","c":["מקבל יחיד; מחסנית ריקה לפני קבלה; וכל מעבר הוא push בלבד או pop בלבד","בלי מעברי ε; מצב יחיד; מחסנית חסומה","דטרמיניסטי; מקבל יחיד; בלי לולאות","מחסנית ריקה בהתחלה; קלט לא ריק; שני מצבים"],"e":"השלושה מדף הנוסחאות. המבנה הזה הופך כל ריצה מקבלת לרצף מאוזן של דחיפות והוצאות — התשתית של הבנייה PDA→CFG.","a":0},{"q":"מדוע דורשים שכל מעבר יהיה push-בלבד או pop-בלבד?","c":["כדי להפוך את האוטומט לדטרמיניסטי","כדי למנוע ריקון המחסנית","כדי שכל ריצה תהיה רצף מאוזן שניתן לפרק רקורסיבית — הסמל שנדחף ראשון יורד אחרון","כדי לחסוך מעברים"],"e":"כמו סוגריים מאוזנים: לכל push יש pop מזווג. הזיווג הזה הוא בדיוק מה שכללי העטיפה A_{p,q} → σ′A_{r,s}σ″ מתרגמים לדקדוק.","a":2},{"q":"האם ההגבלה למפושט מקטינה את מחלקת השפות המזוהות?","c":["לא — כל PDA ניתן להמרה למפושט שקול בתוספות טכניות","כן — מפושט מזהה רק שפות רגולריות","כן — מאבדים את השפות עם ε","רק מעל אלף-בית בינארי"],"e":"מרוקנים מחסנית לפני קבלה, מאחדים מקבלים, ומפצלים מעברים מורכבים דרך מצבי ביניים — הכול משמר שפה. לכן מותר להניח מפושט בכל בנייה.","a":0}]},{"t":"השפות L_{p,q} — הרעיון","q":[{"q":"מהי <span class=\"math\">L<sub>p,q<\/sub><\/span> בבניית PDA→CFG?","c":["המילים שעוברות מ-p ל-q בלי לגעת במחסנית","כל המילים שמבקרות גם ב-p וגם ב-q","המילים באורך |Q|","המילים שמריצות את האוטומט מ-p עם מחסנית ריקה אל q עם מחסנית ריקה"],"e":"\"ריק אל ריק\" הוא החלק המהותי — הוא הופך את הריצה ליחידה מאוזנת ועצמאית, וב-PDA מפושט L(P)=L_{q_s,q_f} בדיוק.","a":3},{"q":"מהם שני אופני הפירוק של ריצה מאוזנת מ-p ל-q?","c":["אין פירוק — הריצה אטומית","התרוקנות באמצע (שרשור דרך r) — או שהסמל הראשון יורד רק בסוף (עטיפה push…pop)","פיצול לפי אמצע הקלט","לפי המצב המקבל הקרוב"],"e":"או שהמחסנית נוגעת ברצפה בדרך (⇒ L_{p,r}·L_{r,q}), או שלא (⇒ הצעד הראשון והאחרון מזווגים, והפנים מאוזן). שני המקרים = שני סוגי הכללים בדקדוק.","a":1},{"q":"למה מזכירה <span class=\"math\">L<sub>p,q<\/sub><\/span> את <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> הרגולרית, ובמה היא שונה?","c":["אין קשר בין השתיים","היא זהה לגמרי","היא מוגדרת רק למצבים מקבלים","אותו רעיון \"שפת קטע\" בין מצבים — אבל עם דרישת מחסנית ריקה בקצוות שמאפשרת הרכבה"],"e":"שתיהן מפרקות ריצות לקטעים ניתנים-להרכבה. אצל DFA כל חיתוך מצב מספיק; אצל PDA חייבים לתאם גם את המחסנית — ותנאי הריק הוא נקודת התיאום.","a":3}]},{"t":"CFG ← PDA — המשתנים A_{p,q} והכללים","q":[{"q":"מה תפקידו של המשתנה <span class=\"math\">A<sub>p,q<\/sub><\/span>?","c":["לייצג את הסמל בראש המחסנית","לספור את אורך הריצה","לגזור בדיוק את מילות <span class=\"math\">L<sub>p,q<\/sub><\/span>","לסמן שהאוטומט במצב p"],"e":"משתנה לכל זוג מצבים, והאינווריאנטה: A_{p,q} ⇒* w ⟺ w ∈ L_{p,q}. ההתחלה: S = A_{q_s,q_f}.","a":2},{"q":"מה מבטא הכלל <span class=\"math\">A<sub>p,q<\/sub> → σ′A<sub>r,s<\/sub>σ″<\/span> ומתי מוסיפים אותו?","c":["עטיפה: σ′ נקראת עם push של γ (‏p→r), הפנים מאוזן (r→s), ו-σ″ נקראת עם pop של אותו γ (‏s→q)","מעבר כפול בין מצבים שכנים","שרשור שתי ריצות שמתרוקנות באמצע","כלל בסיס לריצה ריקה"],"e":"מוסיפים כשקיים γ עם (r,γ)∈δ(p,σ′,ε) ו-(q,ε)∈δ(s,σ″,γ) — הזיווג דחיפה-הוצאה של אותו סמל. השרשור הוא הכלל A_{p,q}→A_{p,r}A_{r,q}, והבסיס A_{p,p}→ε.","a":0},{"q":"כמה משתנים יש בדקדוק שנבנה מ-PDA מפושט עם |Q| מצבים?","c":["מספר המעברים","תלוי בגודל המחסנית","<span class=\"math\">|Q|²<\/span> — משתנה לכל זוג סדור של מצבים","|Q|"],"e":"‏A_{p,q} לכל זוג. לכן במבחן מצטטים את הבנייה ומסבירים — לא מריצים אותה על אוטומט של 5 מצבים (25 משתנים ומאות כללים).","a":2}]},{"t":"משפט השקילות ומסקנותיו","q":[{"q":"איך מוכיחים שחיתוך של ח\"ה עם רגולרית הוא ח\"ה?","c":["אי אפשר — החיתוך לא סגור","מריצים PDA ו-DFA במקביל במכפלת מצבים — עם המחסנית היחידה של ה-PDA","בונים דקדוק חדש מאיחוד הכללים","ממירים את הרגולרית לדקדוק ומצליבים כללים"],"e":"מצבי המכפלה (q_PDA, q_DFA), הקלט מזיז את שניהם, המחסנית של ה-PDA בלבד. עובד בדיוק כי ל-DFA אין מחסנית משלו. הסגירות שכל שאלה 1 במבחן משתמשת בה.","a":1},{"q":"מדוע אותה בניית מכפלה נכשלת לחיתוך שתי ח\"ה?","c":["כי המצבים לא מסתדרים","כי חסר מצב התחלתי משותף","היא לא נכשלת — החיתוך סגור","כי נדרשות שתי מחסניות עצמאיות — וזה כבר מודל חזק ממש יותר (שקול למכונת טיורינג)"],"e":"שני PDA = שתי מחסניות; מכונה עם שתי מחסניות מדמה מ\"ט. ובאמת {aⁿbⁿcᵐ}∩{aᵐbⁿcⁿ}={aⁿbⁿcⁿ} מוכיח שהסגירות נשברת.","a":3},{"q":"בשאלת \"הראו שהשפה ח\"ה\" — מה מותר להגיש?","c":["רק שרשרת סגירויות","דקדוק או PDA — לפי הנוח, אלא אם השאלה מכתיבה (כמו \"ע\"י ציור דיאגרמת מצבים\" ב-2024ב ש3.3)","רק דקדוק","רק PDA"],"e":"המשפט מבטיח ששני הייצוגים שקולים. אבל קראו את הדרישה: 2024ב ש3.3 ביקשה במפורש PDA מצויר; 2023ב ש1.3 ביקשה דקדוק. כשאין הכתבה — גם סגירויות כשרות.","a":1}]},{"t":"למת הניפוח לח\"ה — הנוסח","q":[{"q":"לכמה חלקים מתחלקת המילה בלמת הניפוח לח\"ה, ומי נשאב?","c":["חמישה — uvxyz — ו-v,y נשאבים יחד באותו מספר עותקים","שלושה — xyz — ו-y נשאב","חמישה — וכל חלק נשאב בנפרד","ארבעה — uvxy"],"e":"‏uv^i xy^i z: שני חלקים מתואמים סביב x. התיאום (אותו i לשניהם!) משקף שמקורם באותו משתנה חוזר — ההבדל המהותי מהגרסה הרגולרית.","a":0},{"q":"מה קובעים תנאים 1 ו-2 של הלמה?","c":["<span class=\"math\">|x| &gt; 0<\/span> ו-<span class=\"math\">|w| ≤ p<\/span>","אין תנאים מלבד השאיבה","<span class=\"math\">|vy| &gt; 0<\/span> (לא שניהם ריקים) ו-<span class=\"math\">|vxy| ≤ p<\/span> (החלון קצר — אך יכול לשבת בכל מקום במילה)","<span class=\"math\">|v|,|y| &gt; 0<\/span> שניהם, ו-<span class=\"math\">|uv| ≤ p<\/span>"],"e":"דקויות שנבחנות: מותר ש-v או y (אחד מהם) ריק; והחלון vxy — בניגוד לרגולרית — לא צמוד להתחלה. לכן מיצוי המקרים בהוכחות עשיר יותר.","a":2},{"q":"מה אורך <span class=\"math\">uv<sup>i<\/sup>xy<sup>i<\/sup>z<\/span> במונחי |w|?","c":["<span class=\"math\">|w| + (i−1)(|v|+|y|)<\/span>","<span class=\"math\">|w|·i<\/span>","<span class=\"math\">|w| + i<\/span>","<span class=\"math\">|w| + (i−1)|x|<\/span>"],"e":"שני החלקים גדלים יחד — התוספת (i−1)(s+t). ההערה מופיעה בדף הנוסחאות; חיונית לשפות שתנאין על האורך (ריבועים, ראשוניים).","a":0}]},{"t":"מאיפה הלמה — משתנה חוזר בעץ גבוה","q":[{"q":"מה ממלא בגרסת הח\"ה את התפקיד של \"מצב חוזר בריצה\"?","c":["כלל שמופעל פעמיים","טרמינל שמופיע פעמיים במילה","שני עצים שונים לאותה מילה","משתנה שמופיע פעמיים על מסלול שורש-עלה בעץ הגזירה"],"e":"מילה ארוכה ⇒ עץ גבוה ⇒ מסלול ארוך ⇒ משתנה A חוזר (שובך יונים על V). שני מופעי ה-A הם צירי השכפול\/קיצוץ.","a":3},{"q":"איך מקבלים את <span class=\"math\">uv²xy²z<\/span> מהעץ?","c":["מוחקים את תת-העץ הפנימי","מדביקים את תת-העץ של המופע החיצוני של A במקום המופע הפנימי — v ו-y משתכפלים יחד","מוסיפים עותק של כל העץ","הופכים את סדר הבנים"],"e":"החיצוני גוזר vxy, הפנימי x. החלפה פנימית⇐חיצונית משכפלת (i=2); חיצונית⇐פנימית מקצצת (i=0, נותן uxz). התיאום v-y מגיע חינם — אותו A.","a":1},{"q":"מדוע אפשר להבטיח <span class=\"math\">|vxy| ≤ p<\/span>?","c":["כי כל מילה קצרה מ-p","כי בוחרים v ו-y ריקים","אי אפשר להבטיח — התנאי בערך","בוחרים את החזרה הנמוכה ביותר בעץ — שם תת-העץ (שגוזר את vxy) קטן וחסום"],"e":"חזרה \"עמוקה\" (קרוב לעלים) ⇒ תת-עץ נמוך ⇒ גזירה קצרה. עם CNF מכמתים: תת-עץ בגובה h גוזר ≤ 2^{h-1} אותיות, ומכאן קבוע p=2^{|V|+1}-ish. הרעיון חשוב; החשבון פחות.","a":3}]},{"t":"מבנה הוכחת ניפוח לח\"ה — המקרים","q":[{"q":"מהו פירו c<sup>n<\/sup>} ∉ CFL<\/span>?","c":["‏PDA חזק ממ\"ט","‏CFL ⊊ R ממש — כי מ\"ט מכריעה את השפה בקלות אבל היא אינה ח\"ה","‏REG = CFL","השפה גם לא ב-R"],"e":"העד הקלאסי לקומה שבין CFL ל-R: מכונת טיורינג מוחקת אות מכל בלוק בכל סיבוב ומכריעה — אבל מחסנית אחת לא מספיקה. גם עד האי-סגירות לחיתוך.","a":1}]},{"t":"סגירויות בשירות אי־ח\"ה","q":[{"q":"מהי תבנית \"סמן-חתוך-מחק\"?","c":["הצבה שמסמנת אותיות, חיתוך עם רגולרית שכופה תבנית סימון, והצבה שמוחקת — עד שמגיעים לשפה ידועה כלא-ח\"ה","שיטה לבניית PDA","אלגוריתם המרה ל-CNF","טכניקת ניפוח מקוצרת"],"e":"שלוש פעולות סגורות בח\"ה שמזקקות מהשפה הנתונה שפה מוכרת. 2023א ש3.4 ({a^{p+1}}) ו-2023ב ש3.3 ({a^{2n²}}) — אותה תבנית, מילה במילה.","a":0},{"q":"בשרשרת סגירויות לאי-ח\"ה, אילו פעולות אסורות?","c":["הצבה רגולרית","חיתוך עם רגולרית","משלים, חיתוך שתי ח\"ה, והפרש — ח\"ה לא סגורה להן","איחוד ושרשור"],"e":"השרשרת תקפה רק אם כל צעד סגור. שימוש ב\"אילו הייתה ח\"ה גם המשלים היה\" — שגוי מהיסוד. בודקים כל חוליה מול טבלת הסגירויות.","a":2},{"q":"מתי בוחרים בדרך העקיפה במקום ניפוח ישיר?","c":["כשהשפה מזוקקת בקלות לשפה ידועה והשאלה לא דורשת ניפוח מפורש","תמיד — ניפוח מיושן","רק כשהשפה מעל אות אחת","כשאין דקדוק לשפה"],"e":"‏2023א ש1.4 דרשה במפורש למת ניפוח — שם אין ברירה. ש3.4 באותו מבחן הזמינה סגירויות (\"רשאים להשתמש בעובדה\"). קוראים את הדרישה ובוחרים את הכלי הזול.","a":0}]},{"t":"מפת ההכרעה: רגולרית \/ ח\"ה \/ אף אחת","q":[{"q":"‏<span class=\"math\">{u#v<sup>R<\/sup> | u תת-מחרוזת של v}<\/span> מול <span class=\"math\">{x#y | x=2y+1 בבינארית}<\/span> — למה הראשונה ח\"ה והשנייה לא?","c":["כי השנייה מעל ספרות","כי בראשונה יש #","שתיהן ח\"ה","היפוך (v<sup>R<\/sup>) מתיישר עם סדר המחסנית; x=y·'1' דורש התאמה באותו סדר — כמו {u#u}"],"e":"העיקרון המרכזי של המפה: מחסנית פורקת הפוך. השוואה מול היפוך — טבעית; העתק ישר — בלתי אפשרית. הזוג L002\/L009 מהמאגר מדגים בדיוק את זה.","a":3},{"q":"מה מבדיל בין <span class=\"math\">{a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i≠j or j≠k}<\/span> (ח\"ה) ל-<span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>m<\/sup> | m≠n}<\/span> (אף אחת)?","c":["אין הבדל אמיתי","\"או\" מתפרק לאיחוד של השוואות בודדות; בשנייה נדרש גם i=j וגם השוואה נגד n — שתי השוואות \"וגם\"","מספר האותיות באלף-בית","הראשונה סופית"],"e":"‏L048 מול L030 מהמאגר: איחוד ח\"ה — ח\"ה; אבל צירוף בו-זמני של שתי דרישות מונה שובר את המחסנית (סתירה דרך ניפוח\/אוגדן). לזהות \"או\" מול \"וגם\" = חצי מהדריל.","a":1},{"q":"מה בודקים ראשון לפני כל סיווג — לפי מפת ההכרעה?","c":["אם השפה אינסופית","אם יש בה סימן #","את אורך המילה הקצרה","מלכודות קריסה: משתנה בולע-כול, זהות אלגברית, חסם שמסופף, תנאי ריק — שהופכים את השפה לרגולרית"],"e":"רבע משפות המאגר הן מלכודות רגולריות (L011, L016, L054, L069, L081…). מי שממהר ללמת ניפוח על aⁿubⁿ עם u∈{a,b}* — מפסיד; קודם מנסים לקרוס את ההגדרה.","a":3}]}]},{"sid":"ch9","topics":[{"t":"מכונת טיורינג — ההגדרה הפורמלית","q":[{"q":"מה היחס הנדרש בין Σ, Γ ותו הרווח ␣?","c":["<span class=\"math\">Σ ⊆ Γ<\/span>, ‏<span class=\"math\">␣ ∈ Γ<\/span> אבל <span class=\"math\">␣ ∉ Σ<\/span>","<span class=\"math\">Γ ⊆ Σ<\/span> ו-<span class=\"math\">␣ ∈ Σ<\/span>","<span class=\"math\">Σ = Γ<\/span> תמיד","אין קשר בין השניים"],"e":"הסרט חייב להכיל את הקלט (Σ⊆Γ) ואת הרווח שממלא את השאר; הרווח מחוץ ל-Σ כדי שסוף הקלט יהיה מזוהה. ו-Γ חופשי להכיל סימני עבודה (X, סמנים).","a":0},{"q":"מה מחזירה פונקציית המעברים <span class=\"math\">δ(q, γ)<\/span>?","c":["קבוצת מצבים אפשריים","תו לכתיבה בלבד","שלשה: מצב חדש, תו לכתיבה בתא הנוכחי, וכיוון תנועה L או R","מצב חדש בלבד"],"e":"‏δ: Q×Γ → Q×Γ×{L,R} — קרא-כתוב-זוז בכל צעד. בקורס ההגדרה דטרמיניסטית (פונקציה), בלי ε ובלי קבוצות.","a":2},{"q":"מה מיוחד במצבים <span class=\"math\">q<sub>acc<\/sub><\/span> ו-<span class=\"math\">q<sub>rej<\/sub><\/span>?","c":["הם עוצרים את הריצה מיד — אין מעברים יוצאים מהם","הם חייבים להיות מצב אחד","הם מחליפים את F של האוטומטים ומתנהגים אותו דבר","המכונה מבקרת בהם בכל ריצה"],"e":"בניגוד ל-F של אוטומט (שנבדק רק בסוף הקלט), הגעה ל-acc\/rej מסיימת את החישוב בו-ברגע — גם באמצע הסרט. ריצה יכולה גם לא להגיע אליהם לעולם (לולאה).","a":0}]},{"t":"הסרט, הראש והצעד הבודד","q":[{"q":"מהי תמונת הפתיחה של ריצה על קלט w?","c":["‏w באמצע סרט אינסופי לשני הכיוונים והראש בסופו","סרט ריק והקלט מגיע כזרם","‏w כתוב הפוך","‏w בתחילת הסרט, רווחים אחריו, הראש על התא השמאלי, והמצב q_s"],"e":"הקלט ממוקם משמאל, הראש עליו, והשאר ␣. מכאן המכונה חופשית לנוע ולשכתב. (סרט דו-כיווני הוא וריאציה שקולה — פרק 10.)","a":3},{"q":"איזו יכולת של מ\"ט חסרה גם ל-DFA וגם ל-PDA — והיא מקור הכוח?","c":["אי-דטרמיניזם","כתיבה חופשית על הסרט ותנועה לשני הכיוונים — זיכרון גישה-חוזרת בלתי מוגבל","מספר מצבים אינסופי","קריאת הקלט יותר מפעם אחת בלבד"],"e":"‏DFA קורא פעם אחת קדימה; PDA נוגע רק בראש המחסנית. מ\"ט חוזרת, מסמנת ומשכתבת בכל מקום — למשל \"מחק זוג קצוות\" של PAL בלתי אפשרי בשני הקודמים.","a":1},{"q":"מה קורה כשמכונה מנסה לזוז שמאלה מהתא הראשון (לפי מוסכמת הקורס)?","c":["הריצה נדחית אוטומטית","הסרט מתארך שמאלה","המכונה עוצרת בלולאה","הראש נשאר במקומו והריצה ממשיכה"],"e":"מוסכמה טכנית סטנדרטית (כמו אצל סיפסר): התנגשות בקצה = הישארות. שווה שורה בתיאור מפורט; לא משנה שום דבר מהותי.","a":3}]},{"t":"קונפיגורציות והיחס ⊢","q":[{"q":"מה מקודד הכתיב <span class=\"math\">uqv<\/span> של קונפיגורציה?","c":["‏q הוא התו שנקרא כרגע","‏u ו-v שני סרטים נפרדים","תוכן הסרט הוא uv, המצב q, והראש על התו הראשון של v","‏u הקלט, v הפלט"],"e":"צילום מלא בשורה אחת: מה משמאל לראש, המצב, ומהראש והלאה. הקונפיגורציה ההתחלתית: q_s·w.","a":2},{"q":"מה מסמן <span class=\"math\">C₁ ⊢ C₂<\/span>?","c":["מעבר בצעד חישוב יחיד לפי δ","ש-C₂ קונפיגורציה מקבלת","שקילות בין קונפיגורציות","מעבר במספר כלשהו של צעדים"],"e":"‏⊢ = צעד אחד; ⊢* = אפס או יותר. ריצה = C₀ ⊢ C₁ ⊢ … — אובייקט מתמטי שאפשר לצטט, למנות ו(בהמשך) לקודד כמילה.","a":0},{"q":"מדוע חשוב שקונפיגורציה היא מחרוזת סופית?","c":["זה לא חשוב — נוחות בלבד","כדי לחסוך זיכרון","כי כך אפשר לדבר על ריצות כאובייקטים בני-קידוד — הבסיס לסימולציה ולכל טיעוני החישוביות","כי הסרט סופי"],"e":"בכל רגע רק חלק סופי מהסרט אינו רווחים. לכן ריצה היא סדרת מחרוזות — שמכונה אחרת יכולה לכתוב, לבדוק ולדמות. ההיסטוריה-כמילה תשוב בהמשך הקורס.","a":2}]},{"t":"קבלה, דחייה, לולאה — שלוש התוצאות","q":[{"q":"\"M לא מקבלת את w\" — אילו תרחישים זה כולל?","c":["אף אחד — הביטוי לא תקין","דחייה או לולאה — שניהם","רק דחייה","רק לולאה"],"e":"שלוש תוצאות אפשריות, ו\"לא מקבלת\" = שתי האחרונות. ההבחנה בין \"דוחה\" ל\"לא מקבלת\" היא בדיוק מה שמפעיל את בניות N_{M,w} במבחני 2024 (\"If M accepts, reject; otherwise loop\").","a":1},{"q":"מה פירוש \"M עוצרת (halts) על w\"?","c":["המכונה מקבלת","המכונה מפסיקה לקרוא את הקלט","המכונה מגיעה לסוף הסרט","המכונה מקבלת או דוחה — כל תוצאה שאינה לולאה"],"e":"עצירה אדישה לתשובה — רק \"החישוב הסתיים\". זו בדיוק ההבחנה ש-HALT_TM (עוצרת?) שונה מ-A_TM (מקבלת?) — שתי שפות שונות בהמשך.","a":3},{"q":"מדוע הלולאה היא \"הבעיה\" של תורת החישוביות?","c":["כי היא מסבכת את הקידוד","מבחוץ אין רגע שבו אפשר להכריז \"היא לעולם לא תעצור\" — ההמתנה לא מספקת תשובה שלילית","כי היא מבזבזת חשמל","כי מכונות אמיתיות לא יכולות לרוץ לנצח"],"e":"קבלה מתגלה בזמן סופי; אי-עצירה — לעולם לא \"מתגלה\". האסימטריה הזו היא ההבדל בין RE ל-R, והיא שתכשיל כל ניסיון להכריע את A_TM.","a":1}]},{"t":"R ו־RE — כריעה מול ניתנת לזיהוי","q":[{"q":"מה ההבדל בין מכריע (decider) למזהה (recognizer)?","c":["מכריע עוצר על כל קלט; מזהה רשאי להתלולאת על מילים שמחוץ לשפה","מכריע מהיר יותר","מזהה עוצר תמיד אבל טועה לפעמים","אין הבדל"],"e":"שניהם מקבלים בדיוק את L(M); השאלה מה קורה על ה\"לא\": מכריע חייב לדחות בזמן סופי, מזהה יכול לשתוק לנצח. R = יש מכריע; RE = יש מזהה.","a":0},{"q":"מדוע <span class=\"math\">R ⊆ RE<\/span> מיידית מההגדרות?","c":["כי כל מזהה ניתן להמרה למכריע","זה לא נכון","כל מכריע הוא בפרט מזהה — עצירה-תמיד היא תכונה נוספת, לא סותרת","כי RE מכילה את כל השפות"],"e":"אותה מכונה בדיוק משמשת. הכיוון המעניין הוא שההכלה ממש (A_TM ∈ RE∖R — פרק 11); \"כל מזהה→מכריע\" שגוי מהותית.","a":2},{"q":"לשפה L יש מזהה שמתלולאת על חלק מהמילים שמחוץ ל-L. מה אפשר להסיק?","c":["‏L ∈ RE — ומעבר לזה כלום; ייתכן שקיים מכריע אחר ו-L בכלל ב-R","‏L ∉ R בוודאות","‏L ∉ RE","‏L כריעה"],"e":"מזהה \"גרוע\" לא שולל קיום מכריע טוב — המחלקות מוגדרות ב\"קיים\". להראות L∉R דרושה הוכחה (רדוקציה\/אלכסון), לא דוגמה למכונה אחת.","a":0}]},{"t":"דוגמה מפורטת: מכריע לפלינדרומים","q":[{"q":"מה עושה מכונת ה-PAL בכל סיבוב?","c":["משווה את שני חצאי המילה בבת אחת","הופכת את המילה וכותבת אותה מחדש","סופרת אותיות a","זוכרת את התו הראשון במצב, מוחקת אותו, נוסעת לסוף, משווה ומוחקת את האחרון — וחוזרת"],"e":"התבנית \"זכור-במצב, סע, השווה, מחק, חזור\". אי-התאמה ⇒ דחייה; המילה מתכווצת עד ריק\/תו-בודד ⇒ קבלה.","a":3},{"q":"מדוע מכונת ה-PAL היא מכריע?","c":["כי היא דטרמיניסטית","כל סיבוב מקצר את המילה בשניים — מספר הסיבובים חסום והריצה עוצרת על כל קלט","כי היא לא משתמשת בלולאות","כי PAL שפה סופית"],"e":"מד-ההתקדמות (אורך המילה יורד) מבטיח עצירה — הטיעון הסטנדרטי לכך שמכונה היא decider. דטרמיניזם לבדו לא מונע לולאות!","a":1},{"q":"‏PAL אצל שלושת המודלים — מה התמונה?","c":["כולם מזהים אותה באותה קלות","רק מ\"ט מזהה אך לא מכריעה","‏DFA כן, PDA לא","‏DFA: בלתי אפשרי; PDA: אפשרי רק עם ניחוש; מ\"ט: מכריעה דטרמיניסטית בקלות"],"e":"מדרג יפה של כוח: לא-רגולרית (השוואה לא חסומה), ח\"ה עם א\"ד מהותי (ניחוש אמצע), וכריעה טריוויאלית עם סרט כתיב. אותה שפה — שלושה עולמות.","a":3}]},{"t":"טבלת מעברים — רמת המכונה","q":[{"q":"מה מקודד שם-מצב כמו <span class=\"math\">q<sub>a→<\/sub><\/span> במכונה מפורשת?","c":["את אורך הקלט","שם שרירותי חסר משמעות","את הזיכרון הסופי הנוכחי: \"ראיתי a ואני בדרך ימינה\" — המצבים נושאים את המידע החסום","את מיקום הראש על הסרט"],"e":"כמו ב-DFA — המצב הוא הזיכרון החסום; הסרט הוא הזיכרון הבלתי-חסום. מתן שמות משמעותיים הוא ההרגל שהופך טבלה לקריאה.","a":2},{"q":"בשורת הטבלה <span class=\"math\">δ(q<sub>a✓<\/sub>, b) = (q<sub>rej<\/sub>, b, R)<\/span> — מה קורה ומה משמעותו באלגוריתם PAL?","c":["התו האחרון הוא b בעוד שזכרנו a — אי-התאמת קצוות, והמכונה דוחה","המכונה מדלגת על b","המכונה מוחקת את ה-b וממשיכה","שגיאת הגדרה"],"e":"‏q_{a✓} = \"חזרתי לתו האחרון, מצפה ל-a\". קריאת b = הקצוות שונים ⇒ לא פלינדרום ⇒ q_rej. כל שורת טבלה מתרגמת צעד אלגוריתמי אחד.","a":0},{"q":"מתי נדרשת רמת הטבלה ומתי high-level?","c":["‏high-level אסור בקורס","לבחירה חופשית בלי קשר לנדרש","טבלה רק כשמתבקש פירוט מעברים (כמו בתרגול 9); במבחן — high-level כברירת מחדל מוצהרת","טבלה תמיד — אחרת אין ציון"],"e":"הטופס עצמו מכריז: \"descriptions of TMs should be in high-level\" אם לא צוין אחרת. את הטבלה מבינים (היא מה שמאחורי הקלעים ובתוך ⟨M⟩) — אך כותבים אותה רק לפי דרישה.","a":2}]},{"t":"תיאורי high-level — מה מותר במבחן","q":[{"q":"איזה מהצעדים הבאים <b>אסור<\/b> לכתוב בתיאור high-level של מכונה?","c":["\"הרץ את הסימולציה של D על u\" עבור DFA נתון D","\"בדוק אם M עוצרת על w, ואם כן — קבל\" — זו בעצמה בעיה לא-כריעה","\"עבור על כל המילים באורך ≤ k בסדר לקסיקוגרפי\"","\"סמן את האות הראשונה שטרם טופלה\""],"e":"כל צעד חייב להיות בר-מימוש במ\"ט. סריקות, סימונים, לולאות סופיות וסימולציות של מכונות נתונות — כשרים. \"להכריע עצירה\" בצעד אחד — בדיוק מה שאי אפשר (אלא אם השאלה העניקה זאת כאורקל, וזה סיפור אחר).","a":1},{"q":"מהו הפורמט המקובל בקורס לכתיבת מכונה?","c":["דיאגרמת מצבים מצוירת","קוד פייתון","תיאור חופשי בפסקה","‏M: \"On input x: 1. … 2. …\" — פסאודו-קוד ממוספר במרכאות, כמו בפתרונות הרשמיים"],"e":"כל המזהים והרדוקציות במבחני 2023–2024 כתובים כך. המספור מאפשר גם להפנות (\"מקבל בשורה 2.1.1.2.2\") — הרגל שהפתרונות הרשמיים משתמשים בו בכבדות.","a":3},{"q":"מכונה מסמלצת אוטומט D על מילה: \"Run D on u\". מדוע הצעד הזה תקין וכמה זמן הוא לוקח?","c":["תקין אך עלול שלא לעצור","‏D אובייקט סופי והסימולציה מכנית — צעד כשר שעוצר תמיד (ריצת DFA תמיד סופית)","תקין רק אם D מכריע","לא תקין — מכונה לא יכולה להריץ אוטומט"],"e":"ריצת DFA על מילה סופית עוצרת תמיד — לכן צעדי \"Run D on u\" במזהים (2023א ש2!) לא מסכנים את העצירה. לעומת \"Run M on x\" למ\"ט — שם חובה לתחום צעדים (i steps) אם רוצים עצירה.","a":1}]},{"t":"קידודים: ⟨M⟩ ו־⟨M,w⟩","q":[{"q":"מה ההבדל המהותי בין <span class=\"math\">⟨M⟩<\/span> ל-<span class=\"math\">L(M)<\/span>?","c":["⟨M⟩ — מחרוזת סופית שמתארת את המכונה (תחביר); L(M) — השפה שהיא מקבלת (סמנטיקה), אולי אינסופית","אין הבדל — סימונים חלופיים","⟨M⟩ היא השפה ו-L(M) הקידוד","⟨M⟩ מוגדר רק למכריעים"],"e":"ההבחנה החשובה בקורס: שאלות תחביר (\"האם הקלט ⟨M⟩ חוקי?\") כריעות תמיד; שאלות סמנטיקה (\"האם L(M)=∅?\") הן ליבת האי-כריעות. בלבול = אובדן השאלה כולה.","a":0},{"q":"מה עושה המכונה האוניברסלית U?","c":["מוצאת את המכונה הקטנה ביותר לשפה","בודקת אם M עוצרת","מקבלת ⟨M,w⟩ ומדמה את ריצת M על w צעד אחר צעד — ומתנהגת כמוה","מכריעה כל שפה"],"e":"\"מחשב שמריץ תוכנות\": U עוקבת אחרי הקונפיגורציות של M. אם M מתלולאת — גם U (היא לא קוסמת). קיומה נותן מיד A_TM ∈ RE — אך לא ∈ R.","a":2},{"q":"מדוע \"האם הקלט הוא קידוד חוקי של מ\"ט?\" כריעה?","c":["בדיקת תחביר של אובייקט סופי — מוודאים שהמחרוזת מתארת שביעייה תקינה, בזמן סופי","היא לא כריעה — זו בדיוק בעיית העצירה","כי כל המחרוזות הן קידודים חוקיים","כי יש מספר סופי של מכונות"],"e":"פירוק מחרוזת ובדיקת מבנה — עבודה תחבירית גרידא. לכן פתרונות רשמיים מרשים לעצמם \"check that the input is of the form ⟨M,w⟩\" כצעד כשר (2024א ש3.4!).","a":0}]},{"t":"תזת צ'רץ'–טיורינג","q":[{"q":"מה קובעת תזת צ'רץ'–טיורינג?","c":["כל שפה ניתנת לזיהוי ע\"י מ\"ט","מכונת טיורינג מהירה כמו כל מחשב","לכל מ\"ט יש מ\"ט מינימלית","כל מה שניתן לחישוב אלגוריתמי (אינטואיטיבית) ניתן לחישוב במכונת טיורינג"],"e":"זיהוי בין \"אלגוריתם\" הלא-פורמלי ל\"מ\"ט\" הפורמלי. היא לא טוענת שהכול חישוביתי (ההפך — נראה שפות בלתי-ניתנות-לזיהוי) ולא עוסקת ביעילות.","a":3},{"q":"מדוע התזה איננה משפט מתמטי?","c":["כי היא תלויה בחומרה","כי צד אחד שלה — \"אלגוריתם\" — מושג אינטואיטיבי בלתי-מוגדר פורמלית; אין על מה להוכיח","כי היא שגויה","כי טרם נמצאה ההוכחה"],"e":"משפט דורש שני אגפים פורמליים. התמיכה בתזה אמפירית-מבנית: עשרות פורמליזמים שהוצעו — כולם קרסו לשקילות עם מ\"ט.","a":1},{"q":"איזה שימוש מעשי עושה הקורס בתזה?","c":["היא מאפשרת לדלג על הוכחות","היא קובעת את זמן הריצה","אין שימוש — רקע היסטורי","היא מכשירה תיאורי high-level (\"יש אלגוריתם ⇒ יש מ\"ט\") והופכת את משפטי האי-כריעות לטענות על כל מחשב"],"e":"בזכות התזה כותבים פסאודו-קוד במקום שביעיות, ובכיוון השני: \"אין מ\"ט שמכריעה את A_TM\" פירושו \"אין תוכנה, בשום שפה, לעולם\". שני הכיוונים בשימוש בכל שאלת חישוביות.","a":3}]}]},{"sid":"ch10","topics":[{"t":"עקרון הסימולציה — איך מוכיחים שקילות","q":[{"q":"מה מוכיחים כדי לקבוע ששני מודלים של מ\"ט שקולים בכוחם?","c":["שיש להם אותו מספר מצבים","שהם רצים באותה מהירות","ששניהם דטרמיניסטיים","שכל אחד מדמה את השני — ובפרט שהבסיסי מדמה את המורחב עם קידוד מתאים"],"e":"שקילות = סימולציה דו-כיוונית. הכיוון \"בסיסי⊆מורחב\" מיידי; העבודה היא לקודד את התוספת (סרטים, כיוונים, ענפים) על המודל הבסיסי.","a":3},{"q":"מהם שלושת רכיבי תשובה מלאה לשאלת סימולציה?","c":["השוואת זמני ריצה","קידוד המצב המורחב, תרגום צעד-לצעדים, ושימור תוצאת החישוב","טבלת מעברים מלאה, ציור, ודוגמה","רק תיאור הקידוד"],"e":"איך מייצגים, איך מדמים צעד, ולמה קבלה\/דחייה\/לולאה נשמרות — שלוש שורות מהותיות, בלי ירידה לרמת δ.","a":1},{"q":"מה הקשר בין משפטי השקילות לתזת צ'רץ'-טיורינג?","c":["הם מוכיחים את התזה פורמלית","הם סותרים את התזה","אין קשר","הם ראיות תומכות: כל הרחבה \"חזקה\" קורסת לאותו כוח — כמצופה מהתזה"],"e":"התזה אינה ניתנת להוכחה (צד לא-פורמלי), אבל כל שקילות כזו מחזקת אותה: המודל יציב להפליא תחת שינויים.","a":3}]},{"t":"סרט דו־כיווני ומכונת Stay","q":[{"q":"איך מדמים את האופציה S (להישאר במקום)?","c":["צעד ימינה ואז צעד שמאלה דרך מצב ביניים","אי אפשר — S מוסיפה כוח","מוחקים את הצעד מהריצה","כותבים פעמיים באותו תא"],"e":"שני צעדים שמבטלים זה את זה, עם מצב ביניים שזוכר מה לעשות. הדוגמה הקלה ביותר לעיקרון הסימולציה — ומכאן {L,R,S} ≡ {L,R}.","a":0},{"q":"איך מקודדים סרט אינסופי לשני הכיוונים על סרט חד-כיווני?","c":["מוותרים על הצד השלילי","משתמשים בשני ראשים","מקפלים לשני מסלולים — תא i מחזיק את (תא i, תא −i) — עם סמן קצה והמצב זוכר את המסלול","מעתיקים את הצד השלילי לסוף הקלט"],"e":"קיפול האינסוף הדו-צדדי לזוגות: Γ′ = Γ×Γ בתוספת סמן ▷ בתא 0. חציית האפס = החלפת מסלול. קידוד — לא קסם.","a":2},{"q":"מה המסקנה מכל שקילויות הסרטים?","c":["מותר לתכנן אלגוריתמים על הגרסה הנוחה — הכוח (R, RE) לא משתנה","הסרט הדו-כיווני מהיר יותר ולכן עדיף","יש לציין את סוג הסרט בכל תשובה","רק הסרט החד-כיווני חוקי במבחן"],"e":"‏R ו-RE עמידות לווריאציה. בתיאור high-level איש לא שואל איזה סרט — וזה מגובה במשפטים שהוכחו בכיתה ומותר לצטט.","a":0}]},{"t":"מכונה רב־סרטית","q":[{"q":"איך סרט יחיד מייצג k סרטים?","c":["הסרטים משוזרים תא-תא לסירוגין","התכנים משורשרים עם מפרידי #, ומיקום כל ראש מסומן באות \"מנוקדת\"","רק הסרט הפעיל נשמר","משתמשים ב-k מכונות נפרדות"],"e":"‏#tape1#tape2#…# עם גרסה מנוקדת של האות תחת כל ראש וירטואלי. (שזירה היא קידוד חלופי תקין — אבל זו הבנייה שבקורס.)","a":1},{"q":"איך מדמה המכונה החד-סרטית צעד אחד של הרב-סרטית?","c":["צעד אחד בדיוק — הקידוד עושה את השאר","מריצה כל סרט עד הסוף בנפרד","מנחשת את התוצאה","סריקה שאוספת את האותיות המנוקדות, עדכון לפי δ, וסריקה שכותבת ומזיזה את הנקודות"],"e":"צעד אחד ⇒ שתי סריקות (ולעיתים הזזת זנב כשקטע גדל). איטי יותר — אבל זמן לא נספר כאן; רק \"אפשר\/אי אפשר\".","a":3},{"q":"אילו צעדי high-level מוכשרים בזכות השקילות הרב-סרטית?","c":["אין כאלה","\"העתק את הקלט לסרט נוסף\", \"נהל מונה בסרט נפרד\" — עבודה מרובת-סרטים חופשית","\"נחש את התשובה\"","\"בדוק אם M עוצרת\""],"e":"כל ניהול-עזר בסרטים נוספים תקף, כי רב-סרטית ≡ רגילה. ניחוש שייך לשקילות ה-NTM; \"בדוק עצירה\" לא כשר בשום מודל.","a":1}]},{"t":"מ\"ט אי־דטרמיניסטית","q":[{"q":"מתי NTM מקבלת קלט?","c":["כאשר רוב הענפים מקבלים","כאשר עץ הריצות סופי","כאשר קיים ענף ריצה אחד לפחות שמגיע ל-q_acc","כאשר כל הענפים מקבלים"],"e":"אותה סמנטיקת ∃ של NFA\/PDA — הפעם על עץ ריצות של מ\"ט. דחייה = אף ענף לא מקבל.","a":2},{"q":"מדוע הסימולציה הדטרמיניסטית סורקת את עץ הריצות לרוחב (BFS) ולא לעומק?","c":["ענף אינסופי היה בולע DFS לפני שהגיע לענף מקבל; BFS מגיע לכל עומק סופי","‏BFS מהיר יותר","‏DFS דורש מחסנית ואין אחת","אין הבדל בין השניים"],"e":"עץ עם לולאה בענף אחד ועם קבלה בענף אחר: DFS צולל ולא חוזר. סריקת כל הענפים באורך 1, 2, 3… מוצאת כל קבלה בעומק d בשלב d. אותו רעיון בדיוק כמו dovetailing במזהים.","a":0},{"q":"מה המסקנה משקילות NTM למ\"ט רגילה?","c":["‏NTM שקולה דווקא ל-PDA","ניחושים מותרים רק לשפות סופיות","מותר לכתוב \"נחש X ואמת\" בתיאורי מכונות — התוצאה עדיין ב-RE (וב-R אם הכול חסום)","אי-דטרמיניזם מוסיף כוח כמו ב-PDA"],"e":"בניגוד ל-PDA — כאן הניחוש לא מוסיף כוח. לכן מזהים עם \"guess\" תקפים. (הרלוונטי
