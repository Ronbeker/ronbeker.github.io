pan class=\"math\">x<\/span>, <span class=\"math\">M<\/span> does not reject <span class=\"math\">y<\/span>, or <span class=\"math\">D<\/span> does not accept <span class=\"math\">xy<\/span>. Therefore <span class=\"math\">M_L<\/span> never reaches an accepting iteration.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L<\/span> is regular, and thus the pumping lemma for regular languages holds for <span class=\"math\">L<\/span>. Let <span class=\"math\">n<\/span> be the number promised by the lemma.<\/p>\n<p>We choose the word <span class=\"math\">w = a<sup>2n<\/sup>ba<sup>n<\/sup>b<\/span>. We have <span class=\"math\">w ∈ L<\/span> and <span class=\"math\">|w| ≥ n<\/span>, so by the lemma <span class=\"math\">w = xyz<\/span> such that conditions 1, 2, 3 hold.<\/p>\n<p>Denote <span class=\"math\">x = a<sup>s<\/sup><\/span>, <span class=\"math\">y = a<sup>t<\/sup><\/span>, where <span class=\"math\">s + t ≤ n<\/span> and <span class=\"math\">t &gt; 0<\/span> (conditions 1 and 2 — <span class=\"math\">xy<\/span> lies inside the first block of <span class=\"math\">a<\/span>'s).<\/p>\n<p>Consider <span class=\"math\">w₀ = xy<sup>0<\/sup>z = a<sup>2n−t<\/sup>ba<sup>n<\/sup>b<\/span>.<\/p>\n<p>As <span class=\"math\">t &gt; 0<\/span> we have <span class=\"math\">2n − t &lt; 2n<\/span>, therefore <span class=\"math\">w₀ ∉ L<\/span> — in contradiction to condition 3 of the lemma. Thus <span class=\"math\">L<\/span> is nonregular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">G = (V, Σ, S, R)<\/span> with <span class=\"math\">V = {S, A, B, C, D}<\/span>, <span class=\"math\">Σ = {a, b, c}<\/span>:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span><span class=\"nt\">C<\/span> | <span class=\"nt\">D<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → a<span class=\"nt\">A<\/span>b | a<span class=\"nt\">A<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → b<span class=\"nt\">B<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → c<span class=\"nt\">C<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">D<\/span> → a<span class=\"nt\">D<\/span>c | a<span class=\"nt\">D<\/span> | <span class=\"nt\">B<\/span><\/div>\n<\/div>\n<p>The branch <span class=\"math\">S → AC<\/span> generates words with <span class=\"math\">i ≥ j<\/span> (every <span class=\"math\">b<\/span> is matched by an <span class=\"math\">a<\/span>), and the branch <span class=\"math\">S → D<\/span> generates words with <span class=\"math\">i ≥ k<\/span> (every <span class=\"math\">c<\/span> is matched by an <span class=\"math\">a<\/span>, with the free <span class=\"math\">b<\/span>-block in the middle) — together exactly <span class=\"math\">i ≥ min{j,k}<\/span>.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p>Let <span class=\"math\">w = abc ∈ L<\/span>. It has two different parse trees (equivalently, two different leftmost derivations), one through each branch of <span class=\"math\">S<\/span>:<\/p>\n<div class=\"cols2\">\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul>\n  <li><span class=\"nt\">A<\/span><ul><li>a<\/li><li><span class=\"nt\">A<\/span><ul><li>ε<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li>\n  <li><span class=\"nt\">C<\/span><ul><li>c<\/li><li><span class=\"nt\">C<\/span><ul><li>ε<\/li><\/ul><\/li><\/ul><\/li>\n<\/ul><\/li><\/ul><\/div>\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul>\n  <li><span class=\"nt\">D<\/span><ul><li>a<\/li><li><span class=\"nt\">D<\/span><ul><li><span class=\"nt\">B<\/span><ul><li>b<\/li><li><span class=\"nt\">B<\/span><ul><li>ε<\/li><\/ul><\/li><\/ul><\/li><\/ul><\/li><li>c<\/li><\/ul><\/li>\n<\/ul><\/li><\/ul><\/div>\n<\/div>\n<p><span class=\"math\">S ⇒ AC ⇒ aAbC ⇒ abC ⇒ abcC ⇒ abc<\/span> &nbsp;versus&nbsp; <span class=\"math\">S ⇒ D ⇒ aDc ⇒ aBc ⇒ abBc ⇒ abc<\/span>.<\/p>\n<p>Two distinct parse trees for the same word — the grammar is ambiguous.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example:<\/p>\n<p>Let <span class=\"math\">M_{loop}<\/span> be the following machine — <span class=\"math\">M_{loop}<\/span>: “On input <span class=\"math\">x<\/span>: loop.”<\/p>\n<p>Then <span class=\"math\">A = {⟨M, w⟩ | M is a TM, ⟨M⟩ = ⟨M_{loop}⟩ and w ∈ Σ<sup>*<\/sup>}<\/span> is an infinite language, <span class=\"math\">A ⊆ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> (the machine <span class=\"math\">M_{loop}<\/span> halts on no input), and <span class=\"math\">A ∈ R<\/span> — a decider only needs to check that the input is of the form <span class=\"math\">⟨M, w⟩<\/span> and that <span class=\"math\">⟨M⟩ = ⟨M_{loop}⟩<\/span>, a syntactic check.<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> <span class=\"math\">L ∈ R<\/span>.<\/p>\n<p>Note that <span class=\"math\">∀L′ ∈ RE<\/span> it holds that <span class=\"math\">L′ ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span>: take <span class=\"math\">f(w) = ⟨N⟩<\/span> where:<\/p>\n<pre>N: \"On input x:\nRun M_{L'} (the recognizer of L') on w, and answer as M_{L'} does.\"<\/pre>\n<p><span class=\"math\">f<\/span> is a computable function: to compute <span class=\"math\">f<\/span> all that needs to be done is to encode the description (string) of the TM <span class=\"math\">N<\/span> — a finite string produced in finite time.<\/p>\n<p><span class=\"math\">w ∈ L′<\/span> iff <span class=\"math\">M_{L′}<\/span> accepts <span class=\"math\">w<\/span> iff <span class=\"math\">L(N) = Σ<sup>*<\/sup><\/span> iff <span class=\"math\">⟨N⟩ ∈ <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span> (and when <span class=\"math\">w ∉ L′<\/span>, <span class=\"math\">N<\/span> accepts nothing and <span class=\"math\">L(N) = ∅<\/span>).<\/p>\n<p>Now, since for every TM <span class=\"math\">M<\/span> the language <span class=\"math\">L(M)<\/span> is in <span class=\"math\">RE<\/span>, it holds that <span class=\"math\">L(M) ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span> for <b>every<\/b> TM <span class=\"math\">M<\/span>.<\/p>\n<p>Therefore <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span>} = {⟨M⟩ | M is a TM}<\/span>, which we know is in <span class=\"math\">R<\/span> (a syntactic check of a valid TM encoding). In particular <span class=\"math\">L ∉ RE ∖ R<\/span>.<\/p>\n<\/div>"}]},{"id":"2024b","year":2024,"moed":"ב","label":"2024 — מועד ב'","lang":"he","combined":false,"meta":{"date":"אביב 2024","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן."},"questions":[{"n":"1","heading":"שאלה 1 (5, 15, 15 נקודות)","points":35,"intro":"","parts":[{"pid":"q1a","label":"1","kind":"open","rows":5,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">Σ = {0,1}<\/span>.<\/p><p dir=\"auto\"><b>הגדר הצבה רגולרית<\/b> <span class=\"math\">f<\/span> ל-<span class=\"math\">Σ<\/span> כך שלכל <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> יתקיים ש-<\/p><div class=\"lang-def\">f(L) = {ε}&nbsp; if L ≠ ∅&nbsp;&nbsp;;&nbsp;&nbsp; f(L) = ∅&nbsp; otherwise<\/div>","tags":{"subj":"closure","qt":"construction"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן שפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>, תהי:<\/p><div class=\"lang-def\">Op₁(L) = {z<sup>R<\/sup>x | xyz ∈ L}&nbsp;,&nbsp; x, y, z ∈ Σ<sup>*<\/sup><\/div><p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L<\/span> שפה רגולרית אזי <span class=\"math\">Op₁(L)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן שפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>, תהי:<\/p><div class=\"lang-def\">Op₂(L) = {xyzy<sup>R<\/sup> | xyz ∈ L}&nbsp;,&nbsp; x, y, z ∈ Σ<sup>*<\/sup><\/div><p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L<\/span> היא שפה רגולרית אזי <span class=\"math\">Op₂(L)<\/span> היא שפה <b>חסרת הקשר<\/b>.<\/p>","tags":{"subj":"closure","qt":"proof"}}]},{"n":"2","heading":"שאלה 2 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, N⟩ | M and N are TMs, ∃x ∈ Σ<sup>*<\/sup> s.t. M accepts x&nbsp; <b>or<\/b>&nbsp; N accepts all inputs}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 5 נקודות)","points":25,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">Σ = {0,1}<\/span>. בהינתן מחרוזת <span class=\"math\">w ∈ Σ<sup>*<\/sup><\/span>, נגדיר ב-<span class=\"math\">w<sub>i<\/sub><\/span> את התו ה-<span class=\"math\">i<\/span> של <span class=\"math\">w<\/span>. תהי:<\/p><div class=\"lang-def\">L = {ww<sup>R<\/sup> | w ∈ Σ<sup>+<\/sup> and w₁ ≠ 1}<\/div><p dir=\"auto\"><b>הוכיחו:<\/b> ‏<span class=\"math\">L<\/span> שפה <b>חסרת הקשר<\/b>.<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3b","label":"2","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i ≥ min{j,k}}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו:<\/b> ‏<span class=\"math\">L<\/span> <b>איננה<\/b> שפה רגולרית.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3c","label":"3","kind":"open","rows":8,"prompt":"<p dir=\"auto\"><b>בנו <span class=\"en\">PDA<\/span>‏, ע\"י ציור של דיאגרמת מצבים,<\/b> שמזהה את השפה הבאה:<\/p><div class=\"lang-def\">L = {x ∈ {0,1}<sup>*<\/sup> | #₀(x) = #₁(x)}<\/div>","tags":{"subj":"pda","qt":"construction"}},{"pid":"q3d","label":"4","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> שפה כלשהי.<\/p><p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">L ≤<sub>m<\/sub> <span class=\"comp\">L<\/span><\/span> אזי מתקיים ש-<span class=\"math\">L<\/span> שפה סופית או ש-<span class=\"math\">L ∉ R<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3e","label":"5","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ≠ PAL<sub>TM<\/sub>}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> לפי משפט <span class=\"en\">Rice<\/span>‏ השפה <span class=\"math\">L<\/span> איננה כריעה.<\/p>","tags":{"subj":"rice","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">f(0) = {ε}<\/span>,&nbsp; <span class=\"math\">f(1) = {ε}<\/span>.<\/p>\n<p>Every letter is replaced by the language <span class=\"math\">{ε}<\/span>, so every word of <span class=\"math\">L<\/span> is mapped to <span class=\"math\">ε<\/span>: if <span class=\"math\">L ≠ ∅<\/span> then <span class=\"math\">f(L) = {ε}<\/span>, and if <span class=\"math\">L = ∅<\/span> there is nothing to substitute, so <span class=\"math\">f(L) = ∅<\/span>.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p>Since <span class=\"math\">L<\/span> is a regular language there exists a DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_s, F)<\/span> such that <span class=\"math\">L(A) = L<\/span>.<\/p>\n<p>For every <span class=\"math\">p, q ∈ Q_A<\/span>, define <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> = {w | δ′_A(p,w) = q}<\/span> — a regular language (take <span class=\"math\">p<\/span> as initial state and <span class=\"math\">q<\/span> as the only accepting state).<\/p>\n<p>Note that <span class=\"math\">L = ⋃<sub>p,q∈Q, f∈F<\/sub> L<sup>A<\/sup><sub>q_s,p<\/sub> · L<sup>A<\/sup><sub>p,q<\/sub> · L<sup>A<\/sup><sub>q,f<\/sub><\/span>.<\/p>\n<p>Since <span class=\"math\">L<sup>A<\/sup><sub>q,f<\/sub><\/span> is regular, <span class=\"math\">(L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> = {w | w<sup>R<\/sup> ∈ L<sup>A<\/sup><sub>q,f<\/sub>}<\/span> is also regular (closure under reverse).<\/p>\n<p>Note that <span class=\"math\">f(L<sup>A<\/sup><sub>p,q<\/sub>) = {ε}<\/span> if <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> ≠ ∅<\/span> and <span class=\"math\">∅<\/span> otherwise, where <span class=\"math\">f<\/span> is the regular substitution from section 1.1; <span class=\"math\">f(L<sup>A<\/sup><sub>p,q<\/sub>)<\/span> is regular (closure under regular substitution).<\/p>\n<p>Note that:<\/p>\n<div class=\"lang-def\">Op₁(L) = ⋃<sub>p,q∈Q, f∈F<\/sub> (L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> · L<sup>A<\/sup><sub>q_s,p<\/sub> · f(L<sup>A<\/sup><sub>p,q<\/sub>)<\/div>\n<p>which is a regular language (finite union of concatenations of regular languages).<\/p>\n<p>The concatenation with <span class=\"math\">f(L<sup>A<\/sup><sub>p,q<\/sub>)<\/span> is needed to handle the case that <span class=\"math\">A<\/span> has no path from <span class=\"math\">p<\/span> to <span class=\"math\">q<\/span> (concatenating with <span class=\"math\">{ε}<\/span> keeps the language; concatenating with <span class=\"math\">∅<\/span> empties it). For example, in the following DFA:<\/p>\n<div class=\"fsa\"><svg viewBox=\"0 0 450 110\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n  <circle class=\"st\" cx=\"55\" cy=\"55\" r=\"24\"\/><text class=\"slbl\" x=\"55\" y=\"55\">q_s<\/text>\n  <circle class=\"st\" cx=\"180\" cy=\"55\" r=\"24\"\/><text class=\"slbl\" x=\"180\" y=\"55\">p<\/text>\n  <path class=\"tr\" d=\"M79,55 L152,55\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"115\" y=\"45\" text-anchor=\"middle\">0,1<\/text>\n  <circle class=\"st\" cx=\"285\" cy=\"55\" r=\"24\"\/><text class=\"slbl\" x=\"285\" y=\"55\">q<\/text>\n  <circle class=\"st st-acc\" cx=\"405\" cy=\"55\" r=\"20\"\/>\n  <circle class=\"st st-acc\" cx=\"405\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"405\" y=\"55\">f<\/text>\n  <path class=\"tr\" d=\"M309,55 L376,55\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"342\" y=\"45\" text-anchor=\"middle\">0,1<\/text>\n<\/svg><div class=\"fsa-cap\">‏L(A) = ∅, ואין מסלול מ-p ל-q<\/div><\/div>\n<p><span class=\"math\">L(A) = ∅<\/span> but <span class=\"math\">⋃ (L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> · L<sup>A<\/sup><sub>q_s,p<\/sub> = {00,01,10,11} ≠ Op₁(L(A))<\/span>, while with the extra factor <span class=\"math\">⋃ (L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> · L<sup>A<\/sup><sub>q_s,p<\/sub> · f(L<sup>A<\/sup><sub>p,q<\/sub>) = ∅ = Op₁(L(A))<\/span>.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>Solution 1 (PDA):<\/b><\/p>\n<p>Let DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_{sA}, F_A)<\/span> such that <span class=\"math\">L(A) = L<\/span>.<\/p>\n<p>Define PDA <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F_P)<\/span>:<\/p>\n<p><span class=\"math\">Q_P = Q_A × {1,2,3} ⊎ {q_{sP}, q′, f_P}<\/span>, <span class=\"math\">Σ_P = {0,1}<\/span>, <span class=\"math\">Γ = {0,1,$}<\/span>, <span class=\"math\">F_P = {f_P}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ_P(q_{sP}, ε, ε) = {((q_{sA},1), $)}<\/span> — push a bottom marker.<\/li>\n<li>Phase 1 (<span class=\"math\">×1<\/span>): simulate <span class=\"math\">A<\/span> on <span class=\"math\">x<\/span> without touching the stack: <span class=\"math\">δ_P((p,1), σ, ε) = {((q,1), ε)}<\/span> for every <span class=\"math\">δ_A(p,σ)=q<\/span>.<\/li>\n<li>Phase 2 (<span class=\"math\">×2<\/span>): simulate <span class=\"math\">A<\/span> on <span class=\"math\">y<\/span> while <b>pushing<\/b> each letter: <span class=\"math\">δ_P((p,2), σ, ε) = {((q,2), σ)}<\/span>.<\/li>\n<li>Phase 3 (<span class=\"math\">×3<\/span>): simulate <span class=\"math\">A<\/span> on <span class=\"math\">z<\/span> without stack: <span class=\"math\">δ_P((p,3), σ, ε) = {((q,3), ε)}<\/span>.<\/li>\n<li>Phase changes: <span class=\"math\">∀q ∈ Q_A<\/span>: <span class=\"math\">δ_P((q,1), ε, ε) = {((q,2), ε)}<\/span> and <span class=\"math\">δ_P((q,2), ε, ε) = {((q,3), ε)}<\/span>.<\/li>\n<li><span class=\"math\">∀f ∈ F_A × {3}<\/span>: <span class=\"math\">δ_P(f, ε, ε) = {(q′, ε)}<\/span> — after <span class=\"math\">xyz ∈ L<\/span> was verified, match the suffix: <span class=\"math\">δ_P(q′, 0, 0) = {(q′, ε)}<\/span>, <span class=\"math\">δ_P(q′, 1, 1) = {(q′, ε)}<\/span> (reading <span class=\"math\">y<sup>R<\/sup><\/span> against the pushed <span class=\"math\">y<\/span>), and <span class=\"math\">δ_P(q′, ε, $) = {(f_P, ε)}<\/span>.<\/li>\n<\/ul>\n<p><b>Solution 2 (closures):<\/b><\/p>\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{0,1}<\/span>: <span class=\"math\">f(0) = {0, 0′}<\/span>, <span class=\"math\">f(1) = {1, 1′}<\/span>. <span class=\"math\">f(L)<\/span> is regular.<\/p>\n<p>Let <span class=\"math\">Σ′ = {0′, 1′}<\/span>, <span class=\"math\">L′ = L(Σ<sup>*<\/sup> · Σ′<sup>*<\/sup> · Σ<sup>*<\/sup>)<\/span> (regex), and <span class=\"math\">L″ = f(L) ∩ L′<\/span> — regular (intersection); the marked block is exactly the <span class=\"math\">y<\/span> part.<\/p>\n<p>Let <span class=\"math\">L‴ = L(Σ′<sup>*<\/sup>)<\/span> and <span class=\"math\">L<sup>#<\/sup> = L″ · L‴<\/span> — regular (concatenation).<\/p>\n<p>Construct a CFG <span class=\"math\">G = (V, Σ̂, S, R)<\/span> for <span class=\"math\">{uvwv<sup>R<\/sup> | u, w ∈ Σ<sup>*<\/sup> and v ∈ Σ′<sup>*<\/sup>}<\/span>:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span><span class=\"nt\">B<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → <span class=\"nt\">C<\/span><span class=\"nt\">A<\/span> | ε&nbsp;&nbsp;(= Σ<sup>*<\/sup>)<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → 0′<span class=\"nt\">B<\/span>0′ | 1′<span class=\"nt\">B<\/span>1′ | <span class=\"nt\">A<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → 0 | 1<\/div>\n<\/div>\n<p><span class=\"math\">V = {S,A,B,C}<\/span>, <span class=\"math\">Σ̂ = {0,1,0′,1′}<\/span>.<\/p>\n<p>Define <span class=\"math\">L<sup>##<\/sup> = L<sup>#<\/sup> ∩ L(G)<\/span> — context-free (intersection of a CFL with a regular language).<\/p>\n<p>Define a regular substitution <span class=\"math\">g<\/span> over <span class=\"math\">Σ̂<\/span>: <span class=\"math\">g(0) = g(0′) = {0}<\/span>, <span class=\"math\">g(1) = g(1′) = {1}<\/span> (erase the marks).<\/p>\n<p>Note that <span class=\"math\">Op₂(L) = g(L<sup>##<\/sup>)<\/span> — context-free (closure of CFL under substitution).<\/p>\n<p><b>Example:<\/b> for <span class=\"math\">L = {010, 110}<\/span>: <span class=\"math\">f(L)<\/span> marks any subset of positions; <span class=\"math\">L″<\/span> keeps only words where the marked positions are one contiguous block; <span class=\"math\">L<sup>#<\/sup><\/span> appends a marked tail; <span class=\"math\">L<sup>##<\/sup><\/span> forces the tail to be the reverse of the marked block; and <span class=\"math\">g<\/span> erases the marks — leaving exactly <span class=\"math\">Op₂(L) ⊇ {010, 0100, 0101, 01010, 01001, 010010, …}<\/span>.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_∅, N_{M,w}⟩<\/span> where:<\/p>\n<pre>N_∅: \"On input x: Reject.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(N_∅) = ∅<\/span>, that is <span class=\"math\">∄x ∈ Σ<sup>*<\/sup><\/span> such that <span class=\"math\">N_∅<\/span> accepts <span class=\"math\">x<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function: encoding the two fixed-form machines is a finite-time syntactic operation.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span>, so <span class=\"math\">N_{M,w}<\/span> accepts every <span class=\"math\">x ∈ Σ<sup>*<\/sup><\/span> — the second condition holds, so <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">N_{M,w}<\/span> does not accept every <span class=\"math\">x<\/span> (it never accepts), and no <span class=\"math\">x<\/span> is accepted by <span class=\"math\">N_∅<\/span> — neither condition holds, so <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∉ RE<\/span>:<\/b> we show <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>, therefore <span class=\"math\">L ∉ RE<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_∅, N_{M,w}⟩<\/span> where:<\/p>\n<pre>N_∅: \"On input x: Reject.\"\n\nN_{M,w}: \"On input x:\n1. Run M on w for |x| steps.\n2. If M didn't accept w during these steps, accept.\n3. Otherwise, reject.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: <span class=\"math\">M<\/span> doesn't accept <span class=\"math\">w<\/span>, so for every <span class=\"math\">x<\/span>, <span class=\"math\">M<\/span> doesn't accept <span class=\"math\">w<\/span> within <span class=\"math\">|x|<\/span> steps, and <span class=\"math\">N_{M,w}<\/span> accepts <span class=\"math\">x<\/span> in line 2. Hence <span class=\"math\">N_{M,w}<\/span> accepts all inputs and <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span> within some finite <span class=\"math\">k<\/span> steps. For <span class=\"math\">|x| &lt; k<\/span>, <span class=\"math\">N_{M,w}<\/span> accepts <span class=\"math\">x<\/span>; for <span class=\"math\">|x| ≥ k<\/span> it rejects. Therefore <span class=\"math\">L(N_{M,w}) = ⋃<sub>n&lt;k<\/sub> Σ<sup>n<\/sup> ≠ Σ<sup>*<\/sup><\/span> — it does not accept all inputs. In addition <span class=\"math\">∄x<\/span> accepted by <span class=\"math\">N_∅<\/span>. So <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>We construct a context-free grammar <span class=\"math\">G = (V, Σ, S, R)<\/span> such that <span class=\"math\">L(G) = L<\/span>:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → 0<span class=\"nt\">A<\/span>0<\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → 0<span class=\"nt\">A<\/span>0 | 1<span class=\"nt\">A<\/span>1 | ε<\/div>\n<\/div>\n<p><span class=\"math\">V = {S,A}<\/span>, <span class=\"math\">Σ = {0,1}<\/span>.<\/p>\n<p>The first character is forced to be <span class=\"math\">0<\/span> (i.e. <span class=\"math\">w₁ ≠ 1<\/span>), and every letter is mirrored around the center — exactly the even palindromes <span class=\"math\">ww<sup>R<\/sup><\/span> with <span class=\"math\">w ∈ Σ<sup>+<\/sup><\/span> starting with <span class=\"math\">0<\/span>.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L<\/span> is regular, and thus the pumping lemma for regular languages holds for <span class=\"math\">L<\/span>. Let <span class=\"math\">n<\/span> be the number promised by the lemma.<\/p>\n<p>We choose the string <span class=\"math\">w = a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup><\/span> (here <span class=\"math\">i = n ≥ min{n,n}<\/span>, so <span class=\"math\">w ∈ L<\/span>, and <span class=\"math\">|w| ≥ n<\/span>).<\/p>\n<p>By the lemma <span class=\"math\">w = xyz<\/span> with conditions 1–3. Denote <span class=\"math\">x = a<sup>s<\/sup><\/span>, <span class=\"math\">y = a<sup>t<\/sup><\/span>, where <span class=\"math\">s + t ≤ n<\/span> and <span class=\"math\">t &gt; 0<\/span>.<\/p>\n<p>Consider <span class=\"math\">w₀ = xy<sup>0<\/sup>z = a<sup>n−t<\/sup>b<sup>n<\/sup>c<sup>n<\/sup><\/span>.<\/p>\n<p>As <span class=\"math\">t &gt; 0<\/span> we have <span class=\"math\">n − t &lt; n = min{j,k}<\/span>, therefore <span class=\"math\">w₀ ∉ L<\/span> — contradicting condition 3. Thus <span class=\"math\">L<\/span> is not a regular language.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<div class=\"fsa\"><svg viewBox=\"0 0 470 300\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n  <path class=\"tr\" d=\"M10,150 L38,150\" marker-end=\"url(#arr)\"\/>\n  <circle class=\"st\" cx=\"65\" cy=\"150\" r=\"25\"\/><text class=\"slbl\" x=\"65\" y=\"150\">q_s<\/text>\n  <circle class=\"st\" cx=\"205\" cy=\"150\" r=\"25\"\/><text class=\"slbl\" x=\"205\" y=\"150\">q₁<\/text>\n  <circle class=\"st\" cx=\"385\" cy=\"150\" r=\"25\"\/><text class=\"slbl\" x=\"385\" y=\"150\">q₂<\/text>\n  <circle class=\"st st-acc\" cx=\"295\" cy=\"255\" r=\"20\"\/>\n  <circle class=\"st st-acc\" cx=\"295\" cy=\"255\" r=\"25\"\/><text class=\"slbl\" x=\"295\" y=\"255\">q₃<\/text>\n  <path class=\"tr\" d=\"M90,150 L177,150\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"133\" y=\"140\" text-anchor=\"middle\">ε,ε→$<\/text>\n  <path class=\"tr\" d=\"M193,127 C178,88 232,88 217,127\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"205\" y=\"80\" text-anchor=\"middle\">0,ε→x<\/text>\n  <text class=\"lbl\" x=\"205\" y=\"97\" text-anchor=\"middle\">1,x→ε<\/text>\n  <path class=\"tr\" d=\"M373,127 C358,88 412,88 397,127\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"385\" y=\"80\" text-anchor=\"middle\">1,ε→x<\/text>\n  <text class=\"lbl\" x=\"385\" y=\"97\" text-anchor=\"middle\">0,x→ε<\/text>\n  <path class=\"tr\" d=\"M230,143 C280,128 310,128 360,143\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"295\" y=\"125\" text-anchor=\"middle\">ε,$→$<\/text>\n  <path class=\"tr\" d=\"M360,160 C310,178 280,178 230,160\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"295\" y=\"190\" text-anchor=\"middle\">ε,$→$<\/text>\n  <path class=\"tr\" d=\"M222,170 C240,205 255,225 272,240\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"222\" y=\"225\" text-anchor=\"middle\">ε,$→ε<\/text>\n  <path class=\"tr\" d=\"M368,170 C350,205 335,225 318,240\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"368\" y=\"225\" text-anchor=\"middle\">ε,$→ε<\/text>\n<\/svg><div class=\"fsa-cap\">‏q₁ — עודף זמני של אפסים במחסנית; q₂ — עודף זמני של אחדות; קבלה רק כשהמחסנית חזרה ל-$ בלבד<\/div><\/div>\n<p>The stack keeps the current surplus: in <span class=\"math\">q₁<\/span> each <span class=\"math\">0<\/span> pushes <span class=\"math\">x<\/span> and each <span class=\"math\">1<\/span> pops; in <span class=\"math\">q₂<\/span> the roles are reversed. The <span class=\"math\">ε,$→$<\/span> moves switch sides only when the surplus is empty, and <span class=\"math\">ε,$→ε<\/span> accepts exactly when <span class=\"math\">#₀(x) = #₁(x)<\/span>.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b><\/p>\n<p><b>Option 1:<\/b> as we proved in exercise 10, there is always a mapping reduction from any decidable language to any non-trivial language. Hence any infinite, non-trivial, decidable language <span class=\"math\">L<\/span> is a counter example.<\/p>\n<p><b>Option 2 (explicit counter example):<\/b> <span class=\"math\">L = {w ∈ Σ<sup>*<\/sup> | |w| is even}<\/span> — an infinite decidable language (accept iff <span class=\"math\">|x|<\/span> is even). Then <span class=\"math\"><span class=\"comp\">L<\/span> = {w | |w| is odd}<\/span>, and <span class=\"math\">L ≤<sub>m<\/sub> <span class=\"comp\">L<\/span><\/span> via <span class=\"math\">f(w) = 1w<\/span> (appending a letter flips the parity: <span class=\"math\">w ∈ L ⟺ 1w ∈ <span class=\"comp\">L<\/span><\/span>).<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> <span class=\"math\">L ∈ R<\/span>.<\/p>\n<p>Since <span class=\"math\">PAL<sub>TM<\/sub> ∉ RE<\/span> (we showed in the recitation <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> PAL<sub>TM<\/sub><\/span> and <span class=\"math\">E<sub>TM<\/sub> ≤<sub>m<\/sub> PAL<sub>TM<\/sub><\/span>), it holds for <b>every<\/b> TM <span class=\"math\">M<\/span> that <span class=\"math\">L(M) ≠ PAL<sub>TM<\/sub><\/span> — because <span class=\"math\">L(M) ∈ RE<\/span> by definition.<\/p>\n<p>Therefore <span class=\"math\">L<\/span> can be rewritten as <span class=\"math\">L = {⟨M⟩ | M is a TM}<\/span>, which is obviously in <span class=\"math\">R<\/span>.<\/p>\n<p>(The claim \"by Rice's theorem\" fails: the property <span class=\"math\">L(M) ≠ PAL<sub>TM<\/sub><\/span> is <b>trivial<\/b> over RE — it holds for all recognizable languages — so Rice's theorem does not apply.)<\/p>\n<\/div>"}]},{"id":"sample","year":2023,"moed":"ס","label":"מבחן לדוגמה רשמי (2023)","lang":"he","combined":false,"meta":{"date":"2023","duration":"3 שעות","staff":"ד\"ר רעות לוי — Sample Exam, Term A","totalPoints":100,"note":"המבחן לדוגמה הרשמי של הקורס (תורגם מאנגלית; ההגדרות הפורמליות נשמרו כלשונן). פתרונות המרצה כוללים הערות פדגוגיות."},"questions":[{"n":"1","heading":"שאלה 1 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">עבור שפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ<\/span>, נגדיר:<\/p><div class=\"lang-def\">dropEven(L) ≝ {σ₁σ₂…σ<sub>n<\/sub> | ∃μ₁,…,μ<sub>n<\/sub> s.t. σ₁μ₁σ₂μ₂…σ<sub>n<\/sub>μ<sub>n<\/sub> ∈ L}<\/div><p dir=\"auto\">כלומר — האותיות שבמקומות האי-זוגיים של מילה מהשפה (מילה מקורית באורך זוגי).<\/p>","parts":[{"pid":"q1a","label":"א","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> קיימת שפה <span class=\"math\">L<\/span> שהיא חסרת הקשר ולא רגולרית, כך ש-<span class=\"math\">dropEven(L)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q1b","label":"ב","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">dropEven(L) = L<\/span> אזי <span class=\"math\">L<\/span> איננה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q1c","label":"ג","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו, ע\"י בנייה,<\/b> שלכל שפה רגולרית <span class=\"math\">L<\/span>, גם <span class=\"math\">dropEven(L)<\/span> רגולרית. ליתר דיוק: בהינתן <span class=\"en\">DFA<\/span>‏ שמזהה את <span class=\"math\">L<\/span>, הראו איך להמיר אותו ל-<span class=\"en\">NFA<\/span>‏ שמזהה את <span class=\"math\">dropEven(L)<\/span>.<\/p>","tags":{"subj":"automata","qt":"construction"}},{"pid":"q1d","label":"ד","kind":"open","rows":12,"prompt":"<p dir=\"auto\"><b>הוכיחו, בעזרת למת הניפוח,<\/b> שהשפה הבאה איננה חסרת הקשר:<\/p><div class=\"lang-def\">L = {ww<sup>R<\/sup> | w ∈ {0,1}<sup>*<\/sup> and #₀(w) = #₁(w)}<\/div>","tags":{"subj":"pump-cfl","qt":"pumping"}}]},{"n":"2","heading":"שאלה 2 (30 נקודות)","points":30,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">A = {⟨M⟩ | M is a TM and ∀w ∈ PAL, M doesn't reject w·w}<\/div><p dir=\"auto\">(‏<span class=\"math\">PAL<\/span> — שפת הפלינדרומים.)<\/p>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">A ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">A ∈ RE ∖ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">A ∈ coRE ∖ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":16,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם (הוכחה מלאה).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (20 נקודות)","points":20,"intro":"","parts":[{"pid":"q3a","label":"א","kind":"open","rows":6,"prompt":"<p dir=\"auto\"><b>הראו דוגמה נגדית<\/b> לטענה הבאה: תהיינה <span class=\"math\">L₁, L₂<\/span> שתי שפות לא רגולריות. אם <span class=\"math\">L₁ ⊆ L ⊆ L₂<\/span> אזי <span class=\"math\">L<\/span> בהכרח לא רגולרית.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q3b","label":"ב","kind":"open","rows":6,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">L<\/span> איננה חסרת הקשר אזי <span class=\"math\">L<sup>*<\/sup><\/span> איננה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q3c","label":"ג","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>ספקו דקדוק חסר הקשר<\/b> לשפה:<\/p><div class=\"lang-def\">L = {uv<sup>R<\/sup> | |u| = |v| and ∀i: u<sub>i<\/sub> ≠ v<sub>i<\/sub>}&nbsp;&nbsp;(Σ = {a,b})<\/div>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3d","label":"ד","kind":"open","rows":7,"prompt":"<p dir=\"auto\"><b>הפריכו<\/b> את הטענה הבאה: אם <span class=\"math\">L₁<\/span> חסרת הקשר ו-<span class=\"math\">L₂<\/span> רגולרית, אז <span class=\"math\">L₁ XOR L₂<\/span> חסרת הקשר.<\/p><div class=\"lang-def\">L₁ XOR L₂ = {w | (w ∈ L₁ or w ∈ L₂) and w ∉ L₁ ∩ L₂}<\/div>","tags":{"subj":"closure","qt":"claim"}}]},{"n":"4","heading":"שאלה 4 (10 נקודות)","points":10,"intro":"","parts":[{"pid":"q4a","label":"א","kind":"open","rows":4,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> תהי <span class=\"math\">M<\/span> מכונת טיורינג. אם <span class=\"math\">L(M) = Σ<sup>*<\/sup><\/span> אזי <span class=\"math\">M<\/span> בהכרח <b>מכריעה<\/b> את השפה <span class=\"math\">Σ<sup>*<\/sup><\/span>.<\/p>","tags":{"subj":"tm","qt":"claim"}},{"pid":"q4b","label":"ב","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> תהי <span class=\"math\">M<\/span> מכונת טיורינג. ‏<span class=\"math\">L(M)<\/span> איננה כריעה אם ורק אם קיימת מילה <span class=\"math\">w<\/span> כך ש-<span class=\"math\">M<\/span> לא עוצרת על <span class=\"math\">w<\/span>.<\/p>","tags":{"subj":"tm","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b>&nbsp; <span class=\"math\">L = {0<sup>n<\/sup>10<sup>n<\/sup>1 | n is odd}<\/span>.<\/p>\n<p><b><span class=\"math\">L<\/span> is not regular:<\/b> define a substitution <span class=\"math\">h(0) = a + b<\/span>, <span class=\"math\">h(1) = 1<\/span>. Then <span class=\"math\">h(L) ∩ L(a<sup>*<\/sup>1b<sup>*<\/sup>1) = {a<sup>n<\/sup>1b<sup>n<\/sup>1}<\/span>. Define <span class=\"math\">g(a) = a<\/span>, <span class=\"math\">g(b) = b<\/span>, <span class=\"math\">g(1) = ε<\/span> and obtain <span class=\"math\">g({a<sup>n<\/sup>1b<sup>n<\/sup>1}) = {a<sup>n<\/sup>b<sup>n<\/sup>}<\/span> — a non-regular language. Since regular languages are closed under substitution and intersection, if <span class=\"math\">L<\/span> were regular so would <span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>}<\/span> be — contradiction.<\/p>\n<p><b><span class=\"math\">L<\/span> is a CFL:<\/b><\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → 0<span class=\"nt\">A<\/span>01<\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → 00<span class=\"nt\">A<\/span>00 | 1<\/div>\n<\/div>\n<p><b>And:<\/b> <span class=\"math\">dropEven(L) = {0<sup>n<\/sup> | n ≥ 2 and n is even}<\/span> — a regular language (in <span class=\"math\">0<sup>n<\/sup>10<sup>n<\/sup>1<\/span> with odd <span class=\"math\">n<\/span>, both <span class=\"math\">1<\/span>'s sit at even positions and are dropped, and exactly <span class=\"math\">n+1<\/span> zeros survive).<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b>&nbsp; <span class=\"math\">L = Σ<sup>+<\/sup><\/span>: every word is the dropEven-image of some word (e.g. pad each letter), so <span class=\"math\">dropEven(Σ<sup>+<\/sup>) = Σ<sup>+<\/sup><\/span>, and <span class=\"math\">Σ<sup>+<\/sup><\/span> is certainly context-free.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>Sketch:<\/b> create two copies of the states of the DFA — the sets <span class=\"math\">Q_A<\/span> and <span class=\"math\">Q_B<\/span> — while accepting states are only in the copy <span class=\"math\">Q_A<\/span>.<\/p>\n<ul>\n<li>Move from <span class=\"math\">Q_A<\/span> to <span class=\"math\">Q_B<\/span> according to the transitions defined by <span class=\"math\">δ<\/span> (reading the \"kept\" letter <span class=\"math\">σ_i<\/span>).<\/li>\n<li>For each transition from <span class=\"math\">q<\/span> to <span class=\"math\">p<\/span> (on any letter), move from <span class=\"math\">q_B<\/span> to <span class=\"math\">p_A<\/span> using an <span class=\"math\">ε<\/span>-transition (guessing the dropped letter <span class=\"math\">μ_i<\/span>).<\/li>\n<\/ul>\n<p>A run of the NFA on <span class=\"math\">σ₁…σ_n<\/span> corresponds exactly to a run of the DFA on some <span class=\"math\">σ₁μ₁…σ_nμ_n<\/span>, so the NFA recognizes <span class=\"math\">dropEven(L)<\/span>.<\/p>\n<\/div>"},{"ref":"q1d","html":"<div class=\"ltr-sol\">\n<p>Consider <span class=\"math\">w = 0<sup>p<\/sup>1<sup>p<\/sup>1<sup>p<\/sup>0<sup>p<\/sup><\/span> and let <span class=\"math\">uvxyz<\/span> be a partition of <span class=\"math\">w<\/span> such that <span class=\"math\">|vy| &gt; 0<\/span> and <span class=\"math\">|vxy| ≤ p<\/span>.<\/p>\n<ul>\n<li><b>Case 1 — <span class=\"math\">vy<\/span> homogeneous:<\/b> after pumping, the number of zeros does not equal the number of ones, while <span class=\"math\">#₀(w) = #₁(w)<\/span> implies <span class=\"math\">#₀(ww<sup>R<\/sup>) = #₁(ww<sup>R<\/sup>)<\/span> for every member of the language — so the pumped word leaves the language.<\/li>\n<li><b>Case 2 — <span class=\"math\">vy<\/span> heterogeneous:<\/b>\n  <ul>\n  <li><b>2.1<\/b> — <span class=\"math\">vy<\/span> contains an unequal number of zeros and ones: after pumping the zero\/one counts differ, as in case 1.<\/li>\n  <li><b>2.2<\/b> — <span class=\"math\">vy<\/span> contains an equal number of zeros and ones (so it straddles a 0-1 border; note <span class=\"math\">|vxy| ≤ p<\/span> keeps it inside one half):\n    <ul>\n    <li><b>2.2.1<\/b> — <span class=\"math\">vy<\/span> lies in the first half: it starts with <span class=\"math\">0<\/span>; after pumping, the number of leading zeros exceeds <span class=\"math\">p<\/span> while the number of trailing zeros remains <span class=\"math\">p<\/span> — the word is no longer of the form <span class=\"math\">ww<sup>R<\/sup><\/span>.<\/li>\n    <li><b>2.2.2<\/b> — <span class=\"math\">vy<\/span> lies in the second half: analogous to 2.2.1.<\/li>\n    <\/ul><\/li>\n  <\/ul><\/li>\n<\/ul>\n<p>All cases contradict condition 3 of the lemma — <span class=\"math\">L<\/span> is not context-free.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">A ∉ R<\/span> — נובע מכך ש-<span class=\"math\">A ∉ RE<\/span>.<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">A ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> A<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">A ∈ coRE ∖ R<\/span> — בונים מזהה ל-<span class=\"math\"><span class=\"comp\">A<\/span><\/span>, ו-<span class=\"math\">A ∉ R<\/span> כי <span class=\"math\">A ∉ RE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">A ∉ RE<\/span>:<\/b> we reduce <span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> A<\/span>:<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N⟩<\/span>, where:<\/p>\n<pre>N: \"On input x:\n1. Run M on w.\n2. Reject.\"<\/pre>\n<p><span class=\"math\">f<\/span> is clearly computable as it only writes the encoding of <span class=\"math\">N<\/span> on the tape.<\/p>\n<ul>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> ⟹ <span class=\"math\">M<\/span> does not halt on <span class=\"math\">w<\/span> ⟹ <span class=\"math\">N<\/span> does not halt on any input ⟹ <span class=\"math\">N<\/span> does not reject any input ⟹ <span class=\"math\">⟨N⟩ ∈ A<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> ⟹ <span class=\"math\">M<\/span> halts on <span class=\"math\">w<\/span> ⟹ <span class=\"math\">N<\/span> rejects all inputs (in particular <span class=\"math\">w′·w′<\/span> for palindromes <span class=\"math\">w′<\/span>) ⟹ <span class=\"math\">⟨N⟩ ∉ A<\/span>.<\/li>\n<\/ul>\n<p>Since <span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span> ∉ RE<\/span>, also <span class=\"math\">A ∉ RE<\/span> (and in particular <span class=\"math\">A ∉ R<\/span>).<\/p>\n<p><b><span class=\"math\">A ∈ coRE<\/span>:<\/b> we build a recognizer <span class=\"math\">S<\/span> for <span class=\"math\"><span class=\"comp\">A<\/span> = {⟨M⟩ | M is a TM and ∃w ∈ PAL s.t. M rejects w·w}<\/span>:<\/p>\n<pre>S: \"On input ⟨M⟩:\n1. For i = 1, 2, …:\n   1.1. For j = 0, 1, …, i:\n      1.1.1. For every x ∈ Σ^j in lexicographical order:\n         1.1.1.1. If x = x^R:\n            1.1.1.1.1. Run M on xx for i steps.\n            1.1.1.1.2. If M rejected, accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M⟩ ∉ <span class=\"comp\">A<\/span><\/span>: for every palindrome <span class=\"math\">w<\/span>, <span class=\"math\">M<\/span> does not reject <span class=\"math\">ww<\/span>. Hence <span class=\"math\">S<\/span> never accepts in line 1.1.1.1.2 — and since that is the only accepting line, <span class=\"math\">S<\/span> does not accept <span class=\"math\">⟨M⟩<\/span> (it never halts).<\/li>\n<li><span class=\"math\">⟨M⟩ ∈ <span class=\"comp\">A<\/span><\/span>: there exists <span class=\"math\">w ∈ PAL<\/span> such that <span class=\"math\">M<\/span> rejects <span class=\"math\">ww<\/span> in some number <span class=\"math\">k<\/span> of steps. Each execution of line 1.1.1.1.1 terminates in finite time, and the sets iterated in lines 1.1 and 1.1.1 are finite — so each iteration of the outer loop terminates. Hence <span class=\"math\">S<\/span> accepts <span class=\"math\">⟨M⟩<\/span> at the latest when <span class=\"math\">i = max{|w|, k}<\/span>, <span class=\"math\">j = |w|<\/span> and <span class=\"math\">x = w<\/span>.<\/li>\n<\/ul>\n<div class=\"note\" dir=\"rtl\"><b>הערת המרצה (מהפתרון הרשמי):<\/b> ההוכחה כאן שונה מזו שראיתם בתרגול. בתרגול בחרנו מילה ספציפית <span class=\"math\">w<\/span> (לפי מספר צעדים, אורך וסדר לקסיקוגרפי) והראינו שהמזהה מגיע אליה באיטרציה <span class=\"math\">i = k<\/span>; כאן הראינו שקבלה מתרחשת <b>לכל המאוחר<\/b> באיטרציה <span class=\"math\">i = max{|w|, k}<\/span>. שתי ההוכחות שונות — ושתיהן קבילות. בשתיהן חשוב להוכיח שהמזהה <b>מגיע<\/b> למילה שמקיימת את התנאי ואז מקבל — כלומר שהוא לא נתקע בלולאה אינסופית לפני כן.<\/div>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example: <span class=\"math\">L₁ = {a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span>, <span class=\"math\">L = L(a<sup>*<\/sup>b<sup>*<\/sup>)<\/span>, <span class=\"math\">L₂ = L(a<sup>*<\/sup>b<sup>*<\/sup>) ∪ {b<sup>n<\/sup>a<sup>n<\/sup>}<\/span>.<\/p>\n<p><span class=\"math\">L₁<\/span> and <span class=\"math\">L₂<\/span> are non-regular, <span class=\"math\">L₁ ⊆ L ⊆ L₂<\/span>, and yet <span class=\"math\">L = a<sup>*<\/sup>b<sup>*<\/sup><\/span> is regular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example: <span class=\"math\">L = {a<sup>p<\/sup> | p is a prime number} ∪ {a}<\/span>.<\/p>\n<p><span class=\"math\">L<\/span> is not context-free (removing one word from a non-CFL keeps it non-CFL — {a<sup>p<\/sup>} is not CFL), but since <span class=\"math\">a ∈ L<\/span>, the star contains every power: <span class=\"math\">L<sup>*<\/sup> = L(a<sup>*<\/sup>)<\/span> — regular, and in particular context-free.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → a<span class=\"nt\">S<\/span>b | b<span class=\"nt\">S<\/span>a | ε<\/div>\n<\/div>\n<p>In <span class=\"math\">uv<sup>R<\/sup><\/span>, position <span class=\"math\">i<\/span> of <span class=\"math\">u<\/span> is matched against position <span class=\"math\">i<\/span> of <span class=\"math\">v<\/span> — which sits mirrored in <span class=\"math\">v<sup>R<\/sup><\/span>. Each rule generates one such mirrored pair with <b>different<\/b> letters (<span class=\"math\">a…b<\/span> or <span class=\"math\">b…a<\/span>), exactly the condition <span class=\"math\">u_i ≠ v_i<\/span> for all <span class=\"math\">i<\/span>.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>Disproof.<\/b> Assume the statement were correct. Let <span class=\"math\">L₁<\/span> be any CFL and take <span class=\"math\">L₂ = Σ<sup>*<\/sup><\/span> (regular). Then:<\/p>\n<div class=\"lang-def\">L₁ XOR Σ<sup>*<\/sup> = <span class=\"comp\">L₁<\/span><\/div>\n<p>So the complement of every CFL would be a CFL — but CFLs are <b>not<\/b> closed under complement. Contradiction, hence the statement is incorrect.<\/p>\n<\/div>"},{"ref":"q4a","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b> ‏<span class=\"math\">L(M) = Σ<sup>*<\/sup><\/span> means <span class=\"math\">M<\/span> accepts — and in particular halts on — all inputs. A machine that halts on every input and accepts exactly <span class=\"math\">Σ<sup>*<\/sup><\/span> is by definition a decider of <span class=\"math\">Σ<sup>*<\/sup><\/span>.<\/p>\n<\/div>"},{"ref":"q4b","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Let <span class=\"math\">M<\/span> be a TM which loops on all inputs. There certainly exists a word on which <span class=\"math\">M<\/span> does not halt — yet <span class=\"math\">L(M) = ∅<\/span>, which is decidable (and in particular regular). So the \"only if\" direction fails.<\/p>\n<\/div>"}]}]</script>

id":"L010","ans":"cfl","html":"{ub<sup>n<\/sup>v | u ∈ {a,b}<sup>*<\/sup>, v ∈ {b,c}<sup>*<\/sup>, |u| = |v|, n &gt; 0}","src":"Feb 2016 Term A","note":"PDA דוחף את u, מנחש את בלוק ה־b האמצעי, ומרוקן מול v. |u|=|v| ⇒ לא רגולרית."},{"id":"L011","ans":"reg","html":"{a<sup>n<\/sup>ub<sup>n<\/sup> | n &gt; 0, u ∈ {a,b}<sup>*<\/sup>}","src":"Feb 2016 Term A","note":"מלכודת: כאן u מכיל גם a וגם b, ולכן n=1 תמיד עובד — זו בדיוק a{a,b}<sup>*<\/sup>b. השוו ל־L007!"},{"id":"L012","ans":"cfl","html":"{xy | x,y ∈ {0,1}<sup>*<\/sup>, |x| = |y| but x ≠ y}","src":"Feb 2016 Term A","note":"משפט מפתיע: אי־שוויון במקום אחד ניתן לפירוק לשני בלוקים אי־זוגיים סביב עמדה שונה — חסר הקשר."}]</script>
<script type="text/plain" id="d-defs"><h1>דף נוסחאות והגדרות</h1>
<p class="chapter-subtitle">הנוסח שמצורף רשמית למבחני 2023–2024 (מתורגם ומורחב קלות) — כדאי להכיר אותו היטב: הוא זמין לכם בזמן המבחן</p>

<section>
  <h2>אוטומטים סופיים</h2>

  <div class="def"><span class="term">אוטומט סופי דטרמיניסטי (DFA)</span> —
    חמישייה <span class="math">A = (Q, Σ, δ, q<sub>s</sub>, F)</span> כאשר:
    <ul>
      <li><span class="math">Q</span> — קבוצה סופית של מצבים.</li>
      <li><span class="math">Σ</span> — קבוצה סופית, האלף־בית.</li>
      <li><span class="math">δ: Q × Σ → Q</span> — פונקציית המעברים.</li>
      <li><span class="math">q<sub>s</sub> ∈ Q</span> — המצב ההתחלתי.</li>
      <li><span class="math">F ⊆ Q</span> — קבוצת המצבים המקבלים.</li>
    </ul>
  </div>

  <div class="def"><span class="term">אוטומט סופי לא־דטרמיניסטי (NFA)</span> —
    חמישייה <span class="math">B = (Q, Σ, δ, q<sub>s</sub>, F)</span>, זהה ל־DFA פרט לפונקציית המעברים:
    <div class="lang-def">δ: Q × Σ<sub>ε</sub> → P(Q)&nbsp;&nbsp;,&nbsp;&nbsp;Σ<sub>ε</sub> = Σ ∪ {ε}</div>
    כלומר מכל מצב, על כל אות (או על <span class="math">ε</span>), עוברים ל<em>קבוצת</em> מצבים אפשריים.
  </div>

  <div class="thm"><span class="term">שפה רגולרית</span> — שפה נקראת רגולרית אם ורק אם קיים אוטומט סופי שמזהה אותה
    (שקול: קיים ביטוי רגולרי שמתאר אותה; שקול: קיים דקדוק רגולרי שיוצר אותה).</div>
</section>

<section>
  <h2>המרות בין מודלים רגולריים</h2>

  <div class="algo">
    <h4>NFA ← DFA (בניית תת־הקבוצות)</h4>
    <p>בהינתן <span class="math">N = (Q<sub>N</sub>, Σ<sub>N</sub>, δ<sub>N</sub>, q<sub>sN</sub>, F<sub>N</sub>)</span> נבנה
      <span class="math">D = (Q<sub>D</sub>, Σ<sub>D</sub>, δ<sub>D</sub>, q<sub>sD</sub>, F<sub>D</sub>)</span>:</p>
    <ul>
      <li><span class="math">Q<sub>D</sub> = P(Q<sub>N</sub>)</span> (קבוצת החזקה).</li>
      <li><span class="math">Σ<sub>D</sub> = Σ<sub>N</sub></span>.</li>
      <li>לכל <span class="math">R ∈ Q<sub>D</sub></span> ולכל <span class="math">σ ∈ Σ<sub>D</sub></span>:
        <span class="math">δ<sub>D</sub>(R, σ) = ⋃<sub>r∈R</sub> E(δ<sub>N</sub>(r, σ))</span>,
        כאשר <span class="math">E(R)</span> היא סגירת ה־<span class="math">ε</span> — כל המצבים שנגישים מ־<span class="math">R</span> במעברי <span class="math">ε</span> בלבד.</li>
      <li><span class="math">q<sub>sD</sub> = E(q<sub>sN</sub>)</span>.</li>
      <li><span class="math">F<sub>D</sub> = {R ∈ Q<sub>D</sub> | R ∩ F<sub>N</sub> ≠ ∅}</span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>Regex ← NFA</h4>
    <ol>
      <li>מציירים NFA בן שני מצבים שהמעבר ביניהם מסומן בביטוי <span class="math">r</span> כולו.</li>
      <li>מעבר שמסומן <span class="math">r + s</span> מוחלף בשני חיצים מקבילים — אחד <span class="math">r</span> ואחד <span class="math">s</span>.</li>
      <li>מעבר שמסומן <span class="math">rs</span> מוחלף בשני חיצים עוקבים דרך מצב ביניים חדש.</li>
      <li>מעבר שמסומן <span class="math">r<sup>*</sup></span> מוחלף במבנה: <span class="math">ε</span> פנימה, לולאת <span class="math">r</span> עצמית, <span class="math">ε</span> החוצה.</li>
      <li>ממשיכים עד שכל התוויות הן אותיות מ־<span class="math">Σ<sub>ε</sub></span>.</li>
    </ol>
  </div>

  <div class="algo">
    <h4>NFA ← Regex&nbsp;: דרך GNFA (אלימינציית מצבים)</h4>
    <p><b>שלב א — הפיכה ל־GNFA:</b></p>
    <ul>
      <li>מצב התחלתי חדש <span class="math">s</span> עם <span class="math">δ(s, ε) = q<sub>s</sub></span>, כך שמההתחלה יוצאים חיצים בלבד.</li>
      <li>מצב מקבל יחיד חדש <span class="math">f</span>: לכל <span class="math">q ∈ F</span> מוסיפים <span class="math">δ(q, ε) = f</span>, וקובעים <span class="math">F = {f}</span>.</li>
      <li>בין כל זוג מצבים יש בדיוק חץ אחד: חיצים מקבילים מוחלפים בסכום (<span class="math">+</span>) של התוויות; אם אין חץ — מוסיפים חץ בתווית <span class="math">∅</span>.</li>
    </ul>
    <p><b>שלב ב — אלימינציה:</b> מסלקים בכל פעם מצב <span class="math">k ≠ s, f</span>, ולכל זוג <span class="math">(i, j)</span> מעדכנים:</p>
    <div class="lang-def">new(i,j) = old(i,j) + old(i,k)·old(k,k)<sup>*</sup>·old(k,j)</div>
    <p>תזכורת: <span class="math">∅<sup>*</sup> = {ε}</span>. בסוף נשארים רק <span class="math">s</span> ו־<span class="math">f</span>, והתווית על החץ ביניהם היא הביטוי הרגולרי המבוקש.</p>
  </div>
</section>

<section>
  <h2>מצבים שקולים ומינימיזציה</h2>

  <div class="def"><span class="term">מילה מפרידה (Separating word)</span> —
    לשני מצבים <span class="math">q, p ∈ Q</span>, מילה <span class="math">w ∈ Σ<sup>*</sup></span> נקראת מפרידה אם בדיוק אחד משני הריצות מסתיים במצב מקבל:
    <span class="math">δ′(q,w) ∈ F</span> אבל <span class="math">δ′(p,w) ∉ F</span>, או להפך
    (<span class="math">δ′</span> — הרחבת פונקציית המעברים למילים).
  </div>

  <div class="def"><span class="term">שקילות־k</span> — <span class="math">p ≡<sub>k</sub> q</span> אם אין מילה מפרידה באורך
    <span class="math">≤ k</span>. <span class="term">שקילות</span> — <span class="math">p ≡ q</span> אם הם
    <span class="math">k</span>־שקולים לכל <span class="math">k ≥ 0</span>.
  </div>

  <div class="algo">
    <h4>מציאת מחלקות שקילות (ל־DFA בלבד)</h4>
    <ol>
      <li>מסירים את כל המצבים הלא־נגישים.</li>
      <li>מתחילים מהחלוקה <span class="math">E<sub>0</sub> = {F, Q∖F}</span>.</li>
      <li>בצעד <span class="math">k ≥ 1</span> בונים את <span class="math">E<sub>k</sub></span>: מצבים <span class="math">q, p</span> באותה מחלקה ב־<span class="math">E<sub>k−1</sub></span> נשארים יחד אם ורק אם לכל <span class="math">σ ∈ Σ</span> מתקיים <span class="math">δ(q,σ) ≡<sub>k−1</sub> δ(p,σ)</span>.</li>
      <li>עוצרים כאשר <span class="math">E<sub>k−1</sub> = E<sub>k</sub></span>.</li>
    </ol>
  </div>

  <div class="algo">
    <h4>מינימיזציה של DFA</h4>
    <ol>
      <li>מריצים את אלגוריתם מחלקות השקילות על <span class="math">Q</span>.</li>
      <li>מקצים מצב חדש לכל מחלקת שקילות.</li>
      <li>בונים את ה־DFA הממוזער בהתאם.</li>
    </ol>
  </div>

  <div class="thm"><span class="term">טענה</span> — שני DFA־ים <span class="math">A, B</span> שקולים
    (<span class="math">L(A) = L(B)</span>) אם ורק אם <span class="math">q<sub>s<sub>A</sub></sub> ≡ q<sub>s<sub>B</sub></sub></span>
    (באוטומט האיחוד שלהם).</div>
</section>

<section>
  <h2>למת הניפוח לשפות רגולריות</h2>
  <div class="thm">
    אם <span class="math">L</span> שפה רגולרית, אז קיים <span class="math">n ∈ ℕ</span> כך שלכל מילה
    <span class="math">w ∈ L</span> עם <span class="math">|w| ≥ n</span> קיימת חלוקה <span class="math">w = xyz</span> המקיימת:
    <ol>
      <li><span class="math">|y| &gt; 0</span></li>
      <li><span class="math">|xy| ≤ n</span></li>
      <li>לכל שלם <span class="math">i ≥ 0</span>: <span class="math">w<sub>i</sub> = xy<sup>i</sup>z ∈ L</span></li>
    </ol>
  </div>
  <div class="note"><b>הערת אורך:</b> אם <span class="math">|y| = t</span> אז
    <span class="math">|xy<sup>i</sup>z| = |w| + (i−1)t</span> — שימושי כשצריך לפגוע באורך מסוים.</div>
</section>

<section>
  <h2>דקדוקים</h2>

  <div class="def"><span class="term">דקדוק חסר הקשר (CFG)</span> —
    רביעייה <span class="math">G = (V, Σ, S, R)</span>:
    <ul>
      <li><span class="math">V</span> — קבוצה סופית של משתנים.</li>
      <li><span class="math">Σ</span> — קבוצת הטרמינלים, <span class="math">V ∩ Σ = ∅</span>.</li>
      <li><span class="math">S ∈ V</span> — משתנה ההתחלה.</li>
      <li><span class="math">R</span> — קבוצה סופית של כללי גזירה מהצורה <span class="math">A → α</span>, כאשר <span class="math">A ∈ V</span> ו־<span class="math">α ∈ (V ∪ Σ)<sup>*</sup></span>.</li>
    </ul>
    שפה שנוצרת על ידי CFG נקראת <span class="term">שפה חסרת הקשר (CFL)</span> —
    ושפה היא חסרת הקשר אם ורק אם קיים אוטומט מחסנית שמזהה אותה.
  </div>

  <div class="def"><span class="term">דקדוק רגולרי (RG)</span> — כל כלל הוא מאחת הצורות:
    <div class="gram"><div class="rule">A → w</div><div class="rule">A → wB</div></div>
    כאשר <span class="math">A, B ∈ V</span> ו־<span class="math">w ∈ Σ<sup>*</sup></span>.
    <span class="term">דקדוק רגולרי פשוט (SRG)</span> — כל כלל מהצורה
    <span class="math">A → σ</span> (עם <span class="math">σ ∈ Σ</span>),
    <span class="math">A → σB</span> (עם <span class="math">σ ∈ Σ<sub>ε</sub></span>),
    או <span class="math">A → ε</span>.
  </div>

  <div class="algo">
    <h4>RG ← NFA</h4>
    <ul>
      <li>משתנה לכל מצב; <span class="math">S</span> — המשתנה של <span class="math">q<sub>s</sub></span>.</li>
      <li>לכל מעבר <span class="math">δ(A, σ) = B</span> מוסיפים כלל <span class="math">A → σB</span>; לכל מעבר <span class="math">δ(A, ε) = B</span> מוסיפים <span class="math">A → B</span>.</li>
      <li>לכל מצב מקבל <span class="math">q ∈ F</span> מוסיפים <span class="math">A → ε</span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>NFA ← RG (דרך SRG)</h4>
    <ul>
      <li>הופכים את הדקדוק לפשוט (מפצלים <span class="math">A → σ<sub>1</sub>σ<sub>2</sub>…σ<sub>n</sub>B</span> לשרשרת כללים באות אחת).</li>
      <li>מצב לכל משתנה; <span class="math">q<sub>s</sub> = S</span>.</li>
      <li><span class="math">A → σB</span> נותן מעבר <span class="math">δ(A, σ) = B</span>; <span class="math">A → B</span> נותן מעבר <span class="math">ε</span>.</li>
      <li>לכל <span class="math">A → σ</span>: מוסיפים מצב חדש <span class="math">q<sub>i</sub></span>, מעבר <span class="math">δ(A, σ) = q<sub>i</sub></span>, ומכניסים את <span class="math">q<sub>i</sub></span> ל־<span class="math">F</span>.</li>
    </ul>
  </div>
</section>

<section>
  <h2>פישוט דקדוק ו־CNF</h2>

  <div class="def"><span class="term">דקדוק מפושט</span> — דקדוק ללא כללי <span class="math">ε</span>
    (מהצורה <span class="math">A → ε</span>; מותר רק <span class="math">S → ε</span>) וללא כללי יחידה
    (מהצורה <span class="math">A → B</span>).</div>

  <div class="algo">
    <h4>הסרת כללי ε</h4>
    <ol>
      <li>בוחרים כלל <span class="math">A → ε</span> (עם <span class="math">A ≠ S</span>) ומסירים אותו.</li>
      <li>לכל כלל <span class="math">B → αAβ</span> מוסיפים (בלי להסיר את המקור) את <span class="math">B → αβ</span> — לכל מופע של <span class="math">A</span> בנפרד: מ־<span class="math">B → αAβAγ</span> נקבל גם <span class="math">B → αβAγ</span>, גם <span class="math">B → αAβγ</span> וגם <span class="math">B → αβγ</span>. עבור <span class="math">B → A</span> מוסיפים <span class="math">B → ε</span> (אלא אם כבר הוסר).</li>
      <li>חוזרים עד שלא נותרו כללי <span class="math">ε</span>.</li>
    </ol>
    <p class="small"><b>אם <span class="math">ε ∈ L</span>:</b> מריצים את האלגוריתם ואז מוסיפים משתנה התחלה חדש עם
      <span class="math">S′ → S | ε</span>.</p>
  </div>

  <div class="algo">
    <h4>הסרת כללי יחידה</h4>
    <ol>
      <li>בוחרים כלל יחידה <span class="math">A → B</span> ומסירים אותו.</li>
      <li>לכל כלל <span class="math">B → α</span> מוסיפים <span class="math">A → α</span>.</li>
      <li>חוזרים עד שלא נותרו כללי יחידה.</li>
    </ol>
  </div>

  <div class="def"><span class="term">צורת חומסקי הנורמלית (CNF)</span> — כל כלל הוא מאחת הצורות:
    <div class="gram"><div class="rule">A → BC</div><div class="rule">A → σ</div></div>
    כאשר <span class="math">A, B, C ∈ V</span>, <span class="math">B, C ≠ S</span>, ו־<span class="math">σ ∈ Σ</span>.
    אם <span class="math">ε ∈ L</span> מותר גם <span class="math">S → ε</span>.
  </div>

  <div class="algo">
    <h4>CNF ← CFG</h4>
    <ol>
      <li>מוסיפים משתנה התחלה חדש <span class="math">S′</span> וכלל <span class="math">S′ → S</span>.</li>
      <li>מסירים כללי <span class="math">ε</span>.</li>
      <li>מסירים כללי יחידה.</li>
      <li>מתקנים את הכללים שנותרו: טרמינל <span class="math">σ<sub>i</sub></span> בכלל ארוך מוחלף במשתנה <span class="math">A<sub>i</sub></span> עם כלל <span class="math">A<sub>i</sub> → σ<sub>i</sub></span>; כלל <span class="math">A → B<sub>1</sub>B<sub>2</sub>…B<sub>n</sub></span> (עם <span class="math">n &gt; 2</span>) מפוצל ל־<span class="math">A → B<sub>1</sub>C<sub>1</sub></span> ו־<span class="math">C<sub>1</sub> → B<sub>2</sub>…B<sub>n</sub></span>, וחוזר חלילה.</li>
    </ol>
  </div>
</section>

<section>
  <h2>אוטומט מחסנית (PDA)</h2>

  <div class="def"><span class="term">PDA</span> — שישייה <span class="math">A = (Q, Σ, Γ, δ, q<sub>s</sub>, F)</span>:
    <ul>
      <li><span class="math">Q</span> — מצבים; <span class="math">Σ</span> — אלף־בית הקלט; <span class="math">Γ</span> — אלף־בית המחסנית.</li>
      <li><span class="math">δ: Q × Σ<sub>ε</sub> × Γ<sub>ε</sub> → P(Q × Γ<sub>ε</sub>)</span> — פונקציית המעברים (קוראים אות או <span class="math">ε</span>, מוציאים סמל מחסנית או <span class="math">ε</span>, דוחפים סמל או <span class="math">ε</span>).</li>
      <li><span class="math">q<sub>s</sub> ∈ Q</span> התחלתי; <span class="math">F ⊆ Q</span> מקבלים.</li>
    </ul>
  </div>

  <div class="def"><span class="term">PDA מפושט</span> —
    יש לו מצב מקבל יחיד <span class="math">q<sub>f</sub></span>; לפני קבלה המחסנית חייבת להיות ריקה;
    וכל מעבר או מוציא סמל מהמחסנית (pop) או מכניס סמל (push), אך לא שניהם.
  </div>

  <div class="algo">
    <h4>PDA ← CFG</h4>
    <p>בהינתן <span class="math">G = (V, Σ, S, R)</span> בונים PDA עם שלושה מצבים
      <span class="math">q<sub>start</sub> → q<sub>loop</sub> → q<sub>accept</sub></span>:</p>
    <ul>
      <li>בכניסה דוחפים <span class="math">S$</span> (מעבר <span class="math">ε,ε→S$</span>).</li>
      <li>ב־<span class="math">q<sub>loop</sub></span>: לכל כלל <span class="math">A → α<sub>1</sub>…α<sub>k</sub></span> — מעבר <span class="math">ε, A → α<sub>1</sub>…α<sub>k</sub></span>; לכל <span class="math">a ∈ Σ</span> — מעבר <span class="math">a, a → ε</span>.</li>
      <li>מעבר <span class="math">ε, $ → ε</span> אל <span class="math">q<sub>accept</sub></span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>CFG ← PDA</h4>
    <p>בהינתן PDA מפושט <span class="math">P = (Q, Σ<sub>P</sub>, Γ, δ, q<sub>s</sub>, {q<sub>f</sub>})</span>, לכל
      <span class="math">p, q ∈ Q</span> מגדירים את <span class="math">L<sub>p,q</sub></span> — כל המילים שמריצות את
      <span class="math">P</span> ממצב <span class="math">p</span> עם מחסנית ריקה למצב <span class="math">q</span> עם מחסנית ריקה.
      שימו לב: <span class="math">L(P) = L<sub>q<sub>s</sub>,q<sub>f</sub></sub></span>.</p>
    <p>בונים דקדוק עם משתנים <span class="math">A<sub>p,q</sub></span> לכל זוג מצבים, <span class="math">S = A<sub>q<sub>s</sub>,q<sub>f</sub></sub></span>, וכללים:</p>
    <ul>
      <li>לכל <span class="math">p, q, r ∈ Q</span>: <span class="math">A<sub>p,q</sub> → A<sub>p,r</sub>A<sub>r,q</sub></span>.</li>
      <li>לכל <span class="math">p ∈ Q</span>: <span class="math">A<sub>p,p</sub> → ε</span>.</li>
      <li>לכל <span class="math">p, q, r, s ∈ Q</span>, <span class="math">γ ∈ Γ</span>, <span class="math">σ′, σ″ ∈ Σ<sub>ε</sub></span> כך ש־<span class="math">(r, γ) ∈ δ(p, σ′, ε)</span> (push) ו־<span class="math">(q, ε) ∈ δ(s, σ″, γ)</span> (pop):
        מוסיפים <span class="math">A<sub>p,q</sub> → σ′A<sub>r,s</sub>σ″</span>.</li>
    </ul>
  </div>
</section>

<section>
  <h2>למת הניפוח לשפות חסרות הקשר</h2>
  <div class="thm">
    אם <span class="math">L</span> שפה חסרת הקשר, אז קיים <span class="math">p ∈ ℕ</span> כך שלכל
    <span class="math">w ∈ L</span> עם <span class="math">|w| ≥ p</span> קיימת חלוקה
    <span class="math">w = uvxyz</span> המקיימת:
    <ol>
      <li><span class="math">|vy| &gt; 0</span></li>
      <li><span class="math">|vxy| ≤ p</span></li>
      <li>לכל שלם <span class="math">i ≥ 0</span>: <span class="math">w<sub>i</sub> = uv<sup>i</sup>xy<sup>i</sup>z ∈ L</span></li>
    </ol>
  </div>
  <div class="note"><b>הערת אורך:</b> אם <span class="math">|v| = s</span> ו־<span class="math">|y| = t</span> אז
    <span class="math">|uv<sup>i</sup>xy<sup>i</sup>z| = |w| + (i−1)s + (i−1)t</span>.</div>
</section>

<section>
  <h2>הצבה (Substitution)</h2>
  <div class="def"><span class="term">הצבה</span> — בהינתן אלף־ביתים <span class="math">Σ<sub>1</sub>, Σ<sub>2</sub></span>,
    הצבה היא פונקציה <span class="math">f: Σ<sub>1</sub> → P(Σ<sub>2</sub><sup>*</sup>)</span> — לכל אות
    <span class="math">σ ∈ Σ<sub>1</sub></span> מתאימים שפה <span class="math">L<sub>σ</sub></span> מעל <span class="math">Σ<sub>2</sub></span>.
    ההרחבה למילה: <span class="math">f(w) = {w<sub>1</sub>w<sub>2</sub>…w<sub>n</sub> | w<sub>i</sub> ∈ f(σ<sub>i</sub>)}</span>;
    ולשפה: <span class="math">f(L) = ⋃<sub>w∈L</sub> f(w)</span>.
  </div>
  <div class="thm"><span class="term">הצבה רגולרית</span> — אם <span class="math">L</span> רגולרית וכל
    <span class="math">L<sub>σ</sub></span> רגולרית, אז <span class="math">f(L)</span> רגולרית.
    <span class="term">הצבה חסרת הקשר</span> — אם <span class="math">L</span> חסרת הקשר וכל
    <span class="math">L<sub>σ</sub></span> חסרת הקשר, אז <span class="math">f(L)</span> חסרת הקשר.</div>
</section>

<section>
  <h2>מכונת טיורינג</h2>
  <div class="def"><span class="term">מכונת טיורינג (TM)</span> —
    שביעייה <span class="math">M = (Q, Σ, Γ, δ, q<sub>s</sub>, q<sub>acc</sub>, q<sub>rej</sub>)</span>:
    <ul>
      <li><span class="math">Q</span> — קבוצה סופית של מצבים.</li>
      <li><span class="math">Σ</span> — אלף־בית הקלט; תו הרווח <span class="math">␣ ∉ Σ</span>.</li>
      <li><span class="math">Γ</span> — אלף־בית הסרט; <span class="math">␣ ∈ Γ</span> וגם <span class="math">Σ ⊆ Γ</span>.</li>
      <li><span class="math">δ: Q × Γ → Q × Γ × {L, R}</span> — פונקציית המעברים.</li>
      <li><span class="math">q<sub>s</sub></span> התחלתי; <span class="math">q<sub>acc</sub></span> מקבל; <span class="math">q<sub>rej</sub></span> דוחה.</li>
    </ul>
  </div>
</section>

<section>
  <h2>השפות המרכזיות</h2>
  <div class="def">
    <ul class="major-langs">
      <li><span class="math">A<sub>DFA</sub> = {⟨D, w⟩ | D is a DFA and D accepts w}</span></li>
      <li><span class="math">A<sub>TM</sub> = {⟨M, w⟩ | M is a TM and M accepts w}</span></li>
      <li><span class="math">HALT<sub>TM</sub> = {⟨M, w⟩ | M is a TM and M halts on input w}</span></li>
      <li><span class="math">E<sub>DFA</sub> = {⟨D⟩ | D is a DFA and L(D) = ∅}</span></li>
      <li><span class="math">E<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) = ∅}</span></li>
      <li><span class="math">REG<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) is a regular language}</span></li>
      <li><span class="math">EQ<sub>DFA</sub> = {⟨D<sub>1</sub>, D<sub>2</sub>⟩ | D<sub>1</sub>, D<sub>2</sub> are DFAs and L(D<sub>1</sub>) = L(D<sub>2</sub>)}</span></li>
      <li><span class="math">EQ<sub>TM</sub> = {⟨M<sub>1</sub>, M<sub>2</sub>⟩ | M<sub>1</sub>, M<sub>2</sub> are TMs and L(M<sub>1</sub>) = L(M<sub>2</sub>)}</span></li>
      <li><span class="math">PAL = {w | w ∈ Σ<sup>*</sup> and w = w<sup>R</sup>}</span></li>
      <li><span class="math">PAL<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) = PAL}</span></li>
      <li><span class="math">L<sub>∞</sub> = {⟨M⟩ | M is a TM and L(M) is infinite}</span></li>
    </ul>
  </div>
  <div class="note"><b>סטטוס כריעות (מהקורס):</b>
    <span class="math">A<sub>DFA</sub>, E<sub>DFA</sub>, EQ<sub>DFA</sub> ∈ R</span>&nbsp;·&nbsp;
    <span class="math">A<sub>TM</sub>, HALT<sub>TM</sub> ∈ RE ∖ R</span>&nbsp;·&nbsp;
    <span class="math">E<sub>TM</sub> ∈ coRE ∖ R</span>&nbsp;·&nbsp;
    <span class="math">REG<sub>TM</sub>, EQ<sub>TM</sub> ∉ RE ∪ coRE</span>.</div>
</section>
</script>
<script>
/* ===================== מודלים חישוביים — מרכז הכנה למבחן ===================== */
(function () {
'use strict';

const SUMS  = JSON.parse(document.getElementById('d-summaries').textContent);
const QUIZ  = JSON.parse(document.getElementById('d-quiz').textContent);
const EXAMS = JSON.parse(document.getElementById('d-exams').textContent);
const LANGB = JSON.parse(document.getElementById('d-langbank').textContent);
const DEFS  = document.getElementById('d-defs').textContent;
const TAX   = {"subjects":[{"id":"automata","he":"אוטומטים סופיים (DFA/NFA)"},{"id":"regex","he":"ביטויים רגולריים"},{"id":"minimize","he":"מינימיזציה ומצבים שקולים"},{"id":"pump-reg","he":"למת הניפוח — רגולריות"},{"id":"closure","he":"תכונות סגור ובניות"},{"id":"cfg","he":"דקדוקים חסרי הקשר"},{"id":"pda","he":"אוטומטי מחסנית"},{"id":"pump-cfl","he":"למת הניפוח — חסרות הקשר"},{"id":"tm","he":"מכונות טיורינג"},{"id":"r-re-core","he":"R / RE / coRE"},{"id":"reduction","he":"רדוקציות ואי־כריעות"},{"id":"rice","he":"משפט רייס"}],"qtypes":[{"id":"construction","he":"בנייה"},{"id":"proof","he":"הוכחה"},{"id":"pumping","he":"ניפוח"},{"id":"r-re-core","he":"סיווג R/RE/coRE"},{"id":"claim","he":"הוכח או הפרך"},{"id":"reduction","he":"רדוקציה"},{"id":"short","he":"סעיף סגור"},{"id":"open","he":"שאלה פתוחה"}]};

const KEY = 'cm-prep-v1';
const byId = {}; SUMS.forEach(s => byId[s.sid] = s);
const quizBy = {}; QUIZ.forEach(q => quizBy[q.sid] = q);
const examBy = {}; EXAMS.forEach(e => examBy[e.id] = e);

/* מאגר השאלות: כל סעיף מתויג, מכל המבחנים, בסדר הופעה קבוע */
const BANK = [];
EXAMS.forEach(e => e.questions.forEach(q => q.parts.forEach(p => {
  if(p.tags && p.tags.subj) BANK.push({ e, q, p, key: e.id + '|' + p.pid });
})));
const subjHe = id => (TAX.subjects.find(s => s.id === id) || {}).he || id;
const qtHe   = id => (TAX.qtypes.find(t => t.id === id) || {}).he || id;

/* ---------- state ---------- */
const DEF = { read:{}, understood:{}, topics:{}, exams:{}, bank:{}, lang:{}, master:false, notes:'', examDate:'', lastView:'dash', updatedAt:0, mt:{} };
let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if(!raw) return structuredClone(DEF);
    const s = Object.assign(structuredClone(DEF), JSON.parse(raw));
    if(!s.mt || typeof s.mt !== 'object') s.mt = {};
    return s; }
  catch(e){ return structuredClone(DEF); }
}
/* ---------- חותמת זמן פר־פריט ----------
   בלי זה הסנכרון היה "המכשיר האחרון ששמר דורס את הכול", ולכן התקדמות
   נעלמה. עכשיו כל סימון נושא / קריאה / תשובה נושא חותמת זמן משלו,
   והמיזוג מכריע לכל פריט בנפרד מי החדש יותר.                          */
const akey = (eid,pid) => 'a:'+eid+'|'+pid;
function touch(){ const n = Date.now();
  for(const k of arguments) if(k) S.mt[k] = n; }
function touchExam(eid, answers){
  touch('e:'+eid);
  if(answers){ const n = Date.now(); Object.keys(answers).forEach(pid => S.mt[akey(eid,pid)] = n); }
}
let saveT;
function writeLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('שגיאה בשמירה מקומית — ייתכן שהאחסון מלא','e'); return false; } }
/* שמירה מקומית בלבד — להעדפות תצוגה (לשונית אחרונה וכד'). לא מזיזה את
   updatedAt ולא דוחפת לענן, כדי שמכשיר ישן שרק דפדפו בו לא ייראה
   "חדש יותר" מהענן וידרוס התקדמות אמיתית.                             */
function saveLocal(){ clearTimeout(saveT); saveT = setTimeout(writeLocal, 150); }
function save(){ S.updatedAt = Date.now(); clearTimeout(saveT);
  saveT = setTimeout(()=>{ writeLocal(); cloudPush(); }, 150); }
function saveNow(){ S.updatedAt = Date.now(); clearTimeout(saveT); writeLocal(); cloudPush(); }

/* ---------- helpers ---------- */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => `<span class="num">${n}</span>`;
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
function htmlToText(h){
  const d = document.createElement('div'); d.innerHTML = h;
  d.querySelectorAll('pre').forEach(p => p.replaceWith(document.createTextNode('\n```\n'+p.textContent.replace(/\n+$/,'')+'\n```\n')));
  d.querySelectorAll('br').forEach(b => b.replaceWith(document.createTextNode('\n')));
  d.querySelectorAll('li').forEach(li => li.prepend(document.createTextNode('- ')));
  d.querySelectorAll('tr').forEach(tr => {
    const cells = Array.from(tr.children).map(c => c.textContent.trim());
    tr.replaceWith(document.createTextNode('| ' + cells.join(' | ') + ' |\n'));
  });
  d.querySelectorAll('p,div,h1,h2,h3,h4,ul,ol').forEach(p => p.append(document.createTextNode('\n')));
  return d.textContent.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast'+(kind?' '+kind:'');
  t.textContent = msg;
  Object.assign(t.style,{position:'fixed',insetInlineStart:'50%',transform:'translateX(-50%)',bottom:'26px',
    background: kind==='e' ? '#a32626' : '#3b2a75', color:'#fff', padding:'11px 20px', borderRadius:'10px',
    zIndex:200, boxShadow:'0 8px 28px rgba(0,0,0,.28)', fontWeight:'650', maxWidth:'90vw'});
  document.body.appendChild(t); setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0';
    setTimeout(()=>t.remove(), 420); }, 2600);
}
function download(name, text){
  const b = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const u = URL.createObjectURL(b); const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 500);
}
const tkey = (sid,i) => sid+'|'+i;

/* ---------- progress ---------- */
function stats(){
  const nS = SUMS.length;
  const read = SUMS.filter(s=>S.read[s.sid]).length;
  const und  = SUMS.filter(s=>S.understood[s.sid]).length;
  let nT=0, dT=0;
  SUMS.forEach(s=>{ s.topics.forEach((_,i)=>{ nT++; if(S.topics[tkey(s.sid,i)]?.done) dT++; }); });
  const nE = EXAMS.length, dE = EXAMS.filter(e=>S.exams[e.id]?.done).length;
  const nB = BANK.length,  dB = BANK.filter(b=>S.bank[b.key]?.done).length;
  const nL = LANGB.length, dL = LANGB.filter(l=>S.lang[l.id]?.ok).length;
  const total = read+und+dT+dE+dB+dL, max = nS+nS+nT+nE+nB+nL;
  return {nS,read,und,nT,dT,nE,dE,nB,dB,nL,dL,overall:pct(total,max)};
}
function refreshChrome(){
  const st = stats();
  $('#mini-bar i').style.width = st.overall+'%';
  $('#mini-pct').innerHTML = st.overall+'%';
  $('#tb-sum').innerHTML  = `${st.read}/${st.nS}`;
  $('#tb-top').innerHTML  = `${st.dT}/${st.nT}`;
  $('#tb-exam').innerHTML = `${st.dE}/${st.nE}`;
  const tb = $('#tb-bank'); if(tb) tb.innerHTML = `${st.dB}/${st.nB}`;
}

/* ---------- Quiz engine ---------- */
let QZ = null;
window.openQuiz = (sid, i) => {
  const qt = quizBy[sid]?.topics[i]; if(!qt) return toast('אין שאלות לנושא הזה','e');
  QZ = { sid, i, title: byId[sid].topics[i], qs: qt.q.map(q=>({...q})), picked:[], checked:false };
  renderQuiz();
  $('#ov').hidden = false; document.body.style.overflow='hidden';
};
function renderQuiz(){
  const L = ['א','ב','ג','ד','ה','ו'];
  const body = QZ.qs.map((q,qi)=>{
    const p = QZ.picked[qi];
    return `<div class="q">
      <div class="qt"><b class="qn">${qi+1}.</b>${q.q}</div>
      ${q.c.map((c,ci)=>{
        let cls='';
        if(QZ.checked){ if(ci===q.a) cls=' correct'; else if(ci===p) cls=' wrong'; }
        return `<label class="opt${cls}">
          <input type="radio" name="q${qi}" ${p===ci?'checked':''} ${QZ.checked?'disabled':''}
            onchange="QZpick(${qi},${ci})">
          <span class="ol">${L[ci]}.</span><span>${c}</span></label>`;}).join('')}
      ${QZ.checked ? `<div class="expl ${p===q.a?'good':'bad'}">
        <b>${p===q.a?'נכון.':'לא נכון — התשובה הנכונה היא '+L[q.a]+'.'}</b> ${q.e}</div>` : ''}
    </div>`;}).join('');

/* ---------- שמירת מקום בגלילה סביב render() ----------
   הצגה/הסתרה של הפתרונות מוסיפה או מורידה תוכן גם *מעל* נקודת הצפייה,
   ולכן אותו scrollY מצביע פתאום על מקום אחר — מכאן ה"קפיצה" הקטנה למעלה
   או למטה. לכן זוכרים את האלמנט שנמצא כרגע בראש החלון ואת המרחק המדויק
   שלו מראש החלון, ומחזירים אותו לאותו מרחק אחרי הרינדור.
   שומרים שרשרת עוגנים (תיבת פתרון → סעיף → שאלה) כי בהסתרה תיבת הפתרון
   עצמה נעלמת, ואז נעגנים לסעיף שמכיל אותה.                              */
function cssq(s){ return String(s).replace(/["\\]/g, '\\$&'); }
function grabAnchor(){
  const bar = document.querySelector('header, .topbar');
  const ref = bar ? Math.round(bar.getBoundingClientRect().bottom) + 4 : 8;
  /* צריך את העוגן ה*ספציפי* ביותר שחוצה את קו ראש התוכן — לא את כרטיס
     השאלה העוטף. עיגון לשאלה כולה לא מפצה על תיבות פתרון שנעלמו בתוכה,
     ואז הדף עדיין זז.                                                  */
  let hit = null;
  for(const el of $$('#app [data-anch]')){
    const r = el.getBoundingClientRect();
    if(r.bottom <= ref) continue;              // כבר גלל מעל החלון
    if(r.top <= ref) hit = el;                 // התחיל לפני הקו — עמוק יותר, ממשיכים
    else { if(!hit) hit = el; break; }         // הראשון שמתחיל מתחת לקו
  }
  if(!hit) return null;
  const chain = [];
  for(let el = hit; el; el = el.parentElement){
    const k = el.dataset && el.dataset.anch;
    if(k) chain.push({ key:k, top: el.getBoundingClientRect().top });
  }
  return chain.length ? chain : null;
}
function applyAnchor(chain){
  if(!chain) return;
  for(const a of chain){
    const el = document.querySelector('#app [data-anch="' + cssq(a.key) + '"]');
    if(!el) continue;
    const d = el.getBoundingClientRect().top - a.top;
    if(Math.abs(d) > 0.5) window.scrollBy(0, d);
    return;
  }
}
/* רינדור שמשאיר את העין באותו מקום.
   בסוף המבחן הדף מתקצר כשמסתירים פתרונות, ואז הגלילה נחסמת בתחתית ולא
   ניתן להחזיר את העוגן למקומו. לכן זוכרים את היעד המקורי: אם המשתמש לא
   גלל בעצמו מאז, הלחיצה הבאה תשתמש בו ולא במצב החסום — כך שכיבוי והדלקה
   חוזרים בדיוק לאותה נקודה גם בסוף הדף.                                */
let keepMemo = null;
function renderKeep(){
  const a = (keepMemo && Math.abs(window.scrollY - keepMemo.at) < 1) ? keepMemo.chain : grabAnchor();
  render();
  applyAnchor(a);                                  // הפריסה כבר מעודכנת
  keepMemo = a ? { chain:a, at: window.scrollY } : null;
  requestAnimationFrame(()=>{                      // ושוב, אם משהו זז מאוחר
    applyAnchor(a);
    if(keepMemo) keepMemo.at = window.scrollY;
  });
}
window.renderKeep = renderKeep;

/* ---------- דריל סיווג שפות (drill) ---------- */
let DR = null;
const drillHe = { reg:'רגולרית', cfl:'חסרת הקשר (לא רגולרית)', none:'אף לא אחת' };
window.startDrill = ()=>{
  if(!LANGB.length) return toast('מאגר השפות עדיין ריק','e');
  const fresh=[], done=[];
  LANGB.forEach(l=>{ (S.lang[l.id]?.ok ? done : fresh).push(l); });
  const sh = a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  DR = { list: sh(fresh).concat(sh(done)), idx:0, streak:0, best:0, answered:false, picked:null, lastOk:false, sessionOk:0, timer:null };
  go('drill');
};
window.drillPick = ans=>{
  if(!DR || DR.answered) return;
  const l = DR.list[DR.idx], ok = ans===l.ans;
  DR.answered=true; DR.picked=ans; DR.lastOk=ok;
  DR.streak = ok ? DR.streak+1 : 0;
  DR.best = Math.max(DR.best, DR.streak);
  if(ok) DR.sessionOk++;
  const prev = S.lang[l.id]||{};
  S.lang[l.id] = { ok: !!prev.ok || ok, tries:(prev.tries||0)+1 };
  touch('c:'+l.id); save(); refreshChrome(); render();
  if(ok) DR.timer = setTimeout(()=>{ if(DR && DR.answered && view==='drill') drillNext(); }, 1300);
};
window.drillNext = ()=>{
  if(!DR) return; clearTimeout(DR.timer);
  DR.answered=false; DR.picked=null; DR.idx++;
  render();
};
