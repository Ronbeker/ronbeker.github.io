accept. If M rejected — reject.\"<\/pre>\n  <\/div>\n\n  <p>אם <span class=\"math\">M<\/span> מקבלת את <span class=\"math\">w<\/span> — הסימולציה מגלה זאת\n    בזמן סופי ⇒ קבלה. אם לא — דחייה או לולאה (הסימולציה נמשכת לנצח). זה בדיוק פרופיל של\n    <b>מזהה<\/b>: ‏<span class=\"math\">A<sub>TM<\/sub> ∈ RE<\/span>.<\/p>\n\n  <div class=\"note\">‏<span class=\"math\">A<sub>TM<\/sub><\/span> היא \"אמא של RE\" — עוד לפני שנדבר על\n    שלמות: כל שאלת \"האם M מקבלת\" מגולמת בה. השאלה הגדולה: האם אפשר <b>להכריע<\/b> אותה?<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t3\">שיטת האלכסון: A_TM ∉ R<\/h2>\n\n  <div class=\"proof\">\n    נניח בשלילה שקיים מכריע <span class=\"math\">H<\/span> ל-<span class=\"math\">A<sub>TM<\/sub><\/span>:\n    ‏<span class=\"math\">H(⟨M,w⟩)<\/span> עונה \"כן\" אם <span class=\"math\">M<\/span> מקבלת את\n    <span class=\"math\">w<\/span>, \"לא\" אחרת — ותמיד עוצר. נבנה את המכונה:\n    <pre>D: \"On input ⟨M⟩:\n1. Run H on ⟨M, ⟨M⟩⟩.\n2. If H says yes — reject; if H says no — accept.\"<\/pre>\n    ‏<span class=\"math\">D<\/span> מכונה חוקית (משתמשת ב-<span class=\"math\">H<\/span> העוצר), אז נריץ\n    אותה על הקידוד <b>של עצמה<\/b>: ‏<span class=\"math\">D(⟨D⟩)<\/span> מקבלת\n    ⟺ ‏<span class=\"math\">H<\/span> ענה \"לא\" על <span class=\"math\">⟨D,⟨D⟩⟩<\/span>\n    ⟺ ‏<span class=\"math\">D<\/span> <b>לא<\/b> מקבלת את <span class=\"math\">⟨D⟩<\/span> — סתירה.\n    לכן <span class=\"math\">H<\/span> לא קיים. <span class=\"qed\">∎<\/span>\n  <\/div>\n\n  <p>זהו לב הקורס: <b>ההפניה העצמית<\/b> (מכונה שרצה על הקוד של עצמה) הופכת מכריע-לכאורה\n    למכונה סותרת-עצמה. אותו רעיון כמו הפרדוקס של השקרן (\"המשפט הזה שקרי\") — אבל ממוסד למתמטיקה.<\/p>\n\n  <div class=\"note\">מסקנה מיידית: ‏<span class=\"math\">RE ≠ R<\/span> — ההכלה ממש. ובצירוף\n    <span class=\"math\">R = RE ∩ coRE<\/span>: ‏<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>\n    (אחרת הייתה ב-R). את המסקנה הזו נארוז בנושא הבא.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t4\">המשלים והמפה: A_TM ∉ coRE<\/h2>\n\n  <div class=\"thm\">\n    <span class=\"math\">A<sub>TM<\/sub> ∈ RE ∖ R<\/span>, ולכן:\n    ‏<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, ‏<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∈ coRE ∖ R<\/span>,\n    ‏<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>.\n  <\/div>\n\n  <p>כללי המשלים ששווה לשנן (סימטריה מושלמת):<\/p>\n  <ul>\n    <li><span class=\"math\">L ∈ R ⟺ <span class=\"comp\">L<\/span> ∈ R<\/span> (מכריע מתהפך).<\/li>\n    <li><span class=\"math\">L ∈ RE ⟺ <span class=\"comp\">L<\/span> ∈ coRE<\/span> (הגדרה).<\/li>\n    <li><span class=\"math\">L ∈ RE ∖ R ⟹ <span class=\"comp\">L<\/span> ∈ coRE ∖ RE<\/span>… ליתר דיוק:\n      ‏<span class=\"math\"><span class=\"comp\">L<\/span> ∈ coRE ∖ R<\/span>, וגם\n      <span class=\"math\"><span class=\"comp\">L<\/span> ∉ RE<\/span> (אחרת שתיהן ב-RE ⇒ שתיהן ב-R).<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>העדים הקבועים של כל אזור<\/h4>\n    <table>\n      <tr><th>אזור<\/th><th>עדים מהקורס<\/th><\/tr>\n      <tr><td><span class=\"math\">R<\/span><\/td><td><span class=\"math\">A<sub>DFA<\/sub>, E<sub>DFA<\/sub>, EQ<sub>DFA<\/sub>, PAL<\/span><\/td><\/tr>\n      <tr><td><span class=\"math\">RE ∖ R<\/span><\/td><td><span class=\"math\">A<sub>TM<\/sub>, HALT<sub>TM<\/sub><\/span><\/td><\/tr>\n      <tr><td><span class=\"math\">coRE ∖ R<\/span><\/td><td><span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span>, <span class=\"comp\">HALT<sub>TM<\/sub><\/span>, E<sub>TM<\/sub><\/span><\/td><\/tr>\n      <tr><td>מחוץ ל-<span class=\"math\">RE ∪ coRE<\/span><\/td><td><span class=\"math\">REG<sub>TM<\/sub>, EQ<sub>TM<\/sub>, PAL<sub>TM<\/sub>, L<sub>∞<\/sub><\/span><\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t5\">סימולציה מוגבלת־צעדים — הכלי<\/h2>\n\n  <p>הבעיה: \"הרץ את M על x\" עלול לא לעצור. הפתרון: <b>\"הרץ את M על x למשך i צעדים\"<\/b> —\n    צעד שתמיד עוצר, ומדווח אחת משלוש: קיבלה \/ דחתה \/ לא סיימה עדיין.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>הבנייה המבריקה של 2024ב ש2<\/h4>\n    <pre>N_{M,w}: \"On input x:\n1. Run M on w for |x| steps.\n2. If M didn't accept during these steps — accept.\n3. Otherwise — reject.\"<\/pre>\n    <p>אם <span class=\"math\">M<\/span> לא מקבלת את <span class=\"math\">w<\/span> —\n      ‏<span class=\"math\">N<\/span> מקבל <b>כל<\/b> קלט. אם מקבלת תוך <span class=\"math\">k<\/span>\n      צעדים — ‏<span class=\"math\">N<\/span> מקבל בדיוק את המילים הקצרות מ-<span class=\"math\">k<\/span>\n      (שפה סופית ≠ ‏<span class=\"math\">Σ<sup>*<\/sup><\/span>). כך התכונה \"מקבלת-כל-קלט\" של\n      <span class=\"math\">N<\/span> מקודדת את \"<span class=\"math\">M<\/span> לא מקבלת את\n      <span class=\"math\">w<\/span>\" — רדוקציה מ-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>!\n      (מלוא הפרטים בפרק 12.)<\/p>\n  <\/div>\n\n  <div class=\"note\">הטריק \"אורך הקלט כתקציב צעדים\" הופך שאלת-אינסוף (האם אי-פעם?) לסדרת\n    שאלות סופיות. שווה לזהות אותו מיד — הוא מופיע כמעט בכל בניית מכונה מתוחכמת במבחנים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t6\">Dovetailing — לולאת החיפוש האינסופית<\/h2>\n\n  <p>איך מזהה מחפש עד <span class=\"math\">(x, k)<\/span> — מילה ותקציב — כששניהם לא חסומים?\n    מסדרים את כל הזוגות בסדרה אחת ובודקים בזה אחר זה:<\/p>\n\n  <div class=\"algo\">\n    <h4>התבנית (כמו במזהי 2023–2024)<\/h4>\n    <pre>M_L: \"On input ⟨M⟩:\n1. For i from 0 to ∞:\n   1.1. For every x with |x| ≤ i, in lexicographic order:\n      1.1.1. Run M on x for i steps.\n      1.1.2. If M accepted — accept.\"<\/pre>\n    <p>כל איטרציה <span class=\"math\">i<\/span> — עבודה <b>סופית<\/b> (מספר סופי של מילים, כל אחת\n      ל-<span class=\"math\">i<\/span> צעדים). אם קיים עד — נגיע לאיטרציה שבה גם המילה נכללת וגם\n      התקציב מספיק, ונקבל. אם לא — נרוץ לנצח, וזה בסדר: אנחנו מזהה, לא מכריע.<\/p>\n  <\/div>\n\n  <div class=\"warn\">הטעות הפוסלת: \"לכל <span class=\"math\">x<\/span>: הרץ את <span class=\"math\">M<\/span>\n    על <span class=\"math\">x<\/span> עד הסוף\" — ריצה אחת מתלולאת חוסמת את כל הבאות אחריה.\n    התקציב <span class=\"math\">i<\/span> (או ריצה-במקביל) הוא לא קישוט — הוא מה שמציל את הזיהוי.\n    בהוכחת הנכונות חובה גם לנמק שכל איטרציה סופית — כמו שהפתרונות הרשמיים עושים במפורש.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t7\">תבנית ה־∃: מתי שפה ב־RE<\/h2>\n\n  <div class=\"thm\">שפה מהצורה <span class=\"math\">{⟨M⟩ | ∃ עד סופי שניתן לאימות בזמן סופי}<\/span> —\n    ב-RE. המזהה: ‏dovetailing על כל העדים האפשריים + אימות כל מועמד.<\/div>\n\n  <ul>\n    <li>\"‏<span class=\"math\">∃x: M<\/span> מקבלת את <span class=\"math\">x<\/span>\"\n      (‏<span class=\"math\"><span class=\"comp\">E<sub>TM<\/sub><\/span><\/span>) — עד: זוג (מילה, תקציב) ✓ RE.<\/li>\n    <li>\"‏<span class=\"math\">M<\/span> עוצרת על <span class=\"math\">w<\/span>\"\n      (‏<span class=\"math\">HALT<sub>TM<\/sub><\/span>) — עד: מספר הצעדים ✓ RE.<\/li>\n    <li>\"‏<span class=\"math\">∃x, y<\/span>: ‏<span class=\"math\">M<\/span> עוצרת על <span class=\"math\">x<\/span>\n      ודוחה את <span class=\"math\">y<\/span> ו-<span class=\"math\">xy ∈ L(D)<\/span>\" — שאלה 2 של 2024א,\n      עד מורכב (שני זוגות) — אותה תבנית, לולאה מקוננת יותר ✓ RE.<\/li>\n  <\/ul>\n\n  <div class=\"note\">מבחן מהיר: נסחו את תנאי השפה ככמת. אם הוא \"∃ + אימות סופי\" — יש מזהה.\n    שימו לב שהאימות חייב לעצור: \"‏<span class=\"math\">M<\/span> <b>דוחה<\/b> את <span class=\"math\">y<\/span>\"\n    ניתן לאימות (מחכים לדחייה); \"‏<span class=\"math\">M<\/span> <b>לא מקבלת<\/b> את <span class=\"math\">y<\/span>\"\n    — לא (אולי לולאה)!<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t8\">תבנית ה־∀: מתי שפה ב־coRE<\/h2>\n\n  <div class=\"thm\">שפה שהמשלים שלה מנוסח כ-∃ (כלומר: השפה עצמה היא תנאי ∀) — ב-coRE.\n    המזהה-של-המשלים מחפש <b>עד-נגדי<\/b>.<\/div>\n\n  <ul>\n    <li>‏<span class=\"math\">E<sub>TM<\/sub> = {⟨M⟩ | ∀x: M<\/span> לא מקבלת<span class=\"math\">}<\/span> —\n      המשלים \"∃ מילה מתקבלת\" ב-RE ⇒ ‏<span class=\"math\">E<sub>TM<\/sub> ∈ coRE<\/span>.<\/li>\n    <li>\"‏<span class=\"math\">∀w ∈ PAL: M<\/span> לא דוחה את <span class=\"math\">w·w<\/span>\"\n      (שאלה 2 של מבחן-לדוגמה) — עד-נגדי: פלינדרום שנדחה ✓ coRE.<\/li>\n    <li>‏<span class=\"math\">L(M) ⊆ L(D)∘L(D)<\/span> (‏2023א ש2) — עד-נגדי:\n      ‏<span class=\"math\">w ∈ L(M)<\/span> שאינו בשרשור ✓ coRE.<\/li>\n  <\/ul>\n\n  <div class=\"warn\">כמת מעורב — ‏<span class=\"math\">∀∃<\/span> או <span class=\"math\">∃∀<\/span>\n    שלא מצטמצם — רמז חזק לאזור \"מחוץ לשניהם\": ‏<span class=\"math\">REG<sub>TM<\/sub><\/span>\n    (\"‏∃ אוטומט כך ש-∀ מילה…\"), ‏<span class=\"math\">EQ<sub>TM<\/sub><\/span>. שם לא עוזר שום מזהה —\n    ומוכיחים עם שתי רדוקציות (פרק 12).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch11-t9\">אסטרטגיית שאלה 2 במבחן<\/h2>\n\n  <p>שאלה 2 (40 נק'!) היא תמיד: שפה של קידודים, ושלוש שאלות —\n    ‏<span class=\"math\">L ∈ R?<\/span> ‏<span class=\"math\">L ∈ RE?<\/span>\n    ‏<span class=\"math\">L ∈ coRE?<\/span> עם הוכחה מלאה. סדר עבודה:<\/p>\n\n  <ol class=\"pump-steps\">\n    <li data-who=\"נסחו\">כתבו את תנאי השפה בכמתים, ואת <b>המשלים<\/b> (היפוך הכמתים!) —\n      חצי מהפתרון נמצא כאן.<\/li>\n    <li data-who=\"זהו\">‏∃+אימות-עוצר ⇒ כנראה RE (בנו מזהה dovetailing);\n      ‏∀ ⇒ כנראה coRE (מזהה למשלים); מעורב ⇒ כנראה אף אחד.<\/li>\n    <li data-who=\"הוכיחו חיוב\">כתבו את המזהה במלואו + נכונות דו-כיוונית\n      (\"אם בשפה — יגיע לקבלה כי…; אם לא — לא יקבל לעולם כי…\").<\/li>\n    <li data-who=\"הוכיחו שלילה\">לצד השלילי — רדוקציה מ-<span class=\"math\">A<sub>TM<\/sub><\/span> או\n      <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span> (פרק 12). זכרו:\n      ‏<span class=\"math\">∉ coRE ⟹ ∉ R<\/span>, ‏<span class=\"math\">∉ RE ⟹ ∉ R<\/span> —\n      תשובת ה-R מגיעה בחינם מאחת השלילות.<\/li>\n  <\/ol>\n\n  <div class=\"ex-box\">\n    <h4>הדפוס בשלושת המבחנים האחרונים<\/h4>\n    <p>‏2024א: ‏RE כן, coRE לא (⇒ R לא). ‏2024ב: הכול לא — שתי רדוקציות\n      (‏<span class=\"math\">A<sub>TM<\/sub><\/span> וגם <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>).\n      ‏2023א: ‏coRE כן, RE לא. שלושת הפרופילים האפשריים — והמנגנון זהה: מזהה לצד החיובי,\n      רדוקציה לצד השלילי.<\/p>\n  <\/div>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> ‏R = שני עדים, RE = עד ל\"כן\", coRE = עד ל\"לא\"; האלכסון קובע\n    ‏<span class=\"math\">A<sub>TM<\/sub> ∈ RE∖R<\/span>; סימולציה מוגבלת + dovetailing הם המנוע של כל\n    מזהה; והכמתים של תנאי השפה הם המצפן של שאלה 2.<\/div>\n<\/section>\n"},{"sid":"ch12","group":"פרקים","title":"פרק 12 — רדוקציות מיפוי","topics":["רדוקציית מיפוי — ההגדרה","מה ≤m משמר — כללי ההעברה","תבנית הכתיבה המלאה של רדוקציה","HALT_TM — הרדוקציה הראשונה","E_TM — רדוקציה עם משלים","גלריית המכונות המתוכנתות N_{M,w}","הטריק של התקציב: רדוקציות מ־Ā_TM","REG_TM ו־EQ_TM — מחוץ לשני העולמות","תכונות ≤m — טרנזיטיביות ומשלים","טעויות כיוון קלאסיות","רדוקציות טיורינג — מבט קצר"],"html":"<h1>רדוקציות מיפוי<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 12 (הרצאה 12 + תרגול 12)<\/p>\n\n<section>\n  <h2 id=\"ch12-t0\">רדוקציית מיפוי — ההגדרה<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">רדוקציית מיפוי<\/span> — ‏<span class=\"math\">A ≤<sub>m<\/sub> B<\/span> אם קיימת\n    פונקציה <b>ניתנת לחישוב<\/b> <span class=\"math\">f: Σ<sup>*<\/sup> → Σ<sup>*<\/sup><\/span>\n    (מ\"ט שעוצרת על כל קלט ומחזירה פלט) כך שלכל <span class=\"math\">w<\/span>:\n    <div class=\"lang-def\">w ∈ A&nbsp;&nbsp;⟺&nbsp;&nbsp;f(w) ∈ B<\/div>\n  <\/div>\n\n  <p>אינטואיציה: \"‏A היא מקרה פרטי מחופש של B\" — מי שיודע לענות על B, עונה על A דרך התרגום\n    <span class=\"math\">f<\/span>. שימו לב לשקילות הדו-כיוונית: גם \"כן\"→\"כן\" וגם \"לא\"→\"לא\".<\/p>\n\n  <div class=\"reduce\">\n    <div class=\"rbox\">A (הקשה הידועה)<\/div>\n    <span class=\"rarr\">≤<sub>m<\/sub><\/span>\n    <div class=\"rbox\">B (הנאשמת)<\/div>\n    <div class=\"rcap\">כיוון ההוכחה במבחן: מהשפה שכבר ידוע שהיא קשה — אל השפה שרוצים להוכיח שקשה<\/div>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t1\">מה ≤m משמר — כללי ההעברה<\/h2>\n\n  <div class=\"thm\">אם <span class=\"math\">A ≤<sub>m<\/sub> B<\/span> אז:\n    <ul>\n      <li><span class=\"math\">B ∈ R ⟹ A ∈ R<\/span> &nbsp;(שקול: ‏<span class=\"math\">A ∉ R ⟹ B ∉ R<\/span>)<\/li>\n      <li><span class=\"math\">B ∈ RE ⟹ A ∈ RE<\/span> &nbsp;(שקול: ‏<span class=\"math\">A ∉ RE ⟹ B ∉ RE<\/span>)<\/li>\n      <li><span class=\"math\">B ∈ coRE ⟹ A ∈ coRE<\/span> &nbsp;(שקול: ‏<span class=\"math\">A ∉ coRE ⟹ B ∉ coRE<\/span>)<\/li>\n    <\/ul>\n    <b>השייכוּת יורדת עם כיוון החץ; הקושי מטפס נגדו.<\/b><\/div>\n\n  <p>ההוכחה בת שורה: מכריע\/מזהה ל-B + חישוב <span class=\"math\">f<\/span> = מכריע\/מזהה ל-A\n    (\"חשב <span class=\"math\">f(w)<\/span>, שאל את B\").<\/p>\n\n  <div class=\"ex-box\">\n    <h4>טבלת השימוש המבצעית<\/h4>\n    <table>\n      <tr><th>מטרה<\/th><th>מה מוכיחים<\/th><\/tr>\n      <tr><td><span class=\"math\">B ∉ R, B ∉ coRE<\/span><\/td><td><span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> B<\/span><\/td><\/tr>\n      <tr><td><span class=\"math\">B ∉ R, B ∉ RE<\/span><\/td><td><span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> B<\/span><\/td><\/tr>\n      <tr><td>שפה מחוץ לשניהם<\/td><td>שתי הרדוקציות ביחד<\/td><\/tr>\n    <\/table>\n    <p>(‏<span class=\"math\">HALT<sub>TM<\/sub><\/span> ומשלימה משמשים באותם תפקידים —\n      ‏מבחן-לדוגמה ש2 השתמש דווקא ב-<span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span>.)<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t2\">תבנית הכתיבה המלאה של רדוקציה<\/h2>\n\n  <div class=\"algo\">\n    <h4>ארבעת הרכיבים (הפורמט הרשמי המדויק)<\/h4>\n    <ol>\n      <li><b>הכרזה:<\/b> \"נראה <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span>\n        (‏<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, לכן <span class=\"math\">L ∉ coRE<\/span>\n        ו-<span class=\"math\">L ∉ R<\/span>)\".<\/li>\n      <li><b>הגדרת f:<\/b> ‏<span class=\"math\">f(⟨M,w⟩) = ⟨N<sub>M,w<\/sub>⟩<\/span> (או זוג\/שלשה),\n        עם פסאודו-קוד מלא של המכונות הנבנות.<\/li>\n      <li><b>חישוביות:<\/b> \"‏<span class=\"math\">f<\/span> ניתנת לחישוב: כל שנדרש הוא לכתוב את הקידוד\n        של <span class=\"math\">N<sub>M,w<\/sub><\/span> — מחרוזת סופית שנבנית בזמן סופי.\" (משפט קבוע —\n        אבל חובה לכתוב אותו!)<\/li>\n      <li><b>נכונות דו-כיוונית:<\/b> ‏<span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub> ⟹ f(⟨M,w⟩) ∈ L<\/span>\n        וגם <span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub> ⟹ f(⟨M,w⟩) ∉ L<\/span> —\n        שני כיוונים מפורשים, כל אחד עם הנימוק שלו.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"warn\">רוב הנקודות הולכות לאיבוד ברכיב 4: כותבים כיוון אחד ושוכחים שהשני אינו\n    \"אותו דבר בהיפוך\" — ב\"לא מקבלת\" מסתתרות דחייה <b>וגם<\/b> לולאה, ולכל אחת התנהגות אחרת של\n    <span class=\"math\">N<sub>M,w<\/sub><\/span>. בדקו את שתיהן.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t3\">HALT_TM — הרדוקציה הראשונה<\/h2>\n\n  <div class=\"def\"><span class=\"math\">HALT<sub>TM<\/sub> = {⟨M,w⟩ | M halts on input w}<\/span><\/div>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> HALT<sub>TM<\/sub><\/span><\/h4>\n    <p>‏<span class=\"math\">f(⟨M,w⟩) = ⟨N, w⟩<\/span> כאשר:<\/p>\n    <pre>N: \"On input x:\n1. Run M on x.\n2. If M accepted — accept.\n3. If M rejected — loop.\"<\/pre>\n    <p><b>נכונות:<\/b> אם <span class=\"math\">M<\/span> מקבלת את <span class=\"math\">w<\/span> —\n      ‏<span class=\"math\">N<\/span> עוצרת על <span class=\"math\">w<\/span> (מקבלת) ⇒ בשפה.\n      אם לא (דוחה <b>או<\/b> מתלולאת) — ‏<span class=\"math\">N<\/span> על <span class=\"math\">w<\/span>\n      מתלולאת (בשורה 3 או כבר בשורה 1) ⇒ לא בשפה. ✓<\/p>\n  <\/div>\n\n  <p>הטריק: \"המרת דחייה ללולאה\" מאחדת את שתי צורות ה\"לא\" לצורה אחת שנראית ל-HALT.\n    מסקנה: ‏<span class=\"math\">HALT<sub>TM<\/sub> ∈ RE ∖ R<\/span> — בדיוק כמו\n    <span class=\"math\">A<sub>TM<\/sub><\/span> (‏RE מסימולציה-עד-עצירה; לא R מהרדוקציה).<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t4\">E_TM — רדוקציה עם משלים<\/h2>\n\n  <div class=\"ex-box\">\n    <h4>‏<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span> (ולכן <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> E<sub>TM<\/sub><\/span>)<\/h4>\n    <p>‏<span class=\"math\">f(⟨M,w⟩) = ⟨N<sub>M,w<\/sub>⟩<\/span> כאשר:<\/p>\n    <pre>N_{M,w}: \"On input x:\n1. Run M on w.   (ignoring x!)\n2. If M accepted — accept.\"<\/pre>\n    <p>אם <span class=\"math\">M<\/span> מקבלת את <span class=\"math\">w<\/span>:\n      ‏<span class=\"math\">L(N) = Σ<sup>*<\/sup> ≠ ∅<\/span>; אחרת <span class=\"math\">L(N) = ∅<\/span>.\n      לכן <span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub> ⟺ ⟨N⟩ ∉ E<sub>TM<\/sub><\/span>. ✓<\/p>\n  <\/div>\n\n  <p>שתי נקודות מבניות: (1) <b>התעלמות מהקלט<\/b> — ‏<span class=\"math\">N<\/span> מקודדת את השאלה על\n    <span class=\"math\">(M,w)<\/span> בתוך ההתנהגות הגלובלית שלה; ‏<span class=\"math\">L(N)<\/span>\n    קופצת בין <span class=\"math\">∅<\/span> ל-<span class=\"math\">Σ<sup>*<\/sup><\/span>.\n    (2) <b>רדוקציה למשלים<\/b> — ‏<span class=\"math\">A ≤<sub>m<\/sub> <span class=\"comp\">B<\/span><\/span>\n    שקולה ל-<span class=\"math\"><span class=\"comp\">A<\/span> ≤<sub>m<\/sub> B<\/span>\n    (אותה f!). מסקנה: ‏<span class=\"math\">E<sub>TM<\/sub> ∈ coRE ∖ R<\/span>.<\/p>\n\n  <div class=\"warn\">האם ההיפוך המצוין פה מפר את \"אסור להפוך מזהה\"? לא — לא הפכנו מכונה;\n    בחרנו לאיזו שפה (B או המשלים שלה) ממפים. משחקי המשלים האלה הם בדיוק הקווים העיליים\n    שראינו במבחני 2024 — לקרוא אותם בדקדקנות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t5\">גלריית המכונות המתוכנתות N_{M,w}<\/h2>\n\n  <p>כל רדוקציה בונה מכונה שמקודדת את השאלה. הגלריה מהמבחנים:<\/p>\n\n  <table>\n    <tr><th>‏N על קלט x<\/th><th>‏L(N) כש-M מקבלת את w<\/th><th>‏L(N) כשלא<\/th><th>שימש ב…<\/th><\/tr>\n    <tr><td>הרץ M על w; ענה כמוה<\/td><td><span class=\"math\">Σ<sup>*<\/sup><\/span><\/td><td><span class=\"math\">∅<\/span><\/td><td>‏E_TM, ‏2023ב ש2<\/td><\/tr>\n    <tr><td>הרץ M על w; אם קיבלה — קבל; אחרת לולאה<\/td><td><span class=\"math\">Σ<sup>*<\/sup><\/span><\/td><td><span class=\"math\">∅<\/span> (בלי לעצור)<\/td><td>‏HALT-גרסאות<\/td><\/tr>\n    <tr><td>אם קיבלה — <b>דחה<\/b>; אחרת לולאה<\/td><td><span class=\"math\">∅<\/span> ועוצרת-דוחה<\/td><td><span class=\"math\">∅<\/span> בלי לעצור<\/td><td>‏2024א ש2 (עם D)<\/td><\/tr>\n    <tr><td>הרץ M על w ל-<span class=\"math\">|x|<\/span> צעדים; קבל אם <b>לא<\/b> קיבלה<\/td><td>סופית (<span class=\"math\">≠ Σ<sup>*<\/sup><\/span>)<\/td><td><span class=\"math\">Σ<sup>*<\/sup><\/span><\/td><td>‏2024ב ש2 (מ-<span class=\"comp\">A<sub>TM<\/sub><\/span>)<\/td><\/tr>\n  <\/table>\n\n  <p>לצד <span class=\"math\">N<\/span> מצרפים לעיתים רכיב קבוע — DFA קטן\n    (‏<span class=\"math\">L(D)={00}<\/span> ב-2024א, ‏<span class=\"math\">{1}<\/span> ב-2023ב) —\n    שמכייל את התנאי המספרי\/מבני של שפת היעד.<\/p>\n\n  <div class=\"note\">לקרוא את הגלריה = לדעת לכתוב את הרדוקציה הבאה: בוחרים את ההתנהגות הגלובלית\n    שמפרידה נכון (‏∅ מול Σ*, עוצרת מול לא, סופית מול הכול), ומכוונים אותה לתנאי של שפת היעד.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t6\">הטריק של התקציב: רדוקציות מ־Ā_TM<\/h2>\n\n  <p>להוכיח <span class=\"math\">L ∉ RE<\/span> — מראים\n    <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span>.\n    הקושי: המכונה הנבנית צריכה \"לזהות אי-קבלה\" — שאין לה עד. הפתרון: <b>תקציב הצעדים<\/b>.<\/p>\n\n  <div class=\"ex-box\">\n    <h4>השלד של 2024ב ש2 (החלק השני)<\/h4>\n    <pre>N_{M,w}: \"On input x:\n1. Run M on w for |x| steps.\n2. If M didn't accept within these steps — accept.\n3. Otherwise — reject.\"<\/pre>\n    <p>‏<span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span> ⟹ אף תקציב לא\n      יגלה קבלה ⟹ ‏<span class=\"math\">L(N) = Σ<sup>*<\/sup><\/span> (\"‏N מקבלת כל קלט\" — התנאי של\n      שפת היעד שם). ‏<span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span> (קבלה תוך <span class=\"math\">k<\/span>\n      צעדים) ⟹ ‏<span class=\"math\">L(N) = {x : |x| &lt; k}<\/span> — סופית, לא\n      <span class=\"math\">Σ<sup>*<\/sup><\/span>. ✓<\/p>\n  <\/div>\n\n  <div class=\"note\">התבנית הכללית: תכונת-\"לעולם לא\" (אי-קבלה, אי-עצירה) הופכת לתכונת-\"לכל תקציב\",\n    והיא נבדקת קלט-קלט עם <span class=\"math\">|x|<\/span> כתקציב. כשפוגשים שפה שהתנאי שלה הוא\n    \"‏M מקבלת את <b>כל<\/b> הקלטים\" או \"‏<span class=\"math\">L(M) = Σ<sup>*<\/sup><\/span>\" —\n    כמעט תמיד הרדוקציה הזו בסביבה.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t7\">REG_TM ו־EQ_TM — מחוץ לשני העולמות<\/h2>\n\n  <div class=\"def\"><span class=\"math\">REG<sub>TM<\/sub> = {⟨M⟩ | L(M) is regular}<\/span>,&nbsp;\n    <span class=\"math\">EQ<sub>TM<\/sub> = {⟨M₁,M₂⟩ | L(M₁) = L(M₂)}<\/span> — שתיהן\n    <b>מחוץ ל-RE ∪ coRE<\/b>.<\/div>\n\n  <p>הרעיון (על REG): בונים <span class=\"math\">N<sub>M,w<\/sub><\/span> שמחליפה בין שפה רגולרית\n    לשפה לא-רגולרית לפי קבלת <span class=\"math\">w<\/span>:<\/p>\n  <pre>N_{M,w}: \"On input x:\n1. If x has the form 0ⁿ1ⁿ — accept.\n2. Otherwise: run M on w; if M accepted — accept.\"<\/pre>\n  <p>‏<span class=\"math\">M<\/span> מקבלת את <span class=\"math\">w<\/span> ⟹\n    ‏<span class=\"math\">L(N) = Σ<sup>*<\/sup><\/span> (רגולרית!); לא מקבלת ⟹\n    ‏<span class=\"math\">L(N) = {0<sup>n<\/sup>1<sup>n<\/sup>}<\/span> (לא רגולרית). זה נותן\n    <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> REG<sub>TM<\/sub><\/span>\n    ⟹ ‏<span class=\"math\">∉ RE<\/span>; ובחילוף התפקידים (רגולרית כשלא-מקבלת) —\n    ‏<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> REG<sub>TM<\/sub><\/span> ⟹\n    ‏<span class=\"math\">∉ coRE<\/span>. שתי רדוקציות = מחוץ לשניהם.<\/p>\n\n  <div class=\"note\">‏<span class=\"math\">EQ<sub>TM<\/sub><\/span> — אותו משחק מול מכונה קבועה:\n    השוואה ל-<span class=\"math\">M<sub>∅<\/sub><\/span> נותנת את הצד האחד, ל-<span class=\"math\">M<sub>Σ*<\/sub><\/span>\n    את השני. וכך גם <span class=\"math\">PAL<sub>TM<\/sub><\/span> ו-<span class=\"math\">L<sub>∞<\/sub><\/span>\n    מדף הנוסחאות — כל תכונה סמנטית \"עשירה\" נופלת לשני הצדדים (וזה בדיוק נושא פרק 13: משפט רייס).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t8\">תכונות ≤m — טרנזיטיביות ומשלים<\/h2>\n\n  <ul>\n    <li><b>טרנזיטיביות:<\/b> ‏<span class=\"math\">A ≤<sub>m<\/sub> B ≤<sub>m<\/sub> C ⟹ A ≤<sub>m<\/sub> C<\/span>\n      (הרכבת פונקציות חישוביות — חישובית). מאפשרת \"לרדת\" מ-HALT במקום מ-A_TM כשנוח.<\/li>\n    <li><b>משלים:<\/b> ‏<span class=\"math\">A ≤<sub>m<\/sub> B ⟺ <span class=\"comp\">A<\/span> ≤<sub>m<\/sub> <span class=\"comp\">B<\/span><\/span>\n      — אותה <span class=\"math\">f<\/span> בדיוק (השקילות נשמרת תחת שלילה בשני הצדדים).<\/li>\n    <li><b>רפלקסיביות:<\/b> ‏<span class=\"math\">A ≤<sub>m<\/sub> A<\/span> (הזהות).\n      וגם: כל <span class=\"math\">A ∈ R<\/span> ניתנת לרדוקציה לכל שפה לא-טריוויאלית\n      (המכריע בוחר <span class=\"math\">w<sub>in<\/sub><\/span>\/<span class=\"math\">w<sub>out<\/sub><\/span>) —\n      הנקודה של 2024ב ש3.4!<\/li>\n    <li><b>אי-סימטריה מהותית:<\/b> ‏<span class=\"math\">A ≤<sub>m<\/sub> B<\/span> לא גורר\n      <span class=\"math\">B ≤<sub>m<\/sub> A<\/span> — קושי זורם רק בכיוון אחד.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>שתי הפתעות מהמבחנים<\/h4>\n    <p>‏<b>‏L ≤m L̄ אפשרית גם לכריעות<\/b> (2024ב ש3.4: זוגי↔אי-זוגי עם <span class=\"math\">f(w)=1w<\/span>) —\n      אל תניחו שרדוקציה-למשלים מעידה על קושי.\n      <b>ורדוקציה \"כמעט-מכל-מקום\"<\/b> (2023ב ש3.6): ‏<span class=\"math\">f<\/span> שמקיימת את התנאי רק\n      מחוץ לקבוצה סופית <span class=\"math\">A<\/span> — ניתנת לתיקון עם מכריעי\n      <span class=\"math\">A∩L₁, A∖L₁<\/span> ועדים <span class=\"math\">w<sub>in<\/sub>\/w<sub>out<\/sub><\/span>.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t9\">טעויות כיוון קלאסיות<\/h2>\n\n  <ul>\n    <li><b>רדוקציה הפוכה:<\/b> להוכיח ש-<span class=\"math\">B<\/span> קשה — חייבים\n      <span class=\"math\">קשה ≤<sub>m<\/sub> B<\/span>. להראות <span class=\"math\">B ≤<sub>m<\/sub> A<sub>TM<\/sub><\/span>\n      אומר רק ש-B \"לא יותר קשה מ-A_TM\" — כלום. (בדיקה עצמית: הידועה משמאל!)<\/li>\n    <li><b>כיוון ההעברה:<\/b> שייכות יורדת מ-B ל-A. ‏\"‏<span class=\"math\">A ∈ R<\/span> ו-<span class=\"math\">A ≤<sub>m<\/sub> B<\/span>\n      ⟹ ‏<span class=\"math\">B ∈ R<\/span>\" — <b>שגוי<\/b> (כל כריעה נמפית ל-A_TM!).<\/li>\n    <li><b>בחירת מחלקה שגויה לשלילה:<\/b> ‏<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> B<\/span> שולל\n      ‏coRE (ו-R); הוא <b>לא<\/b> שולל RE — ‏B בהחלט יכולה להיות ב-RE\n      (‏A_TM עצמה!). לשלילת RE — רדוקציה מ-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>.<\/li>\n    <li><b>‏f \"כמעט חישובית\":<\/b> ‏f שמפעילה בעצמה בדיקה לא-כריעה (\"אם M עוצרת אז…\") — פסולה.\n      ‏f חייבת להיות מכריע-מחשב אמיתי; כל הקושי צריך לשבת בתוך המכונה הנבנית, לא בתוך f.<\/li>\n  <\/ul>\n\n  <div class=\"note\">משפט הבדיקה לפני הגשה: \"מהידועה אל הנאשמת; השייכות נגד הכיוון; המחלקה\n    הנשללת תואמת את הידועה; ו-f עצמה תמימה\". ארבע בדיקות של עשר שניות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch12-t10\">רדוקציות טיורינג — מבט קצר<\/h2>\n\n  <div class=\"def\"><span class=\"term\">רדוקציית טיורינג<\/span> — ‏<span class=\"math\">A ≤<sub>T<\/sub> B<\/span>:\n    קיים מכריע ל-<span class=\"math\">A<\/span> שמורשה לקרוא ל<b>אורקל<\/b> של <span class=\"math\">B<\/span>\n    (תשובות מיידיות לשאלות \"האם <span class=\"math\">x ∈ B<\/span>?\") — מספר פעמים, ועם עיבוד חופשי\n    של התשובות.<\/div>\n\n  <p>ההבדל מ-≤m: מיפוי הוא \"שאלה אחת, בלי לגעת בתשובה\"; טיורינג מרשה הכול. לכן:<\/p>\n  <ul>\n    <li>‏<span class=\"math\">A ≤<sub>m<\/sub> B ⟹ A ≤<sub>T<\/sub> B<\/span> (מקרה פרטי).<\/li>\n    <li>‏<span class=\"math\">A<sub>TM<\/sub> ≤<sub>T<\/sub> <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>\n      (שואלים את האורקל והופכים) — אבל <span class=\"math\">A<sub>TM<\/sub> ≰<sub>m<\/sub> <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>!\n      (‏≤m היה גורר <span class=\"math\">A<sub>TM<\/sub> ∈ coRE<\/span>.) ההיפוך שאסור ב-≤m — מותר ב-≤T.<\/li>\n    <li>‏≤T משמר רק כריעות (‏<span class=\"math\">B ∈ R ⟹ A ∈ R<\/span>) — <b>לא<\/b> RE\/coRE.\n      לכן לשאלות RE\/coRE במבחן חובה ≤m דווקא.<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>לב הפרק:<\/b> ‏≤m = תרגום חישובי ששומר שייכות דו-כיוונית; הקושי מטפס נגד\n    החץ; המכונות המתוכנתות (עם או בלי תקציב) הן ארגז הכלים; שתי רדוקציות משליכות שפה אל מחוץ\n    לשני העולמות; והכיוון — תמיד מהידועה אל הנאשמת.<\/div>\n<\/section>\n"},{"sid":"ch13","group":"פרקים","title":"פרק 13 — משפט רייס וסיכום הקורס","topics":["תכונה סמנטית ותכונה טריוויאלית","משפט רייס — הנוסח המדויק","הוכחת רייס — הרעיון","צ'ק־ליסט התחולה של רייס","מתי רייס לא חל — המלכודות","ניסוח C בתשובת מבחן","רייס שולל R בלבד — לא RE","מפת השפות המרכזיות — הסיכום","אסטרטגיית המבחן המלאה","צ'ק־ליסט ליום המבחן"],"html":"<h1>משפט רייס וסיכום הקורס<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 13 (הרצאה 13 + תרגול 13)<\/p>\n\n<section>\n  <h2 id=\"ch13-t0\">תכונה סמנטית ותכונה טריוויאלית<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">תכונה סמנטית<\/span> — קבוצת שפות <span class=\"math\">C ⊆ RE<\/span>. השפה המושרה:\n    <div class=\"lang-def\">L<sub>C<\/sub> = {⟨M⟩ | M is a TM and L(M) ∈ C}<\/div>\n    התכונה שואלת רק על <b>השפה<\/b> <span class=\"math\">L(M)<\/span> — לא על הקוד: שתי מכונות עם אותה\n    שפה נכנסות או נשארות בחוץ <b>יחד<\/b>.\n  <\/div>\n\n  <div class=\"def\"><span class=\"term\">תכונה טריוויאלית<\/span> — ‏<span class=\"math\">C = ∅<\/span> או\n    <span class=\"math\">C = RE<\/span> כולה (אף שפה \/ כל השפות). אז <span class=\"math\">L<sub>C<\/sub><\/span>\n    היא <span class=\"math\">∅<\/span> או \"כל הקידודים החוקיים\" — כריעה באופן משעמם.<\/div>\n\n  <div class=\"ex-box\">\n    <h4>סמנטית או לא?<\/h4>\n    <table>\n      <tr><th>שאלה על ⟨M⟩<\/th><th>סוג<\/th><\/tr>\n      <tr><td>‏<span class=\"math\">L(M) = ∅<\/span>? ‏<span class=\"math\">L(M)<\/span> רגולרית? ‏<span class=\"math\">ε ∈ L(M)<\/span>?<\/td><td>סמנטית ✓<\/td><\/tr>\n      <tr><td>ל-M יש 100 מצבים? M מבקרת במצב q₃ על הקלט ε?<\/td><td>על הקוד\/הריצה — לא סמנטית ✗<\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t1\">משפט רייס — הנוסח המדויק<\/h2>\n\n  <div class=\"thm\">\n    <b>משפט רייס:<\/b> אם <span class=\"math\">C<\/span> תכונה סמנטית <b>לא טריוויאלית<\/b>\n    (‏<span class=\"math\">∅ ≠ C ⊊ RE<\/span>), אז <span class=\"math\">L<sub>C<\/sub> ∉ R<\/span>.\n  <\/div>\n\n  <p>במילים: <b>שום שאלה לא-טריוויאלית על השפה של תוכנית איננה כריעה.<\/b> ריקות, סופיות,\n    רגולריות, \"מכילה את המילה 42\", \"שווה ל-PAL\" — הכול לא כריע, במכה אחת.<\/p>\n\n  <div class=\"note\">עוצמת המשפט היא הכלליות: במקום רדוקציה פרטנית לכל תכונה — משפט אחד.\n    במבחן הוא חוסך את כל שאלות ה-\"‏∉ R\" — <b>בתנאי<\/b> ששלושת התנאים באמת מתקיימים (t3),\n    ושזוכרים שהוא נותן רק <span class=\"math\">∉ R<\/span> (t6).<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t2\">הוכחת רייס — הרעיון<\/h2>\n\n  <div class=\"proof\">\n    תהי <span class=\"math\">C<\/span> לא-טריוויאלית; נניח בה\"כ <span class=\"math\">∅ ∉ C<\/span>\n    (אחרת עוברים ל-<span class=\"math\">RE ∖ C<\/span> — המשלים של <span class=\"math\">L<sub>C<\/sub><\/span>\n    כריע אמ\"מ הוא כריע). מאי-הטריוויאליות קיימת <span class=\"math\">L₀ ∈ C<\/span>, עם מזהה\n    <span class=\"math\">M₀<\/span>. נראה <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<sub>C<\/sub><\/span>:\n    <pre>f(⟨M,w⟩) = ⟨N⟩,  N: \"On input x:\n1. Run M on w.        (ignoring x)\n2. If M accepted — run M₀ on x and answer as M₀.\"<\/pre>\n    אם <span class=\"math\">M<\/span> מקבלת את <span class=\"math\">w<\/span>: שלב 1 מסתיים,\n    ו-<span class=\"math\">N<\/span> מתנהגת כ-<span class=\"math\">M₀<\/span> ⇒\n    ‏<span class=\"math\">L(N) = L₀ ∈ C<\/span>. אם לא: שלב 1 לא מסתיים לעולם ⇒\n    ‏<span class=\"math\">L(N) = ∅ ∉ C<\/span>. לכן\n    <span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub> ⟺ ⟨N⟩ ∈ L<sub>C<\/sub><\/span>. <span class=\"qed\">∎<\/span>\n  <\/div>\n\n  <p>המבנה מוכר מפרק 12: מכונה מתוכנתת שהשפה שלה קופצת בין <span class=\"math\">∅<\/span> (מחוץ\n    ל-C) ל-<span class=\"math\">L₀<\/span> (בתוך C) לפי קבלת <span class=\"math\">w<\/span> —\n    רייס הוא בעצם \"תבנית הרדוקציה האוניברסלית\".<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t3\">צ'ק־ליסט התחולה של רייס<\/h2>\n\n  <div class=\"algo\">\n    <h4>שלוש בדיקות — כולן חובה בתשובה (הפורמט של 2023א ש3.6)<\/h4>\n    <ol>\n      <li><b>‏C ⊆ RE מוגדרת דרך L(M):<\/b> התנאי מנוסח (או ניתן לניסוח) כ\"‏<span class=\"math\">L(M) ∈ C<\/span>\"\n        — תכונה של השפה בלבד.<\/li>\n      <li><b>‏C ≠ ∅:<\/b> מציגים שפה ב-RE שמקיימת — עד קונקרטי\n        (למשל <span class=\"math\">A<sub>TM<\/sub> ∈ C<\/span> או <span class=\"math\">∅ ∈ C<\/span>).<\/li>\n      <li><b>‏C ≠ RE:<\/b> מציגים שפה ב-RE שלא מקיימת — עד קונקרטי שני.<\/li>\n    <\/ol>\n    <p>שלושתן עברו? ‏<span class=\"math\">L<sub>C<\/sub> ∉ R<\/span> ממשפט רייס. מצטטים וסוגרים.<\/p>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>הדוגמה הרשמית — 2023א ש3.6<\/h4>\n    <p>‏<span class=\"math\">L = {⟨M⟩ | ∃w: M<\/span> לא מקבלת את <span class=\"math\">w}<\/span>.\n      מנסחים: ‏<span class=\"math\">C = {L′ ∈ RE | L′ ≠ Σ<sup>*<\/sup>}<\/span> (יש מילה לא-מתקבלת ⟺\n      השפה אינה הכול). בדיקות: ‏<span class=\"math\">C ⊆ RE<\/span> ✓;\n      ‏<span class=\"math\">A<sub>TM<\/sub> ∈ C<\/span> (‏≠ Σ*) ✓;\n      ‏<span class=\"math\">Σ<sup>*<\/sup> ∈ RE ∖ C<\/span> ✓. רייס ⇒ לא כריעה. תשובה: נכון.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t4\">מתי רייס לא חל — המלכודות<\/h2>\n\n  <p>שאלות \"הוכח או הפרך: לפי משפט רייס L איננה כריעה\" הן ז'אנר קבוע — ולעיתים התשובה\n    <b>False<\/b>. שלוש המלכודות:<\/p>\n\n  <ul>\n    <li><b>התכונה טריוויאלית-בפועל מעל RE:<\/b> ‏2024ב ש3.5:\n      ‏<span class=\"math\">L(M) ≠ PAL<sub>TM<\/sub><\/span>. מכיוון ש-<span class=\"math\">PAL<sub>TM<\/sub> ∉ RE<\/span>,\n      <b>כל<\/b> שפת-מכונה שונה ממנה ⇒ ‏<span class=\"math\">C = RE<\/span> כולה ⇒ טריוויאלית ⇒\n      ‏<span class=\"math\">L = {⟨M⟩}<\/span> כל הקידודים — <b>כריעה<\/b>. תמיד לבדוק: האם ה\"תנאי\"\n      בכלל מסנן משהו בתוך RE?<\/li>\n    <li><b>תכונה לא-סמנטית:<\/b> תנאי על מבנה הקוד (\"יש ל-M לולאה\", \"פחות מ-50 מצבים\") — רייס\n      שותק; לרוב כריע ישירות (בדיקת תחביר).<\/li>\n    <li><b>שילוב תחבירי-סמנטי:<\/b> כמו <span class=\"math\">L∞<sub>k<\/sub><\/span> (‏2023ב ש3.5) —\n      תנאי סמנטי <b>וגם<\/b> חסם אורך על ⟨M⟩: הקבוצה סופית ⇒ כריעה. הרכיב התחבירי שובר את\n      ה\"סמנטיות הטהורה\".<\/li>\n  <\/ul>\n\n  <div class=\"warn\">ניסוח התשובה בהפרכה: לא \"רייס לא חל ולכן כריעה\" — אי-תחולה לא מוכיחה כריעות!\n    צריך <b>גם<\/b> להראות שהתכונה טריוויאלית\/תחבירית <b>וגם<\/b> לתת מכריע בפועל\n    (‏\"בדיקת תקינות הקידוד — כריעה\"). כך בדיוק בפתרון הרשמי של 2024ב ש3.5.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t5\">ניסוח C בתשובת מבחן<\/h2>\n\n  <div class=\"algo\">\n    <h4>מהשפה אל C — שלושה צעדים<\/h4>\n    <ol>\n      <li>לתרגם את תנאי השפה לתנאי על <span class=\"math\">L(M)<\/span> בלבד. דוגמאות:\n        \"‏M מקבלת את ε\" ⇝ ‏<span class=\"math\">ε ∈ L(M)<\/span>;\n        \"‏∃w שלא מתקבלת\" ⇝ ‏<span class=\"math\">L(M) ≠ Σ<sup>*<\/sup><\/span>;\n        \"‏M מקבלת מילה זוגית-אורך\" ⇝ ‏<span class=\"math\">L(M) ∩ (ΣΣ)<sup>*<\/sup> ≠ ∅<\/span>.<\/li>\n      <li>לכתוב <span class=\"math\">C = {L′ ∈ RE | תנאי(L′)}<\/span> — מפורשות, עם השם\n        <span class=\"math\">L′<\/span> (לא M!).<\/li>\n      <li>לספק את שני העדים (∈C ו-∈RE∖C) — קונקרטיים, עם שמות שפות מהקורס.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"ex-box\">\n    <h4>ספריית עדים מהירה<\/h4>\n    <p>שפות נוחות לעדים: ‏<span class=\"math\">∅<\/span>, ‏<span class=\"math\">Σ<sup>*<\/sup><\/span>,\n      ‏<span class=\"math\">{ε}<\/span>, ‏<span class=\"math\">A<sub>TM<\/sub><\/span>, כל שפה סופית,\n      ‏<span class=\"math\">a<sup>*<\/sup><\/span>. כמעט כל זוג-עדים נבנה מהרשימה הזו —\n      וכולן ב-RE (כנדרש: העדים חייבים להיות שפות RE!).<\/p>\n  <\/div>\n\n  <div class=\"warn\">טעות הניסוח הנפוצה: לכתוב <span class=\"math\">C<\/span> כקבוצת מכונות\n    (‏<span class=\"math\">C = {⟨M⟩ | …}<\/span>). ‏C היא קבוצת <b>שפות<\/b>; ‏<span class=\"math\">L<sub>C<\/sub><\/span>\n    היא קבוצת המכונות. הבלבול הזה מפיל את כל שלוש הבדיקות.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t6\">רייס שולל R בלבד — לא RE<\/h2>\n\n  <div class=\"thm\">רייס נותן <span class=\"math\">L<sub>C<\/sub> ∉ R<\/span> — וזהו. הוא <b>אינו<\/b>\n    קובע דבר על RE\/coRE: ‏<span class=\"math\"><span class=\"comp\">E<sub>TM<\/sub><\/span><\/span>\n    (סמנטית, לא-טריוויאלית) דווקא ב-RE; ‏<span class=\"math\">REG<sub>TM<\/sub><\/span> מחוץ לשניהם.\n    המיקום המדויק דורש עבודה נוספת.<\/div>\n\n  <p>לכן בשאלה 2 המלאה (R? RE? coRE?) רייס יכול לענות רק על השורה של R. את RE\/coRE סוגרים\n    כרגיל: מזהה (∃\/∀ מפרק 11) או רדוקציה מכוונת (פרק 12).<\/p>\n\n  <div class=\"note\">גם ההפך נכון: כשצריך רק \"‏∉ R\" ורייס חל — אין סיבה לכתוב רדוקציה ידנית.\n    לזהות מה השאלה באמת דורשת = לבחור את הכלי הזול. (בשאלות \"הוכח או הפרך: לפי רייס…\" —\n    חובה לעבוד עם רייס, כמובן.)<\/p><\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t7\">מפת השפות המרכזיות — הסיכום<\/h2>\n\n  <table>\n    <tr><th>שפה<\/th><th>R<\/th><th>RE<\/th><th>coRE<\/th><th>הכלי<\/th><\/tr>\n    <tr><td><span class=\"math\">A<sub>DFA<\/sub>, E<sub>DFA<\/sub>, EQ<sub>DFA<\/sub>, A<sub>CFG<\/sub>, E<sub>CFG<\/sub><\/span><\/td><td>✓<\/td><td>✓<\/td><td>✓<\/td><td>סימולציה חסומה \/ גרפים<\/td><\/tr>\n    <tr><td><span class=\"math\">A<sub>TM<\/sub><\/span><\/td><td>✗<\/td><td>✓<\/td><td>✗<\/td><td>אלכסון + U<\/td><\/tr>\n    <tr><td><span class=\"math\">HALT<sub>TM<\/sub><\/span><\/td><td>✗<\/td><td>✓<\/td><td>✗<\/td><td>רדוקציה מ-A_TM<\/td><\/tr>\n    <tr><td><span class=\"math\">E<sub>TM<\/sub><\/span><\/td><td>✗<\/td><td>✗<\/td><td>✓<\/td><td>‏Ā_TM ≤m + dovetailing למשלים<\/td><\/tr>\n    <tr><td><span class=\"math\">REG<sub>TM<\/sub>, EQ<sub>TM<\/sub>, PAL<sub>TM<\/sub>, L<sub>∞<\/sub><\/span><\/td><td>✗<\/td><td>✗<\/td><td>✗<\/td><td>שתי רדוקציות (או רייס ל-R בלבד)<\/td><\/tr>\n  <\/table>\n\n  <p>ולזכור את הסולם השלם של הקורס:<\/p>\n  <div class=\"lang-def\">REG ⊊ CFL ⊊ R ⊊ RE ⊊ כל השפות<\/div>\n  <p>עם העדים: ‏<span class=\"math\">a<sup>n<\/sup>b<sup>n<\/sup><\/span>;\n    ‏<span class=\"math\">a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup><\/span>;\n    ‏<span class=\"math\">A<sub>TM<\/sub><\/span>;\n    ‏<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>.<\/p>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t8\">אסטרטגיית המבחן המלאה<\/h2>\n\n  <p>מבנה המבחן (2023–2024) קבוע להפליא — וכך גם תוכנית העבודה:<\/p>\n\n  <ol class=\"pump-steps\">\n    <li data-who=\"שאלה 1\"><b>סגירויות ובניות (35–40 נק'):<\/b> אופרטור חדש על שפות. הכלים:\n      פירוק <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span>, הצבות, מכפלות, PDA עם מחסנית\n      יצירתית. סעיף אחרון: לרוב \"הראו שהתוצאה לא ח\"ה\" — ניפוח ח\"ה עם המקרים.<\/li>\n    <li data-who=\"שאלה 2\"><b>‏R\/RE\/coRE (30–40 נק'):<\/b> נסחו כמתים + משלים; מזהה לצד החיובי\n      (‏dovetailing, נכונות דו-כיוונית); רדוקציה לצד השלילי (בחרו מקור לפי המחלקה הנשללת!);\n      ‏R בחינם מאחת השלילות.<\/li>\n    <li data-who=\"שאלה 3\"><b>סעיפים קצרים (25–30 נק'):<\/b> ניפוח רגולרי, בניית דקדוק\/PDA,\n      עמימות, הוכח-או-הפרך על רדוקציות, רייס. כל סעיף 5–6 נק' — לא להיתקע; לעבור ולחזור.<\/li>\n  <\/ol>\n\n  <div class=\"ex-box\">\n    <h4>ניהול זמן מוצע (3 שעות)<\/h4>\n    <p>‏~15 דק' קריאה ותכנון → שאלה 3 קודם (נקודות מהירות, מחמם) → שאלה 1 → שאלה 2 (הכי כבדה,\n      עם הכי הרבה כתיבה) → רבע שעה אחרונה: לוודא שכל \"הוכח או הפרך\" פותח ב-<b>True\/False מפורש<\/b>,\n      שכל רדוקציה כוללת את משפט החישוביות, ושכל מזהה מנומק בשני הכיוונים.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch13-t9\">צ'ק־ליסט ליום המבחן<\/h2>\n\n  <ul>\n    <li><b>דף הנוסחאות מצורף למבחן<\/b> — כל ההגדרות והבניות שם. אל תשננו נוסחים; שננו\n      <b>מתי ואיך<\/b> להשתמש (הוא זמין כאן באתר מכל מסך — כפתור \"דף נוסחאות\").<\/li>\n    <li><b>כמתים לפני הכול:<\/b> בכל שאלת חישוביות — לכתוב את התנאי ואת משלימו ככמתים. זה מכתיב\n      את כל ההמשך.<\/li>\n    <li><b>המילים הרגישות:<\/b> מקבלת \/ דוחה \/ עוצרת \/ לא-מקבלת — ארבע ישויות שונות.\n      קו עילי = משלים — לקרוא פעמיים.<\/li>\n    <li><b>בניות סטנדרטיות בשליפה:<\/b> ‏N שמתעלמת מהקלט; N עם תקציב <span class=\"math\">|x|<\/span>;\n      מזהה dovetailing; מתג <span class=\"math\">∅\/Σ<sup>*<\/sup><\/span>; ‏3 בדיקות רייס.<\/li>\n    <li><b>מלכודות הסיווג:<\/b> לפני שמוכיחים אי-רגולריות — לבדוק קריסה (בולע-כול, זהות, סופיות);\n      ‏\"או\" = איחוד (ח\"ה), \"וגם\" = שתי השוואות (אף אחת); היפוך אוהב מחסנית, העתק-ישר לא.<\/li>\n    <li><b>נימוק קצר עדיף מריק:<\/b> הציון מושפע גם מבהירות (כתוב על הטופס!) — משפט מבנה\n      (\"נוכיח בסגירויות: …\") בראש כל תשובה קונה כיוון ונקודות.<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>ולסיום:<\/b> עברתם את כל הסולם — מאוטומט בן שני מצבים ועד גבולות החישוב.\n    ‏88% היו במערכות הפעלה; עכשיו לכו לשבור את זה. בהצלחה! 🎓<\/div>\n<\/section>\n"}]</script>
<script type="application/json" id="d-quiz">[{"sid":"ch1","topics":[{"t":"מה זה מודל חישובי ומה נלמד בקורס","q":[{"q":"מהו סדר ההכלה הנכון בין מחלקות השפות שנלמדות בקורס?","c":["כל המחלקות שוות — ההבדל הוא רק בדרך ההגדרה","שפות רגולריות ⊂ שפות חסרות הקשר ⊂ שפות כריעות","שפות חסרות הקשר ⊂ שפות רגולריות ⊂ שפות כריעות","שפות כריעות ⊂ שפות רגולריות ⊂ שפות חסרות הקשר"],"e":"הסולם של הקורס: אוטומט סופי (זיכרון קבוע) ⊂ אוטומט מחסנית (מחסנית) ⊂ מכונת טיורינג (סרט אינסופי). כל מודל חזק ממש מקודמו — למשל <span class=\"math\">{aⁿbⁿ}<\/span> חסרת הקשר אך לא רגולרית.","a":1},{"q":"מהן שתי \"תבניות העל\" של שאלות המבחן בקורס, כפי שמופיעות כמעט בכל סעיף?","c":["חישוב סיבוכיות זמן, וכתיבת קוד יעיל","שרטוט גרפים, וחישוב הסתברויות","פישוט ביטויים בוליאניים, וטבלאות אמת","בנייה של מזהה לשפה, והוכחה ששפה לא שייכת למחלקה"],"e":"כל נושא מציע כלי בנייה (DFA\/NFA\/רגקס\/CFG\/PDA\/TM והמרות ביניהם) וכלי אי־אפשרות (למות ניפוח, רדוקציות, משפט רייס). סיבוכיות (NP וכו') כלל לא נלמדת בקורס הזה.","a":3},{"q":"מדוע מגדירים \"מודל חישובי\" כאובייקט מתמטי (קבוצות ופונקציות) ולא כמחשב ממשי?","c":["כדי לחסוך זיכרון בזמן הסימולציה","כדי שאפשר יהיה להוכיח טענות מדויקות על גבולות היכולת של המודל","כי מחשבים אמיתיים איטיים מדי לניסויים","כי לא היו מחשבים כשהומצאה התורה — היום ההגדרות מיושנות"],"e":"רק על הגדרה פורמלית אפשר להוכיח משפטים כמו \"אף אוטומט סופי לא מזהה את <span class=\"math\">{aⁿbⁿ}<\/span>\" או \"בעיית העצירה אינה כריעה\" — טענות על <b>כל<\/b> מכונה אפשרית, לא על מימוש מסוים.","a":1}]},{"t":"אלף־בית, מילים ופעולות על מילים","q":[{"q":"מה ההבדל בין <span class=\"math\">ε<\/span> לבין <span class=\"math\">∅<\/span>?","c":["<span class=\"math\">ε<\/span> היא שפה ריקה; <span class=\"math\">∅<\/span> היא מילה ריקה","<span class=\"math\">∅<\/span> היא המילה הקצרה ביותר בכל שפה","<span class=\"math\">ε<\/span> היא מילה באורך 0; <span class=\"math\">∅<\/span> היא שפה שאין בה אף מילה","אין הבדל — שני סימונים לאותו דבר"],"e":"<span class=\"math\">ε<\/span> — מילה (אורך 0). <span class=\"math\">∅<\/span> — קבוצה ריקה של מילים. לכן <span class=\"math\">{ε} ≠ ∅<\/span>: בשפה <span class=\"math\">{ε}<\/span> יש מילה אחת.","a":2},{"q":"עבור <span class=\"math\">w = aab<\/span>, מהי המילה <span class=\"math\">w<sup>R<\/sup>w<\/span>?","c":["<span class=\"math\">baaaab<\/span>","<span class=\"math\">aabbaa<\/span>","<span class=\"math\">baabaa<\/span>","<span class=\"math\">aabaab<\/span>"],"e":"<span class=\"math\">w<sup>R<\/sup> = baa<\/span>, ואז משרשרים: <span class=\"math\">w<sup>R<\/sup>·w = baa·aab = baaaab<\/span>. שימו לב שהתוצאה פלינדרום — <span class=\"math\">w<sup>R<\/sup>w<\/span> תמיד פלינדרום באורך זוגי.","a":0},{"q":"כמה מילים באורך בדיוק <span class=\"math\">k<\/span> יש מעל אלף־בית בגודל <span class=\"math\">|Σ| = n<\/span>?","c":["<span class=\"math\">n·k<\/span>","אינסוף","<span class=\"math\">n<sup>k<\/sup><\/span>","<span class=\"math\">k<sup>n<\/sup><\/span>"],"e":"בכל אחת מ־<span class=\"math\">k<\/span> העמדות בוחרים אות אחת מתוך <span class=\"math\">n<\/span> — סה\"כ <span class=\"math\">n<sup>k<\/sup><\/span>. לכן <span class=\"math\">Σ<sup>*<\/sup><\/span> אינסופית אך <b>בת מנייה<\/b> — עובדה שחוזרת בפרק החישוביות.","a":2}]},{"t":"שפות ופעולות על שפות","q":[{"q":"מהי <span class=\"math\">∅<sup>*<\/sup><\/span>?","c":["<span class=\"math\">∅<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span>","לא מוגדר","<span class=\"math\">{ε}<\/span>"],"e":"<span class=\"math\">L<sup>*<\/sup> = ⋃<sub>k≥0<\/sub> L<sup>k<\/sup><\/span> ותמיד <span class=\"math\">L<sup>0<\/sup> = {ε}<\/span> — שרשור של אפס מילים. לכן גם לשפה הריקה: <span class=\"math\">∅<sup>*<\/sup> = {ε}<\/span>. זו נקודה קבועה בהמרות GNFA.","a":3},{"q":"עבור <span class=\"math\">L = {ab, ba}<\/span>, איזו מילה <b>אינה<\/b> שייכת ל־<span class=\"math\">L<sup>*<\/sup><\/span>?","c":["<span class=\"math\">baba<\/span>","<span class=\"math\">aab<\/span>","<span class=\"math\">abba<\/span>","<span class=\"math\">ε<\/span>"],"e":"מילה ב־<span class=\"math\">L<sup>*<\/sup><\/span> היא שרשור בלוקים של <span class=\"math\">ab<\/span> או <span class=\"math\">ba<\/span> — תמיד באורך זוגי. <span class=\"math\">aab<\/span> באורך 3, ולכן לא בשפה. השאר: <span class=\"math\">abba = ab·ba<\/span>, <span class=\"math\">ε<\/span> (אפס בלוקים), <span class=\"math\">baba = ba·ba<\/span>.","a":1},{"q":"מהי השפה <span class=\"math\">L·∅<\/span> עבור שפה <span class=\"math\">L<\/span> כלשהי?","c":["<span class=\"math\">L<\/span>","<span class=\"math\">{ε}<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span>","<span class=\"math\">∅<\/span>"],"e":"שרשור דורש לבחור מילה מכל אחת מהשפות: <span class=\"math\">L·∅ = {uv | u∈L, v∈∅}<\/span> — אין אף <span class=\"math\">v<\/span> לבחור, לכן התוצאה ריקה. לעומת זאת <span class=\"math\">L·{ε} = L<\/span>. אלו שני המקרים שהכי מתבלבלים ביניהם.","a":3}]},{"t":"יסודות קבוצות והוכחת שוויון קבוצות","q":[{"q":"מהי הדרך הסטנדרטית להוכיח ששתי שפות שוות, <span class=\"math\">A = B<\/span>?","c":["מוכיחים הכלה בשני הכיוונים: <span class=\"math\">A ⊆ B<\/span> וגם <span class=\"math\">B ⊆ A<\/span>","מראים ששתיהן מכילות את אותה מילה כלשהי","משווים את מספר האיברים בשתיהן","מראים ששתיהן מוגדרות מעל אותו אלף־בית"],"e":"שוויון קבוצות = הכלה דו-כיוונית. זו התבנית של כמעט כל הוכחת \"L(A) = L\" במבחן: לוקחים מילה שרירותית מצד אחד ומראים שהיא בצד השני, ולהפך.","a":0},{"q":"איך כותבים את ההפרש <span class=\"math\">A ∖ B<\/span> בעזרת חיתוך ומשלים?","c":["<span class=\"math\">A ∪ <span class=\"comp\">B<\/span><\/span>","<span class=\"math\"><span class=\"comp\">A ∩ B<\/span><\/span>","<span class=\"math\">A ∩ <span class=\"comp\">B<\/span><\/span>","<span class=\"math\"><span class=\"comp\">A<\/span> ∩ B<\/span>"],"e":"להיות ב-<span class=\"math\">A<\/span> ולא להיות ב-<span class=\"math\">B<\/span> — בדיוק <span class=\"math\">A ∩ <span class=\"comp\">B<\/span><\/span>. הזהות הזו הופכת סגירות לחיתוך ולמשלים לסגירות להפרש — טיעון שחוזר בפתרונות רשמיים (למשל 2024א ש1.2).","a":2},{"q":"האם המילה הריקה <span class=\"math\">ε<\/span> שייכת לשפה <span class=\"math\">L = {w | כל תו של w הוא a}<\/span> מעל <span class=\"math\">Σ={a,b}<\/span>?","c":["כן — התנאי \"לכל תו\" מתקיים באופן ריק עבור <span class=\"math\">ε<\/span>","לא — למילה הריקה אין תווים ולכן היא לא מקיימת שום תנאי","רק אם מגדירים זאת במפורש","השאלה לא מוגדרת עבור <span class=\"math\">ε<\/span>"],"e":"טענת \"לכל\" על קבוצה ריקה נכונה תמיד (vacuously true). לכן <span class=\"math\">ε ∈ L<\/span> — נקודה ששווה לבדוק בכל שאלת סיווג, כי היא משנה תשובות.","a":0}]},{"t":"DFA — ההגדרה הפורמלית","q":[{"q":"מה בדיוק דורשת הדרישה ש-<span class=\"math\">δ: Q × Σ → Q<\/span> תהיה פונקציה (הדטרמיניזם)?","c":["מספר המעברים שווה למספר המצבים","לכל מצב ולכל אות מוגדר בדיוק מעבר אחד — אין בחירה ואין חוסר","לכל מצב יש לפחות מעבר אחד לאיזושהי אות","אין שני מצבים עם אותם מעברים"],"e":"פונקציה מלאה על <span class=\"math\">Q × Σ<\/span>: בדיוק תמונה אחת לכל זוג. זה מה שמבדיל DFA מ-NFA — שבו <span class=\"math\">δ<\/span> מחזירה קבוצה (אולי ריקה, אולי גדולה).","a":1},{"q":"באוטומט מצוירים חמישה מצבים, אחד מהם עם חץ נכנס \"מהאוויר\" ושניים עם עיגול כפול. מה קראנו מהציור?","c":["יש שני מצבים התחלתיים ומצב מקבל אחד","האוטומט אינו דטרמיניסטי כי יש שני עיגולים כפולים","החץ מהאוויר מציין מצב מלכודת","המצב ההתחלתי הוא בעל החץ הנכנס, וב-<span class=\"math\">F<\/span> יש שני מצבים"],"e":"חץ נכנס חופשי = <span class=\"math\">q_s<\/span> (תמיד בדיוק אחד ב-DFA); עיגול כפול = מצב מקבל, ומותר שיהיו כמה (או אף אחד). ריבוי מצבים מקבלים לא פוגע בדטרמיניזם.","a":3},{"q":"מהו מספר המעברים (חיצים, כולל לולאות) בציור של DFA עם <span class=\"math\">|Q| = 4<\/span> מצבים מעל <span class=\"math\">Σ = {a,b,c}<\/span>?","c":["תלוי בשפה שהאוטומט מזהה","בדיוק <span class=\"math\">12<\/span>","לכל היותר <span class=\"math\">12<\/span>","לפחות <span class=\"math\">4<\/span>"],"e":"‏<span class=\"math\">δ<\/span> מלאה: מכל אחד מ-4 המצבים יוצא בדיוק חץ אחד לכל אחת מ-3 האותיות — <span class=\"math\">4×3=12<\/span>. אם בציור חסר חץ, זה לא DFA חוקי (בדרך כלל שכחו מצב מלכודת).","a":1}]},{"t":"ריצה של DFA: הרחבת המעברים וקבלה","q":[{"q":"מתי <span class=\"math\">ε ∈ L(A)<\/span>?","c":["בדיוק כאשר <span class=\"math\">F ≠ ∅<\/span>","אף פעם — DFA לא מעבד מילה ריקה","בדיוק כאשר <span class=\"math\">q<sub>s<\/sub> ∈ F<\/span>","תמיד — המילה הריקה שייכת לכל שפה"],"e":"לפי ההגדרה <span class=\"math\">δ′(q_s, ε) = q_s<\/span> — ריצה על <span class=\"math\">ε<\/span> נגמרת במצב ההתחלתי בלי לזוז. לכן הקבלה תלויה רק בשאלה אם <span class=\"math\">q_s<\/span> עצמו מקבל.","a":2},{"q":"באוטומט הזוגיות (q₀ מקבל, 1 מחליף מצב, 0 נשאר) — מה קורה בריצה על <span class=\"math\">w = 1011<\/span>?","c":["מסתיימת ב-<span class=\"math\">q₁<\/span> והמילה נדחית","מסתיימת ב-<span class=\"math\">q₀<\/span> והמילה מתקבלת","הריצה נתקעת אחרי הקריאה השנייה","האוטומט מקבל כי עבר דרך <span class=\"math\">q₀<\/span> באמצע"],"e":"‏<span class=\"math\">q₀→q₁→q₁→q₀→q₁<\/span>: שלושה 1-ים = אי-זוגי. חשוב: הקבלה נקבעת רק לפי המצב <b>הסופי<\/b> — מעבר דרך מצב מקבל באמצע לא נחשב.","a":0},{"q":"מה נכון לגבי ריצת DFA על מילה כלשהי <span class=\"math\">w<\/span>?","c":["הריצה עלולה להיתקע אם אין מעבר מתאים","המסלול תלוי בסדר שבו בוחרים את המעברים","קיים בדיוק מסלול ריצה אחד, והוא מוגדר לכל <span class=\"math\">w<\/span>","ייתכנו כמה מסלולים והמילה מתקבלת אם אחד מהם מקבל"],"e":"זה בדיוק פירוש הדטרמיניזם: <span class=\"math\">δ<\/span> מלאה וחד-ערכית ⇒ מסלול יחיד לכל קלט, ללא היתקעות. \"כמה מסלולים\" ו\"נתקע\" הם מאפייני NFA.","a":2}]},{"t":"בניית DFA — מונים, זוגיות ו־mod","q":[{"q":"כמה מצבים צריך DFA מינימלי עבור <span class=\"math\">L = {w | #₁(w) mod 3 = 0}<\/span>?","c":["1 — מספיק לזהות שקראנו 1","6 — שארית לכל אחת משתי האותיות","אינסוף — הספירה אינה חסומה","3 — מצב לכל שארית של מספר ה-1-ים"],"e":"המידע הדרוש להכרעה הוא בדיוק <span class=\"math\">#₁ mod 3<\/span> — שלושה ערכים אפשריים. ה-0-ים לא משנים כלום (לולאה עצמית). הספירה אמנם \"עולה\", אבל רק השארית נחוצה — והיא חסומה.","a":3},{"q":"רוצים DFA לשפה <span class=\"math\">{0<sup>i<\/sup>1<sup>j<\/sup> | i mod 3 = 1, j mod 2 = 1}<\/span> (מתרגול 2). מה המצב צריך לזכור?","c":["רק אם המילה התחילה ב-0","את שלב הקריאה (0-ים \/ 1-ים \/ נשבר הסדר) ואת השאריות הרלוונטיות","רק את שתי השאריות — הסדר לא חשוב","את המילה שנקראה עד כה"],"e":"השפה דורשת גם צורה (כל ה-0-ים לפני כל ה-1-ים) וגם שאריות. מצב = (שלב, שארית) — כולל מצב מלכודת למי ששבר את הצורה (0 אחרי 1). זו מכפלת תנאים ידנית.","a":1},{"q":"איזו מהשפות הבאות <b>אי אפשר<\/b> לזהות עם DFA?","c":["<span class=\"math\">{w | #₀(w) mod 7 = 3}<\/span>","<span class=\"math\">{w | |w| ≤ 1000}<\/span>","<span class=\"math\">{w | w מכיל בדיוק שני 1-ים}<\/span>","<span class=\"math\">{w | #₀(w) = #₁(w)}<\/span>"],"e":"שוויון מונים דורש לזכור הפרש לא חסום — אינסוף מצבים. השאר: שארית mod 7 (7 מצבים), אורך עד 1000 (1002 מצבים), בדיוק שני 1-ים (4 מצבים: 0,1,2,יותר). חסום = רגולרי.","a":3}]},{"t":"בניית DFA — תבניות ותת־מחרוזות","q":[{"q":"בבניית DFA לשפה \"לא מכיל 00\" — מה המשמעות הנכונה של המצבים?","c":["כמה מהתבנית המסוכנת ראינו זה עתה: כלום \/ 0 אחד \/ 00 (מלכודת)","כמה 0-ים יש במילה בסך הכול","האם המילה התחילה ב-0","אורך המילה mod 2"],"e":"לזיהוי תת-מחרוזת עוקבים אחרי הרישא הארוכה ביותר של התבנית שמסתיימת בעמדה הנוכחית. קריאת 1 מאפסת את הזיכרון, קריאת 0 מקדמת — ו-00 שולח למלכודת.","a":0},{"q":"מהו \"מצב מלכודת\" (sink) ומה חובה לזכור כשמציירים אותו?","c":["מצב מקבל שחוזרים אליו בסוף כל מילה","המצב ההתחלתי כשהוא לא מקבל","מצב שכל המעברים ממנו חוזרים לעצמו — וחובה לצייר את כל הלולאות כדי ש-δ תהיה מלאה","מצב שאין ממנו מעברים בכלל"],"e":"מלכודת קולטת ריצות שהוכרעו סופית (התנאי הופר לתמיד). \"אין מעברים\" אינו חוקי ב-DFA — הפונקציה חייבת להיות מלאה, ולכן המלכודת עצמה צריכה לולאות על כל האותיות.","a":2},{"q":"לשפה \"מסתיימת ב-00\" מעל <span class=\"math\">{0,1}<\/span>, איזו משמעות מצבים נכונה?","c":["כמה 0-ים רצופים בסוף מה שנקרא עד כה: 0 \/ 1 \/ 2-או-יותר","האם ראינו אי-פעם 00 במילה","זוגיות מספר ה-0-ים הכללי","שלושת התווים האחרונים במלואם"],"e":"רק הסיפא הרלוונטית לתבנית חשובה: 0, 1 או ≥2 אפסים רצופים בסוף. קריאת 1 מאפסת. המצב \"≥2\" הוא המקבל — והוא לא מלכודת: קריאת 1 מוציאה ממנו.","a":0}]},{"t":"מה מצב יכול \"לזכור\" — עקרון הזיכרון הסופי","q":[{"q":"מדוע DFA לשפה \"האות השמינית מהסוף היא 1\" דורש בערך <span class=\"math\">2⁸<\/span> מצבים?","c":["זו טעות — מספיקים 9 מצבים","כי בכל רגע כל אחת מ-8 האותיות האחרונות עלולה להתברר כשמינית מהסוף — צריך לזכור את כולן","כי צריך לספור עד 8 ולכן 2⁸ אפשרויות ספירה","כי יש 8 אותיות באלף-בית"],"e":"\"מהסוף\" לא ידוע עד שהמילה נגמרת, ולכן חלון 8 האותיות האחרונות כולו רלוונטי — <span class=\"math\">2⁸<\/span> תכולות אפשריות. ל-NFA מספיקים ~9 מצבים (מנחשים את העמדה) — הדוגמה הקלאסית לפער DFA\/NFA.","a":1},{"q":"איזה סוג מידע <b>אפשר<\/b> לקודד במצבים של DFA?","c":["כל מידע שניתן לחישוב בזמן סופי","רק מידע על האות האחרונה שנקראה","כל מידע — בשביל זה יש את פונקציית המעברים","כל מידע שכמות הערכים האפשריים שלו חסומה מראש, ללא תלות באורך הקלט"],"e":"מצבים = זיכרון קבוע. שאריות, דגלים, חלון אחרון — כן; מונה שגדל עם הקלט — לא. \"ניתן לחישוב\" זה קריטריון של מכונות טיורינג, הרבה מעבר ל-DFA.","a":3},{"q":"שפה שדורשת להשוות שני מונים לא חסומים (כמו <span class=\"math\">#ₐ = #_b<\/span>) —","c":["איננה רגולרית, אלא אם מוסיפים מצב מלכודת","איננה רגולרית, וזה מה שמוכיחים פורמלית עם למת הניפוח","רגולרית, אם בונים מספיק מצבים","רגולרית רק מעל אלף-בית בינארי"],"e":"ההפרש בין המונים יכול להיות כל מספר שלם — אינסוף \"מצבי ידע\" נחוצים. האינטואיציה הזו הופכת להוכחה פורמלית בלמת הניפוח (פרק 5) או דרך אינסוף מחלקות שקילות (פרק 4).","a":1}]},{"t":"הוכחת נכונות של DFA — אינווריאנטת מצבים","q":[{"q":"מהי \"אינווריאנטת מצבים\" בהוכחת נכונות של אוטומט?","c":["הדרישה שכל המצבים נגישים מהמצב ההתחלתי","תנאי שכל ריצה עוברת דרך כל המצבים","תכונה מדויקת <span class=\"math\">P_q(w)<\/span> לכל מצב, שמתקיימת בדיוק עבור המילים שמגיעות אליו","טענה שהאוטומט לא משנה את הקלט"],"e":"לכל מצב נותנים \"משמעות\": <span class=\"math\">δ′(q_s,w)=q ⟺ P_q(w)<\/span>. מוכיחים באינדוקציה שהמעברים משמרים את המשמעויות, ואז <span class=\"math\">L(A)<\/span> = איחוד המשמעויות של המצבים המקבלים.","a":2},{"q":"על מה מתבצעת האינדוקציה בהוכחת נכונות של DFA?","c":["על אורך המילה — כל אות מוסיפה צעד שמשמר את האינווריאנטות","על מספר המצבים באוטומט","על מספר המצבים המקבלים","על גודל האלף-בית"],"e":"בסיס: <span class=\"math\">ε<\/span> נמצאת ב-<span class=\"math\">q_s<\/span> ומקיימת את <span class=\"math\">P_{q_s}<\/span>. צעד: אם <span class=\"math\">w<\/span> מקיימת את <span class=\"math\">P_q<\/span> אז <span class=\"math\">wσ<\/span> מקיימת את <span class=\"math\">P_{δ(q,σ)}<\/span> — בדיקה אחת לכל חץ בציור.","a":0},{"q":"בהוכחת נכונות של אוטומט הזוגיות, איזה זוג אינווריאנטות נכון?","c":["<span class=\"math\">P_{q₀}: |w|<\/span> זוגי; <span class=\"math\">P_{q₁}: |w|<\/span> אי-זוגי","<span class=\"math\">P_{q₀}: w ∈ L<\/span>; <span class=\"math\">P_{q₁}: w ∉ L<\/span>","<span class=\"math\">P_{q₀}: #₁(w)<\/span> זוגי; <span class=\"math\">P_{q₁}: #₁(w)<\/span> אי-זוגי","<span class=\"math\">P_{q₀}: w<\/span> מסתיימת ב-0; <span class=\"math\">P_{q₁}: w<\/span> מסתיימת ב-1"],"e":"המשמעות חייבת לאפיין את כל המילים שמגיעות למצב — וכאן המצב עוקב אחרי זוגיות מספר ה-1-ים בלבד. האפשרות הרביעית מעגלית (משתמשת ב-L שאותו מוכיחים) — טעות נפוצה בניסוח.","a":2}]},{"t":"שפה רגולרית — ההגדרה והתמונה הגדולה","q":[{"q":"מהי ההגדרה של שפה רגולרית שראינו בפרק?","c":["שפה שאפשר לכתוב בכתיב בונה-קבוצות","שפה סופית","שפה שכל מיליה באורך חסום","שפה שקיים DFA שמזהה אותה בדיוק"],"e":"רגולרית ⟺ קיים אוטומט סופי עם <span class=\"math\">L(A) = L<\/span>. בהמשך נראה שגם NFA, ביטוי רגולרי ודקדוק רגולרי מגדירים בדיוק את אותה מחלקה. כל שפה סופית רגולרית — אך גם אינסופיות רבות.","a":3},{"q":"אילו הגדרות נוספות שקולות ל\"רגולרית\" ניפגש בהן בהמשך?","c":["כל דקדוק חסר הקשר","NFA, ביטוי רגולרי ודקדוק רגולרי","PDA, CFG ומכונת טיורינג","רק NFA — שאר המודלים חזקים יותר"],"e":"ארבע ההגדרות (DFA\/NFA\/רגקס\/דקדוק רגולרי) שקולות — וההמרות ביניהן הן חומר קבוע בדף הנוסחאות ובמבחנים. PDA\/CFG מגדירים מחלקה גדולה ממש יותר, ומ\"ט עוד יותר.","a":1},{"q":"שפה סופית כלשהי <span class=\"math\">L = {w₁, …, w_k}<\/span> —","c":["רגולרית רק אם כל המילים באותו אורך","לא בהכרח רגולרית — תלוי בתוכן המילים","רגולרית רק אם <span class=\"math\">k ≤ |Σ|<\/span>","תמיד רגולרית — בונים אוטומט (או ביטוי) שמזהה את הרשימה"],"e":"רשימה סופית תמיד ניתנת לזיהוי עם מספר סופי של מצבים (עץ הרישות + מלכודת). העיקרון הזה עומד מאחורי כמה מלכודות במאגר השפות — כל מה שמצטמצם לסופי הוא אוטומטית רגולרי.","a":3}]}]},{"sid":"ch2","topics":[{"t":"תכונות סגור — הרעיון וארגז הכלים","q":[{"q":"מה פירוש \"מחלקת השפות הרגולריות סגורה לחיתוך\"?","c":["אי אפשר לקבל את ∅ מחיתוך שפות רגולריות","לכל שתי שפות רגולריות, גם החיתוך שלהן רגולרי","כל שפה רגולרית היא חיתוך של שתי שפות אחרות","חיתוך של שפה רגולרית עם כל שפה שהיא נותן שפה רגולרית"],"e":"סגירות = הפעולה לא מוציאה מהמחלקה: <span class=\"math\">L₁, L₂<\/span> רגולריות ⟹ <span class=\"math\">L₁ ∩ L₂<\/span> רגולרית. חיתוך עם שפה שרירותית עלול לצאת מהמחלקה (למשל עם שפה לא רגולרית).","a":1},{"q":"איך משתמשים בסגירויות כדי להוכיח ששפה <span class=\"math\">L<\/span> <b>איננה<\/b> רגולרית?","c":["מראים שהיא איחוד של שתי שפות לא רגולריות","מראים שאין לה ביטוי רגולרי קצר","בונים לה NFA עם אינסוף מצבים","מניחים שהיא רגולרית, מפעילים פעולות סגורות ומגיעים לשפה ידועה כלא-רגולרית — סתירה"],"e":"זו \"שיטת הצמצום\": אם <span class=\"math\">L<\/span> רגולרית אז גם <span class=\"math\">f(L) ∩ R<\/span> וכו' רגולריות; כשמגיעים ל-<span class=\"math\">{aⁿbⁿ}<\/span> — סתירה. כך בדיוק עובד הפתרון של \"a^{p+1} לא ח\"ה\" ב-2023א ש3.4 (בגרסת ח\"ה).","a":3},{"q":"מדוע ההפרש <span class=\"math\">L₁ ∖ L₂<\/span> של רגולריות הוא רגולרי — בלי בנייה חדשה?","c":["זה לא נכון — הפרש אינו סגור","כי <span class=\"math\">L₁ ∖ L₂ = L₁ ∩ <span class=\"comp\">L₂<\/span><\/span> — הרכבה של משלים וחיתוך שכבר בידינו","כי הפרש הוא תמיד תת-קבוצה של <span class=\"math\">L₁<\/span>","כי אפשר למחוק מצבים מהאוטומט של <span class=\"math\">L₁<\/span>"],"e":"הזהות מקבוצות הופכת את ההפרש להרכבת פעולות סגורות. תת-קבוצה כשלעצמה לא מבטיחה כלום (תת-קבוצות של רגולרית יכולות לא להיות רגולריות).","a":1}]},{"t":"משלים — היפוך המצבים המקבלים ב־DFA","q":[{"q":"בהינתן DFA שלם <span class=\"math\">A<\/span> עבור <span class=\"math\">L<\/span>, איך מקבלים אוטומט ל-<span class=\"math\"><span class=\"comp\">L<\/span><\/span>?","c":["מחליפים את המצב ההתחלתי במצב מקבל כלשהו","מוסיפים מעברי ε לכל המצבים הלא-מקבלים","מחליפים את קבוצת המקבלים ב-<span class=\"math\">Q ∖ F<\/span> ולא נוגעים בשום דבר אחר","הופכים את כיווני כל החיצים"],"e":"לכל מילה ריצה יחידה שמסתיימת במצב יחיד — היפוך <span class=\"math\">F<\/span> הופך בדיוק את הקבלה. היפוך חיצים נותן דווקא את ההיפוך <span class=\"math\">L<sup>R<\/sup><\/span>, לא את המשלים.","a":2},{"q":"מדוע אותו טריק (היפוך מקבלים) <b>נכשל<\/b> על NFA?","c":["כי מילה מתקבלת אם קיימת ריצה מקבלת — ייתכן שגם ריצה מקבלת וגם דוחה, והיא תתקבל בשני האוטומטים","כי ב-NFA אין מצבים מקבלים","כי מעברי ε נעלמים בהיפוך","הטריק דווקא עובד גם על NFA"],"e":"אם למילה יש ריצה מקבלת וגם ריצה שמסתיימת במצב לא-מקבל — אחרי ההיפוך הריצה השנייה תקבל אותה. כלומר היא בשפה של שני האוטומטים — בסתירה למשלים. חייבים לדטרמן קודם.","a":0},{"q":"לפני היפוך המקבלים ב-DFA, מה חייבים לוודא?","c":["שהמצב ההתחלתי אינו מקבל","שהאוטומט מינימלי","ש-δ מלאה — כולל מצב מלכודת אם חסר","שאין מצבים מקבלים מיותרים"],"e":"אם ציירו DFA \"חלקי\" (ריצות שנתקעות = דחייה שקטה), המילים שנתקעות נדחות בשני האוטומטים — וזה שובר את המשלים. משלימים עם מצב מלכודת ורק אז הופכים.","a":2}]},{"t":"בניית המכפלה — חיתוך, איחוד והפרש","q":[{"q":"בבניית המכפלה עבור חיתוך, מהם רכיבי האוטומט?","c":["<span class=\"math\">Q₁∪Q₂<\/span> עם מעברי ε בין האוטומטים","<span class=\"math\">Q₁×Q₂<\/span> ומקבלים <span class=\"math\">(F₁×Q₂)∪(Q₁×F₂)<\/span>","האוטומט הקטן מבין השניים","<span class=\"math\">Q₁×Q₂<\/span>, מעבר לפי שני הרכיבים במקביל, ומקבלים <span class=\"math\">F₁×F₂<\/span>"],"e":"מריצים את שניהם יחד: <span class=\"math\">δ((p,q),σ)=(δ₁(p,σ),δ₂(q,σ))<\/span>. לחיתוך שניהם חייבים לקבל — <span class=\"math\">F₁×F₂<\/span>. האפשרות השלישית היא הבנייה לאיחוד.","a":3},{"q":"כמה מצבים יהיו במכפלה עבור \"<span class=\"math\">#₀<\/span> זוגי וגם <span class=\"math\">#₁ = 2<\/span>\" (מתרגול 2), אם הרכיבים בני 2 ו-4 מצבים?","c":["16 — חזקת שתיים של הסכום","8 — כל זוג (זוגיות, מונה)","6 — סכום המצבים","4 — הגדול מביניהם"],"e":"מכפלה קרטזית: <span class=\"math\">2×4=8<\/span> מצבים מהצורה (זוגי\/אי-זוגי, ראינו 0\/1\/2\/יותר). מקבלים: (זוגי, בדיוק 2).","a":1},{"q":"מה היתרון המרכזי של בניית המכפלה על פני בניות ה-NFA (איחוד עם ε וכו')?","c":["היא תמיד נותנת פחות מצבים","היא לא דורשת ששני האוטומטים יהיו מעל אותו אלף-בית","היא עובדת גם על שפות לא רגולריות","היא נשארת דטרמיניסטית — ולכן משרתת ישירות גם משלים והפרש"],"e":"אין ניחושים במכפלה — ריצה יחידה. לכן אפשר מיד להפוך מקבלים (הפרש: <span class=\"math\">F₁×(Q₂∖F₂)<\/span>). הבניות עם ε יוצרות NFA, שדורש דטרמיניזציה לפני משלים.","a":3}]},{"t":"NFA — ההגדרה הפורמלית","q":[{"q":"מה טווח הערכים של פונקציית המעברים ב-NFA?","c":["קבוצת מצבים — <span class=\"math\">δ: Q × Σ<sub>ε<\/sub> → P(Q)<\/span>, כולל אפשרות ∅","מצב יחיד — כמו DFA אבל עם יותר חיצים בציור","זוג (מצב, אות)","מצב יחיד או ε"],"e":"‏δ מחזירה <b>קבוצה<\/b>: כמה יעדים אפשריים, יעד יחיד, או אף אחד (∅ = הריצה נתקעת). בנוסף היא מוגדרת גם על ε — מעברים בלי צריכת קלט.","a":0},{"q":"אילו מהתופעות הבאות חוקיות ב-NFA אך לא ב-DFA?","c":["לולאה עצמית על מצב","מצב שאינו נגיש מהמצב ההתחלתי","שני חיצים עם אותה אות מאותו מצב; מצב בלי חץ לאות כלשהי; חץ ε","כמה מצבים מקבלים"],"e":"ריבוי מקבלים, לולאות ומצבים לא-נגישים חוקיים גם ב-DFA. הייחוד של NFA: בחירה (כמה יעדים), היתקעות (∅) ומעברי ε.","a":2},{"q":"‏NFA שבו במקרה מכל מצב יוצא בדיוק חץ אחד לכל אות ואין מעברי ε —","c":["הוא בפועל DFA — הדטרמיניזם הוא מקרה פרטי של אי-דטרמיניזם","אינו חוקי — NFA חייב בחירה אמיתית איפשהו","מזהה בהכרח שפה סופית","חייב לעבור המרה לפני שמותר לקרוא לו DFA"],"e":"כל DFA הוא NFA שבמקרה תמיד מחזיר קבוצה בגודל 1. לכן \"רגולרית ⟺ קיים NFA\" נובע מיד בכיוון אחד — הכיוון המעניין הוא ההמרה חזרה.","a":0}]},{"t":"קבלה ב־NFA — ריצות אפשריות וניחוש","q":[{"q":"מתי NFA <b>דוחה<\/b> מילה?","c":["כאשר יש יותר מריצה אפשרית אחת","כאשר אף ריצה אפשרית לא מסתיימת במצב מקבל אחרי קריאת כל המילה","כאשר קיימת ריצה שמסתיימת במצב לא-מקבל","כאשר קיימת ריצה שנתקעת"],"e":"קבלה = ∃ ריצה מקבלת; דחייה = ∀ הריצות לא מקבלות (נתקעות או מסתיימות מחוץ ל-F). קיום ריצה דוחה לצד ריצה מקבלת — המילה מתקבלת.","a":1},{"q":"מה המשמעות המעשית של \"ניחוש\" בתכנון NFA?","c":["האוטומט בוחר באקראי ומקבל בהסתברות מסוימת","המתכנן מנחש כמה מצבים יידרשו","האוטומט מדלג על אותיות שהוא לא מזהה","מרשים לאוטומט לבחור נקודת החלטה (למשל \"כאן מתחילה הסיפא\") — ומספיק שבחירה אחת תצליח"],"e":"ניחוש = הסתעפות. הסמנטיקה \"קיימת ריצה\" אומרת שהאוטומט \"תמיד מנחש נכון אם אפשר\". בכתיבת נכונות מנסחים: מילה בשפה ⟺ קיים ניחוש (חלוקה\/עמדה) מוצלח.","a":3},{"q":"עבור \"האות השלישית מהסוף היא 1\", כמה מצבים צריך NFA לעומת DFA?","c":["שניהם צריכים אינסוף מצבים","בערך 4 מול <span class=\"math\">2³=8<\/span> — ה-NFA מנחש את עמדת ה\"שלישית מהסוף\"","אותו מספר — הניחוש לא חוסך מצבים","ה-NFA צריך יותר כי יש לו גם מעברי ε"],"e":"‏NFA: לולאה + ניחוש \"נשארו 3\" + ספירת 3 אותיות ≈ 4 מצבים. DFA חייב לזכור את חלון 3 האחרונות — 8 מצבים. זו משפחת הדוגמאות שמראה פער מעריכי אמיתי.","a":1}]},{"t":"מעברי ε וסגירת ε","q":[{"q":"מהי <span class=\"math\">E(R)<\/span> — סגירת ה-ε של קבוצת מצבים <span class=\"math\">R<\/span>?","c":["המצבים המקבלים שב-R","R בלי המצבים שיש להם מעברי ε","כל המצבים הנגישים ממצבי R באפס או יותר מעברי ε (כולל R עצמה)","המצבים שמהם אפשר להגיע ל-R במעבר ε אחד"],"e":"סוגרים טרנזיטיבית לאורך חיצי ε בלבד, ו-R תמיד בפנים (אפס מעברים). בלי הסגירה, חישובי ההמרה ל-DFA פשוט שגויים.","a":2},{"q":"בבניית תת-הקבוצות, מהו המצב ההתחלתי של ה-DFA?","c":["<span class=\"math\">E(q_s)<\/span> — סגירת ה-ε של המצב ההתחלתי של ה-NFA","<span class=\"math\">{q_s}<\/span> בלבד","קבוצת כל המצבים המקבלים","∅"],"e":"עוד לפני קריאת אות אפשר לזוז חינם עם ε — ולכן מתחילים מ-<span class=\"math\">E(q_s)<\/span>. שכחת הסגירה כאן משנה אפילו את קבלת ε — טעות ההמרה הנפוצה ביותר.","a":0},{"q":"בשביל מה משמשים מעברי ε בבניות הסגירות (איחוד\/שרשור\/כוכב)?","c":["מחיקת אותיות מהקלט","סימון מצבים מקבלים","חיבור חינם בין רכיבים — מעבר בין אוטומטים בלי לצרוך קלט","קיצור מילים ארוכות"],"e":"ε הוא ה\"דבק\": בחירת ענף באיחוד, קפיצה מסוף L₁ לתחילת L₂ בשרשור, וחזרה לסיבוב נוסף בכוכב. הקלט לא נצרך — רק המיקום משתנה.","a":2}]},{"t":"בניית תת־הקבוצות: NFA ← DFA","q":[{"q":"בבניית תת-הקבוצות, מהו מעבר ה-DFA ‏<span class=\"math\">δ_D(R, σ)<\/span>?","c":["<span class=\"math\">δ_N(r,σ)<\/span> עבור נציג r אחד מהקבוצה","<span class=\"math\">R ∪ δ_N(R,σ)<\/span> — הקבוצה רק גדלה","<span class=\"math\">E(R)<\/span> ללא תלות באות","<span class=\"math\">⋃<sub>r∈R<\/sub> E(δ_N(r,σ))<\/span> — צעד מכל מצב בקבוצה ואז סגירת ε"],"e":"מכל מצב אפשרי צועדים על σ, מאחדים את היעדים, וסוגרים ב-ε. הקבוצה יכולה גם לקטון (ואף להיות ∅ — מצב המלכודת של ה-DFA).","a":3},{"q":"אילו מצבים של ה-DFA החדש מקבלים?","c":["כל קבוצה לא ריקה","קבוצות שמכילות לפחות מצב מקבל אחד של ה-NFA","רק הקבוצה <span class=\"math\">F_N<\/span> עצמה","קבוצות שכל מצביהן מקבלים"],"e":"קבלה ב-NFA = קיימת ריצה מקבלת = בקבוצת המצבים האפשריים יש מצב מ-<span class=\"math\">F_N<\/span>. לכן <span class=\"math\">F_D = {R | R ∩ F_N ≠ ∅}<\/span>.","a":1},{"q":"מה הטכניקה הנכונה לבנות את ה-DFA בפועל (בלי להתפוצץ)?","c":["רושמים את כל <span class=\"math\">2^{|Q|}<\/span> הקבוצות ואז מוחקים","בוחרים את הקבוצות הקטנות בלבד","ממירים קודם את ה-NFA לרגקס","מתחילים מ-<span class=\"math\">E(q_s)<\/span> וממלאים טבלה רק עבור קבוצות שמתגלות נגישות"],"e":"בונים בשיטת ה-BFS: שורה לכל קבוצה שהופיעה, עד שאין חדשות. ברוב התרגילים נגישות רק קומץ קבוצות — הרבה מתחת לחסם המעריכי.","a":3}]},{"t":"נכונות הבנייה והמחיר המעריכי","q":[{"q":"מהי האינווריאנטה שמוכיחה את נכונות בניית תת-הקבוצות?","c":["אחרי קריאת w, מצב ה-DFA שווה בדיוק לקבוצת המצבים שאליהם ה-NFA יכול להגיע על w","מספר המצבים של ה-DFA שווה למספר הריצות של ה-NFA","ה-DFA מקבל לפחות את המילים שה-NFA מקבל","כל מצב DFA מכיל את המצב ההתחלתי"],"e":"אינדוקציה על |w|: צעד DFA אחד מדמה את כל הצעדים האפשריים. ואז קבלה ⟺ הקבוצה חותכת את <span class=\"math\">F_N<\/span> ⟺ קיימת ריצה מקבלת — שקילות מלאה, לא הכלה חד-כיוונית.","a":0},{"q":"מה המסקנה התאורטית של \"לכל NFA קיים DFA שקול\"?","c":["NFA מהיר יותר מ-DFA","אפשר לוותר על מעברי ε בהגדרת NFA","אי-דטרמיניזם לא מוסיף כוח ביטוי לאוטומטים סופיים — אותה מחלקת שפות בדיוק","כל שפה ניתנת לזיהוי ע\"י אוטומט כלשהו"],"e":"‏NFA מזהים בדיוק את השפות הרגולריות. הרווח הוא נוחות ותמציתיות (לפעמים מעריכית) — לא כוח. בהמשך הקורס נראה שבמודלים אחרים (PDA) אי-דטרמיניזם דווקא כן מוסיף כוח!","a":2},{"q":"האם המחיר המעריכי של ההמרה הוא רק חולשה של הבנייה?","c":["לא — קיימות שפות שכל DFA עבורן מעריכי בגודל ה-NFA, למשל \"האות ה-n מהסוף\"","כן — קיימת המרה ליניארית שפשוט לא נלמדת","כן — המעריכיות נעלמת אחרי מינימיזציה","השאלה לא מוגדרת"],"e":"החסם התחתון אמיתי: \"האות ה-n מהסוף היא 1\" דורשת לזכור חלון של n אותיות — <span class=\"math\">2ⁿ<\/span> מצבי ידע שונים בהכרח. מינימיזציה לא עוזרת כי זה הגודל המינימלי.","a":0}]},{"t":"סגור לאיחוד, שרשור וכוכב — בניות NFA","q":[{"q":"בבניית השרשור <span class=\"math\">L₁·L₂<\/span>, מה עושים ומה מפסיקים לעשות?","c":["מוסיפים ε מכל מקבל של השני להתחלת הראשון","מוסיפים ε מכל מקבל של הראשון להתחלת השני — והמקבלים של הראשון מפסיקים להיות מקבלים","מוסיפים ε מהתחלת הראשון להתחלת השני ומשאירים את המקבלים","מאחדים את המצבים ההתחלתיים לאחד"],"e":"הניחוש: איפה נגמר חלק ה-L₁. אם משאירים את מקבלי הראשון מקבלים — האוטומט יקבל גם מילים מ-L₁ בלבד, שלא בהכרח בשרשור.","a":1},{"q":"מדוע בבניית הכוכב מוסיפים מצב התחלתי חדש (ולא הופכים את הישן למקבל)?","c":["כדי לחסוך מעברי ε","כי אסור שלמצב התחלתי תהיה לולאה","כדי שה-NFA יישאר דטרמיניסטי","כי ריצה עלולה לחזור להתחלה הישנה באמצע מילה — ואם היא מקבלת, יתקבלו מילים שאינן בשפה"],"e":"אם להתחלה הישנה יש חץ נכנס, מילה יכולה \"לעבור שם\" באמצע ריצה ולהתקבל בטעות. ההתחלה החדשה (מקבלת, עם ε פנימה) מטפלת גם ב-<span class=\"math\">ε ∈ L*<\/span> בלי לזהם את השפה.","a":3},{"q":"בבניית האיחוד עם ε, מהו האוטומט המתקבל?","c":["האוטומט הראשון ואחריו השני","התחלה חדשה עם שני מעברי ε אל שני האוטומטים המקוריים כמו-שהם","מכפלה של שני האוטומטים","שני האוטומטים עם אותה קבוצת מצבים"],"e":"\"בחירת ענף\" ברגע הראשון: ε שמאלה או ε ימינה, והריצה ממשיכה באוטומט שנבחר. המקבלים — איחוד המקבלים המקוריים. (המכפלה נותנת איחוד בלי ε — שתי הדרכים תקפות.)","a":1}]},{"t":"איך כותבים הוכחת סגירות במבחן","q":[{"q":"מהם שלושת חלקי התשובה המלאה לשאלת \"הוכיחו סגירות\" בסגנון הקורס?","c":["הגדרת השפה → למת הניפוח → מסקנה","טבלת מעברים → מינימיזציה → רגקס","נתון (קיים אוטומט ל-L) → בנייה מפורשת של כל הרכיבים → טיעון נכונות דו-כיווני","ציור → דוגמה → בדיקה על שתי מילים"],"e":"כך בנויים כל הפתרונות הרשמיים: שולפים DFA מהנתון, מגדירים את הבנייה החדשה במדויק (מי Q, δ, F), ומנמקים ששפת החדש היא בדיוק המבוקשת.","a":2},{"q":"מהי השפה <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> ולמה היא תמיד רגולרית?","c":["כל המילים שמובילות מ-p ל-q באוטומט A — רגולרית כי מגדירים את p כהתחלתי ואת q כמקבל יחיד","המילים שעוברות דרך p וגם דרך q — רגולרית מסגירות לחיתוך","השפה של A כשמתחילים מ-q — רגולרית רק אם q מקבל","קבוצת המצבים בין p ל-q"],"e":"‏<span class=\"math\">L^A_{p,q} = {w | δ′(p,w)=q}<\/span>: לוקחים את אותו אוטומט ומחליפים רק התחלה\/קבלה. זהו הלגו של כל פירוקי המבנה — רוטציות, הכנסות, מחיקות — שחוזרים בשאלה 1 של כל המבחנים.","a":0},{"q":"בבנייה מסתמכים על קבוצה שקיימת אך לא ידוע לחשב אותה (כמו קבוצת מצבי-ביניים במנה). האם ההוכחה תקפה?","c":["רק אם הקבוצה סופית וגם ידועה","רק בשפות מעל אלף-בית יחיד","כן — לרגולריות מספיק שקיים אוטומט; לא נדרש אלגוריתם שמוצא אותו","לא — בנייה חייבת להיות ניתנת לחישוב"],"e":"הגדרת הרגולריות היא קיומית. זו הפואנטה של L049 במאגר: המנה של רגולרית ב-CFL רגולרית, למרות שאין דרך כללית לחשב את קבוצת המצבים — הקבוצה קיימת, וזה מספיק.","a":2}]},{"t":"טעויות קלאסיות סביב סגירות ו־NFA","q":[{"q":"מ-<span class=\"math\">L₁ ∪ L₂<\/span> רגולרית, מה אפשר להסיק על <span class=\"math\">L₁<\/span>?","c":["ש-<span class=\"math\">L₁ ⊆ L₂<\/span>","כלום — למשל <span class=\"math\">L₂ = Σ<sup>*<\/sup><\/span> נותן איחוד רגולרי לכל <span class=\"math\">L₁<\/span> שהיא","ש-<span class=\"math\">L₁<\/span> רגולרית — מסגירות לאיחוד","ש-<span class=\"math\">L₁<\/span> רגולרית אם היא אינסופית"],"e":"סגירות עובדת \"פנימה\" (מהרכיבים אל התוצאה) ולא \"החוצה\". יוצא מן הכלל שכן עובד: אם האיחוד רגולרי ו-<span class=\"math\">L₂<\/span> <b>סופית<\/b> — אז <span class=\"math\">L₁<\/span> רגולרית (L096: מורידים מילים סופיות).","a":1},{"q":"האם איחוד <b>אינסופי<\/b> של שפות רגולריות הוא בהכרח רגולרי?","c":["כן — סגירות לאיחוד עובדת לכל מספר של שפות","כן, אם כל השפות מעל אותו אלף-בית","לא מוגדר","לא — כל שפה שהיא היא איחוד אינסופי של יחידונים רגולריים"],"e":"<span class=\"math\">L = ⋃<sub>w∈L<\/sub>{w}<\/span> — כל יחידון רגולרי, האיחוד הוא L כלשהי (גם לא-רגולרית). הסגירויות מנוסחות לפעולות סופיות; באינדוקציה מגיעים לכל מספר סופי, לא לאינסוף.","a":3},{"q":"האם תת-קבוצה של שפה רגולרית היא רגולרית?","c":["רק אם ההפרש סופי","לא בהכרח — <span class=\"math\">{aⁿbⁿ} ⊆ L(a*b*)<\/span> והיא איננה רגולרית","כן — ירושה מהאוטומט של השפה הגדולה","כן, אם התת-קבוצה אינסופית"],"e":"רגולריות אינה עוברת בהכלה לשום כיוון: תת-קבוצות ועל-קבוצות של רגולרית יכולות להיות כל דבר. (זו גם המלכודת של שאלה 3א במבחן לדוגמה — סנדוויץ' בין לא-רגולריות.)","a":1}]}]},{"sid":"ch3","topics":[{"t":"ביטוי רגולרי — ההגדרה האינדוקטיבית","q":[{"q":"מהם ביטויי הבסיס בהגדרה האינדוקטיבית של ביטוי רגולרי?","c":["כל שפה סופית","<span class=\"math\">∅<\/span>, <span class=\"math\">ε<\/span>, ו-<span class=\"math\">σ<\/span> לכל אות באלף-בית","רק אותיות האלף-בית","<span class=\"math\">Σ<\/span> ו-<span class=\"math\">Σ<sup>*<\/sup><\/span>"],"e":"שלושת הבסיסים: הביטוי ∅ (שפה ריקה), הביטוי ε (השפה {ε}), והביטוי σ (השפה {σ}). כל השאר נבנה מהם עם +, שרשור וכוכב.","a":1},{"q":"לפי כללי הקדימות, מהו פירוש הביטוי <span class=\"math\">ab<sup>*<\/sup>+c<\/span>?","c":["<span class=\"math\">a((b+c))<sup>*<\/sup><\/span>","<span class=\"math\">(ab)<sup>*<\/sup>+c<\/span>","<span class=\"math\">a(b<sup>*<\/sup>+c)<\/span>","<span class=\"math\">(a(b<sup>*<\/sup>))+c<\/span> — כוכב קודם, אז שרשור, אז איחוד"],"e":"סדר הקדימות: * חזק מהשרשור, ושרשור חזק מ-+. לכן הכוכב נצמד רק ל-b, השרשור מחבר a לתוצאה, והאיחוד אחרון.","a":3},{"q":"מה ההבדל בין הביטוי <span class=\"math\">∅<\/span> לביטוי <span class=\"math\">ε<\/span>?","c":["<span class=\"math\">L(ε)=∅<\/span> ו-<span class=\"math\">L(∅)={ε}<\/span>","<span class=\"math\">L(∅)=∅<\/span> — אף מילה; <span class=\"math\">L(ε)={ε}<\/span> — בדיוק המילה הריקה","אין הבדל — שניהם מתארים שפה בלי תוכן","<span class=\"math\">∅<\/span> אינו ביטוי חוקי"],"e":"אותה הבחנה מפרק 1 ברמת הביטויים: שפה בלי מילים לעומת שפה עם מילה אחת ריקה. היא קריטית בחשבון GNFA: <span class=\"math\">r·∅=∅<\/span> אבל <span class=\"math\">r·ε=r<\/span>.","a":1}]},{"t":"קריאת ביטויים — מהשפה אל הביטוי ובחזרה","q":[{"q":"איזו שפה מתאר הביטוי <span class=\"math\">0<sup>*<\/sup>10<sup>*<\/sup>10<sup>*<\/sup><\/span>?","c":["מילים שמתחילות ומסתיימות ב-1","מילים עם מספר זוגי של 1-ים","מילים עם בדיוק שני 1-ים","מילים עם לפחות שני 1-ים"],"e":"שני ה-1-ים כתובים במפורש (\"עדים\"), וכל השאר אפסים חופשיים. ללפחות-שניים היינו מסיימים ב-<span class=\"math\">(0+1)<sup>*<\/sup><\/span>; לזוגי — <span class=\"math\">0<sup>*<\/sup>(10<sup>*<\/sup>10<sup>*<\/sup>)<sup>*<\/sup><\/span>.","a":2},{"q":"מהן שתי הבדיקות המהירות שמומלץ לעשות על כל ביטוי שכתבתם?","c":["האם ε מתקבלת כשצריך, ומה קורה על המילים הקצרות ביותר","כמה אופרטורים יש ומה עומק הקינון","האם הביטוי מינימלי באורכו","האם כל אות מופיעה לפחות פעם אחת"],"e":"רוב השגיאות מתגלות מיד על ε (כוכב מיותר\/חסר) ועל מילים באורך 1–2 (חפיפות בין מקרים). אלה גם המילים המבדילות הראשונות בשאלות שקילות.","a":0},{"q":"האם <span class=\"math\">ε ∈ L((0+1)<sup>*<\/sup>00)<\/span>?","c":["כן — כל שפה עם כוכב מכילה את ε","תלוי בקדימויות","לא — כל מילה בשפה מסתיימת ב-00 ולכן אורכה לפחות 2","כן — הכוכב תורם את ε"],"e":"הכוכב תורם ε רק לחלק שלו; השרשור עם 00 מחייב סיפא. מילה מינימלית: 00. \"יש כוכב ⇒ יש ε\" נכון רק כשהכוכב חיצוני לכל הביטוי.","a":2}]},{"t":"טכניקות לכתיבת ביטוי לשפה נתונה","q":[{"q":"איך בונים ביטוי לשפה \"מספר ה-1-ים מתחלק ב-3\" מעל <span class=\"math\">{0,1}<\/span>?","c":["<span class=\"math\">(111)<sup>*<\/sup>0<sup>*<\/sup><\/span>","<span class=\"math\">(0<sup>*<\/sup>1)<sup>3<\/sup><\/span>","אין ביטוי — נדרשת ספירה","<span class=\"math\">0<sup>*<\/sup>(10<sup>*<\/sup>10<sup>*<\/sup>10<sup>*<\/sup>)<sup>*<\/sup><\/span> — בלוק של שלושה 1-ים בכוכב"],"e":"התבנית המחזורית: כל \"סיבוב\" של הכוכב מוסיף בדיוק שלושה 1-ים עם ריפוד אפסים, ובהתחלה ריפוד נוסף. הספירה כאן מודולרית (חסומה) — לכן רגולרית וניתנת לביטוי.","a":3},{"q":"בפתרון הרשמי של 2023ב הופיע <span class=\"math\">a<sup>*<\/sup>(abb+aab+ε)(bbb)<sup>*<\/sup>a<sup>*<\/sup><\/span>. אילו טכניקות מזוהות כאן?","c":["שימוש בזהות <span class=\"math\">r(sr)<sup>*<\/sup>=(rs)<sup>*<\/sup>r<\/span>","ריפוד משני הצדדים, פירוק למקרים באיחוד, ובלוק מחזורי בכוכב","קיבוע עדים בלבד","המרה מ-GNFA"],"e":"‏a* משני הצדדים = ההכנסה של מילת a*; האיחוד מכסה את שלושת שיירי ההתחלה האפשריים; (bbb)* משלים ל-mod 3. שלוש הטכניקות המרכזיות במכה אחת.","a":1},{"q":"רוצים ביטוי לשפה מסובכת שממנה קל דווקא לצייר אוטומט. מה הדרך המומלצת?","c":["לנחש ביטוי ולבדוק על כל המילים עד אורך 10","אין ברירה — חייבים לכתוב ביטוי ישירות","לכתוב דקדוק ולהמיר לביטוי","לצייר את האוטומט ולהמיר ל-GNFA — במקום לנחש ביטוי ישירות"],"e":"שני הפורמליזמים שקולים וההמרה שיטתית — אוטומט קל לוודא (מעקב ריצות), ו-GNFA ממיר בלי השראה. זו בדיוק נקודת החוזק של משפט השקילות בעבודה מעשית.","a":3}]},{"t":"משפט השקילות — מפת ההמרות","q":[{"q":"מה קובע משפט השקילות של פרק זה?","c":["שפה רגולרית ⟺ קיים ביטוי רגולרי שמתאר אותה","כל ביטוי רגולרי ניתן לקיצור לאורך לוגריתמי","ל-NFA ולביטוי אותו מספר מצבים\/אופרטורים","כל שפה ניתנת לתיאור בביטוי רגולרי"],"e":"שני הכיוונים: ביטוי→NFA (הבנייה המדורגת) ואוטומט→ביטוי (GNFA). יחד עם פרק 2: DFA ≡ NFA ≡ Regex — שלושה תיאורים לאותה מחלקה בדיוק.","a":0},{"q":"אילו שתי המרות מרכיבות את הוכחת המשפט?","c":["ביטוי→דקדוק ודקדוק→אוטומט","אוטומט→טבלה וטבלה→ביטוי","ביטוי→NFA בפירוק מדורג, ואוטומט→ביטוי דרך GNFA ואלימינציית מצבים","ביטוי→DFA ישירות, ו-DFA→NFA"],"e":"אלה שני ההליכים שמופיעים בדף הנוסחאות: \"Regex→NFA\" (5 שלבים) ו-\"NFA→GNFA→Regex\". שניהם חומר מבחן שנדרש להפעיל בפועל.","a":2},{"q":"מה המשמעות המעשית של השקילות המשולשת DFA ≡ NFA ≡ Regex?","c":["בכל שאלה בוחרים את הפורמליזם הנוח — וממירים אם צריך","תמיד כדאי לעבוד עם DFA כי הוא הבסיסי","ביטויים מיותרים — הכול אפשרי באוטומטים","רק שפות סופיות ניתנות לתיאור בכל השלושה"],"e":"תיאור נוח — ביטוי; הרצה והשלמות (משלים!) — DFA; בנייה עם ניחושים — NFA. הבחירה החופשית ביניהם היא כלי העבודה המרכזי בשאלות רגולריות.","a":0}]},{"t":"רגקס ← NFA — הבנייה המדורגת","q":[{"q":"איך מתחילים את המרת הביטוי <span class=\"math\">r<\/span> ל-NFA בשיטה המדורגת?","c":["עץ תחבירי של הביטוי","שני מצבים (התחלה ומקבל) וחץ יחיד ביניהם שמסומן בביטוי r כולו","מצב לכל אות בביטוי","בונים קודם DFA ואז מוסיפים ε"],"e":"מתחילים מ\"אוטומט\" עם חץ אחד שהתווית שלו היא כל r, ואז מפרקים תווית-תווית לפי האופרטור החיצוני — עד שנשארות רק אותיות ו-ε.","a":1},{"q":"איך מפורק חץ שמסומן <span class=\"math\">rs<\/span> (שרשור)?","c":["שני חיצים מקבילים r ו-s","לולאה עצמית עם r ואחריה s","חץ הפוך מ-s ל-r","שני חיצים עוקבים דרך מצב ביניים חדש: קודם r, אחריו s"],"e":"שרשור = בסדרה (מצב ביניים חדש); איחוד r+s = במקביל; כוכב = מבנה הלולאה עם שני ε. שלושת כללי הפירוק — אחד לכל אופרטור.","a":3},{"q":"מה גודל ה-NFA המתקבל ביחס לאורך הביטוי?","c":["תלוי באלף-בית בלבד","ליניארי — כל אופרטור מוסיף מספר קבוע של מצבים","מעריכי — לכן ההמרה יקרה","ריבועי במספר הכוכבים"],"e":"כל פירוק מוסיף לכל היותר מצב-שניים. הזול: ביטוי→NFA; היקר (אולי מעריכי): NFA→DFA. חשוב להבחין מי אשם במחיר כשמשרשרים המרות.","a":1}]},{"t":"NFA ← GNFA — שלוש ההכנות","q":[{"q":"מהן שלוש ההכנות שהופכות NFA ל-GNFA תקני?","c":["מינימיזציה, השלמה, והיפוך חיצים","הפיכת כל התוויות לאותיות בודדות","התחלה חדשה בלי נכנסים, מקבל יחיד חדש בלי יוצאים, וחץ יחיד (אולי בתווית סכום) בין כל זוג מצבים","מחיקת מעברי ε, השלמת מלכודת, ומיזוג מצבים שקולים"],"e":"‏s חדש עם ε פנימה; f חדש עם ε מכל המקבלים; ומיזוג חיצים מקבילים בעזרת +. המבנה האחיד הזה הוא מה שמאפשר את נוסחת הסילוק.","a":2},{"q":"מדוע דורשים שהמצב ההתחלתי של GNFA יהיה בלי חיצים נכנסים?","c":["כדי שאפשר יהיה לסלק כל מצב אחר בבטחה — s לעולם אינו \"תחנת ביניים\" שצריך לשמר","כדי לחסוך מצבים","כי אחרת האוטומט לא דטרמיניסטי","זו רק מוסכמה ציורית"],"e":"האלגוריתם מסלק את כולם חוץ מ-s ו-f. אם ל-s היו נכנסים (או ל-f יוצאים), מסלולים דרכם היו הולכים לאיבוד בסילוק — ולכן מנטרלים זאת מראש.","a":0},{"q":"בין זוג מצבים ב-GNFA יש שלושה חיצים בתוויות <span class=\"math\">a<\/span>, <span class=\"math\">bb<\/span>, <span class=\"math\">ε<\/span>. מה עושים?","c":["מוסיפים מצב ביניים לכל חץ","זה מצב אסור — האוטומט פסול","ממzgים לחץ יחיד עם התווית <span class=\"math\">a + bb + ε<\/span>","משאירים את הקצר ביותר"],"e":"חיצים מקבילים = איחוד אפשרויות המעבר — ממזגים עם +. תוויות GNFA הן ביטויים רגולריים מלאים, אז ε ו-bb לגיטימיות לגמרי.","a":2}]},{"t":"אלימינציית מצבים — הנוסחה ותהליך העבודה","q":[{"q":"מהי נוסחת העדכון בסילוק המצב k?","c":["<span class=\"math\">new(i,j) = old(i,k) + old(k,j)<\/span>","<span class=\"math\">new(i,j) = old(i,j)·old(k,k)<\/span>","<span class=\"math\">new(i,j) = old(i,j)<sup>*<\/sup><\/span>","<span class=\"math\">new(i,j) = old(i,j) + old(i,k)·old(k,k)<sup>*<\/sup>·old(k,j)<\/span>"],"e":"המסלולים החדשים = הישנים, ועוד כניסה ל-k, כמה סיבובים שרוצים בלולאה שלו, ויציאה. הנוסחה הזו כתובה בדף הנוסחאות — אבל צריך לדעת להפעיל אותה מהר ובלי השמטות.","a":3},{"q":"בסילוק מצב k, אילו זוגות (i,j) חייבים לעדכן?","c":["רק מצבים שאינם s או f","כל זוג של שכן-נכנס × שכן-יוצא של k — כולל זוגות עם i = j (לולאות!)","רק את הזוג (s, f)","רק זוגות שכבר היה ביניהם חץ"],"e":"כל מסלול שעבר דרך k חייב פיצוי — כולל מסלולים שמתחילים ומסתיימים באותו מצב (מעדכנים את הלולאה העצמית new(i,i)). פספוס לולאות הוא טעות הסילוק הנפוצה.","a":1},{"q":"איזה סדר סילוק מומלץ, ולמה?","c":["קודם המצב ההתחלתי","לפי סדר אלפביתי של השמות","הסדר לא משנה את כמות העבודה","קודם מצבים עם מעט חיצים — הביטויים שנוצרים נשארים קטנים"],"e":"התוצאה נכונה בכל סדר, אבל כמות הטקסט מתפוצצת אחרת: מצב עם p נכנסים ו-q יוצאים מייצר p·q עדכונים. מתחילים מהדלילים ושומרים על שפיות.","a":3}]},{"t":"∅ ,ε והמקרים המנוונים ב־GNFA","q":[{"q":"מהו <span class=\"math\">∅<sup>*<\/
