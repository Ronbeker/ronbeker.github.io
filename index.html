<\/sup> | #₀(w) = 2·#₁(w)}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו ע\"י למת הניפוח לשפות רגולריות<\/b> ש-<span class=\"math\">L<\/span> איננה שפה רגולרית.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3b","label":"2","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>i<\/sup>b<sup>j<\/sup> | i ≠ j}<\/span>.<\/p><p dir=\"auto\"><b>בנו דקדוק חסר הקשר<\/b> לשפה <span class=\"math\">L<\/span>. הסבירו בקצרה.<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3c","label":"3","kind":"open","rows":6,"prompt":"<p dir=\"auto\">בהינתן ה-<span class=\"en\">DFA<\/span>‏ הבא (מעגל על <span class=\"math\">a<\/span> עם <span class=\"math\">F = {q₀, q₁}<\/span>):<\/p><div class=\"fsa\"><svg viewBox=\"0 0 320 220\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\"><circle class=\"st st-acc\" cx=\"85\" cy=\"55\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"85\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"85\" y=\"55\">q₀<\/text><circle class=\"st st-acc\" cx=\"235\" cy=\"55\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"235\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"235\" y=\"55\">q₁<\/text><circle class=\"st\" cx=\"235\" cy=\"165\" r=\"25\"\/><text class=\"slbl\" x=\"235\" y=\"165\">q₂<\/text><circle class=\"st\" cx=\"85\" cy=\"165\" r=\"25\"\/><text class=\"slbl\" x=\"85\" y=\"165\">q₃<\/text><path class=\"tr\" d=\"M110,55 L207,55\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"158\" y=\"45\" text-anchor=\"middle\">a<\/text><path class=\"tr\" d=\"M235,80 L235,137\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"245\" y=\"112\">a<\/text><path class=\"tr\" d=\"M210,165 L113,165\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"158\" y=\"185\" text-anchor=\"middle\">a<\/text><path class=\"tr\" d=\"M85,140 L85,83\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"70\" y=\"112\">a<\/text><\/svg><\/div><p dir=\"auto\">הציגו <b>מילה בודדת<\/b> <span class=\"math\">w ∈ L(a<sup>*<\/sup>)<\/span> שמפרידה גם בין <span class=\"math\">q₀<\/span> ל-<span class=\"math\">q₂<\/span> וגם בין <span class=\"math\">q₁<\/span> ל-<span class=\"math\">q₃<\/span>. הסבירו.<\/p>","tags":{"subj":"minimize","qt":"short"}},{"pid":"q3d","label":"4","kind":"open","rows":7,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">L ∈ RE ∖ R<\/span> אזי <span class=\"math\"><span class=\"comp\">L<\/span> ∉ RE<\/span>.<\/p>","tags":{"subj":"r-re-core","qt":"claim"}},{"pid":"q3e","label":"5","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and (L(M) is finite or L(M) = Σ<sup>*<\/sup>)}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> לפי משפט <span class=\"en\">Rice<\/span>‏ השפה <span class=\"math\">L<\/span> איננה כריעה.<\/p>","tags":{"subj":"rice","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">Σ<\/span>: for every <span class=\"math\">σ ∈ Σ<\/span>, ‏<span class=\"math\">f(σ) = {σσ}<\/span> — each letter is replaced by the (regular, in fact finite) language containing exactly its doubling.<\/p>\n<p>Then <span class=\"math\">f(L) = {stut(w) | w ∈ L} = stut(L)<\/span>, and regular languages are closed under regular substitution — so <span class=\"math\">stut(L)<\/span> is regular.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><b>Construction:<\/b> for every <span class=\"math\">p ∈ Q<\/span> and <span class=\"math\">σ ∈ Σ<\/span> define:<\/p>\n<div class=\"lang-def\">δ_B(p, σ) = δ_A(δ_A(p, σ), σ)<\/div>\n<p>(same <span class=\"math\">Q<\/span>, ‏<span class=\"math\">q_s<\/span> and <span class=\"math\">F<\/span>).<\/p>\n<p><b>Explanation:<\/b> one step of <span class=\"math\">B<\/span> on the letter <span class=\"math\">σ<\/span> simulates exactly two steps of <span class=\"math\">A<\/span> on <span class=\"math\">σσ<\/span>. By induction, the run of <span class=\"math\">B<\/span> on <span class=\"math\">w<\/span> ends in the same state as the run of <span class=\"math\">A<\/span> on <span class=\"math\">stut(w)<\/span>; since the accepting states are unchanged, <span class=\"math\">w ∈ L(B) ⟺ stut(w) ∈ L(A) = L<\/span>.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p>For <span class=\"math\">i ≥ 0<\/span> let <span class=\"math\">S_i = {q ∈ Q | ∃y, |y| = i, δ′_A(q, y) ∈ F}<\/span> — the states from which <b>some<\/b> word of length exactly <span class=\"math\">i<\/span> reaches acceptance. Note the backward recurrence:<\/p>\n<div class=\"lang-def\">S₀ = F&nbsp;,&nbsp;&nbsp; S_{i+1} = pre(S_i) = {q | ∃σ: δ_A(q, σ) ∈ S_i}<\/div>\n<p>Now <span class=\"math\">x ∈ Half(L)<\/span> iff after reading <span class=\"math\">x<\/span> (say <span class=\"math\">|x| = i<\/span>) the automaton sits in a state of <span class=\"math\">S_i<\/span> — the remaining half <span class=\"math\">y<\/span> of the same length exists exactly then.<\/p>\n<p><b>The automaton:<\/b> ‏<span class=\"math\">B = (Q × P(Q), Σ, δ_B, (q_s, S₀), F_B)<\/span> where:<\/p>\n<ul>\n<li><span class=\"math\">δ_B((q, S), σ) = (δ_A(q, σ), pre(S))<\/span> — the first component follows <span class=\"math\">x<\/span> forward; the second advances the \"reachable-in-exactly-<span class=\"math\">i<\/span>-steps\" set (which does not depend on <span class=\"math\">σ<\/span>).<\/li>\n<li><span class=\"math\">F_B = {(q, S) | q ∈ S}<\/span> — accept when the current state can still reach <span class=\"math\">F<\/span> in exactly the number of steps read so far.<\/li>\n<\/ul>\n<p>After reading <span class=\"math\">x<\/span> the state is <span class=\"math\">(δ′_A(q_s, x), S_{|x|})<\/span>, so <span class=\"math\">B<\/span> accepts exactly <span class=\"math\">Half(L)<\/span>. ‏<span class=\"math\">B<\/span> is a finite (deterministic!) automaton — <span class=\"math\">Half(L)<\/span> is regular.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מכך ש-<span class=\"math\">L ∉ RE<\/span>.<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ coRE<\/span> — מזהה למשלים שמחפש <span class=\"math\">k+1<\/span> מילים מתקבלות שונות.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∈ coRE<\/span>:<\/b> note that<\/p>\n<div class=\"lang-def\"><span class=\"comp\">L<\/span> = {⟨M, k⟩ | |L(M)| ≥ k+1} ∪ {malformed inputs}<\/div>\n<p>We construct a recognizer <span class=\"math\">S<\/span> for <span class=\"math\"><span class=\"comp\">L<\/span><\/span>:<\/p>\n<pre>S: \"On input z:\n1. If z is not of the form ⟨M, k⟩ — accept.   (syntactic check, decidable)\n2. For i from 0 to ∞:\n   2.1. Counter := 0.\n   2.2. For every x with |x| ≤ i, in lexicographical order:\n      2.2.1. Run M on x for i steps.\n      2.2.2. If M accepted — Counter++.\n   2.3. If Counter ≥ k+1 — accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M,k⟩ ∈ <span class=\"comp\">L<\/span><\/span>: there exist <span class=\"math\">k+1<\/span> distinct accepted words <span class=\"math\">x₁,…,x_{k+1}<\/span>; let <span class=\"math\">s<\/span> be the maximal number of steps needed to accept any of them and <span class=\"math\">ℓ<\/span> the maximal length. At iteration <span class=\"math\">i = max{s, ℓ}<\/span> the sweep counts at least <span class=\"math\">k+1<\/span> acceptances and <span class=\"math\">S<\/span> accepts. Every iteration is finite (finitely many words, bounded simulations), so this iteration is reached.<\/li>\n<li><span class=\"math\">⟨M,k⟩ ∉ <span class=\"comp\">L<\/span><\/span> (i.e. <span class=\"math\">|L(M)| ≤ k<\/span>): no sweep can ever count <span class=\"math\">k+1<\/span> distinct accepted words, so <span class=\"math\">S<\/span> never accepts.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∉ RE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>, therefore <span class=\"math\">L ∉ RE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_{M,w}, 0⟩<\/span> where:<\/p>\n<pre>N_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> ‏<span class=\"math\">f<\/span> is computable (finite syntactic encoding).<\/p>\n<ul>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: ‏<span class=\"math\">M<\/span> does not accept <span class=\"math\">w<\/span> ⇒ <span class=\"math\">L(N_{M,w}) = ∅<\/span> ⇒ <span class=\"math\">|L(N)| = 0 ≤ 0<\/span> ⇒ <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: ‏<span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span> ⇒ <span class=\"math\">L(N_{M,w}) = Σ<sup>*<\/sup><\/span>, which is infinite — in particular <span class=\"math\">|L(N)| &gt; 0<\/span> ⇒ <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L<\/span> is regular; let <span class=\"math\">n<\/span> be the promised constant.<\/p>\n<p>Choose <span class=\"math\">w = 0<sup>2n<\/sup>1<sup>n<\/sup> ∈ L<\/span> (indeed <span class=\"math\">#₀ = 2n = 2·#₁<\/span>), ‏<span class=\"math\">|w| ≥ n<\/span>.<\/p>\n<p>For every division <span class=\"math\">w = xyz<\/span> with <span class=\"math\">|xy| ≤ n<\/span>, <span class=\"math\">|y| &gt; 0<\/span>: the first <span class=\"math\">n<\/span> letters are all <span class=\"math\">0<\/span>, so <span class=\"math\">y = 0<sup>t<\/sup><\/span>, ‏<span class=\"math\">t ≥ 1<\/span>.<\/p>\n<p>Choose <span class=\"math\">i = 0<\/span>: ‏<span class=\"math\">xy<sup>0<\/sup>z = 0<sup>2n−t<\/sup>1<sup>n<\/sup><\/span>, and <span class=\"math\">2n − t ≠ 2n = 2·n<\/span> — the condition fails, so <span class=\"math\">xy<sup>0<\/sup>z ∉ L<\/span>, contradicting condition 3. Therefore <span class=\"math\">L<\/span> is not regular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">i ≠ j<\/span> splits into <span class=\"math\">i &gt; j<\/span> or <span class=\"math\">i &lt; j<\/span> — a union of two one-sided comparisons:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span> | <span class=\"nt\">B<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → a<span class=\"nt\">A<\/span>b | a<span class=\"nt\">C<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → a<span class=\"nt\">C<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → a<span class=\"nt\">B<\/span>b | <span class=\"nt\">D<\/span>b<\/div>\n<div class=\"rule\"><span class=\"nt\">D<\/span> → <span class=\"nt\">D<\/span>b | ε<\/div>\n<\/div>\n<p><span class=\"math\">A<\/span> generates <span class=\"math\">i &gt; j<\/span>: pairs <span class=\"math\">aAb<\/span> plus a <b>mandatory<\/b> surplus <span class=\"math\">a<\/span> (the rule <span class=\"math\">A → aC<\/span>) and optional further <span class=\"math\">a<\/span>'s. Symmetrically <span class=\"math\">B<\/span> generates <span class=\"math\">i &lt; j<\/span> with a mandatory surplus <span class=\"math\">b<\/span>. The union is exactly <span class=\"math\">i ≠ j<\/span>.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">w = \"a\"<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ(q₀, a) = q₁ ∈ F<\/span> but <span class=\"math\">δ(q₂, a) = q₃ ∉ F<\/span> — the word <span class=\"math\">a<\/span> separates <span class=\"math\">q₀<\/span> from <span class=\"math\">q₂<\/span>.<\/li>\n<li><span class=\"math\">δ(q₁, a) = q₂ ∉ F<\/span> but <span class=\"math\">δ(q₃, a) = q₀ ∈ F<\/span> — the same word separates <span class=\"math\">q₁<\/span> from <span class=\"math\">q₃<\/span>.<\/li>\n<\/ul>\n<p>A single word, two separations — exactly as required.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p>Since <span class=\"math\">L ∈ RE<\/span>, by definition <span class=\"math\"><span class=\"comp\">L<\/span> ∈ coRE<\/span>. Assume towards contradiction that also <span class=\"math\"><span class=\"comp\">L<\/span> ∈ RE<\/span>.<\/p>\n<p>Then <span class=\"math\">L ∈ RE<\/span> and <span class=\"math\"><span class=\"comp\">L<\/span> ∈ RE<\/span>, i.e. <span class=\"math\">L ∈ RE ∩ coRE = R<\/span> (running the two recognizers in parallel yields a decider) — contradicting <span class=\"math\">L ∉ R<\/span>.<\/p>\n<p>Therefore <span class=\"math\"><span class=\"comp\">L<\/span> ∉ RE<\/span>.<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b> Define:<\/p>\n<div class=\"lang-def\">C = {L′ ∈ RE | L′ is finite or L′ = Σ<sup>*<\/sup>}<\/div>\n<p>Then <span class=\"math\">L = L_C<\/span> — the condition depends only on <span class=\"math\">L(M)<\/span> (semantic).<\/p>\n<ul>\n<li><span class=\"math\">C ⊆ RE<\/span>: by definition.<\/li>\n<li><span class=\"math\">C ≠ ∅<\/span>: ‏<span class=\"math\">∅ ∈ RE<\/span> and it is finite, so <span class=\"math\">∅ ∈ C<\/span>.<\/li>\n<li><span class=\"math\">C ≠ RE<\/span>: ‏<span class=\"math\">A<sub>TM<\/sub> ∈ RE<\/span>, it is infinite, and <span class=\"math\">A<sub>TM<\/sub> ≠ Σ<sup>*<\/sup><\/span> (e.g. the empty word is not a valid encoding ⟨M,w⟩) — so <span class=\"math\">A<sub>TM<\/sub> ∈ RE ∖ C<\/span>.<\/li>\n<\/ul>\n<p>The property is semantic and non-trivial, so by Rice's theorem <span class=\"math\">L = L_C ∉ R<\/span> — the claim is true.<\/p>\n<\/div>"}]},{"id":"sample","year":2023,"moed":"ס","label":"מבחן לדוגמה רשמי (2023)","lang":"he","combined":false,"meta":{"date":"2023","duration":"3 שעות","staff":"ד\"ר רעות לוי — Sample Exam, Term A","totalPoints":100,"note":"המבחן לדוגמה הרשמי של הקורס (תורגם מאנגלית; ההגדרות הפורמליות נשמרו כלשונן). פתרונות המרצה כוללים הערות פדגוגיות."},"questions":[{"n":"1","heading":"שאלה 1 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">עבור שפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ<\/span>, נגדיר:<\/p><div class=\"lang-def\">dropEven(L) ≝ {σ₁σ₂…σ<sub>n<\/sub> | ∃μ₁,…,μ<sub>n<\/sub> s.t. σ₁μ₁σ₂μ₂…σ<sub>n<\/sub>μ<sub>n<\/sub> ∈ L}<\/div><p dir=\"auto\">כלומר — האותיות שבמקומות האי-זוגיים של מילה מהשפה (מילה מקורית באורך זוגי).<\/p>","parts":[{"pid":"q1a","label":"א","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> קיימת שפה <span class=\"math\">L<\/span> שהיא חסרת הקשר ולא רגולרית, כך ש-<span class=\"math\">dropEven(L)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q1b","label":"ב","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">dropEven(L) = L<\/span> אזי <span class=\"math\">L<\/span> איננה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q1c","label":"ג","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו, ע\"י בנייה,<\/b> שלכל שפה רגולרית <span class=\"math\">L<\/span>, גם <span class=\"math\">dropEven(L)<\/span> רגולרית. ליתר דיוק: בהינתן <span class=\"en\">DFA<\/span>‏ שמזהה את <span class=\"math\">L<\/span>, הראו איך להמיר אותו ל-<span class=\"en\">NFA<\/span>‏ שמזהה את <span class=\"math\">dropEven(L)<\/span>.<\/p>","tags":{"subj":"automata","qt":"construction"}},{"pid":"q1d","label":"ד","kind":"open","rows":12,"prompt":"<p dir=\"auto\"><b>הוכיחו, בעזרת למת הניפוח,<\/b> שהשפה הבאה איננה חסרת הקשר:<\/p><div class=\"lang-def\">L = {ww<sup>R<\/sup> | w ∈ {0,1}<sup>*<\/sup> and #₀(w) = #₁(w)}<\/div>","tags":{"subj":"pump-cfl","qt":"pumping"}}]},{"n":"2","heading":"שאלה 2 (30 נקודות)","points":30,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">A = {⟨M⟩ | M is a TM and ∀w ∈ PAL, M doesn't reject w·w}<\/div><p dir=\"auto\">(‏<span class=\"math\">PAL<\/span> — שפת הפלינדרומים.)<\/p>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">A ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">A ∈ RE ∖ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">A ∈ coRE ∖ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":16,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם (הוכחה מלאה).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (20 נקודות)","points":20,"intro":"","parts":[{"pid":"q3a","label":"א","kind":"open","rows":6,"prompt":"<p dir=\"auto\"><b>הראו דוגמה נגדית<\/b> לטענה הבאה: תהיינה <span class=\"math\">L₁, L₂<\/span> שתי שפות לא רגולריות. אם <span class=\"math\">L₁ ⊆ L ⊆ L₂<\/span> אזי <span class=\"math\">L<\/span> בהכרח לא רגולרית.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q3b","label":"ב","kind":"open","rows":6,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">L<\/span> איננה חסרת הקשר אזי <span class=\"math\">L<sup>*<\/sup><\/span> איננה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"claim"}},{"pid":"q3c","label":"ג","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>ספקו דקדוק חסר הקשר<\/b> לשפה:<\/p><div class=\"lang-def\">L = {uv<sup>R<\/sup> | |u| = |v| and ∀i: u<sub>i<\/sub> ≠ v<sub>i<\/sub>}&nbsp;&nbsp;(Σ = {a,b})<\/div>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3d","label":"ד","kind":"open","rows":7,"prompt":"<p dir=\"auto\"><b>הפריכו<\/b> את הטענה הבאה: אם <span class=\"math\">L₁<\/span> חסרת הקשר ו-<span class=\"math\">L₂<\/span> רגולרית, אז <span class=\"math\">L₁ XOR L₂<\/span> חסרת הקשר.<\/p><div class=\"lang-def\">L₁ XOR L₂ = {w | (w ∈ L₁ or w ∈ L₂) and w ∉ L₁ ∩ L₂}<\/div>","tags":{"subj":"closure","qt":"claim"}}]},{"n":"4","heading":"שאלה 4 (10 נקודות)","points":10,"intro":"","parts":[{"pid":"q4a","label":"א","kind":"open","rows":4,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> תהי <span class=\"math\">M<\/span> מכונת טיורינג. אם <span class=\"math\">L(M) = Σ<sup>*<\/sup><\/span> אזי <span class=\"math\">M<\/span> בהכרח <b>מכריעה<\/b> את השפה <span class=\"math\">Σ<sup>*<\/sup><\/span>.<\/p>","tags":{"subj":"tm","qt":"claim"}},{"pid":"q4b","label":"ב","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> תהי <span class=\"math\">M<\/span> מכונת טיורינג. ‏<span class=\"math\">L(M)<\/span> איננה כריעה אם ורק אם קיימת מילה <span class=\"math\">w<\/span> כך ש-<span class=\"math\">M<\/span> לא עוצרת על <span class=\"math\">w<\/span>.<\/p>","tags":{"subj":"tm","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b>&nbsp; <span class=\"math\">L = {0<sup>n<\/sup>10<sup>n<\/sup>1 | n is odd}<\/span>.<\/p>\n<p><b><span class=\"math\">L<\/span> is not regular:<\/b> define a substitution <span class=\"math\">h(0) = a + b<\/span>, <span class=\"math\">h(1) = 1<\/span>. Then <span class=\"math\">h(L) ∩ L(a<sup>*<\/sup>1b<sup>*<\/sup>1) = {a<sup>n<\/sup>1b<sup>n<\/sup>1}<\/span>. Define <span class=\"math\">g(a) = a<\/span>, <span class=\"math\">g(b) = b<\/span>, <span class=\"math\">g(1) = ε<\/span> and obtain <span class=\"math\">g({a<sup>n<\/sup>1b<sup>n<\/sup>1}) = {a<sup>n<\/sup>b<sup>n<\/sup>}<\/span> — a non-regular language. Since regular languages are closed under substitution and intersection, if <span class=\"math\">L<\/span> were regular so would <span class=\"math\">{a<sup>n<\/sup>b<sup>n<\/sup>}<\/span> be — contradiction.<\/p>\n<p><b><span class=\"math\">L<\/span> is a CFL:<\/b><\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → 0<span class=\"nt\">A<\/span>01<\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → 00<span class=\"nt\">A<\/span>00 | 1<\/div>\n<\/div>\n<p><b>And:<\/b> <span class=\"math\">dropEven(L) = {0<sup>n<\/sup> | n ≥ 2 and n is even}<\/span> — a regular language (in <span class=\"math\">0<sup>n<\/sup>10<sup>n<\/sup>1<\/span> with odd <span class=\"math\">n<\/span>, both <span class=\"math\">1<\/span>'s sit at even positions and are dropped, and exactly <span class=\"math\">n+1<\/span> zeros survive).<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b>&nbsp; <span class=\"math\">L = Σ<sup>+<\/sup><\/span>: every word is the dropEven-image of some word (e.g. pad each letter), so <span class=\"math\">dropEven(Σ<sup>+<\/sup>) = Σ<sup>+<\/sup><\/span>, and <span class=\"math\">Σ<sup>+<\/sup><\/span> is certainly context-free.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>Sketch:<\/b> create two copies of the states of the DFA — the sets <span class=\"math\">Q_A<\/span> and <span class=\"math\">Q_B<\/span> — while accepting states are only in the copy <span class=\"math\">Q_A<\/span>.<\/p>\n<ul>\n<li>Move from <span class=\"math\">Q_A<\/span> to <span class=\"math\">Q_B<\/span> according to the transitions defined by <span class=\"math\">δ<\/span> (reading the \"kept\" letter <span class=\"math\">σ_i<\/span>).<\/li>\n<li>For each transition from <span class=\"math\">q<\/span> to <span class=\"math\">p<\/span> (on any letter), move from <span class=\"math\">q_B<\/span> to <span class=\"math\">p_A<\/span> using an <span class=\"math\">ε<\/span>-transition (guessing the dropped letter <span class=\"math\">μ_i<\/span>).<\/li>\n<\/ul>\n<p>A run of the NFA on <span class=\"math\">σ₁…σ_n<\/span> corresponds exactly to a run of the DFA on some <span class=\"math\">σ₁μ₁…σ_nμ_n<\/span>, so the NFA recognizes <span class=\"math\">dropEven(L)<\/span>.<\/p>\n<\/div>"},{"ref":"q1d","html":"<div class=\"ltr-sol\">\n<p>Consider <span class=\"math\">w = 0<sup>p<\/sup>1<sup>p<\/sup>1<sup>p<\/sup>0<sup>p<\/sup><\/span> and let <span class=\"math\">uvxyz<\/span> be a partition of <span class=\"math\">w<\/span> such that <span class=\"math\">|vy| &gt; 0<\/span> and <span class=\"math\">|vxy| ≤ p<\/span>.<\/p>\n<ul>\n<li><b>Case 1 — <span class=\"math\">vy<\/span> homogeneous:<\/b> after pumping, the number of zeros does not equal the number of ones, while <span class=\"math\">#₀(w) = #₁(w)<\/span> implies <span class=\"math\">#₀(ww<sup>R<\/sup>) = #₁(ww<sup>R<\/sup>)<\/span> for every member of the language — so the pumped word leaves the language.<\/li>\n<li><b>Case 2 — <span class=\"math\">vy<\/span> heterogeneous:<\/b>\n  <ul>\n  <li><b>2.1<\/b> — <span class=\"math\">vy<\/span> contains an unequal number of zeros and ones: after pumping the zero\/one counts differ, as in case 1.<\/li>\n  <li><b>2.2<\/b> — <span class=\"math\">vy<\/span> contains an equal number of zeros and ones (so it straddles a 0-1 border; note <span class=\"math\">|vxy| ≤ p<\/span> keeps it inside one half):\n    <ul>\n    <li><b>2.2.1<\/b> — <span class=\"math\">vy<\/span> lies in the first half: it starts with <span class=\"math\">0<\/span>; after pumping, the number of leading zeros exceeds <span class=\"math\">p<\/span> while the number of trailing zeros remains <span class=\"math\">p<\/span> — the word is no longer of the form <span class=\"math\">ww<sup>R<\/sup><\/span>.<\/li>\n    <li><b>2.2.2<\/b> — <span class=\"math\">vy<\/span> lies in the second half: analogous to 2.2.1.<\/li>\n    <\/ul><\/li>\n  <\/ul><\/li>\n<\/ul>\n<p>All cases contradict condition 3 of the lemma — <span class=\"math\">L<\/span> is not context-free.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">A ∉ R<\/span> — נובע מכך ש-<span class=\"math\">A ∉ RE<\/span>.<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">A ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> A<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">A ∈ coRE ∖ R<\/span> — בונים מזהה ל-<span class=\"math\"><span class=\"comp\">A<\/span><\/span>, ו-<span class=\"math\">A ∉ R<\/span> כי <span class=\"math\">A ∉ RE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">A ∉ RE<\/span>:<\/b> we reduce <span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> A<\/span>:<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N⟩<\/span>, where:<\/p>\n<pre>N: \"On input x:\n1. Run M on w.\n2. Reject.\"<\/pre>\n<p><span class=\"math\">f<\/span> is clearly computable as it only writes the encoding of <span class=\"math\">N<\/span> on the tape.<\/p>\n<ul>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> ⟹ <span class=\"math\">M<\/span> does not halt on <span class=\"math\">w<\/span> ⟹ <span class=\"math\">N<\/span> does not halt on any input ⟹ <span class=\"math\">N<\/span> does not reject any input ⟹ <span class=\"math\">⟨N⟩ ∈ A<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> ⟹ <span class=\"math\">M<\/span> halts on <span class=\"math\">w<\/span> ⟹ <span class=\"math\">N<\/span> rejects all inputs (in particular <span class=\"math\">w′·w′<\/span> for palindromes <span class=\"math\">w′<\/span>) ⟹ <span class=\"math\">⟨N⟩ ∉ A<\/span>.<\/li>\n<\/ul>\n<p>Since <span class=\"math\"><span class=\"comp\">HALT<sub>TM<\/sub><\/span> ∉ RE<\/span>, also <span class=\"math\">A ∉ RE<\/span> (and in particular <span class=\"math\">A ∉ R<\/span>).<\/p>\n<p><b><span class=\"math\">A ∈ coRE<\/span>:<\/b> we build a recognizer <span class=\"math\">S<\/span> for <span class=\"math\"><span class=\"comp\">A<\/span> = {⟨M⟩ | M is a TM and ∃w ∈ PAL s.t. M rejects w·w}<\/span>:<\/p>\n<pre>S: \"On input ⟨M⟩:\n1. For i = 1, 2, …:\n   1.1. For j = 0, 1, …, i:\n      1.1.1. For every x ∈ Σ^j in lexicographical order:\n         1.1.1.1. If x = x^R:\n            1.1.1.1.1. Run M on xx for i steps.\n            1.1.1.1.2. If M rejected, accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M⟩ ∉ <span class=\"comp\">A<\/span><\/span>: for every palindrome <span class=\"math\">w<\/span>, <span class=\"math\">M<\/span> does not reject <span class=\"math\">ww<\/span>. Hence <span class=\"math\">S<\/span> never accepts in line 1.1.1.1.2 — and since that is the only accepting line, <span class=\"math\">S<\/span> does not accept <span class=\"math\">⟨M⟩<\/span> (it never halts).<\/li>\n<li><span class=\"math\">⟨M⟩ ∈ <span class=\"comp\">A<\/span><\/span>: there exists <span class=\"math\">w ∈ PAL<\/span> such that <span class=\"math\">M<\/span> rejects <span class=\"math\">ww<\/span> in some number <span class=\"math\">k<\/span> of steps. Each execution of line 1.1.1.1.1 terminates in finite time, and the sets iterated in lines 1.1 and 1.1.1 are finite — so each iteration of the outer loop terminates. Hence <span class=\"math\">S<\/span> accepts <span class=\"math\">⟨M⟩<\/span> at the latest when <span class=\"math\">i = max{|w|, k}<\/span>, <span class=\"math\">j = |w|<\/span> and <span class=\"math\">x = w<\/span>.<\/li>\n<\/ul>\n<div class=\"note\" dir=\"rtl\"><b>הערת המרצה (מהפתרון הרשמי):<\/b> ההוכחה כאן שונה מזו שראיתם בתרגול. בתרגול בחרנו מילה ספציפית <span class=\"math\">w<\/span> (לפי מספר צעדים, אורך וסדר לקסיקוגרפי) והראינו שהמזהה מגיע אליה באיטרציה <span class=\"math\">i = k<\/span>; כאן הראינו שקבלה מתרחשת <b>לכל המאוחר<\/b> באיטרציה <span class=\"math\">i = max{|w|, k}<\/span>. שתי ההוכחות שונות — ושתיהן קבילות. בשתיהן חשוב להוכיח שהמזהה <b>מגיע<\/b> למילה שמקיימת את התנאי ואז מקבל — כלומר שהוא לא נתקע בלולאה אינסופית לפני כן.<\/div>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example: <span class=\"math\">L₁ = {a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span>, <span class=\"math\">L = L(a<sup>*<\/sup>b<sup>*<\/sup>)<\/span>, <span class=\"math\">L₂ = L(a<sup>*<\/sup>b<sup>*<\/sup>) ∪ {b<sup>n<\/sup>a<sup>n<\/sup>}<\/span>.<\/p>\n<p><span class=\"math\">L₁<\/span> and <span class=\"math\">L₂<\/span> are non-regular, <span class=\"math\">L₁ ⊆ L ⊆ L₂<\/span>, and yet <span class=\"math\">L = a<sup>*<\/sup>b<sup>*<\/sup><\/span> is regular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example: <span class=\"math\">L = {a<sup>p<\/sup> | p is a prime number} ∪ {a}<\/span>.<\/p>\n<p><span class=\"math\">L<\/span> is not context-free (removing one word from a non-CFL keeps it non-CFL — {a<sup>p<\/sup>} is not CFL), but since <span class=\"math\">a ∈ L<\/span>, the star contains every power: <span class=\"math\">L<sup>*<\/sup> = L(a<sup>*<\/sup>)<\/span> — regular, and in particular context-free.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → a<span class=\"nt\">S<\/span>b | b<span class=\"nt\">S<\/span>a | ε<\/div>\n<\/div>\n<p>In <span class=\"math\">uv<sup>R<\/sup><\/span>, position <span class=\"math\">i<\/span> of <span class=\"math\">u<\/span> is matched against position <span class=\"math\">i<\/span> of <span class=\"math\">v<\/span> — which sits mirrored in <span class=\"math\">v<sup>R<\/sup><\/span>. Each rule generates one such mirrored pair with <b>different<\/b> letters (<span class=\"math\">a…b<\/span> or <span class=\"math\">b…a<\/span>), exactly the condition <span class=\"math\">u_i ≠ v_i<\/span> for all <span class=\"math\">i<\/span>.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>Disproof.<\/b> Assume the statement were correct. Let <span class=\"math\">L₁<\/span> be any CFL and take <span class=\"math\">L₂ = Σ<sup>*<\/sup><\/span> (regular). Then:<\/p>\n<div class=\"lang-def\">L₁ XOR Σ<sup>*<\/sup> = <span class=\"comp\">L₁<\/span><\/div>\n<p>So the complement of every CFL would be a CFL — but CFLs are <b>not<\/b> closed under complement. Contradiction, hence the statement is incorrect.<\/p>\n<\/div>"},{"ref":"q4a","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b> ‏<span class=\"math\">L(M) = Σ<sup>*<\/sup><\/span> means <span class=\"math\">M<\/span> accepts — and in particular halts on — all inputs. A machine that halts on every input and accepts exactly <span class=\"math\">Σ<sup>*<\/sup><\/span> is by definition a decider of <span class=\"math\">Σ<sup>*<\/sup><\/span>.<\/p>\n<\/div>"},{"ref":"q4b","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Let <span class=\"math\">M<\/span> be a TM which loops on all inputs. There certainly exists a word on which <span class=\"math\">M<\/span> does not halt — yet <span class=\"math\">L(M) = ∅<\/span>, which is decidable (and in particular regular). So the \"only if\" direction fails.<\/p>\n<\/div>"}]}]</script>
<script type="application/json" id="d-langbank">[{"id":"L001","ans":"reg","src":"Jan 2013 Term A","html":"{a<sup>n<\/sup>b<sup>m<\/sup> | (n+m) mod 3 = 2}","note":"רק שארית האורך הכולל mod 3 קובעת — DFA עם 3 מצבים."},{"id":"L002","ans":"cfl","src":"Jan 2013 Term A","html":"{u#v<sup>R<\/sup> | u,v ∈ {a,b}<sup>*<\/sup> and u is a substring of v}","note":"היפוך ⇒ סדר ידידותי למחסנית: דוחפים את u ומשווים בתוך v<sup>R<\/sup>."},{"id":"L003","ans":"reg","src":"Jan 2013 Term A","html":"{(ab)<sup>k<\/sup>a(ba)<sup>k<\/sup> | k &gt; 0}","note":"מלכודת: (ab)<sup>k<\/sup>a = a(ba)<sup>k<\/sup>, ולכן זו בדיוק a(ba)<sup>2k<\/sup> — רגולרית."},{"id":"L004","ans":"cfl","src":"Jan 2013 Term A","html":"{a<sup>m<\/sup>b<sup>n<\/sup>a<sup>k<\/sup> | (k−m)(k−n) = 0}","note":"k=m או k=n — איחוד שתי שפות ח\"ה; השוואת מונים ⇒ לא רגולרית."},{"id":"L005","ans":"none","src":"Jan 2013 Term A","html":"{u#v | u,v ∈ {a,b}<sup>*<\/sup>, |u|=|v|, and ∀k: u<sub>k<\/sub> ≠ v<sub>k<\/sub>}","note":"השוואה עם # באותו סדר (v = המשלים תו-תו של u) — כמו {u#u}, לא ח\"ה."},{"id":"L006","ans":"cfl","src":"Jan 2016 Term A","html":"L = {w | w ∉ L′},&nbsp; L′ = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i,j,k &gt; 0 and i≠j, j≠k, k≠i}","note":"המשלים = לא-בצורה (רגולרי) ∪ שלוש שפות עם שוויון אחד — איחוד ח\"ה."},{"id":"L007","ans":"cfl","src":"Jan 2016 Term A","html":"{a<sup>n<\/sup>ub<sup>n<\/sup> | n &gt; 0, u ∈ {a,c}<sup>*<\/sup>}","note":"u בלי b ⇒ רצף ה-b הסופי מזוהה; השוואת n ⇒ מחסנית. השוו ל-L011!"},{"id":"L008","ans":"cfl","src":"Jan 2016 Term A","html":"{xy | x ∈ L and y<sup>R<\/sup> ∈ L} where L is a context-free language","note":"ח\"ה סגורה להיפוך ולשרשור: L·(L<sup>R<\/sup>). אין ערובה לרגולריות."},{"id":"L009","ans":"none","src":"Jan 2016 Term A","html":"{x#y | x,y ∈ {0,1}<sup>*<\/sup>, when viewed as binary numbers x = 2y+1}","note":"x = y עם '1' מוצמד — התאמה באותו סדר, כמו {u#u}."},{"id":"L010","ans":"cfl","src":"Feb 2016 Term A","html":"{ub<sup>n<\/sup>v | u ∈ {a,b}<sup>*<\/sup>, v ∈ {b,c}<sup>*<\/sup>, |u| = |v|, n &gt; 0}","note":"|u|=|v| — השוואת אורכים אחת סביב בלוק אמצעי מנוחש — PDA."},{"id":"L011","ans":"reg","src":"Feb 2016 Term A","html":"{a<sup>n<\/sup>u b<sup>n<\/sup> | n &gt; 0, u ∈ {a,b}<sup>*<\/sup>}","note":"מלכודת: u בולע הכול — n=1 תמיד עובד. זו בדיוק a{a,b}<sup>*<\/sup>b."},{"id":"L012","ans":"cfl","src":"Feb 2016 Term A","html":"{xy | x,y ∈ {0,1}<sup>*<\/sup>, |x| = |y| but x ≠ y}","note":"המשפט המפתיע: בלי # — פירוק לשני בלוקים אי-זוגיים סביב עמדת השוני — ח\"ה."},{"id":"L013","ans":"none","src":"Feb 2016 Term A","html":"{xy | x,y ∈ {0,1}<sup>*<\/sup>, |x| = |y| but x ≠ y at two places or more}","note":"שתי עמדות שוני — הטריק של בלוק-סביב-עמדה כבר לא עובד; לא ח\"ה."},{"id":"L014","ans":"none","src":"Feb 2018 Term A","html":"{wuw<sup>R<\/sup> | |w| = |u| and w,u ∈ {a,b}<sup>*<\/sup>}","note":"שתי השוואות (w מול w<sup>R<\/sup> וגם |w|=|u|) — מחסנית אחת לא מספיקה."},{"id":"L015","ans":"cfl","src":"Feb 2018 Term A","html":"{a<sup>i<\/sup>b<sup>k<\/sup>c<sup>i<\/sup> | (i+k) mod 3 = 1}","note":"התאמת a…c במחסנית + מונה mod 3 במצבים."},{"id":"L016","ans":"reg","src":"Feb 2018 Term A","html":"L<sup>*<\/sup>&nbsp; where&nbsp; L = {w | w = w<sup>R<\/sup>, w ∈ {a,b}<sup>*<\/sup>}","note":"מלכודת: כל אות בודדת היא פלינדרום ⇒ L<sup>*<\/sup> = Σ<sup>*<\/sup>."},{"id":"L017","ans":"cfl","src":"Feb 2018 Term A","html":"{a<sup>*<\/sup>b<sup>*<\/sup>c<sup>*<\/sup>} − {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup> | n ≥ 0}","note":"= {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i≠j או j≠k} — איחוד שתי ח\"ה. המשלים של aⁿbⁿcⁿ בתוך הצורה — ח\"ה!"},{"id":"L018","ans":"cfl","src":"Feb 2018 Term A","html":"{uv | u,v ∈ {a,b}<sup>*<\/sup>, |u| = |v|, u ≠ v<sup>R<\/sup> exactly at a single letter}","note":"השוואה מול היפוך — ידידותי למחסנית; סופרים בדיוק אי-התאמה אחת."},{"id":"L019","ans":"cfl","src":"Mar 2018 Term A","html":"{uv<sup>R<\/sup> | |u| = |v| and ∀i: u(i) ≠ v(i)}","note":"מול היפוך — כל זוג ממורר נבדק בקצות המחסנית: S → aSb | bSa | ε בסגנון."},{"id":"L020","ans":"reg","src":"Mar 2018 Term A","html":"{a<sup>i<\/sup>b<sup>k<\/sup>c<sup>i<\/sup> | (i+k) mod 3 = i}","note":"מלכודת: תוצאת mod 3 היא 0\/1\/2 ⇒ i ≤ 2 — סופי בצד ה-i, רגולרית."},{"id":"L021","ans":"none","src":"Mar 2018 Term A","html":"{x#y | x,y ∈ {0,1}<sup>*<\/sup>, when viewed as binary numbers x = 2y+1}","note":"(חוזרת) התאמה באותו סדר — לא ח\"ה."},{"id":"L022","ans":"reg","src":"Mar 2018 Term A","html":"{a<sup>n<\/sup>ub<sup>n<\/sup> | n &gt; 0, u ∈ {a,b}<sup>*<\/sup>}","note":"(חוזרת) u בולע הכול — a{a,b}<sup>*<\/sup>b."},{"id":"L023","ans":"cfl","src":"Mar 2018 Term A","html":"{a<sup>n<\/sup>u b<sup>n<\/sup> | n &gt; 0, u ∈ L} where L is a CF language","note":"קינון בדקדוק: S → aSb | S<sub>L<\/sub> — עוטפים את L בזוגות a…b."},{"id":"L024","ans":"none","src":"March 19 Term B","html":"L = {ww<sup>R<\/sup>#ww<sup>R<\/sup> | w ∈ {a,b}<sup>*<\/sup>}","note":"פלינדרום אחד — כן; אותו פלינדרום פעמיים — התאמה באותו סדר, לא ח\"ה."},{"id":"L025","ans":"reg","src":"March 19 Term B","html":"L = {(ab)<sup>n<\/sup>a(ba)<sup>n<\/sup> | n ≥ 0}","note":"כמו L003: שווה ל-a(ba)<sup>2n<\/sup> — רגולרית."},{"id":"L026","ans":"cfl","src":"March 19 Term B","html":"L<sup>*<\/sup>&nbsp; where&nbsp; L = {w ∈ {0,1}<sup>*<\/sup> | w = w<sup>R<\/sup> and |w| mod 2 = 0}","note":"בניגוד ל-L016: רק פלינדרומים זוגיים — אותיות בודדות לא בפנים; 01 ∉ L<sup>*<\/sup>. ח\"ה ולא רגולרית."},{"id":"L027","ans":"cfl","src":"March 19 Term B","html":"L = {a<sup>i<\/sup>b<sup>i+j+k+l<\/sup>c<sup>2k<\/sup>d<sup>j<\/sup> | i,j,k,l &gt; 0}","note":"כל ההשוואות מסתדרות בסדר מחסנית אחד: פורקים את ה-b-ים מול a, c (חצי) ו-d."},{"id":"L028","ans":"reg","src":"March 19 Term B","html":"L = {0<sup>i<\/sup>1<sup>j+k<\/sup> | i,j,k ≥ 0, if i ≤ 100 then i = j, otherwise j = k}","note":"מלכודת: k חופשי ⇒ עבור i≤100 זה 0<sup>i<\/sup>1<sup>≥i<\/sup> (סופית מצבים); אחרת 1-ים זוגיים? לא — j=k ⇒ j+k=2j זוגי. רגולרית."},{"id":"L029","ans":"reg","src":"Jan 19 Term A","html":"{y#x | xy ∈ L} where L = {w ∈ {0,1}<sup>*<\/sup> | w does not contain 01110}","note":"רוטציה עם # של שפה רגולרית — פירוק L<sup>A<\/sup><sub>p,q<\/sub> — רגולרית."},{"id":"L030","ans":"none","src":"Jan 19 Term A","html":"(Σ<sup>*<\/sup> − {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup> | n ≥ 0}) ∩ {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>m<\/sup> | m,n ≥ 0},&nbsp; Σ = {a,b,c}","note":"= {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>m<\/sup> | m ≠ n} — שתי השוואות על אותם מונים. השוו ל-L048!"},{"id":"L031","ans":"cfl","src":"Jan 19 Term A","html":"{w ∈ {a,b}<sup>*<\/sup> | for any prefix u of w: #<sub>a<\/sub>(u) ≥ ⅓|u|}","note":"מונה משוקלל אחד (a: +2, b: −1, נשאר ≥ 0) — PDA; לא חסום ⇒ לא רגולרית."},{"id":"L032","ans":"none","src":"Jan 19 Term A","html":"{uv ∈ {0,1}<sup>*<\/sup> | |u| = |v| and u ≠ v at exactly two letters}","note":"כמו L013 — 'בדיוק שתי עמדות' דורש שתי התאמות מסונכרנות."},{"id":"L033","ans":"reg","src":"Feb 20 Term A","html":"L₁ = {w | |w| mod 3 = #<sub>a<\/sub>(w) mod 3}","note":"שני מונים mod 3 — מכפלת מצבים סופית."},{"id":"L034","ans":"cfl","src":"Feb 20 Term A","html":"L₂ = {σ₁uσ₂vσ₃ ∈ {0,1}<sup>*<\/sup> | |u| = |v|, σ₂ = σ₁ or σ₂ = σ₃}","note":"השוואת |u|=|v| אחת + בדיקת אותיות מקומית — PDA."},{"id":"L035","ans":"none","src":"Feb 20 Term A","html":"L₃ = {u#v | uv ∈ L′ and |u| = |v|} where L′ = {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>*<\/sup> | n ≥ 0}","note":"גם aⁿbⁿ וגם חציית אמצע — שתי השוואות."},{"id":"L036","ans":"cfl","src":"Feb 20 Term A","html":"L₄ = {uvw ∈ {a,b}<sup>*<\/sup> | |u| = |v| = |w| and u ≠ w}","note":"שלישים עם u ≠ w — גרסת ה'שלישים' של הטריק מ-L012."},{"id":"L037","ans":"reg","src":"Feb 20 Term A","html":"L₅ = {w | #<sub>a<\/sub>(w) ≥ #<sub>b<\/sub>(w)} ∘ {w | #<sub>a<\/sub>(w) ≤ #<sub>b<\/sub>(w)}","note":"מלכודת: כל מילה מתפרקת (u=w,v=ε או u=ε,v=w) ⇒ Σ<sup>*<\/sup>."},{"id":"L038","ans":"none","src":"May 20 Term B","html":"L₁ = {uv#u<sup>R<\/sup>v<sup>R<\/sup> | u,v ∈ {a,b}<sup>*<\/sup>}","note":"u<sup>R<\/sup>v<sup>R<\/sup> ≠ (uv)<sup>R<\/sup>! ההיפוך הבלוקי מכניס התאמה באותו סדר — לא ח\"ה."},{"id":"L039","ans":"cfl","src":"May 20 Term B","html":"L₂ = {a<sup>n<\/sup>ub<sup>n<\/sup> | n &gt; 0, u ∈ {b,c}<sup>*<\/sup>}","note":"u עם b אבל בלי a ⇒ ה-aⁿ מזוהה; דרוש רצף b סופי ≥ n — השוואה, PDA. השוו ל-L007\/L011."},{"id":"L040","ans":"reg","src":"May 20 Term B","html":"L₃ = {x | xy ∈ L, |x| = |y|} where L = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i+k is odd, and j is even}","note":"חצי ראשון של שפה רגולרית (HALF) — תמיד רגולרי (ניחוש מצב האמצע)."},{"id":"L041","ans":"none","src":"May 20 Term B","html":"L₄ = {xy ∈ {a,b}<sup>*<\/sup> | x = x<sup>R<\/sup> and y = x<sup>R<\/sup>}","note":"y = x<sup>R<\/sup> = x ⇒ {xx | x פלינדרום} — כפילות באותו סדר, לא ח\"ה."},{"id":"L042","ans":"cfl","src":"May 20 Term B","html":"L₅ = {u0vw1 | u,v,w ∈ {0,1}<sup>*<\/sup> and |u| + |v| = |w|}","note":"משוואת אורכים אחת — מחסנית."},{"id":"L043","ans":"cfl","src":"June 21 Term A","html":"L₁ = {0<sup>m<\/sup>1<sup>n<\/sup>0<sup>p<\/sup>1<sup>q<\/sup> | m + p = n + q}","note":"משוואה לינארית אחת על ארבעה בלוקים — מונה מחסנית (עם נדנוד סימן מסודר)."},{"id":"L044","ans":"cfl","src":"June 21 Term A","html":"L₂ = {uvxy | u,v,x,y ∈ {0,1}<sup>*<\/sup>, |u| = |x| and |v| = |y| but u ≠ x}","note":"בוחרים עמדת שוני ב-u,x ומרכיבים בלוקים — הרחבת הטריק של L012."},{"id":"L045","ans":"none","src":"June 21 Term A","html":"L₃ = {ww<sup>R<\/sup> | w ∈ L′},&nbsp; L′ = {w ∈ {0,1}<sup>*<\/sup> | #₁(w) = #₀(w)}","note":"פלינדרום זוגי + ספירה גלובלית שווה — שתי דרישות מחסנית."},{"id":"L046","ans":"reg","src":"June 21 Term A","html":"L₄ = {ua<sup>n<\/sup>v | u,v ∈ {a,b}<sup>*<\/sup>, |u| = |v|, (n mod 2) = 0}","note":"מלכודת: n=0 מותר ⇒ כל מילה באורך זוגי (ורק הן). רגולרית."},{"id":"L047","ans":"reg","src":"June 21 Term A","html":"L₅ = {uvw | u,v,w ∈ {0,1}<sup>*<\/sup>, u ≠ v<sup>R<\/sup> and v ≠ w<sup>R<\/sup>}","note":"מלכודת: כמעט כל מילה מתפרקת כך (בחירת חלקים ריקים\/לא-ריקים בחוכמה)."},{"id":"L048","ans":"cfl","src":"March 21 Term B","html":"L₁ = (Σ<sup>*<\/sup> − {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup> | n ≥ 0}) ∩ {a<sup>*<\/sup>b<sup>*<\/sup>c<sup>*<\/sup>},&nbsp; Σ = {a,b,c}","note":"= {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i≠j or j≠k} — או אחד מספיק! השוו ל-L030 שבו נדרש i=j."},{"id":"L049","ans":"reg","src":"March 21 Term B","html":"L₂ = {x | ∃y s.t. y ∈ L′ and yx ∈ L} where L is a RL and L′ is a CFL","note":"מנה שמאלית של רגולרית — קבוצת מצבי הביניים קיימת (גם אם לא ניתנת לחישוב) ⇒ רגולרית."},{"id":"L050","ans":"reg","src":"March 21 Term B","html":"L₃ = {uv | u,v ∈ {0,1}<sup>*<\/sup> and #₁(u) = #₁(v)}","note":"מלכודת: פיצול כזה קיים אמ\"מ #₁(w) זוגי — רגולרית."},{"id":"L051","ans":"reg","src":"March 21 Term B","html":"L₄ = {w ∈ {0,1}<sup>*<\/sup> | every substring of length 10 in w appears only once}","note":"מספר התת-מחרוזות באורך 10 חסום ⇒ אורך המילים חסום ⇒ שפה סופית."},{"id":"L052","ans":"none","src":"March 21 Term B","html":"L₅ = {u#v | u,v ∈ {0,1}<sup>*<\/sup>, |u| = |v| and ∃i s.t. u[i] = v[i]}","note":"עם # ו-|u|=|v| — מציאת אותה עמדה בשני הצדדים דורשת שתי ספירות. השוו ל-L012 (בלי #)."},{"id":"L053","ans":"none","src":"Nov 2021","html":"{ww<sup>R<\/sup>#ww<sup>R<\/sup> | w ∈ {0,1}<sup>*<\/sup>}","note":"(כמו L024) אותו פלינדרום פעמיים — לא ח\"ה."},{"id":"L054","ans":"reg","src":"Nov 2021","html":"{wxw<sup>R<\/sup> | w ∈ {a,b}<sup>*<\/sup>, x ∈ {a,b,c}<sup>*<\/sup>}","note":"מלכודת: w = ε מותר ⇒ כל מילה מתאימה ⇒ Σ<sup>*<\/sup>."},{"id":"L055","ans":"cfl","src":"Nov 2021","html":"{u#v | u,v ∈ {a,b}<sup>*<\/sup>, |u| = |v|, u ≠ v<sup>R<\/sup> exactly at a single letter}","note":"מול היפוך — סדר מחסנית טבעי, סופרים אי-התאמה אחת בדיוק."},{"id":"L056","ans":"none","src":"Nov 2021","html":"{x#y | x,y ∈ {0,1}<sup>*<\/sup>, when viewed as binary numbers x = 4y+2}","note":"x = y·'10' כמחרוזות — התאמה באותו סדר."},{"id":"L057","ans":"cfl","src":"Nov 2021","html":"{a<sup>*<\/sup>b<sup>*<\/sup>c<sup>*<\/sup>} − {a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup> | n ≥ 0}","note":"(כמו L017) — איחוד i≠j או j≠k."},{"id":"L058","ans":"none","src":"Jan 2011 Term A","html":"{a<sup>n<\/sup>b<sup>n<\/sup>c<sup>2n<\/sup> | n &gt; 0}","note":"שלושה בלוקים תלויים באותו n — שתי השוואות."},{"id":"L059","ans":"cfl","src":"Jan 2011 Term A","html":"{a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i,j,k ≥ 0, i≠j or j≠k}","note":"'או' מציל: איחוד שתי שפות חד-השוואתיות."},{"id":"L060","ans":"reg","src":"Jan 2011 Term A","html":"{xyz | xz ∈ L, y ∉ L} and L is regular","note":"הכנסת מילה מ-<span class=\"comp\">L<\/span> (רגולרית) באמצע — פירוק L<sup>A<\/sup><sub>p,q<\/sub>."},{"id":"L061","ans":"reg","src":"Jan 2011 Term A","html":"{(ab)<sup>k<\/sup>a(ba)<sup>k<\/sup> | k &gt; 0}","note":"(כמו L003) = a(ba)<sup>2k<\/sup>."},{"id":"L062","ans":"cfl","src":"Jan 2011 Term A","html":"{a<sup>n<\/sup>b<sup>m<\/sup>c<sup>n<\/sup> | m,n ≥ 0 and m+n is even}","note":"התאמת a…c אחת + זוגיות במצבים."},{"id":"L063","ans":"cfl","src":"Feb 2011 Term B","html":"{w | w is not a palindrome}","note":"המשלים של פלינדרומים — ח\"ה (מנחשים עמדת שוני ממוררת), אבל לא רגולרית."},{"id":"L064","ans":"reg","src":"Feb 2011 Term B","html":"{a<sup>n<\/sup>(a+b)<sup>m<\/sup> | m ≥ 0, and n is a prime number}","note":"מלכודת: (a+b)<sup>m<\/sup> בולע — מספיק n=2 ⇒ זו בדיוק aaΣ<sup>*<\/sup>."},{"id":"L065","ans":"cfl","src":"Feb 2011 Term B","html":"{vb<sup>*<\/sup>w | v ∈ {a,b}<sup>*<\/sup>, w ∈ {b,c}<sup>*<\/sup> and |v| = |w|}","note":"השוואת אורכים אחת סביב בלוק אמצעי — PDA."},{"id":"L066","ans":"none","src":"Feb 2011 Term B","html":"{0<sup>i<\/sup>1<sup>j<\/sup>0<sup>k<\/sup> | k ≥ max(i,j)}","note":"k ≥ i וגם k ≥ j — שתי השוואות בו-זמנית על אותו בלוק."},{"id":"L067","ans":"reg","src":"Feb 2011 Term B","html":"{xy | x,y ∈ {a,b}<sup>*<\/sup> and |x| = |y|}","note":"מלכודת: בלי תנאי נוסף — פשוט כל המילים באורך זוגי."},{"id":"L068","ans":"none","src":"Jan 2014 Term A","html":"{ww<sup>R<\/sup>#ww<sup>R<\/sup> | w ∈ {0,1}<sup>*<\/sup>}","note":"(כמו L024\/L053)."},{"id":"L069","ans":"reg","src":"Jan 2014 Term A","html":"{x#z | ∃y s.t. xyz ∈ L, ∃n ≤ 10 s.t. |x|·|z| = 3<sup>n<\/sup>} where L is a CFL","note":"מלכודת: |x|·|z| ≤ 3¹⁰ חוסם את שני האורכים ⇒ שפה סופית."},{"id":"L070","ans":"cfl","src":"Jan 2014 Term A","html":"{0<sup>i<\/sup>1<sup>j<\/sup>0<sup>k<\/sup> | i,j,k ≥ 0 and (k &gt; j or j &gt; i)}","note":"'או' — איחוד שתי שפות חד-השוואתיות."},{"id":"L071","ans":"none","src":"Jan 2014 Term A","html":"{0<sup>i<\/sup>1<sup>j<\/sup>0<sup>k<\/sup> | 0 ≤ k ≤ min(i,j)}","note":"k ≤ i וגם k ≤ j — שתי השוואות."},{"id":"L072","ans":"reg","src":"Jan 2014 Term A","html":"{wxw | w,x ∈ {0,1}<sup>*<\/sup>}","note":"מלכודת: w = ε ⇒ Σ<sup>*<\/sup>."},{"id":"L073","ans":"cfl","src":"Feb 2014 Term B","html":"{a<sup>n<\/sup>b<sup>m<\/sup>a<sup>n<\/sup>b<sup>m<\/sup> | 5 ≥ n ≥ 0, m ≥ 1}","note":"n חסום (≤5) ⇒ נשארת השוואת m אחת לכל n קבוע — איחוד סופי של ח\"ה."},{"id":"L074","ans":"reg","src":"Feb 2014 Term B","html":"{u<sup>R<\/sup>v | uv ∈ L} where L is regular","note":"היפוך רישא של רגולרית: (L<sup>A<\/sup><sub>q_s,p<\/sub>)<sup>R<\/sup>·L<sup>A<\/sup><sub>p,f<\/sub> — רגולרית."},{"id":"L075","ans":"none","src":"Feb 2014 Term B","html":"{ww | w ∈ L}&nbsp; where L = {a<sup>*<\/sup>b<sup>*<\/sup>}","note":"= {a<sup>i<\/sup>b<sup>j<\/sup>a<sup>i<\/sup>b<sup>j<\/sup>} — כפילות באותו סדר."},{"id":"L076","ans":"cfl","src":"Feb 2014 Term B","html":"{x#x<sup>R<\/sup> | ∃y s.t. xyx<sup>R<\/sup> ∈ L} where L is regular","note":"x מול x<sup>R<\/sup> — סדר מחסנית; התנאי על L רגולרי נבדק במקביל במצבים."},{"id":"L077","ans":"reg","src":"Feb 2014 Term B","html":"{w ∈ {a,b}<sup>*<\/sup> | for any prefix u in w: |#<sub>a<\/sub>(u) − #<sub>b<\/sub>(u)| ≤ 3}","note":"מונה חסום (±3) — נכנס במצבים. השוו ל-L031 שבו המונה לא חסום."},{"id":"L078","ans":"cfl","src":"Jan 2015 Term A","html":"{uv | u,v ∈ {a,b}<sup>*<\/sup>, |u| = |v|, u ≠ v<sup>R<\/sup> exactly in a single letter}","note":"(כמו L018)."},{"id":"L079","ans":"reg","src":"Jan 2015 Term A","html":"{a<sup>n<\/sup>u b<sup>n<\/sup> | n &gt; 0, u ∈ {a,b}<sup>*<\/sup>}","note":"(כמו L011\/L022) — a{a,b}<sup>*<\/sup>b."},{"id":"L080","ans":"cfl","src":"Jan 2015 Term A","html":"{a<sup>n<\/sup>b<sup>m<\/sup>c<sup>n<\/sup>d<sup>m<\/sup> | n ≥ 2, m·n ≤ 2n+1}","note":"מלכודת: מהאילוץ m ≤ 2 (עבור n≥2) ⇒ נשארת השוואת n אחת — ח\"ה. בלי האילוץ זה היה None."},{"id":"L081","ans":"reg","src":"Jan 2015 Term A","html":"{xy | x,y ∈ {a,b}<sup>*<\/sup> and x ≠ y}","note":"מלכודת: בלי |x|=|y| — כל מילה לא ריקה מתפרקת (x=ε≠y) ⇒ Σ<sup>+<\/sup>."},{"id":"L082","ans":"reg","src":"Mar 2015 Term B","html":"{a<sup>n<\/sup>b<sup>m<\/sup> | (n+m) mod 3 = 2}","note":"(כמו L001)."},{"id":"L083","ans":"cfl","src":"Mar 2015 Term B","html":"{x$y<sup>R<\/sup> | x = uyv ∧ x,u,y,v are words over Σ = {0,1}}","note":"y תת-מחרוזת של x, מושווית כהיפוך — סדר מחסנית טבעי."},{"id":"L084","ans":"cfl","src":"Mar 2015 Term B","html":"{uvw | u,v,w ∈ {0,1}<sup>*<\/sup>, |uv| = |w| ∧ #₀(u) = #₀(v)}","note":"שתי דרישות אבל מקוננות יפה בסדר קריאה אחד — PDA (נדחפים ונפרקים בשלבים)."},{"id":"L085","ans":"none","src":"Mar 2015 Term B","html":"{a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | k ≤ max(i,j) and k ≥ min(i,j)}","note":"min ≤ k ≤ max — שתי השוואות בו-זמנית."},{"id":"L086","ans":"cfl","src":"Mar 2015 Term B","html":"{vb<sup>n<\/sup>w | v ∈ {a,b}<sup>*<\/sup>, w ∈ {b,c}<sup>*<\/sup>, |v| = |w|}","note":"(כמו L065 עם בלוק b מפורש)."},{"id":"L087","ans":"reg","src":"HW3 2022","html":"add2#(L) = {x#y#z | xyz ∈ L, x,y,z ∈ Σ<sup>*<\/sup>} where L is regular","note":"הוספת שני # לשפה רגולרית — פירוק L<sup>A<\/sup><sub>p,q<\/sub> כפול."},{"id":"L088","ans":"reg","src":"HW3 2022","html":"L′ = {y#x | xy ∈ L} where L is regular","note":"רוטציה עם # — רגולרית (כמו L029)."},{"id":"L089","ans":"cfl","src":"Jan 2008","html":"sort(L) where L is regular&nbsp; (sort(w) = the letters of w in sorted order)","note":"למשל L=(ab)<sup>*<\/sup> ⇒ sort(L)={a<sup>n<\/sup>b<sup>n<\/sup>} — ח\"ה ולאו דווקא רגולרית."},{"id":"L090","ans":"reg","src":"Feb 2008","html":"insert(L₁, L₂) where L₁, L₂ are regulars&nbsp; (הכנסת מילה מ-L₁ בתוך מילה מ-L₂)","note":"פירוק L<sup>A<\/sup><sub>p,q<\/sub> — כמו Op של מבחן 2023ב."},{"id":"L091","ans":"reg","src":"Mar 2010 Term B","html":"alt(L₁, L₂) where L₁, L₂ are regulars&nbsp; (ex. u=a₁a₂a₃, v=b₁b₂b₃ ⇒ alt(u,v)=a₁b₁a₂b₂a₃b₃)","note":"שזירה בצעד קבוע — אוטומט מכפלה שמתחלף בין השניים."},{"id":"L092","ans":"reg","src":"Jan 2011 Term A","html":"drop<sub>a<\/sub>(L) = {xy | xay ∈ L} where L is regular","note":"מחיקת a אחת — ניחוש נקודת המחיקה באוטומט (מעבר ε מדומה)."},{"id":"L093","ans":"reg","src":"Jan 2011 Term A","html":"add<sub>a<\/sub>(L) = {xa<sup>*<\/sup>y | xy ∈ L} where L is regular","note":"הוספת ריצות a — לולאות עצמיות חדשות על מצבי הביניים (כמו שאלה 1 של 2023א!)."},{"id":"L094","ans":"cfl","src":"Jan 2011 Term A","html":"L = {xy | |x| = |y| and x ≠ y}","note":"(כמו L012) — הטריק המפורסם."},{"id":"L095","ans":"none","src":"Jan 2011 Term A","html":"L = {xy | |x| = |y| and x<sub>i<\/sub> ≠ y<sub>i<\/sub>}","note":"∀i שונה (y = משלים תו-תו של x) — כל העמדות ביחד = התאמה באותו סדר."},{"id":"L096","ans":"reg","src":"Jan 2014 Term A","html":"L₁ where L₁ ∪ L₂ is regular and L₂ is finite","note":"L₁ = (L₁∪L₂) בלי לכל היותר מספר סופי של מילים — הסרה סופית שומרת רגולריות."},{"id":"L097","ans":"reg","src":"Jan 2014 Term A","html":"L′ = {x#y | xy ∈ L, yx ∉ L} where L is regular","note":"שני תנאים רגולריים (פירוק p,q על שניהם) — חיתוך רגולרי."},{"id":"L098","ans":"none","src":"Feb 2014 Term B","html":"L₂ = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | j = i·k}","note":"מכפלה — אפילו לא ח\"ה (ניפוח ח\"ה נופל על תלות לא-לינארית)."},{"id":"L099","ans":"cfl","src":"Jan 2015 Term A","html":"L₂ = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | k ≥ 2·(i+j) and i,j,k ≥ 0}","note":"אי-שוויון לינארי אחד — מונה משוקלל במחסנית."},{"id":"L100","ans":"none","src":"Jan 2015 Term A","html":"L₂ = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | k ≥ 2·i·j and i,j,k ≥ 0}","note":"מכפלה בתנאי — לא לינארי ⇒ לא ח\"ה. השוו ל-L099!"},{"id":"L101","ans":"reg","src":"Mar 2015 Term B","html":"L₃ = {w | w<sub>even<\/sub> ∈ L₁, w<sub>odd<\/sub> ∉ L₂} where L₁, L₂ are regulars","note":"עוקבים אחרי שתי ההטלות (זוגי\/אי-זוגי) במכפלת אוטומטים — רגולרית."}]</script>
<script type="text/plain" id="d-defs"><h1>דף נוסחאות והגדרות</h1>
<p class="chapter-subtitle">הנוסח שמצורף רשמית למבחני 2023–2024 (מתורגם ומורחב קלות) — כדאי להכיר אותו היטב: הוא זמין לכם בזמן המבחן</p>

<section>
  <h2>אוטומטים סופיים</h2>

  <div class="def"><span class="term">אוטומט סופי דטרמיניסטי (DFA)</span> —
    חמישייה <span class="math">A = (Q, Σ, δ, q<sub>s</sub>, F)</span> כאשר:
    <ul>
      <li><span class="math">Q</span> — קבוצה סופית של מצבים.</li>
      <li><span class="math">Σ</span> — קבוצה סופית, האלף־בית.</li>
      <li><span class="math">δ: Q × Σ → Q</span> — פונקציית המעברים.</li>
      <li><span class="math">q<sub>s</sub> ∈ Q</span> — המצב ההתחלתי.</li>
      <li><span class="math">F ⊆ Q</span> — קבוצת המצבים המקבלים.</li>
    </ul>
  </div>

  <div class="def"><span class="term">אוטומט סופי לא־דטרמיניסטי (NFA)</span> —
    חמישייה <span class="math">B = (Q, Σ, δ, q<sub>s</sub>, F)</span>, זהה ל־DFA פרט לפונקציית המעברים:
    <div class="lang-def">δ: Q × Σ<sub>ε</sub> → P(Q)&nbsp;&nbsp;,&nbsp;&nbsp;Σ<sub>ε</sub> = Σ ∪ {ε}</div>
    כלומר מכל מצב, על כל אות (או על <span class="math">ε</span>), עוברים ל<em>קבוצת</em> מצבים אפשריים.
  </div>

  <div class="thm"><span class="term">שפה רגולרית</span> — שפה נקראת רגולרית אם ורק אם קיים אוטומט סופי שמזהה אותה
    (שקול: קיים ביטוי רגולרי שמתאר אותה; שקול: קיים דקדוק רגולרי שיוצר אותה).</div>
</section>

<section>
  <h2>המרות בין מודלים רגולריים</h2>

  <div class="algo">
    <h4>NFA ← DFA (בניית תת־הקבוצות)</h4>
    <p>בהינתן <span class="math">N = (Q<sub>N</sub>, Σ<sub>N</sub>, δ<sub>N</sub>, q<sub>sN</sub>, F<sub>N</sub>)</span> נבנה
      <span class="math">D = (Q<sub>D</sub>, Σ<sub>D</sub>, δ<sub>D</sub>, q<sub>sD</sub>, F<sub>D</sub>)</span>:</p>
    <ul>
      <li><span class="math">Q<sub>D</sub> = P(Q<sub>N</sub>)</span> (קבוצת החזקה).</li>
      <li><span class="math">Σ<sub>D</sub> = Σ<sub>N</sub></span>.</li>
      <li>לכל <span class="math">R ∈ Q<sub>D</sub></span> ולכל <span class="math">σ ∈ Σ<sub>D</sub></span>:
        <span class="math">δ<sub>D</sub>(R, σ) = ⋃<sub>r∈R</sub> E(δ<sub>N</sub>(r, σ))</span>,
        כאשר <span class="math">E(R)</span> היא סגירת ה־<span class="math">ε</span> — כל המצבים שנגישים מ־<span class="math">R</span> במעברי <span class="math">ε</span> בלבד.</li>
      <li><span class="math">q<sub>sD</sub> = E(q<sub>sN</sub>)</span>.</li>
      <li><span class="math">F<sub>D</sub> = {R ∈ Q<sub>D</sub> | R ∩ F<sub>N</sub> ≠ ∅}</span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>Regex ← NFA</h4>
    <ol>
      <li>מציירים NFA בן שני מצבים שהמעבר ביניהם מסומן בביטוי <span class="math">r</span> כולו.</li>
      <li>מעבר שמסומן <span class="math">r + s</span> מוחלף בשני חיצים מקבילים — אחד <span class="math">r</span> ואחד <span class="math">s</span>.</li>
      <li>מעבר שמסומן <span class="math">rs</span> מוחלף בשני חיצים עוקבים דרך מצב ביניים חדש.</li>
      <li>מעבר שמסומן <span class="math">r<sup>*</sup></span> מוחלף במבנה: <span class="math">ε</span> פנימה, לולאת <span class="math">r</span> עצמית, <span class="math">ε</span> החוצה.</li>
      <li>ממשיכים עד שכל התוויות הן אותיות מ־<span class="math">Σ<sub>ε</sub></span>.</li>
    </ol>
  </div>

  <div class="algo">
    <h4>NFA ← Regex&nbsp;: דרך GNFA (אלימינציית מצבים)</h4>
    <p><b>שלב א — הפיכה ל־GNFA:</b></p>
    <ul>
      <li>מצב התחלתי חדש <span class="math">s</span> עם <span class="math">δ(s, ε) = q<sub>s</sub></span>, כך שמההתחלה יוצאים חיצים בלבד.</li>
      <li>מצב מקבל יחיד חדש <span class="math">f</span>: לכל <span class="math">q ∈ F</span> מוסיפים <span class="math">δ(q, ε) = f</span>, וקובעים <span class="math">F = {f}</span>.</li>
      <li>בין כל זוג מצבים יש בדיוק חץ אחד: חיצים מקבילים מוחלפים בסכום (<span class="math">+</span>) של התוויות; אם אין חץ — מוסיפים חץ בתווית <span class="math">∅</span>.</li>
    </ul>
    <p><b>שלב ב — אלימינציה:</b> מסלקים בכל פעם מצב <span class="math">k ≠ s, f</span>, ולכל זוג <span class="math">(i, j)</span> מעדכנים:</p>
    <div class="lang-def">new(i,j) = old(i,j) + old(i,k)·old(k,k)<sup>*</sup>·old(k,j)</div>
    <p>תזכורת: <span class="math">∅<sup>*</sup> = {ε}</span>. בסוף נשארים רק <span class="math">s</span> ו־<span class="math">f</span>, והתווית על החץ ביניהם היא הביטוי הרגולרי המבוקש.</p>
  </div>
</section>

<section>
  <h2>מצבים שקולים ומינימיזציה</h2>

  <div class="def"><span class="term">מילה מפרידה (Separating word)</span> —
    לשני מצבים <span class="math">q, p ∈ Q</span>, מילה <span class="math">w ∈ Σ<sup>*</sup></span> נקראת מפרידה אם בדיוק אחד משני הריצות מסתיים במצב מקבל:
    <span class="math">δ′(q,w) ∈ F</span> אבל <span class="math">δ′(p,w) ∉ F</span>, או להפך
    (<span class="math">δ′</span> — הרחבת פונקציית המעברים למילים).
  </div>

  <div class="def"><span class="term">שקילות־k</span> — <span class="math">p ≡<sub>k</sub> q</span> אם אין מילה מפרידה באורך
    <span class="math">≤ k</span>. <span class="term">שקילות</span> — <span class="math">p ≡ q</span> אם הם
    <span class="math">k</span>־שקולים לכל <span class="math">k ≥ 0</span>.
  </div>

  <div class="algo">
    <h4>מציאת מחלקות שקילות (ל־DFA בלבד)</h4>
    <ol>
      <li>מסירים את כל המצבים הלא־נגישים.</li>
      <li>מתחילים מהחלוקה <span class="math">E<sub>0</sub> = {F, Q∖F}</span>.</li>
      <li>בצעד <span class="math">k ≥ 1</span> בונים את <span class="math">E<sub>k</sub></span>: מצבים <span class="math">q, p</span> באותה מחלקה ב־<span class="math">E<sub>k−1</sub></span> נשארים יחד אם ורק אם לכל <span class="math">σ ∈ Σ</span> מתקיים <span class="math">δ(q,σ) ≡<sub>k−1</sub> δ(p,σ)</span>.</li>
      <li>עוצרים כאשר <span class="math">E<sub>k−1</sub> = E<sub>k</sub></span>.</li>
    </ol>
  </div>

  <div class="algo">
    <h4>מינימיזציה של DFA</h4>
    <ol>
      <li>מריצים את אלגוריתם מחלקות השקילות על <span class="math">Q</span>.</li>
      <li>מקצים מצב חדש לכל מחלקת שקילות.</li>
      <li>בונים את ה־DFA הממוזער בהתאם.</li>
    </ol>
  </div>

  <div class="thm"><span class="term">טענה</span> — שני DFA־ים <span class="math">A, B</span> שקולים
    (<span class="math">L(A) = L(B)</span>) אם ורק אם <span class="math">q<sub>s<sub>A</sub></sub> ≡ q<sub>s<sub>B</sub></sub></span>
    (באוטומט האיחוד שלהם).</div>
</section>

<section>
  <h2>למת הניפוח לשפות רגולריות</h2>
  <div class="thm">
    אם <span class="math">L</span> שפה רגולרית, אז קיים <span class="math">n ∈ ℕ</span> כך שלכל מילה
    <span class="math">w ∈ L</span> עם <span class="math">|w| ≥ n</span> קיימת חלוקה <span class="math">w = xyz</span> המקיימת:
    <ol>
      <li><span class="math">|y| &gt; 0</span></li>
      <li><span class="math">|xy| ≤ n</span></li>
      <li>לכל שלם <span class="math">i ≥ 0</span>: <span class="math">w<sub>i</sub> = xy<sup>i</sup>z ∈ L</span></li>
    </ol>
  </div>
  <div class="note"><b>הערת אורך:</b> אם <span class="math">|y| = t</span> אז
    <span class="math">|xy<sup>i</sup>z| = |w| + (i−1)t</span> — שימושי כשצריך לפגוע באורך מסוים.</div>
</section>

<section>
  <h2>דקדוקים</h2>

  <div class="def"><span class="term">דקדוק חסר הקשר (CFG)</span> —
    רביעייה <span class="math">G = (V, Σ, S, R)</span>:
    <ul>
      <li><span class="math">V</span> — קבוצה סופית של משתנים.</li>
      <li><span class="math">Σ</span> — קבוצת הטרמינלים, <span class="math">V ∩ Σ = ∅</span>.</li>
      <li><span class="math">S ∈ V</span> — משתנה ההתחלה.</li>
      <li><span class="math">R</span> — קבוצה סופית של כללי גזירה מהצורה <span class="math">A → α</span>, כאשר <span class="math">A ∈ V</span> ו־<span class="math">α ∈ (V ∪ Σ)<sup>*</sup></span>.</li>
    </ul>
    שפה שנוצרת על ידי CFG נקראת <span class="term">שפה חסרת הקשר (CFL)</span> —
    ושפה היא חסרת הקשר אם ורק אם קיים אוטומט מחסנית שמזהה אותה.
  </div>

  <div class="def"><span class="term">דקדוק רגולרי (RG)</span> — כל כלל הוא מאחת הצורות:
    <div class="gram"><div class="rule">A → w</div><div class="rule">A → wB</div></div>
    כאשר <span class="math">A, B ∈ V</span> ו־<span class="math">w ∈ Σ<sup>*</sup></span>.
    <span class="term">דקדוק רגולרי פשוט (SRG)</span> — כל כלל מהצורה
    <span class="math">A → σ</span> (עם <span class="math">σ ∈ Σ</span>),
    <span class="math">A → σB</span> (עם <span class="math">σ ∈ Σ<sub>ε</sub></span>),
    או <span class="math">A → ε</span>.
  </div>

  <div class="algo">
    <h4>RG ← NFA</h4>
    <ul>
      <li>משתנה לכל מצב; <span class="math">S</span> — המשתנה של <span class="math">q<sub>s</sub></span>.</li>
      <li>לכל מעבר <span class="math">δ(A, σ) = B</span> מוסיפים כלל <span class="math">A → σB</span>; לכל מעבר <span class="math">δ(A, ε) = B</span> מוסיפים <span class="math">A → B</span>.</li>
      <li>לכל מצב מקבל <span class="math">q ∈ F</span> מוסיפים <span class="math">A → ε</span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>NFA ← RG (דרך SRG)</h4>
    <ul>
      <li>הופכים את הדקדוק לפשוט (מפצלים <span class="math">A → σ<sub>1</sub>σ<sub>2</sub>…σ<sub>n</sub>B</span> לשרשרת כללים באות אחת).</li>
      <li>מצב לכל משתנה; <span class="math">q<sub>s</sub> = S</span>.</li>
      <li><span class="math">A → σB</span> נותן מעבר <span class="math">δ(A, σ) = B</span>; <span class="math">A → B</span> נותן מעבר <span class="math">ε</span>.</li>
      <li>לכל <span class="math">A → σ</span>: מוסיפים מצב חדש <span class="math">q<sub>i</sub></span>, מעבר <span class="math">δ(A, σ) = q<sub>i</sub></span>, ומכניסים את <span class="math">q<sub>i</sub></span> ל־<span class="math">F</span>.</li>
    </ul>
  </div>
</section>

<section>
  <h2>פישוט דקדוק ו־CNF</h2>

  <div class="def"><span class="term">דקדוק מפושט</span> — דקדוק ללא כללי <span class="math">ε</span>
    (מהצורה <span class="math">A → ε</span>; מותר רק <span class="math">S → ε</span>) וללא כללי יחידה
    (מהצורה <span class="math">A → B</span>).</div>

  <div class="algo">
    <h4>הסרת כללי ε</h4>
    <ol>
      <li>בוחרים כלל <span class="math">A → ε</span> (עם <span class="math">A ≠ S</span>) ומסירים אותו.</li>
      <li>לכל כלל <span class="math">B → αAβ</span> מוסיפים (בלי להסיר את המקור) את <span class="math">B → αβ</span> — לכל מופע של <span class="math">A</span> בנפרד: מ־<span class="math">B → αAβAγ</span> נקבל גם <span class="math">B → αβAγ</span>, גם <span class="math">B → αAβγ</span> וגם <span class="math">B → αβγ</span>. עבור <span class="math">B → A</span> מוסיפים <span class="math">B → ε</span> (אלא אם כבר הוסר).</li>
      <li>חוזרים עד שלא נותרו כללי <span class="math">ε</span>.</li>
    </ol>
    <p class="small"><b>אם <span class="math">ε ∈ L</span>:</b> מריצים את האלגוריתם ואז מוסיפים משתנה התחלה חדש עם
      <span class="math">S′ → S | ε</span>.</p>
  </div>

  <div class="algo">
    <h4>הסרת כללי יחידה</h4>
    <ol>
      <li>בוחרים כלל יחידה <span class="math">A → B</span> ומסירים אותו.</li>
      <li>לכל כלל <span class="math">B → α</span> מוסיפים <span class="math">A → α</span>.</li>
      <li>חוזרים עד שלא נותרו כללי יחידה.</li>
    </ol>
  </div>

  <div class="def"><span class="term">צורת חומסקי הנורמלית (CNF)</span> — כל כלל הוא מאחת הצורות:
    <div class="gram"><div class="rule">A → BC</div><div class="rule">A → σ</div></div>
    כאשר <span class="math">A, B, C ∈ V</span>, <span class="math">B, C ≠ S</span>, ו־<span class="math">σ ∈ Σ</span>.
    אם <span class="math">ε ∈ L</span> מותר גם <span class="math">S → ε</span>.
  </div>

  <div class="algo">
    <h4>CNF ← CFG</h4>
    <ol>
      <li>מוסיפים משתנה התחלה חדש <span class="math">S′</span> וכלל <span class="math">S′ → S</span>.</li>
      <li>מסירים כללי <span class="math">ε</span>.</li>
      <li>מסירים כללי יחידה.</li>
      <li>מתקנים את הכללים שנותרו: טרמינל <span class="math">σ<sub>i</sub></span> בכלל ארוך מוחלף במשתנה <span class="math">A<sub>i</sub></span> עם כלל <span class="math">A<sub>i</sub> → σ<sub>i</sub></span>; כלל <span class="math">A → B<sub>1</sub>B<sub>2</sub>…B<sub>n</sub></span> (עם <span class="math">n &gt; 2</span>) מפוצל ל־<span class="math">A → B<sub>1</sub>C<sub>1</sub></span> ו־<span class="math">C<sub>1</sub> → B<sub>2</sub>…B<sub>n</sub></span>, וחוזר חלילה.</li>
    </ol>
  </div>
</section>

<section>
  <h2>אוטומט מחסנית (PDA)</h2>

  <div class="def"><span class="term">PDA</span> — שישייה <span class="math">A = (Q, Σ, Γ, δ, q<sub>s</sub>, F)</span>:
    <ul>
      <li><span class="math">Q</span> — מצבים; <span class="math">Σ</span> — אלף־בית הקלט; <span class="math">Γ</span> — אלף־בית המחסנית.</li>
      <li><span class="math">δ: Q × Σ<sub>ε</sub> × Γ<sub>ε</sub> → P(Q × Γ<sub>ε</sub>)</span> — פונקציית המעברים (קוראים אות או <span class="math">ε</span>, מוציאים סמל מחסנית או <span class="math">ε</span>, דוחפים סמל או <span class="math">ε</span>).</li>
      <li><span class="math">q<sub>s</sub> ∈ Q</span> התחלתי; <span class="math">F ⊆ Q</span> מקבלים.</li>
    </ul>
  </div>

  <div class="def"><span class="term">PDA מפושט</span> —
    יש לו מצב מקבל יחיד <span class="math">q<sub>f</sub></span>; לפני קבלה המחסנית חייבת להיות ריקה;
    וכל מעבר או מוציא סמל מהמחסנית (pop) או מכניס סמל (push), אך לא שניהם.
  </div>

  <div class="algo">
    <h4>PDA ← CFG</h4>
    <p>בהינתן <span class="math">G = (V, Σ, S, R)</span> בונים PDA עם שלושה מצבים
      <span class="math">q<sub>start</sub> → q<sub>loop</sub> → q<sub>accept</sub></span>:</p>
    <ul>
      <li>בכניסה דוחפים <span class="math">S$</span> (מעבר <span class="math">ε,ε→S$</span>).</li>
      <li>ב־<span class="math">q<sub>loop</sub></span>: לכל כלל <span class="math">A → α<sub>1</sub>…α<sub>k</sub></span> — מעבר <span class="math">ε, A → α<sub>1</sub>…α<sub>k</sub></span>; לכל <span class="math">a ∈ Σ</span> — מעבר <span class="math">a, a → ε</span>.</li>
      <li>מעבר <span class="math">ε, $ → ε</span> אל <span class="math">q<sub>accept</sub></span>.</li>
    </ul>
  </div>

  <div class="algo">
    <h4>CFG ← PDA</h4>
    <p>בהינתן PDA מפושט <span class="math">P = (Q, Σ<sub>P</sub>, Γ, δ, q<sub>s</sub>, {q<sub>f</sub>})</span>, לכל
      <span class="math">p, q ∈ Q</span> מגדירים את <span class="math">L<sub>p,q</sub></span> — כל המילים שמריצות את
      <span class="math">P</span> ממצב <span class="math">p</span> עם מחסנית ריקה למצב <span class="math">q</span> עם מחסנית ריקה.
      שימו לב: <span class="math">L(P) = L<sub>q<sub>s</sub>,q<sub>f</sub></sub></span>.</p>
    <p>בונים דקדוק עם משתנים <span class="math">A<sub>p,q</sub></span> לכל זוג מצבים, <span class="math">S = A<sub>q<sub>s</sub>,q<sub>f</sub></sub></span>, וכללים:</p>
    <ul>
      <li>לכל <span class="math">p, q, r ∈ Q</span>: <span class="math">A<sub>p,q</sub> → A<sub>p,r</sub>A<sub>r,q</sub></span>.</li>
      <li>לכל <span class="math">p ∈ Q</span>: <span class="math">A<sub>p,p</sub> → ε</span>.</li>
      <li>לכל <span class="math">p, q, r, s ∈ Q</span>, <span class="math">γ ∈ Γ</span>, <span class="math">σ′, σ″ ∈ Σ<sub>ε</sub></span> כך ש־<span class="math">(r, γ) ∈ δ(p, σ′, ε)</span> (push) ו־<span class="math">(q, ε) ∈ δ(s, σ″, γ)</span> (pop):
        מוסיפים <span class="math">A<sub>p,q</sub> → σ′A<sub>r,s</sub>σ″</span>.</li>
    </ul>
  </div>
</section>

<section>
  <h2>למת הניפוח לשפות חסרות הקשר</h2>
  <div class="thm">
    אם <span class="math">L</span> שפה חסרת הקשר, אז קיים <span class="math">p ∈ ℕ</span> כך שלכל
    <span class="math">w ∈ L</span> עם <span class="math">|w| ≥ p</span> קיימת חלוקה
    <span class="math">w = uvxyz</span> המקיימת:
    <ol>
      <li><span class="math">|vy| &gt; 0</span></li>
      <li><span class="math">|vxy| ≤ p</span></li>
      <li>לכל שלם <span class="math">i ≥ 0</span>: <span class="math">w<sub>i</sub> = uv<sup>i</sup>xy<sup>i</sup>z ∈ L</span></li>
    </ol>
  </div>
  <div class="note"><b>הערת אורך:</b> אם <span class="math">|v| = s</span> ו־<span class="math">|y| = t</span> אז
    <span class="math">|uv<sup>i</sup>xy<sup>i</sup>z| = |w| + (i−1)s + (i−1)t</span>.</div>
</section>

<section>
  <h2>הצבה (Substitution)</h2>
  <div class="def"><span class="term">הצבה</span> — בהינתן אלף־ביתים <span class="math">Σ<sub>1</sub>, Σ<sub>2</sub></span>,
    הצבה היא פונקציה <span class="math">f: Σ<sub>1</sub> → P(Σ<sub>2</sub><sup>*</sup>)</span> — לכל אות
    <span class="math">σ ∈ Σ<sub>1</sub></span> מתאימים שפה <span class="math">L<sub>σ</sub></span> מעל <span class="math">Σ<sub>2</sub></span>.
    ההרחבה למילה: <span class="math">f(w) = {w<sub>1</sub>w<sub>2</sub>…w<sub>n</sub> | w<sub>i</sub> ∈ f(σ<sub>i</sub>)}</span>;
    ולשפה: <span class="math">f(L) = ⋃<sub>w∈L</sub> f(w)</span>.
  </div>
  <div class="thm"><span class="term">הצבה רגולרית</span> — אם <span class="math">L</span> רגולרית וכל
    <span class="math">L<sub>σ</sub></span> רגולרית, אז <span class="math">f(L)</span> רגולרית.
    <span class="term">הצבה חסרת הקשר</span> — אם <span class="math">L</span> חסרת הקשר וכל
    <span class="math">L<sub>σ</sub></span> חסרת הקשר, אז <span class="math">f(L)</span> חסרת הקשר.</div>
</section>

<section>
  <h2>מכונת טיורינג</h2>
  <div class="def"><span class="term">מכונת טיורינג (TM)</span> —
    שביעייה <span class="math">M = (Q, Σ, Γ, δ, q<sub>s</sub>, q<sub>acc</sub>, q<sub>rej</sub>)</span>:
    <ul>
      <li><span class="math">Q</span> — קבוצה סופית של מצבים.</li>
      <li><span class="math">Σ</span> — אלף־בית הקלט; תו הרווח <span class="math">␣ ∉ Σ</span>.</li>
      <li><span class="math">Γ</span> — אלף־בית הסרט; <span class="math">␣ ∈ Γ</span> וגם <span class="math">Σ ⊆ Γ</span>.</li>
      <li><span class="math">δ: Q × Γ → Q × Γ × {L, R}</span> — פונקציית המעברים.</li>
      <li><span class="math">q<sub>s</sub></span> התחלתי; <span class="math">q<sub>acc</sub></span> מקבל; <span class="math">q<sub>rej</sub></span> דוחה.</li>
    </ul>
  </div>
</section>

<section>
  <h2>השפות המרכזיות</h2>
  <div class="def">
    <ul class="major-langs">
      <li><span class="math">A<sub>DFA</sub> = {⟨D, w⟩ | D is a DFA and D accepts w}</span></li>
      <li><span class="math">A<sub>TM</sub> = {⟨M, w⟩ | M is a TM and M accepts w}</span></li>
      <li><span class="math">HALT<sub>TM</sub> = {⟨M, w⟩ | M is a TM and M halts on input w}</span></li>
      <li><span class="math">E<sub>DFA</sub> = {⟨D⟩ | D is a DFA and L(D) = ∅}</span></li>
      <li><span class="math">E<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) = ∅}</span></li>
      <li><span class="math">REG<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) is a regular language}</span></li>
      <li><span class="math">EQ<sub>DFA</sub> = {⟨D<sub>1</sub>, D<sub>2</sub>⟩ | D<sub>1</sub>, D<sub>2</sub> are DFAs and L(D<sub>1</sub>) = L(D<sub>2</sub>)}</span></li>
      <li><span class="math">EQ<sub>TM</sub> = {⟨M<sub>1</sub>, M<sub>2</sub>⟩ | M<sub>1</sub>, M<sub>2</sub> are TMs and L(M<sub>1</sub>) = L(M<sub>2</sub>)}</span></li>
      <li><span class="math">PAL = {w | w ∈ Σ<sup>*</sup> and w = w<sup>R</sup>}</span></li>
      <li><span class="math">PAL<sub>TM</sub> = {⟨M⟩ | M is a TM and L(M) = PAL}</span></li>
      <li><span class="math">L<sub>∞</sub> = {⟨M⟩ | M is a TM and L(M) is infinite}</span></li>
    </ul>
  </div>
  <div class="note"><b>סטטוס כריעות (מהקורס):</b>
    <span class="math">A<sub>DFA</sub>, E<sub>DFA</sub>, EQ<sub>DFA</sub> ∈ R</span>&nbsp;·&nbsp;
    <span class="math">A<sub>TM</sub>, HALT<sub>TM</sub> ∈ RE ∖ R</span>&nbsp;·&nbsp;
    <span class="math">E<sub>TM</sub> ∈ coRE ∖ R</span>&nbsp;·&nbsp;
    <span class="math">REG<sub>TM</sub>, EQ<sub>TM</sub> ∉ RE ∪ coRE</span>.</div>
</section>
</script>
<script>
/* ===================== מודלים חישוביים — מרכז הכנה למבחן ===================== */
(function () {
'use strict';

const SUMS  = JSON.parse(document.getElementById('d-summaries').textContent);
const QUIZ  = JSON.parse(document.getElementById('d-quiz').textContent);
const EXAMS = JSON.parse(document.getElementById('d-exams').textContent);
const LANGB = JSON.parse(document.getElementById('d-langbank').textContent);
const DEFS  = document.getElementById('d-defs').textContent;
const TAX   = {"subjects":[{"id":"automata","he":"אוטומטים סופיים (DFA/NFA)"},{"id":"regex","he":"ביטויים רגולריים"},{"id":"minimize","he":"מינימיזציה ומצבים שקולים"},{"id":"pump-reg","he":"למת הניפוח — רגולריות"},{"id":"closure","he":"תכונות סגור ובניות"},{"id":"cfg","he":"דקדוקים חסרי הקשר"},{"id":"pda","he":"אוטומטי מחסנית"},{"id":"pump-cfl","he":"למת הניפוח — חסרות הקשר"},{"id":"tm","he":"מכונות טיורינג"},{"id":"r-re-core","he":"R / RE / coRE"},{"id":"reduction","he":"רדוקציות ואי־כריעות"},{"id":"rice","he":"משפט רייס"}],"qtypes":[{"id":"construction","he":"בנייה"},{"id":"proof","he":"הוכחה"},{"id":"pumping","he":"ניפוח"},{"id":"r-re-core","he":"סיווג R/RE/coRE"},{"id":"claim","he":"הוכח או הפרך"},{"id":"reduction","he":"רדוקציה"},{"id":"short","he":"סעיף סגור"},{"id":"open","he":"שאלה פתוחה"}]};

const KEY = 'cm-prep-v1';
const byId = {}; SUMS.forEach(s => byId[s.sid] = s);
const quizBy = {}; QUIZ.forEach(q => quizBy[q.sid] = q);
const examBy = {}; EXAMS.forEach(e => examBy[e.id] = e);

/* מאגר השאלות: כל סעיף מתויג, מכל המבחנים, בסדר הופעה קבוע */
const BANK = [];
EXAMS.forEach(e => e.questions.forEach(q => q.parts.forEach(p => {
  if(p.tags && p.tags.subj) BANK.push({ e, q, p, key: e.id + '|' + p.pid });
})));
const subjHe = id => (TAX.subjects.find(s => s.id === id) || {}).he || id;
const qtHe   = id => (TAX.qtypes.find(t => t.id === id) || {}).he || id;

/* ---------- state ---------- */
const DEF = { read:{}, understood:{}, topics:{}, tread:{}, exams:{}, bank:{}, lang:{}, cp:{}, master:false, notes:'', examDate:'', lastView:'dash', updatedAt:0, mt:{} };
let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if(!raw) return structuredClone(DEF);
    const s = Object.assign(structuredClone(DEF), JSON.parse(raw));
    if(!s.mt || typeof s.mt !== 'object') s.mt = {};
    return s; }
  catch(e){ return structuredClone(DEF); }
}
/* ---------- חותמת זמן פר־פריט ----------
   בלי זה הסנכרון היה "המכשיר האחרון ששמר דורס את הכול", ולכן התקדמות
   נעלמה. עכשיו כל סימון נושא / קריאה / תשובה נושא חותמת זמן משלו,
   והמיזוג מכריע לכל פריט בנפרד מי החדש יותר.                          */
const akey = (eid,pid) => 'a:'+eid+'|'+pid;
function touch(){ const n = Date.now();
  for(const k of arguments) if(k) S.mt[k] = n; }
function touchExam(eid, answers){
  touch('e:'+eid);
  if(answers){ const n = Date.now(); Object.keys(answers).forEach(pid => S.mt[akey(eid,pid)] = n); }
}
let saveT;
function writeLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('שגיאה בשמירה מקומית — ייתכן שהאחסון מלא','e'); return false; } }
/* שמירה מקומית בלבד — להעדפות תצוגה (לשונית אחרונה וכד'). לא מזיזה את
   updatedAt ולא דוחפת לענן, כדי שמכשיר ישן שרק דפדפו בו לא ייראה
   "חדש יותר" מהענן וידרוס התקדמות אמיתית.                             */
function saveLocal(){ clearTimeout(saveT); saveT = setTimeout(writeLocal, 150); }
function save(){ S.updatedAt = Date.now(); clearTimeout(saveT);
  saveT = setTimeout(()=>{ writeLocal(); cloudPush(); }, 150); }
function saveNow(){ S.updatedAt = Date.now(); clearTimeout(saveT); writeLocal(); cloudPush(); }

/* ---------- helpers ---------- */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => `<span class="num">${n}</span>`;
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
function htmlToText(h){
  const d = document.createElement('div'); d.innerHTML = h;
  d.querySelectorAll('pre').forEach(p => p.replaceWith(document.createTextNode('\n```\n'+p.textContent.replace(/\n+$/,'')+'\n```\n')));
  d.querySelectorAll('br').forEach(b => b.replaceWith(document.createTextNode('\n')));
  d.querySelectorAll('li').forEach(li => li.prepend(document.createTextNode('- ')));
  d.querySelectorAll('tr').forEach(tr => {
    const cells = Array.from(tr.children).map(c => c.textContent.trim());
    tr.replaceWith(document.createTextNode('| ' + cells.join(' | ') + ' |\n'));
  });
  d.querySelectorAll('p,div,h1,h2,h3,h4,ul,ol').forEach(p => p.append(document.createTextNode('\n')));
  return d.textContent.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast'+(kind?' '+kind:'');
  t.textContent = msg;
  Object.assign(t.style,{position:'fixed',insetInlineStart:'50%',transform:'translateX(-50%)',bottom:'26px',
    background: kind==='e' ? '#a32626' : '#3b2a75', color:'#fff', padding:'11px 20px', borderRadius:'10px',
    zIndex:200, boxShadow:'0 8px 28px rgba(0,0,0,.28)', fontWeight:'650', maxWidth:'90vw'});
  document.body.appendChild(t); setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0';
    setTimeout(()=>t.remove(), 420); }, 2600);
}
function download(name, text){
  const b = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const u = URL.createObjectURL(b); const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 500);
}
const tkey = (sid,i) => sid+'|'+i;

/* הסימון על נושא פירושו "הגעתי לפה", לא "סיימתי אותו". לכן ההתקדמות היא מה
   שנמצא *מאחורי* הנושא המסומן הרחוק ביותר: הגעת לנושא 3 ⇒ עברת 2. סימון הפרק
   כולו כנקרא הוא הדבר היחיד שסוגר 100%, אחרת אי אפשר היה להגיע לשם.        */
function furthestMark(sid){
  const s = byId[sid]; if(!s) return -1;
  let f = -1;
  s.topics.forEach((_,i)=>{ if(S.tread[tkey(sid,i)]) f = i; });
  return f;
}
function readPos(sid){
  const s = byId[sid]; if(!s) return 0;
  if(S.read[sid]) return s.topics.length;
  return Math.max(0, furthestMark(sid));
}

/* ---------- progress ---------- */
function stats(){
  const nS = SUMS.length;
  const read = SUMS.filter(s=>S.read[s.sid]).length;
  const und  = SUMS.filter(s=>S.understood[s.sid]).length;
  let nT=0, dT=0, dR=0;
  SUMS.forEach(s=>{ dR += readPos(s.sid);
    s.topics.forEach((_,i)=>{ nT++;
      if(S.topics[tkey(s.sid,i)]?.done) dT++; }); });
  const nE = EXAMS.length, dE = EXAMS.filter(e=>S.exams[e.id]?.done).length;
  const nB = BANK.length,  dB = BANK.filter(b=>S.bank[b.key]?.done).length;
  const nL = LANGB.length, dL = LANGB.filter(l=>S.lang[l.id]?.ok).length;
  /* סימוני "הגעתי לפה" לא נספרים במד הכללי בכוונה: קריאה כבר מיוצגת
     ע"י שתי הסימונים של הפרק, וספירה נוספת של 134 נושאים הייתה מנפחת את האחוז
     מקריאה בלבד — על חשבון בחנים, מבחנים ותרגול. dR מוחזר לתצוגה בלבד.        */
  const total = read+und+dT+dE+dB+dL, max = nS+nS+nT+nE+nB+nL;
  return {nS,read,und,nT,dT,dR,nE,dE,nB,dB,nL,dL,overall:pct(total,max)};
}
function refreshChrome(){
  const st = stats();
  $('#mini-bar i').style.width = st.overall+'%';
  $('#mini-pct').innerHTML = st.overall+'%';
  $('#tb-sum').innerHTML  = `${st.read}/${st.nS}`;
  $('#tb-top').innerHTML  = `${st.dT}/${st.nT}`;
  $('#tb-exam').innerHTML = `${st.dE}/${st.nE}`;
  const tb = $('#tb-bank'); if(tb) tb.innerHTML = `${st.dB}/${st.nB}`;
}

/* ===================== views ===================== */
const views = {};

/* ---------- Dashboard ---------- */
views.dash = () => {
  const st = stats();
  const weak = [];
  SUMS.forEach(s=>s.topics.forEach((t,i)=>{ const r=S.topics[tkey(s.sid,i)];
    if(r && !r.done && r.tries) weak.push({sid:s.sid,i,t,score:r.score,tries:r.tries}); }));
  const nextS = SUMS.find(s=>!S.read[s.sid]);
  const nextT = (()=>{ for(const s of SUMS) for(let i=0;i<s.topics.length;i++)
      if(!S.topics[tkey(s.sid,i)]?.done) return {s,i}; return null; })();
  const nextE = EXAMS.find(e=>!S.exams[e.id]?.done);
  const nextB = BANK.find(b=>!S.bank[b.key]?.done);
  /* הצ'קפוינט שנגעו בו לאחרונה — "המשך מהמקום שעצרת" */
  const lastCp = Object.keys(S.cp||{})
    .filter(sid=>byId[sid] && S.cp[sid] && S.cp[sid].p > 1)
    .sort((a,b)=>(S.mt['p:'+b]||0)-(S.mt['p:'+a]||0))
    .map(sid=>({sid, cp:S.cp[sid]}))[0];
  let days = '', dcls='';
  if(S.examDate){ const d = Math.ceil((new Date(S.examDate+'T08:00') - new Date())/864e5);
    days = d>0 ? d : (d===0?0:d); dcls = d<0?'עבר':'ימים'; }

  return `
  <div class="grid g3" style="margin-bottom:16px">
    ${statCard('פרקים שנקראו', st.read, st.nS)}
    ${statCard('פרקים שהובנו', st.und, st.nS, true)}
    ${statCard('נושאים מאחוריך', st.dR, st.nT)}
    ${statCard('נושאים שהובנו', st.dT, st.nT, true)}
    ${statCard('מבחנים שהוכנו', st.dE, st.nE)}
    ${statCard('שאלות מהמאגר שתורגלו', st.dB, st.nB, true)}
    ${statCard('שפות שסווגו נכון', st.dL, st.nL)}
  </div>

  <div class="card countdown" style="margin-bottom:18px">
    <div>
      <div class="big">${S.examDate ? (typeof days==='number'&&days>=0 ? num(days) : '—') : '—'}</div>
