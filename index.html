  cursor:pointer;color:var(--ink-2);transition:background .12s,border-color .12s}

.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.fchip .cnt{opacity:.75;font-size:.78em;margin-inline-start:4px}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-bottom:16px}
.subj-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;
  transition:border-color .12s, box-shadow .12s}
.subj-cell:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.subj-cell.on{border-color:var(--brand);outline:2px solid var(--brand-lt)}
.subj-cell .sk{font-size:.85rem;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.subj-cell .sk .num{color:var(--ink-2);font-weight:600;font-size:.8rem}
.subj-cell .bar{margin-top:7px}
.bq-card{margin-bottom:14px}
.bq-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bq-head .exlbl{font-weight:800;color:var(--brand-dk);font-size:.86rem;background:var(--brand-pale);
  border:1px solid var(--brand-lt);border-radius:7px;padding:2px 9px}
.bq-ctx{margin:8px 0;border:1px dashed var(--line);border-radius:9px;padding:9px 13px;background:#fcfcfe}
.bq-ctx>summary{cursor:pointer;font-weight:700;color:var(--ink-2);font-size:.87rem}
.bq-ctx[open]>summary{margin-bottom:7px}

/* ===== דריל שפות (drill) ===== */
.drill-wrap{max-width:760px;margin:0 auto}
.drill-lang{direction:ltr;text-align:center;font-size:clamp(1.05rem,2.6vw,1.45rem);padding:26px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin:14px 0;min-height:110px;display:grid;place-items:center;unicode-bidi:isolate;overflow-x:auto}
.drill-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.dbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:15px 10px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:border-color .12s, background .12s;min-height:58px}
.dbtn:hover{border-color:var(--brand)}
.dbtn.hit{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dbtn.miss{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.dbtn.dim{opacity:.45}
.dbtn:disabled{cursor:default}
.drill-fb{text-align:center;min-height:34px;font-weight:700}
.drill-fb .src{font-weight:600;color:var(--ink-2);font-size:.85rem}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--brand-dk)}
@media(max-width:560px){ .drill-btns{grid-template-columns:1fr} .dbtn{min-height:48px} }

/* ===== מצב ערבוב (shuffle) ===== */
.shuf-wrap{max-width:860px;margin:0 auto}
.shuf-prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shuf-acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.shuf-acts .btn{min-width:120px}

<script type="application/json" id="d-summaries">[{"sid":"ch1","group":"פרקים","title":"פרק 1 — מבוא: מילים, שפות ו־DFA","topics":["מה זה מודל חישובי ומה נלמד בקורס","אלף־בית, מילים ופעולות על מילים","שפות ופעולות על שפות"],"html":"<h1>מבוא: מילים, שפות ו־DFA<\/h1>\n<p class=\"chapter-subtitle\">מודלים חישוביים — פרק 1 (הרצאה 1 + תרגול 1)<\/p>\n\n<section>\n  <h2 id=\"ch1-t0\">מה זה מודל חישובי ומה נלמד בקורס<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">מודל חישובי<\/span> — הגדרה מתמטית מדויקת של \"מכונה\" שמבצעת חישוב.\n    במקום לדבר על מחשב פיזי, מגדירים אובייקט פורמלי (קבוצות ופונקציות) ושואלים:\n    <b>אילו בעיות המודל הזה מסוגל לפתור, ואילו לא?<\/b>\n  <\/div>\n\n  <p>הקורס בנוי כסולם של מודלים, מהחלש אל החזק:<\/p>\n  <div class=\"hier\">\n    <div class=\"ring\"><span class=\"hlbl\">מכונות טיורינג — R, RE<\/span>\n      <div class=\"ring\"><span class=\"hlbl\">אוטומטי מחסנית — שפות חסרות הקשר (CFL)<\/span>\n        <div class=\"ring\"><span class=\"hlbl\">אוטומטים סופיים — שפות רגולריות<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <ul>\n    <li><b>שפות רגולריות<\/b> — מה שאפשר לזהות עם זיכרון סופי קבוע: <span class=\"en\">DFA<\/span>‏, <span class=\"en\">NFA<\/span>‏, ביטויים רגולריים, מינימיזציה, ולמת הניפוח שמוכיחה מתי שפה <em>איננה<\/em> רגולרית.<\/li>\n    <li><b>שפות חסרות הקשר<\/b> — מה שאפשר לזהות עם מחסנית: דקדוקים (<span class=\"en\">CFG<\/span>‏), אוטומטי מחסנית (<span class=\"en\">PDA<\/span>‏), ולמת ניפוח משלהן.<\/li>\n    <li><b>חישוביות<\/b> — מכונות טיורינג, ההבדל בין <b>כריע<\/b> (<span class=\"en\">R<\/span>‏) ל<b>ניתן לזיהוי<\/b> (<span class=\"en\">RE<\/span>‏), רדוקציות, ומשפט רייס — הגבול העקרוני של מה שמחשב יכול להכריע.<\/li>\n  <\/ul>\n\n  <div class=\"note\"><b>נקודת מבט שחוזרת בכל המבחן:<\/b> כל נושא בקורס עונה על אחת משתי שאלות —\n    <b>איך בונים<\/b> מזהה לשפה (בנייה\/המרה), או <b>איך מוכיחים שאי־אפשר<\/b>\n    (למות ניפוח, רדוקציות, משפט רייס). כמעט כל סעיף במבחן הוא אחת מהשתיים.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t1\">אלף־בית, מילים ופעולות על מילים<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">אלף־בית (Σ)<\/span> — קבוצה סופית ולא ריקה של סימנים. למשל\n    <span class=\"math\">Σ = {a, b}<\/span> או <span class=\"math\">Σ = {0, 1}<\/span>.<br>\n    <span class=\"term\">מילה (word\/string)<\/span> — סדרה סופית של סימנים מ־<span class=\"math\">Σ<\/span>.\n    <span class=\"term\">המילה הריקה<\/span> מסומנת <span class=\"math\">ε<\/span> ואורכה\n    <span class=\"math\">|ε| = 0<\/span>.<br>\n    <span class=\"term\">Σ<sup>*<\/sup><\/span> — קבוצת <em>כל<\/em> המילים הסופיות מעל\n    <span class=\"math\">Σ<\/span>, כולל <span class=\"math\">ε<\/span>;\n    <span class=\"math\">Σ<sup>+<\/sup> = Σ<sup>*<\/sup> ∖ {ε}<\/span>.\n  <\/div>\n\n  <p>פעולות בסיסיות על מילים:<\/p>\n  <ul>\n    <li><b>שרשור<\/b> — <span class=\"math\">u·v<\/span> (או פשוט <span class=\"math\">uv<\/span>): כותבים את <span class=\"math\">v<\/span> אחרי <span class=\"math\">u<\/span>. מתקיים <span class=\"math\">|uv| = |u| + |v|<\/span>, ו־<span class=\"math\">ε<\/span> הוא איבר היחידה: <span class=\"math\">εw = wε = w<\/span>.<\/li>\n    <li><b>חזקה<\/b> — <span class=\"math\">w<sup>k<\/sup><\/span>: שרשור של <span class=\"math\">w<\/span> עם עצמה <span class=\"math\">k<\/span> פעמים; <span class=\"math\">w<sup>0<\/sup> = ε<\/span>.<\/li>\n    <li><b>היפוך<\/b> — <span class=\"math\">w<sup>R<\/sup><\/span>: המילה בסדר הפוך. מילה עם <span class=\"math\">w = w<sup>R<\/sup><\/span> נקראת <b>פלינדרום<\/b>.<\/li>\n    <li><b>מספרי מופעים<\/b> — <span class=\"math\">#<sub>a<\/sub>(w)<\/span>: כמה פעמים האות <span class=\"math\">a<\/span> מופיעה ב־<span class=\"math\">w<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה<\/h4>\n    <p>עבור <span class=\"math\">u = ab<\/span>, <span class=\"math\">v = ba<\/span>‏:\n      <span class=\"math\">uv = abba<\/span>,&nbsp;\n      <span class=\"math\">(uv)<sup>R<\/sup> = abba<\/span> (פלינדרום!),&nbsp;\n      <span class=\"math\">u<sup>2<\/sup> = abab<\/span>,&nbsp;\n      <span class=\"math\">#<sub>a<\/sub>(uv) = 2<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"warn\">אל תבלבלו בין <span class=\"math\">ε<\/span> (מילה ריקה, אורך 0) לבין\n    <span class=\"math\">∅<\/span> (שפה ריקה — קבוצה בלי אף מילה). מתקיים\n    <span class=\"math\">{ε} ≠ ∅<\/span>: השפה <span class=\"math\">{ε}<\/span> מכילה מילה אחת.<\/div>\n<\/section>\n\n<section>\n  <h2 id=\"ch1-t2\">שפות ופעולות על שפות<\/h2>\n\n  <div class=\"def\">\n    <span class=\"term\">שפה (Language)<\/span> — תת־קבוצה כלשהי\n    <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span>. שפה יכולה להיות סופית, אינסופית, ריקה\n    (<span class=\"math\">∅<\/span>) או כל <span class=\"math\">Σ<sup>*<\/sup><\/span> כולה.\n  <\/div>\n\n  <p>שפות מוגדרות בדרך כלל בכתיב בונה־קבוצות. למשל:<\/p>\n  <div class=\"lang-def\">L₁ = {w ∈ {a,b}<sup>*<\/sup> | #<sub>a<\/sub>(w) = #<sub>b<\/sub>(w)}<\/div>\n\n  <p>פעולות על שפות (שפות הן קבוצות — כל פעולות הקבוצות עובדות, ועוד שתיים מיוחדות):<\/p>\n  <ul>\n    <li><b>איחוד \/ חיתוך \/ משלים<\/b> — <span class=\"math\">L<sub>1<\/sub> ∪ L<sub>2<\/sub><\/span>,\n      <span class=\"math\">L<sub>1<\/sub> ∩ L<sub>2<\/sub><\/span>,\n      <span class=\"math\"><span class=\"comp\">L<\/span> = Σ<sup>*<\/sup> ∖ L<\/span>.<\/li>\n    <li><b>שרשור שפות<\/b> — <span class=\"math\">L<sub>1<\/sub>·L<sub>2<\/sub> = {uv | u ∈ L<sub>1<\/sub>, v ∈ L<sub>2<\/sub>}<\/span>.<\/li>\n    <li><b>חזקה<\/b> — <span class=\"math\">L<sup>k<\/sup><\/span>: שרשור השפה עם עצמה <span class=\"math\">k<\/span> פעמים; <span class=\"math\">L<sup>0<\/sup> = {ε}<\/span>.<\/li>\n    <li><b>כוכב (סגור קלין)<\/b> — <span class=\"math\">L<sup>*<\/sup> = ⋃<sub>k≥0<\/sub> L<sup>k<\/sup><\/span>: כל שרשור סופי (גם ריק) של מילים מהשפה.<\/li>\n    <li><b>היפוך<\/b> — <span class=\"math\">L<sup>R<\/sup> = {w<sup>R<\/sup> | w ∈ L}<\/span>.<\/li>\n  <\/ul>\n\n  <div class=\"ex-box\">\n    <h4>דוגמה — כוכב של שפה קטנה<\/h4>\n    <p><span class=\"math\">L = {ab, ba}<\/span>‏:&nbsp;\n      <span class=\"math\">L<sup>*<\/sup><\/span> מכילה את\n      <span class=\"math\">ε, ab, ba, abab, abba, baab, baba, …<\/span>&nbsp;\n      אבל <em>לא<\/em> את <span class=\"math\">a<\/span> או <span class=\"math\">aab<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"note\"><b>שימו לב:<\/b> <span class=\"math\">∅<sup>*<\/sup> = {ε}<\/span> —\n    השרשור הריק תמיד קיים. זו נקודה שחוזרת בהמרות של ביטויים רגולריים\n    (<span class=\"en\">GNFA<\/span>‏) ובשאלות \"נכון\/לא נכון\".<\/div>\n<\/section>\n"}]</script>
<script type="application/json" id="d-quiz">[{"sid":"ch1","topics":[{"t":"מה זה מודל חישובי ומה נלמד בקורס","q":[{"q":"מהו סדר ההכלה הנכון בין מחלקות השפות שנלמדות בקורס?","c":["כל המחלקות שוות — ההבדל הוא רק בדרך ההגדרה","שפות רגולריות ⊂ שפות חסרות הקשר ⊂ שפות כריעות","שפות חסרות הקשר ⊂ שפות רגולריות ⊂ שפות כריעות","שפות כריעות ⊂ שפות רגולריות ⊂ שפות חסרות הקשר"],"e":"הסולם של הקורס: אוטומט סופי (זיכרון קבוע) ⊂ אוטומט מחסנית (מחסנית) ⊂ מכונת טיורינג (סרט אינסופי). כל מודל חזק ממש מקודמו — למשל <span class=\"math\">{aⁿbⁿ}<\/span> חסרת הקשר אך לא רגולרית.","a":1},{"q":"מהן שתי \"תבניות העל\" של שאלות המבחן בקורס, כפי שמופיעות כמעט בכל סעיף?","c":["חישוב סיבוכיות זמן, וכתיבת קוד יעיל","שרטוט גרפים, וחישוב הסתברויות","פישוט ביטויים בוליאניים, וטבלאות אמת","בנייה של מזהה לשפה, והוכחה ששפה לא שייכת למחלקה"],"e":"כל נושא מציע כלי בנייה (DFA\/NFA\/רגקס\/CFG\/PDA\/TM והמרות ביניהם) וכלי אי־אפשרות (למות ניפוח, רדוקציות, משפט רייס). סיבוכיות (NP וכו') כלל לא נלמדת בקורס הזה.","a":3},{"q":"מדוע מגדירים \"מודל חישובי\" כאובייקט מתמטי (קבוצות ופונקציות) ולא כמחשב ממשי?","c":["כדי לחסוך זיכרון בזמן הסימולציה","כדי שאפשר יהיה להוכיח טענות מדויקות על גבולות היכולת של המודל","כי מחשבים אמיתיים איטיים מדי לניסויים","כי לא היו מחשבים כשהומצאה התורה — היום ההגדרות מיושנות"],"e":"רק על הגדרה פורמלית אפשר להוכיח משפטים כמו \"אף אוטומט סופי לא מזהה את <span class=\"math\">{aⁿbⁿ}<\/span>\" או \"בעיית העצירה אינה כריעה\" — טענות על <b>כל<\/b> מכונה אפשרית, לא על מימוש מסוים.","a":1}]},{"t":"אלף־בית, מילים ופעולות על מילים","q":[{"q":"מה ההבדל בין <span class=\"math\">ε<\/span> לבין <span class=\"math\">∅<\/span>?","c":["<span class=\"math\">ε<\/span> היא שפה ריקה; <span class=\"math\">∅<\/span> היא מילה ריקה","<span class=\"math\">∅<\/span> היא המילה הקצרה ביותר בכל שפה","<span class=\"math\">ε<\/span> היא מילה באורך 0; <span class=\"math\">∅<\/span> היא שפה שאין בה אף מילה","אין הבדל — שני סימונים לאותו דבר"],"e":"<span class=\"math\">ε<\/span> — מילה (אורך 0). <span class=\"math\">∅<\/span> — קבוצה ריקה של מילים. לכן <span class=\"math\">{ε} ≠ ∅<\/span>: בשפה <span class=\"math\">{ε}<\/span> יש מילה אחת.","a":2},{"q":"עבור <span class=\"math\">w = aab<\/span>, מהי המילה <span class=\"math\">w<sup>R<\/sup>w<\/span>?","c":["<span class=\"math\">baaaab<\/span>","<span class=\"math\">aabbaa<\/span>","<span class=\"math\">baabaa<\/span>","<span class=\"math\">aabaab<\/span>"],"e":"<span class=\"math\">w<sup>R<\/sup> = baa<\/span>, ואז משרשרים: <span class=\"math\">w<sup>R<\/sup>·w = baa·aab = baaaab<\/span>. שימו לב שהתוצאה פלינדרום — <span class=\"math\">w<sup>R<\/sup>w<\/span> תמיד פלינדרום באורך זוגי.","a":0},{"q":"כמה מילים באורך בדיוק <span class=\"math\">k<\/span> יש מעל אלף־בית בגודל <span class=\"math\">|Σ| = n<\/span>?","c":["<span class=\"math\">n·k<\/span>","אינסוף","<span class=\"math\">n<sup>k<\/sup><\/span>","<span class=\"math\">k<sup>n<\/sup><\/span>"],"e":"בכל אחת מ־<span class=\"math\">k<\/span> העמדות בוחרים אות אחת מתוך <span class=\"math\">n<\/span> — סה\"כ <span class=\"math\">n<sup>k<\/sup><\/span>. לכן <span class=\"math\">Σ<sup>*<\/sup><\/span> אינסופית אך <b>בת מנייה<\/b> — עובדה שחוזרת בפרק החישוביות.","a":2}]},{"t":"שפות ופעולות על שפות","q":[{"q":"מהי <span class=\"math\">∅<sup>*<\/sup><\/span>?","c":["<span class=\"math\">∅<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span>","לא מוגדר","<span class=\"math\">{ε}<\/span>"],"e":"<span class=\"math\">L<sup>*<\/sup> = ⋃<sub>k≥0<\/sub> L<sup>k<\/sup><\/span> ותמיד <span class=\"math\">L<sup>0<\/sup> = {ε}<\/span> — שרשור של אפס מילים. לכן גם לשפה הריקה: <span class=\"math\">∅<sup>*<\/sup> = {ε}<\/span>. זו נקודה קבועה בהמרות GNFA.","a":3},{"q":"עבור <span class=\"math\">L = {ab, ba}<\/span>, איזו מילה <b>אינה<\/b> שייכת ל־<span class=\"math\">L<sup>*<\/sup><\/span>?","c":["<span class=\"math\">baba<\/span>","<span class=\"math\">aab<\/span>","<span class=\"math\">abba<\/span>","<span class=\"math\">ε<\/span>"],"e":"מילה ב־<span class=\"math\">L<sup>*<\/sup><\/span> היא שרשור בלוקים של <span class=\"math\">ab<\/span> או <span class=\"math\">ba<\/span> — תמיד באורך זוגי. <span class=\"math\">aab<\/span> באורך 3, ולכן לא בשפה. השאר: <span class=\"math\">abba = ab·ba<\/span>, <span class=\"math\">ε<\/span> (אפס בלוקים), <span class=\"math\">baba = ba·ba<\/span>.","a":1},{"q":"מהי השפה <span class=\"math\">L·∅<\/span> עבור שפה <span class=\"math\">L<\/span> כלשהי?","c":["<span class=\"math\">L<\/span>","<span class=\"math\">{ε}<\/span>","<span class=\"math\">Σ<sup>*<\/sup><\/span>","<span class=\"math\">∅<\/span>"],"e":"שרשור דורש לבחור מילה מכל אחת מהשפות: <span class=\"math\">L·∅ = {uv | u∈L, v∈∅}<\/span> — אין אף <span class=\"math\">v<\/span> לבחור, לכן התוצאה ריקה. לעומת זאת <span class=\"math\">L·{ε} = L<\/span>. אלו שני המקרים שהכי מתבלבלים ביניהם.","a":3}]}]}]</script>
<script type="application/json" id="d-exams">[{"id":"2023a","year":2023,"moed":"א","label":"2023 — מועד א'","lang":"he","combined":false,"meta":{"date":"אביב 2023","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן."},"questions":[{"n":"1","heading":"שאלה 1 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">עבור מחרוזת <span class=\"math\">w ∈ Σ<sup>*<\/sup><\/span> כך ש-<span class=\"math\">a ∈ Σ<\/span>, נגדיר <span class=\"math\">Drop_all_a(w)<\/span> להיות שווה למחרוזת <span class=\"math\">w<\/span> לאחר שהסרנו ממנה את כל המופעים של <span class=\"math\">\"a\"<\/span>.<\/p><p dir=\"auto\">לדוגמה: <span class=\"math\">Drop_all_a(aab) = b<\/span> ו-<span class=\"math\">Drop_all_a(aa) = ε<\/span>.<\/p><p dir=\"auto\">עבור שפה <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> כך ש-<span class=\"math\">a ∈ Σ<\/span>, נגדיר <span class=\"math\">Drop_all_a(L) = {Drop_all_a(w) | w ∈ L}<\/span>. לדוגמה: <span class=\"math\">Drop_all_a({aab, aa}) = {b, ε}<\/span>.<\/p><p dir=\"auto\">עבור <span class=\"en\">DFA<\/span>‏ <span class=\"math\">D = (Q_D, Σ_D, δ_D, q_{sD}, F_D)<\/span> ועבור <span class=\"math\">p, q ∈ Q_D<\/span>, נגדיר <span class=\"math\">L<sup>D<\/sup><sub>p,q<\/sub> = {w | δ′_D(p,w) = q}<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\">בהינתן <span class=\"en\">DFA<\/span>‏ <span class=\"math\">A = (Q, Σ, δ_A, q_s, F)<\/span>, כך ש-<span class=\"math\">Σ = {a,b,c}<\/span>.<\/p><p dir=\"auto\"><b>בנו <span class=\"en\">DFA<\/span>‏<\/b> <span class=\"math\">B = (Q, Σ, δ_B, q_s, F)<\/span> כך ש-<span class=\"math\">∀w ∈ Σ<sup>*<\/sup><\/span> ולכל <span class=\"math\">p, q ∈ Q<\/span> מתקיים ש-<span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,q<\/sub><\/span> אם ורק אם <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span>.<\/p><p dir=\"auto\">כלומר, עליכם לשנות את <span class=\"math\">δ_A<\/span> ל-<span class=\"math\">δ_B<\/span>. שימו לב של-<span class=\"math\">A<\/span> ול-<span class=\"math\">B<\/span> יש את אותה ה-<span class=\"math\">Σ<\/span> ואת אותם מצבים (כולל המצב ההתחלתי והמצבים המקבלים).<\/p><p dir=\"auto\">הראו את הבנייה יחד עם הסבר. אתם לא צריכים להראות הוכחת נכונות.<\/p>","tags":{"subj":"automata","qt":"construction"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L<\/span> שפה רגולרית מעל <span class=\"math\">Σ = {a,b,c}<\/span>. תהי:<\/p><div class=\"lang-def\">L′ = {w | w · Drop_all_a(w) ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">L′<\/span> היא שפה רגולרית.<\/p><p dir=\"auto\" class=\"small\"><b>רמז:<\/b> השתמשו בשאלה הקודמת (אתם רשאים להשתמש בשאלה הקודמת גם אם לא פתרתם אותה).<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">עבור שפה <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> כך ש-<span class=\"math\">a ∈ Σ<\/span>, נגדיר:<\/p><div class=\"lang-def\">Oper(L) = {w#Drop_all_a(w) | w ∈ L}<\/div><p dir=\"auto\">תהי <span class=\"math\">L′ ⊆ {a,b}<sup>*<\/sup><\/span> שפה רגולרית ויהי <span class=\"math\">A = (Q_A, Σ_A, δ_A, q_{sA}, F_A)<\/span> ‏<span class=\"en\">DFA<\/span>‏ כך ש-<span class=\"math\">L(A) = L′<\/span>.<\/p><p dir=\"auto\"><b>הראו<\/b> ש-<span class=\"math\">Oper(L′)<\/span> היא שפה חסרת הקשר ע\"י <b>בנייה של <span class=\"en\">PDA<\/span>‏<\/b> <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F)<\/span>, שמתבסס על <span class=\"math\">A<\/span>, כך ש-<span class=\"math\">L(P) = Oper(L′)<\/span>.<\/p><p dir=\"auto\">כלומר, הגדירו כל אחד מהרכיבים של השישייה של <span class=\"math\">P<\/span> בהתבסס על החמישייה של <span class=\"math\">A<\/span>.<\/p>","tags":{"subj":"pda","qt":"construction"}},{"pid":"q1d","label":"4","kind":"open","rows":12,"prompt":"<p dir=\"auto\"><b>הראו שפה<\/b> <span class=\"math\">L ⊆ {a,b}<sup>*<\/sup><\/span> שהיא שפה חסרת הקשר, עבורה <span class=\"math\">Oper(L)<\/span> <b>איננה<\/b> שפה חסרת הקשר.<\/p><p dir=\"auto\">הוכיחו את תשובתכם בעזרת שימוש ב<b>למת הניפוח לשפות חסרות הקשר<\/b>.<\/p>","tags":{"subj":"pump-cfl","qt":"pumping"}}]},{"n":"2","heading":"שאלה 2 (30 נקודות)","points":30,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, D⟩ | M is a TM, D is a DFA, L(D) ≠ ∅ and L(M) ⊆ L(D) ∘ L(D)}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 6 נקודות)","points":30,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":5,"prompt":"<p dir=\"auto\"><b>בנו דקדוק חסר הקשר<\/b> לשפה הבאה:<\/p><div class=\"lang-def\">L = {a<sup>i<\/sup>b<sup>j<\/sup> | (i+j) mod 3 = 0}<\/div>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3b","label":"2","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">A<\/span> ‏<span class=\"en\">DFA<\/span>‏ עם <span class=\"math\">n<\/span> מחלקות שקילות על המצבים של <span class=\"math\">A<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> אם קיימת מילה <span class=\"math\">w ∈ L(A)<\/span> כך ש-<span class=\"math\">|w| = n<\/span> אזי <span class=\"math\">L(A)<\/span> היא שפה אינסופית.<\/p>","tags":{"subj":"minimize","qt":"claim"}},{"pid":"q3c","label":"3","kind":"open","rows":6,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L<\/span> שפה חסרת הקשר ויהי <span class=\"math\">G = (V, Σ, S, R)<\/span> דקדוק חסר הקשר כך ש-<span class=\"math\">L(G) = L<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> אם <span class=\"math\">w ∈ L<\/span> ו-<span class=\"math\">|w| &gt; |V|<\/span> אזי <span class=\"math\">L<\/span> שפה אינסופית.<\/p>","tags":{"subj":"cfg","qt":"claim"}},{"pid":"q3d","label":"4","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכח:<\/b> ‏<span class=\"math\">{a<sup>p+1<\/sup> | p is prime}<\/span> היא לא שפה חסרת הקשר.<\/p><p dir=\"auto\">אתם רשאים להשתמש בעובדה ש-<span class=\"math\">{a<sup>p<\/sup> | p is prime}<\/span> איננה שפה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q3e","label":"5","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">A<\/span> שפה סופית כלשהי ותהי <span class=\"math\">L = REG<sub>TM<\/sub> ∪ A<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> מתקיים ש-<span class=\"math\">REG<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span>, כלומר, קיימת רדוקציית מיפוי מ-<span class=\"math\">REG<sub>TM<\/sub><\/span> ל-<span class=\"math\">L<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3f","label":"6","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and ∃w ∈ Σ<sup>*<\/sup> s.t. M does not accept w}<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> לפי משפט <span class=\"en\">Rice<\/span>‏ השפה <span class=\"math\">L<\/span> איננה כריעה.<\/p>","tags":{"subj":"rice","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><b>Construction:<\/b><\/p>\n<ul>\n<li>For each transition <span class=\"math\">δ_A(q, σ) = p<\/span> in the transition function of <span class=\"math\">A<\/span> such that <span class=\"math\">σ ∈ {b, c}<\/span>, we add the same transition <span class=\"math\">δ_B(q, σ) = p<\/span> to <span class=\"math\">B<\/span>.<\/li>\n<li>For each <span class=\"math\">p ∈ Q<\/span>, we add the self-loop <span class=\"math\">δ_B(p, a) = p<\/span>.<\/li>\n<\/ul>\n<p><b>Explanation:<\/b> if <span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,q<\/sub><\/span> then every <span class=\"math\">a<\/span> in <span class=\"math\">w<\/span> keeps <span class=\"math\">B<\/span> in the same state (self-loop), so removing all the <span class=\"math\">a<\/span>'s leaves exactly the same path — and since the <span class=\"math\">b,c<\/span> transitions are unchanged, that path is also a path of <span class=\"math\">A<\/span>: <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span>.<\/p>\n<p>Conversely, if <span class=\"math\">Drop_all_a(w) = σ₁…σ_n ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span> then <span class=\"math\">w ∈ L(a<sup>*<\/sup>σ₁a<sup>*<\/sup>σ₂…a<sup>*<\/sup>σ_na<sup>*<\/sup>)<\/span>, and in <span class=\"math\">B<\/span> the same path exists where every state carries its own <span class=\"math\">a<\/span>-loop, so <span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,q<\/sub><\/span>.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L<\/span> is regular, so there exists a DFA <span class=\"math\">A = (Q, Σ, δ_A, q_s, F)<\/span> with <span class=\"math\">L(A) = L<\/span>. Let <span class=\"math\">B<\/span> be the automaton from the previous section (built from <span class=\"math\">A<\/span>).<\/p>\n<p>Note that <span class=\"math\">w ∈ L′<\/span> iff <span class=\"math\">∃p ∈ Q, ∃f ∈ F<\/span> such that <span class=\"math\">w ∈ L<sup>A<\/sup><sub>q_s,p<\/sub><\/span> and <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,f<\/sub><\/span> (the run on <span class=\"math\">w · Drop_all_a(w)<\/span> passes through some intermediate state <span class=\"math\">p<\/span>).<\/p>\n<p>From the previous question, <span class=\"math\">Drop_all_a(w) ∈ L<sup>A<\/sup><sub>p,f<\/sub><\/span> iff <span class=\"math\">w ∈ L<sup>B<\/sup><sub>p,f<\/sub><\/span>.<\/p>\n<p>Therefore:<\/p>\n<div class=\"lang-def\">L′ = ⋃<sub>p∈Q, f∈F<\/sub> (L<sup>A<\/sup><sub>q_s,p<\/sub> ∩ L<sup>B<\/sup><sub>p,f<\/sub>)<\/div>\n<p>Each <span class=\"math\">L<sup>A<\/sup><sub>q_s,p<\/sub><\/span> and <span class=\"math\">L<sup>B<\/sup><sub>p,f<\/sub><\/span> is regular (a DFA with adjusted initial\/accepting states), the intersection of two regular languages is regular, and a finite union of regular languages is regular — so <span class=\"math\">L′<\/span> is a regular language.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p>We define <span class=\"math\">Q_P = Q_A ⊎ {q_{sP}, s, f_P}<\/span>, <span class=\"math\">Σ_P = {a, b, #}<\/span>, <span class=\"math\">Γ_P = {b, $}<\/span>, <span class=\"math\">F = {f_P}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ_P(q_{sP}, ε, ε) = {(q_{sA}, $)}<\/span> — push a bottom marker and move to <span class=\"math\">A<\/span>'s initial state.<\/li>\n<li>For each transition <span class=\"math\">δ_A(p, b) = q<\/span>: add <span class=\"math\">δ_P(p, b, ε) = {(q, b)}<\/span> — simulate <span class=\"math\">A<\/span> and <b>push<\/b> every <span class=\"math\">b<\/span>.<\/li>\n<li>For each transition <span class=\"math\">δ_A(p, a) = q<\/span>: add <span class=\"math\">δ_P(p, a, ε) = {(q, ε)}<\/span> — simulate <span class=\"math\">A<\/span> without pushing (the <span class=\"math\">a<\/span>'s are dropped).<\/li>\n<li>For each <span class=\"math\">f_A ∈ F_A<\/span>: add <span class=\"math\">δ_P(f_A, #, ε) = {(s, ε)}<\/span> — after reading <span class=\"math\">w ∈ L′<\/span>, cross the <span class=\"math\">#<\/span>.<\/li>\n<li>Add <span class=\"math\">δ_P(s, b, b) = {(s, ε)}<\/span> and <span class=\"math\">δ_P(s, ε, $) = {(f_P, ε)}<\/span> — match the suffix against the pushed <span class=\"math\">b<\/span>'s and accept when the stack is empty.<\/li>\n<\/ul>\n<div class=\"note\" dir=\"rtl\"><b>שימו לב לדקות:<\/b> הבנייה הזו נכונה כי ב-<span class=\"math\">Σ = {a,b}<\/span> המחרוזת <span class=\"math\">Drop_all_a(w)<\/span> היא <span class=\"math\">b<sup>#_b(w)<\/sup><\/span> — כל ה-b-ים באותו סדר; לכן מספיק מונה במחסנית, למרות שהמחסנית הפוכה.<\/div>\n<\/div>"},{"ref":"q1d","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L = {b<sup>n<\/sup>a<sup>n<\/sup> | n ∈ ℕ}<\/span> — we saw that this is a context-free language.<\/p>\n<p><span class=\"math\">Oper(L) = {b<sup>n<\/sup>a<sup>n<\/sup>#b<sup>n<\/sup> | n ∈ ℕ}<\/span>. We prove with the pumping lemma for context-free languages that it is not context-free.<\/p>\n<p>Assume towards contradiction that <span class=\"math\">Oper(L)<\/span> is context-free; let <span class=\"math\">p<\/span> be the promised constant. Choose <span class=\"math\">w = b<sup>p<\/sup>a<sup>p<\/sup>#b<sup>p<\/sup> ∈ Oper(L)<\/span>, <span class=\"math\">|w| ≥ p<\/span>; so <span class=\"math\">w = uvxyz<\/span> satisfying the three conditions.<\/p>\n<p><b>Case 1 — <span class=\"math\">vy<\/span> homogeneous<\/b> (<span class=\"math\">v = b<sup>s<\/sup>, y = b<sup>t<\/sup><\/span> or <span class=\"math\">v = a<sup>s<\/sup>, y = a<sup>t<\/sup><\/span>, with <span class=\"math\">0 &lt; s+t ≤ p<\/span>): pumping up gives<\/p>\n<div class=\"lang-def\">w₂ = uv²xy²z ∈ {b<sup>p+s+t<\/sup>a<sup>p<\/sup>#b<sup>p<\/sup>,&nbsp; b<sup>p<\/sup>a<sup>p+s+t<\/sup>#b<sup>p<\/sup>,&nbsp; b<sup>p<\/sup>a<sup>p<\/sup>#b<sup>p+s+t<\/sup>}<\/div>\n<p>Since <span class=\"math\">s+t &gt; 0<\/span>, one block count differs from <span class=\"math\">p<\/span>, so <span class=\"math\">w₂ ∉ Oper(L)<\/span>.<\/p>\n<p><b>Case 2 — <span class=\"math\">vy<\/span> heterogeneous<\/b> (with <span class=\"math\">|vxy| ≤ p<\/span>, so <span class=\"math\">v, y<\/span> touch two adjacent blocks):<\/p>\n<ul>\n<li><span class=\"math\">vy = b<sup>s<\/sup>a<sup>t<\/sup><\/span> with <span class=\"math\">s, t ≠ 0<\/span>: <span class=\"math\">w₂ = b<sup>p+s<\/sup>a<sup>p+t<\/sup>#b<sup>p<\/sup><\/span> — both first blocks differ from the third, <span class=\"math\">w₂ ∉ Oper(L)<\/span>.<\/li>\n<li><span class=\"math\">vy = a<sup>s<\/sup>b<sup>t<\/sup><\/span> with <span class=\"math\">s, t ≠ 0<\/span>: <span class=\"math\">w₂ = b<sup>p<\/sup>a<sup>p+s<\/sup>#b<sup>p+t<\/sup><\/span> — again <span class=\"math\">w₂ ∉ Oper(L)<\/span>.<\/li>\n<\/ul>\n<p>Note: if <span class=\"math\">v<\/span> or <span class=\"math\">y<\/span> contained the <span class=\"math\">#<\/span>, then <span class=\"math\">w₂<\/span> would contain two <span class=\"math\">#<\/span>'s and again <span class=\"math\">w₂ ∉ Oper(L)<\/span>; therefore <span class=\"math\">x<\/span> contains the <span class=\"math\">#<\/span> in the heterogeneous case.<\/p>\n<p>All cases contradict condition 3 — so <span class=\"math\">Oper(L)<\/span> is not context-free.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ coRE<\/span> — בונים מזהה ל-<span class=\"math\"><span class=\"comp\">L<\/span><\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∈ coRE<\/span>:<\/b> note that<\/p>\n<div class=\"lang-def\"><span class=\"comp\">L<\/span> = {⟨M,D⟩ | M is a TM, D is a DFA, L(D) = ∅ or ∃w ∈ L(M) s.t. w ∉ L(D)·L(D)}<\/div>\n<p>We construct a recognizer <span class=\"math\">M_L<\/span> for <span class=\"math\"><span class=\"comp\">L<\/span><\/span>:<\/p>\n<pre>M_L: \"On input ⟨M, D⟩:\n1. If L(D) = ∅, accept   (E_DFA ∈ R).\n2. For i from 0 to ∞:\n   2.1. For j from 0 to i:\n      2.1.1. For every x ∈ Σ^j (x = x_1…x_j) in lexicographical order:\n         2.1.1.1. Run M on x for i steps.\n         2.1.1.2. If M accepted:\n            2.1.1.2.1. For m from 0 to j:\n               2.1.1.2.1.1. Run D on u = x_1…x_m   (if m = 0, run on ε)\n               2.1.1.2.1.2. If D accepted:\n                  2.1.1.2.1.2.1. Run D on v = x_{m+1}…x_j   (if m = j, run on ε)\n                  2.1.1.2.1.2.2. If D accepted, move to the next x (line 2.1.1).\n            2.1.1.2.2. Accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M,D⟩ ∈ <span class=\"comp\">L<\/span><\/span>: if <span class=\"math\">L(D) = ∅<\/span> we accept in line 1. Otherwise there exists <span class=\"math\">w ∈ L(M)<\/span> with <span class=\"math\">w ∉ L(D)·L(D)<\/span>, i.e. for every split <span class=\"math\">w = uv<\/span>, <span class=\"math\">D<\/span> rejects <span class=\"math\">u<\/span> or rejects <span class=\"math\">v<\/span>. Take the <span class=\"math\">w<\/span> accepted by <span class=\"math\">M<\/span> in the fewest steps <span class=\"math\">k<\/span> (ties by length + lexicographic order). Every earlier iteration fails at least one condition for every candidate; at iteration <span class=\"math\">i = k<\/span> the machine sees <span class=\"math\">M<\/span> accept <span class=\"math\">w<\/span>, finds no split accepted twice by <span class=\"math\">D<\/span>, and accepts in line 2.1.1.2.2.<\/li>\n<li><span class=\"math\">⟨M,D⟩ ∉ <span class=\"comp\">L<\/span><\/span>: ‏<span class=\"math\">L(D) ≠ ∅<\/span> so line 1 does not accept, and for every <span class=\"math\">w<\/span> either <span class=\"math\">M<\/span> does not accept it or some split <span class=\"math\">w = uv<\/span> has both halves in <span class=\"math\">L(D)<\/span> — so the \"Accept\" line is never reached and <span class=\"math\">M_L<\/span> runs forever.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∉ RE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>, therefore <span class=\"math\">L ∉ RE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_{M,w}, D⟩<\/span> where:<\/p>\n<pre>D: \"On input x:\n1. If x = \"0\", accept.\n2. Otherwise, reject.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(D) = {0}<\/span>, therefore <span class=\"math\">L(D) ≠ ∅<\/span> and <span class=\"math\">L(D)·L(D) = {00}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function (finite syntactic encoding).<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: <span class=\"math\">M<\/span> does not accept <span class=\"math\">w<\/span>, so <span class=\"math\">L(N_{M,w}) = ∅ ⊆ {00}<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span>, so <span class=\"math\">L(N_{M,w}) = Σ<sup>*<\/sup> ⊈ {00}<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → ε | a<span class=\"nt\">S<\/span>bb | aa<span class=\"nt\">S<\/span>b | aaa<span class=\"nt\">S<\/span> | <span class=\"nt\">S<\/span>bbb<\/div>\n<\/div>\n<p>Every rule adds letters in multiples of 3 (1+2, 2+1, 3+0, 0+3) while keeping all <span class=\"math\">a<\/span>'s before all <span class=\"math\">b<\/span>'s, so exactly <span class=\"math\">(i+j) mod 3 = 0<\/span> is generated.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p>Let <span class=\"math\">A′<\/span> be the minimal automaton equivalent to <span class=\"math\">A<\/span>. From the given data, <span class=\"math\">A′<\/span> has <span class=\"math\">n<\/span> states (each state is its own equivalence class).<\/p>\n<p>If there exists <span class=\"math\">w ∈ L(A)<\/span> with <span class=\"math\">|w| = n<\/span> then <span class=\"math\">w ∈ L(A′)<\/span> (equivalent automata). The accepting run on <span class=\"math\">w<\/span> is a path with <span class=\"math\">|w| = n<\/span> edges, i.e. <span class=\"math\">n+1<\/span> state-visits — by the pigeonhole principle some state of <span class=\"math\">A′<\/span> is visited twice. That gives a loop on an accepting path, which can be pumped any number of times — so <span class=\"math\">L(A′) = L(A)<\/span> is an infinite language.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example: <span class=\"math\">V = {S}<\/span>, <span class=\"math\">Σ = {a}<\/span> and the single rule:<\/p>\n<div class=\"gram\"><div class=\"rule\"><span class=\"nt\">S<\/span> → aa<\/div><\/div>\n<p><span class=\"math\">w = aa ∈ L(G)<\/span>, <span class=\"math\">|w| = 2 &gt; 1 = |V|<\/span>, and yet <span class=\"math\">L(G) = {aa}<\/span> — a finite language.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p>Denote the language by <span class=\"math\">L<\/span> and assume towards contradiction that <span class=\"math\">L<\/span> is context-free.<\/p>\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{a}<\/span>: <span class=\"math\">f(a) = {a, a′}<\/span>. Then <span class=\"math\">f(L)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>Define <span class=\"math\">L′ = f(L) ∩ L(a<sup>*<\/sup>a′a<sup>*<\/sup>)<\/span> — context-free (intersection with a regular language). In <span class=\"math\">L′<\/span>, exactly one letter is marked.<\/p>\n<p>Define a regular substitution <span class=\"math\">g<\/span>: <span class=\"math\">g(a) = {a}<\/span>, <span class=\"math\">g(a′) = {ε}<\/span> — erasing the marked letter. <span class=\"math\">g(L′)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>But <span class=\"math\">g(L′) = {a<sup>p<\/sup> | p is prime}<\/span>, which is known not to be context-free — a contradiction.<\/p>\n<p>Therefore <span class=\"math\">L = {a<sup>p+1<\/sup> | p is prime}<\/span> is not a context-free language.<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p>Since <span class=\"math\">A<\/span> is finite, <span class=\"math\">L = REG<sub>TM<\/sub> ∪ A ≠ Σ<sup>*<\/sup><\/span>, so there exists a word <span class=\"math\">w_{out} ∉ L<\/span>.<\/p>\n<p>Since <span class=\"math\">A<\/span> is finite, <span class=\"math\">A′ = A ∖ REG<sub>TM<\/sub><\/span> is a finite language, therefore <span class=\"math\">A′ ∈ R<\/span>.<\/p>\n<p>We construct a TM <span class=\"math\">F<\/span> computing the mapping function from <span class=\"math\">REG<sub>TM<\/sub><\/span> to <span class=\"math\">L<\/span>:<\/p>\n<pre>F: \"On input ⟨M⟩:\n1. If ⟨M⟩ ∈ A'   (A' ∈ R), return w_out.\n2. Otherwise, return ⟨M⟩.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is computable: it runs the (always-halting) decider of <span class=\"math\">A′<\/span> and returns one of two values.<\/li>\n<li><span class=\"math\">⟨M⟩ ∈ REG<sub>TM<\/sub><\/span>: then <span class=\"math\">⟨M⟩ ∉ A′<\/span>, so <span class=\"math\">f(⟨M⟩) = ⟨M⟩ ∈ REG<sub>TM<\/sub> ⊆ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M⟩ ∉ REG<sub>TM<\/sub><\/span>: if <span class=\"math\">⟨M⟩ ∈ A′<\/span> then <span class=\"math\">f(⟨M⟩) = w_{out} ∉ L<\/span>; otherwise <span class=\"math\">f(⟨M⟩) = ⟨M⟩<\/span>, which is in neither <span class=\"math\">REG<sub>TM<\/sub><\/span> nor <span class=\"math\">A′<\/span> (nor <span class=\"math\">A ∩ REG<sub>TM<\/sub><\/span>) — so <span class=\"math\">f(⟨M⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3f","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b> Define the semantic property:<\/p>\n<div class=\"lang-def\">C = {L | L ∈ RE and L ≠ Σ<sup>*<\/sup>}<\/div>\n<p>Then <span class=\"math\">L = L_C = {⟨M⟩ | M is a TM and L(M) ∈ C}<\/span> — a machine has some non-accepted word iff its language is not <span class=\"math\">Σ<sup>*<\/sup><\/span>.<\/p>\n<ul>\n<li><span class=\"math\">C ⊆ RE<\/span>: by definition.<\/li>\n<li><span class=\"math\">C ≠ RE<\/span> (not all of RE): <span class=\"math\">Σ<sup>*<\/sup> ∈ RE<\/span> but <span class=\"math\">Σ<sup>*<\/sup> ∉ C<\/span>.<\/li>\n<li><span class=\"math\">C ≠ ∅<\/span>: <span class=\"math\">A<sub>TM<\/sub> ∈ C<\/span>.<\/li>\n<\/ul>\n<p>The property is non-trivial, so by Rice's theorem <span class=\"math\">L_C ∉ R<\/span> — the claim is true.<\/p>\n<\/div>"}]},{"id":"2023b","year":2023,"moed":"ב","label":"2023 — מועד ב'","lang":"he","combined":false,"meta":{"date":"אביב 2023","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן."},"questions":[{"n":"1","heading":"שאלה 1 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">עבור שפות <span class=\"math\">L₁, L₂ ⊆ Σ<sup>*<\/sup><\/span>, נגדיר:<\/p><div class=\"lang-def\">Op(L₁, L₂) = {uvw | v ∈ L₁ and uw ∈ L₂}<\/div><p dir=\"auto\">לדוגמה: <span class=\"math\">Op({c}, {ab, ba}) = {cab, cba, acb, bca, abc, bac}<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":6,"prompt":"<p dir=\"auto\">בהינתן השפות הבאות, <span class=\"math\">L₁, L₂ ⊆ {a,b}<sup>*<\/sup><\/span>, <b>כתבו ביטוי רגולרי<\/b> ל-<span class=\"math\">Op(L₁, L₂)<\/span>:<\/p><p dir=\"auto\"><b>א.<\/b> ‏<span class=\"math\">L₁ = {a}<\/span> ו-<span class=\"math\">L₂ = {b, bb}<\/span>.<\/p><p dir=\"auto\"><b>ב.<\/b> ‏<span class=\"math\">L₁ = {a<sup>i<\/sup>b<sup>j<\/sup> | (i+j) mod 3 = 0}<\/span> ו-<span class=\"math\">L₂ = L(a<sup>*<\/sup>)<\/span>.<\/p><p dir=\"auto\">הסבירו בקצרה את תשובתכם.<\/p>","tags":{"subj":"regex","qt":"construction"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">תהיינה <span class=\"math\">L₁, L₂ ⊆ Σ<sup>*<\/sup><\/span> שפות רגולריות.<\/p><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">Op(L₁, L₂)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":8,"prompt":"<p dir=\"auto\"><b>א.<\/b> בהינתן השפות <span class=\"math\">L₁ = {a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span> ו-<span class=\"math\">L₂ = {c<sup>n<\/sup> | n is even}<\/span>.<\/p><p dir=\"auto\"><b>כתבו דקדוק חסר הקשר<\/b> <span class=\"math\">G<\/span> כך ש-<span class=\"math\">L(G) = Op(L₁, L₂)<\/span>. מספיק לכתוב רק את כללי הגזירה. הסבירו את תשובתכם בקצרה.<\/p><p dir=\"auto\"><b>ב.<\/b> ספקו שפות חסרות הקשר ולא רגולריות <span class=\"math\">L₁, L₂<\/span> כך ש-<span class=\"math\">Op(L₁, L₂)<\/span> חסרת הקשר (ללא הוכחה).<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q1d","label":"4","kind":"open","rows":12,"prompt":"<p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L₁<\/span> היא שפה חסרת הקשר ו-<span class=\"math\">L₂<\/span> היא שפה רגולרית אזי <span class=\"math\">Op(L₁, L₂)<\/span> היא שפה חסרת הקשר, ע\"י הצגת <span class=\"en\">PDA<\/span>‏ <span class=\"math\">P<\/span> כך ש-<span class=\"math\">L(P) = Op(L₁, L₂)<\/span>.<\/p><p dir=\"auto\">הסבירו בקצרה את הפתרון שלכם \/ את דרך הפעולה של <span class=\"math\">P<\/span>.<\/p>","tags":{"subj":"pda","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (30 נקודות)","points":30,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨D, M⟩ | D is a DFA, M is a TM, L(D) ≠ ∅ and |L(M)| ≥ min{|w| : w ∈ L(D)}}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 6 נקודות)","points":30,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">{ww | w ∈ Σ<sup>*<\/sup>}<\/span> היא לא שפה רגולרית ע\"י שימוש ב<b>למת הניפוח לשפות רגולריות<\/b>.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3b","label":"2","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">G = (V, Σ, S, R)<\/span> דקדוק חסר הקשר כך ש-<span class=\"math\">V = {S}<\/span>, <span class=\"math\">Σ = {a,b}<\/span> ו-<span class=\"math\">R = {S → aS | Sb | a | b | ε}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">G<\/span> הוא דקדוק <b>עמום<\/b> ע\"י הצגת מחרוזת <span class=\"math\">w ∈ L(G)<\/span> כך שקיימים יותר מעץ גזירה אחד של <span class=\"math\">G<\/span> עבור <span class=\"math\">w<\/span> (הראו בנוסף שניים מעצי הגזירה).<\/p>","tags":{"subj":"cfg","qt":"proof"}},{"pid":"q3c","label":"3","kind":"open","rows":9,"prompt":"<p dir=\"auto\"><b>הוכיחו:<\/b> ‏<span class=\"math\">{a<sup>2n²<\/sup> | n ≥ 0}<\/span> היא לא שפה חסרת הקשר.<\/p><p dir=\"auto\">אתם רשאים להשתמש בעובדה ש-<span class=\"math\">{a<sup>n²<\/sup> | n ≥ 0}<\/span> היא לא שפה חסרת הקשר.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q3d","label":"4","kind":"open","rows":6,"prompt":"<p dir=\"auto\">בהינתן ה-<span class=\"en\">DFA<\/span>‏ הבא:<\/p><div class=\"fsa\"><svg viewBox=\"0 0 300 210\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\"><circle class=\"st st-acc\" cx=\"75\" cy=\"60\" r=\"20\"\/><circle class=\"st st-acc\" cx=\"75\" cy=\"60\" r=\"25\"\/><text class=\"slbl\" x=\"75\" y=\"60\">q₀<\/text><circle class=\"st\" cx=\"225\" cy=\"60\" r=\"25\"\/><text class=\"slbl\" x=\"225\" y=\"60\">q₁<\/text><circle class=\"st\" cx=\"150\" cy=\"165\" r=\"25\"\/><text class=\"slbl\" x=\"150\" y=\"165\">q₂<\/text><path class=\"tr\" d=\"M100,60 L197,60\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"148\" y=\"48\" text-anchor=\"middle\">a<\/text><path class=\"tr\" d=\"M213,82 L166,146\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"203\" y=\"122\" text-anchor=\"middle\">a<\/text><path class=\"tr\" d=\"M133,146 L86,84\" marker-end=\"url(#arr)\"\/><text class=\"lbl\" x=\"96\" y=\"122\" text-anchor=\"middle\">a<\/text><\/svg><\/div><p dir=\"auto\">הציגו <b>מילה בודדת<\/b>, <span class=\"math\">w ∈ L(a<sup>*<\/sup>)<\/span>, שמפרידה גם בין <span class=\"math\">q₁<\/span> ל-<span class=\"math\">q₂<\/span> וגם בין <span class=\"math\">q₂<\/span> ל-<span class=\"math\">q₀<\/span>. הסבירו את תשובתכם.<\/p>","tags":{"subj":"minimize","qt":"short"}},{"pid":"q3e","label":"5","kind":"open","rows":7,"prompt":"<p dir=\"auto\">בהינתן <span class=\"math\">k ∈ ℕ<\/span>. נגדיר:<\/p><div class=\"lang-def\">L∞<sub>k<\/sub> = {⟨M⟩ | M is a TM, L(M) is infinite and ⟨M⟩ ∈ ⋃<sub>i=0..k<\/sub> Σ<sup>i<\/sup>}<\/div><p dir=\"auto\"><b>נכון או לא נכון:<\/b> לכל <span class=\"math\">k<\/span>, ‏<span class=\"math\">L<sub>∞<\/sub><\/span> לא ניתנת לרדוקציית מיפוי ל-<span class=\"math\">L∞<sub>k<\/sub><\/span> ‏(<span class=\"math\">L<sub>∞<\/sub> ≰<sub>m<\/sub> L∞<sub>k<\/sub><\/span>). נמקו את תשובתכם.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3f","label":"6","kind":"open","rows":10,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">A<\/span> תת-קבוצה לא טריוויאלית <b>סופית<\/b> של <span class=\"math\">Σ<sup>*<\/sup><\/span> ותהיינה <span class=\"math\">L₁<\/span> ו-<span class=\"math\">L₂<\/span> שפות לא טריוויאליות.<\/p><p dir=\"auto\"><b>נכון או לא נכון:<\/b> אם קיימת פונקציה ניתנת לחישוב <span class=\"math\">f: Σ<sup>*<\/sup> → Σ<sup>*<\/sup><\/span> כך של-<span class=\"math\">∀w ∈ Σ<sup>*<\/sup> ∖ A<\/span> מתקיים ש-<span class=\"math\">w ∈ L₁<\/span> אמ\"מ <span class=\"math\">f(w) ∈ L₂<\/span>, אזי בהכרח <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span>. הוכיחו את תשובתכם.<\/p>","tags":{"subj":"reduction","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><b>a.<\/b>&nbsp; <span class=\"math\">ba + ab + abb + bab + bba<\/span><\/p>\n<p>Inserting the single letter <span class=\"math\">a<\/span> at every possible position of <span class=\"math\">b<\/span> (positions in <span class=\"math\">b<\/span>: ab, ba) and of <span class=\"math\">bb<\/span> (abb, bab, bba).<\/p>\n<p><b>b.<\/b>&nbsp; <span class=\"math\">a<sup>*<\/sup>(abb + aab + ε)(bbb)<sup>*<\/sup>a<sup>*<\/sup><\/span><\/p>\n<p>A word of <span class=\"math\">L₁<\/span> is inserted between a prefix and a suffix of a word of <span class=\"math\">L(a<sup>*<\/sup>)<\/span> — so the result is <span class=\"math\">a<\/span>'s, then a word of <span class=\"math\">L₁<\/span>, then more <span class=\"math\">a<\/span>'s; and <span class=\"math\">L₁ = L((abb + aab + ε)(bbb)<sup>*<\/sup> + …)<\/span> restricted here to the forms that keep all <span class=\"math\">a<\/span>'s before all <span class=\"math\">b<\/span>'s inside the inserted word.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L₂<\/span> is regular, so it has a DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_{sA}, F_A)<\/span> with <span class=\"math\">L(A) = L₂<\/span>.<\/p>\n<p>Note that <span class=\"math\">x = uvw ∈ Op(L₁, L₂)<\/span> iff <span class=\"math\">v ∈ L₁<\/span> and <span class=\"math\">uw ∈ L(A)<\/span>, and that <span class=\"math\">uw ∈ L(A)<\/span> iff <span class=\"math\">∃p ∈ Q_A, ∃f ∈ F_A<\/span> such that <span class=\"math\">u ∈ L<sup>A<\/sup><sub>q_{sA},p<\/sub><\/span> and <span class=\"math\">w ∈ L<sup>A<\/sup><sub>p,f<\/sub><\/span>. That is:<\/p>\n<div class=\"lang-def\">Op(L₁, L₂) = ⋃<sub>p∈Q_A, f∈F_A<\/sub> L<sup>A<\/sup><sub>q_{sA},p<\/sub> · L₁ · L<sup>A<\/sup><sub>p,f<\/sub><\/div>\n<p><span class=\"math\">L<sup>A<\/sup><sub>q_{sA},p<\/sub><\/span>, <span class=\"math\">L<sup>A<\/sup><sub>p,f<\/sub><\/span> and <span class=\"math\">L₁<\/span> are regular (proved in class), concatenation of regular languages is regular, and a finite union of regular languages is regular — therefore <span class=\"math\">Op(L₁, L₂)<\/span> is a regular language.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>a.<\/b><\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span> | c<span class=\"nt\">S<\/span>c | <span class=\"nt\">S<\/span>cc | cc<span class=\"nt\">S<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → a<span class=\"nt\">A<\/span>b | ε<\/div>\n<\/div>\n<p><span class=\"math\">A<\/span> generates <span class=\"math\">a<sup>n<\/sup>b<sup>n<\/sup><\/span> (the inserted <span class=\"math\">v ∈ L₁<\/span>), and the <span class=\"math\">S<\/span>-rules wrap it with <span class=\"math\">c<\/span>'s in pairs — either around the middle or on the ends — generating every split of an even number of <span class=\"math\">c<\/span>'s into a prefix and a suffix.<\/p>\n<p><b>b.<\/b>&nbsp; <span class=\"math\">L₁ = L₂ = {a<sup>n<\/sup>b<sup>n<\/sup> | n ≥ 0}<\/span>.<\/p>\n<\/div>"},{"ref":"q1d","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">L₁<\/span> is context-free, so it has a PDA <span class=\"math\">A = (Q_A, Σ_A, Γ_A, δ_A, q_{sA}, F_A)<\/span> with <span class=\"math\">L(A) = L₁<\/span>; <span class=\"math\">L₂<\/span> is regular, so it has a DFA <span class=\"math\">B = (Q_B, Σ_B, δ_B, q_{sB}, F_B)<\/span> with <span class=\"math\">L(B) = L₂<\/span>.<\/p>\n<p>We construct <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F_P)<\/span>:<\/p>\n<p><span class=\"math\">Q_P = Q_A ⊎ (Q_B × {1,2})<\/span>, <span class=\"math\">Σ_P = Σ_A ∪ Σ_B<\/span>, <span class=\"math\">Γ_P = Γ_A ⊎ Q_B<\/span>, <span class=\"math\">q_{sP} = (q_{sB}, 1)<\/span>, <span class=\"math\">F_P = F_B × {2}<\/span>.<\/p>\n<p><span class=\"math\">δ_P<\/span> contains all the transitions of <span class=\"math\">δ_A<\/span>, plus:<\/p>\n<ul>\n<li>For each <span class=\"math\">δ_B(p, b) = q<\/span>: add <span class=\"math\">δ_P((p,1), b, ε) = {((q,1), ε)}<\/span> and <span class=\"math\">δ_P((p,2), b, ε) = {((q,2), ε)}<\/span> — simulating <span class=\"math\">B<\/span> on <span class=\"math\">u<\/span> (phase 1) and on <span class=\"math\">w<\/span> (phase 2).<\/li>\n<li>For each <span class=\"math\">p ∈ Q_B<\/span> and each <span class=\"math\">f ∈ F_A<\/span>: add <span class=\"math\">δ_P((p,1), ε, ε) = {(q_{sA}, p)}<\/span> and <span class=\"math\">δ_P(f, ε, p) = {((p,2), ε)}<\/span>.<\/li>\n<\/ul>\n<p><b>How <span class=\"math\">P<\/span> works:<\/b> it simulates <span class=\"math\">B<\/span> on the prefix <span class=\"math\">u<\/span>; at a nondeterministically chosen point it <b>pushes the current state <span class=\"math\">p<\/span> of <span class=\"math\">B<\/span> onto the stack<\/b> and jumps into the PDA <span class=\"math\">A<\/span> to read <span class=\"math\">v ∈ L₁<\/span>; when <span class=\"math\">A<\/span> reaches an accepting state, <span class=\"math\">P<\/span> pops the saved state <span class=\"math\">p<\/span> and resumes the simulation of <span class=\"math\">B<\/span> on <span class=\"math\">w<\/span> exactly where it stopped. Acceptance requires finishing in <span class=\"math\">F_B<\/span> — i.e. <span class=\"math\">uw ∈ L₂<\/span> and <span class=\"math\">v ∈ L₁<\/span>. (The transitions of <span class=\"math\">A<\/span> never touch the saved state at the bottom, since <span class=\"math\">A<\/span> only pops symbols it pushed itself.)<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ RE<\/span> — בונים מזהה שמחפש קודם את המילה הקצרה ביותר ב-<span class=\"math\">L(D)<\/span> ואז סופר קבלות של <span class=\"math\">M<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∉ R<\/span>, <span class=\"math\">L ∉ coRE<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨D, N_{M,w}⟩<\/span> where:<\/p>\n<pre>D: \"On input x:\n1. If x = \"1\", accept.\n2. Otherwise, reject.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">min{|w| : w ∈ L(D)} = 1<\/span> (and <span class=\"math\">L(D) ≠ ∅<\/span>).<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function (finite syntactic encoding).<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">L(N_{M,w}) = Σ<sup>*<\/sup><\/span>, so <span class=\"math\">|L(N_{M,w})| ≥ 1<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">L(N_{M,w}) = ∅<\/span>, so <span class=\"math\">|L(N_{M,w})| = 0 &lt; 1<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∈ RE<\/span>:<\/b> we construct a recognizer <span class=\"math\">M_L<\/span> for <span class=\"math\">L<\/span>:<\/p>\n<pre>M_L: \"On input ⟨D, M⟩:\n1. Define Length = 0\n2. For k = 0 to ∞:\n   2.1. For every x ∈ Σ^k in lexicographical order:\n      2.1.1. Run D on x.\n      2.1.2. If D accepted:\n         2.1.2.1. Length = k.\n         2.1.2.2. If k = 0, accept.\n         2.1.2.3. Otherwise, goto line 3.\n3. For i = 0 to ∞:\n   3.1. Define Counter = 0.\n   3.2. For j = 0 to i:\n      3.2.1. For every x ∈ Σ^j in lexicographical order:\n         3.2.1.1. Run M on x for i steps.\n         3.2.1.2. If M accepted:\n            3.2.1.2.1. Counter++.\n            3.2.1.2.2. If Counter = Length, accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨D,M⟩ ∈ L<\/span>: lines 1–2 find the shortest word of <span class=\"math\">L(D)<\/span> (a DFA — every run halts), setting <span class=\"math\">Length = min{|w| : w ∈ L(D)}<\/span>; if it is <span class=\"math\">0<\/span> we accept at once. Otherwise <span class=\"math\">|L(M)| ≥ Length<\/span>, so there exist <span class=\"math\">Length<\/span> distinct words accepted by <span class=\"math\">M<\/span>; let <span class=\"math\">s<\/span> be the maximal number of steps needed to accept the \"cheapest\" such set. At iteration <span class=\"math\">i = s<\/span>, all of them are accepted within the same sweep and <span class=\"math\">Counter<\/span> reaches <span class=\"math\">Length<\/span> — <span class=\"math\">M_L<\/span> accepts.<\/li>\n<li><span class=\"math\">⟨D,M⟩ ∉ L<\/span>: if <span class=\"math\">L(D) = ∅<\/span> the loop in line 2 never finds an accepted word and <span class=\"math\">M_L<\/span> runs forever. Otherwise <span class=\"math\">|L(M)| &lt; Length<\/span>: no sweep can ever count <span class=\"math\">Length<\/span> distinct accepted words, so the condition in 3.2.1.2.2 never holds and <span class=\"math\">M_L<\/span> never halts.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L = {ww | w ∈ Σ<sup>*<\/sup>}<\/span> is regular; let <span class=\"math\">n<\/span> be the number promised by the pumping lemma.<\/p>\n<p>We choose <span class=\"math\">w = 0<sup>n<\/sup>10<sup>n<\/sup>1 ∈ L<\/span>, <span class=\"math\">|w| ≥ n<\/span>. By the lemma <span class=\"math\">w = xyz<\/span> with conditions 1–3; denote <span class=\"math\">x = 0<sup>s<\/sup><\/span>, <span class=\"math\">y = 0<sup>t<\/sup><\/span> with <span class=\"math\">s + t ≤ n<\/span>, <span class=\"math\">t &gt; 0<\/span>.<\/p>\n<p>Consider <span class=\"math\">w₂ = xy²z = 0<sup>n+t<\/sup>10<sup>n<\/sup>1<\/span>.<\/p>\n<p>If <span class=\"math\">t<\/span> is odd, <span class=\"math\">|w₂|<\/span> is odd and cannot be split into two equal halves at all. If <span class=\"math\">t<\/span> is even, the two halves are <span class=\"math\">0<sup>n+t\/2<\/sup>…<\/span> and <span class=\"math\">…0<sup>n<\/sup>1<\/span> — the first half is all zeros (since <span class=\"math\">n + t\/2 ≥ n + 1<\/span> puts the first <span class=\"math\">1<\/span> in the second half) while the second half ends with <span class=\"math\">1<\/span> and contains the two <span class=\"math\">1<\/span>'s — the halves differ. Either way <span class=\"math\">w₂ ∉ L<\/span>, contradicting condition 3. Thus <span class=\"math\">L<\/span> is not regular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">w = ab<\/span>, with two distinct parse trees:<\/p>\n<div class=\"cols2\">\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul><li>a<\/li><li><span class=\"nt\">S<\/span><ul><li>b<\/li><\/ul><\/li><\/ul><\/li><\/ul><\/div>\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul><li><span class=\"nt\">S<\/span><ul><li>a<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li><\/ul><\/div>\n<\/div>\n<p><span class=\"math\">S ⇒ aS ⇒ ab<\/span> (via <span class=\"math\">S → aS<\/span>, then <span class=\"math\">S → b<\/span>) versus <span class=\"math\">S ⇒ Sb ⇒ ab<\/span> (via <span class=\"math\">S → Sb<\/span>, then <span class=\"math\">S → a<\/span>) — two different parse trees for the same word, so <span class=\"math\">G<\/span> is ambiguous.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p>Denote the language by <span class=\"math\">L = {a<sup>2n²<\/sup> | n ≥ 0}<\/span> and assume towards contradiction that it is context-free.<\/p>\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{a}<\/span>: <span class=\"math\">f(a) = {a, a′}<\/span>; <span class=\"math\">f(L)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>Define <span class=\"math\">L′ = f(L) ∩ L((aa′)<sup>*<\/sup>)<\/span> — context-free (intersection with a regular language). In <span class=\"math\">L′<\/span> the letters strictly alternate <span class=\"math\">a, a′<\/span>, so a word of length <span class=\"math\">2n²<\/span> has exactly <span class=\"math\">n²<\/span> unmarked <span class=\"math\">a<\/span>'s.<\/p>\n<p>Define a regular substitution <span class=\"math\">g<\/span>: <span class=\"math\">g(a) = {a}<\/span>, <span class=\"math\">g(a′) = {ε}<\/span>; <span class=\"math\">g(L′)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>But <span class=\"math\">g(L′) = {a<sup>n²<\/sup> | n ≥ 0}<\/span>, which is not context-free — a contradiction. Therefore <span class=\"math\">L<\/span> is not a context-free language.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">w = \"a\"<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ(q₁, a) = q₂<\/span> — not an accepting state, but <span class=\"math\">δ(q₂, a) = q₀<\/span> — accepting: <span class=\"math\">a<\/span> separates <span class=\"math\">q₁<\/span> from <span class=\"math\">q₂<\/span>.<\/li>\n<li><span class=\"math\">δ(q₀, a) = q₁<\/span> — not accepting, but <span class=\"math\">δ(q₂, a) = q₀<\/span> — accepting: <span class=\"math\">a<\/span> separates <span class=\"math\">q₂<\/span> from <span class=\"math\">q₀<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p><span class=\"math\">L∞<sub>k<\/sub><\/span> is a finite language (all its members are words of length at most <span class=\"math\">k<\/span>) and therefore <span class=\"math\">L∞<sub>k<\/sub> ∈ R<\/span>, while <span class=\"math\">L<sub>∞<\/sub> ∉ R<\/span>.<\/p>\n<p>If <span class=\"math\">L<sub>∞<\/sub> ≤<sub>m<\/sub> L∞<sub>k<\/sub><\/span> held, then since membership in <span class=\"math\">R<\/span> transfers from right to left along a mapping reduction, we would get <span class=\"math\">L<sub>∞<\/sub> ∈ R<\/span> — a contradiction. Therefore <span class=\"math\">L<sub>∞<\/sub> ≰<sub>m<\/sub> L∞<sub>k<\/sub><\/span> for every <span class=\"math\">k<\/span>.<\/p>\n<\/div>"},{"ref":"q3f","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p><span class=\"math\">A<\/span> is a finite set, therefore both <span class=\"math\">A ∖ L₁<\/span> and <span class=\"math\">A ∩ L₁<\/span> are finite languages and hence decidable.<\/p>\n<p>Since <span class=\"math\">L₂<\/span> is non-trivial, there exist <span class=\"math\">w_{in} ∈ L₂<\/span> and <span class=\"math\">w_{out} ∉ L₂<\/span>.<\/p>\n<p>We show <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span> by constructing a TM <span class=\"math\">G<\/span> computing a mapping function <span class=\"math\">g<\/span>:<\/p>\n<pre>G: \"On input x:\n1. If x ∈ A ∖ L₁, return w_out.\n2. If x ∈ A ∩ L₁, return w_in.\n3. Otherwise, return f(x).\"<\/pre>\n<p><span class=\"math\">g<\/span> is computable — lines 1–2 run deciders of finite languages, line 3 runs the computable <span class=\"math\">f<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">x ∈ L₁<\/span>: if <span class=\"math\">x ∈ A ∩ L₁<\/span> we return <span class=\"math\">w_{in} ∈ L₂<\/span>; if <span class=\"math\">x ∈ L₁ ∖ A<\/span> we return <span class=\"math\">f(x) ∈ L₂<\/span> (by the property of <span class=\"math\">f<\/span> outside <span class=\"math\">A<\/span>).<\/li>\n<li><span class=\"math\">x ∉ L₁<\/span>: if <span class=\"math\">x ∈ A ∖ L₁<\/span> we return <span class=\"math\">w_{out} ∉ L₂<\/span>; otherwise <span class=\"math\">x ∉ A<\/span> and we return <span class=\"math\">f(x) ∉ L₂<\/span>.<\/li>\n<\/ul>\n<p>In every case <span class=\"math\">x ∈ L₁ ⟺ g(x) ∈ L₂<\/span> — so <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span>.<\/p>\n<\/div>"}]},{"id":"2024a","year":2024,"moed":"א","label":"2024 — מועד א'","lang":"he","combined":false,"meta":{"date":"אביב 2024","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן — פתחו אותה מהכפתור למעלה."},"questions":[{"n":"1","heading":"שאלה 1 (7, 14, 14 נקודות)","points":35,"intro":"<p dir=\"auto\">בהינתן מחרוזת <span class=\"math\">y ∈ {0,1}<sup>*<\/sup><\/span> נגדיר את <span class=\"math\">ŷ ∈ {0̂,1̂}<sup>*<\/sup><\/span> להיות המחרוזת <span class=\"math\">y<\/span> לאחר שהחלפנו בה כל מופע של <span class=\"math\">0<\/span> עם <span class=\"math\">0̂<\/span> וכל מופע של <span class=\"math\">1<\/span> עם <span class=\"math\">1̂<\/span>.<\/p><p dir=\"auto\">לדוגמה, עבור <span class=\"math\">y = 01<\/span> נגדיר <span class=\"math\">ŷ = 0̂1̂<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":8,"prompt":"<p dir=\"auto\">בהינתן השפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>. נגדיר את השפה:<\/p><div class=\"lang-def\">L₁ = {xŷz | xyz ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו ע\"י שימוש בסגירויות:<\/b> אם <span class=\"math\">L<\/span> שפה רגולרית אזי <span class=\"math\">L₁<\/span> גם כן שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן <span class=\"en\">DFA<\/span>‏ <span class=\"math\">A = (Q, Σ, δ_A, q_s, F)<\/span> עבור השפה <span class=\"math\">L<\/span>, כלומר <span class=\"math\">L(A) = L<\/span>, כך ש-<span class=\"math\">Σ = {0,1}<\/span>. נגדיר את השפה:<\/p><div class=\"lang-def\">L₂ = {xyz | x, z ≠ ε,&nbsp; xyz ∈ L&nbsp; and&nbsp; y ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו ע\"י שימוש ב-<span class=\"math\">A<\/span>:<\/b> ‏<span class=\"math\">L₂<\/span> גם כן שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן השפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>. נגדיר את השפה:<\/p><div class=\"lang-def\">L₃ = {xŷz | xyz ∈ L&nbsp; and&nbsp; |x| = |y|}<\/div><p dir=\"auto\"><b>הוכח:<\/b> אם <span class=\"math\">L<\/span> הינה שפה רגולרית אזי <span class=\"math\">L₃<\/span> הינה שפה חסרת הקשר.<\/p>","tags":{"subj":"cfg","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, D⟩ | M is a TM, D is a DFA and ∃x,y ∈ Σ<sup>*<\/sup> s.t. M halts on x and rejects y and xy ∈ L(D)}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 5 נקודות)","points":25,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>m<\/sup>ba<sup>n<\/sup>b | m ≥ 2n}<\/span>.<\/p><p dir=\"auto\"><b>הוכח ע\"י למת הניפוח לשפות רגולריות<\/b> ש-<span class=\"math\">L<\/span> איננה שפה רגולרית.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3b","label":"2","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i ≥ min{j,k}}<\/span>.<\/p><p dir=\"auto\"><b>בנה דקדוק חסר הקשר<\/b> לשפה <span class=\"math\">L<\/span>.<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3c","label":"3","kind":"open","rows":7,"prompt":"<p dir=\"auto\"><b>הוכח<\/b> שהדקדוק שכתבת בשאלה הקודמת (3.2) הינו דקדוק <b>עמום<\/b>.<\/p>","tags":{"subj":"cfg","qt":"proof"}},{"pid":"q3d","label":"4","kind":"open","rows":8,"prompt":"<p dir=\"auto\"><b>הוכח או הפרך:<\/b> תהי <span class=\"math\">A<\/span> שפה אינסופית. אם <span class=\"math\">A ⊆ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> אזי <u>בהכרח<\/u> מתקיים ש-<span class=\"math\">A ∉ R<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3e","label":"5","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span>}<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> ‏<span class=\"math\">L ∈ RE ∖ R<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{0,1}<\/span>: <span class=\"math\">f(0) = {0, 0̂}<\/span> and <span class=\"math\">f(1) = {1, 1̂}<\/span>.<\/p>\n<p><span class=\"math\">f(L)<\/span> is a regular language (closure under regular substitution).<\/p>\n<p>Let <span class=\"math\">Σ̂ = {0̂, 1̂}<\/span>.<\/p>\n<p>Define <span class=\"math\">L′ = L(Σ<sup>*<\/sup> · Σ̂<sup>*<\/sup> · Σ<sup>*<\/sup>)<\/span>, a regular language (regex).<\/p>\n<p>Define <span class=\"math\">L″ = f(L) ∩ L′<\/span>, a regular language (closure under intersection).<\/p>\n<p>Note that <span class=\"math\">L₁ = L″<\/span>.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p>For every <span class=\"math\">p, q ∈ Q_A<\/span>, define <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> = {w | δ′_A(p, w) = q}<\/span>. We note that <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> is a regular language: we define <span class=\"math\">p<\/span> as an initial state and <span class=\"math\">q<\/span> as an accepting state and we get a DFA whose language is <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span>.<\/p>\n<p>Note that <span class=\"math\">L = ⋃<sub>p,q∈Q, f∈F<\/sub> L<sup>A<\/sup><sub>q_s,p<\/sub> · L<sup>A<\/sup><sub>p,q<\/sub> · L<sup>A<\/sup><sub>q,f<\/sub><\/span>.<\/p>\n<p>For every <span class=\"math\">p, q ∈ Q<\/span> define <span class=\"math\">L̂<sup>A<\/sup><sub>p,q<\/sub> = L<sup>A<\/sup><sub>p,q<\/sub> ∩ L<\/span>, a regular language (intersection of two regular languages).<\/p>\n<p>Note that for every <span class=\"math\">p, q ∈ Q<\/span> it holds that <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> ∖ {ε}<\/span> is also regular (set difference of two regular languages).<\/p>\n<p>Note that <span class=\"math\">L₂ = ⋃<sub>p,q∈Q, f∈F<\/sub> (L<sup>A<\/sup><sub>q_s,p<\/sub> ∖ {ε}) · L̂<sup>A<\/sup><sub>p,q<\/sub> · (L<sup>A<\/sup><sub>q,f<\/sub> ∖ {ε})<\/span>, which is also a regular language (finite union of concatenation of regular languages).<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>Solution 1:<\/b><\/p>\n<p>Define <span class=\"math\">L′ = {xŷz | |x| = |y|}<\/span> and note that <span class=\"math\">L₃ = L′ ∩ L₁<\/span>. Since <span class=\"math\">L₁<\/span> is regular (section 1.1), if we prove that <span class=\"math\">L′<\/span> is a context-free language then we prove that <span class=\"math\">L₃<\/span> is also a context-free language (intersection between a regular language and a context-free language).<\/p>\n<p>Define a context-free grammar <span class=\"math\">G = (V, Σ, S, R)<\/span> for <span class=\"math\">L′<\/span>:<\/p>\n<p><span class=\"math\">V = {S, A, B, C, D}<\/span>, <span class=\"math\">Σ = {0, 1, 0̂, 1̂}<\/span><\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span><span class=\"nt\">B<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → <span class=\"nt\">C<\/span><span class=\"nt\">A<\/span><span class=\"nt\">D<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → <span class=\"nt\">C<\/span><span class=\"nt\">B<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → 0 | 1<\/div>\n<div class=\"rule\"><span class=\"nt\">D<\/span> → 0̂ | 1̂<\/div>\n<\/div>\n<p>Therefore <span class=\"math\">L′<\/span> is a context-free language and <span class=\"math\">L₃ = L′ ∩ L₁<\/span> is also a context-free language.<\/p>\n<p><b>Solution 2:<\/b><\/p>\n<p>Let DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_{sA}, F_A)<\/span> such that <span class=\"math\">L(A) = L<\/span> (<span class=\"math\">L<\/span> is a regular language).<\/p>\n<p>Define PDA <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F_P)<\/span> as follows:<\/p>\n<p><span class=\"math\">Q_P = Q_A × {1,2,3} ⊎ {q_{sP}, f_P}<\/span>, <span class=\"math\">Σ_P = {0,1,0̂,1̂}<\/span>, <span class=\"math\">Γ = {x, $}<\/span> and <span class=\"math\">F_P = {f_P}<\/span>.<\/p>\n<ul>\n<li>We add the transition <span class=\"math\">δ_P(q_{sP}, ε, ε) = {((q_{sA},1), $)}<\/span> to the transition function of <span class=\"math\">P<\/span>.<\/li>\n<li><span class=\"math\">∀f ∈ F_A × {3}<\/span> we add the transition <span class=\"math\">δ_P(f, ε, $) = {(f_P, ε)}<\/span>.<\/li>\n<li><span class=\"math\">∀q ∈ Q_A<\/span> we add the transitions <span class=\"math\">δ_P((q,1), ε, ε) = {((q,2), ε)}<\/span> and <span class=\"math\">δ_P((q,2), ε, ε) = {((q,3), ε)}<\/span>.<\/li>\n<li>For each transition <span class=\"math\">δ_A(p, σ) = q<\/span> of <span class=\"math\">A<\/span> (with <span class=\"math\">p,q ∈ Q_A<\/span>, <span class=\"math\">σ ∈ Σ<\/span>) we add the transitions <span class=\"math\">δ_P((p,1), σ, ε) = {((q,1), x)}<\/span>, <span class=\"math\">δ_P((p,2), σ̂, x) = {((q,2), ε)}<\/span> and <span class=\"math\">δ_P((p,3), σ, ε) = {((q,3), ε)}<\/span>.<\/li>\n<\/ul>\n<p>Phase 1 reads <span class=\"math\">x<\/span> and pushes a counter symbol per letter; phase 2 reads <span class=\"math\">ŷ<\/span> and pops one symbol per letter (so <span class=\"math\">|x| = |y|<\/span>); phase 3 reads <span class=\"math\">z<\/span>. All three phases simulate <span class=\"math\">A<\/span> on the underlying word <span class=\"math\">xyz<\/span>, and acceptance requires ending in <span class=\"math\">F_A<\/span> with an empty stack marker.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מכך ש-<span class=\"math\">L ∉ coRE<\/span> (ראו ההוכחה המלאה בסעיף ההוכחה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ RE<\/span> — בונים מזהה בשיטת ה-dovetailing (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_{M,w}, D⟩<\/span> where:<\/p>\n<pre>D: \"On input x:\n1. If x = \"00\", accept.\n2. Otherwise, reject.\"\n\nN_{M,w}: \"On input x:\n1. Run M on w.\n2. If M accepts, reject.\n3. Otherwise, loop.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(D) = {00}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function: to compute <span class=\"math\">f<\/span> all that needs to be done is to encode the description (string) of the TM <span class=\"math\">N_{M,w}<\/span> and the DFA <span class=\"math\">D<\/span>. The strings are of finite length and the encoding process takes finite time, and eventually the TM halts with the output <span class=\"math\">⟨N_{M,w}, D⟩<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span>, therefore <span class=\"math\">N_{M,w}<\/span> rejects (and halts) on every <span class=\"math\">x, y ∈ Σ<sup>*<\/sup><\/span>; in particular <span class=\"math\">N_{M,w}<\/span> halts on <span class=\"math\">x = 0<\/span> and rejects <span class=\"math\">y = 0<\/span>, and <span class=\"math\">xy = 00 ∈ L(D)<\/span>. Therefore <span class=\"math\">f(⟨M,w⟩) = ⟨N_{M,w}, D⟩ ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> does not accept <span class=\"math\">w<\/span>, therefore <span class=\"math\">N_{M,w}<\/span> does not halt on any <span class=\"math\">x ∈ Σ<sup>*<\/sup><\/span>. Therefore <span class=\"math\">∄x ∈ Σ<sup>*<\/sup><\/span> such that <span class=\"math\">N_{M,w}<\/span> halts on <span class=\"math\">x<\/span>, and <span class=\"math\">f(⟨M,w⟩) = ⟨N_{M,w}, D⟩ ∉ L<\/span>.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∈ RE<\/span>:<\/b> we construct a recognizer <span class=\"math\">M_L<\/span> for <span class=\"math\">L<\/span>.<\/p>\n<pre>M_L: \"On input ⟨M, D⟩:\n1. For i from 0 to ∞:\n   1.1. For j from 0 to i:\n      1.1.1. For every x ∈ Σ^j in lexicographical order:\n         1.1.1.1. Run M on x for i steps.\n         1.1.1.2. If M accepted or rejected (halted) x:\n            1.1.1.2.1. For h from 0 to i:\n               1.1.1.2.1.1. For every y ∈ Σ^h in lexicographical order:\n                  1.1.1.2.1.1.1. Run M on y for i steps.\n                  1.1.1.2.1.1.2. If M rejected y:\n                     1.1.1.2.1.1.2.1. Run D on xy.\n                     1.1.1.2.1.1.2.2. If D accepted xy, accept.\"<\/pre>\n<ul>\n<li><span class=\"math\">⟨M,D⟩ ∈ L<\/span>: there exist words <span class=\"math\">x, y ∈ Σ<sup>*<\/sup><\/span> such that <span class=\"math\">M<\/span> halts on <span class=\"math\">x<\/span> and rejects <span class=\"math\">y<\/span>, and <span class=\"math\">D<\/span> accepts <span class=\"math\">xy<\/span>. Among all such pairs consider the one minimizing <span class=\"math\">k = max{k_x, k_y}<\/span>, where <span class=\"math\">k_x, k_y<\/span> are the number of steps in which <span class=\"math\">M<\/span> halts on <span class=\"math\">x<\/span> and rejects <span class=\"math\">y<\/span> respectively (ties broken by length and lexicographic order of <span class=\"math\">x<\/span>, then of <span class=\"math\">y<\/span>). For every iteration <span class=\"math\">i &lt; k<\/span>, every candidate pair fails at least one of the three conditions, so nothing is accepted early; at iteration <span class=\"math\">i = k<\/span> the machine runs <span class=\"math\">M<\/span> on <span class=\"math\">x<\/span> and on <span class=\"math\">y<\/span> for <span class=\"math\">k<\/span> steps, sees the halt and the rejection, runs <span class=\"math\">D<\/span> on <span class=\"math\">xy<\/span> and accepts. Therefore after a finite number of steps <span class=\"math\">M_L<\/span> accepts <span class=\"math\">⟨M,D⟩<\/span>.<\/li>\n<li><span class=\"math\">⟨M,D⟩ ∉ L<\/span>: for every pair <span class=\"math\">x, y ∈ Σ<sup>*<\/sup><\/span> one of the following holds — <span class=\"math\">M<\/span> does not halt on <s
