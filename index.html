 construct <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F_P)<\/span>:<\/p>\n<p><span class=\"math\">Q_P = Q_A ⊎ (Q_B × {1,2})<\/span>, <span class=\"math\">Σ_P = Σ_A ∪ Σ_B<\/span>, <span class=\"math\">Γ_P = Γ_A ⊎ Q_B<\/span>, <span class=\"math\">q_{sP} = (q_{sB}, 1)<\/span>, <span class=\"math\">F_P = F_B × {2}<\/span>.<\/p>\n<p><span class=\"math\">δ_P<\/span> contains all the transitions of <span class=\"math\">δ_A<\/span>, plus:<\/p>\n<ul>\n<li>For each <span class=\"math\">δ_B(p, b) = q<\/span>: add <span class=\"math\">δ_P((p,1), b, ε) = {((q,1), ε)}<\/span> and <span class=\"math\">δ_P((p,2), b, ε) = {((q,2), ε)}<\/span> — simulating <span class=\"math\">B<\/span> on <span class=\"math\">u<\/span> (phase 1) and on <span class=\"math\">w<\/span> (phase 2).<\/li>\n<li>For each <span class=\"math\">p ∈ Q_B<\/span> and each <span class=\"math\">f ∈ F_A<\/span>: add <span class=\"math\">δ_P((p,1), ε, ε) = {(q_{sA}, p)}<\/span> and <span class=\"math\">δ_P(f, ε, p) = {((p,2), ε)}<\/span>.<\/li>\n<\/ul>\n<p><b>How <span class=\"math\">P<\/span> works:<\/b> it simulates <span class=\"math\">B<\/span> on the prefix <span class=\"math\">u<\/span>; at a nondeterministically chosen point it <b>pushes the current state <span class=\"math\">p<\/span> of <span class=\"math\">B<\/span> onto the stack<\/b> and jumps into the PDA <span class=\"math\">A<\/span> to read <span class=\"math\">v ∈ L₁<\/span>; when <span class=\"math\">A<\/span> reaches an accepting state, <span class=\"math\">P<\/span> pops the saved state <span class=\"math\">p<\/span> and resumes the simulation of <span class=\"math\">B<\/span> on <span class=\"math\">w<\/span> exactly where it stopped. Acceptance requires finishing in <span class=\"math\">F_B<\/span> — i.e. <span class=\"math\">uw ∈ L₂<\/span> and <span class=\"math\">v ∈ L₁<\/span>. (The transitions of <span class=\"math\">A<\/span> never touch the saved state at the bottom, since <span class=\"math\">A<\/span> only pops symbols it pushed itself.)<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ RE<\/span> — בונים מזהה שמחפש קודם את המילה הקצרה ביותר ב-<span class=\"math\">L(D)<\/span> ואז סופר קבלות של <span class=\"math\">M<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∉ R<\/span>, <span class=\"math\">L ∉ coRE<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨D, N_{M,w}⟩<\/span> where:<\/p>\n<pre>D: \"On input x:\n1. If x = \"1\", accept.\n2. Otherwise, reject.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">min{|w| : w ∈ L(D)} = 1<\/span> (and <span class=\"math\">L(D) ≠ ∅<\/span>).<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function (finite syntactic encoding).<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">L(N_{M,w}) = Σ<sup>*<\/sup><\/span>, so <span class=\"math\">|L(N_{M,w})| ≥ 1<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">L(N_{M,w}) = ∅<\/span>, so <span class=\"math\">|L(N_{M,w})| = 0 &lt; 1<\/span> — therefore <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∈ RE<\/span>:<\/b> we construct a recognizer <span class=\"math\">M_L<\/span> for <span class=\"math\">L<\/span>:<\/p>\n<pre>M_L: \"On input ⟨D, M⟩:\n1. Define Length = 0\n2. For k = 0 to ∞:\n   2.1. For every x ∈ Σ^k in lexicographical order:\n      2.1.1. Run D on x.\n      2.1.2. If D accepted:\n         2.1.2.1. Length = k.\n         2.1.2.2. If k = 0, accept.\n         2.1.2.3. Otherwise, goto line 3.\n3. For i = 0 to ∞:\n   3.1. Define Counter = 0.\n   3.2. For j = 0 to i:\n      3.2.1. For every x ∈ Σ^j in lexicographical order:\n         3.2.1.1. Run M on x for i steps.\n         3.2.1.2. If M accepted:\n            3.2.1.2.1. Counter++.\n            3.2.1.2.2. If Counter = Length, accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨D,M⟩ ∈ L<\/span>: lines 1–2 find the shortest word of <span class=\"math\">L(D)<\/span> (a DFA — every run halts), setting <span class=\"math\">Length = min{|w| : w ∈ L(D)}<\/span>; if it is <span class=\"math\">0<\/span> we accept at once. Otherwise <span class=\"math\">|L(M)| ≥ Length<\/span>, so there exist <span class=\"math\">Length<\/span> distinct words accepted by <span class=\"math\">M<\/span>; let <span class=\"math\">s<\/span> be the maximal number of steps needed to accept the \"cheapest\" such set. At iteration <span class=\"math\">i = s<\/span>, all of them are accepted within the same sweep and <span class=\"math\">Counter<\/span> reaches <span class=\"math\">Length<\/span> — <span class=\"math\">M_L<\/span> accepts.<\/li>\n<li><span class=\"math\">⟨D,M⟩ ∉ L<\/span>: if <span class=\"math\">L(D) = ∅<\/span> the loop in line 2 never finds an accepted word and <span class=\"math\">M_L<\/span> runs forever. Otherwise <span class=\"math\">|L(M)| &lt; Length<\/span>: no sweep can ever count <span class=\"math\">Length<\/span> distinct accepted words, so the condition in 3.2.1.2.2 never holds and <span class=\"math\">M_L<\/span> never halts.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L = {ww | w ∈ Σ<sup>*<\/sup>}<\/span> is regular; let <span class=\"math\">n<\/span> be the number promised by the pumping lemma.<\/p>\n<p>We choose <span class=\"math\">w = 0<sup>n<\/sup>10<sup>n<\/sup>1 ∈ L<\/span>, <span class=\"math\">|w| ≥ n<\/span>. By the lemma <span class=\"math\">w = xyz<\/span> with conditions 1–3; denote <span class=\"math\">x = 0<sup>s<\/sup><\/span>, <span class=\"math\">y = 0<sup>t<\/sup><\/span> with <span class=\"math\">s + t ≤ n<\/span>, <span class=\"math\">t &gt; 0<\/span>.<\/p>\n<p>Consider <span class=\"math\">w₂ = xy²z = 0<sup>n+t<\/sup>10<sup>n<\/sup>1<\/span>.<\/p>\n<p>If <span class=\"math\">t<\/span> is odd, <span class=\"math\">|w₂|<\/span> is odd and cannot be split into two equal halves at all. If <span class=\"math\">t<\/span> is even, the two halves are <span class=\"math\">0<sup>n+t\/2<\/sup>…<\/span> and <span class=\"math\">…0<sup>n<\/sup>1<\/span> — the first half is all zeros (since <span class=\"math\">n + t\/2 ≥ n + 1<\/span> puts the first <span class=\"math\">1<\/span> in the second half) while the second half ends with <span class=\"math\">1<\/span> and contains the two <span class=\"math\">1<\/span>'s — the halves differ. Either way <span class=\"math\">w₂ ∉ L<\/span>, contradicting condition 3. Thus <span class=\"math\">L<\/span> is not regular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">w = ab<\/span>, with two distinct parse trees:<\/p>\n<div class=\"cols2\">\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul><li>a<\/li><li><span class=\"nt\">S<\/span><ul><li>b<\/li><\/ul><\/li><\/ul><\/li><\/ul><\/div>\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul><li><span class=\"nt\">S<\/span><ul><li>a<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li><\/ul><\/div>\n<\/div>\n<p><span class=\"math\">S ⇒ aS ⇒ ab<\/span> (via <span class=\"math\">S → aS<\/span>, then <span class=\"math\">S → b<\/span>) versus <span class=\"math\">S ⇒ Sb ⇒ ab<\/span> (via <span class=\"math\">S → Sb<\/span>, then <span class=\"math\">S → a<\/span>) — two different parse trees for the same word, so <span class=\"math\">G<\/span> is ambiguous.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p>Denote the language by <span class=\"math\">L = {a<sup>2n²<\/sup> | n ≥ 0}<\/span> and assume towards contradiction that it is context-free.<\/p>\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{a}<\/span>: <span class=\"math\">f(a) = {a, a′}<\/span>; <span class=\"math\">f(L)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>Define <span class=\"math\">L′ = f(L) ∩ L((aa′)<sup>*<\/sup>)<\/span> — context-free (intersection with a regular language). In <span class=\"math\">L′<\/span> the letters strictly alternate <span class=\"math\">a, a′<\/span>, so a word of length <span class=\"math\">2n²<\/span> has exactly <span class=\"math\">n²<\/span> unmarked <span class=\"math\">a<\/span>'s.<\/p>\n<p>Define a regular substitution <span class=\"math\">g<\/span>: <span class=\"math\">g(a) = {a}<\/span>, <span class=\"math\">g(a′) = {ε}<\/span>; <span class=\"math\">g(L′)<\/span> is context-free (closure under regular substitution).<\/p>\n<p>But <span class=\"math\">g(L′) = {a<sup>n²<\/sup> | n ≥ 0}<\/span>, which is not context-free — a contradiction. Therefore <span class=\"math\">L<\/span> is not a context-free language.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">w = \"a\"<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ(q₁, a) = q₂<\/span> — not an accepting state, but <span class=\"math\">δ(q₂, a) = q₀<\/span> — accepting: <span class=\"math\">a<\/span> separates <span class=\"math\">q₁<\/span> from <span class=\"math\">q₂<\/span>.<\/li>\n<li><span class=\"math\">δ(q₀, a) = q₁<\/span> — not accepting, but <span class=\"math\">δ(q₂, a) = q₀<\/span> — accepting: <span class=\"math\">a<\/span> separates <span class=\"math\">q₂<\/span> from <span class=\"math\">q₀<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p><span class=\"math\">L∞<sub>k<\/sub><\/span> is a finite language (all its members are words of length at most <span class=\"math\">k<\/span>) and therefore <span class=\"math\">L∞<sub>k<\/sub> ∈ R<\/span>, while <span class=\"math\">L<sub>∞<\/sub> ∉ R<\/span>.<\/p>\n<p>If <span class=\"math\">L<sub>∞<\/sub> ≤<sub>m<\/sub> L∞<sub>k<\/sub><\/span> held, then since membership in <span class=\"math\">R<\/span> transfers from right to left along a mapping reduction, we would get <span class=\"math\">L<sub>∞<\/sub> ∈ R<\/span> — a contradiction. Therefore <span class=\"math\">L<sub>∞<\/sub> ≰<sub>m<\/sub> L∞<sub>k<\/sub><\/span> for every <span class=\"math\">k<\/span>.<\/p>\n<\/div>"},{"ref":"q3f","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b><\/p>\n<p><span class=\"math\">A<\/span> is a finite set, therefore both <span class=\"math\">A ∖ L₁<\/span> and <span class=\"math\">A ∩ L₁<\/span> are finite languages and hence decidable.<\/p>\n<p>Since <span class=\"math\">L₂<\/span> is non-trivial, there exist <span class=\"math\">w_{in} ∈ L₂<\/span> and <span class=\"math\">w_{out} ∉ L₂<\/span>.<\/p>\n<p>We show <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span> by constructing a TM <span class=\"math\">G<\/span> computing a mapping function <span class=\"math\">g<\/span>:<\/p>\n<pre>G: \"On input x:\n1. If x ∈ A ∖ L₁, return w_out.\n2. If x ∈ A ∩ L₁, return w_in.\n3. Otherwise, return f(x).\"<\/pre>\n<p><span class=\"math\">g<\/span> is computable — lines 1–2 run deciders of finite languages, line 3 runs the computable <span class=\"math\">f<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">x ∈ L₁<\/span>: if <span class=\"math\">x ∈ A ∩ L₁<\/span> we return <span class=\"math\">w_{in} ∈ L₂<\/span>; if <span class=\"math\">x ∈ L₁ ∖ A<\/span> we return <span class=\"math\">f(x) ∈ L₂<\/span> (by the property of <span class=\"math\">f<\/span> outside <span class=\"math\">A<\/span>).<\/li>\n<li><span class=\"math\">x ∉ L₁<\/span>: if <span class=\"math\">x ∈ A ∖ L₁<\/span> we return <span class=\"math\">w_{out} ∉ L₂<\/span>; otherwise <span class=\"math\">x ∉ A<\/span> and we return <span class=\"math\">f(x) ∉ L₂<\/span>.<\/li>\n<\/ul>\n<p>In every case <span class=\"math\">x ∈ L₁ ⟺ g(x) ∈ L₂<\/span> — so <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span>.<\/p>\n<\/div>"}]},{"id":"2024a","year":2024,"moed":"א","label":"2024 — מועד א'","lang":"he","combined":false,"meta":{"date":"אביב 2024","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן — פתחו אותה מהכפתור למעלה."},"questions":[{"n":"1","heading":"שאלה 1 (7, 14, 14 נקודות)","points":35,"intro":"<p dir=\"auto\">בהינתן מחרוזת <span class=\"math\">y ∈ {0,1}<sup>*<\/sup><\/span> נגדיר את <span class=\"math\">ŷ ∈ {0̂,1̂}<sup>*<\/sup><\/span> להיות המחרוזת <span class=\"math\">y<\/span> לאחר שהחלפנו בה כל מופע של <span class=\"math\">0<\/span> עם <span class=\"math\">0̂<\/span> וכל מופע של <span class=\"math\">1<\/span> עם <span class=\"math\">1̂<\/span>.<\/p><p dir=\"auto\">לדוגמה, עבור <span class=\"math\">y = 01<\/span> נגדיר <span class=\"math\">ŷ = 0̂1̂<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":8,"prompt":"<p dir=\"auto\">בהינתן השפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>. נגדיר את השפה:<\/p><div class=\"lang-def\">L₁ = {xŷz | xyz ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו ע\"י שימוש בסגירויות:<\/b> אם <span class=\"math\">L<\/span> שפה רגולרית אזי <span class=\"math\">L₁<\/span> גם כן שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן <span class=\"en\">DFA<\/span>‏ <span class=\"math\">A = (Q, Σ, δ_A, q_s, F)<\/span> עבור השפה <span class=\"math\">L<\/span>, כלומר <span class=\"math\">L(A) = L<\/span>, כך ש-<span class=\"math\">Σ = {0,1}<\/span>. נגדיר את השפה:<\/p><div class=\"lang-def\">L₂ = {xyz | x, z ≠ ε,&nbsp; xyz ∈ L&nbsp; and&nbsp; y ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו ע\"י שימוש ב-<span class=\"math\">A<\/span>:<\/b> ‏<span class=\"math\">L₂<\/span> גם כן שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן השפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>. נגדיר את השפה:<\/p><div class=\"lang-def\">L₃ = {xŷz | xyz ∈ L&nbsp; and&nbsp; |x| = |y|}<\/div><p dir=\"auto\"><b>הוכח:<\/b> אם <span class=\"math\">L<\/span> הינה שפה רגולרית אזי <span class=\"math\">L₃<\/span> הינה שפה חסרת הקשר.<\/p>","tags":{"subj":"cfg","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, D⟩ | M is a TM, D is a DFA and ∃x,y ∈ Σ<sup>*<\/sup> s.t. M halts on x and rejects y and xy ∈ L(D)}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 5 נקודות)","points":25,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>m<\/sup>ba<sup>n<\/sup>b | m ≥ 2n}<\/span>.<\/p><p dir=\"auto\"><b>הוכח ע\"י למת הניפוח לשפות רגולריות<\/b> ש-<span class=\"math\">L<\/span> איננה שפה רגולרית.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3b","label":"2","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i ≥ min{j,k}}<\/span>.<\/p><p dir=\"auto\"><b>בנה דקדוק חסר הקשר<\/b> לשפה <span class=\"math\">L<\/span>.<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3c","label":"3","kind":"open","rows":7,"prompt":"<p dir=\"auto\"><b>הוכח<\/b> שהדקדוק שכתבת בשאלה הקודמת (3.2) הינו דקדוק <b>עמום<\/b>.<\/p>","tags":{"subj":"cfg","qt":"proof"}},{"pid":"q3d","label":"4","kind":"open","rows":8,"prompt":"<p dir=\"auto\"><b>הוכח או הפרך:<\/b> תהי <span class=\"math\">A<\/span> שפה אינסופית. אם <span class=\"math\">A ⊆ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> אזי <u>בהכרח<\/u> מתקיים ש-<span class=\"math\">A ∉ R<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3e","label":"5","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span>}<\/span>.<\/p><p dir=\"auto\"><b>הוכח או הפרך:<\/b> ‏<span class=\"math\">L ∈ RE ∖ R<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{0,1}<\/span>: <span class=\"math\">f(0) = {0, 0̂}<\/span> and <span class=\"math\">f(1) = {1, 1̂}<\/span>.<\/p>\n<p><span class=\"math\">f(L)<\/span> is a regular language (closure under regular substitution).<\/p>\n<p>Let <span class=\"math\">Σ̂ = {0̂, 1̂}<\/span>.<\/p>\n<p>Define <span class=\"math\">L′ = L(Σ<sup>*<\/sup> · Σ̂<sup>*<\/sup> · Σ<sup>*<\/sup>)<\/span>, a regular language (regex).<\/p>\n<p>Define <span class=\"math\">L″ = f(L) ∩ L′<\/span>, a regular language (closure under intersection).<\/p>\n<p>Note that <span class=\"math\">L₁ = L″<\/span>.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p>For every <span class=\"math\">p, q ∈ Q_A<\/span>, define <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> = {w | δ′_A(p, w) = q}<\/span>. We note that <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> is a regular language: we define <span class=\"math\">p<\/span> as an initial state and <span class=\"math\">q<\/span> as an accepting state and we get a DFA whose language is <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span>.<\/p>\n<p>Note that <span class=\"math\">L = ⋃<sub>p,q∈Q, f∈F<\/sub> L<sup>A<\/sup><sub>q_s,p<\/sub> · L<sup>A<\/sup><sub>p,q<\/sub> · L<sup>A<\/sup><sub>q,f<\/sub><\/span>.<\/p>\n<p>For every <span class=\"math\">p, q ∈ Q<\/span> define <span class=\"math\">L̂<sup>A<\/sup><sub>p,q<\/sub> = L<sup>A<\/sup><sub>p,q<\/sub> ∩ L<\/span>, a regular language (intersection of two regular languages).<\/p>\n<p>Note that for every <span class=\"math\">p, q ∈ Q<\/span> it holds that <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> ∖ {ε}<\/span> is also regular (set difference of two regular languages).<\/p>\n<p>Note that <span class=\"math\">L₂ = ⋃<sub>p,q∈Q, f∈F<\/sub> (L<sup>A<\/sup><sub>q_s,p<\/sub> ∖ {ε}) · L̂<sup>A<\/sup><sub>p,q<\/sub> · (L<sup>A<\/sup><sub>q,f<\/sub> ∖ {ε})<\/span>, which is also a regular language (finite union of concatenation of regular languages).<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>Solution 1:<\/b><\/p>\n<p>Define <span class=\"math\">L′ = {xŷz | |x| = |y|}<\/span> and note that <span class=\"math\">L₃ = L′ ∩ L₁<\/span>. Since <span class=\"math\">L₁<\/span> is regular (section 1.1), if we prove that <span class=\"math\">L′<\/span> is a context-free language then we prove that <span class=\"math\">L₃<\/span> is also a context-free language (intersection between a regular language and a context-free language).<\/p>\n<p>Define a context-free grammar <span class=\"math\">G = (V, Σ, S, R)<\/span> for <span class=\"math\">L′<\/span>:<\/p>\n<p><span class=\"math\">V = {S, A, B, C, D}<\/span>, <span class=\"math\">Σ = {0, 1, 0̂, 1̂}<\/span><\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span><span class=\"nt\">B<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → <span class=\"nt\">C<\/span><span class=\"nt\">A<\/span><span class=\"nt\">D<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → <span class=\"nt\">C<\/span><span class=\"nt\">B<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → 0 | 1<\/div>\n<div class=\"rule\"><span class=\"nt\">D<\/span> → 0̂ | 1̂<\/div>\n<\/div>\n<p>Therefore <span class=\"math\">L′<\/span> is a context-free language and <span class=\"math\">L₃ = L′ ∩ L₁<\/span> is also a context-free language.<\/p>\n<p><b>Solution 2:<\/b><\/p>\n<p>Let DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_{sA}, F_A)<\/span> such that <span class=\"math\">L(A) = L<\/span> (<span class=\"math\">L<\/span> is a regular language).<\/p>\n<p>Define PDA <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F_P)<\/span> as follows:<\/p>\n<p><span class=\"math\">Q_P = Q_A × {1,2,3} ⊎ {q_{sP}, f_P}<\/span>, <span class=\"math\">Σ_P = {0,1,0̂,1̂}<\/span>, <span class=\"math\">Γ = {x, $}<\/span> and <span class=\"math\">F_P = {f_P}<\/span>.<\/p>\n<ul>\n<li>We add the transition <span class=\"math\">δ_P(q_{sP}, ε, ε) = {((q_{sA},1), $)}<\/span> to the transition function of <span class=\"math\">P<\/span>.<\/li>\n<li><span class=\"math\">∀f ∈ F_A × {3}<\/span> we add the transition <span class=\"math\">δ_P(f, ε, $) = {(f_P, ε)}<\/span>.<\/li>\n<li><span class=\"math\">∀q ∈ Q_A<\/span> we add the transitions <span class=\"math\">δ_P((q,1), ε, ε) = {((q,2), ε)}<\/span> and <span class=\"math\">δ_P((q,2), ε, ε) = {((q,3), ε)}<\/span>.<\/li>\n<li>For each transition <span class=\"math\">δ_A(p, σ) = q<\/span> of <span class=\"math\">A<\/span> (with <span class=\"math\">p,q ∈ Q_A<\/span>, <span class=\"math\">σ ∈ Σ<\/span>) we add the transitions <span class=\"math\">δ_P((p,1), σ, ε) = {((q,1), x)}<\/span>, <span class=\"math\">δ_P((p,2), σ̂, x) = {((q,2), ε)}<\/span> and <span class=\"math\">δ_P((p,3), σ, ε) = {((q,3), ε)}<\/span>.<\/li>\n<\/ul>\n<p>Phase 1 reads <span class=\"math\">x<\/span> and pushes a counter symbol per letter; phase 2 reads <span class=\"math\">ŷ<\/span> and pops one symbol per letter (so <span class=\"math\">|x| = |y|<\/span>); phase 3 reads <span class=\"math\">z<\/span>. All three phases simulate <span class=\"math\">A<\/span> on the underlying word <span class=\"math\">xyz<\/span>, and acceptance requires ending in <span class=\"math\">F_A<\/span> with an empty stack marker.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מכך ש-<span class=\"math\">L ∉ coRE<\/span> (ראו ההוכחה המלאה בסעיף ההוכחה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ RE<\/span> — בונים מזהה בשיטת ה-dovetailing (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_{M,w}, D⟩<\/span> where:<\/p>\n<pre>D: \"On input x:\n1. If x = \"00\", accept.\n2. Otherwise, reject.\"\n\nN_{M,w}: \"On input x:\n1. Run M on w.\n2. If M accepts, reject.\n3. Otherwise, loop.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(D) = {00}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function: to compute <span class=\"math\">f<\/span> all that needs to be done is to encode the description (string) of the TM <span class=\"math\">N_{M,w}<\/span> and the DFA <span class=\"math\">D<\/span>. The strings are of finite length and the encoding process takes finite time, and eventually the TM halts with the output <span class=\"math\">⟨N_{M,w}, D⟩<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span>, therefore <span class=\"math\">N_{M,w}<\/span> rejects (and halts) on every <span class=\"math\">x, y ∈ Σ<sup>*<\/sup><\/span>; in particular <span class=\"math\">N_{M,w}<\/span> halts on <span class=\"math\">x = 0<\/span> and rejects <span class=\"math\">y = 0<\/span>, and <span class=\"math\">xy = 00 ∈ L(D)<\/span>. Therefore <span class=\"math\">f(⟨M,w⟩) = ⟨N_{M,w}, D⟩ ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> does not accept <span class=\"math\">w<\/span>, therefore <span class=\"math\">N_{M,w}<\/span> does not halt on any <span class=\"math\">x ∈ Σ<sup>*<\/sup><\/span>. Therefore <span class=\"math\">∄x ∈ Σ<sup>*<\/sup><\/span> such that <span class=\"math\">N_{M,w}<\/span> halts on <span class=\"math\">x<\/span>, and <span class=\"math\">f(⟨M,w⟩) = ⟨N_{M,w}, D⟩ ∉ L<\/span>.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∈ RE<\/span>:<\/b> we construct a recognizer <span class=\"math\">M_L<\/span> for <span class=\"math\">L<\/span>.<\/p>\n<pre>M_L: \"On input ⟨M, D⟩:\n1. For i from 0 to ∞:\n   1.1. For j from 0 to i:\n      1.1.1. For every x ∈ Σ^j in lexicographical order:\n         1.1.1.1. Run M on x for i steps.\n         1.1.1.2. If M accepted or rejected (halted) x:\n            1.1.1.2.1. For h from 0 to i:\n               1.1.1.2.1.1. For every y ∈ Σ^h in lexicographical order:\n                  1.1.1.2.1.1.1. Run M on y for i steps.\n                  1.1.1.2.1.1.2. If M rejected y:\n                     1.1.1.2.1.1.2.1. Run D on xy.\n                     1.1.1.2.1.1.2.2. If D accepted xy, accept.\"<\/pre>\n<ul>\n<li><span class=\"math\">⟨M,D⟩ ∈ L<\/span>: there exist words <span class=\"math\">x, y ∈ Σ<sup>*<\/sup><\/span> such that <span class=\"math\">M<\/span> halts on <span class=\"math\">x<\/span> and rejects <span class=\"math\">y<\/span>, and <span class=\"math\">D<\/span> accepts <span class=\"math\">xy<\/span>. Among all such pairs consider the one minimizing <span class=\"math\">k = max{k_x, k_y}<\/span>, where <span class=\"math\">k_x, k_y<\/span> are the number of steps in which <span class=\"math\">M<\/span> halts on <span class=\"math\">x<\/span> and rejects <span class=\"math\">y<\/span> respectively (ties broken by length and lexicographic order of <span class=\"math\">x<\/span>, then of <span class=\"math\">y<\/span>). For every iteration <span class=\"math\">i &lt; k<\/span>, every candidate pair fails at least one of the three conditions, so nothing is accepted early; at iteration <span class=\"math\">i = k<\/span> the machine runs <span class=\"math\">M<\/span> on <span class=\"math\">x<\/span> and on <span class=\"math\">y<\/span> for <span class=\"math\">k<\/span> steps, sees the halt and the rejection, runs <span class=\"math\">D<\/span> on <span class=\"math\">xy<\/span> and accepts. Therefore after a finite number of steps <span class=\"math\">M_L<\/span> accepts <span class=\"math\">⟨M,D⟩<\/span>.<\/li>\n<li><span class=\"math\">⟨M,D⟩ ∉ L<\/span>: for every pair <span class=\"math\">x, y ∈ Σ<sup>*<\/sup><\/span> one of the following holds — <span class=\"math\">M<\/span> does not halt on <span class=\"math\">x<\/span>, <span class=\"math\">M<\/span> does not reject <span class=\"math\">y<\/span>, or <span class=\"math\">D<\/span> does not accept <span class=\"math\">xy<\/span>. Therefore <span class=\"math\">M_L<\/span> never reaches an accepting iteration.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L<\/span> is regular, and thus the pumping lemma for regular languages holds for <span class=\"math\">L<\/span>. Let <span class=\"math\">n<\/span> be the number promised by the lemma.<\/p>\n<p>We choose the word <span class=\"math\">w = a<sup>2n<\/sup>ba<sup>n<\/sup>b<\/span>. We have <span class=\"math\">w ∈ L<\/span> and <span class=\"math\">|w| ≥ n<\/span>, so by the lemma <span class=\"math\">w = xyz<\/span> such that conditions 1, 2, 3 hold.<\/p>\n<p>Denote <span class=\"math\">x = a<sup>s<\/sup><\/span>, <span class=\"math\">y = a<sup>t<\/sup><\/span>, where <span class=\"math\">s + t ≤ n<\/span> and <span class=\"math\">t &gt; 0<\/span> (conditions 1 and 2 — <span class=\"math\">xy<\/span> lies inside the first block of <span class=\"math\">a<\/span>'s).<\/p>\n<p>Consider <span class=\"math\">w₀ = xy<sup>0<\/sup>z = a<sup>2n−t<\/sup>ba<sup>n<\/sup>b<\/span>.<\/p>\n<p>As <span class=\"math\">t &gt; 0<\/span> we have <span class=\"math\">2n − t &lt; 2n<\/span>, therefore <span class=\"math\">w₀ ∉ L<\/span> — in contradiction to condition 3 of the lemma. Thus <span class=\"math\">L<\/span> is nonregular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">G = (V, Σ, S, R)<\/span> with <span class=\"math\">V = {S, A, B, C, D}<\/span>, <span class=\"math\">Σ = {a, b, c}<\/span>:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span><span class=\"nt\">C<\/span> | <span class=\"nt\">D<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → a<span class=\"nt\">A<\/span>b | a<span class=\"nt\">A<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → b<span class=\"nt\">B<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → c<span class=\"nt\">C<\/span> | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">D<\/span> → a<span class=\"nt\">D<\/span>c | a<span class=\"nt\">D<\/span> | <span class=\"nt\">B<\/span><\/div>\n<\/div>\n<p>The branch <span class=\"math\">S → AC<\/span> generates words with <span class=\"math\">i ≥ j<\/span> (every <span class=\"math\">b<\/span> is matched by an <span class=\"math\">a<\/span>), and the branch <span class=\"math\">S → D<\/span> generates words with <span class=\"math\">i ≥ k<\/span> (every <span class=\"math\">c<\/span> is matched by an <span class=\"math\">a<\/span>, with the free <span class=\"math\">b<\/span>-block in the middle) — together exactly <span class=\"math\">i ≥ min{j,k}<\/span>.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p>Let <span class=\"math\">w = abc ∈ L<\/span>. It has two different parse trees (equivalently, two different leftmost derivations), one through each branch of <span class=\"math\">S<\/span>:<\/p>\n<div class=\"cols2\">\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul>\n  <li><span class=\"nt\">A<\/span><ul><li>a<\/li><li><span class=\"nt\">A<\/span><ul><li>ε<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li>\n  <li><span class=\"nt\">C<\/span><ul><li>c<\/li><li><span class=\"nt\">C<\/span><ul><li>ε<\/li><\/ul><\/li><\/ul><\/li>\n<\/ul><\/li><\/ul><\/div>\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul>\n  <li><span class=\"nt\">D<\/span><ul><li>a<\/li><li><span class=\"nt\">D<\/span><ul><li><span class=\"nt\">B<\/span><ul><li>b<\/li><li><span class=\"nt\">B<\/span><ul><li>ε<\/li><\/ul><\/li><\/ul><\/li><\/ul><\/li><li>c<\/li><\/ul><\/li>\n<\/ul><\/li><\/ul><\/div>\n<\/div>\n<p><span class=\"math\">S ⇒ AC ⇒ aAbC ⇒ abC ⇒ abcC ⇒ abc<\/span> &nbsp;versus&nbsp; <span class=\"math\">S ⇒ D ⇒ aDc ⇒ aBc ⇒ abBc ⇒ abc<\/span>.<\/p>\n<p>Two distinct parse trees for the same word — the grammar is ambiguous.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example:<\/p>\n<p>Let <span class=\"math\">M_{loop}<\/span> be the following machine — <span class=\"math\">M_{loop}<\/span>: “On input <span class=\"math\">x<\/span>: loop.”<\/p>\n<p>Then <span class=\"math\">A = {⟨M, w⟩ | M is a TM, ⟨M⟩ = ⟨M_{loop}⟩ and w ∈ Σ<sup>*<\/sup>}<\/span> is an infinite language, <span class=\"math\">A ⊆ <span class=\"comp\">HALT<sub>TM<\/sub><\/span><\/span> (the machine <span class=\"math\">M_{loop}<\/span> halts on no input), and <span class=\"math\">A ∈ R<\/span> — a decider only needs to check that the input is of the form <span class=\"math\">⟨M, w⟩<\/span> and that <span class=\"math\">⟨M⟩ = ⟨M_{loop}⟩<\/span>, a syntactic check.<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> <span class=\"math\">L ∈ R<\/span>.<\/p>\n<p>Note that <span class=\"math\">∀L′ ∈ RE<\/span> it holds that <span class=\"math\">L′ ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span>: take <span class=\"math\">f(w) = ⟨N⟩<\/span> where:<\/p>\n<pre>N: \"On input x:\nRun M_{L'} (the recognizer of L') on w, and answer as M_{L'} does.\"<\/pre>\n<p><span class=\"math\">f<\/span> is a computable function: to compute <span class=\"math\">f<\/span> all that needs to be done is to encode the description (string) of the TM <span class=\"math\">N<\/span> — a finite string produced in finite time.<\/p>\n<p><span class=\"math\">w ∈ L′<\/span> iff <span class=\"math\">M_{L′}<\/span> accepts <span class=\"math\">w<\/span> iff <span class=\"math\">L(N) = Σ<sup>*<\/sup><\/span> iff <span class=\"math\">⟨N⟩ ∈ <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span> (and when <span class=\"math\">w ∉ L′<\/span>, <span class=\"math\">N<\/span> accepts nothing and <span class=\"math\">L(N) = ∅<\/span>).<\/p>\n<p>Now, since for every TM <span class=\"math\">M<\/span> the language <span class=\"math\">L(M)<\/span> is in <span class=\"math\">RE<\/span>, it holds that <span class=\"math\">L(M) ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span><\/span> for <b>every<\/b> TM <span class=\"math\">M<\/span>.<\/p>\n<p>Therefore <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ≤<sub>m<\/sub> <span class=\"comp\">E<sub>TM<\/sub><\/span>} = {⟨M⟩ | M is a TM}<\/span>, which we know is in <span class=\"math\">R<\/span> (a syntactic check of a valid TM encoding). In particular <span class=\"math\">L ∉ RE ∖ R<\/span>.<\/p>\n<\/div>"}]},{"id":"2024b","year":2024,"moed":"ב","label":"2024 — מועד ב'","lang":"he","combined":false,"meta":{"date":"אביב 2024","duration":"3 שעות","staff":"ד\"ר רעות לוי","totalPoints":100,"note":"אם לא מצוין אחרת: תיאורים של מכונות טיורינג צריכים להיות ב-high-level, ומותר להסתמך ללא הוכחה על כל טענה שהוצגה בכיתה, בתרגול או בשיעורי הבית. רשימת הגדרות (דף נוסחאות) מצורפת למבחן."},"questions":[{"n":"1","heading":"שאלה 1 (5, 15, 15 נקודות)","points":35,"intro":"","parts":[{"pid":"q1a","label":"1","kind":"open","rows":5,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">Σ = {0,1}<\/span>.<\/p><p dir=\"auto\"><b>הגדר הצבה רגולרית<\/b> <span class=\"math\">f<\/span> ל-<span class=\"math\">Σ<\/span> כך שלכל <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> יתקיים ש-<\/p><div class=\"lang-def\">f(L) = {ε}&nbsp; if L ≠ ∅&nbsp;&nbsp;;&nbsp;&nbsp; f(L) = ∅&nbsp; otherwise<\/div>","tags":{"subj":"closure","qt":"construction"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן שפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>, תהי:<\/p><div class=\"lang-def\">Op₁(L) = {z<sup>R<\/sup>x | xyz ∈ L}&nbsp;,&nbsp; x, y, z ∈ Σ<sup>*<\/sup><\/div><p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L<\/span> שפה רגולרית אזי <span class=\"math\">Op₁(L)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">בהינתן שפה <span class=\"math\">L<\/span> מעל <span class=\"math\">Σ = {0,1}<\/span>, תהי:<\/p><div class=\"lang-def\">Op₂(L) = {xyzy<sup>R<\/sup> | xyz ∈ L}&nbsp;,&nbsp; x, y, z ∈ Σ<sup>*<\/sup><\/div><p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L<\/span> היא שפה רגולרית אזי <span class=\"math\">Op₂(L)<\/span> היא שפה <b>חסרת הקשר<\/b>.<\/p>","tags":{"subj":"closure","qt":"proof"}}]},{"n":"2","heading":"שאלה 2 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, N⟩ | M and N are TMs, ∃x ∈ Σ<sup>*<\/sup> s.t. M accepts x&nbsp; <b>or<\/b>&nbsp; N accepts all inputs}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 5 נקודות)","points":25,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":7,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">Σ = {0,1}<\/span>. בהינתן מחרוזת <span class=\"math\">w ∈ Σ<sup>*<\/sup><\/span>, נגדיר ב-<span class=\"math\">w<sub>i<\/sub><\/span> את התו ה-<span class=\"math\">i<\/span> של <span class=\"math\">w<\/span>. תהי:<\/p><div class=\"lang-def\">L = {ww<sup>R<\/sup> | w ∈ Σ<sup>+<\/sup> and w₁ ≠ 1}<\/div><p dir=\"auto\"><b>הוכיחו:<\/b> ‏<span class=\"math\">L<\/span> שפה <b>חסרת הקשר<\/b>.<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3b","label":"2","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | i ≥ min{j,k}}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו:<\/b> ‏<span class=\"math\">L<\/span> <b>איננה<\/b> שפה רגולרית.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3c","label":"3","kind":"open","rows":8,"prompt":"<p dir=\"auto\"><b>בנו <span class=\"en\">PDA<\/span>‏, ע\"י ציור של דיאגרמת מצבים,<\/b> שמזהה את השפה הבאה:<\/p><div class=\"lang-def\">L = {x ∈ {0,1}<sup>*<\/sup> | #₀(x) = #₁(x)}<\/div>","tags":{"subj":"pda","qt":"construction"}},{"pid":"q3d","label":"4","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L ⊆ Σ<sup>*<\/sup><\/span> שפה כלשהי.<\/p><p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">L ≤<sub>m<\/sub> <span class=\"comp\">L<\/span><\/span> אזי מתקיים ש-<span class=\"math\">L<\/span> שפה סופית או ש-<span class=\"math\">L ∉ R<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3e","label":"5","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ≠ PAL<sub>TM<\/sub>}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> לפי משפט <span class=\"en\">Rice<\/span>‏ השפה <span class=\"math\">L<\/span> איננה כריעה.<\/p>","tags":{"subj":"rice","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">f(0) = {ε}<\/span>,&nbsp; <span class=\"math\">f(1) = {ε}<\/span>.<\/p>\n<p>Every letter is replaced by the language <span class=\"math\">{ε}<\/span>, so every word of <span class=\"math\">L<\/span> is mapped to <span class=\"math\">ε<\/span>: if <span class=\"math\">L ≠ ∅<\/span> then <span class=\"math\">f(L) = {ε}<\/span>, and if <span class=\"math\">L = ∅<\/span> there is nothing to substitute, so <span class=\"math\">f(L) = ∅<\/span>.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p>Since <span class=\"math\">L<\/span> is a regular language there exists a DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_s, F)<\/span> such that <span class=\"math\">L(A) = L<\/span>.<\/p>\n<p>For every <span class=\"math\">p, q ∈ Q_A<\/span>, define <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> = {w | δ′_A(p,w) = q}<\/span> — a regular language (take <span class=\"math\">p<\/span> as initial state and <span class=\"math\">q<\/span> as the only accepting state).<\/p>\n<p>Note that <span class=\"math\">L = ⋃<sub>p,q∈Q, f∈F<\/sub> L<sup>A<\/sup><sub>q_s,p<\/sub> · L<sup>A<\/sup><sub>p,q<\/sub> · L<sup>A<\/sup><sub>q,f<\/sub><\/span>.<\/p>\n<p>Since <span class=\"math\">L<sup>A<\/sup><sub>q,f<\/sub><\/span> is regular, <span class=\"math\">(L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> = {w | w<sup>R<\/sup> ∈ L<sup>A<\/sup><sub>q,f<\/sub>}<\/span> is also regular (closure under reverse).<\/p>\n<p>Note that <span class=\"math\">f(L<sup>A<\/sup><sub>p,q<\/sub>) = {ε}<\/span> if <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub> ≠ ∅<\/span> and <span class=\"math\">∅<\/span> otherwise, where <span class=\"math\">f<\/span> is the regular substitution from section 1.1; <span class=\"math\">f(L<sup>A<\/sup><sub>p,q<\/sub>)<\/span> is regular (closure under regular substitution).<\/p>\n<p>Note that:<\/p>\n<div class=\"lang-def\">Op₁(L) = ⋃<sub>p,q∈Q, f∈F<\/sub> (L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> · L<sup>A<\/sup><sub>q_s,p<\/sub> · f(L<sup>A<\/sup><sub>p,q<\/sub>)<\/div>\n<p>which is a regular language (finite union of concatenations of regular languages).<\/p>\n<p>The concatenation with <span class=\"math\">f(L<sup>A<\/sup><sub>p,q<\/sub>)<\/span> is needed to handle the case that <span class=\"math\">A<\/span> has no path from <span class=\"math\">p<\/span> to <span class=\"math\">q<\/span> (concatenating with <span class=\"math\">{ε}<\/span> keeps the language; concatenating with <span class=\"math\">∅<\/span> empties it). For example, in the following DFA:<\/p>\n<div class=\"fsa\"><svg viewBox=\"0 0 450 110\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n  <circle class=\"st\" cx=\"55\" cy=\"55\" r=\"24\"\/><text class=\"slbl\" x=\"55\" y=\"55\">q_s<\/text>\n  <circle class=\"st\" cx=\"180\" cy=\"55\" r=\"24\"\/><text class=\"slbl\" x=\"180\" y=\"55\">p<\/text>\n  <path class=\"tr\" d=\"M79,55 L152,55\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"115\" y=\"45\" text-anchor=\"middle\">0,1<\/text>\n  <circle class=\"st\" cx=\"285\" cy=\"55\" r=\"24\"\/><text class=\"slbl\" x=\"285\" y=\"55\">q<\/text>\n  <circle class=\"st st-acc\" cx=\"405\" cy=\"55\" r=\"20\"\/>\n  <circle class=\"st st-acc\" cx=\"405\" cy=\"55\" r=\"25\"\/><text class=\"slbl\" x=\"405\" y=\"55\">f<\/text>\n  <path class=\"tr\" d=\"M309,55 L376,55\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"342\" y=\"45\" text-anchor=\"middle\">0,1<\/text>\n<\/svg><div class=\"fsa-cap\">‏L(A) = ∅, ואין מסלול מ-p ל-q<\/div><\/div>\n<p><span class=\"math\">L(A) = ∅<\/span> but <span class=\"math\">⋃ (L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> · L<sup>A<\/sup><sub>q_s,p<\/sub> = {00,01,10,11} ≠ Op₁(L(A))<\/span>, while with the extra factor <span class=\"math\">⋃ (L<sup>A<\/sup><sub>q,f<\/sub>)<sup>R<\/sup> · L<sup>A<\/sup><sub>q_s,p<\/sub> · f(L<sup>A<\/sup><sub>p,q<\/sub>) = ∅ = Op₁(L(A))<\/span>.<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p><b>Solution 1 (PDA):<\/b><\/p>\n<p>Let DFA <span class=\"math\">A = (Q_A, Σ, δ_A, q_{sA}, F_A)<\/span> such that <span class=\"math\">L(A) = L<\/span>.<\/p>\n<p>Define PDA <span class=\"math\">P = (Q_P, Σ_P, Γ_P, δ_P, q_{sP}, F_P)<\/span>:<\/p>\n<p><span class=\"math\">Q_P = Q_A × {1,2,3} ⊎ {q_{sP}, q′, f_P}<\/span>, <span class=\"math\">Σ_P = {0,1}<\/span>, <span class=\"math\">Γ = {0,1,$}<\/span>, <span class=\"math\">F_P = {f_P}<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ_P(q_{sP}, ε, ε) = {((q_{sA},1), $)}<\/span> — push a bottom marker.<\/li>\n<li>Phase 1 (<span class=\"math\">×1<\/span>): simulate <span class=\"math\">A<\/span> on <span class=\"math\">x<\/span> without touching the stack: <span class=\"math\">δ_P((p,1), σ, ε) = {((q,1), ε)}<\/span> for every <span class=\"math\">δ_A(p,σ)=q<\/span>.<\/li>\n<li>Phase 2 (<span class=\"math\">×2<\/span>): simulate <span class=\"math\">A<\/span> on <span class=\"math\">y<\/span> while <b>pushing<\/b> each letter: <span class=\"math\">δ_P((p,2), σ, ε) = {((q,2), σ)}<\/span>.<\/li>\n<li>Phase 3 (<span class=\"math\">×3<\/span>): simulate <span class=\"math\">A<\/span> on <span class=\"math\">z<\/span> without stack: <span class=\"math\">δ_P((p,3), σ, ε) = {((q,3), ε)}<\/span>.<\/li>\n<li>Phase changes: <span class=\"math\">∀q ∈ Q_A<\/span>: <span class=\"math\">δ_P((q,1), ε, ε) = {((q,2), ε)}<\/span> and <span class=\"math\">δ_P((q,2), ε, ε) = {((q,3), ε)}<\/span>.<\/li>\n<li><span class=\"math\">∀f ∈ F_A × {3}<\/span>: <span class=\"math\">δ_P(f, ε, ε) = {(q′, ε)}<\/span> — after <span class=\"math\">xyz ∈ L<\/span> was verified, match the suffix: <span class=\"math\">δ_P(q′, 0, 0) = {(q′, ε)}<\/span>, <span class=\"math\">δ_P(q′, 1, 1) = {(q′, ε)}<\/span> (reading <span class=\"math\">y<sup>R<\/sup><\/span> against the pushed <span class=\"math\">y<\/span>), and <span class=\"math\">δ_P(q′, ε, $) = {(f_P, ε)}<\/span>.<\/li>\n<\/ul>\n<p><b>Solution 2 (closures):<\/b><\/p>\n<p>Define a regular substitution <span class=\"math\">f<\/span> over <span class=\"math\">{0,1}<\/span>: <span class=\"math\">f(0) = {0, 0′}<\/span>, <span class=\"math\">f(1) = {1, 1′}<\/span>. <span class=\"math\">f(L)<\/span> is regular.<\/p>\n<p>Let <span class=\"math\">Σ′ = {0′, 1′}<\/span>, <span class=\"math\">L′ = L(Σ<sup>*<\/sup> · Σ′<sup>*<\/sup> · Σ<sup>*<\/sup>)<\/span> (regex), and <span class=\"math\">L″ = f(L) ∩ L′<\/span> — regular (intersection); the marked block is exactly the <span class=\"math\">y<\/span> part.<\/p>\n<p>Let <span class=\"math\">L‴ = L(Σ′<sup>*<\/sup>)<\/span> and <span class=\"math\">L<sup>#<\/sup> = L″ · L‴<\/span> — regular (concatenation).<\/p>\n<p>Construct a CFG <span class=\"math\">G = (V, Σ̂, S, R)<\/span> for <span class=\"math\">{uvwv<sup>R<\/sup> | u, w ∈ Σ<sup>*<\/sup> and v ∈ Σ′<sup>*<\/sup>}<\/span>:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">A<\/span><span class=\"nt\">B<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → <span class=\"nt\">C<\/span><span class=\"nt\">A<\/span> | ε&nbsp;&nbsp;(= Σ<sup>*<\/sup>)<\/div>\n<div class=\"rule\"><span class=\"nt\">B<\/span> → 0′<span class=\"nt\">B<\/span>0′ | 1′<span class=\"nt\">B<\/span>1′ | <span class=\"nt\">A<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">C<\/span> → 0 | 1<\/div>\n<\/div>\n<p><span class=\"math\">V = {S,A,B,C}<\/span>, <span class=\"math\">Σ̂ = {0,1,0′,1′}<\/span>.<\/p>\n<p>Define <span class=\"math\">L<sup>##<\/sup> = L<sup>#<\/sup> ∩ L(G)<\/span> — context-free (intersection of a CFL with a regular language).<\/p>\n<p>Define a regular substitution <span class=\"math\">g<\/span> over <span class=\"math\">Σ̂<\/span>: <span class=\"math\">g(0) = g(0′) = {0}<\/span>, <span class=\"math\">g(1) = g(1′) = {1}<\/span> (erase the marks).<\/p>\n<p>Note that <span class=\"math\">Op₂(L) = g(L<sup>##<\/sup>)<\/span> — context-free (closure of CFL under substitution).<\/p>\n<p><b>Example:<\/b> for <span class=\"math\">L = {010, 110}<\/span>: <span class=\"math\">f(L)<\/span> marks any subset of positions; <span class=\"math\">L″<\/span> keeps only words where the marked positions are one contiguous block; <span class=\"math\">L<sup>#<\/sup><\/span> appends a marked tail; <span class=\"math\">L<sup>##<\/sup><\/span> forces the tail to be the reverse of the marked block; and <span class=\"math\">g<\/span> erases the marks — leaving exactly <span class=\"math\">Op₂(L) ⊇ {010, 0100, 0101, 01010, 01001, 010010, …}<\/span>.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ RE<\/span> — כי <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>.<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_∅, N_{M,w}⟩<\/span> where:<\/p>\n<pre>N_∅: \"On input x: Reject.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(N_∅) = ∅<\/span>, that is <span class=\"math\">∄x ∈ Σ<sup>*<\/sup><\/span> such that <span class=\"math\">N_∅<\/span> accepts <span class=\"math\">x<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function: encoding the two fixed-form machines is a finite-time syntactic operation.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span>, so <span class=\"math\">N_{M,w}<\/span> accepts every <span class=\"math\">x ∈ Σ<sup>*<\/sup><\/span> — the second condition holds, so <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">N_{M,w}<\/span> does not accept every <span class=\"math\">x<\/span> (it never accepts), and no <span class=\"math\">x<\/span> is accepted by <span class=\"math\">N_∅<\/span> — neither condition holds, so <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∉ RE<\/span>:<\/b> we show <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ∉ RE<\/span>, therefore <span class=\"math\">L ∉ RE<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_∅, N_{M,w}⟩<\/span> where:<\/p>\n<pre>N_∅: \"On input x: Reject.\"\n\nN_{M,w}: \"On input x:\n1. Run M on w for |x| steps.\n2. If M didn't accept w during these steps, accept.\n3. Otherwise, reject.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M,w⟩ ∈ <span class=\"comp\">A<sub>TM<\/sub><\/span><\/span>: <span class=\"math\">M<\/span> doesn't accept <span class=\"math\">w<\/span>, so for every <span class=\"math\">x<\/span>, <span class=\"math\">M<\/span> doesn't accept <span class=\"math\">w<\/span> within <span class=\"math\">|x|<\/span> steps, and <span class=\"math\">N_{M,w}<\/span> accepts <span class=\"math\">x<\/span> in line 2. Hence <span class=\"math\">N_{M,w}<\/span> accepts all inputs and <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">M<\/span> accepts <span class=\"math\">w<\/span> within some finite <span class=\"math\">k<\/span> steps. For <span class=\"math\">|x| &lt; k<\/span>, <span class=\"math\">N_{M,w}<\/span> accepts <span class=\"math\">x<\/span>; for <span class=\"math\">|x| ≥ k<\/span> it rejects. Therefore <span class=\"math\">L(N_{M,w}) = ⋃<sub>n&lt;k<\/sub> Σ<sup>n<\/sup> ≠ Σ<sup>*<\/sup><\/span> — it does not accept all inputs. In addition <span class=\"math\">∄x<\/span> accepted by <span class=\"math\">N_∅<\/span>. So <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>We construct a context-free grammar <span class=\"math\">G = (V, Σ, S, R)<\/span> such that <span class=\"math\">L(G) = L<\/span>:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → 0<span class=\"nt\">A<\/span>0<\/div>\n<div class=\"rule\"><span class=\"nt\">A<\/span> → 0<span class=\"nt\">A<\/span>0 | 1<span class=\"nt\">A<\/span>1 | ε<\/div>\n<\/div>\n<p><span class=\"math\">V = {S,A}<\/span>, <span class=\"math\">Σ = {0,1}<\/span>.<\/p>\n<p>The first character is forced to be <span class=\"math\">0<\/span> (i.e. <span class=\"math\">w₁ ≠ 1<\/span>), and every letter is mirrored around the center — exactly the even palindromes <span class=\"math\">ww<sup>R<\/sup><\/span> with <span class=\"math\">w ∈ Σ<sup>+<\/sup><\/span> starting with <span class=\"math\">0<\/span>.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L<\/span> is regular, and thus the pumping lemma for regular languages holds for <span class=\"math\">L<\/span>. Let <span class=\"math\">n<\/span> be the number promised by the lemma.<\/p>\n<p>We choose the string <span class=\"math\">w = a<sup>n<\/sup>b<sup>n<\/sup>c<sup>n<\/sup><\/span> (here <span class=\"math\">i = n ≥ min{n,n}<\/span>, so <span class=\"math\">w ∈ L<\/span>, and <span class=\"math\">|w| ≥ n<\/span>).<\/p>\n<p>By the lemma <span class=\"math\">w = xyz<\/span> with conditions 1–3. Denote <span class=\"math\">x = a<sup>s<\/sup><\/span>, <span class=\"math\">y = a<sup>t<\/sup><\/span>, where <span class=\"math\">s + t ≤ n<\/span> and <span class=\"math\">t &gt; 0<\/span>.<\/p>\n<p>Consider <span class=\"math\">w₀ = xy<sup>0<\/sup>z = a<sup>n−t<\/sup>b<sup>n<\/sup>c<sup>n<\/sup><\/span>.<\/p>\n<p>As <span class=\"math\">t &gt; 0<\/span> we have <span class=\"math\">n − t &lt; n = min{j,k}<\/span>, therefore <span class=\"math\">w₀ ∉ L<\/span> — contradicting condition 3. Thus <span class=\"math\">L<\/span> is not a regular language.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<div class=\"fsa\"><svg viewBox=\"0 0 470 300\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\">\n  <path class=\"tr\" d=\"M10,150 L38,150\" marker-end=\"url(#arr)\"\/>\n  <circle class=\"st\" cx=\"65\" cy=\"150\" r=\"25\"\/><text class=\"slbl\" x=\"65\" y=\"150\">q_s<\/text>\n  <circle class=\"st\" cx=\"205\" cy=\"150\" r=\"25\"\/><text class=\"slbl\" x=\"205\" y=\"150\">q₁<\/text>\n  <circle class=\"st\" cx=\"385\" cy=\"150\" r=\"25\"\/><text class=\"slbl\" x=\"385\" y=\"150\">q₂<\/text>\n  <circle class=\"st st-acc\" cx=\"295\" cy=\"255\" r=\"20\"\/>\n  <circle class=\"st st-acc\" cx=\"295\" cy=\"255\" r=\"25\"\/><text class=\"slbl\" x=\"295\" y=\"255\">q₃<\/text>\n  <path class=\"tr\" d=\"M90,150 L177,150\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"133\" y=\"140\" text-anchor=\"middle\">ε,ε→$<\/text>\n  <path class=\"tr\" d=\"M193,127 C178,88 232,88 217,127\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"205\" y=\"80\" text-anchor=\"middle\">0,ε→x<\/text>\n  <text class=\"lbl\" x=\"205\" y=\"97\" text-anchor=\"middle\">1,x→ε<\/text>\n  <path class=\"tr\" d=\"M373,127 C358,88 412,88 397,127\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"385\" y=\"80\" text-anchor=\"middle\">1,ε→x<\/text>\n  <text class=\"lbl\" x=\"385\" y=\"97\" text-anchor=\"middle\">0,x→ε<\/text>\n  <path class=\"tr\" d=\"M230,143 C280,128 310,128 360,143\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"295\" y=\"125\" text-anchor=\"middle\">ε,$→$<\/text>\n  <path class=\"tr\" d=\"M360,160 C310,178 280,178 230,160\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"295\" y=\"190\" text-anchor=\"middle\">ε,$→$<\/text>\n  <path class=\"tr\" d=\"M222,170 C240,205 255,225 272,240\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"222\" y=\"225\" text-anchor=\"middle\">ε,$→ε<\/text>\n  <path class=\"tr\" d=\"M368,170 C350,205 335,225 318,240\" marker-end=\"url(#arr)\"\/>\n  <text class=\"lbl\" x=\"368\" y=\"225\" text-anchor=\"middle\">ε,$→ε<\/text>\n<\/svg><div class=\"fsa-cap\">‏q₁ — עודף זמני של אפסים במחסנית; q₂ — עודף זמני של אחדות; קבלה רק כשהמחסנית חזרה ל-$ בלבד<\/div><\/div>\n<p>The stack keeps the current surplus: in <span class=\"math\">q₁<\/span> each <span class=\"math\">0<\/span> pushes <span class=\"math\">x<\/span> and each <span class=\"math\">1<\/span> pops; in <span class=\"math\">q₂<\/span> the roles are reversed. The <span class=\"math\">ε,$→$<\/span> moves switch sides only when the surplus is empty, and <span class=\"math\">ε,$→ε<\/span> accepts exactly when <span class=\"math\">#₀(x) = #₁(x)<\/span>.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b><\/p>\n<p><b>Option 1:<\/b> as we proved in exercise 10, there is always a mapping reduction from any decidable language to any non-trivial language. Hence any infinite, non-trivial, decidable language <span class=\"math\">L<\/span> is a counter example.<\/p>\n<p><b>Option 2 (explicit counter example):<\/b> <span class=\"math\">L = {w ∈ Σ<sup>*<\/sup> | |w| is even}<\/span> — an infinite decidable language (accept iff <span class=\"math\">|x|<\/span> is even). Then <span class=\"math\"><span class=\"comp\">L<\/span> = {w | |w| is odd}<\/span>, and <span class=\"math\">L ≤<sub>m<\/sub> <span class=\"comp\">L<\/span><\/span> via <span class=\"math\">f(w) = 1w<\/span> (appending a letter flips the parity: <span class=\"math\">w ∈ L ⟺ 1w ∈ <span class=\"comp\">L<\/span><\/span>).<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> <span class=\"math\">L ∈ R<\/span>.<\/p>\n<p>Since <span class=\"math\">PAL<sub>TM<\/sub> ∉ RE<\/span> (we showed in the recitation <span class=\"math\"><span class=\"comp\">A<sub>TM<\/sub><\/span> ≤<sub>m<\/sub> PAL<sub>TM<\/sub><\/span> and <span class=\"math\">E<sub>TM<\/sub> ≤<sub>m<\/sub> PAL<sub>TM<\/sub><\/span>), it holds for <b>every<\/b> TM <span class=\"math\">M<\/span> that <span class=\"math\">L(M) ≠ PAL<sub>TM<\/sub><\/span> — because <span class=\"math\">L(M) ∈ RE<\/span> by definition.<\/p>\n<p>Therefore <span class=\"math\">L<\/span> can be rewritten as <span class=\"math\">L = {⟨M⟩ | M is a TM}<\/span>, which is obviously in <span class=\"math\">R<\/span>.<\/p>\n<p>(The claim \"by Rice's theorem\" fails: the property <span class=\"math\">L(M) ≠ PAL<sub>TM<\/sub><\/span> is <b>trivial<\/b> over RE — it holds for all recognizable languages — so Rice's theorem does not apply.)<\/p>\n<\/div>"}]},{"id":"ai1","year":2026,"moed":"AI","label":"מבחן תרגול AI 1","lang":"he","combined":false,"meta":{"date":"","duration":"3 שעות","staff":"נוצר על ידי AI — במתכונת מבחני 2023–2024 של ד\"ר רעות לוי","totalPoints":100,"note":"מבחן תרגול במתכונת המדויקת של מבחני 2023–2024: שאלה 1 — סגירויות ובניות, שאלה 2 — R\/RE\/coRE, שאלה 3 — חמישה סעיפים קצרים. פתרון מלא לכל סעיף."},"questions":[{"n":"1","heading":"שאלה 1 (7, 14, 14 נקודות)","points":35,"intro":"<p dir=\"auto\">עבור מילה <span class=\"math\">w = σ₁σ₂…σ<sub>n<\/sub><\/span> (‏<span class=\"math\">n ≥ 1<\/span>) נגדיר את הרוטציה השמאלית <span class=\"math\">Rot(w) = σ₂σ₃…σ<sub>n<\/sub>σ₁<\/span>, ועבור שפה: <span class=\"math\">Rot(L) = {Rot(w) | w ∈ L, w ≠ ε}<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":8,"prompt":"<p dir=\"auto\">בהינתן <span class=\"en\">DFA<\/span>‏ <span class=\"math\">A = (Q, Σ, δ, q<sub>s<\/sub>, F)<\/span> עבור שפה <span class=\"math\">L<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו ע\"י שימוש ב-<span class=\"math\">A<\/span>:<\/b> ‏<span class=\"math\">Rot(L)<\/span> היא שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1b","label":"2","kind":"open","rows":10,"prompt":"<p dir=\"auto\">עבור שפה <span class=\"math\">L<\/span> נגדיר:<\/p><div class=\"lang-def\">Mid(L) = {y | ∃x, z ∈ Σ<sup>*<\/sup> s.t. |x| = |z| and xyz ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו ע\"י שימוש ב-<span class=\"math\">A<\/span>:<\/b> אם <span class=\"math\">L<\/span> רגולרית אזי <span class=\"math\">Mid(L)<\/span> רגולרית.<\/p><p dir=\"auto\" class=\"small\"><b>רמז:<\/b> אילו זוגות מצבים <span class=\"math\">(p,q)<\/span> \"טובים\"? האם צריך לדעת לחשב אותם?<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">עבור שפה <span class=\"math\">L<\/span> נגדיר:<\/p><div class=\"lang-def\">Fold(L) = {x·y<sup>R<\/sup> | xy ∈ L and |x| = |y|}<\/div><p dir=\"auto\"><b>הוכיחו:<\/b> אם <span class=\"math\">L<\/span> רגולרית אזי <span class=\"math\">Fold(L)<\/span> חסרת הקשר — ע\"י בנייה של <span class=\"en\">PDA<\/span>‏ שמתבסס על ה-<span class=\"en\">DFA<\/span>‏ <span class=\"math\">A<\/span>.<\/p>","tags":{"subj":"pda","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M₁, M₂⟩ | M₁ and M₂ are TMs and L(M₁) ∩ L(M₂) ≠ ∅}<\/div>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 5 נקודות)","points":25,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>n<\/sup>b<sup>m<\/sup> | n &gt; 2m}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו ע\"י למת הניפוח לשפות רגולריות<\/b> ש-<span class=\"math\">L<\/span> איננה שפה רגולרית.<\/p>","tags":{"subj":"pump-reg","qt":"pumping"}},{"pid":"q3b","label":"2","kind":"open","rows":6,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {a<sup>i<\/sup>b<sup>j<\/sup>c<sup>k<\/sup> | j = i + k}<\/span>.<\/p><p dir=\"auto\"><b>בנו דקדוק חסר הקשר<\/b> לשפה <span class=\"math\">L<\/span>. הסבירו בקצרה.<\/p>","tags":{"subj":"cfg","qt":"construction"}},{"pid":"q3c","label":"3","kind":"open","rows":7,"prompt":"<p dir=\"auto\">יהי <span class=\"math\">G<\/span> הדקדוק: <span class=\"math\">S → SS | aSb | ε<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו<\/b> ש-<span class=\"math\">G<\/span> דקדוק <b>עמום<\/b> ע\"י הצגת מילה ושני עצי גזירה שלה.<\/p>","tags":{"subj":"cfg","qt":"proof"}},{"pid":"q3d","label":"4","kind":"open","rows":7,"prompt":"<p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> אם <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span> וגם <span class=\"math\">L₂ ≤<sub>m<\/sub> L₁<\/span> אזי <span class=\"math\">L₁ = L₂<\/span>.<\/p>","tags":{"subj":"reduction","qt":"claim"}},{"pid":"q3e","label":"5","kind":"open","rows":8,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {⟨M⟩ | M is a TM and L(M) ∩ PAL ≠ ∅}<\/span>.<\/p><p dir=\"auto\"><b>הוכיחו או הפריכו:<\/b> לפי משפט <span class=\"en\">Rice<\/span>‏ השפה <span class=\"math\">L<\/span> איננה כריעה.<\/p>","tags":{"subj":"rice","qt":"claim"}}]}],"solution":[{"ref":"q1a","html":"<div class=\"ltr-sol\">\n<p>A word of <span class=\"math\">Rot(L)<\/span> has the form <span class=\"math\">x·σ₁<\/span> where <span class=\"math\">σ₁x ∈ L<\/span>: the first letter <span class=\"math\">σ₁<\/span> moved to the end.<\/p>\n<p>For every <span class=\"math\">σ ∈ Σ<\/span> let <span class=\"math\">q_σ = δ(q_s, σ)<\/span> — the state reached after reading the (removed) first letter. Then <span class=\"math\">σx ∈ L<\/span> iff <span class=\"math\">x ∈ L<sup>A<\/sup><sub>q_σ,f<\/sub><\/span> for some <span class=\"math\">f ∈ F<\/span>. Therefore:<\/p>\n<div class=\"lang-def\">Rot(L) = ⋃<sub>σ∈Σ, f∈F<\/sub> L<sup>A<\/sup><sub>q_σ,f<\/sub> · {σ}<\/div>\n<p>Each <span class=\"math\">L<sup>A<\/sup><sub>q_σ,f<\/sub><\/span> is regular (adjust initial\/accepting states of <span class=\"math\">A<\/span>), <span class=\"math\">{σ}<\/span> is regular, and regular languages are closed under concatenation and finite union — so <span class=\"math\">Rot(L)<\/span> is regular.<\/p>\n<\/div>"},{"ref":"q1b","html":"<div class=\"ltr-sol\">\n<p>Call a pair of states <span class=\"math\">(p, q)<\/span> <b>good<\/b> if there exists <span class=\"math\">k ≥ 0<\/span> such that some word of length <span class=\"math\">k<\/span> leads from <span class=\"math\">q_s<\/span> to <span class=\"math\">p<\/span>, and some word of length <span class=\"math\">k<\/span> leads from <span class=\"math\">q<\/span> into <span class=\"math\">F<\/span>.<\/p>\n<p>Note that <span class=\"math\">y ∈ Mid(L)<\/span> iff there exists a good pair <span class=\"math\">(p,q)<\/span> with <span class=\"math\">y ∈ L<sup>A<\/sup><sub>p,q<\/sub><\/span>: the prefix <span class=\"math\">x<\/span> (of length <span class=\"math\">k<\/span>) takes <span class=\"math\">q_s<\/span> to <span class=\"math\">p<\/span>, then <span class=\"math\">y<\/span> takes <span class=\"math\">p<\/span> to <span class=\"math\">q<\/span>, then the suffix <span class=\"math\">z<\/span> (of the same length <span class=\"math\">k<\/span>) takes <span class=\"math\">q<\/span> into <span class=\"math\">F<\/span>.<\/p>\n<p>Therefore:<\/p>\n<div class=\"lang-def\">Mid(L) = ⋃<sub>(p,q) good<\/sub> L<sup>A<\/sup><sub>p,q<\/sub><\/div>\n<p>The set of good pairs is <b>some<\/b> subset of the finite set <span class=\"math\">Q × Q<\/span> — it exists even if we do not compute it (for regularity it suffices that an automaton <b>exists<\/b>). Each <span class=\"math\">L<sup>A<\/sup><sub>p,q<\/sub><\/span> is regular, and a finite union of regular languages is regular — so <span class=\"math\">Mid(L)<\/span> is regular.<\/p>\n<p class=\"small\">(One can in fact compute the good pairs: the sequence of set-pairs (states reachable from <span class=\"math\">q_s<\/span> in exactly <span class=\"math\">k<\/span> steps, states reaching <span class=\"math\">F<\/span> in exactly <span class=\"math\">k<\/span> steps) takes finitely many values, so the union over <span class=\"math\">k<\/span> stabilizes — but the existence argument already completes the proof.)<\/p>\n<\/div>"},{"ref":"q1c","html":"<div class=\"ltr-sol\">\n<p>Define PDA <span class=\"math\">P = (Q_P, Σ, Γ, δ_P, q_{sP}, F_P)<\/span>:<\/p>\n<p><span class=\"math\">Q_P = {q_{sP}, q_{acc}} ⊎ Q ⊎ (Q × F × Q)<\/span>,&nbsp; <span class=\"math\">Γ = Σ ⊎ {$}<\/span>,&nbsp; <span class=\"math\">F_P = {q_{acc}}<\/span>.<\/p>\n<p>A phase-2 state <span class=\"math\">(c, f, m)<\/span> carries: the current state <span class=\"math\">c<\/span> of a <b>backward<\/b> run of <span class=\"math\">A<\/span>, the guessed accepting state <span class=\"math\">f<\/span>, and the remembered midpoint <span class=\"math\">m<\/span>.<\/p>\n<ul>\n<li><span class=\"math\">δ_P(q_{sP}, ε, ε) = {(q_s, $)}<\/span> — push a bottom marker, start simulating <span class=\"math\">A<\/span>.<\/li>\n<li><b>Phase 1 (reading <span class=\"math\">x<\/span>):<\/b> for every transition <span class=\"math\">δ(p, σ) = q<\/span> of <span class=\"math\">A<\/span>: add <span class=\"math\">δ_P(p, σ, ε) = {(q, σ)}<\/span> — simulate <span class=\"math\">A<\/span> forward and <b>push every letter read<\/b>.<\/li>\n<li><b>Guess the midpoint:<\/b> for every <span class=\"math\">p ∈ Q<\/span> and every <span class=\"math\">f ∈ F<\/span>: add <span class=\"math\">δ_P(p, ε, ε) = {((f, f, p), ε)}<\/span> — remember the midpoint <span class=\"math\">p<\/span> and start a backward run at the guessed final state <span class=\"math\">f<\/span>.<\/li>\n<li><b>Phase 2 (reading <span class=\"math\">y<sup>R<\/sup><\/span>):<\/b> for every transition <span class=\"math\">δ(p′, σ) = q′<\/span> of <span class=\"math\">A<\/span>: add <span class=\"math\">δ_P((q′, f, m), σ, σ) = {((p′, f, m), ε)}<\/span> — each input letter undoes one <span class=\"math\">A<\/span>-transition, and pops one pushed letter (enforcing <span class=\"math\">|x| = |y|<\/span>).<\/li>\n<li><b>Accept:<\/b> for every <span class=\"math\">m ∈ Q, f ∈ F<\/span>: add <span class=\"math\">δ_P((m, f, m), ε, $) = {(q_{acc}, ε)}<\/span> — the backward run has returned exactly to the midpoint and the stack is empty.<\/li>\n<\/ul>\n<p><b>Why it works:<\/b> a word is accepted iff it can be split as <span class=\"math\">x·(y<sup>R<\/sup>)<\/span> such that <span class=\"math\">q_s →x→ m<\/span> (phase 1), and reading <span class=\"math\">y<sup>R<\/sup><\/span> backwards from some <span class=\"math\">f ∈ F<\/span> arrives at <span class=\"math\">m<\/span> — i.e. the forward run <span class=\"math\">m →y→ f<\/span> exists, so <span class=\"math\">xy ∈ L<\/span>; the stack discipline (push per letter of <span class=\"math\">x<\/span>, pop per letter of <span class=\"math\">y<sup>R<\/sup><\/span>, ‏<span class=\"math\">$<\/span> exposed exactly at the end) gives <span class=\"math\">|x| = |y|<\/span>. Hence <span class=\"math\">L(P) = Fold(L)<\/span> — context-free.<\/p>\n<\/div>"},{"ref":"q2a","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ R<\/span> — נובע מ-<span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2b","html":"<p dir=\"auto\"><span class=\"verdict v-true\">כן<\/span> ‏<span class=\"math\">L ∈ RE<\/span> — מזהה dovetailing שמחפש מילה משותפת (ראו ההוכחה המלאה).<\/p>"},{"ref":"q2c","html":"<p dir=\"auto\"><span class=\"verdict v-false\">לא<\/span> ‏<span class=\"math\">L ∉ coRE<\/span> — כי <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> ו-<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>.<\/p>"},{"ref":"q2d","html":"<div class=\"ltr-sol\">\n<p><b><span class=\"math\">L ∈ RE<\/span>:<\/b> we construct a recognizer <span class=\"math\">M_L<\/span>:<\/p>\n<pre>M_L: \"On input ⟨M₁, M₂⟩:\n1. For i from 0 to ∞:\n   1.1. For every x with |x| ≤ i, in lexicographical order:\n      1.1.1. Run M₁ on x for i steps.\n      1.1.2. Run M₂ on x for i steps.\n      1.1.3. If both accepted — accept.\"<\/pre>\n<p><b>Correctness:<\/b><\/p>\n<ul>\n<li><span class=\"math\">⟨M₁,M₂⟩ ∈ L<\/span>: there exists <span class=\"math\">x ∈ L(M₁) ∩ L(M₂)<\/span>; let <span class=\"math\">k₁, k₂<\/span> be the numbers of steps in which the machines accept it. At iteration <span class=\"math\">i = max{|x|, k₁, k₂}<\/span> both simulations discover the acceptance and <span class=\"math\">M_L<\/span> accepts. Every earlier iteration performs a finite amount of work (finitely many words, bounded simulations), so the iteration is reached after finitely many steps.<\/li>\n<li><span class=\"math\">⟨M₁,M₂⟩ ∉ L<\/span>: no word is accepted by both, so the condition in line 1.1.3 never holds and <span class=\"math\">M_L<\/span> never accepts (it runs forever).<\/li>\n<\/ul>\n<p><b><span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>:<\/b> we show <span class=\"math\">A<sub>TM<\/sub> ≤<sub>m<\/sub> L<\/span> (<span class=\"math\">A<sub>TM<\/sub> ∉ coRE<\/span>, therefore <span class=\"math\">L ∉ coRE<\/span> and <span class=\"math\">L ∉ R<\/span>):<\/p>\n<p><span class=\"math\">f(⟨M, w⟩) = ⟨N_{M,w}, T⟩<\/span> where:<\/p>\n<pre>T: \"On input x: Accept.\"\n\nN_{M,w}: \"On input x: Run M on w and do as M does.\"<\/pre>\n<p><b>Correctness:<\/b> note that <span class=\"math\">L(T) = Σ<sup>*<\/sup><\/span>.<\/p>\n<ul>\n<li><span class=\"math\">f<\/span> is a computable function: it only writes the (finite) encodings of the two machines, in finite time.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∈ A<sub>TM<\/sub><\/span>: <span class=\"math\">L(N_{M,w}) = Σ<sup>*<\/sup><\/span>, so <span class=\"math\">L(N) ∩ L(T) = Σ<sup>*<\/sup> ≠ ∅<\/span> — <span class=\"math\">f(⟨M,w⟩) ∈ L<\/span>.<\/li>\n<li><span class=\"math\">⟨M,w⟩ ∉ A<sub>TM<\/sub><\/span>: <span class=\"math\">L(N_{M,w}) = ∅<\/span>, so the intersection is empty — <span class=\"math\">f(⟨M,w⟩) ∉ L<\/span>.<\/li>\n<\/ul>\n<\/div>"},{"ref":"q3a","html":"<div class=\"ltr-sol\">\n<p>Assume towards contradiction that <span class=\"math\">L = {a<sup>n<\/sup>b<sup>m<\/sup> | n &gt; 2m}<\/span> is regular; let <span class=\"math\">n<\/span> be the promised constant.<\/p>\n<p>Choose <span class=\"math\">w = a<sup>2n+1<\/sup>b<sup>n<\/sup><\/span>: indeed <span class=\"math\">2n+1 &gt; 2n<\/span> so <span class=\"math\">w ∈ L<\/span>, and <span class=\"math\">|w| ≥ n<\/span>.<\/p>\n<p>For every division <span class=\"math\">w = xyz<\/span> with <span class=\"math\">|xy| ≤ n<\/span>, <span class=\"math\">|y| &gt; 0<\/span>: the first <span class=\"math\">n<\/span> letters are all <span class=\"math\">a<\/span>, so <span class=\"math\">y = a<sup>t<\/sup><\/span> with <span class=\"math\">t ≥ 1<\/span>.<\/p>\n<p>Choose <span class=\"math\">i = 0<\/span>: ‏<span class=\"math\">xy<sup>0<\/sup>z = a<sup>2n+1−t<\/sup>b<sup>n<\/sup><\/span>, and since <span class=\"math\">t ≥ 1<\/span>: ‏<span class=\"math\">2n+1−t ≤ 2n<\/span>, i.e. the condition <span class=\"math\">n_a &gt; 2n_b<\/span> fails — <span class=\"math\">xy<sup>0<\/sup>z ∉ L<\/span>, contradicting condition 3. Therefore <span class=\"math\">L<\/span> is not regular.<\/p>\n<\/div>"},{"ref":"q3b","html":"<div class=\"ltr-sol\">\n<p>Note that <span class=\"math\">j = i + k<\/span> means the word is <span class=\"math\">a<sup>i<\/sup>b<sup>i<\/sup>·b<sup>k<\/sup>c<sup>k<\/sup><\/span> — a concatenation of two matched blocks:<\/p>\n<div class=\"gram\">\n<div class=\"rule\"><span class=\"nt\">S<\/span> → <span class=\"nt\">X<\/span><span class=\"nt\">Y<\/span><\/div>\n<div class=\"rule\"><span class=\"nt\">X<\/span> → a<span class=\"nt\">X<\/span>b | ε<\/div>\n<div class=\"rule\"><span class=\"nt\">Y<\/span> → b<span class=\"nt\">Y<\/span>c | ε<\/div>\n<\/div>\n<p><span class=\"math\">X<\/span> generates <span class=\"math\">a<sup>i<\/sup>b<sup>i<\/sup><\/span>, ‏<span class=\"math\">Y<\/span> generates <span class=\"math\">b<sup>k<\/sup>c<sup>k<\/sup><\/span>; their concatenation gives exactly <span class=\"math\">a<sup>i<\/sup>b<sup>i+k<\/sup>c<sup>k<\/sup><\/span>.<\/p>\n<\/div>"},{"ref":"q3c","html":"<div class=\"ltr-sol\">\n<p><span class=\"math\">w = ab<\/span>, with two distinct parse trees:<\/p>\n<div class=\"cols2\">\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul><li>a<\/li><li><span class=\"nt\">S<\/span><ul><li>ε<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li><\/ul><\/div>\n<div class=\"deriv\"><ul><li><span class=\"nt\">S<\/span><ul>\n<li><span class=\"nt\">S<\/span><ul><li>a<\/li><li><span class=\"nt\">S<\/span><ul><li>ε<\/li><\/ul><\/li><li>b<\/li><\/ul><\/li>\n<li><span class=\"nt\">S<\/span><ul><li>ε<\/li><\/ul><\/li>\n<\/ul><\/li><\/ul><\/div>\n<\/div>\n<p>Left: ‏<span class=\"math\">S ⇒ aSb ⇒ ab<\/span>. Right: ‏<span class=\"math\">S ⇒ SS ⇒ aSbS ⇒ abS ⇒ ab<\/span>. Two different parse trees for the same word — <span class=\"math\">G<\/span> is ambiguous.<\/p>\n<\/div>"},{"ref":"q3d","html":"<div class=\"ltr-sol\">\n<p><b>False.<\/b> Counter example:<\/p>\n<p><span class=\"math\">L₁ = {w | |w| is even}<\/span>, ‏<span class=\"math\">L₂ = {w | |w| is odd}<\/span> — both decidable, and <span class=\"math\">L₁ ≠ L₂<\/span> (in fact disjoint).<\/p>\n<p><span class=\"math\">f(w) = 1w<\/span> is computable and flips parity, so it is simultaneously a mapping reduction <span class=\"math\">L₁ ≤<sub>m<\/sub> L₂<\/span> (‏<span class=\"math\">|w|<\/span> even ⟺ <span class=\"math\">|1w|<\/span> odd) and <span class=\"math\">L₂ ≤<sub>m<\/sub> L₁<\/span>.<\/p>\n<p>Mutual reducibility means \"equally hard\" — not equality of the languages.<\/p>\n<\/div>"},{"ref":"q3e","html":"<div class=\"ltr-sol\">\n<p><b>True.<\/b> Define:<\/p>\n<div class=\"lang-def\">C = {L′ ∈ RE | L′ ∩ PAL ≠ ∅}<\/div>\n<p>Then <span class=\"math\">L = L_C = {⟨M⟩ | L(M) ∈ C}<\/span> — the condition depends only on <span class=\"math\">L(M)<\/span> (a semantic property).<\/p>\n<ul>\n<li><span class=\"math\">C ⊆ RE<\/span>: by definition.<\/li>\n<li><span class=\"math\">C ≠ ∅<\/span>: ‏<span class=\"math\">Σ<sup>*<\/sup> ∈ RE<\/span> and <span class=\"math\">Σ<sup>*<\/sup> ∩ PAL ≠ ∅<\/span> (e.g. <span class=\"math\">ε ∈ PAL<\/span>), so <span class=\"math\">Σ<sup>*<\/sup> ∈ C<\/span>.<\/li>\n<li><span class=\"math\">C ≠ RE<\/span>: ‏<span class=\"math\">∅ ∈ RE<\/span> and <span class=\"math\">∅ ∩ PAL = ∅<\/span>, so <span class=\"math\">∅ ∉ C<\/span>.<\/li>\n<\/ul>\n<p>The property is semantic and non-trivial, so by Rice's theorem <span class=\"math\">L ∉ R<\/span> — the claim is true.<\/p>\n<\/div>"}]},{"id":"ai2","year":2026,"moed":"AI","label":"מבחן תרגול AI 2","lang":"he","combined":false,"meta":{"date":"","duration":"3 שעות","staff":"נוצר על ידי AI — במתכונת מבחני 2023–2024 של ד\"ר רעות לוי","totalPoints":100,"note":"מבחן תרגול שני. שימו לב: הפרופיל של שאלה 2 כאן שונה משל מבחן תרגול 1 — כדאי לפתור את שניהם."},"questions":[{"n":"1","heading":"שאלה 1 (7, 14, 14 נקודות)","points":35,"intro":"<p dir=\"auto\">עבור מילה <span class=\"math\">w = σ₁σ₂…σ<sub>n<\/sub><\/span> נגדיר <span class=\"math\">stut(w) = σ₁σ₁σ₂σ₂…σ<sub>n<\/sub>σ<sub>n<\/sub><\/span> (הכפלת כל אות), ועבור שפה: <span class=\"math\">stut(L) = {stut(w) | w ∈ L}<\/span>.<\/p>","parts":[{"pid":"q1a","label":"1","kind":"open","rows":6,"prompt":"<p dir=\"auto\"><b>הוכיחו ע\"י שימוש בסגירויות:<\/b> אם <span class=\"math\">L<\/span> שפה רגולרית אזי <span class=\"math\">stut(L)<\/span> שפה רגולרית.<\/p>","tags":{"subj":"closure","qt":"proof"}},{"pid":"q1b","label":"2","kind":"open","rows":8,"prompt":"<p dir=\"auto\">בהינתן <span class=\"en\">DFA<\/span>‏ <span class=\"math\">A = (Q, Σ, δ_A, q<sub>s<\/sub>, F)<\/span> עבור שפה <span class=\"math\">L<\/span>.<\/p><p dir=\"auto\"><b>בנו <span class=\"en\">DFA<\/span>‏<\/b> <span class=\"math\">B = (Q, Σ, δ_B, q<sub>s<\/sub>, F)<\/span> כך ש-<span class=\"math\">L(B) = {w | stut(w) ∈ L}<\/span>.<\/p><p dir=\"auto\">כלומר, עליכם לשנות רק את <span class=\"math\">δ_A<\/span> ל-<span class=\"math\">δ_B<\/span>. הראו את הבנייה יחד עם הסבר. אין צורך בהוכחת נכונות.<\/p>","tags":{"subj":"automata","qt":"construction"}},{"pid":"q1c","label":"3","kind":"open","rows":10,"prompt":"<p dir=\"auto\">עבור שפה <span class=\"math\">L<\/span> נגדיר:<\/p><div class=\"lang-def\">Half(L) = {x | ∃y ∈ Σ<sup>*<\/sup> s.t. |y| = |x| and xy ∈ L}<\/div><p dir=\"auto\"><b>הוכיחו ע\"י שימוש ב-<span class=\"math\">A<\/span>:<\/b> אם <span class=\"math\">L<\/span> רגולרית אזי <span class=\"math\">Half(L)<\/span> רגולרית — ע\"י בניית אוטומט מפורש.<\/p>","tags":{"subj":"closure","qt":"construction"}}]},{"n":"2","heading":"שאלה 2 (40 נקודות)","points":40,"intro":"<p dir=\"auto\">תהי,<\/p><div class=\"lang-def\">L = {⟨M, k⟩ | M is a TM, k ∈ ℕ and |L(M)| ≤ k}<\/div><p dir=\"auto\">(כלומר: <span class=\"math\">M<\/span> מקבלת לכל היותר <span class=\"math\">k<\/span> מילים שונות.)<\/p>","parts":[{"pid":"q2a","label":"1","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ R<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2b","label":"2","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ RE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2c","label":"3","kind":"mc","rows":2,"choices":["כן","לא"],"prompt":"<p dir=\"auto\">האם <span class=\"math\">L ∈ coRE<\/span>?<\/p>","tags":{"subj":"r-re-core","qt":"r-re-core"}},{"pid":"q2d","label":"הוכחה","kind":"open","rows":18,"prompt":"<p dir=\"auto\">הוכיחו את תשובתכם <b>לכל<\/b> הסעיפים (1 עד 3).<\/p>","tags":{"subj":"r-re-core","qt":"proof"}}]},{"n":"3","heading":"שאלה 3 (5 × 5 נקודות)","points":25,"intro":"","parts":[{"pid":"q3a","label":"1","kind":"open","rows":9,"prompt":"<p dir=\"auto\">תהי <span class=\"math\">L = {w ∈ {0,1}<sup>*
