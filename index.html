<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכות הפעלה — מרכז הכנה למבחן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Base / RTL ===== */
:root{
  --brand:#0d6386; --brand-dk:#074b68; --brand-lt:#dcecf5; --brand-pale:#f2f8fb;
  --ink:#1b2126; --ink-2:#4d5862; --line:#d5dde3; --line-2:#e7edf1;
  --bg:#eef1f4; --card:#ffffff;
  --ok:#1f7a45; --ok-bg:#e2f3e8; --ok-line:#9ed3b4;
  --warn:#8a6100; --warn-bg:#fff4d9; --warn-line:#e4c268;
  --err:#a32626; --err-bg:#fbe6e6; --err-line:#e2a3a3;
  --shadow:0 1px 2px rgba(16,32,45,.06),0 6px 18px rgba(16,32,45,.07);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:"Heebo","Assistant","Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  color:var(--ink);line-height:1.55;font-size:15.5px;
  -webkit-font-smoothing:antialiased;
}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
code{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:ui-monospace,Consolas,Monaco,"Courier New",monospace;
  background:#eef1f4;border:1px solid #dbe1e6;border-radius:5px;padding:0 5px;font-size:.9em}
pre{direction:ltr;text-align:left;unicode-bidi:isolate;overflow:auto;background:#151a1e;color:#f2f5f7;
  padding:13px 16px;border-radius:8px;line-height:1.45;font-family:ui-monospace,Consolas,Monaco,"Courier New",monospace;
  font-size:.88rem;margin:11px 0 15px;white-space:pre}
pre code{background:none;border:0;padding:0;color:inherit;display:inline}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;color:var(--brand-dk)}

/* ===== Shell ===== */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(16,32,45,.03)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.06rem;color:var(--brand-dk);white-space:nowrap}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--brand);flex:none}
.topbar .grow{flex:1 1 auto;min-width:120px}
.search{position:relative;flex:0 1 300px}
.search input{width:100%;padding:8px 34px 8px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font:inherit}
.search input:focus{outline:2px solid var(--brand-lt);border-color:var(--brand)}
.search .ico{position:absolute;inset-inline-end:11px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.mini-prog{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);white-space:nowrap}
.mini-bar{width:110px;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#39a0c4);border-radius:99px;transition:width .35s}

.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:11px 15px;cursor:pointer;font-weight:650;color:var(--ink-2);
  border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.tab:hover{color:var(--brand)}
.tab[aria-selected="true"]{color:var(--brand-dk);border-bottom-color:var(--brand)}
.tab .badge{display:inline-block;margin-inline-start:6px;background:var(--line-2);color:var(--ink-2);
  border-radius:99px;padding:1px 7px;font-size:.75rem;font-weight:700;direction:ltr;unicode-bidi:isolate}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.view{display:none}
.view.on{display:block}

h2.sec{font-size:1.3rem;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:4px}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

.sum-card{padding:15px 16px;display:flex;flex-direction:column;gap:11px}
.sum-card h3{margin:0;font-size:1.02rem;line-height:1.35}
.sum-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}
.pill{display:inline-block;background:var(--brand-pale);color:var(--brand-dk);border:1px solid var(--brand-lt);
  border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:700}
.pill.g{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.pill.w{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.pill.e{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
.pill.n{background:var(--line-2);border-color:var(--line);color:var(--ink-2)}
.sum-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}

/* checkbox */
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:.9rem;font-weight:650;
  border:1px solid var(--line);border-radius:99px;padding:5px 11px;background:#fff;transition:.15s}
.chk:hover{border-color:var(--brand);background:var(--brand-pale)}
.chk input{position:absolute;opacity:0;width:0;height:0}
.chk .box{width:17px;height:17px;border:2px solid #b8c3cc;border-radius:5px;flex:none;position:relative;transition:.15s}
.chk .box::after{content:"";position:absolute;inset-inline-start:4.5px;top:1px;width:4px;height:9px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:.15s}
.chk input:checked + .box{background:var(--ok);border-color:var(--ok)}
.chk input:checked + .box::after{transform:rotate(45deg) scale(1)}
.chk input:focus-visible + .box{outline:2px solid var(--brand);outline-offset:2px}
.chk.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--brand);background:var(--brand);color:#fff;
  border-radius:9px;padding:7px 14px;font-weight:700;font-size:.92rem;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--brand-dk);border-color:var(--brand-dk)}
.btn.ghost{background:#fff;color:var(--brand-dk);border-color:var(--line)}
.btn.ghost:hover{background:var(--brand-pale);border-color:var(--brand)}
.btn.sm{padding:5px 11px;font-size:.86rem}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.ok:hover{filter:brightness(.92)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Status indicator for sync */
.sync-status { font-size: 0.8rem; padding: 2px 8px; border-radius: 12px; margin-inline-start: 10px; font-weight: 500; }
.sync-status.syncing { background: var(--warn-bg); color: var(--warn); }
.sync-status.ready { background: var(--ok-bg); color: var(--ok); }
.sync-status.error { background: var(--err-bg); color: var(--err); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot"></span>מערכות הפעלה — מרכז הכנה למבחן</div>
    <div id="sync-indicator" class="sync-status ready">מסונכרן לענן</div>
    <div class="search">
      <input id="q" type="search" placeholder="חיפוש בכל החומר…" autocomplete="off" dir="auto">
      <span class="ico">⌕</span>
      <div class="card" id="sres" hidden
           style="position:absolute;top:calc(100% + 7px);inset-inline-start:0;width:min(560px,86vw);
                  max-height:60vh;overflow:auto;z-index:60"></div>
    </div>
    <div class="grow"></div>
    <div class="mini-prog">
      <span>התקדמות</span>
      <span class="mini-bar" id="mini-bar"><i style="width:0%"></i></span>
      <b id="mini-pct" class="num">0%</b>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main class="wrap"><div id="app">סנכרון נתונים מהענן...</div></main>
<div class="ov" id="ov" hidden></div>

<script type="application/json" id="d-summaries">[{"sid":"ch1","group":"הרצאות","num":1,"title":"פרק 1 — מבוא, היסטוריה ומושגי יסוד","topics":["מהי מערכת הפעלה ומה נלמד בקורס","המחשבים הראשונים — Bombe ו־ENIAC (דור ראשון, 1945–1955)","הדור השני — Transistor Computers ו־Batch Processing (1955–1965)","GM I/O Monitor — מערכת ההפעלה הראשונה (1954–1955)","הדור השלישי — SPOOL, Multi-Programming ו־Time Sharing (1965–1980)","מונחי יסוד ומדדי ביצועים (Terminology)","מבנה המחשב — Motherboard, Bus ובקרים","Hardware Interrupt — פסיקת חומרה","מה קורה כאשר מחשב מודרני עולה?","OS Abstractions — ההפשטות של מערכת ההפעלה","Process Address Space — מבנה הזיכרון של תהליך","Threads — החוט של התהליך","Concurrency לעומת Parallelism","Context Switch ותזמון (Time Sharing)","Time Accounting — מדדי זמן ונוסחאות","תרגילי Time Accounting — פתרונות מלאים"]}]</script>

<script>
// =============== CONFIGURATION ===============
const JSONBIN_ID = '6a68b0e0da38895dfe9b8684'; //[cite: 1]
const JSONBIN_KEY = '$2a$10$Qt2pYgSMymWcLzuR.vbRbO3mvUCpaQGwf66zaYywNS4duJ.meRAgm';// =============================================

let state = {
  doneTopics: {},
  notes: ""
};

function updateSyncStatus(text, type) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  el.textContent = text;
  el.className = `sync-status ${type}`;
}

async function loadProgressFromCloud() {
  updateSyncStatus('טוען נתונים...', 'syncing');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    
    if (!res.ok) throw new Error('Cloud read error');
    
    const data = await res.json();
    const cloudRecord = data.record;

    // Check if cloud has valid state or placeholder
    if (cloudRecord && typeof cloudRecord === 'object' && cloudRecord.doneTopics) {
      state = cloudRecord;
    } else {
      // First time initialization if placeholder was present
      await saveProgressToCloud();
    }
    
    updateSyncStatus('מסונכרן לענן', 'ready');
  } catch (err) {
    console.error("Error loading progress:", err);
    updateSyncStatus('שגיאת סנכרון', 'error');
    // Fallback to local storage if offline
    const local = localStorage.getItem('os_prep_state');
    if (local) state = JSON.parse(local);
  }
  renderApp();
}

async function saveProgressToCloud() {
  updateSyncStatus('שומר...', 'syncing');
  localStorage.setItem('os_prep_state', JSON.stringify(state)); // Backup locally
  
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify(state)
    });
    
    if (!res.ok) throw new Error('Cloud save error');
    updateSyncStatus('מסונכרן לענן', 'ready');
  } catch (err) {
    console.error("Error saving progress:", err);
    updateSyncStatus('שגיאה בשמירה', 'error');
  }
}

function toggleTopic(topicKey) {
  state.doneTopics[topicKey] = !state.doneTopics[topicKey];
  saveProgressToCloud();
  renderApp();
}

function renderApp() {
  const summaries = JSON.parse(document.getElementById('d-summaries').textContent);
  let totalTopics = 0;
  let completedTopics = 0;

  summaries.forEach(s => {
    s.topics.forEach((t, idx) => {
      totalTopics++;
      if (state.doneTopics[`${s.sid}_${idx}`]) completedTopics++;
    });
  });

  const pct = totalTopics > 0 ? Math.round((completedTopics / totalTopics) * 100) : 0;
  document.getElementById('mini-bar').querySelector('i').style.width = `${pct}%`;
  document.getElementById('mini-pct').textContent = `${pct}%`;

  let html = `<h2 class="sec">התקדמות למידה</h2><div class="grid g3">`;

  summaries.forEach(s => {
    html += `<div class="card sum-card">
      <h3>${s.title}</h3>
      <div class="sum-meta"><span class="pill">${s.topics.length} נושאים</span></div>
      <div style="margin-top:10px">`;

    s.topics.forEach((t, idx) => {
      const k = `${s.sid}_${idx}`;
      const isDone = !!state.doneTopics[k];
      html += `
        <div style="margin: 4px 0;">
          <label class="chk ${isDone ? 'done' : ''}">
            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTopic('${k}')">
            <span class="box"></span>
            <span>${t}</span>
          </label>
        </div>`;
    });

    html += `</div></div>`;
  });

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

window.onload = loadProgressFromCloud;
</script>
</body>
</html>
